# 数学知识路线图 (V9.1 知识点版) - Level 4 完整结构
# 绝对索引区间: n390 - n479

roadmap_version: "9.1.0"
target_layer: "Level_4"

nodes:
  # ==========================================
  # 【Mode A 专属管线：计算与机械映射】
  # ==========================================
  - id: "n390"
    domain: "复变函数 (Complex Analysis)"
    processing_mode: "Mode_A"
    sub_topics:
      - "n390.1: C-R方程的直角坐标与极坐标形式计算"
      - "n390.2: 调和共轭的偏微分求解"

  - id: "n395"
    domain: "常微分方程 (ODE)"
    processing_mode: "Mode_A"
    sub_topics:
      - "n395.1: 特征方程的实根与复根分类求解"
      - "n395.2: Laplace 变换与逆变换"

  - id: "n405"
    domain: "抽象代数-计算分支 (Abstract Algebra)"
    processing_mode: "Mode_A"
    sub_topics:
      - "n405.1: 循环群的生成元与子群阶数计算"
      - "n405.2: 对称群 S_n 的不交循环分解与奇偶性判定"

  - id: "n415"
    domain: "数论 (Number Theory)"
    processing_mode: "Mode_A"
    sub_topics:
      - "n415.1: 线性同余方程组求解 (CRT)"
      - "n415.2: 二次剩余与勒让德符号"

  # ==========================================
  # 【Mode B 专属管线：纯数与高阶抽象映射】
  # 警告：Mode A 特工严禁触碰以下节点！
  # ==========================================
  - id: "n430"
    domain: "实分析与测度论 (Real Analysis)"
    processing_mode: "Mode_B"
    sub_topics:
      - "n430.1: 勒贝格测度的可加性推导"
      - "n430.2: 控制收敛定理与单调收敛定理"

  - id: "n450"
    domain: "点集拓扑 (Topology)"
    processing_mode: "Mode_B"
    sub_topics:
      - "n450.1: 开集、闭集与极限点的拓扑定义"
      - "n450.2: 紧致性与连通性的高阶证明"

  - id: "n470"
    domain: "微分几何 (Differential Geometry)"
    processing_mode: "Mode_B"
    sub_topics:
      - "n470.1: 流形上的微分形式与外微分"
      - "n470.2: 斯托克斯定理的广义推广 (n479 终点)"
