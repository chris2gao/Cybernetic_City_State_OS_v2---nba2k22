version: '3.8'

services:
  apicurio-registry:
    image: quay.io/apicurio/apicurio-registry-mem:2.4.4.Final
    ports:
      - "8080:8080"
    environment:
      - QUARKUS_PROFILE=prod
    # 本地 A2A 协议注册中心，监听 8080 端口。
    # 所有特工上线必须通过 HTTP 提交自己的 AGENT_CARD_TEMPLATE.json。
    # a2a-protocol-validator 拦截器将在网关层生效。
