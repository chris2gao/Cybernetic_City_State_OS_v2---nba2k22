# A2A Protocol Validator (拦截器配置伪代码/设计逻辑)

interceptor:
  name: "hardware-tier-verifier"
  target_port: 8080
  
  rules:
    - rule_name: "Require High Tier for Deep Reasoning"
      condition: "request.body.capabilities contains 'deep_reasoning' OR request.body.capabilities contains 'system_backbone_override'"
      validation:
        - assert: "request.body.hardware_tier in ['Pro_Tier', 'Opus_Tier']"
          error_msg: "HTTP 403 Forbidden: Insufficient Hardware Tier for requested capabilities."
        - assert: "verify_signature(request.body.verifiable_credentials.signature, public_key)"
          error_msg: "HTTP 403 Forbidden: Invalid Cryptographic Signature. Collusion attempt blocked."

    - rule_name: "Prevent SVO Global Execution Power"
      condition: "request.body.agent_role == 'Sandbox_Verification_Officer'"
      validation:
        - assert: "NOT request.body.capabilities contains 'global_system_execution'"
          error_msg: "HTTP 403 Forbidden: SVO is deprived of global write/execution rights. Only 'isolated_sandbox_execution' is permitted."
