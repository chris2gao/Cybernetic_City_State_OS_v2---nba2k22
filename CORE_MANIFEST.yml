# City-State core ownership manifest
#
# Authority: descriptive + mechanically checkable. This file grants no
# permission; it declares which paths belong to the shared core so that drift
# between core and any domain repository can be DETECTED rather than discovered
# by accident during an upgrade.
#
# The rule this manifest exists to enforce:
#   core-owned paths are authored in the core repository ONLY.
#   A domain repository consumes them by merging from core and never edits them
#   locally. A domain that needs a core change files it upstream first.
#
# Why it matters: before this file existed, "what counts as core" was tribal
# knowledge, so an upgrade was a manual copy with no way to tell what had been
# missed or what a domain had quietly changed.
#
# Machine consumer: 08_os/03_mechanisms/context_management/实现/verify_context_structure.py
# reads `core_owned_paths` and `domain_owned_paths` by name, requires the active
# 08_os entries to appear in the first and 08_os/07_content/ in the second, and
# reports any prefix overlap between the two lists. Keep both key names and those
# entries when editing. The domain run root now lives under 08_os/07_content/_runs/
# and must not be listed separately - that would be the overlap the check catches.

schema_version: "citystate.core_manifest.v1"
core_repository: "git@github.com:chris2gao/Cybernetic_City_State_OS_v2---core.git"
core_release: "unversioned_pre_release"

# Ownership is not activity. This manifest says who may author a path, never that
# the path is part of the running system. The core list below is in two groups:
#
#   1. retained global surface - everything core owns outside 08_os/**
#   2. active OS - 08_os/**, the only active OS in this repository
#
# The third group, "legacy pending retirement", is gone because the legacy tree is
# gone. It held the first-generation bootstrap, protocol, mailbox, parliament,
# compiler and backbone paths, and it existed so that a domain would not edit them
# while they were still present. They are no longer present.
transition_status:
  active_os: "08_os/**"
  legacy_retirement: completed
  retired_on: 2026-08-10
  retired_by: 08_os/_runs/run-20260810-旧OS物理删除-001
  authority: >-
    08_os/_runs/run-20260810-旧OS退役前迁移与最终白名单-001/03_最终清单/最终直接删除清单_v1.yml,
    blob 162f59cbd101cbfa8a725981f835762ae829aafe, 490 tracked files, independently
    reviewed before the deletion ran.
  deletion_state: >-
    490 tracked files outside 08_os/** were deleted. What survives outside 08_os/**
    is exactly the fifteen files in group 1 below - that equality was proven against
    the whitelist rather than assumed. Nothing under 08_os/** was deleted, and no
    history was rewritten: the retired content stays reachable in this repository's
    history, which is what makes deleting it recoverable at all.
  not_done_here: >-
    The eventual move of 08_os/** to the repository root. Nine of the fifteen
    surviving files name current 08_os/ paths and will need rewriting when it
    happens; that is a separate task and this file does not anticipate it.

# Paths owned by core. Domain repositories treat these as read-only.
#
# 01_Research_Reports and 02_Protocols were listed here in the first draft. That
# was wrong and the first real content drop proved it: every domain builds its
# own chain - 01 holds that domain's research, which produces its 02 protocols
# and 03 execution principles. Those are per-domain, not core property. They now
# sit under domain_owned_paths.
core_owned_paths:
  # --- 1. retained global surface -------------------------------------------
  # This is the whole of what survives outside 08_os/** after the legacy tree is
  # retired. Everything here is core-authored: a domain consumes it by merging.
  - "AGENTS.md"
  - "AGENT_WORKING_DISCIPLINE.md"
  - "CLAUDE.md"
  - "GEMINI.md"
  - "README.md"
  - "CORE_MANIFEST.yml"
  - ".gitignore"
  - ".gitattributes"
  # The only sanctioned way to create a domain. A folder copy carries core's
  # remotes, which is how a stray push writes into the wrong repository.
  - "new-domain.ps1"
  # Tool-loaded permission file. Core-owned for the same reason .githooks/ is: a
  # domain able to widen its own deny rules widens a boundary the whole family
  # relies on, and nothing in the repository references it, so drift here is
  # invisible unless ownership is declared.
  - ".claude/settings.json"
  # The push guard is core-owned for the same reason core history is never
  # rewritten: the rule it enforces is shared. A domain that could edit its own
  # copy could weaken its own guard, and the damage from a rewrite lands on every
  # domain at once rather than only on the one that did it. Note that the hook
  # files travel with a merge but `core.hooksPath` is local config and does not,
  # so each clone still has to enable it once - see .githooks/README.md.
  - ".githooks/"

  # --- 2. active OS ----------------------------------------------------------
  # Second-generation OS machinery is shared core. Its _runs root retains
  # durable development, research, migration and validation evidence for the
  # shared OS itself; domain business run traffic is excluded below.
  - "08_os/README.md"
  - "08_os/01_workflow/"
  - "08_os/02_boot/"
  - "08_os/03_mechanisms/"
  - "08_os/04_skills_and_tools/"
  - "08_os/05_registry/"
  - "08_os/06_execution/"
  - "08_os/_dev/"
  - "08_os/_runs/"
  - "08_os/claude与人类的开发对话日志.md"
  # The entry every new working window reads. It governs gates shared by the whole
  # fork family, so a domain must not be able to edit its own copy. Publication
  # authority moved to 08_os/05_registry/repository_publisher_authority_v1.yml on
  # 2026-08-10 and is already covered by the 05_registry/ entry above.
  - "08_os/开发入口与单窗口任务规范_v1.md"

  # The legacy group that stood here until 2026-08-10 is removed, because every
  # path it named has been deleted from the tracked tree. It listed the
  # first-generation bootstrap and index directories - 00_City_State_Routing_Table.md,
  # 04_Parliament/, 05_Carbon_Index/, 06_Silicon_Index/, 07_Compiler/,
  # 07_Silicon_Private_Zones/, system_backbone/ - the root plan and description
  # documents, PROJECT_CONTEXT.md and ARCHITECTURE.md, and the whole .ai/
  # communication plane including the publisher authority that moved into
  # 08_os/05_registry/ first. An entry leaves this file in the same change that
  # deletes the path it names; that is what happened, and the deletion receipt is
  # 08_os/_runs/run-20260810-旧OS物理删除-001/03_删除结果/删除回执_v1.yml.
  #
  # Four other entries were removed on the same day for a different reason: they
  # named paths that did not exist at all - 07_Execution_Plans/, 0号方案.md,
  # 1号方案.md, 2号方案.md. That was a false line being deleted, not a file.

# Paths every domain owns for itself. Each domain repository fills them with its
# own material, so a core merge must not touch them.
#
# 01 -> 02 -> 03 -> 08 is one chain, owned end to end by the domain: research
# produces protocols, protocols produce execution principles, those produce the
# system. Splitting the chain across the core/domain boundary would have made
# every domain fight core for its own reasoning.
#
# Settled 2026-08-10 by Human decision: README.md is core-owned - it is the entry
# that declares which OS is active, and a domain that could rewrite it could
# contradict core about that. PROJECT_CONTEXT.md was neither core's nor a domain's
# to keep and has been deleted.
#
# As of 2026-08-10 core ships nothing at any path in this list. That was not true
# earlier the same day - 25 files under 01_Research_Reports/ were still physically
# tracked - and this file said so at the time. The deletion has now run, so the
# plain statement is finally accurate rather than aspirational.
domain_owned_paths:
  - "01_Research_Reports/"
  - "02_Protocols/"
  - "03_Daily_Execution/"
  - "08_Domain_Applications/"
  # Domain-specific content and domain workflow run traffic stay with each
  # domain. The domain run root moved from .ai/PROGRAM_RUNS/ to
  # 08_os/07_content/_runs/ on 2026-08-10, so it is now covered by the entry
  # below rather than listed separately: a separate line would be a prefix
  # overlap and the ownership check would report it. It holds no tracked file in
  # core by design.
  - "08_os/07_content/"
  # The old communication-plane domain paths - .ai/TASKS/, .ai/CODEX_REPORTS/,
  # .ai/HUMAN_BRIEFS/, .ai/USER_UPLOADS/, .ai/STATE.yml, .ai/INBOX.md,
  # .ai/OUTBOX.md and .ai/HUMAN_BRIEF.md - were listed here until 2026-08-10 and
  # are removed with the files. Domain run traffic now lives under
  # 08_os/07_content/_runs/, which the entry above already covers.

# Mechanics a domain repository follows. Recorded here so the procedure lives
# with the manifest instead of in someone's memory.
domain_merge_procedure:
  # Read this before the steps below. The steps describe how a merge works, not
  # whether one is due.
  currently_frozen: >-
    HOLD as of 2026-08-02, by Human decision. No domain repository content is to
    be touched - not merged into, not edited, not migrated - while the new OS is
    still being built in core. Everything below stays true as procedure and is
    simply not to be run yet.

    The reason is that core is changing underneath the thing a merge would be
    carrying. The publication transport matrix, the publisher authority file and
    the push guard all moved this week, and the guard's own decision table
    changed on 2026-08-02. A domain that merged mid-flight would take a snapshot
    of half-finished rules, and the next merge would have to reconcile a divergence
    that only exists because the first merge happened too early. Waiting costs
    nothing: core history is never rewritten, so every commit a domain skips now
    is still reachable and mergeable later.

    This hold is lifted by an explicit Human instruction, recorded here. Do not
    infer that it has expired because core looks stable, because a task would be
    easier with the merge, or because a core change is described as urgent - a
    guard fix included. Core-owned files reaching domains late is the expected
    state during the freeze, not a problem to route around.
  first_time_only: >-
    git merge -s ours core/master
    records ancestry WITHOUT taking core's tree. Required exactly once per
    domain, because core's initial commit removes domain content; a plain merge
    would propagate that deletion and wipe the domain. Measured on the math
    domain: a naive merge proposed 1132 files and 204156 deletions. After the
    ours-merge the merge base sits past that commit and ordinary merges are safe.
  every_upgrade_after: >-
    git fetch core && git merge core/master
    is a real three-way merge. A conflict means the domain edited a core-owned
    path, and that is the finding itself: resolve it by moving the change
    upstream, not by keeping the local edit.
  never: >-
    Do not rewrite core history. Every domain's common ancestor depends on it;
    one rewrite breaks mergeability for all domains at once.

# How a NEW domain repository comes into existence. Recorded here because the
# script existed for weeks with nothing in the repository pointing at it, so the
# only place the procedure lived was one person's notes.
domain_creation:
  use: >-
    new-domain.ps1 at the core repository root. Example: .\new-domain.ps1 -Name finance
  never: >-
    Do not create a domain by copying the core FOLDER. A folder copy carries
    core's remotes, so the new domain keeps pointing at core and at every other
    domain remote core happens to have; one stray `git push` then writes into the
    wrong repository. The script clones instead, which carries only `origin`, and
    renames that to `core` before adding the domain's own `origin`.
  note: >-
    A fresh domain does NOT need the `merge -s ours` step described under
    domain_merge_procedure.first_time_only. That step existed only because the
    math domain already held content that core's first commit deletes. A new
    domain starts at core's current state, so ordinary `git merge core/master`
    is correct from day one.

verification:
  - "no domain edits inside core_owned_paths"
  - "core merge completes without conflict, or every conflict is reported"
  - "domain tests and audits pass after the merge, before it is pushed"
  - "every path listed in this file resolves in the tracked tree, except domain_owned_paths that core deliberately ships empty"
