# City-State core ownership manifest
#
# Authority: descriptive + mechanically checkable. This file grants no
# permission; it declares which paths belong to the shared core so that drift
# between core and any domain repository can be DETECTED rather than discovered
# by accident during an upgrade.
#
# The rule this manifest exists to enforce:
#   core-owned paths are authored in the core repository ONLY.
#   A domain repository consumes them by merging from core and never edits them
#   locally. A domain that needs a core change files it upstream first.
#
# Why it matters: before this file existed, "what counts as core" was tribal
# knowledge, so an upgrade was a manual copy with no way to tell what had been
# missed or what a domain had quietly changed.

schema_version: "citystate.core_manifest.v1"
core_repository: "git@github.com:chris2gao/Cybernetic_City_State_OS_v2---core.git"
core_release: "unversioned_pre_release"

# Paths owned by core. Domain repositories treat these as read-only.
#
# 01_Research_Reports and 02_Protocols were listed here in the first draft. That
# was wrong and the first real content drop proved it: every domain builds its
# own chain - 01 holds that domain's research, which produces its 02 protocols
# and 03 execution principles, which produce the 08 system. Those are per-domain,
# not core property. They now sit under domain_owned_paths.
#
# 06_Silicon_Index deliberately STAYS here. It is the shared bootstrap every
# city-state instance starts from, so it is common by nature. Domain-specific
# initialisation does not belong here either: each domain's agent will derive its
# own and place it under 08_Domain_Applications.
core_owned_paths:
  - "00_City_State_Routing_Table.md"
  - "04_Parliament/"
  - "05_Carbon_Index/"
  - "06_Silicon_Index/"
  - "07_Compiler/"
  - "07_Execution_Plans/"
  - "07_Silicon_Private_Zones/"
  # Second-generation OS machinery is shared core. Its _runs root retains
  # durable development, research, migration and validation evidence for the
  # shared OS itself; domain business run traffic is excluded below.
  - "08_os/README.md"
  - "08_os/01_workflow/"
  - "08_os/02_boot/"
  - "08_os/03_mechanisms/"
  - "08_os/04_skills_and_tools/"
  - "08_os/05_registry/"
  - "08_os/06_execution/"
  - "08_os/_dev/"
  - "08_os/_runs/"
  - "08_os/claude与人类的开发对话日志.md"
  - "system_backbone/"
  - "0号方案.md"
  - "1号方案.md"
  - "2号方案.md"
  - "3号方案.md"
  - "AGENTS.md"
  - "ARCHITECTURE.md"
  - "CLAUDE.md"
  - "INSTANCE_CONFIG.md"
  - "True_Fork_Protocol.md"
  - "城邦系统需要实现的目标原则.md"
  - ".ai/PROTOCOL.md"
  - ".ai/PROTOCOL_ADHERENCE.md"
  - ".ai/HANDOFF_INIT_PROMPT.md"
  - ".ai/TOKEN_USAGE_PROFILE.md"
  - ".ai/TOKEN_USAGE_OPERATIONAL_NORMS.md"
  - ".ai/CODEX_WORK_MECHANISM_PROTOCOL.md"
  - ".ai/CODEX_TASK_INPUT_CONTRACT.md"
  - ".ai/DEFAULT_LARGE_TASK_EXECUTION_PROFILE.md"
  - ".ai/LONG_RUN_AUTONOMOUS_PROGRAM_PROTOCOL.md"
  # Core-owned for the same reason .githooks/ is: a domain able to edit its own
  # copy could widen its own publication grant, and master and history are shared.
  - ".ai/REPOSITORY_PUBLISHER_AUTHORITY.yml"
  - ".ai/load_profiles/"
  - ".ai/lanes/"
  - ".ai/communication_compliance/"
  - ".ai/role_memory/"
  - ".ai/token_profile/"
  # The push guard is core-owned for the same reason core history is never
  # rewritten: the rule it enforces is shared. A domain that could edit its own
  # copy could weaken its own guard, and the damage from a rewrite lands on every
  # domain at once rather than only on the one that did it. Note that the hook
  # files travel with a merge but `core.hooksPath` is local config and does not,
  # so each clone still has to enable it once - see .githooks/README.md.
  - ".githooks/"

# Paths every domain owns for itself. Core never ships content here; each domain
# repository fills them with its own material, so a core merge must not touch them.
#
# 01 -> 02 -> 03 -> 08 is one chain, owned end to end by the domain: research
# produces protocols, protocols produce execution principles, those produce the
# system. Splitting the chain across the core/domain boundary would have made
# every domain fight core for its own reasoning.
domain_owned_paths:
  - "01_Research_Reports/"
  - "02_Protocols/"
  - "03_Daily_Execution/"
  - "08_Domain_Applications/"
  # Domain-specific content and domain workflow run traffic stay with each
  # domain. The current domain run root is .ai/PROGRAM_RUNS/; a future
  # second-generation domain run root requires separate approval and modelling.
  - "08_os/07_content/"
  - ".ai/TASKS/"
  - ".ai/CODEX_REPORTS/"
  - ".ai/PROGRAM_RUNS/"
  - ".ai/HUMAN_BRIEFS/"
  - ".ai/USER_UPLOADS/"
  - ".ai/STATE.yml"
  - ".ai/INBOX.md"
  - ".ai/OUTBOX.md"
  - ".ai/HUMAN_BRIEF.md"
  - "README.md"
  - "PROJECT_CONTEXT.md"

# Mechanics a domain repository follows. Recorded here so the procedure lives
# with the manifest instead of in someone's memory.
domain_merge_procedure:
  first_time_only: >-
    git merge -s ours core/master
    records ancestry WITHOUT taking core's tree. Required exactly once per
    domain, because core's initial commit removes domain content; a plain merge
    would propagate that deletion and wipe the domain. Measured on the math
    domain: a naive merge proposed 1132 files and 204156 deletions. After the
    ours-merge the merge base sits past that commit and ordinary merges are safe.
  every_upgrade_after: >-
    git fetch core && git merge core/master
    is a real three-way merge. A conflict means the domain edited a core-owned
    path, and that is the finding itself: resolve it by moving the change
    upstream, not by keeping the local edit.
  never: >-
    Do not rewrite core history. Every domain's common ancestor depends on it;
    one rewrite breaks mergeability for all domains at once.

# How a NEW domain repository comes into existence. Recorded here because the
# script existed for weeks with nothing in the repository pointing at it, so the
# only place the procedure lived was one person's notes.
domain_creation:
  use: >-
    new-domain.ps1 at the core repository root. Example: .\new-domain.ps1 -Name finance
  never: >-
    Do not create a domain by copying the core FOLDER. A folder copy carries
    core's remotes, so the new domain keeps pointing at core and at every other
    domain remote core happens to have; one stray `git push` then writes into the
    wrong repository. The script clones instead, which carries only `origin`, and
    renames that to `core` before adding the domain's own `origin`.
  note: >-
    A fresh domain does NOT need the `merge -s ours` step described under
    domain_merge_procedure.first_time_only. That step existed only because the
    math domain already held content that core's first commit deletes. A new
    domain starts at core's current state, so ordinary `git merge core/master`
    is correct from day one.

verification:
  - "no domain edits inside core_owned_paths"
  - "core merge completes without conflict, or every conflict is reported"
  - "domain tests and audits pass after the merge, before it is pushed"
