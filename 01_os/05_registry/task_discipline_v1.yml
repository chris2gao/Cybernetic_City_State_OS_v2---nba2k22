schema_version: citystate.registry.v1
registry_id: task_discipline_v1
area: 01_os/06_execution/task_discipline
status: active
purpose: >-
  登记任务纪律工具：上下文预检、完整日志诊断、物理路径账本与受控候选验证。
  工具不扩大 task scope、不产生 Human confirmation；验证证据写在源仓库之外。
origin_run: 01_os/_runs/run-20260809-任务纪律工具-001/
entries:
- path: 01_os/06_execution/task_discipline/managed_verification/**
  purpose: 精确候选、任务包及必需检查绑定的前台执行、完整日志、结果复算与真进程/Git回归
  loader: 执行者显式调用 managed_verify.py；收尾消费者调用 inspect；pytest 发现测试
  loader_class: in_repo_program
  discovery: 01_os/开发入口与单窗口任务规范_v1.md 第 1.2 节
  evidence: 01_os/06_execution/task_discipline/managed_verification/test_managed_verify.py
  cache_dirs: []
  failure_surfacing: exit 1 检查结果不符；exit 3 输入、源、执行或证据错误；无最终记录不能通过
  deletion_rule: human_decision_required
- path: 01_os/06_execution/task_discipline/packet_input/**
  purpose: 共用任务包结构、字段、类型和原始 YAML 键/循环校验；显式报告旧平铺输入
  loader: preflight、path_ledger、managed_verification 导入；pytest 发现测试
  loader_class: in_repo_program
  discovery: 三个消费者直接 import task_packet_input
  evidence: 01_os/06_execution/task_discipline/packet_input/test_task_packet_input.py
  cache_dirs: []
  failure_surfacing: 共享 reader 错误转换为消费者 exit 3
  deletion_rule: human_decision_required
- path: 01_os/06_execution/task_discipline/README.md
  purpose: 三个工具的边界、退出码与用法
  loader: Human 与执行者阅读
  loader_class: external_tool_convention
  discovery: registry entry 与 01_os/06_execution/README.md
  evidence: 01_os/_runs/run-20260809-任务纪律工具-001/07_测试执行/验证结果_v1.yml
  cache_dirs: []
  failure_surfacing: 工具行为与文档不符时在下一次任务收尾暴露
  deletion_rule: human_decision_required
- path: 01_os/06_execution/task_discipline/preflight/preflight_task_context.py
  purpose: 一次性输出真实 HEAD、祖先关系、hook 守卫、工作区状态、allowlist、禁止项与可选声明 gate 状态
  loader: 执行者在首次写入前手动调用
  loader_class: in_repo_program
  discovery: 01_os/开发入口与单窗口任务规范_v1.md 第 1.2 节
  evidence: 01_os/06_execution/task_discipline/preflight/test_preflight_task_context.py
  cache_dirs: []
  failure_surfacing: 退出码 1 表示硬前提失败，3 表示输入或 git 错误
  deletion_rule: human_decision_required
- path: 01_os/06_execution/task_discipline/quiet_verify/quiet_verify.py
  purpose: 非候选绑定的诊断入口；完整日志先留存，展示时通过一行、失败有界尾部
  loader: 执行者与审查者手动调用
  loader_class: in_repo_program
  discovery: 01_os/开发入口与单窗口任务规范_v1.md 第 1.2 节
  evidence: 01_os/06_execution/task_discipline/quiet_verify/test_quiet_verify.py
  cache_dirs: []
  failure_surfacing: 退出码 1 表示有检查未达预期退出码
  deletion_rule: human_decision_required
- path: 01_os/06_execution/task_discipline/path_ledger/changed_path_ledger.py
  purpose: 从 git diff -z 与 git status -z -uall 生成规范化 UTF-8 变更路径集合，并与任务包 allowed_changed_paths 求子集
  loader: 执行者在收尾时手动调用；审查者复算
  loader_class: in_repo_program
  discovery: 01_os/开发入口与单窗口任务规范_v1.md 第 1.2 节
  evidence: 01_os/06_execution/task_discipline/path_ledger/test_changed_path_ledger.py
  cache_dirs: []
  failure_surfacing: 退出码 1 表示有变更路径越出 allowlist
  deletion_rule: human_decision_required
invariants:
  tools_never_expand_task_scope_or_create_Human_confirmation: true
  tool_code_itself_writes_no_source_repository_content: true
  verification_evidence_written_outside_source: true
  user_supplied_checks_run_with_caller_privileges: true
  user_supplied_checks_may_write: >-
    quiet_verify --checks 执行调用者声明的任意命令，这些命令能写仓库。
    "不写入"只对工具自身代码成立，不对被它调用的检查成立。此处曾写成
    tools_never_write_repository_content: true，是不实声明，已于合并前改正。
  path_ledger_independent_of_repo_git_config: true
  no_watcher_scheduler_or_daemon: true

known_defects_status: 第一次独立复核 REJECT；四条行为缺陷已全部修复，等待第二轮独立复核
known_defects_record: 01_os/_runs/run-20260809-任务纪律工具-001/08_独立复核/独立复核结论摘要与Human裁决_v1.yml
independent_review_passed: false
known_defects:
- id: F1
  tool: path_ledger
  defect: 跨提交的 rename 只报新路径，旧路径不出现，可能给出假阴性
  status: fixed
  fix: committed_paths 加 --no-renames，改名呈现为 delete + add
  regression_tests: 3
- id: F2
  tool: preflight
  defect: --no-remote 时未核验 master 仍渲染 preflight ok
  status: fixed
  fix: >-
    master_verification 三态化（verified_unchanged / moved / not_read /
    no_expectation_declared）；未核验计入 hard_failures，除非显式
    --accept-unverified-master，且摘要行如实标注而非打印裸 ok
  regression_tests: 6
- id: F3
  tool: preflight
  defect: 授权门接受 YAML 1.1 裸 yes/on，与拒绝字符串 'true' 的严格度不一致
  status: fixed
  fix: >-
    read_gate 同时要求 safe_load 解析值为 True 且原始标量字面量为小写 true；
    返回值新增 raw 与 reason 字段，使拒绝原因可读
  regression_tests: 6
- id: F4
  tool: quiet_verify
  defect: 失败输出只按行封顶，单行超长时不封顶
  status: fixed
  fix: bounded_tail 在行截断之后再施加 max_chars 字符硬上限，默认 4000，并标注丢弃字符数
  regression_tests: 4
evidence_strength_caveat: >-
  四条缺陷已修，但本工具集尚未通过第二轮独立复核。在那之前，
  把这三个工具的输出当作验收证据的报告应同时引用 known_defects_record。
