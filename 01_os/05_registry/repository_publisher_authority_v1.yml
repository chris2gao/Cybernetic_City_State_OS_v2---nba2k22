schema_version: citystate.authority.v1
mechanism_version: 1
policy_revision: 2026-08-28-default-task-scope-with-direct-human-confirmation

# Repository publication policy. This file separates three things that used to be
# conflated: task scope, publication transport, and Human confirmation for a small
# protected-action set.
#
# Ordinary reversible work inside a current task scope is executable by default.
# It does not require a separate Human authorization artifact, task code, nonce,
# or delegation chain. The current Human task input plus the durable task packet
# (when material mutation exists) defines ordinary scope.
#
# Loaded by any executor before a write that leaves its own worktree. Transport
# gates remain mandatory because they prove physical publication facts; they are
# not Human authorization gates.

root_authority: Human

ordinary_task_execution:
  separate_Human_authorization_required: false
  task_code_required: false
  nonce_required: false
  task_authority_chain_required: false
  ordinary_cross_model_delegation_required: false
  basis:
    - current_Human_task_input
    - durable_task_scope_when_material_mutation_occurs
    - repository_path_and_transport_guards
identity:
  self_declared_provider_name_expands_scope: false
  accepted_bindings:
    - trusted_host_injected
    - connector_authenticated
    - local_authenticated
  on_missing_or_unverifiable_binding: fail_closed_for_publication_transport

# Ordinary capabilities are usable inside the current task scope without asking
# the Human again. A provider/model/role label never expands that scope.
capabilities:
  read_repository: true
  create_branch: true
  update_task_branch: true
  create_update_delete_files_in_task_scope: true
  commit: true
  push_source_branch: true
  open_update_pull_request: true
  remote_readback_and_audit: true
  delete_remote_branch: true

# Shared-state and irreversible actions are confirmation-bound, not authority-code
# bound. If already covered by the current Human instruction or a big-task
# preconfirmation, do not ask again. Otherwise ask directly at the action boundary.
confirmation_bound_actions:
  publish_or_merge_to_master: Human_confirmation_required_unless_preconfirmed
  force_push: Human_confirmation_required_unless_preconfirmed
  rewrite_published_history: Human_confirmation_required_unless_preconfirmed
  delete_master_or_repository: Human_confirmation_required_unless_preconfirmed
  change_repository_visibility_or_credentials: Human_confirmation_required_unless_preconfirmed
  activate_runtime_scheduler_or_coordinator: Human_confirmation_required_unless_preconfirmed
  access_secrets_credentials_or_key_material: Human_confirmation_required_and_security_rules_apply

Human_confirmation_contract:
  sufficient_sources:
    - clear_current_Human_instruction_covering_exact_action
    - durable_simple_confirmation_record_derived_from_clear_Human_instruction
  authorization_code_required: false
  nonce_required: false
  Human_task_authority_v2_required: false
  delegation_chain_required: false
  when_confirmation_missing: ask_Human_directly_then_continue_after_clear_answer
  replay_rule: >-
    Persist a compact confirmation record only when a later window or endpoint must
    replay the fact. The record is evidence of the Human answer, not a new authority
    hierarchy.

big_task_confirmation_closure:
  required_before_dispatch: true
  dispatcher_must_enumerate_known_confirmation_bound_actions: true
  covered_actions_must_not_be_reasked_during_execution: true
  unexpected_new_confirmation_bound_action: ask_immediately_then_continue_after_clear_answer
  unexpected_semantic_choice: Human_decision_required_not_authorization
  historical_finding_cannot_create_permission_gate: true

legacy_compatibility:
  Human_task_authority_v2: readable_when_historical_message_references_it
  task_authority_delegation_v2: readable_when_historical_message_references_it
  new_ordinary_task_must_create_legacy_authority_artifacts: false
  plaintext_task_code: neither_required_nor_stored

# One prohibition remains absolute because its cost is structural rather than a
# question of trust or confirmation. Every domain repository shares an ancestor
# with core; rewriting core history breaks mergeability for the whole family.
core_history_rewrite: prohibited_regardless_of_confirmation

recognized_transports:
  - local_git
  - github_api_connector
  - github_cli
unknown_transport: blocked

never_stored:
  - credentials_or_tokens
  - key_files
  - plaintext_authorization_codes
  - task_nonces_for_ordinary_execution
  - self_declared_model_identity_as_scope_or_confirmation
