schema_version: citystate.registry.v1
mechanism_version: 1

# Repository-level guards: files that git or another external tool loads from a
# conventional path, outside this repository's own reference graph.
#
# This is the file class 05_registry/README.md was written for. Two working
# mechanism files were once deleted by a correct reachability analysis precisely
# because the thing loading them was not in the repository and no reference to
# them existed anywhere; both were found by accident. A guard that git reads by
# convention has the same shape.
#
# Ownership is declared separately in CORE_MANIFEST.yml. That file answers who
# may author a path, so that core/domain drift can be detected. It does not
# answer what loads the path, how the path is discovered, or when a failure
# becomes visible. Those are this registry's questions, and the two are not
# substitutes for each other.
#
# Publication authority is a third question again - who may publish at all, and
# what the publication must carry - and it is answered by
# 01_os/05_registry/repository_publisher_authority_v1.yml, registered below.

guards:
  - path: ".githooks/pre-push"
    purpose: >-
      Refuses non-fast-forward pushes to any ref, and pushes to or deletion of
      master or main without per-command authorization. Deletion of an ordinary
      remote branch was refused until 2026-08-02 and is now allowed: with no
      override for it, the only route was `--no-verify`, which disables every
      check here at once, so routine branch cleanup and history rewriting shared
      one switch. Separating them removes a standing reason to reach for the
      lever that also unlocks the unrepairable action.

      Since 2026-09-12 it also refuses any ref the workflow publication gate
      refuses, and refuses when that gate cannot be run at all - no python on
      PATH, or the gate file missing - because being unable to check is not the
      same as having nothing to check. There is no override for either.

      That verdict is not made here. This file calls
      01_os/06_execution/workflow/publication_gate/workflow_publication_gate.py
      once per ref and propagates its exit code. What a governed run is, whether
      a stage chain holds, whether anything was accepted: all of it belongs to
      the gate and to the deliberation mechanism behind it, and copying any of
      that judgement into this hook would create a second definition of it. The
      base handed to the gate is the remote old sha git supplies on stdin, which
      is what makes this caller's base binding real rather than self-asserted;
      the gate itself can only check that a base strictly precedes a candidate.
    loader: "git, when core.hooksPath points at .githooks"
    loader_class: external_tool_convention
    transport_scope: local_git
    outside_transport_scope: >-
      This guard covers exactly one publication transport. An executor publishing
      through the GitHub API, a connector, or a CLI whose hooks are not verified
      never gives this file a chance to run, so its absence there is neither a
      pass nor a failure - it is out of scope. The equivalent gates for those
      transports are remote compare-and-swap against an expected head, a path
      allowlist checked against the actual diff, and a read-back of the resulting
      remote head. See section 1.1 of
      01_os/开发入口与单窗口任务规范_v1.md for the matrix and
      01_os/05_registry/repository_publisher_authority_v1.yml for who may publish
      at all. Reporting `hook_guard: passed` from a non-local_git transport is a
      false receipt, not a technicality.
    discovery: >-
      hardcoded default in git. Nothing inside the tree references this file as
      an execution dependency, so no in-repository analysis can reveal it.
    activation: "git config core.hooksPath .githooks"
    activation_travels_with_merge: false
    evidence: >-
      01_os/_runs/ has no run for this; the acceptance evidence is the self-test
      in .githooks/install.ps1, which attempts a dry-run push to master and
      requires the refusal. Five cases were measured at install time: an
      unauthorized master push is refused, the same push with
      CITYSTATE_ALLOW_MASTER=1 is allowed, an ordinary fast-forward to a feature
      branch is allowed, force-pushing an ancestor over a published branch is
      refused, and deleting a remote branch is refused. The fifth case no longer
      holds: branch deletion was opened on 2026-08-02 and only trunk deletion is
      still gated. install.ps1 measures the master case alone, so it did not need
      to change - which is exactly why it was never sufficient evidence for this
      entry. The decision table is now measured by
      .githooks/test_pre_push_logic.ps1, thirteen cases driven through stdin with
      no remote involved, including the one that matters most: CITYSTATE_ALLOW_MASTER
      must not also unlock a non-fast-forward push to master. Four of the thirteen
      cover the publication gate as a consumed verdict: a gate PASS still allows an
      ordinary push, a gate refusal blocks a push every other rule permits, and the
      real gate invoked without a candidate refuses rather than assuming one, with
      the hook blocking on that refusal. Measured 13/13 on 2026-09-12.

      One limit, stated because the case name alone would overstate it: exit 41,
      deliberation_not_validated, reaches the hook in that suite only from a stub.
      run_minimum_operational_loop.validate_run returns 41 when it has no
      candidate, and no publication consumer calls that function - it reads the
      working tree while this gate judges a commit, so wiring the two would swap
      "judges what is being pushed" for "judges whatever is on disk". The suite
      proves this hook blocks on 41 if it arrives, not that the publication path
      can presently produce it.
    cache_dirs: []
    failure_surfacing: "never until misuse"
    failure_note: >-
      This is the worst category and it has already happened. The first commit
      shipped a zero-byte hook: it was executable, exited zero, refused nothing,
      and every push continued to succeed, so the repository looked exactly as it
      would have if the guard were working. Only an attempted push that was
      required to fail revealed it. Checking that the file exists proves nothing
      about this entry.
    deletion_rule: protected
    known_limit: >-
      `git push --no-verify` skips the hook entirely, as does any client that
      pushes without invoking hooks. This is a guard, not an enforced access
      boundary - the same distinction run-007 drew for workspace partitions. It
      must never be cited as evidence that history was not rewritten; read the
      remote for that.

      Second limit, added with the publication gate call on 2026-09-12. That gate
      judges structure and ancestry: that a governed run's seven stages chain by
      strict Git ancestry, that each phase contributed its own artifact rather
      than repeating its predecessor's tree, and that declared verification
      evidence exists at the commit and path it names. It does not invoke the
      authoritative deliberation validator. So a pass here is never evidence that
      a stage's reasoning was examined or that a Human accepted anything - only
      that the record is shaped, ordered and separated as the contract requires.
      Citing a clean push as semantic acceptance would be the same false receipt
      this entry already names for the wrong-transport case.

  - path: ".githooks/README.md"
    purpose: "How to enable the guard, what it refuses, and what it cannot do."
    loader: "Human and development executors"
    loader_class: external_tool_convention
    discovery: "referenced from .githooks/install.ps1 and from this registry"
    evidence: ".githooks/install.ps1"
    cache_dirs: []
    failure_surfacing: "next clone that runs unguarded because nobody enabled it"
    deletion_rule: protected

  - path: ".githooks/install.ps1"
    purpose: >-
      Sets core.hooksPath, checks the hook has LF endings because a CRLF shebang
      fails silently under Git Bash, and proves the guard fires by requiring a
      refused dry-run push to master.
    loader: "Human or development executor, once per clone"
    loader_class: external_tool_convention
    discovery: "referenced from .githooks/README.md and from this registry"
    evidence: "its own output; it exits non-zero when the guard does not fire"
    cache_dirs: []
    failure_surfacing: "immediately, by design - it refuses to report success"
    deletion_rule: protected

  - path: ".githooks/test_pre_push_logic.ps1"
    purpose: >-
      Exercises the pre-push decision table offline by feeding it the same
      stdin git would. install.ps1 answers "is the guard installed and does it
      fire"; this answers "what does it decide", which is the question that
      changes whenever the rules change.
    loader: "Human or development executor, after any edit to .githooks/pre-push"
    loader_class: in_repo_program
    discovery: "referenced from .githooks/README.md and from this registry"
    evidence: >-
      its own exit code; it returns non-zero when any of the thirteen cases
      departs from the specified behaviour. Three harness defects were found and
      fixed while writing it, each of which produced a confident wrong result
      first: a PowerShell pipe appending CRLF into the null-sha comparison; a
      parameter named $args shadowing the automatic variable; and a stub
      mechanism that overwrote the real publication gate and restored it from a
      backup taken afresh on every call, so the second call backed up the stub
      the first had written and the restore put a stub back. The repository's
      646-line gate sat in the working tree as three lines that always exit 13,
      and nothing caught it - not the path allowlist, which saw an authorized
      path, and not the YAML gate, which does not read .py. It was found by eye
      one step before a commit. The stub now lives in a throwaway --no-checkout
      worktree and the real file is never written to, and the suite compares the
      gate's blob hash before and after, failing if it differs. A test that can
      leave a production validator broken is worse than the gap it closes.
      That is the argument for keeping the cases in the repository rather than
      retyping them.
    cache_dirs: []
    failure_surfacing: "immediately, by design - it exits non-zero"
    deletion_rule: protected

  - path: ".githooks/.gitattributes"
    purpose: "Forces LF on hook files. A CRLF shebang makes the hook not run."
    loader: "git"
    loader_class: external_tool_convention
    discovery: "hardcoded default in git"
    evidence: "the LF check in .githooks/install.ps1"
    cache_dirs: []
    failure_surfacing: "never until misuse"
    deletion_rule: protected

  - path: "01_os/05_registry/repository_publisher_authority_v1.yml"
    purpose: >-
      Defines ordinary task/source publication as in-scope execution without a
      separate Human authorization ceremony; lists the small confirmation-bound
      protected-action set; defines direct Human confirmation and big-task
      preconfirmation closure; preserves transport gates and the absolute core-history
      rewrite prohibition.
    loader: >-
      any executor before a write that leaves its own worktree, on every
      publication transport
    loader_class: in_repo_program
    transport_scope: all
    discovery: >-
      referenced from AGENTS.md, AGENT_WORKING_DISCIPLINE.md section 6,
      01_os/开发入口与单窗口任务规范_v1.md section 1.1, .githooks/README.md and this
      registry.
    evidence: >-
      Original migration evidence remains in
      01_os/_runs/run-20260810-旧OS退役前迁移与最终白名单-001. The 2026-08-28
      authorization-flow simplification is evidenced by
      01_os/_runs/run-20260828-global-human-authorization-simplification-001 and
      changes the active semantics from default authorization gates to default task
      scope plus direct Human confirmation for the protected-action set.
    cache_dirs: []
    failure_surfacing: >-
      not at push time. A publisher that never reads it can still push, so the
      failure shows up as an out-of-scope, unconfirmed-protected, or unevidenced publication after the
      fact - which is why the file is discovered from five places rather than one.
    deletion_rule: protected
