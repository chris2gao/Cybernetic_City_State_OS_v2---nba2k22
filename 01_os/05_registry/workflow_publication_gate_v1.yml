schema_version: citystate.registry.v1
registry_id: workflow_publication_gate_v1
status: implemented_local_git_caller_wired

purpose: >-
  Registers the transport-independent workflow publication gate: the component that decides
  whether a run history may be published. It is not a git hook. A git hook is one caller, and a
  transport that does not call this gate is not covered by it.

ownership_boundary:
  this_registry_owns: the gate itself
  does_not_own: >-
    .githooks/pre-push and the local_git transport scope, which stay with
    01_os/05_registry/repository_guards_v1.yml. That entry already states that the hook covers
    exactly one publication transport and that reporting hook_guard passed from another is a false
    receipt. The transport semantics live there and are referenced, never copied.
  mechanism_semantics_owner: >-
    01_os/03_mechanisms/stage_collaborative_deliberation owns Human disposition, Current Model
    completeness, receipt validity, feasibility basis and closure. The gate evaluates none of them.
    Since 2026-09-13 it asks properly: it assembles, from exact candidate Git objects, everything
    a stage acceptance claims to accept and calls validate_stage_acceptance_context, then refuses
    on a non-zero answer. Asking the owner and consuming the answer is the opposite of growing a
    second copy, and the distinction is the whole point - a gate that restated what a Human
    acceptance is would be a second definition of it.

    The first attempt at this, on 2026-09-12, called a weaker entry that judged four common fields
    of one record in isolation. It was replaced rather than kept alongside: a second, weaker source
    of truth for "accepted" is worse than none, because its PASS reads exactly like the real one.

what_the_gate_decides:
- exact reference resolution
- strict Git ancestry between the nodes of each stage chain
- phase content separation, read from trees at named commits
- composition of the seven stages into one chain
- >-
    resolution of everything a stage acceptance claims to accept - the record, the Current Model
    stage_control bound, the stage output, the verification evidence and the stage receipt - each
    read at its own commit and checked against its declared blob
- that the deliberation mechanism accepts each of the two acceptances, judged separately
- fail-closed progression

what_the_mechanism_decides_when_this_gate_asks: >-
  validate_stage_acceptance_context, in stage_collaborative_deliberation, is the single owner and
  every comparison lives there. It requires a foreground, explicit, current Human with an
  affirmative disposition; a structurally valid authority commitment; a task id and a stage id
  that are present and correct, so omission is a refusal rather than a skipped check; a decision
  type that distinguishes a plan acceptance from a completion acceptance, so one cannot be filed
  as the other; a plan record accepting exactly the model stage_control bound; a completion record
  binding the output commit stage_control declares and naming the verification evidence; the closure
  fields; a complete Current Model; and a passing base stage receipt. The gate compares nothing.

what_the_gate_does_not_decide:
- >-
    whether a Human actually produced the record. The commitment structure is checked, which is
    what makes the record challengeable; recomputing the digest against the Human's nonce is
    verify_human_challenge, which is interactive and cannot run on a publication path.
- whether the work happened after the acceptance. Ancestry is publication order, never work order.
- whether a design is sound or a risk matters
- whether the supplied publication base is the transport's real old head
- >-
    the effective non-retroactive cutoff. --base is the remote old head the transport supplies and
    is not --boundary; no caller passes --boundary today, so every governed run at the candidate is
    judged. applies_to_runs_created_after is still unbound and must be bound by a successor record
    naming the exact landing commit. Deriving it from --base would be substituting one concept for
    another.

exit_codes:
  0: pass
  10: usage
  11: reference_shape_or_readability
  13: ordering
  14: phase_separation
  15: blob_mismatch
  16: chain_or_governance_transition
  17: acceptance_refused_by_mechanism
  20: repository_or_mechanism_unavailable
  deliberately_absent:
    12: >-
      defined as a binding code in the first draft and never raised. Removed by the mechanization
      minimization review rather than left as a code nothing could produce.

where_judgement_is_loaded_from: >-
  the installation the gate is part of, resolved next to the gate file, never from the repository
  under judgement and never from a candidate blob. An early revision took it from the --repo-root
  argument, which is the repository being judged: a crafted repository could have shipped a
  permissive verify_stage_collaborative_deliberation.py and the gate would have imported and
  executed it, letting a push choose its own judge and run arbitrary code. Evidence is read at the
  candidate because evidence is what the push asserts; judgement is read locally because a judge
  the defendant supplies is not one.

exact_claim:
  gate: validates the transition given an authentic publication base
  caller: establishes the publication-base binding
  reason: >-
    ancestry does not make a commit the real old head. Many commits are ancestors, and a caller
    that picks a convenient one narrows the governance history it will be judged against.

entries:
- path: 01_os/06_execution/workflow/publication_gate/{workflow_publication_gate.py,test_publication_gate.py}
  purpose: >-
    the gate implementation and its synthetic-Git cases. Each negative case asserts an exit code
    and a failure reason, so a refusal for the wrong cause cannot pass as a refusal.
  loader: Python, invoked by a publication caller or by hand
  loader_class: in_repo_program
  discovery: referenced from this registry and from the caller that invokes it
  evidence: >-
    01_os/_runs/run-20260911-stage-human-alignment-wiring-001/06_执行/网关S1_S9审核_v1.yml records
    the review that found five defects in the first draft, three of them fail-open, before any of
    it was tracked. Acceptance consumption was measured on 2026-09-12 over a twelve-population
    matrix: a chain with well-formed records passes; the same chain with the plan record set to
    actor_class executor, or a rejected or declined disposition, or explicit false, or no
    provenance, or stale, or marked synthetic, is refused with exit 17 carrying the mechanism's own
    code (12 stale, 14 not explicit, 15 otherwise); the same mutations applied to the completion
    record are refused independently; and a record naming another stage is refused on the binding.
  worktree_independence: >-
    measured, not assumed. With the candidate fixed and both acceptance files overwritten in the
    working tree to say actor_class executor and Human_disposition rejected, the verdict stayed
    pass. The gate reads blobs at commits, so what is on disk cannot move a verdict either way.
  cache_dirs: []
  failure_surfacing: next publication attempt by a caller that invokes it
  deletion_rule: protected

caller_coverage:
  rule: only a transport that actually invokes the gate is covered
  canonical_transport_semantics: 01_os/05_registry/repository_guards_v1.yml
  transports:
    local_git: {caller: .githooks/pre-push, wired: true, wired_at: 490b76b25f24bd11f7dabe41b1715d069f459ad6}
    github_api_connector: {caller: none, wired: false}
    cli_without_verified_hooks: {caller: none, wired: false}
    unknown: blocked
  current_state: >-
    one transport calls the gate. A push through local_git with hooks enabled is refused when the
    gate refuses, and refused when the gate cannot be run at all. Every other transport is
    ungated, so no completion brief may say that publication is gated without naming which
    transport it means.
  exit_code_contract: >-
    the hook exits with the gate's own code, so a real semantic refusal travels as mechanism 15 ->
    gate 17 -> hook 17. Refusals the hook makes itself - master authorization, non-fast-forward,
    or a gate it could not run at all - are not the gate's and exit 1. Until 2026-09-13 every
    refusal was flattened to 1, which git treats identically but which made the task packet's
    "propagates a nonzero gate exit code unchanged" untrue and discarded the diagnosis; the caller
    was changed to match the wording rather than the wording relaxed to match the caller. On a
    multi-ref push the first gate verdict is the one reported, and every ref is still asked about.

registered_gap:
  statement: >-
    no publication consumer authenticates a Human, and the effective non-retroactive cutoff is
    still unbound
  reason: >-
    human_challenge_verify.py recomputes a commitment against the Human's nonce and is
    interactive, so it cannot run on a publication path; the structural commitment check is what
    makes a record challengeable, and the distinction is stated rather than blurred.
    applies_to_runs_created_after must be bound by a successor record naming the exact landing
    commit, which cannot be a self-referential sha and must not be inferred from --base. Both are
    real gaps, not scope reductions, and neither is closed by this entry existing.
  closed_on_2026-09-13: >-
    the cross-record binding, previously registered here as open. task and stage identity, the
    plan record's accepted model, the completion record's output and verification evidence, and
    the non-interchangeability of the two decisions are all judged by the mechanism now, with the
    three bypasses that proved the gap kept as negative cases.
  rule_followed: >-
    the registry README requires a gap to be written down rather than left blank, as
    task_orchestration_v1.yml does for its missing boot manifest
