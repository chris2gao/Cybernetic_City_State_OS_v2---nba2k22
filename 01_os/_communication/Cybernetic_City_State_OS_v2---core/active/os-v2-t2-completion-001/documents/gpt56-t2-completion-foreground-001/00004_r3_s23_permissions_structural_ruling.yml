adjudication:
  S23_representation_status: inside_accepted_authority_contract
  fixed_result_vector_arity_expectation: preserve
  role_contract_v1_additions:
  - selector: [roles, "*", permissions]
    child_keys: instance_identity
  - selector: [roles, "*", permissions, "*"]
    child_keys: declaration_name
  fixture_or_test_change_required_by_ruling: false
  adapter_or_vocabulary_change_required_by_ruling: false
  model_change_required: false

rationale:
- >-
  The historical independent reviewer defines S23 as `permissions ->
  master_write_authorized -> state: granted`, expects FAIL on P05, and the current
  executor already measures expected FAIL / actual FAIL / correct=true. S23 is not
  an accidental shape introduced by the completion work.
- >-
  V-AUTH-01 explicitly defines a permission set, capability set, or authorised act
  as an authority-conferring position and names S23's
  `permissions.master_write_authorized.state=granted` as a case the accepted rule
  closes. Therefore treating the nested permissions form as outside the accepted
  contract would contradict the accepted executable vocabulary.
- >-
  `permissions` is a contract-owned authority field at the already claimable role
  record level, but its direct action keys are identities inside an open permission
  collection. `master_write_authorized` is therefore instance_identity, not a
  globally claimable declaration name. Fields inside that action record, such as
  `state`, are typed contract slots and are declaration_name. This is the same
  structural two-level pattern already used for other named keyed collections.
- >-
  `adapt_structural_refusals` states that unknown or conflicting positions inside a
  bound profile are visible P00 coverage holes, while instance_identity is not a
  refusal because the evaluator has positively described the position. The S23 P00
  is therefore evidence of incomplete role_contract_v1 coverage, not an optional
  companion result to normalize away.
- >-
  The fixed seven/fourteen-predicate guards are doing useful work here: they expose
  the unexpected P00. Reclassifying those guards would make a known binding hole
  look acceptable while leaving correction-003 structurally incomplete.
- >-
  This ruling is intentionally exact to `permissions`. It does not create a generic
  nested-authority-container rule, infer structure from runtime key spelling, or
  widen unrelated `capabilities`/`privileges` regions beyond what current primary
  evidence requires.

supportability_rationale: >-
  The ruling follows the historical S23 mutation, the accepted rule that explicitly
  names that mutation, and the structural-refusal contract's own definition of P00
  inside a bound profile. The child roles follow collection identity versus typed
  record-slot semantics rather than lexical key recognition.

feasibility_rationale: >-
  Closure is a bounded two-rule addition in the existing evaluator-owned binding.
  No parser, adapter, vocabulary, fixture or test change is required; the inherited
  v3/v4 regressions can directly establish whether this exact coverage hole closes
  without introducing a new signature.

executor_instruction_boundary:
- Add exactly the two role_contract_v1 container rules above on the completion branch.
- Do not weaken or change the fixed result-vector arity assertions under this ruling.
- Do not add generic nested authority inference or broaden unrelated container profiles.
- Re-run the inherited v3 and v4 suites unmodified and capture actual exit codes and failing-set transition.
- If the inherited suites become fully green with no new signature, publish one exact correction-003 replacement candidate and formal result for fresh independent review.
- If another load-bearing authority/claimability choice or new primary failure signature appears, stop and return to foreground.
- Do not begin P2-2 before fresh independent correction-003 PASS and foreground verification of the exact candidate binding.

