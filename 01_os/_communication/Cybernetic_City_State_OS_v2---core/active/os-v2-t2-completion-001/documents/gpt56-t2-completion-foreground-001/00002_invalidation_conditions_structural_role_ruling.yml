  upstream_branch_modification_required: false
  model_change_required: false

rationale:
- >-
  structural_binding defines instance_identity as an author-chosen entry identity in
  an open keyed collection and declaration_name as a semantic-contract-owned field
  name. Only declaration_name is globally claimable. The role is decided by the
  holding container, not by the key's spelling.
- >-
  F03-D represents invalidation_conditions as named condition entries whose records
  carry the typed semantic slots subject and observation, with consequence resolved
  from the entry or region. The determinism adapter does not infer determinism from
  the condition-name spelling; the typed slots carry the decision-bearing structure.
- >-
  A specialized A05 adapter may map a condition entry name onto a freshness-trigger
  business role. That does not make the entry name a globally claimable declaration
  field. The accepted failure_states collection is the direct precedent: its entry
  names are instance_identity even though the A12 adapter maps those names onto
  failure-case roles.
- >-
  entry_modes supplies the same structural two-level pattern already accepted in
  window_contract_v1: the collection's direct child keys are instance_identity and
  each entry record's direct fields are declaration_name. invalidation_conditions is
  likewise a named-entry collection whose record fields are contract-owned typed slots.
- >-
  The integration gap exists only because parent v4 F03-D introduced a keyed typed
  representation after the accepted structural-provenance candidate was built against
  the v3 corpus. Therefore the additional binding belongs in the parent-based completion
  branch. Rewriting 7cf91957 would mutate an already independently accepted upstream
  candidate without adding supportability.

supportability_rationale: >-
  The ruling is supported by the executable structural-role definitions, the accepted
  same-profile collection precedents, and the F03-D adapter's actual slot-based decoding.
  It does not rely on the payload prose comment or on which option makes the suite green.

feasibility_rationale: >-
  The ruling requires only a bounded extension of the evaluator-owned binding on the
  existing completion branch, followed by the already declared focused and inherited
  regressions. It introduces no new structural-provenance architecture and does not
  require Stage01-03 reruns, an upstream-history merge, or any protected publication.

executor_instruction_boundary:
- Add binding coverage consistent with the adjudication; implementation details remain executor-owned where non-load-bearing.
- Re-run the relevant v3 and v4 suites and capture actual exit codes this time when technically observable.
- Treat any new failure signature after the P00 short-circuit is removed as new evidence, not as permission to broaden semantics.
- Stop and return if another load-bearing authority/claimability choice appears.
- Do not begin P2-2 until correction-003 receives fresh independent PASS and foreground verifies the exact candidate binding.

