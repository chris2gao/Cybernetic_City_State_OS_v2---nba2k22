adjudication:
  Q1_transparent_wrappers:
    ruling: positive_profile_scoped_transparency_only
    do_not_restore_tail_matching: true
    exact_additions:
      role_contract_v1:
      - [contract]
      window_contract_v1:
      - [contract]
      - [window_contract]
      handoff_contract_v1:
      - [contract]
    global_transparent_anchor_change_required: false
    all_other_undeclared_wrappers_remain: unknown_unclaimable
    rationale: >-
      The exact historical reviewer S01-S03 mutations use a root contract envelope
      and expect PASS as transparent nesting. V4MT02 uses a root window_contract
      envelope and explicitly calls it a transparent wrapper. CM-v2 already defines
      the safe mechanism: positively declared wrappers are removed before root-
      anchored matching. Scoping the exact envelopes to the affected profiles
      preserves B1 because no undeclared ancestor becomes transparent and no tail
      match is reintroduced.

  Q2_condition_definitions:
    ruling: evaluator_bound_sibling_definition_region_is_in_contract
    bare_condition_name_authority: none
    exact_container_rules:
    - selector: [lifecycle, condition_definitions]
      child_keys: instance_identity
    - selector: [lifecycle, condition_definitions, "*"]
      child_keys: declaration_name
    resolution_rule: >-
      A bare condition name may resolve only by exact identity lookup to a structured
      record in the evaluator-bound sibling condition_definitions region. No subject,
      observation or other semantics may be inferred from the bare name spelling.
    generic_definition_region_inference: prohibited
    rationale: >-
      Parent F03-D already contains CONDITION_DEFINITION_REGION_TOKENS and executable
      sibling resolution for exactly this representation, and V4MT13 exists to
      distinguish F03-D from a blanket ban on bare strings. Structural provenance
      therefore binds the existing machine semantic surface rather than inventing a
      new authority source.

  Q3_historical_S14_document:
    ruling: preserve_global_unbound_fail_closed_and_bind_exact_known_reviewer_identity
    global_unbound_document_behavior: unknown_visible_unsupported
    exact_document_profile_addition:
      workflow/new_role_source.yml: role_source_v1
    default_or_inferred_profile: prohibited
    path_or_filename_semantic_inference: prohibited
    rationale: >-
      Historical independent-review S14 creates exactly workflow/new_role_source.yml
      as a real second role source with generic IDs and unseen labels and expects
      FAIL(P01). The accepted binding already registers other fixed adversarial
      second-role-source identities for the same reason: otherwise fail-closed
      refusal makes the ownership scan unable to test the reviewer's proposition.
      Exact opaque registration of this known corpus identity restores that test
      without weakening B2 for genuinely unregistered documents.

