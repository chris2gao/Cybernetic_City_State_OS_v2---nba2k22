schema_version: citystate.communication.task_role_context.v1
task_id: os-v2-mechanism-activation-and-adherence-001
endpoint_id: isolated-gpt-design-reviewer-001
task_role: independent_design_reviewer
collaboration_role: independent_review
review_scope: architecture_design_only
receiver_setup:
  provider: OpenAI
  product: ChatGPT
  surface: isolated Review Project
  model: GPT-5.6 Sol
  reasoning_or_parameter_profile: High
  session_mode: fresh
  isolation_level: fresh_project_blind
  repository_access_mode: GitHub_connector
  repository_or_worktree_requirement: chris2gao/Cybernetic_City_State_OS_v2---core
  required_branch_or_sha: d01fae74b90f8ca5debeae979ffcc262aa042448
  local_files_required: false
  github_publication_required_before_start: false
  communication_carrier: GitHub
  limitations:
    - no local worktree assumptions
    - no executor or foreground private chat context
review_rules:
  - reconstruct claims from durable GitHub evidence
  - treat design conclusions as claims to falsify
  - generate independent adversarial scenarios
  - distinguish semantic architecture findings from executable-test findings
  - verify validation modality is appropriate for non-code result types
  - do not modify canonical implementation
  - do not claim implementation PASS
  - role and model identity grant no authority
response_rule: >-
  Publish durable review evidence and a formal response/result through this communication task if GitHub write is available;
  otherwise fail closed and report the missing capability to Human without inventing publication success.
