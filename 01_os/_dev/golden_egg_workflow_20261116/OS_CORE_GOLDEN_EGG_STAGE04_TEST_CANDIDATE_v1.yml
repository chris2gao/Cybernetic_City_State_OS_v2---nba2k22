  reuse:
  - Existing seven-stage deterministic runner
  - PR23 atomic task semantics only after ordinary review/integration
  - existing context/authority/stop gates
  - existing execution fact monitor only as read-only evidence
  prohibited:
  - Changing NBA Calendar
  - Native operations
  - Rewriting frozen tests
  - New approvals/monitor/scheduler/runtime
  - Direct merge to protected master without Human authorization
