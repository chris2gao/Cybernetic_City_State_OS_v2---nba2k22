schema_version: context_management.boot_manifest.v1
mechanism_version: 1
failure_policy: fail_closed_on_missing_partial_or_stale
load_order:
  - path: 01_os/README.md
    purpose: OS 区域与所有权入口
  - path: 01_os/03_mechanisms/context_management/决定_谁执行_v0.2.md
    purpose: 活动 D2 执行角色与边界裁决
  - path: 01_os/03_mechanisms/context_management/README.md
    purpose: 全局机制入口
  - path: 01_os/03_mechanisms/context_management/文件隔离与产物生命周期_v1.md
    purpose: 隔离、发布、保留与删除规则
  - path: 01_os/03_mechanisms/context_management/实现/文件布局契约_v1.yml
    purpose: 机器可读布局契约
validator: 01_os/03_mechanisms/context_management/实现/verify_context_structure.py
registry: 01_os/05_registry/context_management_v1.yml
optional_extensions:
  prms:
    contract: 01_os/03_mechanisms/context_management/prms/README.md
    registry: 01_os/05_registry/prms_v1.yml
    loader: 01_os/06_execution/boot/context_management/prms/cli.py
    invocation: explicit_authorized_foreground_only
    task_continuity_contract: 01_os/03_mechanisms/context_management/prms/TASK_CONTINUITY.md
    task_adapter: 01_os/06_execution/boot/context_management/prms/task_cli.py
    task_trigger: Human_requests_save_or_resume_of_durable_task
    state_repository: separately_authorized_external_repository_required
    starts_runtime: false
receipt_required:
  - boot_manifest_version
  - mechanism_version
  - loaded_paths
  - validator_exit_code
# Read tiers (Human decision 2026-11-18, OS-CORE-B0-SPLIT-BOOT-TIERS-20261118-001). The single
# place that says what a model reads: startup at role initialization; on_action when the stated
# action happens; program = read by validators / runners, a model reads it only to edit it or to
# debug a validator failure; optional = startup read that may be absent. .py paths are entry
# points and are not tiered. generate_skills.py renders this into the skills; validate_skills.py
# fails on a path this manifest names outside every tier. Any load_order in this manifest is
# unchanged and remains what the mechanism's own validator consumes. authority_effect: none.
read_tiers:
  startup:
  - 01_os/03_mechanisms/context_management/README.md
  - 01_os/03_mechanisms/context_management/文件隔离与产物生命周期_v1.md
  on_action:
  - when: 需要理解三个信息平面、恢复与 stale 规则时
    reads:
    - 01_os/03_mechanisms/context_management/方法论_v1.md
  - when: 枚举历史、判断可见性或归档 run 时
    reads:
    - 01_os/03_mechanisms/context_management/工作集与归档契约_v1.yml
  - when: 涉及执行者、workspace 与访问边界时
    reads:
    - 01_os/03_mechanisms/context_management/决定_谁执行_v0.2.md
  - when: 修改项目资料索引或模块记录时
    reads:
    - 01_os/03_mechanisms/context_management/项目资料发现与索引同步契约_v1.yml
  program:
  - 01_os/02_boot/context_management/启动清单_v1.yml
  - 01_os/03_mechanisms/context_management/实现/文件布局契约_v1.yml
  - 01_os/05_registry/context_management_v1.yml
