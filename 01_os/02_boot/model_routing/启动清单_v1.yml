schema_version: citystate.model_routing.boot_manifest.v1
mechanism_version: 1
catalog_version: 1
failure_policy: fail_closed_on_missing_partial_stale_or_invalid
load_order:
  - path: 01_os/03_mechanisms/model_routing/README.md
    purpose: mechanism boundary and Human-facing navigation
  - path: 01_os/03_mechanisms/model_routing/路由契约_v1.yml
    purpose: stable routing input output and authority contract
  - path: 01_os/03_mechanisms/model_routing/模型与产品面目录_v1.yml
    purpose: current evidence-backed model and product-surface facts
  - path: 01_os/03_mechanisms/model_routing/项目观察证据_v1.yml
    purpose: separately graded project observations
validator: 01_os/03_mechanisms/model_routing/实现/verify_model_routing.py
registry: 01_os/05_registry/model_routing_v1.yml
invocation: explicit_Human_or_authorized_task_executor_only
background_processes_started: false
automatic_quota_probe: false
receipt_required:
  - mechanism_version
  - catalog_version
  - loaded_paths
  - validator_exit_code
  - selected_route_executor_profile_ref
