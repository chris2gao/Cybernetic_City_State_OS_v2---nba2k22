schema_version: citystate.minimum_work_unit_output.boot_manifest.v1
mechanism_version: 1
failure_policy: fail_closed_for_declared_MWU_noncompliance
load_order:
  - path: 01_os/03_mechanisms/minimum_work_unit_output/README.md
    purpose: mechanism boundary and navigation
  - path: 01_os/03_mechanisms/minimum_work_unit_output/最小工作单元输出契约_v1.yml
    purpose: stable material-work-unit output semantics and role-specific obligations
validator: 01_os/06_execution/boot/minimum_work_unit_output/validate_minimum_work_unit_output.py
registry: 01_os/05_registry/minimum_work_unit_output_v1.yml
invocation: formal_material_work_unit_dispatch_or_completion
background_processes_started: false
automatic_task_progression: false
authority_effect: none
receipt_required:
  - mechanism_version
  - loaded_paths
  - validator_exit_code
# Read tiers (Human decision 2026-11-18, OS-CORE-B0-SPLIT-BOOT-TIERS-20261118-001). The single
# place that says what a model reads: startup at role initialization; on_action when the stated
# action happens; program = read by validators / runners, a model reads it only to edit it or to
# debug a validator failure; optional = startup read that may be absent. .py paths are entry
# points and are not tiered. generate_skills.py renders this into the skills; validate_skills.py
# fails on a path this manifest names outside every tier. Any load_order in this manifest is
# unchanged and remains what the mechanism's own validator consumes. authority_effect: none.
read_tiers:
  startup:
  - 01_os/03_mechanisms/minimum_work_unit_output/README.md
  on_action:
  - when: 写正式派单、执行交接或审核结论时
    reads:
    - 01_os/03_mechanisms/minimum_work_unit_output/最小工作单元输出契约_v1.yml
  program:
  - 01_os/02_boot/minimum_work_unit_output/启动清单_v1.yml
  - 01_os/05_registry/minimum_work_unit_output_v1.yml
