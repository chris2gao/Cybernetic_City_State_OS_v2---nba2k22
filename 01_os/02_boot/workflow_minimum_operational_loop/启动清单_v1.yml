schema_version: citystate.workflow.minimum_operational_loop.boot.v1
workflow_id: citystate_seven_stage_minimum_operational_loop
workflow_version: 1
contract: 01_os/01_workflow/实现/七阶段最小运行契约_v1.yml
stage01_active_semantic_spec: 01_os/01_workflow/01_需求建模/方法论_v1.md
stage01_result_model_template: 01_os/01_workflow/01_需求建模/实现/需求结果模型模板_v1.yml
stage_schemas:
- 01_os/01_workflow/01_需求建模/实现/最小运行schema_v1.yml
- 01_os/01_workflow/02_信息收集与提炼/实现/最小运行schema_v1.yml
- 01_os/01_workflow/03_结果建模/实现/最小运行schema_v1.yml
- 01_os/01_workflow/04_测试生成/实现/最小运行schema_v1.yml
- 01_os/01_workflow/05_步骤拆分/实现/最小运行schema_v1.yml
- 01_os/01_workflow/06_执行/实现/最小运行schema_v1.yml
- 01_os/01_workflow/07_测试执行/实现/最小运行schema_v1.yml
runner: 01_os/06_execution/workflow/minimum_operational_loop/run_minimum_operational_loop.py
registry: 01_os/05_registry/workflow_minimum_operational_loop_v1.yml
mechanism_preconditions:
  context_management_validator: 01_os/03_mechanisms/context_management/实现/verify_context_structure.py
  stage_collaborative_deliberation_activation_state: 01_os/03_mechanisms/stage_collaborative_deliberation/激活状态_v1.yml
  stage_collaborative_deliberation_runtime_guard: 01_os/03_mechanisms/stage_collaborative_deliberation/实现/verify_no_canonical_live_state.py
  stage_collaborative_deliberation_validator: 01_os/03_mechanisms/stage_collaborative_deliberation/实现/verify_stage_collaborative_deliberation_v2.py
  committed_stage_history_gate: 01_os/06_execution/workflow/publication_gate/workflow_publication_gate.py
default_deliberation_route: dormant
create_live_session_by_default: false
canonical_live_instance_state: prohibited
commands:
  static: python 01_os/06_execution/workflow/minimum_operational_loop/run_minimum_operational_loop.py static <repo-root>
  validate: python 01_os/06_execution/workflow/minimum_operational_loop/run_minimum_operational_loop.py validate <run-root> --repo-root <repo-root> --candidate <40-character-commit>
  materialize_pilot: python 01_os/06_execution/workflow/minimum_operational_loop/run_minimum_operational_loop.py materialize-pilot
    <repo-root> <output-root>
failure_policy: fail_closed_on_missing_malformed_stale_unfrozen_unauthorized_or_unreviewed
receipt_required_for_all_seven_stages: true
# Read tiers (Human decision 2026-11-18, OS-CORE-B0-SPLIT-BOOT-TIERS-20261118-001). The single
# place that says what a model reads: startup at role initialization; on_action when the stated
# action happens; program = read by validators / runners, a model reads it only to edit it or to
# debug a validator failure; optional = startup read that may be absent. .py paths are entry
# points and are not tiered. generate_skills.py renders this into the skills; validate_skills.py
# fails on any repository file path this manifest names (outside optional_extensions) that is
# in no tier, or in two. Any load_order in this manifest is
# unchanged and remains what the mechanism's own validator consumes. authority_effect: none.
read_tiers:
  startup:
  - 01_os/01_workflow/README.md
  on_action:
  - when: 进入阶段 01 需求建模时
    reads:
    - 01_os/01_workflow/01_需求建模/README.md
    - 01_os/01_workflow/01_需求建模/方法论_v1.md
  - when: 进入阶段 02 信息收集时
    reads:
    - 01_os/01_workflow/02_信息收集与提炼/README.md
  - when: 进入阶段 03 结果建模时
    reads:
    - 01_os/01_workflow/03_结果建模/README.md
  - when: 进入阶段 04 测试生成时
    reads:
    - 01_os/01_workflow/04_测试生成/README.md
  - when: 进入阶段 05 步骤拆分时
    reads:
    - 01_os/01_workflow/05_步骤拆分/README.md
  - when: 进入阶段 06 执行时
    reads:
    - 01_os/01_workflow/06_执行/README.md
  - when: 进入阶段 07 测试执行或写审核结论时
    reads:
    - 01_os/01_workflow/07_测试执行/README.md
  - when: 运行 runner、验证或发布七阶段 run 时
    reads:
    - 01_os/06_execution/workflow/minimum_operational_loop/README.md
  - when: 核对协同推演激活状态时
    reads:
    - 01_os/03_mechanisms/stage_collaborative_deliberation/激活状态_v1.yml
  program:
  - 01_os/02_boot/workflow_minimum_operational_loop/启动清单_v1.yml
  - 01_os/01_workflow/实现/七阶段最小运行契约_v1.yml
  - 01_os/01_workflow/01_需求建模/实现/需求结果模型模板_v1.yml
  - 01_os/01_workflow/01_需求建模/实现/最小运行schema_v1.yml
  - 01_os/01_workflow/02_信息收集与提炼/实现/最小运行schema_v1.yml
  - 01_os/01_workflow/03_结果建模/实现/最小运行schema_v1.yml
  - 01_os/01_workflow/04_测试生成/实现/最小运行schema_v1.yml
  - 01_os/01_workflow/05_步骤拆分/实现/最小运行schema_v1.yml
  - 01_os/01_workflow/06_执行/实现/最小运行schema_v1.yml
  - 01_os/01_workflow/07_测试执行/实现/最小运行schema_v1.yml
  - 01_os/05_registry/workflow_minimum_operational_loop_v1.yml
  - 01_os/05_registry/workflow_publication_gate_v1.yml
