证据条目:
  - evidence_id: E-CTX-001
    research_question_ids: [RQ-01]
    主张: 长上下文、无关信息和信息位置会造成可观察的模型表现风险，因此完整历史重放不应作为默认恢复方式。
    方向: 支持
    source_refs:
      - source_id: SRC-DR-CGPT
        location: Directed findings / Long context, irrelevant information, and position effects；Evidence register E-01 至 E-04
        original_source: false
      - source_id: SRC-DR-GEM
        location: 1.1 大模型在无关信息与过长上下文中的表现衰退与物理边界
        original_source: false
    独立性:
      independent_source_count: 2
      shared_origin: 两份报告共享 Lost in the Middle 与 Context Length Alone 等论文；独立数按报告列出的不同首发论文计算，不按报告数计算。
    信息可信度: 5
    可信度理由: 多篇独立研究方向一致，但效果大小和适用任务存在差异。
    适用边界: 不能推成所有模型、所有任务或所有长上下文都失败，也不能采信固定 10% 至 20% 有效窗口作为通用阈值。
    对B的约束: 默认使用小型角色有效状态和精确引用；保留原始证据或事件记录作为补充路径。
    对测试的潜在线索: 比较完整历史包与最小角色入口的体积，并用真实任务验证语义遗漏和补充次数。

  - evidence_id: E-CTX-002
    research_question_ids: [RQ-02]
    主张: 角色独立上下文、按需加载、结构化交接和固定恢复标识均存在成熟实现先例。
    方向: 支持
    source_refs:
      - source_id: SRC-INT-OS1
        location: 懒加载、角色 Profile、fast path、Role Memory
        original_source: true
      - source_id: SRC-DR-CGPT
        location: Context, handoff, memory, and recovery patterns
        original_source: false
      - source_id: SRC-DR-GEM
        location: 2.1 角色专属上下文、交接、记忆与恢复机制模式
        original_source: false
    独立性:
      independent_source_count: 3
      shared_origin: 外部两路部分共享框架文档；内部运行经验独立。
    信息可信度: 5
    可信度理由: 内部实践和多个外部框架原语共同支持机制可实现。
    适用边界: 这些能力不是主流框架默认提供的最小隔离策略，需要显式 policy 和 schema。
    对B的约束: 将角色有效上下文、耐久事实和事件记录分成不同平面；入口只引用获准产物。

  - evidence_id: E-HAND-001
    research_question_ids: [RQ-02]
    主张: 跨角色结构化 handoff 可行，但默认传递完整历史或有损摘要会引入语义遗漏和污染风险。
    方向: 支持并限制
    source_refs:
      - source_id: SRC-DR-CGPT
        location: Agent framework support；Counterevidence and design constraints；Evidence register E-07 至 E-10
        original_source: false
      - source_id: SRC-INT-OS1
        location: 通信通道、handoff 与 fast path
        original_source: true
    独立性:
      independent_source_count: 2
      shared_origin: 不适用。
    信息可信度: 5
    可信度理由: 官方框架文档和内部失败风险方向一致。
    适用边界: 不能由此推出所有交接都必须携带 AST 或逻辑图；需要的是下游关键字段、版本和产物引用可验证。
    对B的约束: handoff schema 必须定义必填字段、来源版本、完成状态、阻塞和输出引用，并保留补充请求通道。

  - evidence_id: E-STATE-001
    research_question_ids: [RQ-02, RQ-06]
    主张: 固定 session、thread、checkpoint 或 restore ID 能支持无旧对话实例恢复，但有效角色状态不能替代完整事件记录。
    方向: 支持并限制
    source_refs:
      - source_id: SRC-DR-CGPT
        location: Context patterns 中 Thread-scoped checkpoints、Fixed restore token、Separate trace/event log
        original_source: false
      - source_id: SRC-DR-GEM
        location: Checkpoint Rehydration、Dual-Track Storage
        original_source: false
      - source_id: SRC-INT-OS1
        location: checkpoint 与状态漂移失败反例
        original_source: true
    独立性:
      independent_source_count: 3
      shared_origin: 外部报告部分引用相同框架。
    信息可信度: 5
    可信度理由: 框架能力和内部经验均直接相关。
    适用边界: 入口状态必须绑定精确产物版本，不能只写自然语言阶段声明。
    对B的约束: 角色入口、耐久事实和 append-only 或可审计事件记录分离；恢复前执行版本校验。

  - evidence_id: E-ISO-001
    research_question_ids: [RQ-04]
    主张: Git worktree、clone 或目录布局只能提供工作区组织分离，不能单独阻止同一不受限 shell 或文件工具越界读取。
    方向: 支持
    source_refs:
      - source_id: SRC-INT-OS1
        location: worktree 与工具可见性失败反例
        original_source: true
      - source_id: SRC-DR-CGPT
        location: Low-cost local isolation mechanisms；Counterevidence
        original_source: false
      - source_id: SRC-DR-GEM
        location: 2.2 本地代码协作环境的低成本物理隔离机制
        original_source: false
    独立性:
      independent_source_count: 2
      shared_origin: 外部两路共同依赖 Git 语义；内部实际经验独立。
    信息可信度: 5
    可信度理由: 原理和内部实践一致。
    适用边界: A 主要防正常路径的无意污染，因此组织分离仍可作为轻量第一层，但不能被命名为技术访问边界。
    对B的约束: 明确区分 workspace partition 与 enforced access boundary；需要时叠加现有 OS、容器或工具 root 约束。
    对测试的潜在线索: 同一 shell 直接读取兄弟 clone 应成功并使纯 clone 边界测试失败；叠加边界后才应被拒绝。

  - evidence_id: E-ISO-002
    research_question_ids: [RQ-04]
    主张: 主机 ACL、容器只读挂载和受限工具网关是可测试的边界候选，但其可用性取决于当前环境和执行主体。
    方向: 支持并限制
    source_refs:
      - source_id: SRC-DR-CGPT
        location: Low-cost local isolation mechanisms
        original_source: false
      - source_id: SRC-DR-GEM
        location: Landlock、MCP Guard、Local Bare Repo
        original_source: false
    独立性:
      independent_source_count: 2
      shared_origin: 机制不同，证据来源族不同。
    信息可信度: 4
    可信度理由: 候选能力存在，但尚未在当前本机验证。
    适用边界: Gemini 对 Landlock 隔离网络和进程空间的描述暂未核实，不能作为当前证据。
    对B的约束: B 只能选择当前环境已验证、无需过重控制面的边界原语；不可因理论存在就假定可用。
    对测试的潜在线索: Codex 本机运行试验 ENV-01、BOUND-01。

  - evidence_id: E-GH-001
    research_question_ids: [RQ-05]
    主张: GitHub 个人私有仓库权限过粗；组织仓库支持更细的仓库级角色，但不是单仓库目录级 ACL。
    方向: 支持
    source_refs:
      - source_id: SRC-DR-CGPT
        location: GitHub permission granularity；Evidence register E-05、E-06
        original_source: false
      - source_id: SRC-DR-GEM
        location: 1.2 GitHub 权限粒度
        original_source: false
    独立性:
      independent_source_count: 1
      shared_origin: 两份报告主要追溯同一 GitHub 官方文档体系。
    信息可信度: 5
    可信度理由: 官方平台权限事实稳定且明确。
    适用边界: 创建、授权、密钥与清理的操作成本尚无本项目实测。
    对B的约束: 不在个人仓库上依赖只读 collaborator；远程隔离若采用独立组织仓库，必须建模生命周期成本。

  - evidence_id: E-INV-001
    research_question_ids: [RQ-06]
    主张: 版本化 handoff 结合声明依赖和内容指纹，可以确定性判断下游 stale；agent 框架的 checkpoint 本身不等于依赖失效传播。
    方向: 支持
    source_refs:
      - source_id: SRC-DR-CGPT
        location: Versioning, invalidation, recovery, and retention patterns；Evidence register E-14
        original_source: false
      - source_id: SRC-DR-GEM
        location: Proof-or-Stop Lifecycle Control
        original_source: false
      - source_id: SRC-INT-OS1
        location: 状态声明与真实产物脱节反例
        original_source: true
    独立性:
      independent_source_count: 3
      shared_origin: Gemini 的 Proof-or-Stop 需进一步核实，但构建系统官方模式与内部反例足以支撑核心主张。
    信息可信度: 5
    可信度理由: 构建与资产系统已有成熟先例，且直接解决内部失败形态。
    适用边界: 必须显式声明依赖；不能对不透明自然语言摘要自动推断全部语义依赖。
    对B的约束: handoff 和角色入口记录精确上游版本；validator 比较版本并标记 stale，规划角色决定重跑范围。

  - evidence_id: E-RET-001
    research_question_ids: [RQ-02, RQ-06]
    主张: 活动上下文、耐久系统事实和完整事件记录具有不同生命周期；删除私有过程前必须先提取正式事实。
    方向: 支持
    source_refs:
      - source_id: SRC-DR-CGPT
        location: Separate trace/event log、Read-only vs writable memory、Retention hooks
        original_source: false
      - source_id: SRC-DR-GEM
        location: Dual-Track Storage
        original_source: false
      - source_id: SRC-INT-OS1
        location: Role Memory、checkpoint 与生命周期经验
        original_source: true
    独立性:
      independent_source_count: 3
      shared_origin: 外部报告部分共享框架资料。
    信息可信度: 5
    可信度理由: 多来源机制共同指向状态平面分离。
    适用边界: 尚不能采信“某一 LangGraph API 必然物理删除全部审计记录”的绝对说法。
    对B的约束: 定义三类存储与删除顺序；事件日志不默认注入角色上下文。

  - evidence_id: E-LIMIT-001
    research_question_ids: [RQ-01, RQ-02]
    主张: 最小上下文和摘要是有损操作，过度缩减可能造成语义遗漏、反复补充和错误传播。
    方向: 限制
    source_refs:
      - source_id: SRC-DR-CGPT
        location: Counterevidence and design constraints
        original_source: false
      - source_id: SRC-DR-GEM
        location: Ev-01、Token-based Trim
        original_source: false
    独立性:
      independent_source_count: 2
      shared_origin: 具体引用需要最终索引回指首发来源。
    信息可信度: 4
    可信度理由: 风险方向明确，但 Gemini 将 AST/逻辑图写成通用强制要求属于过度外推。
    适用边界: 不能由风险推翻最小上下文目标；应通过必填字段、引用和补充请求缓解。
    对B的约束: 为每类 handoff 定义最小充分字段和补充熔断；保留原始产物引用，不只传摘要。

未采信或降级主张:
  - claim: 所有最小交接必须携带 AST 或逻辑推导图。
    disposition: rejected_as_general_requirement
  - claim: LangGraph 的任意裁剪或摘要必然物理删除完整审计数据库。
    disposition: pending_primary_source_verification
  - claim: Landlock 自动隔离全局网络、进程空间和文件系统。
    disposition: pending_primary_source_verification
  - claim: 现代模型的实际有效上下文统一只有标称长度的 10% 至 20%。
    disposition: rejected_as_universal_threshold
  - claim: 补充请求必须采用固定 N 次熔断。
    disposition: candidate_design_constraint_not_evidence_fact

current_feasibility:
  judgment: partially_supported
  bearing_statement: >-
    当前内部经验与外部证据支持构建满足 A 核心目标的机制：角色最小有效上下文、耐久事实、结构化 handoff、固定恢复入口、
    显式版本依赖和生命周期分离均有可行原语。尚未完成的是当前本机可执行边界的实际强度、恢复闭环的运行结果，
    以及每任务每 Web 角色远程仓库的真实运营成本，因此不能宣布阶段二完成。
  supported_parts:
    - 角色化默认最小上下文具有明确风险收益依据。
    - 无共享聊天记忆的持久化恢复和结构化 handoff 可实现。
    - 精确版本和显式依赖可以支持确定性 stale 判定。
    - 工作区分区与真实访问边界可以清楚区分并分层实现。
  unresolved_parts:
    - question: 当前本机无需提权即可使用哪一种低成本边界原语？
      impact: 高
      next_action: 执行 08_Codex_本机分区运行试验任务_v1.yml
    - question: 最小角色入口能否在新进程中恢复并完成小步骤？
      impact: 高
      next_action: 执行 RESTORE-01
    - question: 每任务每 Web 角色 GitHub 仓库的实际创建、授权、密钥与清理成本是否可接受？
      impact: 中
      next_action: 需要显式授权后执行远程仓库生命周期试验，未授权前不创建仓库。

stop_decision:
  stop_broad_research: true
  stop_stage_02: false
  basis:
    - 第三轮宽泛 Deep Research 的 EIG 低。
    - 现有机制空间足以形成 B 的主要维度。
    - 当前最高信息增益来自本机和远程生命周期运行试验。
