# 需求建模 A · 上下文管理机制
# workflow-id: context-management-mechanism
# schema: 01_os/01_workflow/01_需求建模/实现/需求建模schema_v1.md
# version: 2
# supersedes: A_需求建模_v1.yml

目标: >-
  建立一套不依赖模型持续对话记忆的上下文管理机制，使一个完整需求从开始到结束可以被持续追踪，
  并使不同工作角色在正常运行时默认只获得完成自身职责所需的上下文，
  从而降低上下文污染、误读、注意力漂移和无效 token 消耗。

成功判据:
  - 描述: >-
      一个真实的小型第二代 OS 开发任务能够由规划、执行和审核等独立角色完成闭环，
      各角色不依赖共享对话记忆。
    可观察: true
  - 描述: >-
      每个需求 A 对应一个独立任务空间；不同任务的默认上下文互不混合。
    可观察: true
  - 描述: >-
      同一任务内，不同角色不能直接读取其他角色的私有工作区，
      只能消费明确发布给自己的结构化交接产物。
    可观察: true
  - 描述: >-
      执行角色默认只接收当前步骤的最小必要上下文；信息不足时能够提交结构化申请，
      获得完成当前步骤所需的最小补充。
    可观察: true
  - 描述: >-
      新启动且没有旧对话记忆的同角色模型，能从固定入口恢复该角色在当前任务中的完整有效状态并继续工作。
    可观察: true
  - 描述: >-
      规划与任务管理角色能够通过结构化里程碑掌握任务状态、阻塞、产物和测试结果，
      但不加载实现细节；它可以跨任务读取结构化摘要，但不能读取各任务的角色私有上下文。
    可观察: true
  - 描述: >-
      审核角色仅凭结果模型 B、测试定义、测试结果和实现产物完成独立审核，
      不读取执行过程或执行角色私有日志。
    可观察: true
  - 描述: >-
      Web 模型通过按任务和 Web 角色独立授权的受限交接空间参与工作，
      不直接读取主仓库、其他任务或其他角色的交接空间；具体传输实现由 B 依据证据选择并由测试验证。
    可观察: true
  - 描述: >-
      上游结构化交接产物更新后，依赖旧版本的下游上下文被确定性标记失效，
      在重新加载有效版本前停止继续工作。
    可观察: true
  - 描述: >-
      任务结束后保留 A、证据关键结论、B、测试、正式交接、里程碑、审核结论和最终产物，
      删除无长期价值的角色私有过程与临时文件。
    可观察: true
  - 描述: >-
      第一版通过一个完整小型任务闭环，覆盖结构化交接、最小上下文、补充申请、会话恢复、
      代表性越界抽查、独立审核和任务完成清理。
    可观察: true

边界:
  - 第一版只验证第二代 OS 的真实协同开发任务，不同时验证所有任务类型。
  - 第一版只支持当前本地开发环境，不要求跨操作系统兼容。
  - 不建设抵御恶意模型或宿主机管理员的零信任安全系统。
  - 不要求穷尽检查所有潜在信息泄漏通道。
  - 不以证明任何未授权元数据绝对不可见为目标。
  - 不允许角色自由创建任意新角色；第一版使用固定基础角色。
  - 不兼容或迁移第一代 OS 的历史任务、活动状态、文件格式和通信协议。
  - 第一代 OS 仅作为证据、案例和候选机制来源。
  - 不保存全部模型私有过程作为长期记忆。
  - 不让执行或审核角色通过恢复机制获得整个任务的全局上下文。
  - 不提前为尚未出现的任务领域设计通用角色、字段和交接分支。

约束:
  - 设计优先简单、直接、低控制面成本。
  - 必须控制上下文长度、交互轮次和 token 消耗。
  - 正常路径应防止模型无意接触不相关信息；不以防御恶意主动攻击为主要目标。
  - 边界外信息默认不加载；明确需要时必须通过结构化申请和审批获得。
  - 普通补充由规划与任务管理角色批准；扩大边界、敏感或大范围补充由人类批准。
  - 所有跨角色通信均通过结构化交接产物。
  - 同一任务中的角色私有区之间不存在直接读取权限。
  - 每个角色使用固定、结构化、原子更新的上下文入口文件。
  - 角色可以更新自身进度、待办、阻塞和产物引用；任务身份、角色身份、访问边界和授权引用由系统或规划管理角色控制。
  - 一个完整需求 A 对应一个任务隔离区，内部再按角色划分私有区。
  - 每个任务从开始到结束与其他任务默认隔离。
  - 第一版角色体系固定；后续只有真实需求证明不足时，才通过受控注册机制扩展。
  - 每份结构化交接产物具有版本标识或内容哈希；角色入口记录所依赖的精确版本。
  - 上游版本变化时，系统负责确定性失效标记与阻止继续执行；规划角色负责决定从哪个阶段重跑。
  - Web 模型不能直接进入本地任务私有区，只能接收受控交接包并返回结构化结果。
  - Web 交接空间必须按任务和 Web 角色独立授权、可撤销、可审计，并禁止 Web 角色保留主仓库读取权限；
    可采用独立仓库、受控交接网关或其他满足同等边界的实现，由 B 选择并由测试验证。
  - 第一版核心结构应避免永久绑定软件开发，但实现与验证不为其他领域预先增加分支。

术语:
  - 词: 上下文
    含义: >-
      模型能够接触并可能影响其判断的全部信息，包括文件、代码、系统提示、运行时提示、
      结构化交接、工具输入与结果、Git 文件与元数据、搜索结果、环境信息和运行时注入内容。
    别名: [外挂记忆, 任务记忆, 模型信息面]
  - 词: 角色化默认上下文隔离
    含义: >-
      系统正常运行时只向模型提供当前任务、当前角色所需的信息，主要防止无意误读、注意力漂移、
      上下文污染和无效 token 消耗；有明确需要时可以通过审批获得边界外信息。
    别名: [强访问隔离, 角色隔离, 默认上下文隔离]
  - 词: 任务
    含义: >-
      一个完整需求 A 从需求建模、证据收集、结果建模 B、测试、步骤拆分、执行、审核到完成或失效的整个生命周期。
    别名: [需求实例, workflow 实例]
  - 词: 角色私有区
    含义: 当前任务中仅供某一工作角色保存其工作状态、草稿和私有过程的区域。
    别名: [角色隔离区, 角色工作区]
  - 词: 结构化交接产物
    含义: >-
      发送角色主动发布、接收角色获得明确授权后可以读取的跨角色信息载体；
      对话记忆、隐式共享和直接浏览上游私有区不构成有效交接。
    别名: [交接文件, 交接包]
  - 词: 角色入口文件
    含义: >-
      新模型实例恢复当前角色有效状态时首先读取的固定结构化文件，
      其中记录当前状态并引用获准访问的必要产物。
    别名: [上下文入口, 恢复入口]
  - 词: 全局任务摘要
    含义: >-
      供规划与任务管理角色跨任务读取的最小结构化信息，包含任务标识、目标摘要、阶段、状态、阻塞、依赖和最终产物引用，
      不包含执行细节或角色私有过程。
    别名: [任务索引, 全局摘要索引]
  - 词: Web受限交接空间
    含义: >-
      面向某一任务和某一 Web 角色独立授权的版本化交接边界；只暴露获准输入并只接收结构化结果，
      具体实现可以是独立仓库、受控交接网关或其他满足同等约束的传输机制。
    别名: [Web交接仓库, 受限传输接口, Web角色交接空间]

关联领域:
  - 领域: LLM 上下文工程
    为什么相关: 需要控制模型每次运行中实际获得的信息范围、顺序和长度。
  - 领域: 多模型与多代理工作流
    为什么相关: 不同独立模型承担规划、执行、审核等职责并通过受控交接协同。
  - 领域: 最小权限与能力隔离
    为什么相关: 需要用简单边界限制默认可访问范围，同时保留受控例外。
  - 领域: 工作流状态持久化
    为什么相关: 模型会话结束后必须从耐久产物恢复当前角色的有效状态。
  - 领域: 结构化跨角色通信
    为什么相关: 角色不能依赖共享对话或直接读取其他角色私有区。
  - 领域: 依赖图、版本与失效传播
    为什么相关: 上游 A、B、测试或交接更新时，下游旧上下文必须失效。
  - 领域: Git 与受限交接空间
    为什么相关: Web 模型需要通过按任务和角色隔离、版本化、可撤销的交接空间参与协作，具体传输实现不在 A 固定。
  - 领域: 信息生命周期管理
    为什么相关: 任务完成后需要区分长期系统事实与应删除的私有临时过程。
  - 领域: 人机协同任务管理
    为什么相关: 规划角色需要跨任务看摘要，并在普通补充与人类高风险审批之间分工。
  - 领域: 认知负荷与注意力管理
    为什么相关: 机制的主要价值是降低无关信息对模型判断与 token 使用的干扰。

假设:
  - 假设: 默认最小上下文能够显著降低模型误读、注意力漂移和 token 消耗。
    如果不成立会怎样: 角色化分区的主要价值下降，需要重新评估是否值得引入该机制。
  - 假设: 结构化交接足以支持角色协作，不需要共享完整工作区或对话历史。
    如果不成立会怎样: 需要寻找更丰富但仍可控的跨角色信息传递方式。
  - 假设: 固定基础角色足以覆盖第二代 OS 第一版 workflow。
    如果不成立会怎样: 必须提前建立受控角色扩展机制，第一版复杂度上升。
  - 假设: 单一角色入口文件能够可靠表达该角色的完整有效状态。
    如果不成立会怎样: 需要引入状态索引、事件记录或更复杂的恢复机制。
  - 假设: 代表性的正常路径和越界抽查足以验证上下文污染风险已显著降低。
    如果不成立会怎样: 需要增加更系统的确定性检查，但必须重新评估运行与 token 成本。
  - 假设: Web 模型可以通过某种按任务和角色受限的交接空间，以可接受的操作成本参与协作。
    如果不成立会怎样: 需要重新评估 Web 角色是否进入第一版，或改用更窄的人类中转路径。
  - 假设: 上游产物的版本或内容哈希足以支持确定性的依赖失效传播。
    如果不成立会怎样: 需要更完整的依赖图或运行状态机制。
  - 假设: 任务结束后仅保留系统事实、不保留私有过程，仍足以支持审计和恢复。
    如果不成立会怎样: 需要重新确定哪些过程记录具有长期证据价值。
  - 假设: 当前本地开发环境能够提供足以实现默认角色分区的工作区、权限或工具约束。
    如果不成立会怎样: 第一版需要缩小运行环境或增加新的隔离基础设施。

未解歧义:
  - 歧义: >-
      用户指定的“可使用的独立模型和角色.md”与“系统机制总结.md”当前尚未在 GitHub master 中以该文件名读取到，
      其中可能包含会改变基础角色集合或第一代参考边界的信息。
    为何未解: 指定材料尚未在当前可读取版本中定位。
    影响: 中
    阻塞范围: [02_信息收集与提炼, 03_结果建模]
  - 歧义: >-
      第一版具体采用目录权限、工作树、容器、独立仓库还是工具网关实现角色化默认上下文隔离。
    为何未解: 这是需要证据支持的方案选择，不属于 A。
    影响: 中
    阻塞范围: [03_结果建模, 05_步骤拆分, 06_执行]
  - 歧义: 固定基础角色的最终名单及每个角色的精确输入输出契约。
    为何未解: 需要结合角色资料和当前 workflow 阶段进一步核对。
    影响: 中
    阻塞范围: [03_结果建模, 04_测试生成]
  - 歧义: >-
      Web 受限交接空间采用独立仓库、受控交接网关还是其他传输机制，以及所选方案的创建、授权、凭证和清理成本。
    为何未解: A 只规定隔离结果；具体实现与运营成本由 B 比较，并在选择后通过测试或受保护的运行试验验证。
    影响: 中
    阻塞范围: [05_步骤拆分, 06_执行]
