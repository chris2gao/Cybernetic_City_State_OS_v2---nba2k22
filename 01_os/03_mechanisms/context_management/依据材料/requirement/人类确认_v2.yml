确认内容:
  - Web 模型仍必须通过按任务和 Web 角色独立授权的受限交接空间参与工作。
  - Web 模型不得直接读取主仓库、其他任务或其他角色的交接空间。
  - 受限交接空间必须可撤销、可审计，并只暴露获准输入与接收结构化结果。
  - 独立 GitHub 仓库不再是 A 固定的唯一实现；独立仓库、受控交接网关或其他满足同等边界的实现由 B 依据证据选择，并由测试验证。
  - A v1 的其他目标、成功判据、边界与约束继续有效，除 A v2 明确修订的 Web 交接条目外不作降级。

原始确认摘录: >-
  确认上述 A v2 修订方向，按照你的建议来，修改一下吧，然后需要的话，我们就可以上传，实测。

修订理由: >-
  A v1 把“每任务每 Web 角色独立 GitHub 仓库”这一具体实现提前固化为硬需求，
  但阶段二证据只证明了受限交接的目标与 GitHub 仓库级能力，没有证明 repo-per-role 是唯一或最优实现。
  A v2 保留任务与角色边界、独立授权、不可越界、可撤销和可审计这些结果要求，
  将具体传输拓扑下沉给 B 比较选择，避免在需求层绑定未经实测的实现方案。

