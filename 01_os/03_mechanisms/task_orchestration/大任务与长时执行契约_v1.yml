schema_version: citystate.task_orchestration.big_task.v1
mechanism_version: 1
authority_effect: none

# 默认大任务与长时执行契约。
#
# 它回答一个问题：一个连贯的目标被拆成十几个小窗口时，代价落在哪里。实测落在两处。
# 其一是状态：50 个 run 组写出 24 种互不相同的自由文本状态词，因为每个小任务各自
# 即兴写一个，没有谁需要和别人对齐。其二是重复入场：每个新窗口都要重付一次
# repository re-entry 的 61,534 字节 bootstrap。碎片化不是风格问题，它有账单。
#
# 本文件不授予任何权限。它只规定「什么时候不该停」和「什么时候必须停」。
# 停止条件的正本是 01_os/开发入口与单窗口任务规范_v1.md 第 11 节；本文件不新增
# 停止条件，只把「不构成停止条件的那一类」显式化，因为过去被误当成需要 Human 逐次
# 批准的，恰恰是这一类。
#
# Loaded by: 01_os/06_execution/task_orchestration/big_task/closure_preflight.py
# Registered in: 01_os/05_registry/task_orchestration_v1.yml

default_orchestration:
  planning_and_execution_default: long_horizon_big_task
  fragmentation_requires_reason: true
  # 不用数量阈值定义「大」。AGENT_WORKING_DISCIPLINE.md 第 4 节的教训是派单不要
  # 钉死执行者能测的数字；第 2 节的教训是收敛由 failure set 收缩证明，不由固定轮数
  # 上限证明。所以边界由停止条件是否成立决定，不由文件数、轮数或时长决定。
  size_threshold: not_defined_by_count_or_duration
  boundary_is_defined_by: stop_condition_truth_value

# 任务内部的确定性推进。这些**不产生新的 Human 门**。
# 与开发入口第 2 节「边界内继续施工的两个条件」是同一判据：路径仍在授权边界内，
# 且内容属于本 objective 已委托的决策空间。逐字节推导只定义 T0；
# T1 实现选择、Human 已委托的 T2 设计不自动成为新的 Human 裁决。
# 新负载关键选择仍按 genuine_stop 和入口第 2/11 节停止。
internal_continuation:
  actions:
    - deterministic_in_scope_construction
    - required_validation_and_test_execution
    - deterministic_repair_of_a_failure_this_task_caused
    - evidence_and_receipt_update
    - private_runtime_cleanup
    - task_branch_commit
    - task_branch_push
    - completion_pointer_closure
  repeated_human_prompt_for_the_above: prohibited

# 真正的停止。任一成立即停止写入并回传，不自行解释成可继续。
# 这是开发入口第 11 节六类的编排视角投影，不是新集合。
genuine_stop:
  conditions:
    - new_load_bearing_semantic_choice
    - scope_escape_beyond_allowed_changed_paths
    - protected_action_not_already_covered_by_current_authority
    - safety_privacy_secret_or_credential_boundary
    - destructive_git_or_history_rewrite
    - runtime_or_scheduler_activation
    - human_relay_required_to_reach_another_independent_model
    - evidence_cannot_support_the_claim
  authority_ref: 01_os/开发入口与单窗口任务规范_v1.md#11

# 一个被反复搞错的分界，写死在这里。
not_a_stop_condition:
  ordinary_task_branch_publication: true
  reason: >-
    Publication to a task branch is section 6 normal execution flow when the
    packet authorizes source write, publisher authority allows the action, the
    transport gate passes, master is not written, and nothing destructive is
    involved. Treating it as a Human gate would make every implementation task
    that ends in a pushed completion pointer look protected.
  publisher_authority_ref: 01_os/05_registry/repository_publisher_authority_v1.yml

# WorldData/Codex 37-increment experience (2026-10-24..26): the same parent
# task iterated implement -> verify -> inspect gaps -> improve; ordinary development
# increments did NOT invoke a fresh independent reviewer each time. Final proof
# remained pending, and Human later limited the accepted delivery scope.
# This is a DEFAULT PROCESS PATTERN, not permission to loop indefinitely.
evidence_driven_iteration:
  task_node_semantics_ref: 01_os/03_mechanisms/task_orchestration/原子任务与结果驱动执行模型_v1.md
  node_priority: first_ready_unfinished_business_node_and_actual_done
  node_completion: actual_consumer_outcome_not_preparation_receipt
  parent_completion: own_business_done_not_merely_child_pass_count
  chain_optimization: preserve_goal_done_authority_and_required_dependencies
  scope: development_phase_only
  meaning: >-
    This is an internal engineering/research development cadence, not a new
    seven-stage Workflow state, stage transition, approval, reviewer or
    completion mechanism. Existing workflow checkpoints and gates retain authority.
  applies_to: coherent_development_tasks_with_incrementally_testable_objectives
  default_mode: iterative_development
  exempt_when:
    - one_step_mechanical_task_fully_satisfied_and_verified
    - no_remaining_authorized_value_adding_increment
    - genuine_stop_condition_is_true
  cycle:
    - name: diagnose_and_select_increment
      require: >-
        Identify the Human's primary observable outcome and shortest executable
        real business loop using existing task objective and handoff content.
        Compare actual business output to the objective before selecting the
        next high-value increment; prerequisites are not the outcome.
    - name: implement_or_research
      require: >-
        Prefer completing an authorized real end-to-end business step with
        existing tools. Make a focused code change or investigation only when
        needed to unlock that step; do not substitute explanatory prose,
        fixture success, qualification, or new scaffolding for the domain output.
    - name: execute_focused_verification
      require: >-
        Run suitable unit/smoke/negative/boundary/source checks and preserve
        exit codes, inputs, raw output and versions. An observed failure is
        evidence for the next iteration, not a Human micro-approval request.
    - name: compare_and_classify
      require: >-
        Reconcile expected vs observed, preserve any failed attempts and
        unchanged unknowns, decide whether a regression occurred, and
        identify a falsifiable next hypothesis if one exists.
    - name: fix_and_continue_or_close
      require: >-
        Correct candidate-caused failures and run again inside task scope;
        or archive an explicit blocked/unverifiable gap, update checkpoint,
        and continue to the next independently feasible increment.
  allowed_iteration_outcomes:
    - improvement_verified_in_scope
    - hypothesis_refuted_and_revised
    - verified_no_regression_but_goal_incomplete
    - scoped_gap_with_evidence_and_next_trigger
    - objective_met_ready_for_series_review
    - genuine_stop_reached
  progress_measure:
    use: actual_business_output_and_objective_coverage
    supporting_evidence: checks_and_source_identity_only_when_relevant
    absence_of_business_output: reconsider_execution_sequence_not_more_preparation
    must_not_use_as_completion_proof:
      - number_of_rounds
      - number_of_commits
      - tests_passing_without_scope_relevance
      - model_self_assertion
      - generated_numeric_optimum_without_objective_and_error_bounds
  convergence:
    continue_when: >-
      A permitted next increment exists and objective coverage can materially
      improve or a discovered defect can be deterministically corrected.
    close_when: >-
      The Human-approved bounded objective and its tests are met, all residual
      gaps are explicitly classified, and completion evidence can be published;
      or Human has explicitly narrowed/stopped scope with honest incompleteness.
    pause_when: >-
      Any genuine_stop condition applies, a necessary external experiment or
      Human-supplied game state is unavailable, or further iteration lacks
      new evidence and has become repeated speculation.
    fixed_round_count_required: false
    infinite_iteration_or_background_autonomy: prohibited
  minimum_increment_checkpoint:
    # Candidate identity and changed-path/test receipts apply to actual code
    # candidates; do not manufacture a Git candidate for each ordinary business
    # cycle with no source mutation.
    - candidate_sha_and_branch_when_source_candidate_exists
    - real_business_step_and_observed_output
    - changed_paths_when_source_changes
    - source_or_actual_input_evidence
    - tests_and_counterexamples_when_relevant
    - before_after_result_and_regression_status
    - remaining_gaps_and_candidate_evidence_grade
    - next_increment_or_stop_reason
  review_schedule_ref: 01_os/开发入口与单窗口任务规范_v1.md#9
  independent_review_each_increment: false
  independent_review_for_final_acceptance: true
  immediate_review_for_load_bearing_or_protected_boundary: true
  changes_permission_or_workflow_completion_gate: false
  permitted_profile_variation:
    research: hypothesis_source_search_negative_evidence_next_question
    engineering: code_fixture_native_readonly_eligible_tests_delta_repair
    game_mechanism: game_state_snapshot_hypothesis_authorized_action_readback_postgame_feedback
  human_interaction:
    no_micro_approvals_for_in_scope_deterministic_rework: true
    new_load_bearing_choice_or_uncovered_protected_action: genuine_stop
    cross_model_relay_remains_human_triggered: true

# 大任务在派单时就要闭合的东西。缺任何一项，任务不该被当作大任务发出去。
closure_preflight:
  required_fields:
    - objective
    - allowed_changed_paths
    - known_protected_actions
    - evidence_gates
    - stop_conditions
    - final_reviewer_boundary
    - terminal_lifecycle_state
    - completion_pointer_shape
  known_protected_actions_empty_is_valid: true
  # terminal_lifecycle_state declares the value this task will write at the end.
  # It must be one of the declared enum values, open or closing. A task that
  # correctly ends as a review-ready candidate ends on an open state; demanding
  # a closing value here would force every implementation task to either lie or
  # self-accept.
  terminal_lifecycle_state_must_be_in_enum: true
  terminal_lifecycle_state_must_be_closing: false
  # 大不等于危险。任务规模本身不产生授权需求。
  authorization_artifact_required_merely_because_task_is_large: false
  uncovered_protected_action_at_preflight: blocked

# 大任务结束时必须留下的可消费状态。这是它与归档机制的接点：
# 编排保证状态被产生，工作集契约保证状态能被消费。
terminal_state_contract:
  must_write_state_field: lifecycle
  must_use_enum_from: 01_os/开发入口与单窗口任务规范_v1.md#5
  freeform_state_string: prohibited
  state_file_for_os_run: run.yml
  consumed_by: 01_os/03_mechanisms/context_management/工作集与归档契约_v1.yml

human_boundary:
  human_relay_is_manual: true
  background_auto_delivery: false
  auto_acknowledgement: false
  automatic_cross_model_progression: false
  relay_is_a_transport_boundary_not_a_per_step_gate: true
  workflow_stage_checkpoint_carve_out:
    rationale: >-
      relay_is_a_transport_boundary_not_a_per_step_gate exists so a long-horizon task does not
      return to the Human for every internal deterministic step. It is correct and unchanged.
      Without this carve-out it would also read as forbidding the two per-stage Human
      checkpoints, which are a different thing: they are the designed boundary of the workflow
      itself, not transport and not a step.
    exempt_checkpoints:
    - workflow_stage_plan_checkpoint
    - workflow_stage_completion_checkpoint
    exemption_is_exhaustive: true
    these_checkpoints_are:
    - mandatory_Human_alignment_boundaries_inside_a_long_horizon_task
    these_checkpoints_are_not:
    - micro_approval
    - a_new_task
    - a_transport_relay
    - a_per_step_gate
    does_not_exempt:
    - ordinary_local_reversible_choices
    - internal_deterministic_steps
    - any_checkpoint_not_named_in_exempt_checkpoints
    contract_ref: 01_os/03_mechanisms/stage_collaborative_deliberation/阶段profile契约_v1.yml

review_boundary:
  executor_is_own_independent_reviewer: prohibited
  author_designs_own_verification: prohibited
  authority_ref: AGENT_WORKING_DISCIPLINE.md

# Explicit opt-in: deterministic, read-only evidence accounting for development Loop.
# This is not Workflow, PRMS, a runtime scheduler, or an authorization engine.
loop_observability:
  schema_version: core.development_loop.iteration.v1
  schema_ref: 01_os/03_mechanisms/task_orchestration/loop_iteration_schema_v1.json
  validator: 01_os/06_execution/task_orchestration/big_task/loop_observability.py
  raw_jsonl_immutable: true
  summary_derived_and_recomputable: true
  allowed_modes:
    - strict
    - legacy_g2_s0
    - legacy_season_host
  legacy_missing_evidence: LEGACY_EVIDENCE_MISSING
  independently_accepted_by_executor: false
  protected_action_authority_effect: none
  workflow_state_transition_authority_effect: none
  evidence_driven_iteration_ref: evidence_driven_iteration
  stop_classification_ref: closure_preflight
  review_schedule_authority_ref: 01_os/开发入口与单窗口任务规范_v1.md#9
