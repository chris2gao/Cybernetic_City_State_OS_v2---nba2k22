schema_version: citystate.communication.contract.v1
contract_version: 1
status: active
authority_effect: none
operating_boundary:
  delivery: Human_triggered_and_Human_relayed
  default_carrier: local
  automatic_delivery: prohibited
  automatic_acknowledgment: prohibited
  automatic_task_progression: prohibited
  polling_watcher_daemon_scheduler: prohibited
logical_roots:
  local: <configured_machine_global_communication_root>/<repository_id>/
  GitHub: 01_os/_communication/<repository_id>/
shared_structure:
  active_root: active/
  archive_root: archive/
  discovery_file: discovery.yml
  active_task_path: active/<task_id>/
public_task_layout:
  - manifest.yml
  - endpoints/
  - indexes/
  - messages/
  - documents/
  - Human/current.yml
  - Human/decisions/
  - final_results/
  - material_failures/
manifest_required_fields:
  - repository_id
  - task_id
  - task_goal
  - task_role_context_refs
  - communication_root
  - active_task_root
  - current_carrier_state
  - work_branch_when_GitHub
  - task_navigation_owner_endpoint_id
  - endpoint_card_refs
  - Human_current_ref
  - privacy_policy_ref
  - lifecycle_status
  - communication_contract_version
carrier_states:
  - local_only_current
  - GitHub_current
  - local_and_GitHub_converged
private_runtime:
  preferred_location: outside_repository
  repository_fallback: 01_os/_runs/<run-id>/_runtime/
  tracked: false
  published_or_archived: false
  delete_on_task_completion: true
  may_be_durable_source: false
canonical_paths_must_not_contain:
  - live_mailbox_state
  - delivery_state
  - session_state
  - endpoint_runtime_state
  - private_reasoning
  - secrets_or_credentials

