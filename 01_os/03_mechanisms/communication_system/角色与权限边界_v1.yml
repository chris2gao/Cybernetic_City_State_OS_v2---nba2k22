schema_version: citystate.communication.role_permission_boundary.v1
authority_protocol: citystate-human-task-authority-v2
role_fields:
  - sender_task_role
  - expected_recipient_task_role
purposes: [Human_routing, context_selection, endpoint_card_consistency_validation, scoped_authority_delegation]
grants_authority: false
self_declared_identity_grants_authority: false
validator_grants_authority: false
root_authority: current_Human
authority_sources:
  - Human_task_authority_v2
  - current_task
  - direct_current_Human_authorization
  - live_dispatcher_scoped_delegation
  - repository_and_tool_guards
authority_binding:
  current_task_authority_must_match: [task_id, writer_endpoint_id, writer_task_role, requested_action]
  authorization_ref_must_be: [physically_readable_inside_task_root, directly_listed_in_required_refs]
  v2_Human_task_authority_ref_must_be: [physically_readable_inside_task_root, directly_listed_in_required_refs, same_task_id, live_not_revoked]
  delegated_writer_must_match: [recipient_endpoint_id, recipient_task_role, authorized_actions]
delegation_v2:
  schema_version: citystate.communication.task_authority_delegation.v2
  required_fields: [task_id, delegation_id, delegator_endpoint_id, delegator_task_role, recipient_endpoint_id, recipient_task_role, authorized_actions, delegated_scope, allow_redelegation, Human_task_authority_ref, granted, revoked]
  optional_fields: [parent_delegation_ref]
  self_delegation_to_expand_scope: prohibited
  code_possession_without_delegation: unauthorized
  root_delegator_must_equal_Human_bound_initial_holder: true
  recipient_redelegation: only_when_parent_delegation_is_live_and_allow_redelegation_true
  child_actions_must_be_subset_of_parent_actions: true
  child_scope_must_be_subset_of_parent_and_Human_task_scope: true
  delegated_endpoint_start_gate: [live_delegation_chain_VERIFIED, same_task_Human_code_challenge_VERIFIED_in_recipient_current_interaction]
  durable_delegation_authorizes_Human_relay_of_task_code: true
  plaintext_task_code_in_communication_artifact: prohibited
  Human_override: may_authorize_revoke_or_supersede_any_delegation
direct_Human_authorization_v2:
  schema_version: citystate.communication.direct_human_authorization.v2
  required_fields: [task_id, writer_endpoint_id, writer_task_role, authorized_actions, Human_task_authority_ref, granted, revoked]
recipient_authority_handoff:
  message_field: recipient_delegation_ref
  must_be_in_required_refs: true
  must_match_expected_recipient_and_requested_action: true
self_authorization: prohibited
model_provider_role_or_code_possession_alone_authorizes: false
