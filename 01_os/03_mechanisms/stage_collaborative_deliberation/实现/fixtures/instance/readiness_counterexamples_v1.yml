# F1 - a required stage field disposed unknown blocks by default; only a fully
# justified non-blocking deferral progresses.
- case_id: F1-RAW-UNKNOWN
  expected_exit: 16
  data:
    activation_mode: full
    current_model:
      <<: *model
      stage_specific_model_elements:
        <<: *stage06
        rollback_target: {disposition: unknown_with_blocking_or_deferred_disposition_and_revisit_trigger}
    receipt: *receipt

- case_id: F1-ASSERTED-NONBLOCKING-ONLY
  note: blocking:false plus a revisit trigger is a claim, not a justification
  expected_exit: 16
  data:
    activation_mode: full
    current_model:
      <<: *model
      stage_specific_model_elements:
        <<: *stage06
        rollback_target:
          disposition: unknown_with_blocking_or_deferred_disposition_and_revisit_trigger
