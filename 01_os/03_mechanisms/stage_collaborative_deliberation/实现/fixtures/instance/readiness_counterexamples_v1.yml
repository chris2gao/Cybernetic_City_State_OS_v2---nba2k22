fixture_kind: instance_readiness_counterexample_suite
note: >-
  Readiness negatives for the mandatory-projection-and-confirmation contract and for the two
  bounded defects CR-005 and RR2-001. Each case is otherwise well formed and fails on exactly
  one condition, so the exit code identifies the violated condition rather than schema noise.
anchors:
  stage06: &stage06
    exact_task_id_branch_and_40_character_base: {disposition: represented_with_supported_value, value: 'A-impl@31296e1c'}
    Human_execution_authorization: {disposition: represented_with_supported_value, value: Human授权_v1}
    closed_allowlist_and_prohibitions: {disposition: represented_with_supported_value, value: allowlist@v1}
    active_contract_and_test_refs: {disposition: represented_with_supported_value, value: contract@v1}
    implementation_changes: {disposition: represented_with_supported_value, value: bounded change}
    test_results_and_failure_evidence: {disposition: represented_with_supported_value, value: suite green exit 0}
    deviations_and_granularity_evaluations: {disposition: represented_with_supported_value, value: none}
    open_detail_divergence_events: {disposition: represented_with_supported_value, value: none}
    rollback_target: {disposition: represented_with_supported_value, value: master@exact}
    package_completion_pointer_candidate: {disposition: represented_with_supported_value, value: pending}
  model: &model
    problem_or_objective: bounded stage objective
    Human_intent_understanding: foreground restatement of Human intent
    current_baseline_and_inputs: master@exact
    proposed_method_or_solution: stated method for this stage
    feasibility_support: prior art plus existing regression coverage
    expected_output: one exact artifact version
    verification_or_acceptance_method: named gate with expected exit code
    current_exact_model_version: model-v1
    current_exact_output_version: out-v1
    # explicit empty dispositions: considered and found empty, not omitted
    constraints_and_dependencies: none_material
    assumptions_risks_alternatives_unknowns: none_material
    open_load_bearing_items: []
    stage_specific_model_elements: *stage06
    Human_confirmation: &confirmation
      explicit: true
      kind: explicit_statement
      actor_class: current_Human
      scope: current_stage
      bound_model_version: model-v1
      stale: false
      ref: Human/current.yml#00001
  receipt: &receipt
    receipt_schema_version: stage_collaborative_deliberation.stage_receipt.v1
    mechanism_version: 1
    active_contract_version: 1
    boot_manifest_version: 1
    registry_version: 1
    loader_version: 1
    profile_id_and_version: workflow_stage_06_execution@1
    loaded_paths: []
    missing_partial_or_stale_paths: []
    trigger_evaluation_result_ref: trigger-1
    activation_mode_or_dormant_reason: full
    main_mechanism_ref: [MM-01]
    detail_granularity_evaluation_result: ordinary_local_choice
    open_detail_divergence_event_refs: []
    deferred_detail_record_refs: []
    gate_results: {start: pass, completion: pass}
    validator_mode_and_exit_code: {mode: instance, exit_code: 0}
    exact_candidate_version: fixture-v1
    created_by_actor_ref: model:test
    created_at: '2026-08-04T19:40:00-07:00'
  child_receipt: &child_receipt
    <<: *receipt
    alignment_binding: {bound_model_version: model-v1, Human_confirmation_ref: Human/current.yml#00001}
    profile_binding:
      profile_id_and_version: workflow_stage_06_execution@1
      mechanism_ref: 01_os/03_mechanisms/stage_collaborative_deliberation/README.md
cases:
- case_id: RDY-NO-MODEL
  note: dormant must not mean "no model was built"
  expected_exit: 16
  data: {activation_mode: dormant, dormant_reason: simple, receipt: *receipt}

- case_id: RDY-MISSING-METHOD
  expected_exit: 16
  data:
    activation_mode: full
    current_model: {<<: *model, proposed_method_or_solution: null}
    receipt: *receipt

- case_id: RDY-MISSING-FEASIBILITY
  expected_exit: 16
  data:
    activation_mode: full
    current_model: {<<: *model, feasibility_support: null}
    receipt: *receipt

- case_id: RDY-MISSING-VERIFICATION
  expected_exit: 16
  data:
    activation_mode: full
    current_model: {<<: *model, verification_or_acceptance_method: null}
    receipt: *receipt

- case_id: RDY-UNRESOLVED-LOAD-BEARING
  expected_exit: 16
  data:
    activation_mode: full
    current_model:
      <<: *model
      open_load_bearing_items:
      - {id: retention_window, load_bearing: true, disposition: open_blocking}
    receipt: *receipt

- case_id: RDY-NO-HUMAN-CONFIRMATION
  note: mandatory even with zero load-bearing gaps
  expected_exit: 15
  data:
    activation_mode: dormant
    dormant_reason: current_model_adequate_no_new_load_bearing_gap
    current_model: {<<: *model, Human_confirmation: null}
    receipt: *receipt

- case_id: RDY-SILENCE-AS-CONFIRMATION
  expected_exit: 14
  data:
    activation_mode: full
    current_model: {<<: *model, Human_confirmation: {<<: *confirmation, kind: silence}}
    receipt: *receipt

- case_id: RDY-INFERRED-CONSENT
  expected_exit: 14
  data:
    activation_mode: full
    current_model: {<<: *model, Human_confirmation: {<<: *confirmation, explicit: false, kind: inferred}}
    receipt: *receipt

- case_id: RDY-PREVIOUS-STAGE-CONFIRMATION
  expected_exit: 12
  data:
    activation_mode: full
    current_model: {<<: *model, Human_confirmation: {<<: *confirmation, scope: previous_stage}}
    receipt: *receipt

- case_id: RDY-OLD-MODEL-VERSION-CONFIRMATION
  expected_exit: 12
  data:
    activation_mode: full
    current_model:
      <<: *model
