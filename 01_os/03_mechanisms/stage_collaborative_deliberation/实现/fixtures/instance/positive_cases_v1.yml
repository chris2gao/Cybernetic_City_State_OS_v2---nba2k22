fixture_kind: instance_positive_suite
cases:
- case_id: POS-DORMANT-CONFIRMED
  note: >-
    simple task, no load-bearing gap, therefore no additional inquiry rounds - but the
    concise projection and one explicit current-Human confirmation are still mandatory
  expected_exit: 0
  data:
    activation_mode: dormant
    dormant_reason: current_model_adequate_no_new_load_bearing_gap
    additional_inquiry_required: false
    current_model: &model
      problem_or_objective: rename one local helper for clarity
      Human_intent_understanding: keep behaviour identical, improve readability
      current_baseline_and_inputs: master@exact
      proposed_method_or_solution: in-place rename with call-site update
      feasibility_support: single call site, covered by existing regression test
      expected_output: one renamed helper
      verification_or_acceptance_method: existing suite must stay green
      current_exact_model_version: model-v1
      current_exact_output_version: out-v1
      # a simple task still states these explicitly: considered, found empty.
      # This costs three lines in the model and nothing in the Human-facing brief.
      constraints_and_dependencies: none_material
      assumptions_risks_alternatives_unknowns: none_material
      open_load_bearing_items: []
      ordinary_local_choices:
      - {choice: helper_name_spelling, requires_Human_confirmation: false}
      Human_confirmation: &confirmation
        explicit: true
        kind: explicit_statement
        actor_class: current_Human
        scope: current_stage
        bound_model_version: model-v1
        stale: false
        ref: Human/current.yml#00001
      # exactly the ten required_model_fields of workflow_stage_06_execution@1
      stage_specific_model_elements: &stage06
        exact_task_id_branch_and_40_character_base: {disposition: represented_with_supported_value, value: 'A-impl@31296e1c1dd573310e26327b50ec2f70e176bc2a'}
        Human_execution_authorization: {disposition: represented_with_supported_value, value: Human授权_v1}
        closed_allowlist_and_prohibitions: {disposition: represented_with_supported_value, value: allowlist@v1}
        active_contract_and_test_refs: {disposition: represented_with_supported_value, value: contract@v1}
        implementation_changes: {disposition: represented_with_supported_value, value: one renamed helper}
        test_results_and_failure_evidence: {disposition: represented_with_supported_value, value: suite green exit 0}
        deviations_and_granularity_evaluations: {disposition: represented_with_supported_value, value: none}
        open_detail_divergence_events: {disposition: explicitly_irrelevant_with_reason_and_scope, reason_and_scope: no divergence in this bounded rename}
        rollback_target: {disposition: represented_with_supported_value, value: master@exact}
        # a genuinely justified non-blocking deferral: the pointer cannot exist
        # until the final semantic candidate is fixed, and nothing downstream is
        # blocked by that ordering
        package_completion_pointer_candidate:
          disposition: unknown_with_blocking_or_deferred_disposition_and_revisit_trigger
          blocking: false
          deferral: deferred_nonblocking
          reason_and_scope: the completion pointer binds the final semantic candidate and cannot be written before it exists
          revisit_trigger: final_semantic_candidate_fixed
          downstream_impact_assessment:
            stage_objective_blocked: false
            decision_blocked: false
            verification_blocked: false
            authority_blocked: false
            downstream_acceptance_blocked: false
    receipt: &receipt
      receipt_schema_version: stage_collaborative_deliberation.stage_receipt.v1
      mechanism_version: 1
      active_contract_version: 1
      boot_manifest_version: 1
      registry_version: 1
      loader_version: 1
      profile_id_and_version: workflow_stage_06_execution@1
      loaded_paths: []
      missing_partial_or_stale_paths: []
      trigger_evaluation_result_ref: trigger-1
      activation_mode_or_dormant_reason: current_model_adequate_no_new_load_bearing_gap
      main_mechanism_ref: [MM-01]
      detail_granularity_evaluation_result: ordinary_local_choice
      open_detail_divergence_event_refs: []
      deferred_detail_record_refs: []
      gate_results: {start: pass, completion: pass}
      validator_mode_and_exit_code: {mode: instance, exit_code: 0}
      exact_candidate_version: fixture-v1
      created_by_actor_ref: model:test
      created_at: '2026-08-04T19:40:00-07:00'

- case_id: POS-GAP-RESOLVED-BY-HUMAN
  note: load-bearing gap -> inquiry -> Human feedback -> same model updated -> executable; no round count involved
  expected_exit: 0
  data:
    activation_mode: full
    current_model:
      <<: *model
      current_exact_model_version: model-v2
      open_load_bearing_items:
      - id: retention_window
        load_bearing: true
        disposition: resolved
        Human_basis: {kind: explicit_statement, ref: Human/current.yml#00002, stale: false}
      - id: log_verbosity
        load_bearing: false
        disposition: deferred_non_blocking
        revisit_trigger: first_production_incident
      Human_alignment: {bound_model_version: model-v2, stale: false}
      Human_confirmation:
        <<: *confirmation
        bound_model_version: model-v2
        ref: Human/current.yml#00003
    inquiry_items:
    - {id: retention_window, re_asks_resolved_input: false}
    receipt:
      <<: *receipt
      activation_mode_or_dormant_reason: full

- case_id: POS-COMPLETION-WRITEBACK
  note: actual result + verification written back into the same model lineage, then progression allowed
  expected_exit: 0
  data:
    activation_mode: incremental
    current_model:
      <<: *model
      current_exact_model_version: model-v3
      current_exact_output_version: out-v3
      Human_alignment: {bound_model_version: model-v3, stale: false}
      Human_confirmation:
        <<: *confirmation
        bound_model_version: model-v3
        ref: Human/current.yml#00004
      completion:
        progression_requested: true
        actual_result: helper renamed, all call sites updated
        verification_result: suite green, exit 0
        material_deviation: none
        residual_risk: none_material
        bound_output_version: out-v3
    completion_pointer:
      append_only: true
      bound_candidate_version: out-v3
    receipt:
      <<: *receipt
      activation_mode_or_dormant_reason: incremental
