routers:
  trigger_activation:
    order: [validate_versions_profile_and_active_contract, identify_load_bearing_gaps, evaluate_profile_triggers, evaluate_simple_or_dormant_route, emit_trigger_evaluation, obtain_exact_Human_activation_authorization_when_activating, create_session]
    required_inputs: [active_contract_refs, stage_profile_ref, current_model_elements, Human_authorization_ref_when_activating]
    outputs: [trigger_evaluation_result, activation_decision_candidate, Human_activation_authorization_or_dormant_reason, deliberation_session_record_when_active]
    failure_conditions: [load_bearing_gap_silently_skipped, unjustified_full_activation, stage_profile_main_obligation_missing, formalistic_round_counting]
    stop_conditions: [dormant_route_with_reason_and_valid_receipt, active_session_created_with_exact_authorization]
    modes: {dormant: no_load_bearing_gap_and_no_mandatory_trigger, full: new_or_structurally_changed_bearing_model, incremental: ordinary_bearing_update_with_known_affected_scope}
    round_minimums: {full: 5, incremental: 2}
    formalistic_rounds_count: false
  inquiry:
    order: [bind_target_model_element, classify_gap, estimate_value_cost_timing_and_risk, prioritize, ask_or_act, evaluate_acceptance, stop_or_escalate]
    required_inputs: [target_model_element_ref, gap_type, downstream_impact, evidence_requirement]
    outputs: [inquiry_item, question_value_cost_timing_and_stop_result, evidence_or_unknown_disposition]
    failure_conditions: [load_bearing_gap_silently_skipped, collapsed_state_dimensions]
    stop_conditions: [no_blocking_gap_and_required_results_complete, remaining_questions_durably_deferred_nonblocking, next_question_cannot_change_result_test_or_authority_scope_and_cost_exceeds_value, valid_Human_stop_or_scope_decision]
    gap_types: [missing_field, unknown_fact, unverified_assumption, terminology_ambiguity, claim_conflict, insufficient_evidence, lack_of_capability, true_unknown]
    universal_numeric_threshold: false
  material_event:
    order: [normalize_event, bind_exact_source, load_dependency_graph_version, classify_affected_unaffected_unknown, emit_dependency_impact, invalidate_affected_scope, preserve_explicitly_justified_unaffected_scope, block_unknown_scope, create_successor_and_reconfirmation_requirements]
    required_inputs: [event_ref, exact_source_ref, dependency_graph_version, current_confirmations_and_assessments]
    outputs: [material_event_record, dependency_impact_result, invalidation_record, successor_and_supersession_record, reconfirmation_requirement]
    failure_conditions: [unknown_dependency_fail_open, silent_or_unscoped_invalidation, unnormalized_external_material]
    stop_conditions: [successor_and_reconfirmation_requirements_recorded, affected_progression_blocked_when_dependency_unknown]
    global_invalidation_default: false
    unknown_dependency: fail_closed_for_affected_progression
  granularity:
    order: [classify_main_mechanism_first_order_local_second_order_or_insufficient, test_scope_authority_reversibility_and_subsystem_predicates, resolve_record_defer_or_escalate]
    required_inputs: [originating_detail, confirmed_scope, authority, risk_and_reversibility, subsystem_and_lifecycle_effect]
    outputs: [detail_granularity_evaluation, detail_divergence_event_or_deferred_detail_record_or_local_resolution]
    failure_conditions: [unapproved_second_order_scope_expansion, deferred_detail_not_durable, unjustified_micro_approval_escalation]
    stop_conditions: [ordinary_local_choice_recorded, first_order_detail_closed, second_order_event_waiting_Human, insufficient_information_blocks_classification]
    ordered_classes: [main_mechanism, first_order_required_detail, ordinary_local_choice, second_order_detail_divergence, classification_blocked_insufficient_information]
  external_action:
    order: [create_exact_action_model, obtain_Human_authorization, execute_authorized_scope_only, record_returned_material, normalize_sources_and_fact_policy_inference, ingest_and_route_material_event_if_bearing]
    required_inputs: [unresolved_model_element_refs, objective, questions, scope, owner_and_tool, complete_prompt, output_contract, cost_risk_stop_conditions]
    outputs: [external_action_model, Human_external_action_authorization, returned_material_record, external_material_ingestion_result]
    failure_conditions: [recommendation_used_as_authorization, unnormalized_external_material, execution_without_current_authority]
    stop_conditions: [returned_material_rejected_with_reason, normalized_material_ingested_and_bearing_event_routed]
    report_count_as_independence: false
