  detail_divergence_event: [originating_detail, newly_generated_detail_questions, trigger_predicates, impact_if_deferred, blocking_classification, minimum_sufficient_option, expansion_option, defer_or_split_option, cost_time_risk_and_residual_risk, model_recommendation]
  Human_detail_scope_decision: [detail_event_ref, decision, accepted_scope, rejected_or_deferred_scope, residual_risk_acceptance, next_allowed_state, exact_version_binding]
  deferred_detail_record: [detail_event_ref, Human_decision_ref, reason_for_deferral, nonblocking_basis, residual_risk, prohibited_implicit_scope, revisit_trigger]
  external_action_model: [unresolved_model_element_refs, objective_and_expected_use, questions, scope_and_non_goals, proposed_owner_and_tool, capability_and_independence_reason, internal_reference_inputs, external_model_attachments, complete_prompt_or_operating_instructions, output_format_and_return_path, provenance_requirements, acceptance_and_rejection_conditions, failure_and_stop_conditions, expected_value_cost_time_and_risk]
