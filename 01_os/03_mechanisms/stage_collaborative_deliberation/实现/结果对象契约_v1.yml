family_contracts:
  inquiry_and_evidence_family:
    gap_types: [missing_field, unknown_fact, unverified_assumption, terminology_ambiguity, claim_conflict, insufficient_evidence, lack_of_capability, true_unknown]
    question_value_result:
      default: ordinal_explainable
      positive_factors: [expected_information_gain, downstream_impact, risk_and_irreversibility, blocker_reduction]
      negative_factors: [acquisition_cost, Human_interruption_cost, execution_risk]
      numeric_mode_allowed_only_when: [candidate_domain_is_discrete_and_typed, probabilities_are_reasonably_calibrated, action_utility_is_defined, calculation_and_assumptions_are_auditable]
  grounding_and_deliberation_family:
    objection_disposition_basis: {required: true, prohibited_as_sole_basis: [vote_count, majority_count, participant_headcount, silence, objector_withdrawal_or_absence]}
    option_disposition_basis: {required: true, prohibited_as_sole_basis: [vote_count, majority_count, participant_headcount, popularity_without_reasoned_criteria]}
  implementation_granularity_family:
    classifications: [main_mechanism, first_order_required_detail, ordinary_local_choice, second_order_detail_divergence, classification_blocked_insufficient_information]
    ordinary_local_choice_must_not_require_Human_escalation: true
  external_action_family:
    recommendation_or_action_model_is_not_authorization: true
    authorization_binds_exact_action_model_version: true
    returned_material_requires_ingestion_before_candidate_ready: true
  review_execution_loading_family:
    executor_does_not_self_review: true
    implementation_complete_does_not_equal_verification_pass: true
    missing_partial_stale_or_unjustified_skip_fails_closed: true
    receipt_missing_required_field_is_invalid: true
    mechanism_ref_does_not_substitute_for_main_mechanism_ref: true
main_mechanism_required_result_names:
  MM-01: [trigger_evaluation_result, activation_decision_candidate, Human_activation_authorization, dormant_or_simple_route_reason, deliberation_session_record]
  MM-02: [model_element_record, inquiry_item, uncertainty_and_assumption_record, evidence_reference, atomic_claim_record, question_value_cost_timing_and_stop_result]
  MM-03: [round_result, semantic_grounding_record, issue_record, position_or_option_record, argument_record, objection_disposition_record, option_disposition_record, residual_disagreement_record]
  MM-04: [recommendation_record, Human_decision_record, authorization_record, confirmation_record, waiver_or_exception_record, external_action_model, Human_external_action_authorization, returned_material_record, external_material_ingestion_result]
  MM-05: [material_event_record, dependency_impact_result, invalidation_record, successor_and_supersession_record, reconfirmation_requirement]
  MM-06: [detail_granularity_evaluation, detail_divergence_event, Human_detail_scope_decision, deferred_detail_record]
  MM-07: [independent_review_record, finding_record, finding_disposition_record, execution_authorization_record, execution_result_record, execution_verification_record]
  MM-08: [stage_profile_result, mechanism_load_result, stage_receipt, failure_and_blocking_result]
resolution_rule:
  direct: every_required_result_name_equal_to_a_catalog_object_type_resolves_to_that_object_type
  exceptions: [dormant_or_simple_route_reason, question_value_cost_timing_and_stop_result]
composition_mappings:
  dormant_or_simple_route_reason:
    resolves_to:
      - {object_type: trigger_evaluation_result, required_field: dormant_or_simple_route_reason}
      - {object_type: stage_receipt, required_field: activation_mode_or_dormant_reason}
    duplicate_object_required: false
  question_value_cost_timing_and_stop_result:
    resolves_to:
      - {block_ref: '#/family_contracts/inquiry_and_evidence_family/question_value_result'}
      - {object_type: inquiry_item, required_fields: [expected_information_value, acquisition_and_Human_interruption_cost, timing, stop_or_escalation_condition]}
    all_components_required: true
    duplicate_object_required: false
measurements: {object_families: 8, catalog_unique_object_types: 45, main_mechanism_required_result_names: 47, resolved_by_catalog: 45, resolved_by_composition: 2, unresolved_result_names: 0}
generic_complete_substitution: prohibited
candidate_state: {loadable_now: false, activatable_now: false, reason: candidate is integrated as staged_inert; activation requires separate exact Human authorization and has not been authorized.}
