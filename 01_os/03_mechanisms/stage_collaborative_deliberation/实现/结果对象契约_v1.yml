consumption_rule: consume_exact_union
common_envelope:
  required_fields: [object_id, object_type, schema_version, mechanism_version, main_mechanism_ref, session_id, stage_id, created_by_actor_ref, authority_or_evidence_refs, exact_artifact_version_or_blob, status, scope, dependency_refs, supersedes_or_parent_refs, created_at, validation_result]
  durability_rule: load_bearing_result_objects_must_not_exist_only_in_chat
  version_rule: accepted_objects_are_superseded_not_silently_rewritten
  unknown_required_field: fail_closed
  one_current_object_version_per_file: true
actor_and_authority:
  actor_classes: [model, Human, external_tool, executor, independent_reviewer]
  authority_classes: [observation_or_tool_result, epistemic_assessment, recommendation, Human_decision, Human_authorization, execution, independent_verification]
  separation_rules: [recommendation_is_not_decision_or_authorization, Human_authorization_does_not_change_epistemic_truth, execution_does_not_equal_verification, reviewer_recommendation_does_not_equal_adoption, independence_requires_metadata]
model_schema_adequacy:
  field_occupancy_alone_is_complete: false
  bearing_dimension_test: changing_the_dimension_could_change_target_decision_risk_test_authority_dependency_version_validity_or_downstream_acceptance
  allowed_dispositions: [represented_with_supported_value, explicitly_irrelevant_with_reason_and_scope, unknown_with_blocking_or_deferred_disposition_and_revisit_trigger]
  domain_schema_required_when_general_stage_and_task_schemas_are_insufficient: true
  unknown_adequacy: fail_closed
object_families:
  activation_and_session_family: [trigger_evaluation_result, activation_decision_candidate, Human_activation_authorization, deliberation_session_record, round_result]
  inquiry_and_evidence_family: [model_element_record, inquiry_item, evidence_reference, atomic_claim_record, uncertainty_and_assumption_record]
  grounding_and_deliberation_family: [semantic_grounding_record, issue_record, position_or_option_record, argument_record, objection_disposition_record, option_disposition_record, residual_disagreement_record]
  authority_and_confirmation_family: [recommendation_record, Human_decision_record, authorization_record, confirmation_record, waiver_or_exception_record]
  change_and_version_family: [material_event_record, dependency_impact_result, invalidation_record, successor_and_supersession_record, reconfirmation_requirement]
  implementation_granularity_family: [detail_granularity_evaluation, detail_divergence_event, Human_detail_scope_decision, deferred_detail_record]
  external_action_family: [external_action_model, Human_external_action_authorization, returned_material_record, external_material_ingestion_result]
  review_execution_loading_family: [independent_review_record, finding_record, finding_disposition_record, execution_authorization_record, execution_result_record, execution_verification_record, stage_profile_result, mechanism_load_result, stage_receipt, failure_and_blocking_result]
