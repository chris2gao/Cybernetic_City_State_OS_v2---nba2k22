mechanism_load_result:
  object_type: mechanism_load_result
  required_fields:
  - mechanism_version
  - boot_manifest_version
  - loader_version
  - registry_entry_version
  - stage_profile_version
  - loaded_paths
  - missing_partial_or_stale_paths
  - validator_exit_code
  - load_status
  load_status_values:
  - not_attempted
  - dormant_valid
  - loaded_valid
  - failed_missing
  - failed_partial
  - failed_stale
  - failed_unknown
  - failed_invalid
  - failed_unauthorized
  missing_partial_stale_unknown_invalid_or_unauthorized: fail_closed
  stale_fallback: prohibited
stage_receipt:
  object_type: stage_receipt
  receipt_schema_version: stage_collaborative_deliberation.stage_receipt.v1
  required_fields:
  - receipt_schema_version
  - mechanism_version
  - active_contract_version
  - boot_manifest_version
  - registry_version
  - loader_version
  - profile_id_and_version
  - loaded_paths
  - missing_partial_or_stale_paths
  - trigger_evaluation_result_ref
  - activation_mode_or_dormant_reason
  - main_mechanism_ref
  - detail_granularity_evaluation_result
  - open_detail_divergence_event_refs
  - deferred_detail_record_refs
  - gate_results
  - validator_mode_and_exit_code
  - exact_candidate_version
  - created_by_actor_ref
  - created_at
  required_visibility:
    dormant:
    - trigger_evaluation_result_ref
    - activation_mode_or_dormant_reason
    - main_mechanism_ref
    - open_detail_divergence_event_refs
    - deferred_detail_record_refs
    - gate_results
    - validator_mode_and_exit_code
    full_or_incremental:
    - loaded_paths
    - missing_partial_or_stale_paths
    - trigger_evaluation_result_ref
    - activation_mode_or_dormant_reason
    - main_mechanism_ref
    - detail_granularity_evaluation_result
    - open_detail_divergence_event_refs
    - deferred_detail_record_refs
    - gate_results
    - validator_mode_and_exit_code
    - exact_candidate_version
  dormant_route_requires_receipt: true
  valid_only_after_validator_pass: true
  missing_required_field: invalid_receipt
  partial_publish: invalid_no_valid_receipt
atomic_publish_sequence:
- write_runtime_candidate
- validate_schema_invariants_references_and_authority
- atomically_publish_durable_artifacts
- publish_receipt_after_success
side_effect_rules:
  unauthorized_action: reject_without_side_effect
  dangling_dependency: fail_closed
  canonical_live_instance_state: prohibited
measurements:
  dormant_visibility_complete: true
  active_visibility_complete: true
  receipt_required_fields: 20
candidate_state:
