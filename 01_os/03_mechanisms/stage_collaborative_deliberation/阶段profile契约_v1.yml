schema_version: stage_collaborative_deliberation.profile_contract.v1
mechanism_id: stage_collaborative_deliberation_and_incremental_reconfirmation
mechanism_version: 1
status: staged_inert
policy_revision: 2026-09-08-current-task-scope-with-explicit-historical-input
task_scope_execution_contract:
  production_cli: instance --repo-root REPOSITORY_ROOT --candidate FULL_COMMIT_SHA
  historical_cli: legacy_instance
  implicit_historical_fallback: prohibited
  input_policy: strict_UTF8_JSON_or_safe_subset_YAML_with_explicit_duplicate_detection_before_legal_merge
  schema_version: 1
  required_scope_fields: [schema_version, task_id, candidate, task_packet, action_id, stage_id, paths]
  exact_source_reference_fields: [path, blob_sha]
  scope_sources: regular_Git_blobs_in_exact_candidate_not_mutable_worktree_files
  packet_format: canonical_wrapped_v1
  packet_base: existing_commit_ancestor_of_candidate
  candidate_diff: every_changed_path_inside_packet_allowed_changed_paths
  allowed_path_forms: canonical_relative_literal_or_trailing_double_star_for_packet_allowlist_only
  planned_paths: literal_paths_with_existing_Git_parents_checked_against_links_and_gitlinks
  stage_actions:
    required_fields: [action_id, kind, target, expected_target_head, stage_ids, paths, confirmation]
    optional_fields: [covered_decision_ids]
    uniqueness: action_ids_and_each_string_list_are_unique
    stages: only_the_seven_canonical_profile_identities_in_every_action
    action_scope: selected_action_paths_equal_instance_paths_and_stage_is_in_action_stages
    ordinary_task_work:
      target: refs_heads_of_packet_nonmaster_task_branch
      expected_target_head: null
      confirmation: null
    protected_actions:
      names_source: candidate_repository_publisher_authority_confirmation_bound_actions
      missing_or_unknown_policy: fail_closed
      core_history_rewrite: prohibited_regardless_of_confirmation
      confirmation_fields: [actor_class, kind, source_ref, task_id, action_id, exact_base_sha, target, expected_target_head, stage_ids, paths, stale, revoked]
      confirmation_source: candidate_regular_YAML_blob_exactly_equal_to_confirmation_without_source_ref
      current_values: {actor_class: current_Human, kind: explicit_statement, stale: false, revoked: false}
      branch_head_semantics: declared_expected_target_head_is_not_a_live_remote_check
  load_bearing_decisions:
    identity: item_decision_id_equals_basis_decision_id
    already_covered_basis_fields: [kind, decision_id, task_packet, action_id]
    already_covered_kind: current_task_scope
    already_covered_gate: exact_packet_reference_and_selected_action_with_decision_id_in_covered_decision_ids
    new_explicit_basis_fields: [kind, decision_id, source_ref]
    new_explicit_kind: explicit_statement
    explicit_source_fields: [actor_class, kind, decision_id, task_id, action_id, exact_base_sha, target, expected_target_head, stage_ids, paths, stale, revoked]
    explicit_source_gate: exact_candidate_regular_YAML_blob_matching_current_task_and_action_scope
    applies_to: load_bearing_open_items_and_load_bearing_or_Human_boundary_stage_unknowns
    bare_ref_actor_label_silence_or_inference: insufficient
  completion:
    progression_requires: actual_result_string_and_exact_candidate_output_bindings_and_verification_reference_and_closure_fields
    closure_fields_required_on_progression: [plan_vs_actual_delta, material_deviation, residual_risk, downstream_baseline]
    closure_field_none_material_accepted: true
    closure_field_absent_or_null: refused
    closure_rationale: >-
      Binding an output version and a verification record proves what was produced and that a
      record says it verified. It does not say whether the result matched the plan it was
      authorised against, what moved, what risk is left, or what the next stage inherits. A
      stage that cannot answer those four has not closed; it has only stopped.
    verification_reference_fields: [commit, path, blob_sha]
    verification_source: regular_YAML_blob_in_explicit_existing_evidence_commit_which_may_postdate_candidate
    verification_record_fields: [schema_version, candidate, task_id, stage_id, status]
    verification_record_values: {schema_version: stage_verification_result.v1, status: verified}
    cycle_rule: evidence_commit_is_separate_so_candidate_never_embeds_its_own_SHA
    optional_pointer_fields: [append_only, bound_candidate_version, supersedes, supersedes_record_ref]
    pointer_gate: append_only_true_and_exact_candidate_binding_and_nonempty_supersession_pair_when_present
  retained_gates: complete_common_model_and_stage_fields_typed_receipt_unknown_disposition_and_separate_independent_acceptance
  proof_limits:
  - No action execution or control of arbitrary shell commands or mutable filesystem paths.
  - No authentication of a Human or evidence author from same-writer records.
  - A verified record is a bound declaration, not an independently replayed test result.
  - No implicit independent-review waiver, master permission, delivery or runtime activation.
purpose: Define the closed machine-readable contract for workflow-stage profiles without copying the global mechanism body.
required_profile_fields:
- mechanism_ref
- profile_id
- profile_version
- main_mechanism_ref
- trigger_conditions
- required_model_fields
- discussion_focus
- external_action_triggers
- material_event_triggers
- granularity_evaluation_required
- open_detail_divergence_event_refs
- start_gate
- completion_gate
- prohibited_actions
field_contracts:
  mechanism_ref:
    type: string
    required: true
    exact_value: 01_os/03_mechanisms/stage_collaborative_deliberation/README.md
  profile_id:
    type: string
    required: true
    pattern: ^workflow_stage_0[1-7]_[a-z0-9_]+$
  profile_version:
    type: integer
    required: true
    minimum: 1
  main_mechanism_ref:
    type: array
    required: true
    minimum_items: 1
    allowed_values:
    - MM-01
    - MM-02
    - MM-03
    - MM-04
    - MM-05
    - MM-06
    - MM-07
    - MM-08
  trigger_conditions:
    type: array
    required: true
    minimum_items: 1
  required_model_fields:
    type: array
    required: true
    minimum_items: 1
  discussion_focus:
    type: array
    required: true
    minimum_items: 1
  external_action_triggers:
    type: array
    required: true
  material_event_triggers:
    type: array
    required: true
    minimum_items: 1
  granularity_evaluation_required:
    type: boolean
    required: true
    exact_value: true
  open_detail_divergence_event_refs:
    type: array
    required: true
  start_gate:
    type: array
    required: true
    minimum_items: 1
  completion_gate:
    type: array
    required: true
    minimum_items: 1
  prohibited_actions:
    type: array
    required: true
    minimum_items: 1
common_invariants:
- profile_must_be_reference_not_copy
- profile_default_state_is_dormant
- profile_cannot_authorize_execution_activation_or_master_integration
- field_occupancy_alone_does_not_prove_model_completeness
- schema_adequacy_unknown_fails_closed
- ordinary_local_choice_must_not_require_Human_scope_escalation
- second_order_detail_requires_durable_event_and_Human_scope_decision
- open_detail_divergence_event_refs_must_be_explicit_even_when_empty
- start_and_completion_gates_must_be_stage_specific
- missing_partial_stale_unknown_invalid_or_unauthorized_fails_closed
model_space_contract:
  layers:
  - general_modeling_substrate
  - workflow_stage_schema
  - task_specific_schema
  - domain_specific_schema_when_needed
  bearing_dimension_test: changing_the_dimension_could_change_target_decision_risk_test_authority_dependency_version_validity_or_downstream_acceptance
  allowed_dispositions:
  - represented_with_supported_value
  - explicitly_irrelevant_with_reason_and_scope
  - unknown_with_blocking_or_deferred_disposition_and_revisit_trigger
  all_fields_present_alone: must_not_pass
  unknown_adequacy: fail_closed
common_task_stage_model:
  purpose: >-
    The single Current Model that the foreground and the Human build and maintain together.
    It applies to the whole task and to every workflow stage. Inquiry, discussion and brief
    are methods for building and correcting this one model, not parallel mechanisms or a
    second state machine.
  applies_to:
  - whole_task
  - every_workflow_stage
  composition_rule: common_task_stage_model + profile.required_model_fields = effective_current_stage_model
  copied_into_each_profile: false
  copy_prohibition_reason: profiles stay reference-not-copy; common fields are composed at validation time
  composition_is_enforced_at_validation_time: true
  stage_specific_fields_carrier: current_model.stage_specific_model_elements
  stage_specific_element_dispositions:
  - represented_with_supported_value
  - explicitly_irrelevant_with_reason_and_scope
  - unknown_with_blocking_or_deferred_disposition_and_revisit_trigger
  synonyms_or_compatibility_aliases: prohibited
  fields:
  - problem_or_objective
  - why_this_stage_is_needed_now
  - Human_intent_understanding
  - current_baseline_and_inputs
  - constraints_and_dependencies
  - proposed_method_or_solution
  - feasibility_support
  - assumptions_risks_alternatives_unknowns
  - open_load_bearing_items
  - expected_output
  - verification_or_acceptance_method
  - downstream_impact
  - actual_result
  - material_deviation
  - residual_risk
  - downstream_baseline
  - current_exact_model_version
  required_before_substantive_execution:
    note: >-
      All thirteen keys must be present. "Checked and there is nothing" is a real answer and
      must be expressible; "never considered" must not pass. A missing key fails; a present
      but null value fails, because it is neither a value nor a disposition.
    substantive_value_required:
    - problem_or_objective
    - why_this_stage_is_needed_now
    - Human_intent_understanding
    - current_baseline_and_inputs
    - proposed_method_or_solution
    - feasibility_support
    - expected_output
    - verification_or_acceptance_method
    - current_exact_model_version
    key_required_none_material_accepted:
    - constraints_and_dependencies
    - assumptions_risks_alternatives_unknowns
    - downstream_impact
    key_required_empty_list_accepted:
    - open_load_bearing_items
    plus: verified_current_task_scope_basis_and_any_actually_required_exact_Human_decision
    Human_facing_brief_length_unaffected: true
  feasibility_basis_contract:
    applies_to: current_model.feasibility_support
    problem: >-
      A non-empty feasibility_support satisfies field presence with a confident sentence. The
      dimension most likely to be asserted rather than supported was the one dimension with no
      support requirement of its own.
    shape: {value: substantive, basis: {kind: one_of_the_stage_kinds, ref: nonempty_string}}
    bare_string_accepted: false
    grounding_and_authority_are_separate:
      rule: >-
        A basis must be a statement of fact that the world could falsify, never a decision that
        cannot be wrong. Human approval is authority, not evidence. Treating it as a feasibility
        basis inverts the order it exists to serve: the Human approves because the work is
        feasible, so feasibility cannot be established by the approval.
      a_Human_may_still_ground_a_claim_by: >-
        supplying a premise, a constraint or a resource as fact. Those are testimony about the
        world and can turn out to be false, which is exactly what makes them evidence.
      approval_as_basis: prohibited
    basis_kinds_by_stage:
      workflow_stage_01_requirement_modeling: [Human_stated_premise, Human_supplied_constraint, Human_provided_resource, prior_task_precedent, existing_artifact_ref]
      workflow_stage_02_information_collection: [source_id, Human_stated_premise, Human_provided_resource, existing_artifact_ref]
      workflow_stage_03_result_modeling: [evidence_claim_id, measurement_receipt_ref, existing_artifact_ref]
      workflow_stage_04_test_generation: [evidence_claim_id, measurement_receipt_ref, existing_artifact_ref]
      workflow_stage_05_step_decomposition: [evidence_claim_id, measurement_receipt_ref, existing_artifact_ref]
      workflow_stage_06_execution: [measurement_receipt_ref, test_result_ref]
      workflow_stage_07_test_execution: [measurement_receipt_ref, test_result_ref]
    basis_kind_meanings:
      Human_stated_premise: a fact about the domain or situation the Human asserts, falsifiable
      Human_supplied_constraint: a given the Human states, such as platform, deadline or budget
      Human_provided_resource: access, data or a tool the Human says exists and may be used
      prior_task_precedent: a completed task that already did this kind of thing
      existing_artifact_ref: a thing in the repository that shows the capability exists
      source_id: an identified source in this run's evidence package
      evidence_claim_id: a claim id in the stage 02 evidence package
      measurement_receipt_ref: a recorded measurement of the actual system
      test_result_ref: a recorded test outcome
    tiering_rationale: >-
      Stage 01 has no collected evidence to cite yet, so requiring an evidence id there would
      force a fabricated reference. What it does have is what the Human knows about the world.
      Stages 03 and later run after evidence exists, so a feasibility claim that cites nothing
      is an assertion.
    prohibited_basis_kinds: [silence, no_response, inferred, implied, assumed, model_confidence,
                             plausibility, Human_confirmed, Human_approved, Human_authorized,
                             authority_reference, decision_ref]
    unresolvable_ref_disposition: unknown_not_conforming
  stage_specific_unknown_deferral_contract:
    default_for_required_field_disposed_unknown: block
    capability_retained: unknown_with_blocking_or_deferred_disposition_and_revisit_trigger
    self_declared_nonblocking_is_insufficient: true
    progression_requires_all_of:
    - deferral == deferred_nonblocking
    - blocking == false
    - reason_and_scope present
    - revisit_trigger present
    - downstream_impact_assessment present
    - downstream_impact_assessment explicitly clears stage objective, decision, verification, authority and downstream acceptance
    load_bearing_or_Human_decision_boundary_additionally_requires:
    - current_Human_basis
    - basis is not silence, inference or stale
    semantics:
      raw_unknown: fail
      incomplete_or_asserted_nonblocking_deferral: fail
      fully_justified_nonblocking_deferred_unknown: pass
      blocking_unknown: fail
readiness_contract:
  principle: understand -> propose method -> support feasibility -> align load-bearing items with Human -> implement -> verify
  round_counting_is_not_readiness: true
  fixed_minimum_substantive_rounds: removed
  removal_scope: >-
    the full=5 and incremental=2 minimums are deleted outright. No migration surface
    depended on them, so mechanism_version stays 1 and no version bump is implied.
  removal_reason: >-
    how many conversational rounds occurred never proved the model was adequate. Whether
    *additional* deliberation continues is decided only by whether a load-bearing gap still
    exists. This removal does not weaken any actually required Human decision or independent review.
  substantive_execution_allowed_iff:
  - current_stage_model_complete
  - proposed_method_or_solution_present
  - feasibility_support_present
  - verification_or_acceptance_method_present
  - verified_task_scope_or_explicit_historical_authority_and_any_required_Human_decision
  all_five_required_together: true
  current_stage_model_complete_means: common_required_fields_plus_this_profile_required_model_fields
  readiness_must_not_require:
  - Human_confirmation_for_ordinary_local_reversible_choice
  - additional_inquiry_rounds_when_no_load_bearing_gap_exists
  - reconfirmation_of_previously_resolved_Human_input_within_the_same_model_version
  - any_fixed_number_of_substantive_rounds
  - long_forms_or_exhaustive_internal_field_display
  brief_is_projection_not_state_machine: true
  brief_length_adapts_to_model_complexity: true
Human_authority_contract:
  applicability: explicitly_referenced_historical_authority_input_only
  new_ordinary_or_protected_action_default: current_task_scope_and_simple_confirmation_when_required
  new_authority_code_or_chain_issuance_by_this_route: prohibited
  historical_helpers_retained_for_reading_and_explicit_provenance_checks: true
  scheme: citystate-human-task-authority-v2
  algorithm: sha256
  delegated_start_semantics_version: '2.1'
  root_authority: current_Human
  purpose: >-
    Describe the stored v2/v1 authority semantics for explicitly referenced historical
    records. The fields below are historical verification rules, not issuance instructions
    or a start gate for a new task. New ordinary work uses current task scope; protected
    actions use the current publisher policy's simple Human confirmation when required.
    Code possession, model identity, provider, role or self-authored records never grant authority alone.
  migration:
    legacy_scheme: citystate-human-authority-v1
    legacy_records: historical_read_and_Human_challenge_only
    new_legacy_production_issuance: prohibited_after_v2_master_integration
  code_requirements:
    generated_by: Human_independently
    fresh_per_task_authority: true
    minimum_length_characters: 2
    allowed_characters: any
    reuse_within_same_task_authority: true
    reuse_across_task_id: prohibited
    model_may_generate_the_code: false
    model_may_suggest_a_code_for_the_Human_to_echo: false
  plaintext_handling:
    stored_in_git: false
    stored_in_run_or_communication_artifact: false
    stored_in_fixture_output_log_or_command_history: false
    passed_as_shell_command_line_argument: false
    delegated_model_may_receive_plaintext_ephemerally: false
    repository_stores: commitments_and_delegation_chain_only
  task_commitment:
    serialization: canonical_JSON_UTF8_sorted_keys_fixed_separators
    bound_fields: [task_id, task_authority_id, initial_authority_holder_endpoint_id, initial_authority_holder_task_role, Human_disposition, task_authority_scope, Human_nonce]
  decision_event_commitment:
    serialization: canonical_JSON_UTF8_sorted_keys_fixed_separators
    same_Human_nonce_as_task_authority: true
    bound_fields: [task_id, task_authority_id, stage_id, decision_id, decision_type, exact_model_version, Human_disposition, authorized_scope, Human_nonce]
    unique_decision_event_required: true
  task_authority_lifecycle:
    starts_after: Human_reviews_and_confirms_initial_Current_Model
    remains_valid_until: [Human_revocation, task_closed, task_authority_superseded]
    model_version_change_does_not_rotate_code: true
    material_change_requires_new_Human_decision_event: true
    completion_uses_same_task_code_with_new_completion_event: true
    protected_action_uses_same_task_code_with_explicit_protected_action_event: true
  delegation_contract:
    initial_holder: Human_selected_foreground_or_dispatcher
    initial_holder_is_bound_in_task_commitment: true
    dispatcher_may_delegate: true
    delegation_must_be_durable: true
    delegation_must_bind: [task_id, task_authority_id, delegator_endpoint_id, delegator_task_role, recipient_endpoint_id, recipient_task_role, authorized_actions, delegated_scope, parent_delegation_ref, allow_redelegation]
    task_authority_scope_is_machine_enforced_string_set: true
    delegated_scope_must_be_subset_of_Human_task_scope: true
    code_possession_without_live_delegation: unauthorized
    self_delegation_to_expand_scope: prohibited
    recipient_may_redelegate_only_if_explicitly_granted: true
    delegated_endpoint_start_requires: [live_delegation_chain_VERIFIED, exact_task_authority_identity_match, exact_recipient_action_scope_match]
    ordinary_delegation_authorizes_plaintext_task_code_relay: false
    code_plaintext_in_durable_message: prohibited
    revocation_fails_closed: true
  Human_override:
    priority: highest_for_task_authority_routing_and_delegation
    may_directly_authorize_any_model_or_endpoint: true
    may_override_dispatcher_recipient_selection: true
    may_revoke_or_supersede_any_delegation: true
    may_expand_or_shrink_task_scope_via_explicit_Human_decision_event: true
    does_not_implicitly_disable_repository_structural_invariants_or_secret_boundaries: true
  review_independence:
    same_model_family_absolute_prohibition: false
    same_model_family_review_allowed_when_explicitly_selected_and_disclosed: true
    required_independence_dimensions: [fresh_isolated_session_or_project, distinct_endpoint, no_executor_private_context, durable_primary_evidence_reconstruction]
    model_family_diversity: evidence_dimension_not_authority_gate
  challenge_verification:
    code_source_for_authority_challenge: current_Human_current_interaction
    delegated_model_echo_of_code_is_not_Human_origin_proof: true
    verify_task_and_decision_event_commitments: true
    ordinary_delegated_endpoint_start_requires_challenge: false
    explicit_Human_authority_event_or_provenance_check_only: true
    plaintext_recorded: false
  requires_explicit_current_Human_decision_event:
    - initial_task_substantive_execution_authorization
    - each_material_architecture_or_solution_choice
    - material_scope_change
    - Human_risk_acceptance
    - protected_or_irreversible_action_authorization
    - completion_acceptance_or_next_stage_progression
    - master_publication_when_the_Human_gate_requires_it
    - Human_direct_delegation_override_or_revocation
  does_not_require_new_code_inside_same_task:
    - workflow_stage_progression_after_explicit_Human_decision_event
    - material_change_after_explicit_Human_decision_event
    - completion_event
    - protected_action_event
    - dispatcher_delegation_within_existing_Human_scope
  security_claims:
    provides: [anti_self_assertion_control, task_boundary_binding, durable_delegation_audit, scoped_recipient_authority, delegated_start_without_secret_distribution]
    does_not_claim: [cryptographic_natural_person_identity, brute_force_resistance, protection_against_a_malicious_model_that_knows_the_plaintext_task_code]
    honest_limit: >-
      Once a model knows the plaintext task code it can compute valid-looking commitments. Therefore code possession
      is never sufficient and ordinary delegated endpoints do not receive or require the code. Production delegated-start
      authority requires a live Human-rooted delegation plus exact task/recipient/action/scope matching. Human challenge
      remains available only for explicit Human authority events or provenance checks where the Human is actually acting.
mandatory_Human_confirmation_contract:
  rule: >-
    Project the current model and material changes to the Human, but execute ordinary
    reversible work by current Human task input and durable task scope. Stage or mode
    changes alone do not require a new confirmation for an already covered action.
    Obtain an explicit current Human decision for a new load-bearing choice outside
    delegation, a scope expansion, or an uncovered confirmation-bound action under
    current canonical policy. Preserve required independent acceptance separately.
  applies_even_when_no_load_bearing_gap_exists: false
  ordinary_work_when_no_gap: concise_projection_and_verified_existing_task_scope_without_repeat_confirmation
  policy_ref: 01_os/05_registry/repository_publisher_authority_v1.yml
  must_not_produce:
  - fixed_round_counts
  - long_forms
  - per_choice_microapproval
  confirmation_when_required_must_bind: exact_action_or_load_bearing_decision_and_current_scope
  covered_action_may_reuse: existing_current_Human_task_input_or_simple_durable_confirmation_covering_that_exact_action
  stage_change_alone_invalidates_covered_confirmation: false
  cannot_substitute_for_a_missing_required_confirmation:
  - Human_silence_or_non_response
  - inferred_or_implied_consent
  - previous_confirmation_that_does_not_cover_the_current_action_or_scope
  - stale_revoked_or_materially_superseded_confirmation
  - executor_confirmation
  - independent_reviewer_confirmation
  - any_non_Human_actor_confirmation
inquiry_contract:
  mandatory_projection: current_model_and_material_changes
  new_Human_confirmation: only_when_current_policy_or_an_undelegated_load_bearing_choice_requires_it
  additional_inquiry_and_multi_round_deliberation_trigger: open_load_bearing_gap_only
  must_not_trigger_additional_rounds_on:
  - ordinary_local_reversible_choice
  - previously_resolved_Human_input_within_the_same_model_version
  - absence_of_conversation_volume
  Human_feedback_updates_the_same_model: true
  new_load_bearing_divergence_enters_inquiry_and_deliberation: true
activation_contract:
  default: dormant
  modes:
  - dormant
  - full
  - incremental
  dormant_meaning: >-
    the Current Model is already adequate and no new load-bearing gap exists, therefore no
    *additional* inquiry or multi-round deliberation is required
  dormant_does_not_mean:
  - no_task_or_stage_model_is_built
  - no_projection_to_the_Human_is_required
  - actually_required_Human_decisions_or_independent_acceptance_can_be_skipped
  dormant_still_requires: concise_projection_plus_verified_current_task_scope_and_any_actually_required_decision
  current_model_required_in_every_mode: true
  new_Human_confirmation_required_in_every_mode: false
  current_scope_and_applicable_confirmation_checks_required_in_every_mode: true
  formalistic_round_counts: false
  Human_authorization_required_when_profile_gate_requires_activation: true
reference_not_copy:
  workflow_stage_may_store:
  - mechanism_ref
  - profile_id
  - profile_version
  - gate_refs
  - receipt_ref
  workflow_stage_must_not_store:
  - mechanism_body
  - duplicated_router_logic
  - duplicated_profile_body
candidate_state:
  loadable_now: false
  activatable_now: false
  reason: P1 provides public method and profiles only; later packages and Human activation are absent.
