schema_version: stage_collaborative_deliberation.profile_contract.v1
mechanism_id: stage_collaborative_deliberation_and_incremental_reconfirmation
mechanism_version: 1
status: staged_inert
purpose: Define the closed machine-readable contract for workflow-stage profiles without copying the global mechanism body.
required_profile_fields:
- mechanism_ref
- profile_id
- profile_version
- main_mechanism_ref
- trigger_conditions
- required_model_fields
- discussion_focus
- external_action_triggers
- material_event_triggers
- granularity_evaluation_required
- open_detail_divergence_event_refs
- start_gate
- completion_gate
- prohibited_actions
field_contracts:
  mechanism_ref:
    type: string
    required: true
    exact_value: 01_os/03_mechanisms/stage_collaborative_deliberation/README.md
  profile_id:
    type: string
    required: true
    pattern: ^workflow_stage_0[1-7]_[a-z0-9_]+$
  profile_version:
    type: integer
    required: true
    minimum: 1
  main_mechanism_ref:
    type: array
    required: true
    minimum_items: 1
    allowed_values:
    - MM-01
    - MM-02
    - MM-03
    - MM-04
    - MM-05
    - MM-06
    - MM-07
    - MM-08
  trigger_conditions:
    type: array
    required: true
    minimum_items: 1
  required_model_fields:
    type: array
    required: true
    minimum_items: 1
  discussion_focus:
    type: array
    required: true
    minimum_items: 1
  external_action_triggers:
    type: array
    required: true
  material_event_triggers:
    type: array
    required: true
    minimum_items: 1
  granularity_evaluation_required:
    type: boolean
    required: true
    exact_value: true
  open_detail_divergence_event_refs:
    type: array
    required: true
  start_gate:
    type: array
    required: true
    minimum_items: 1
  completion_gate:
    type: array
    required: true
    minimum_items: 1
  prohibited_actions:
    type: array
    required: true
    minimum_items: 1
common_invariants:
- profile_must_be_reference_not_copy
- profile_default_state_is_dormant
- profile_cannot_authorize_execution_activation_or_master_integration
- field_occupancy_alone_does_not_prove_model_completeness
- schema_adequacy_unknown_fails_closed
- ordinary_local_choice_must_not_require_Human_scope_escalation
- second_order_detail_requires_durable_event_and_Human_scope_decision
- open_detail_divergence_event_refs_must_be_explicit_even_when_empty
- start_and_completion_gates_must_be_stage_specific
- missing_partial_stale_unknown_invalid_or_unauthorized_fails_closed
model_space_contract:
  layers:
  - general_modeling_substrate
  - workflow_stage_schema
  - task_specific_schema
  - domain_specific_schema_when_needed
  bearing_dimension_test: changing_the_dimension_could_change_target_decision_risk_test_authority_dependency_version_validity_or_downstream_acceptance
  allowed_dispositions:
  - represented_with_supported_value
  - explicitly_irrelevant_with_reason_and_scope
  - unknown_with_blocking_or_deferred_disposition_and_revisit_trigger
  all_fields_present_alone: must_not_pass
  unknown_adequacy: fail_closed
common_task_stage_model:
  purpose: >-
    The single Current Model that the foreground and the Human build and maintain together.
    It applies to the whole task and to every workflow stage. Inquiry, discussion and brief
    are methods for building and correcting this one model, not parallel mechanisms or a
    second state machine.
  applies_to:
  - whole_task
  - every_workflow_stage
  composition_rule: common_task_stage_model + profile.required_model_fields = effective_current_stage_model
  copied_into_each_profile: false
  copy_prohibition_reason: profiles stay reference-not-copy; common fields are composed at validation time
  composition_is_enforced_at_validation_time: true
  stage_specific_fields_carrier: current_model.stage_specific_model_elements
  stage_specific_element_dispositions:
  - represented_with_supported_value
  - explicitly_irrelevant_with_reason_and_scope
  - unknown_with_blocking_or_deferred_disposition_and_revisit_trigger
  synonyms_or_compatibility_aliases: prohibited
  fields:
  - problem_or_objective
  - Human_intent_understanding
  - current_baseline_and_inputs
  - constraints_and_dependencies
  - proposed_method_or_solution
  - feasibility_support
  - assumptions_risks_alternatives_unknowns
  - open_load_bearing_items
  - expected_output
  - verification_or_acceptance_method
  - actual_result
  - material_deviation
  - residual_risk
  - current_exact_model_version
  required_before_substantive_execution:
    note: >-
      All eleven keys must be present. "Checked and there is nothing" is a real answer and
      must be expressible; "never considered" must not pass. A missing key fails; a present
      but null value fails, because it is neither a value nor a disposition.
    substantive_value_required:
    - problem_or_objective
    - Human_intent_understanding
    - current_baseline_and_inputs
    - proposed_method_or_solution
    - feasibility_support
    - expected_output
    - verification_or_acceptance_method
    - current_exact_model_version
    key_required_none_material_accepted:
    - constraints_and_dependencies
    - assumptions_risks_alternatives_unknowns
    key_required_empty_list_accepted:
    - open_load_bearing_items
    plus: explicit_current_Human_confirmation_bound_to_exact_current_model_version
    Human_facing_brief_length_unaffected: true
  stage_specific_unknown_deferral_contract:
    default_for_required_field_disposed_unknown: block
    capability_retained: unknown_with_blocking_or_deferred_disposition_and_revisit_trigger
    self_declared_nonblocking_is_insufficient: true
    progression_requires_all_of:
    - deferral == deferred_nonblocking
    - blocking == false
    - reason_and_scope present
    - revisit_trigger present
    - downstream_impact_assessment present
    - downstream_impact_assessment explicitly clears stage objective, decision, verification, authority and downstream acceptance
    load_bearing_or_Human_decision_boundary_additionally_requires:
    - current_Human_basis
    - basis is not silence, inference or stale
    semantics:
      raw_unknown: fail
      incomplete_or_asserted_nonblocking_deferral: fail
      fully_justified_nonblocking_deferred_unknown: pass
      blocking_unknown: fail
readiness_contract:
  principle: understand -> propose method -> support feasibility -> align load-bearing items with Human -> implement -> verify
  round_counting_is_not_readiness: true
  fixed_minimum_substantive_rounds: removed
  removal_scope: >-
    the full=5 and incremental=2 minimums are deleted outright. No migration surface
    depended on them, so mechanism_version stays 1 and no version bump is implied.
  removal_reason: >-
    how many conversational rounds occurred never proved the model was adequate. Whether
    *additional* deliberation continues is decided only by whether a load-bearing gap still
    exists. This removal does not weaken the mandatory confirmation below.
  substantive_execution_allowed_iff:
  - current_stage_model_complete
  - proposed_method_or_solution_present
  - feasibility_support_present
  - verification_or_acceptance_method_present
  - explicit_current_Human_confirmation_of_exact_model_version
  all_five_required_together: true
  current_stage_model_complete_means: common_required_fields_plus_this_profile_required_model_fields
  readiness_must_not_require:
  - Human_confirmation_for_ordinary_local_reversible_choice
  - additional_inquiry_rounds_when_no_load_bearing_gap_exists
  - reconfirmation_of_previously_resolved_Human_input_within_the_same_model_version
  - any_fixed_number_of_substantive_rounds
  - long_forms_or_exhaustive_internal_field_display
  brief_is_projection_not_state_machine: true
  brief_length_adapts_to_model_complexity: true
Human_authority_contract:
  scheme: citystate-human-authority-v1
  algorithm: sha256
  problem: >-
    A repository object that writes actor_class: current_Human and explicit: true is making a
    claim about itself. If that claim alone grants progression authority, any model able to
    write the object can manufacture Human authority.
  required_chain:
  - foreground_current_Human_interaction
  - Human_explicit_disposition
  - Human_independently_generated_one_time_code
  - durable_Human_disposition_record
  - exact_task_stage_decision_model_binding
  - nonce_commitment
  - validator_resolves_and_validates
  - progression
  model_may_generate_the_code: false
  Human_facing_names:
    authorization: Human Authorization Code
    completion: Human Completion Code
  code_requirements:
    generated_by: Human_independently
    fresh_per_authority_event: true
    minimum_random_strength_bits: 128
    model_may_suggest_a_code_for_the_Human_to_echo: false
    reuse_permitted: false
    suggested_encoding: random Base32, hexadecimal, or a password-manager token
  plaintext_handling:
    stored_in_git: false
    stored_in_run_or_communication_artifact: false
    stored_in_fixture_output_log_or_command_history: false
    passed_as_shell_command_line_argument: false
    helper_input_channel: stdin_or_ephemeral_input_never_echoed
    repository_stores: commitment_only
  commitment:
    serialization: canonical JSON, UTF-8, sorted keys, separators without whitespace
    reason_for_canonical_json: string concatenation leaves field boundaries ambiguous
    bound_fields:
    - domain
    - task_id
    - stage_id
    - decision_id
    - decision_type
    - exact_model_version
    - Human_disposition
    - authorized_scope
    - Human_nonce
    persisted_fields:
    - scheme
    - algorithm
    - digest
    - exact_bound_fields
    - durable_Human_disposition_ref
    - exact_blob_ref
    - consumed_or_invalidated_state
  two_separate_codes:
    substantive_execution_authorization:
      produced_after: Human reviewed and confirmed the exact Current Model
      permits_only: substantive_execution_start
      cannot: prove the Human accepted the final result
    completion_acceptance:
      produced_after: Human read the completion brief following execution and verification
      permits: [accept_result, next_stage_progression, separately_authorized_protected_action]
      cannot: retroactively serve as the authorization to start
  one_time_and_replay:
    single_use: true
    exact_bound: true
    never_valid_for:
    - another_task
    - another_stage
    - another_decision_id
    - another_decision_type
    - another_exact_model_version
    - a_materially_changed_plan
    - another_output_candidate
    - another_protected_action
    material_model_change: old authorization invalidated, return to Human, new disposition, new code
    material_output_change: old completion code invalidated, new completion review, new code
    task_wide_universal_code: prohibited
  challenge_verification:
    purpose: a downstream fresh model that finds the authority provenance insufficient
    procedure:
    - read the durable decision record
    - take its bound fields and stored commitment
    - ask the current Human for that decision's code
    - recompute the commitment from the bound fields and the supplied code
    - equal means verified, otherwise Human authority verification fails
    plaintext_sources_that_are_never_proof:
    - executor_output
    - repository
    - run_artifact
    - communication_document
    - prior_model_report
    - another_model_relaying_it
    durable_record_after_verification: [result, commitment_checked, exact_decision_and_ref, verifier_identity_and_context]
    plaintext_recorded: false
  requires_a_Human_nonce:
  - task_substantive_execution_authorization
  - each_workflow_stage_substantive_execution_authorization
  - material_architecture_or_solution_choice
  - material_scope_change
  - Human_risk_acceptance
  - protected_or_irreversible_action_authorization
  - completion_acceptance_or_next_stage_progression
  - master_publication_when_the_Human_gate_requires_it
  does_not_require_a_Human_nonce:
  - helper_naming
  - fixture_organization
  - ordinary_local_reversible_implementation_choices
  - ordinary_commands
  - retrying_a_local_implementation_defect_inside_confirmed_scope
  - search_or_query_details
  - other_model_owned_non_bearing_choices
  must_not_become_a_microapproval_system: true
  security_claims:
    provides:
    - anti_self_assertion_Human_authority_control
    - exact_decision_and_version_binding
    - replay_detection_and_control
    - cross_model_Human_challenge_verification
    - durable_auditability
    - detection_of_machine_generated_fake_Human_decisions
    does_not_claim:
    - cryptographic_proof_of_natural_person_identity
    - proof_of_Human_subjective_comprehension
    - protection_against_a_malicious_model_that_has_already_seen_the_plaintext_nonce
    - external_identity_attestation
    honest_limit: >-
      The foreground that first received the plaintext nonce necessarily knows it. Security
      therefore rests on the Human generating a fresh nonce independently, exact single-decision
      binding, no plaintext persistence, downstream models not receiving plaintext by default,
      a new nonce per authority event, and independent Human challenge when provenance is
      questioned. This is not a mathematical guarantee that a machine can never forge a
      decision.
mandatory_Human_confirmation_contract:
  rule: >-
    Every task and every workflow stage must project the current model - what will be done,
    how, what supports its feasibility, the expected result, the verification method, and the
    load-bearing risks and choices - to the current Human, discuss it, and obtain explicit
    Human confirmation before any substantive execution.
  applies_even_when_no_load_bearing_gap_exists: true
  minimal_form_when_no_gap: single concise proposal followed by one explicit Human confirmation
  must_not_produce:
  - fixed_round_counts
  - long_forms
  - per_choice_microapproval
  confirmation_must_bind: current_exact_model_version
  cannot_substitute_for_current_stage_confirmation:
  - Human_silence_or_non_response
  - inferred_or_implied_consent
  - previous_stage_confirmation
  - confirmation_of_an_older_model_version
  - executor_confirmation
  - independent_reviewer_confirmation
  - any_non_Human_actor_confirmation
inquiry_contract:
  mandatory_projection_and_confirmation: always
  additional_inquiry_and_multi_round_deliberation_trigger: open_load_bearing_gap_only
  must_not_trigger_additional_rounds_on:
  - ordinary_local_reversible_choice
  - previously_resolved_Human_input_within_the_same_model_version
  - absence_of_conversation_volume
  Human_feedback_updates_the_same_model: true
  new_load_bearing_divergence_enters_inquiry_and_deliberation: true
activation_contract:
  default: dormant
  modes:
  - dormant
  - full
  - incremental
  dormant_meaning: >-
    the Current Model is already adequate and no new load-bearing gap exists, therefore no
    *additional* inquiry or multi-round deliberation is required
  dormant_does_not_mean:
  - no_task_or_stage_model_is_built
  - no_projection_to_the_Human_is_required
  - no_explicit_Human_confirmation_is_required
  dormant_still_requires: concise_projection_plus_one_explicit_current_Human_confirmation
  current_model_required_in_every_mode: true
  mandatory_Human_confirmation_required_in_every_mode: true
  formalistic_round_counts: false
  Human_authorization_required_when_profile_gate_requires_activation: true
reference_not_copy:
  workflow_stage_may_store:
  - mechanism_ref
  - profile_id
  - profile_version
  - gate_refs
  - receipt_ref
  workflow_stage_must_not_store:
  - mechanism_body
  - duplicated_router_logic
  - duplicated_profile_body
candidate_state:
  loadable_now: false
  activatable_now: false
  reason: P1 provides public method and profiles only; later packages and Human activation are absent.
