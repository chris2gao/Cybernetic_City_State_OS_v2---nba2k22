executor_incident_log:
- incident: 运行了 YAML 解析检查却没有据其结果拦住提交
  detail: >-
    验证结果_v1.yml 与 独立复核派单_v1.yml 两处 YAML 结构错误
    （在同一层混用 mapping 键与序列项；一处双引号标量后又跟了内容），
    在提交脚本里已经打印了 ParserError，但脚本没有把它设为门，于是照常 commit 并 push。
  commits_affected: [c0c0024e83314c1ae3dbe2b70f9959ba68f14ce1, ab1310d7f83086cd1a46823c37e895f402cafe85]
  fixed_in: 后续提交
  root_cause: 检查存在但不是门；"跑过"被当成了"通过"
  systemic_note: >-
    这正是本任务 quiet_verify 想解决的问题的另一面：光有检查不够，必须让退出码决定流程。
    当前 quiet_verify 内置检查集不含 run 产物的 YAML 良构性检查，属已知缺口。
- incident: 两次 PowerShell 单行命令引号错误
