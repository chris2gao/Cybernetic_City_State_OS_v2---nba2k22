objective: >-
  把"每次任务都要重复付出"的三类成本固化成核心工具：开工前上下文预检、
  统一安静验证入口、物理变更路径账本；并把执行环境约定写进单窗口任务规范，
  使 Python 包导入方式、Git 中文路径与未跟踪文件的处理在施工前就已确定。

Human_authorization:
  authority: current_explicit_Human_instruction
  date: 2026-08-09
  decisions:
    - open_this_task_and_branch
    - land_the_three_tools_in_core
    - add_execution_environment_conventions_section
    - apply_git_config_repo_local_and_global
  does_not_authorize:
    - master_update_without_a_further_explicit_instruction
    - force_push_or_history_rewrite
    - deleting_repository_content
  note: >-
    Human 已表示任务完成后拟把本分支合并到 master。该合并本身是受保护发布，
    需要在合并时点由 Human 再次明确授权，不由本任务代为执行。

origin_evidence:
  trigger: Codex 对 Stage06 任务的 token 统计与优化建议
  independent_check: 城邦简报/core/03_决策档案/2026-08-09_工作流token优化_核对与方案.md
  measured_facts:
  - core.quotepath=false 使 54 文件提交清单从 4720 字符降到 3599 字符
  - 单条全中文路径从 113 字符降到 45 字符
  - 默认 git status --porcelain 把未跟踪目录折叠为一行，路径账本会漏文件
  - .pytest_cache 权限警告使每次 git status 附带两行噪声，加入排除后干净时输出 0 字符
  unverified_claims_not_used_as_baseline:
  - Codex 的 40/22/22/13/3 占比表为其自述推算，非逐调用实测
  - 因此本任务不承诺"节省 32%-43%"这一目标数字

intent:
  one_goal: true
  definition_of_done:
  - 三个工具存在、可执行、有单元测试且退出码语义明确
  - 三个工具在本仓真实调用过一次并留下实测输出
  - registry 与工具同任务登记
  - 单窗口任务规范新增执行环境约定章节
  - 既有全局校验器全部 exit 0
  - 变更路径全部落在本任务 allowlist 内
  - 远端分支 head 回读，master 未变

