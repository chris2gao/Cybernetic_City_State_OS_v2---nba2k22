raw_requirement: >-
  为 01_os 建立一个全局唯一、按条件调用的“阶段协同推演与增量再确认机制”。
  当当前工作需要 Human—模型讨论、需要补充承重信息且无法仅依靠简单搜索与项目内已有信息
  完成可靠建模，或者新材料要求更新既有建模、决定或确认时，调用该机制。
  机制负责信息缺口驱动追问、共同理解与分歧建模、外部行动前置建模、Human 决策、
  重要信息事件、版本失效和增量再确认。机制默认休眠，不在每条消息、每个阶段入口或
  每个机械动作中常驻运行。需要 Deep Research、NotebookLM 或其他外部研究能力时，
  模型必须先提出建议、理由、研究问题、预期收益、成本与返回契约，由 Human 决定是否启用；
  来源归一化和一手来源复验可由主模型直接执行，不要求默认交给外部模型。
  实现颗粒度以主要机制闭合为优先：模型可以处理使主要机制正确、安全、可验证和可集成所必需的
  一阶细节；当一阶细节继续产生新的独立设计分支、状态、协议、工具、例外、权限、生命周期或
  测试体系时，必须作为二阶细节发散向 Human 报告并等待范围裁决，不得递归自我扩展。

mechanism_identity:
  formal_name: 阶段协同推演与增量再确认机制
  short_name: 阶段协同推演闭环
  english_id: stage_collaborative_deliberation_and_incremental_reconfirmation
  canonical_candidate_location: 01_os/03_mechanisms/stage_collaborative_deliberation/
  scope: global_reusable_mechanism
  default_runtime_state: dormant
  integration_pattern: reference_not_copy
  workflow_rule: >-
    workflow 与阶段只记录机制引用、触发条件、调用模式和 receipt 要求，
    不复制机制 canonical，也不在每个阶段维护第二份实现。

implementation_order:
  decision: >-
    先完整完成本机制自身的需求建模、信息收集与提炼、结果建模、实现方案建模、
    步骤拆分、测试生成、执行和测试执行；本机制通过独立审核并接入全局 canonical 后，
    再恢复“实现方案建模阶段”的原需求。
  status: human_confirmed
  blocked_previous_work:
    - run-20260803-实现方案建模阶段信息收集-001
  previous_evidence_reuse: >-
    原阶段二材料仅作为模型侧预备证据，在 Human 外部报告返回并完成再讨论后可参与综合，
    不得单独证明阶段完成。

problem_model:
  failures_to_prevent:
    - 模型在目标、边界、语义或决策尚未共同理解时直接执行
    - 承重信息缺失时只靠临场直觉猜测，不生成可追溯追问
    - 简单搜索和项目内信息不足时仍静默继续，制造伪完整建模
    - 每个阶段或每条消息机械启动讨论，导致流程常驻化和形式主义
    - 模型未经 Human 授权自行启用 Deep Research、NotebookLM 或其他外部能力
    - 把某个外部工具设为固定优先路线，而不根据任务能力、既往效果和信息增益选择
    - 外部行动在目标、输入、附件、隔离、输出、验收和停止条件未建模前派发
    - 新材料改变承重判断后旧产物和旧确认仍被继续使用
    - 共识、事实支持、语义理解、偏好、授权和审核状态被压缩为单一布尔值
    - 多模型一致被误当成独立证据、独立确认或事实正确
    - 讨论轮次被形式化满足，却没有改变或确认承重状态
    - 报告引用未归一化或承重主张未复验就被升级为规范事实
    - 主要机制尚未闭合时无限扩展非必要局部细节
    - 一阶细节继续产生二阶问题树后模型仍自行授权扩展范围
    - 二阶细节发散未记录、未升级或被伪装成普通实现选择
    - 以“主要机制优先”为理由省略正确性、安全性、可验证性或集成所必需的细节
    - 非阻塞细节被静默丢弃，或待决细节在未获 Human 决策时悄然进入实现范围

objectives:
  primary: >-
    在真正需要更深建模、更多信息或共同理解时，为 Human 与模型提供可调用、可审计、
    可停止、可增量更新的协同推演闭环；在不需要时保持休眠，避免流程负担。
  inquiry: >-
    从目标模型、schema、证据、假设、冲突、不确定性、风险、能力和下游依赖中，
    识别缺口、生成问题、选择信源、排序并定义接受、停止和升级条件。
  deliberation: >-
    围绕原子主张、证据、术语、候选、权衡、异议和权责形成共同理解，
    保留未共识内容，并由有权 Human 作出决定。
  change_control: >-
    新信息到达时进行影响分析，只使受影响的判断、版本和确认失效，
    生成后继版本并重新确认。
  evidence_normalization: >-
    将研究报告、网页、标准和项目证据归一化为稳定 source_id、可复验位置和主张映射；
    主模型可以直接完成该工作，只有当能力或访问缺口确实存在时才建议外部工具。
  implementation_granularity: >-
    优先闭合主要机制、主要状态转换、主要接口、主要失败路径和主要验收义务；
    一阶必要细节按最小充分原则完成，二阶细节发散在继续扩展前交 Human 裁决。

invocation_router:
  default: dormant
  evaluation_required_at:
    - workflow_or_stage_load
    - before_load_bearing_external_action_dispatch
    - after_new_evidence_execution_result_review_finding_or_human_correction
    - before_transition_when_required_model_or_confirmation_may_be_incomplete
    - when_second_order_detail_divergence_is_detected
    - Human_explicit_request
  full_activation_triggers:
    - trigger_id: discussion_or_common_understanding_needed
      condition: >-
        目标、成功义务、语义、边界、候选、风险、异议、权责或下一步存在承重不一致，
        需要 Human—模型讨论才能形成可执行建模。
    - trigger_id: information_modeling_requires_more_than_simple_sources
      condition: >-
        当前承重建模存在信息缺口，且简单网页搜索、直接事实查找和项目内已有信息
        无法以足够可靠性完成、验证或关闭该缺口。
    - trigger_id: structural_material_update
      condition: >-
        新信息改变阶段目标、成功义务、核心机制、工作流顺序、主要边界或授权结构。
    - trigger_id: Human_explicit_full_activation
      condition: Human 明确要求完整追问和讨论。
  incremental_activation_triggers:
    - new_material_information_requires_model_update
    - corrected_evidence_changes_claim_or_risk
    - execution_or_test_result_changes_prior_assumption
    - review_finding_affects_confirmed_artifact
    - Human_correction_changes_bearing_field
    - second_order_detail_divergence_requires_scope_decision
  external_action_activation_trigger:
    condition: >-
      拟派发给 Human、Deep Research、NotebookLM、专家、独立模型或实验环境的行动
      对阶段具有承重、阻塞、不可逆或独立性意义。
  blocker_activation_triggers:
    - unresolved_blocking_disagreement
    - authority_conflict
    - validator_detected_missing_required_state
    - mandatory_confirmation_invalid_or_missing
    - blocking_second_order_detail_awaiting_Human_scope_decision
  non_triggers:
    - simple_fact_lookup_with_clear_authoritative_source
    - project_internal_information_retrieval_that_closes_the_gap
    - reversible_mechanical_action_with_existing_authorization
    - formatting_copying_indexing_or_other_nonsemantic_work
    - already_confirmed_action_with_no_material_delta
    - first_order_required_detail_that_passes_minimum_sufficient_test
  anti_skip_rule: >-
    路由器选择“不激活”时必须记录：当前缺口、已使用的简单搜索与项目内来源、
    为什么它们足以关闭缺口、剩余风险以及 next_allowed_state。
    无法证明足够时不得默认休眠；应升级为机制激活候选并交 Human 裁决。

activation_modes:
  full_collaborative_modeling:
    minimum_substantive_rounds: 5
    applies_when:
      - full_activation_trigger_true
      - structural_material_update_true
    round_functions:
      - goal_success_scope_and_current_model
      - gaps_sources_human_actions_and_unknowns
      - options_roles_tools_topology_and_contracts
      - evidence_risks_counterexamples_stop_and_prohibitions
      - final_model_decisions_version_binding_and_Human_authorization
    anti_formality: >-
      每轮必须改变或确认一个承重字段、行动、风险、边界、决定、证据状态或版本状态；
      纯复述、礼貌确认和拆分模型消息不计轮次。
  incremental_redeliberation:
    ordinary_bearing_change_minimum_rounds: 2
    functions:
      - delta_understanding_and_impact
      - decision_update_version_and_reconfirmation
    continue_rule: >-
      若仍存在高影响冲突、未决行动或共同理解不足，继续追加轮次，不能因达到下限而结束。
  external_action_pre_modeling:
    fixed_round_count: none
    completion_rule: action_schema_complete_plus_substantive_deliberation_plus_Human_confirmation
    nesting_guard: >-
      外部行动子循环复用当前激活中的已确认目标、边界和证据，不重复启动完整五轮；
      只有外部行动暴露结构性变化时才重启完整激活。
  blocker_resolution:
    minimum_rounds: risk_and_issue_dependent
    completion_rule: resolution_or_valid_Human_waiver_or_escalation

waiver:
  authority: Human_only
  scope: one_specific_activation_instance
  required_record:
    - waived_requirement
    - reason
    - residual_risk
    - unchanged_mandatory_gates
  forbidden: model_executor_reviewer_self_waiver

methodology_stack:
  layer_1_modeling_substrate:
    objects:
      - goal_and_success_obligation
      - schema_field_and_missing_element
      - atomic_claim_and_evidence
      - assumption_and_uncertainty
      - terminology_and_scope
      - option_criterion_and_tradeoff
      - risk_and_failure_mode
      - actor_role_and_authority
      - artifact_version_dependency_and_confirmation_scope
      - main_mechanism_detail_dependency_and_scope
  layer_2_inquiry_engine:
    gap_types:
      - missing_field
      - unknown_fact
      - unverified_assumption
      - terminology_ambiguity
      - claim_conflict
      - insufficient_evidence
      - lack_of_capability
      - true_unknown
      - second_order_detail_divergence
    inquiry_item_fields:
      - inquiry_id
      - target_model_element
      - gap_type
      - question_or_action
      - target_actor_or_source
      - priority_and_reason
      - expected_information_value
      - acceptance_condition
      - evidence_requirement
      - stop_or_escalation_condition
    question_value_default: ordinal_explainable
    ordinal_factors:
      positive:
        - expected_information_gain
        - downstream_impact
        - risk_and_irreversibility
        - blocker_reduction
      negative:
        - acquisition_cost
        - Human_interruption_cost
        - execution_risk
        - scope_expansion_and_detail_recursion_cost
      constraint: dependency_order
    numeric_EVPI_allowed_only_when:
      - candidate_domain_is_discrete_and_typed
      - probabilities_are_reasonably_calibrated
      - action_utility_is_defined
      - calculation_and_assumptions_are_auditable
    prohibited:
      - pseudo_precise_EVPI_for_open_ended_semantic_questions
      - using_model_confidence_as_real_world_uncertainty
      - asking_without_model_element_or_decision_impact
      - recursively_generating_detail_questions_without_scope_classification
  layer_3_deliberation_engine:
    sequence_candidates:
      - independent_initial_input_when_anchoring_or_conformity_risk_exists
      - semantic_grounding_and_atomic_decomposition
      - evidence_argument_and_counterexample_exchange
      - option_comparison_and_objection_disposition
      - Human_authority_decision
      - scoped_confirmation_and_commit
    separate_state_dimensions:
      - epistemic_claim_state
      - semantic_grounding_state
      - goal_and_boundary_state
      - preference_state
      - issue_and_objection_state
      - option_disposition
      - decision_state
      - confirmation_state
      - review_state
      - execution_and_verification_state
    residual_disagreement: may_be_retained_when_non_blocking_and_explicitly_disposed
    hard_rules:
      - agreement_does_not_prove_fact
      - silence_does_not_mean_agreement
      - addressed_is_distinct_from_accommodated
      - Human_authorization_does_not_change_epistemic_truth
      - reviewer_recommendation_does_not_equal_adoption
      - multiple_model_agreement_does_not_constitute_independent_confirmation_without_verified_independence_metadata_and_acceptance_rule
      - second_order_detail_divergence_does_not_become_implementation_scope_without_Human_decision
      - main_mechanism_priority_does_not_waive_required_correctness_safety_testability_or_integration_details
  layer_4_governance_and_change_control:
    actor_classes:
      - model
      - Human
      - external_tool
      - executor
      - independent_reviewer
    authority_separation:
      - observation_or_tool_result
      - epistemic_assessment
      - recommendation
      - Human_authorization
      - execution
      - independent_verification
    dual_Human_gates:
      - activation_or_stage_start_authorization_bound_to_plan_version
      - completion_confirmation_bound_to_exact_candidate_version
    material_event_effects:
      - no_effect
      - informational_only
      - review_required
      - assessment_invalidated
      - confirmation_invalidated
      - new_authorization_required
    detail_scope_governance:
      classification_levels:
        - main_mechanism
        - first_order_required_detail
        - second_order_detail_divergence
      Human_authority: decide_second_order_scope_before_expansion
      model_authority: resolve_first_order_detail_only_when_minimum_sufficient_test_passes
      deferred_detail_rule: append_only_visible_and_not_silently_implemented
    version_rule: accepted_decisions_and_confirmations_are_append_only_and_superseded_not_silently_rewritten
  layer_5_stage_profiles:
    purpose: >-
      每个 workflow 阶段声明该阶段关注的模型字段、触发器、讨论重点、外部行动、
      material event、门禁、完成条件、失败和回退目标；profile 引用全局机制，不复制实现。
    minimum_fields:
      - mechanism_ref
      - required_model_fields
      - trigger_evaluation
      - discussion_focus
      - inquiry_generation_inputs
      - external_action_triggers
      - material_event_triggers
      - detail_granularity_classification
      - second_order_detail_escalation_rule
      - deferred_detail_register_ref
      - start_gate
      - completion_gate
      - failure_and_rollback_targets
      - prohibited_actions

Deep_Research_governance:
  model_may:
    - detect_that_simple_search_and_project_information_are_insufficient
    - recommend_Deep_Research_or_other_external_research_tool
    - explain_expected_information_gain_and_decision_impact
    - propose_research_questions_scope_sources_lanes_and_independence
    - propose_number_of_reports_and_third_report_trigger
    - define_return_format_provenance_acceptance_and_stop_conditions
  recommendation_must_include:
    - unresolved_model_elements
    - why_simple_search_and_project_information_are_insufficient
    - expected_use_of_returned_information
    - alternatives_considered
    - expected_value_cost_time_and_risk
    - independence_and_source_requirements
    - exact_output_and_return_contract
  Human_authority:
    decision: Human_only
    choices:
      - approve
      - modify
      - reject
      - defer
      - choose_other_external_action
  model_must_not:
    - treat_recommendation_as_authorization
    - dispatch_Human_action_without_confirmation
    - replace_required_Human_external_action_with_model_search
    - claim_independence_without_metadata
  independence_rule: >-
    独立路线、互盲和多报告数量必须由具体决策目的与风险证明，不是所有外部研究的固定要求；
    若 Human 对具体实例豁免，必须记录 waiver 四字段，且不得把相关输出计作独立确认。
  current_stage_02_default:
    Human_independent_reports: 2
    third_report_when:
      - material_method_or_fact_conflict
      - high_risk_or_single_source_dependency
      - Human_or_model_judges_expected_information_gain_high
    applicability: default_candidate_subject_to_stage_profile_and_Human_decision

evidence_normalization_governance:
  default_executor: primary_model
  external_tool_required_by_default: false
  tool_selection_rule: >-
    先由主模型使用项目内材料、可访问的一手来源和普通检索完成归一化；
    只有当访问、容量、格式、独立性或领域能力缺口不能被当前模型可靠关闭时，
    模型才提出 Deep Research、NotebookLM 或其他工具建议，并由 Human 决定。
  NotebookLM_policy:
    default_priority: false
    rationale: prior_project_use_produced_unsatisfactory_results_despite_being_prioritized
    future_use: evidence_based_case_by_case_after_Human_authorization
  required_outputs:
    - stable_source_id
    - canonical_url_or_DOI_or_repository_ref
    - source_type_and_authority
    - accessed_version_or_date
    - exact_page_section_or_anchor_when_available
    - atomic_claim_to_source_mapping
    - fact_inference_separation
    - access_limitations
    - primary_source_recheck_result_for_load_bearing_claims
  completion_policy: fail_closed_if_required_mapping_or_recheck_is_missing

implementation_granularity_governance:
  principle_name: 主要机制优先与细节递归升级原则
  purpose: >-
    让实现聚焦主要机制闭合，同时保证必要细节不被省略，并阻止局部细节递归生成无限新范围。
  classification_levels:
    main_mechanism:
      definition: >-
        A 的核心成功义务、主要状态转换、主要接口、主要失败路径、权限边界、加载链、
        receipt、validator 与主要验收条件。
    first_order_required_detail:
      definition: >-
        为实现已确认主要机制义务直接必要，且不创建独立政策、子系统或生命周期的局部细节。
      minimum_sufficient_test:
        all_required:
          - necessary_for_confirmed_main_mechanism_obligation
          - required_for_correctness_safety_testability_or_integration
          - within_confirmed_scope_policy_and_authority
          - reversible_or_contained
          - locally_verifiable
          - no_new_independent_subsystem_policy_or_lifecycle
      authority: model_may_resolve_and_record
    second_order_detail_divergence:
      definition: >-
        处理一阶细节时产生新的独立问题树，其解决要求新增设计范围、治理范围或生命周期。
      trigger_when_any:
        - creates_new_independent_design_branch
        - creates_new_state_machine_or_protocol
        - creates_new_tool_or_persistent_artifact_family
        - creates_new_exception_permission_or_authority_system
        - creates_new_lifecycle_owner_or_independent_test_program
        - creates_new_load_bearing_requirement_not_needed_to_close_parent_mechanism
        - creates_recursive_detail_questions_without_clear_stop_condition
      authority: Human_decision_required_before_expansion
  escalation_packet_required_fields:
    - detail_event_id
    - main_mechanism_ref
    - originating_detail
    - newly_generated_detail_questions
    - detail_classification_and_reason
    - relationship_to_main_mechanism
    - impact_if_deferred
    - blocks_correctness_safety_testability_or_integration
    - minimum_sufficient_option
    - expansion_option
    - defer_or_split_task_option
    - cost_time_risk_and_residual_risk
    - model_recommendation
    - Human_decision
    - next_allowed_state
  Human_decision_options:
    - pursue
    - constrain_to_minimum_sufficient
    - defer
    - accept_residual_risk
    - split_new_task
    - reject
  pending_decision_routing:
    blocking:
      condition: detail_blocks_correctness_safety_testability_or_integration
      behavior: fail_closed_and_await_Human
    nonblocking:
      condition: main_mechanism_can_close_without_detail
      behavior: record_deferred_detail_do_not_expand_and_continue_only_independent_main_work
  deferred_detail_record_required_fields:
    - deferred_detail_id
    - originating_detail_event
    - reason_for_deferral
    - nonblocking_basis
    - residual_risk
    - prohibited_implicit_scope
    - revisit_trigger
    - Human_decision_ref
  anti_abuse_rules:
    - granularity_policy_cannot_waive_required_core_behavior
    - model_cannot_label_a_blocking_detail_nonblocking_without_evidence
    - second_order_detail_cannot_be_hidden_as_ordinary_implementation_choice
    - deferred_detail_cannot_silently_enter_scope
    - every_detail_escalation_must_be_rooted_in_a_main_mechanism_ref
    - every_detail_branch_must_have_a_stop_or_split_decision

