material_blockers:
  - blocker_id: B2-OBSERVATION-PROVENANCE-BINDING
    architecture_dimension: material_physical_truth_two_sided_binding
    finding: >-
      The generic material-claim validator checks that source/ref fields are present and that
      declared source-class strings are allowed, then compares expected and observed values
      supplied in the claim. It does not independently resolve the expected claim source or
      independently consume the physical observation named by exact_observation_ref.
      Consequently a self-consistent claim can be recomputed VERIFIED without establishing
      that the cited physical observation actually produced the observed value.
    required_architecture_outcome: >-
      A receipt is only a binding index and cannot itself establish candidate identity, complete
      diff scope, execution evidence, artifact binding, authority, or actual actor. A material
      claim without the required physical observation must be UNVERIFIABLE.
    reviewer_counterexamples:
      - non_resolving_expected_source_ref_with_equal_candidate_values_can_recompute_VERIFIED
      - asserted_complete_path_subset_can_recompute_VERIFIED_without_validator_running_complete_Git_compare
      - asserted_authenticated_principal_record_can_recompute_VERIFIED_without_validator_consuming_authenticated_observation
    required_fix: >-
      Acceptance-time verification must bind each material claim to independently obtained
      expected-source and observation data, using trusted observation adapters or an external
      observation context. Receipt-provided source labels, completeness flags, actor values and
      observation refs must be checked against those externally obtained facts. Add negative
      tests for self-consistent but unresolved refs and unobserved material facts.
