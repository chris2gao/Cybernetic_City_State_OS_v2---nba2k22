accepted_material_blocker:
  blocker_id: B2-OBSERVATION-PROVENANCE-BINDING
  status: accepted_by_foreground
  root_cause: >-
    The first B2 correction moved verification inputs from receipt-only data into
    MaterialObservationContext, but ordinary callers can still mint bindings by
    freely supplying resolver and adapter identifiers, source classes, refs,
    values, and consumed-observation-ref strings. Provenance therefore remains a
    caller assertion rather than a fact established by controlled resolver/adapter execution.
  required_outcome: >-
    Ordinary callers must not be able to construct an acceptance-valid provenance binding
    from arbitrary values. Accepted bindings or opaque evidence handles must be minted only
    by controlled resolver/adapter execution paths that actually resolve expected sources
    and consume the authoritative observations they attest.
  mandatory_negative_cases:
    - claim_and_context_self_consistent_but_expected_resolver_never_executed
    - claim_and_context_self_consistent_but_observation_adapter_never_executed
    - caller_fabricates_complete_Git_compare_binding
    - caller_fabricates_authenticated_principal_binding
    - caller_self_declares_conditional_ref_consumed_without_observation
