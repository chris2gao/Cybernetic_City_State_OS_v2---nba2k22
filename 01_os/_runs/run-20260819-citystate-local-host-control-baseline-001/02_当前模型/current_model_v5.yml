  constraints_and_dependencies:
  - Task B remains independent from Task C; do not mutate VPS, DNS, firewall, VPN, nginx, xray or cloudflared.
  - secrets, credentials, private keys, browser credential/token stores, Windows Credential Store, .env secrets, API keys and auth tokens remain fail closed.
  - no administrator escalation or system-security changes.
  - no payment, API credits or paid third-party service activation.
  - destructive Git/history operations and destructive/system-high-risk actions require separate explicit Human authority.
  - ordinary delegated startup follows Human Task Authority v2.1 using live authority plus exact task-authority/recipient/action/scope; no recipient Human code challenge.
  - Remote Desktop Commander is not required for final acceptance.
  - local core-anchor .git mutation is not a precondition for physical acceptance; the reported .git write anomaly remains a separate local-host finding unless a tested acceptance proposition itself requires such mutation.
  proposed_method_or_solution:
  - relay a complete canonical v2 Human pointer directly to a fresh isolated Codex Desktop session
  - reconstruct Task B task truth from the exact GitHub pointer and current Task B branch through GitHub-capable reads; do not require the local anchor to fetch or switch branches
  - verify the existing Windows core anchor identity, remotes, HEAD and cleanliness read-only; if unrelated worktree changes exist, fail closed
  - use read-only local Git commands, including NUL-delimited machine output, to prove Git/path behavior against files already physically present in the anchor
  - independently reproduce filesystem read/write/edit, PowerShell 7, Python, process/session, non-ASCII path roundtrip and cleanup using only exact disposable artifacts outside repository metadata
  - publish the formal review/result through an available GitHub API or connector transport; do not use local git push while .git metadata creation is unavailable
  - if no authenticated GitHub API/connector publication transport is available in Codex, return the complete structured review payload to the Human without claiming publication so the foreground can materialize it with provenance preserved
  feasibility_support:
  - Program Architecture defines the permanent Task B contract independently of RDC as a product and does not require branch switching to prove Windows filesystem, PowerShell, Python, Git path decoding, process/session, Unicode or cleanup capabilities
  - git ls-files -z or equivalent read-only NUL-delimited Git commands can produce machine path evidence from the existing clean anchor without writing .git
  - filesystem and Unicode mutation probes can use the exact disposable Desktop test root rather than repository metadata
  - GitHub API/connector publication is a canonical publication transport under the repository development entry and does not require local hooks or local .git writes
  assumptions_risks_alternatives_unknowns:
  - the Codex blocked audit is Human-relayed executor evidence until independently reproduced; it is sufficient to invalidate the previous dispatch precondition but not to classify the root cause of the .git anomaly
  - the local anchor must still exist, identify as the intended repository and be clean enough for read-only physical evidence
  - if read-only local Git itself fails, or the anchor identity cannot be established, Task B remains BLOCKED
  - if Codex has no GitHub API/connector publication transport, physical acceptance may complete while formal publication remains pending foreground materialization
  open_load_bearing_items: []
  expected_output: A durable Task B final acceptance review from fresh Codex Desktop that reconstructs task truth from GitHub, physically reproduces the complete permanent Windows matrix without local Git metadata mutation, records the .git write anomaly separately, and stops before Task C or master publication.
  verification_or_acceptance_method:
  - v2.1 delegated-start authority VERIFIED against Task B authority v2 and the corrected exact Codex delegation/request
  - complete v2 Human relay pointer is validated by canonical receiver bootstrap
  - local core anchor identity, remotes, HEAD and cleanliness are physically checked read-only
  - all permanent Windows matrix rows are physically reproduced in the Codex session
  - Git path correctness is proven via NUL-delimited raw bytes to strict UTF-8 to filesystem Path, not terminal rendering, without requiring local metadata writes
  - non-ASCII path creation/edit/readback/cleanup passes without codepage workaround
  - no secrets or unrelated files are read
  - only exact task-created disposable artifacts are removed
  - formal result is published through GitHub API/connector when available, or returned as an exact structured payload with publication explicitly pending
  - master remains unchanged and Task C is not started
  actual_result: Human_authorized_ready_for_corrected_Codex_Windows_final_acceptance_without_local_git_mutation
