ordered_steps:
  - id: M1
    action: migrate_publisher_authority
    requirements:
      - create new canonical authority at architecture_decisions.publisher_authority.new
      - preserve root_authority, identity binding, grant semantics, capabilities, destructive/action-bound rules, core-history prohibition, recognized transports
      - remove obsolete .ai/PROTOCOL, communication_compliance, old TASKS commentary from the migrated text
      - update every active/ref retained consumer from old path to new path
      - update repository guard registry coherently
  - id: M2
    action: retire_token_profile_authority_pointer
    requirements:
      - remove/replace 01_os development-entry section 12 pointer to .ai/TOKEN_USAGE_PROFILE.md
      - prove no active root/new-OS authority depends on that old file after change
  - id: M3
    action: relocate_domain_runtime_root_semantics
    requirements:
      - replace active .ai/PROGRAM_RUNS/ contract with 01_os/07_content/_runs/
      - update machine layout contract, validator, active registries, workflow contracts/readmes, OS README, development entry, CORE_MANIFEST and .gitignore
      - update only active/canonical references; superseded _dev/history may remain historical if clearly non-active
      - domain ownership remains domain-owned
      - private _runtime remains untracked/ignored and lifecycle semantics unchanged
      - validator must no longer require literal .ai/PROGRAM_RUNS/
  - id: M4
    action: migrate_legacy_system_summary_evidence
    requirements:
      - copy exact substantive source into new 01_os context-management evidence location
      - preserve provenance to old source path and source blob/hash if practical
      - update the seven active evidence/requirement path refs that currently point to root 系统机制总结.md
      - prove no active evidence ref requires the old root source afterward
  - id: M5
    action: preserve_token_measurement_evidence
    requirements:
      - copy the six tracked .ai/token_profile measurement files into this run evidence subtree
      - record old path + blob sha for each
      - do not make those measurements an active OS authority
  - id: D1
    action: ownership_cleanup
    requirements:
      - CORE_MANIFEST retained global core-owned surface includes at least AGENTS.md, AGENT_WORKING_DISCIPLINE.md, CLAUDE.md, GEMINI.md, README.md, CORE_MANIFEST.yml, .githooks/, .gitignore, .gitattributes, .claude/settings.json, new-domain.ps1
      - 01_os/开发入口与单窗口任务规范_v1.md is covered by core ownership
      - PROJECT_CONTEXT.md remains physically present but planned for deletion, not an active/domain ownership premise
      - do not claim authorized deletions already happened
  - id: D2
    action: fix_stale_new_OS_text
    requirements:
      - fix 01_os/07_content/README.md sentence that describes 06_Silicon_Index bootstrap as current
      - do not erase historical lesson; make historical tense/status explicit
  - id: F1
    action: produce_final_whitelist_and_delete_list
    outputs:
      - 01_os/_runs/run-20260810-旧OS退役前迁移与最终白名单-001/03_最终清单/最终非08白名单_v1.yml
      - 01_os/_runs/run-20260810-旧OS退役前迁移与最终白名单-001/03_最终清单/最终直接删除清单_v1.yml
      - 01_os/_runs/run-20260810-旧OS退役前迁移与最终白名单-001/03_最终清单/迁移闭包验证_v1.yml
    final_delete_list_rules:
      - import the predecessor's exact 453 delete-candidate tracked paths without re-adjudicating their semantics
      - add 01_Research_Reports/**, PROJECT_CONTEXT.md, ARCHITECTURE.md, .ai/HANDOFF_COMMON_CONVENTIONS.md
      - add old migration sources only after proving their active dependencies were removed: .ai/REPOSITORY_PUBLISHER_AUTHORITY.yml, .ai/TOKEN_USAGE_PROFILE.md, .ai/token_profile/**, 系统机制总结.md
      - .ai/PROGRAM_RUNS/ has zero tracked files in core; record removal of the old declared root separately, not as a fake file count
      - no path under 01_os/** may appear in delete list
      - every tracked path outside 01_os/** must end in exactly one of: final_retain, final_delete_authorized, deferred_until_root_move_rewrite

