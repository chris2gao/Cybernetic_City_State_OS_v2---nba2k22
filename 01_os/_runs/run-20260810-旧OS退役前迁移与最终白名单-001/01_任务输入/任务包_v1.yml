  domain_runtime_root:
    old: .ai/PROGRAM_RUNS/
    new: 01_os/07_content/_runs/
    reason: domain-owned workflow/business run traffic belongs with domain content/results, not OS mechanism state
    future_after_08_root_move: 07_content/_runs/
  token_profile:
    old_authority: .ai/TOKEN_USAGE_PROFILE.md
    action: remove final active pointer; do not migrate old authority file
    retained_discipline: already absorbed into AGENT_WORKING_DISCIPLINE.md
  legacy_system_summary:
