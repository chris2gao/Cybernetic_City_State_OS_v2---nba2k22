    new: 01_os/03_mechanisms/context_management/依据材料/系统机制总结_历史输入_v1.md
    action: preserve content/evidence trace, update active evidence refs, old root source becomes delete candidate
  token_measurement_evidence:
    old: .ai/token_profile/**
    new: 01_os/_runs/run-20260810-旧OS退役前迁移与最终白名单-001/02_迁移/token_profile_legacy_measurements/**
    action: preserve measurement evidence only; old path becomes delete candidate

