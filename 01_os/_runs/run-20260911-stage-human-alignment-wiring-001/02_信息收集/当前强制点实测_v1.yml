    superseded_by: M2-7 through M2-10
  - withdrawn: explicit Human disposition is already enforced on the production path
    superseded_by: G2 and G3
  - withdrawn: the remaining work is to wire the runner to the instance validator
    superseded_by: >-
      M1 and G9. Wiring is necessary and is not sufficient. There is no control point for a
      pre-work gate to occupy.
