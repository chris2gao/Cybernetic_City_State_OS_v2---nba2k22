    W3-v2 already defines the publication gate as an independent transport-independent
    composition and ordering owner. The missing authorisation was an omission in the task packet.
    Placing the gate inside minimum_operational_loop only to avoid a scope correction would
    create false ownership and a backwards dependency for every future caller.

gate_responsibility_boundary:
  owns:
  - exact reference resolution
  - Git tree and blob content separation
  - strict ancestry
  - composition
  - fail-closed progression
  must_not_copy:
  - deliberation semantics
  - Human authentication semantics

untracked_file_status:
  path: 01_os/06_execution/workflow/publication_gate/workflow_publication_gate.py
  written_before_authorisation: true
  committed_before_authorisation: false
  disposition: >-
    the path is now authorised; the content is not thereby ratified. It must be reviewed against
    W3-v2 S1 through S9 before it is tracked.

registry_obligation:
  rule_source: 01_os/05_registry/README.md
  rule: >-
    the registry is updated with the development and never after it, and a validator over this
    registry should fail on an existing path that has no entry
  consequence: the publication gate requires a registry entry in the same change
  blocking_gap:
    id: SB-003
    needed_path: 01_os/05_registry/workflow_publication_gate_v1.yml
    authorised: false
    action_taken: stopped and reported, path not created
  precedent_considered:
    source: 01_os/05_registry/README.md line 76
    precedent: >-
      task_orchestration_v1.yml records an explicit gap, its missing 01_os/02_boot manifest,
      because that path was outside the producing task's allowed paths. The README's rule is that
      a gap is written into the registry rather than left blank.
    why_it_does_not_resolve_this_case: >-
      in that precedent the registry file itself existed and was authorised, and the gap was a
      different path. Here the registry file itself is the unauthorised path, so there is no
      authorised place to record the gap in its own right.
  options_for_Human:
  - id: O1
    option: authorise 01_os/05_registry/workflow_publication_gate_v1.yml
    effect: the gate is registered in its own file, consistent with every other capability
  - id: O2
    option: record the gate's entries inside the already authorised workflow_minimum_operational_loop_v1.yml
    effect: no new path, but it files a transport-independent component under the minimum loop's registry, which repeats the ownership confusion SB-002 rejected
  - id: O3
    option: defer registration to a successor task and record the gap in the run only
    effect: violates the registry README's with-the-development rule for the duration

