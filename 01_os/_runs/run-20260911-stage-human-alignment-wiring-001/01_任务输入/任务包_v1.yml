stop_conditions:
  - W3 mapping cannot derive a required field from a durable source
  - a change is required outside allowed_changed_paths and outside the conditional gate
  - the design would require synthesising, inferring or self-asserting Human evidence
  - a semantic goal or Human-confirmed architecture would have to change
  - evidence cannot support a claim

prohibitions:
  - master_publication
  - force_push_rebase_squash_amend_reset_or_history_rewrite
  - merge_or_cherry_pick_from_the_frozen_predecessor_branch
  - self_declaration_of_master_readiness
  - self_review_as_independent_review
  - creating_a_second_briefing_or_attestation_mechanism_parallel_to_stage_collaborative_deliberation
  - inferring_Human_consent_from_silence
  - runtime_or_scheduler_activation
  - reading_or_exposing_secrets_or_credentials

correction_budget:
  internal_construction: converges_by_failure_set_contraction_not_by_a_round_counter
  post_delivery_formal_correction: two_rounds_then_freeze_and_escalate

Human_gates:
