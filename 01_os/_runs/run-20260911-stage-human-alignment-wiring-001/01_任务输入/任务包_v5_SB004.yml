phase: W6_publication_gate_and_caller
supersedes_for_current_phase: 01_os/_runs/run-20260911-stage-human-alignment-wiring-001/01_任务输入/任务包_v4_SB003.yml
supersession_scope: adds exactly four allowed paths; every clause of v1 through v4 remains in force
repository: chris2gao/Cybernetic_City_State_OS_v2---core
exact_base_sha: b6782775d7734fb10f5119ce04a057b5af0ef5f3
