performance:
  measured_by: probe wrapping subprocess.run, counting and timing every child process
  method_note: the probe counts and times only; no expected value derives from the code under test
  per_validation:
    without_scope_feasibility: {child_processes: 13.0, wall: 0.451s}
    with_scope_feasibility: {child_processes: 15.0, wall: 0.574s}
    delta: {child_processes: +2, wall: +0.123s, percent: +27}
  child_process_cost: 30.7ms each, Windows process creation bound
  hoist_effect_on_cost: none
  hoist_effect_explanation: >-
    the contract was never read repeatedly. _scope_feasibility runs once per validation, so it
    read the contract once. The hoist is structural, not an optimisation: it puts the load beside
    the profile set, fails closed earlier, and stops a future check from adding a third read.
  irreducible_because: >-
    the profile set and the profile contract are two files, each read once. Further reduction
    would require modifying managed_verification, which this task is forbidden to touch, or
    merging two canonical files, which would change ownership.
  master_baseline_timing: not_measured
  accepted_by: Human, performance is not a blocker

