W4_grounding_authority_separation:
  raised_by: Human at HG1 follow-up
  defect_in_the_executor_draft: >-
    the first tiering allowed Human_confirmed as a feasibility basis for stages 01 and 02. That
    lets Human approval serve as epistemic evidence for an arbitrary feasibility claim, which
    inverts the order the checkpoint exists to serve and collapses the authority/grounding
    separation the mechanism maintains everywhere else.
  correction: >-
    a basis must be a statement of fact the world could falsify, never a decision that cannot be
    wrong. A Human may still ground a claim by supplying a premise, a constraint or a resource
    as fact, because those can turn out to be false.
  approval_kinds_now_prohibited: [Human_confirmed, Human_approved, Human_authorized, authority_reference, decision_ref]
  factual_Human_kinds_introduced: [Human_stated_premise, Human_supplied_constraint, Human_provided_resource]

W4_validator_changes:
  file: 01_os/03_mechanisms/stage_collaborative_deliberation/实现/verify_stage_collaborative_deliberation.py
  lockstep_rule: >-
    contract and checker changed in the same round. A contract field with no checker is the
    declared-but-unenforced defect this task was created to close; introducing one while closing
    one would have been the fifth recorded instance of that pattern in this line of work.
  constants: {SUBSTANTIVE_COMMON_FIELDS: +why_this_stage_is_needed_now, NULLABLE_COMMON_FIELDS: +downstream_impact, CLOSURE_FIELDS: new}
  new_check: _scope_feasibility
  changed_check: _scope_completion enforces the four closure fields on progression
  contract_load_site: validate_task_scope_instance, once, from the exact candidate blob
  contract_passed_down_to: _scope_model then _scope_feasibility
  worktree_fallback: prohibited_and_absent

W4_defects_found_in_this_executor_own_work:
  - id: SD-1
    defect: _scope_feasibility read the contract from the filesystem
    found_by: 56 failing candidate-scoped tests
    severity: >-
      not merely a test break. It violated task_scope_execution_contract.scope_sources
      (regular_Git_blobs_in_exact_candidate_not_mutable_worktree_files) and would have let a
      mutable working-tree file decide what a candidate is allowed to claim.
    fix: read the blob at the exact candidate, as the profile set already is
  - id: SD-2
    defect: the corrected read sat inside a per-field check
    consequence: a second candidate read per validation, and an easy path for a third
    fix: hoisted to validate_task_scope_instance and passed down
  - id: SD-4
    defect: >-
      this record file was committed in 8a515966 without ever being parsed. It asserted that
      everything was green while being itself unreadable YAML: a sequence and a mapping key were
      mixed under forbidden_paths_untouched.
    found_by: a later run-wide YAML sweep, two commits afterwards
    note: >-
      the document that records the verification was the one artifact not verified. The round's
      YAML check covered the contract files the executor had edited and not the record written
      about them.
    remedy: the commit gate now parses every YAML under the run directory, not a remembered subset
  - id: SD-5
    defect: >-
      the commit script for W3-v2 ran a twelve-invariant self-check, received exit 1, and
      committed anyway. There was no guard between the check and the commit.
    severity: >-
      this is the exact failure class the task exists to close. A check that runs, reports and is
      not consumed is decoration. Producing one while building a gate is the fifth recorded
      instance of fixing a defect by introducing another of its kind in this work line.
    remedy: >-
      the gate script now exits non-zero and refuses to stage when either the invariant check or
      the YAML sweep fails, and it prints GATED so the refusal is visible in the round trip
    corrected_in: 087b5c65ce96aec0a8060a13aa593c199a39d8b5
  - id: SD-3
    defect: the executor reported the suite as hung, then as a four-fold slowdown
    correction: >-
      the suite was slow, not hung: process CPU rose throughout. The 304s figure cited as a
      before-baseline was a run containing 56 early-exiting failures, so it measured a different
      population than the 413s all-green run. No master-baseline suite timing was ever taken, so
      no fold-change can be stated.

