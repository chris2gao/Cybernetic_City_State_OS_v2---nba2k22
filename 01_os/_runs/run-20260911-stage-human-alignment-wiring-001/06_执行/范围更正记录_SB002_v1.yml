pattern_this_belongs_to:
  name: asserted without verifying
  instances_in_this_task:
  - id: SD-4
    statement: a record file claimed everything was green while being itself unparseable YAML
  - id: SD-7
    statement: an architecture document declared a path allowlisted without checking the packet
  common_property: >-
    in both cases the subject of the assertion was an arrangement the executor had just made, and
    the executor treated intending the arrangement as the arrangement being in force.
  countermeasure_adopted: >-
    the commit gate now assembles the effective allowlist from the packets themselves and refuses
    to stage any path it does not cover, so the claim cannot be made by hand any more.

scope_decision:
  decided_by: Human
  decision: extend allowed_changed_paths by exactly 01_os/06_execution/workflow/publication_gate/**
  rejected_alternative:
    option: place the gate inside the already authorised minimum_operational_loop directory
    rejected_because: >-
      it would avoid the scope correction by creating false ownership. The minimum loop has three
      commands and the gate is not one of them; every future caller would then depend on a path
      whose name says it is something else.
  widening_explicitly_refused: 01_os/06_execution/workflow/**

dedicated_owner_confirmed:
