package_completion_pointer:
  required: true
  fields:
    - package_id
    - task_id
    - branch
    - exact_base
    - exact_head
    - changed_paths
    - artifact_blobs
    - acceptance_results
    - test_results
    - deviations_and_detail_events
    - rollback_target
    - next_package_base_rule
  chat_only_handoff: prohibited

commit_discipline:
  one_semantic_concern_per_commit: true
  empty_or_cosmetic_commit: prohibited
  cross_package_path_mix: prohibited
  exact_commit_count_is_success_criterion: false

failure_and_repair:
  failed_package_is_not_promoted: true
  dependent_packages_blocked: true
  allowed_repairs:
    - append_only_repair_on_unpromoted_branch
    - targeted_repair_branch_from_last_accepted_parent
    - abandon_branch_and_preserve_for_audit
  silent_history_rewrite: prohibited
  new_second_order_scope: durable_detail_event_and_Human_decision_required

Stage_06_test_review_modeling_obligations:
  must_bind_this_exact_plan: true
  must_generate_tests_for:
    - every_package_acceptance_assertion
    - every_package_blocking_failure
    - 4_validator_modes_and_10_nonzero_exit_classes
    - 15_canonical_counterexamples
    - complete_26_failure_code_union
    - dormant_full_incremental_and_round_substance
    - material_event_and_future_workflow_stage_extension
    - granularity_and_external_action_Human_gates
    - review_execution_verification_separation
    - boot_loader_registry_profile_validator_receipt_chain
    - rollback_no_partial_publish_and_no_partial_activation
    - exact_head_allowlist_authority_and_independent_review
  may_not_change_package_ownership_or_solution_semantics_without_material_event: true
  implementation_authorized: false

final_independent_implementation_review:
  starts_after: accepted_P7_completion_head
  reviewer: separate_fresh_context_model
  review_base: exact_P1_base
  review_head: exact_P7_head
  branch_modification_allowed: false
  required_scope:
    - primary_full_diff_and_each_package_diff
    - exact_authority_solution_step_and_test_bindings
    - all_package_allowlists_acceptance_and_failures
    - 45_47_0_10_16_15_26_realization
    - deterministic_routers_and_fail_closed_behavior
    - complete_loading_and_receipt_chain
    - Stage_06_test_and_failure_injection_results
    - current_7_profiles_and_future_extension_rule
    - no_partial_activation_or_master_modification
  allowed_results: [PASS, PASS_WITH_NON_BLOCKING_NOTES, FAIL]

Human_integration_gate:
  required_after_independent_review: true
  decisions:
    - accept_or_reject_findings_and_residual_risk
    - authorize_or_reject_activation_and_master_integration
    - bind_exact_final_head_and_merge_method
    - bind_rollback_target_and_post_integration_checks
  mechanism_active_before_gate: false

material_event_reopen_triggers:
  - active_solution_contract_changes
  - active_result_contract_union_changes
  - canonical_workflow_stage_inventory_changes
  - execution_environment_invalidates_validator_plan
  - planned_path_conflicts_with_new_canonical_owner
  - new_security_or_authority_requirement
  - Stage_06_finds_blocking_untestable_acceptance

completion_for_step_decomposition:
  substantive_rounds_completed: 5
  packages_defined: 7
  coverage_gaps: 0
  duplicate_primary_path_owners: 0
  current_profiles: 7
  object_types: 45
  MM_result_names: 47
  unresolved_names: 0
  state_dimensions: 10
  active_invariants: 16
  canonical_counterexamples: 15
  complete_failure_code_union_baseline: 26
  open_second_order_detail_events: 0
  P1_exact_base_intentionally_deferred: true
  implementation_authorized: false
  exact_Human_confirmation: pending
  independent_step_plan_review: pending
  development_Stage_06_start_allowed: false
  next_allowed_state: exact_Human_confirmation_of_step_plan_v1
