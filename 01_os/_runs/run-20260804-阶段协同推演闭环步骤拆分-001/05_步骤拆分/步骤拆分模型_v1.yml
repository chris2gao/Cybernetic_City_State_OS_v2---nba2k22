      - path: ../../../run-20260804-阶段协同推演闭环实现方案建模-001/04_实现方案建模/实现方案模型_v1.yml
        blob_sha: 9f93ce2f563eeac79cc5b565f8b01298020363ef
      - path: ../../../run-20260804-阶段协同推演闭环实现方案建模-001/04_实现方案建模/实现方案模型_v1一阶必要修复叠加层_v1.yml
