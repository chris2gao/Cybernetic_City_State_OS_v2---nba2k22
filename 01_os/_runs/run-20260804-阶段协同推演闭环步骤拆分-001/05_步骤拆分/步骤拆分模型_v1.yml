modeling_rounds:
  - {round_id: STEP-R1, function: dependency_graph_package_boundaries_and_ownership, status: complete}
  - {round_id: STEP-R2, function: exact_paths_allowlists_and_artifact_acceptance, status: complete}
  - {round_id: STEP-R3, function: tests_failure_injection_rollback_and_stop_conditions, status: complete}
  - {round_id: STEP-R4, function: branches_commits_executor_inputs_review_and_handoffs, status: complete}
  - {round_id: STEP-R5, function: synthesis_coverage_no_gap_and_plan_freeze, status: complete}

purpose: >-
  将已确认的实现方案拆成七个线性、窄范围、可验证、可回滚的执行包。
  本模型冻结包所有权、依赖、路径、任务与分支规则、验收、失败和交接；
  不创建实现文件，不派发执行模型，不授权 activation 或 master 集成。

non_goals:
  - authorize_implementation_execution
  - create_P1_branch_before_Stage_06_and_Human_execution_authorization
  - modify_canonical_workflow_registry_boot_or_loader
  - choose_new_solution_semantics
  - create_dynamic_package_or_plugin_orchestration_system
  - create_new_test_framework_DSL_or_failure_registry
  - merge_any_package_to_master
  - permit_force_push_rebase_or_squash

namespace_discipline:
  development_sequence_prefix: development_Stage_
  canonical_workflow_prefix: workflow_stage_
  ambiguity_rule: full_namespace_required_when_both_sequences_are_in_scope
  examples:
    development_Stage_05: step_decomposition
    development_Stage_06: test_review_modeling
    workflow_stage_05: step_decomposition
    workflow_stage_06: execution

execution_authority:
  implementation_authorized_by_this_model: false
  P1_branch_creation_prerequisites:
    - this_step_plan_exact_Human_confirmation
    - independent_step_plan_review_acceptance
    - development_Stage_06_test_review_model_completion_and_acceptance
    - exact_Stage_06_test_plan_blob
    - active_solution_contract_unchanged_or_material_event_resolved
    - Human_execution_authorization_binding_full_package_chain_and_prohibitions
  P1_exact_base_rule: exact_remote_head_containing_development_Stage_06_completion_pointer_and_Human_execution_authorization
  unresolved_Human_decision_in_executor_packet: prohibited

common_package_contract:
  required_inputs:
    - package_id_and_task_id
    - exact_branch_and_40_character_base_sha
    - remote_master_reference
    - Human_execution_authorization_ref_and_blob
    - exact_step_plan_ref_and_blob
    - exact_Stage_06_test_plan_ref_and_blob
    - active_solution_contract_exact_artifacts
    - active_result_contract_manifest_ref_and_blob
    - exact_prior_package_completion_pointer_when_applicable
  required_change_contract:
    - closed_allowlist
    - required_artifacts
    - prohibited_paths_and_actions
    - acceptance_assertions
    - tests_and_expected_results
    - failure_stop_conditions
    - rollback_target
  required_outputs:
    - exact_base_and_head
    - commits_and_changed_paths
    - artifact_paths_and_blobs
    - test_results
    - deviations_and_granularity_evaluations
    - open_detail_divergence_events
    - package_completion_pointer
  invariants:
    - one_primary_owner_per_path
    - no_cross_package_path_mix
    - later_packages_validate_but_do_not_reinterpret_prior_contracts
    - failed_package_is_not_next_package_base
    - no_package_merge_to_master
    - no_force_push_rebase_or_squash
    - executor_does_not_claim_independent_review
    - blocker_or_major_not_silently_deferred

