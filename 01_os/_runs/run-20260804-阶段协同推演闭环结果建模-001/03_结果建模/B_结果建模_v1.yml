state_dimensions:
  - {dimension_id: SD-01, name: epistemic_claim_state, values: [unassessed, supported, contradicted, uncertain, unsupported, superseded]}
  - {dimension_id: SD-02, name: semantic_grounding_state, values: [not_started, insufficient, sufficient_for_current_purpose, disputed, superseded]}
  - {dimension_id: SD-03, name: goal_and_boundary_state, values: [unresolved, proposed, Human_confirmed, invalidated, superseded]}
  - {dimension_id: SD-04, name: preference_state, values: [unknown, expressed, compared, changed, withdrawn]}
  - {dimension_id: SD-05, name: issue_and_objection_state, values: [open, addressed_not_accommodated, accommodated, rejected_with_reason, deferred, blocking, superseded]}
  - {dimension_id: SD-06, name: option_disposition, values: [candidate, retained, rejected, deferred, selected, superseded]}
  - {dimension_id: SD-07, name: decision_state, values: [not_decided, recommendation_only, Human_decided, invalidated, superseded]}
  - {dimension_id: SD-08, name: confirmation_state, values: [not_requested, pending, confirmed_exact_version, partially_invalidated, invalidated, superseded]}
  - {dimension_id: SD-09, name: review_state, values: [not_started, pending, pass, pass_with_nonblocking_notes, fail, superseded]}
  - {dimension_id: SD-10, name: execution_and_verification_state, values: [not_authorized, authorized, in_progress, implemented_unverified, verified, failed, rolled_back, superseded]}

cross_dimension_invariants:
  - {invariant_id: INV-01, rule: agreement_or_consensus_does_not_change_epistemic_claim_state_without_evidence, violation_code: agreement_used_as_fact_proof}
  - {invariant_id: INV-02, rule: semantic_grounding_does_not_equal_Human_decision_or_confirmation, violation_code: grounding_collapsed_into_authority}
  - {invariant_id: INV-03, rule: silence_or_response_presence_does_not_set_grounding_or_agreement_true, violation_code: silence_or_response_as_agreement}
