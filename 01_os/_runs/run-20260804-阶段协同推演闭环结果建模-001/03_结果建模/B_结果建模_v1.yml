  - {round_id: RESULT-R2, function: state_dimensions_and_cross_dimension_invariants, status: complete}
  - {round_id: RESULT-R3, function: material_event_change_control_and_granularity_results, status: complete}
  - {round_id: RESULT-R4, function: external_action_review_execution_loading_and_receipt_results, status: complete}
  - {round_id: RESULT-R5, function: synthesis_counterexamples_completion_and_version_binding, status: complete}

purpose: >-
  定义“阶段协同推演与增量再确认机制”运行后必须产生的耐久、可观察、可验证结果。
  B 约束结果对象、状态维度、不变量、失败可见性、权限与精确版本绑定；
  B 不选择文件布局、序列化格式、算法、数值阈值、实现语言或执行任务拆分。

non_goals:
  - select_canonical_paths_or_file_names
  - select_runtime_algorithm_or_numeric_thresholds
  - define_global_event_bus_graph_database_or_permission_subsystem
  - copy_full_IBIS_QOC_ADR_or_PEP_process
  - treat_Human_project_policy_as_external_empirical_law
  - collapse_result_model_into_one_complete_boolean
  - allow_chat_transcript_as_only_durable_result

