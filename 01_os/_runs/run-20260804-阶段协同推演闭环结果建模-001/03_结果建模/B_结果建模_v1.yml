common_result_object_contract:
  required_fields:
    - object_id
    - object_type
    - main_mechanism_ref
    - session_id
    - stage_id
    - created_by_actor_ref
    - authority_or_evidence_refs
    - exact_artifact_version_or_blob
    - status
    - scope
    - dependency_refs
    - supersedes_or_parent_refs
    - created_at
    - validation_result
  durability_rule: load_bearing_result_objects_must_not_exist_only_in_chat
  version_rule: accepted_objects_are_superseded_not_silently_rewritten
  unknown_required_field_rule: fail_closed

