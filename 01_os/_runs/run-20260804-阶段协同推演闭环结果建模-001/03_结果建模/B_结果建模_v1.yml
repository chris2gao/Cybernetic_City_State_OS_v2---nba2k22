      - Human_activation_authorization
      - dormant_or_simple_route_reason
      - deliberation_session_record
  - main_mechanism_ref: MM-02
    name: typed_inquiry_and_stop_router
    required_results:
      - model_element_record
      - inquiry_item
      - uncertainty_and_assumption_record
      - evidence_reference
      - atomic_claim_record
      - question_value_cost_timing_and_stop_result
  - main_mechanism_ref: MM-03
    name: multi_dimension_deliberation_and_grounding
    required_results:
      - round_result
      - semantic_grounding_record
      - issue_record
      - position_or_option_record
      - argument_record
      - objection_disposition_record
      - option_disposition_record
      - residual_disagreement_record
  - main_mechanism_ref: MM-04
