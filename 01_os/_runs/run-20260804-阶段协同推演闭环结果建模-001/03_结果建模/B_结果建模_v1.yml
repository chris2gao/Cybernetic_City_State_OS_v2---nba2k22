      - authorization_record
      - confirmation_record
      - waiver_or_exception_record
      - external_action_model
      - Human_external_action_authorization
      - returned_material_record
      - external_material_ingestion_result
  - main_mechanism_ref: MM-05
    name: material_event_dependency_invalidation_and_reconfirmation
    required_results:
