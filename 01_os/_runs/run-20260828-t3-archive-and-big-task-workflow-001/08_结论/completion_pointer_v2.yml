schema_version: citystate.completion_pointer.v1
supersedes: 08_结论/completion_pointer_v1.yml
supersession_note: >-
  v1 是在 MWU 进入 master 之前、以 d9a18b57 为 base 产出的历史 evidence。它保留、
  不改写、不 retroactively 套用当前规则。本 v2 是 rebaseline 之后的当前正式输出，
  按当前 master 的 Global MWU 契约产出。

minimum_work_unit_output:
  role: execution

  work_performed_or_requested: >-
    把已发布的 T3 候选 06d0c60e 以普通非 force merge 同步到当前 master 6757bee2，
    保留两个已发布提交不改写，解决唯一一处内容冲突并同时保住 master 的 MWU discovery
    与 T3 的 task_orchestration discovery，然后在同步后的树上重跑全部测量与门禁，
    产出 rebaseline 证据与本 v2 completion pointer，供关系隔离的独立审核。
    T3 本体交付未变：累计面工作集与归档治理，以及默认大任务与长时执行编排。

  implementation_or_review_method: >-
    先 fresh 读回远端 master 与 T3 分支头确认 diverged 且 merge-base 为 d9a18b57，
    再 git merge --no-ff --no-commit origin/master；冲突只有
    01_os/03_mechanisms/README.md 一处，人工保留双方条目并补一行说明两机制的分工。
    以 git diff origin/master 对三份常驻文档逐行核对，确认 T3 只增不删
    （+36 / +41 −1 / +14，唯一那条删除是 T3 自己上一版的句子被更长的一句替换）。
    随后在合并树上重跑 measure_working_set.py、survey_run_lifecycle.py、
    visible_set.py --measure、changed_path_ledger.py（base 换成当前 master），
    以及 T3 全套门禁加当前 master 新增的 MWU selftest 与 static。

  supportability_rationale: >-
    支撑设计的那条命题在当前 master 上被重新测量而不是被沿用：run 组 50→53、
    互不相同的自由文本状态串 24→27、可被机器判为终态的 run 仍为 0、
    communication archive 仍为空。根因"仓库无法机器区分已完成与在跑的 run"不但成立
    而且略微恶化，因此按 rebaseline 指令保持架构不变。回归判定用
    current master vs candidate 的 delta：继承套件在合并后为 task_discipline 54 passed、
    communication 84 passed + 6 subtests，均较合并前增加且无失败，
    MWU selftest 58 cases 与 static 均 validation_passed，故 candidate-caused regression 为 0。
    反向证据一并给出并且不加折扣：常驻 bootstrap 面由 61,534 增至 73,879 字节，
    其中 T3 自负 5,566，这一项是否值得由独立审核单独判定，不接受执行者的比值论证。

  feasibility_rationale: >-
    T3 早已隔离在自己的已发布任务分支上，普通 merge 即可保留其两个提交而无需任何
    history rewrite；实际冲突只有一处且是两条并列的 discovery 条目，不存在需要在
    master 语义与 T3 语义之间二选一的情形。所有测量脚本与 validator 都已在仓库内，
    重测无需新工具；发布走 local_git，hooksPath 实测为 .githooks，
    非 force、不写 master、无破坏性动作，因此整条路径在当前授权内可完成。

  exact_result_or_candidate_ref:
    source_branch: dev/os-v2-t3-archive-and-big-task-workflow-001
    original_base: d9a18b57749a0608a06ab546fd179b63e696e7f1
    rebaseline_master: 6757bee2f8dfa3cf55abb464189b953e2b072773
    original_candidate: 06d0c60e2ba526ac66138c578176a1f8d833e0a4
    post_sync_candidate: f85e66de3d86ee3eb685124739e60f007893248e
    post_sync_candidate_readback: >-
      git ls-remote origin refs/heads/dev/os-v2-t3-archive-and-big-task-workflow-001
      -> f85e66de3d86ee3eb685124739e60f007893248e（实际远端读回，非本地 HEAD 复制）
    merge_commit_local: d603ab6076cf7081a734e774d9ae4c2c97efd910
    merge_conflicts_total: 1
    merge_conflicts_resolved: 1
    conflict_detail: >-
      01_os/03_mechanisms/README.md — master 新增 minimum_work_unit_output 条目，
      T3 新增 task_orchestration 条目，双方保留，并补一行说明 MWU 管"输出什么"、
      task_orchestration 管"多大、何时停"。

