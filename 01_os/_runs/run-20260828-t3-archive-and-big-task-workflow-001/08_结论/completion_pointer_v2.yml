      - DF-02 "master 已含授权改动"与实测不符（已按物理事实处理；其后 master 正常演进 20 个提交，已确认非 history rewrite）
      - DF-03 开发入口 §7 任务包模板与 changed_path_ledger.py / preflight_task_context.py 的字段层级不一致；按 foreground 指令不在本任务顺手统一，保留 flat packet workaround，留待单独 canonical adjudication

