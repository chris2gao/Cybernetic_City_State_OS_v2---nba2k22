  residual_risk_or_unproved_limits:
    blocking: 0
    nonblocking: 7
    items:
      - R-01 68 个 run 组仍是 unknown 生命周期；本任务不回填，回填属运营判断
      - R-02 未对真实历史执行迁移；搬移能力仅在合成 fixture 上验证正负例与幂等
      - R-03 task_orchestration 无 02_boot 启动清单（路径不在 allowed_changed_paths 内，已在 registry 显式登记缺项）
      - R-04 字节不是 token；未测墙钟时间
      - R-05 隐藏面清单在契约与代码两处镜像，由漂移守卫看守，未合并为单一来源
