      - validate_minimum_work_unit_output.py static --root . = 0
      - git diff --check = 0
      - changed_path_ledger.py --base 6757bee2 = 0 (44 paths, out_of_scope 0)
    candidate_caused_regressions: 0
    corrected_measurement:
      measure_ref: 09_rebaseline/visible_set_measure_v3.json
      tracked_files: 1853
      full_listing_bytes: 216886
      visible_listing_bytes: 156078
