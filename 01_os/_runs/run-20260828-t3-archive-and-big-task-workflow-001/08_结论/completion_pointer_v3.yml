        旧 89.19% 由把 68 个不可判定组算入隐藏集得出，T3-IR-001 认定该策略 blocking，
        该数字作废，不得用于任何辩护。
    bootstrap_cost:
      original_base_bytes: 61534
      current_master_bytes: 68313
      candidate_bytes: 74598
      attributable_to_t3: 6285
      note: 较上一轮报告的 5,566 增大，因本轮如实补写了修正后的语义与收益说明。

  residual_risk_or_unproved_limits:
    blocking: 0
    escalated_unresolved: 1
    nonblocking: 6
    items:
      - R-07 / T3-IR-003 escalated_to_foreground 未关闭：常驻 bootstrap 增量 6,285 字节，
        而本机制当前枚举削减为 0 字节；28.04% 排除全部归属于早于 T3 的 communication 策略。
        是否值得是对常驻面的语义选择，按开发入口 §11 第 3 类不由执行者裁决。
        备选方案见 09_rebaseline/修正说明_v1.md 的三条。
      - R-01 68 个 run 组仍是 unknown；本轮只保证它们可见且不可归档，不回填状态
      - R-02 未对真实历史执行迁移；搬移能力仅在合成 fixture 上验证
      - R-03 task_orchestration 无 02_boot 启动清单（路径不在 allowed paths 内，已登记缺项）
      - R-04 字节不是 token；未测墙钟时间
      - R-05 隐藏面清单在契约与代码两处镜像，由漂移守卫看守，未合并为单一来源
      - R-06 通用归档器与 communication 归档器暂为两份实现，未合并
    dispatch_findings_open:
      - DF-03 按派单明令不在本轮修，保留 flat packet workaround 与 finding

