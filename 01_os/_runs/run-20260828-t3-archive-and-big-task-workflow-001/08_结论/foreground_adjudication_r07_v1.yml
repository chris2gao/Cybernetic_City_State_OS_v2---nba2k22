  interpretation: >-
    Core guidance that materially improves agent execution should not be weakened merely to
    reduce bootstrap tokens or bytes. Token economy is subordinate here to reliable adherence,
    boundary recognition, lifecycle discipline, and long-task continuation behavior.

foreground_decision:
  status: ACCEPTED_NONBLOCKING
  selected_option: retain_load_bearing_core_guidance
  do_not_slim_for_token_savings_only: true
  rationale: >-
    The corrected measurement invalidates the old claim that T3 currently removes most run/dev
    enumeration noise, but it does not invalidate the primary governance value of T3. The
    load-bearing changes make run lifecycle machine-readable going forward, keep unknown work
    visible and non-archivable, and encode long-horizon continuation/stop boundaries in files
    every agent reads. Under the Human priority, the measured 6,285-byte always-on increase is
    an acceptable cost for those core execution rules. Immediate listing-byte savings are not
    the acceptance criterion for core guidance.
  constraints:
    - do not restore unknown-hidden behavior
    - do not weaken lifecycle enum enforcement
    - do not weaken task_orchestration continuation/stop guidance
    - do not claim the 28.04 percent exclusion as a new T3 benefit
    - keep corrected measurements and withdrawn 89.19 percent claim explicit
    - future edits may improve clarity, but not solely optimize token count at the expense of execution quality

minimum_work_unit_output:
