findings:
  T3-IR-001:
    severity: blocking
    title: unknown lifecycle groups are hidden by default
    evidence: >-
      visible_set.partition makes only OPEN groups visible and explicitly hides terminal or UNKNOWN groups.
      test_open_group_visible_terminal_and_unknown_hidden codifies that behavior. The current measurement has
      70 accumulating groups: 2 open, 0 terminal, 68 unknown, while reporting 89.19 percent excluded listing bytes.
    why_blocking: >-
      The foreground review criterion required unknown groups to remain visible and non-archivable so an
      unclassifiable group cannot be silently treated as history. Current behavior obtains a material part of
      the reported visibility gain by hiding the exact 68 groups whose lifecycle cannot be trusted.
    required_correction:
      - unknown groups default visible; terminal groups may be hidden
      - archive eligibility remains terminal-only and fail closed
      - update build_index semantics consistently
      - replace the current unknown-hidden test with positive unknown-visible coverage
      - bind unknown visibility semantics in validate_working_set drift/static checks
      - rerun visible-set measurement and reassess R-07 using the corrected benefit

  T3-IR-002:
    severity: blocking
    title: completion pointer changed-path count is stale
    evidence: >-
      completion_pointer_v2 states changed_paths_vs_current_master=34, while fresh Git compare from
      6757bee2 to d7e3e1e9 shows 41 changed paths. The executor's latest foreground report also states 41.
    why_blocking: >-
      This is a formal completion/handoff artifact and its scope evidence must describe the actual review target.
      The discrepancy does not imply scope escape, but the durable pointer cannot be accepted while its exact count is stale.
    required_correction:
      - publish a new completion pointer rather than rewriting v2
      - distinguish canonical implementation candidate from later evidence-only branch head
      - record exact fresh compare path count and out-of-scope count

  T3-IR-003:
    severity: nonblocking
    title: R-07 bootstrap cost cannot be finally judged until visibility semantics are corrected
    evidence: >-
      T3 adds 5,566 bytes to the always-loaded bootstrap while the current 89.19 percent listing reduction is
      measured under the now-rejected unknown-hidden policy.
    disposition: >-
      Recompute the corrected visible-set benefit. The 5,566-byte cost is not independently blocking by itself;
      it becomes a design blocker only if the corrected measurement no longer supports the claimed operational value.

accepted_dimensions:
  archive_fail_closed: >-
    PASS. archive_group requires exact TERMINAL classification, a readable in-group closure record, reference
    safety, and no tracked private runtime. Freeform or unknown state is not archivable and there is no force override.
  task_orchestration_boundary: >-
    PASS on inspected semantics. Ordinary task-branch commit/push is internal continuation; size alone adds no
    authorization; genuine protected/destructive/runtime/semantic boundaries still stop.
  master_compatibility: >-
    PASS on fresh Git relation. Current branch is ahead of master with merge-base equal to current master; no rebase
    or history rewrite is needed for the correction.
  authorization_and_mwu_preservation: PASS_on_inspected_diff_and_rebaseline_evidence

review_execution_limit:
