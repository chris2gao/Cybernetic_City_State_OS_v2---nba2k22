  reason: authorized remote desktop device was unavailable when execution was attempted
  effect_on_verdict: >-
    None for T3-IR-001 or T3-IR-002: both are direct contradictions visible in immutable source, committed tests,
    measurement output, completion evidence, and fresh Git compare. A later reviewer should still rerun the corrected suites.

