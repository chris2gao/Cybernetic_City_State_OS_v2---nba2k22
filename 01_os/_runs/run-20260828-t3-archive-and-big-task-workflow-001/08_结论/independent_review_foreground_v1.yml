  work_performed_or_requested: >-
    Independently review the rebaselined T3 working-set/archive and big-task orchestration candidate against current
    master, with special attack on unknown visibility, archive fail-closed behavior, measured benefit, bootstrap cost,
    and exact completion evidence.
  implementation_or_review_method: >-
    Fresh-read the remote branch and master relation, inspected the canonical contracts and implementation rather than
    accepting executor summaries, traced the visibility partition into its committed tests and measurement output,
    inspected archive eligibility and task-orchestration boundaries, and compared the formal completion pointer with
    the exact Git diff for the current review target.
  supportability_rationale: >-
    The FIX_REQUIRED verdict rests on two primary-evidence contradictions: code and tests deliberately hide UNKNOWN
    groups although the review boundary requires them visible, and the durable completion pointer reports 34 changed
    paths while the exact current Git comparison reports 41. Neither finding depends on executor interpretation.
  feasibility_rationale: >-
    Both blockers are narrow and can be corrected on the existing task branch without changing the lifecycle enum,
    archive eligibility model, authorization semantics, MWU, communication ownership, or published history.
  verdict: FIX_REQUIRED
