# Field placement note (DF-03, see dispatch_findings below): the section 7
# template in 01_os/开发入口与单窗口任务规范_v1.md shows these fields nested under
# a `task_packet:` key, but both tools that actually consume a packet —
# 01_os/06_execution/task_discipline/path_ledger/changed_path_ledger.py and
# .../preflight/preflight_task_context.py — read `allowed_changed_paths` from the
# top level, as do the existing packets in this repository. This file follows the
# tools and the existing packets, and reports the inconsistency rather than
# silently changing either.

task_id: os-v2-t3-archive-and-big-task-workflow-001
repository: chris2gao/Cybernetic_City_State_OS_v2---core
risk_tier: T2_semantic
risk_tier_basis: >-
  The brief fixes the objective and the boundary but not the answer to "what
  counts as archived", who owns a lifecycle state, or which contract carries the
  big-task principle. Those are semantic choices, so the tier cannot be T0/T1.
  It is not T3: no master write, no destructive Git, no history rewrite, no
  runtime activation, no secrets, no learner data. Ordinary task-branch
  publication does not raise the tier (开发入口 section 7).
exact_base_sha: d9a18b57749a0608a06ab546fd179b63e696e7f1
branch: dev/os-v2-t3-archive-and-big-task-workflow-001
objective: >-
  Implement, not merely propose, (A) cumulative-artifact archive and active
  working-set governance covering 01_os/_runs, 01_os/_communication,
  01_os/_dev and analogous accumulating surfaces, and (B) a default big-task
  long-horizon workflow principle under which deterministic in-scope
  continuation is internal completion work rather than a new Human gate, while
  genuine boundaries still stop the task.

