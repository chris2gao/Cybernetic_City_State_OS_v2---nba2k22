dispatch_findings:
  - id: DF-01
    severity: nonblocking
    finding: >-
      The execution brief's required_source_refs and allowed_changed_paths
      contain mojibake: every CJK path segment was written as ASCII '?' (for
      example 01_os/????????????_v1.md). The producing window lost the UTF-8
      path text.
    resolution: >-
      Character counts map one-to-one onto exactly one existing tracked path
      each, so the reconstruction is a derivation, not a semantic choice:
      12 -> 开发入口与单窗口任务规范, 7 -> 导航与归档契约,
      11 -> 文件隔离与产物生命周期, 2+6 -> 实现/文件布局契约. This packet records
      the reconstructed paths and reports the defect rather than silently
      following the damaged text.
  - id: DF-02
    severity: nonblocking
    finding: >-
      Current Human chat instruction stated that the latest master already
      carries the authority change enabling this task. Fresh
      git ls-remote origin refs/heads/master returned
      d9a18b57749a0608a06ab546fd179b63e696e7f1, identical to the previously
      observed head, and the T3 dispatch existed only on the unpublished control
      branch (771869cb, later 6a229b92).
    resolution: >-
      Physical Git state wins. Authority for this window is taken from the
      physically readable Human decision blob plus the current direct Human
      instruction (direct_current_Human_authorization in
      01_os/03_mechanisms/communication_system/角色与权限边界_v1.yml), not from
      an assumed master state. The v2 relay pointer was subsequently validated by
      the canonical receiver bootstrap at 6a229b92, exit 0.
  - id: DF-03
    severity: nonblocking
    finding: >-
      Section 7 of 01_os/开发入口与单窗口任务规范_v1.md shows packet fields nested
      under a `task_packet:` key, but changed_path_ledger.py and
      preflight_task_context.py both read `allowed_changed_paths` from the top
      level, and every existing packet in the repository is flat. A nested packet
      is rejected with "allowed_changed_paths missing or empty", exit 3.
    resolution: >-
      This packet follows the tools and the existing packets. Reconciling the
      template with the tools is a semantic choice about what a valid packet is,
      so it is reported as a finding for a later task rather than decided here.
