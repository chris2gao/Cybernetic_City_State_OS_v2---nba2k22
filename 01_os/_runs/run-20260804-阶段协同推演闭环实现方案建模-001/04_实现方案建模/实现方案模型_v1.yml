  - {round_id: SOL-R5, function: tradeoffs_failure_modes_execution_boundaries_and_solution_freeze, status: complete}

purpose: >-
  定义“阶段协同推演与增量再确认机制”的最小充分、可实现、可测试、可加载和可回滚方案。
  本模型选择文件边界、契约所有权、实例布局、确定性路由、加载链、validator、receipt、
  原子部署和执行包边界；不直接修改 canonical，不授权实施或接入 master。

non_goals:
  - create_global_event_bus
  - create_graph_database_or_cross_run_state_service
  - create_generic_permission_identity_or_policy_service
  - create_general_workflow_engine
  - copy_full_IBIS_QOC_ADR_or_PEP_system
  - create_counterexample_registry_DSL_or_new_test_framework
  - define_universal_numeric_EVPI_interruption_or_model_independence_threshold
  - auto_dispatch_external_research_without_Human_authorization
  - rewrite_historical_runs_or_bound_B_v1

solution_architecture:
  shape: declarative_global_mechanism_with_single_deterministic_validator
  runtime: file_based_stage_instance_packages_under_existing_run_roots
  reference_topology: workflow_stage_references_global_profile_and_does_not_copy_mechanism
  authority: durable_Human_decision_authorization_confirmation_and_waiver_records
  history: append_only_successors_transitions_and_supersedes
  failure_policy: fail_closed_on_missing_partial_stale_unknown_invalid_or_unauthorized
  service_process_required: false
  database_required: false
  new_protocol_or_lifecycle_required: false

candidate_canonical_topology:
  mechanism_root: 01_os/03_mechanisms/stage_collaborative_deliberation/
  public_and_method:
    - README.md
    - 方法论_v1.md
  profile_contracts:
    - 阶段profile契约_v1.yml
    - 阶段profiles_v1.yml
  implementation_contracts:
    - 实现/README.md
    - 实现/结果对象契约_v1.yml
    - 实现/状态转换与不变量契约_v1.yml
    - 实现/路由与失败契约_v1.yml
    - 实现/加载与receipt契约_v1.yml
    - 实现/verify_stage_collaborative_deliberation.py
  authority_and_evidence_basis:
    - 依据材料/README.md
    - 依据材料/requirement/**
    - 依据材料/evidence/**
    - 依据材料/result_contract/**
  boot:
    - 01_os/02_boot/stage_collaborative_deliberation/README.md
    - 01_os/02_boot/stage_collaborative_deliberation/启动清单_v1.yml
  loader: 01_os/06_execution/boot/stage_collaborative_deliberation/README.md
  registry: 01_os/05_registry/stage_collaborative_deliberation_v1.yml

component_ownership:
  README_and_method: Human_and_model_operating_semantics
  profile_contract_and_set: stage_specific_activation_focus_gates_and_required_refs
  result_object_contract: 45_catalog_objects_47_resolved_names_common_envelope_and_composition
  state_transition_contract: ten_dimensions_sixteen_invariants_and_transition_records
  router_failure_contract: trigger_inquiry_material_event_granularity_external_action_and_complete_failure_union
  load_receipt_contract: boot_loader_registry_profile_load_and_receipt_fields
  validator: deterministic_checks_only_not_policy_creation
  boot_manifest: load_order_versions_and_failure_policy
  loader: resolution_injection_exclusion_and_fail_closed_execution
  registry: discovery_lifecycle_and_failure_surfacing
  workflow_stages: profile_refs_and_stage_specific_instance_records
  Human_records: authority_and_risk_acceptance
  run_artifacts: instance_evidence_and_state_history

instance_package:
  root_pattern: <run-root>/<stage-output-root>/stage_collaborative_deliberation/
  required_paths:
    - stage_profile_instance.yml
    - session/session_record.yml
    - objects/<object_type>/<object_id>.yml
    - transitions/<sequence>_<transition_id>.yml
    - events/<event_type>/<event_id>.yml
    - failures/<sequence>_<failure_id>.yml
    - receipts/stage_receipt.yml
  optional_attachments: attachments/<authorized-returned-material>
  runtime_cache: <run-root>/_runtime/stage_collaborative_deliberation/
  one_current_object_version_per_file: true
  transition_history_append_only: true
  canonical_live_instance_state: prohibited

result_object_realization:
  catalog_unique_object_types: 45
  main_mechanism_required_result_names: 47
  unresolved_names: 0
  common_envelope_required_fields:
    - object_id
    - object_type
    - schema_version
    - mechanism_version
    - main_mechanism_ref
    - session_id
    - stage_id
    - created_by_actor_ref
    - authority_or_evidence_refs
    - exact_artifact_version_or_blob
    - status
    - scope
    - dependency_refs
    - supersedes_or_parent_refs
    - created_at
    - validation_result
  composition_mappings:
    dormant_or_simple_route_reason:
      resolves_to:
        - trigger_evaluation_result.dormant_or_simple_route_reason
        - stage_receipt.activation_mode_or_dormant_reason
      duplicate_object: false
    question_value_cost_timing_and_stop_result:
      resolves_to:
        - inquiry_and_evidence_family.question_value_result
        - inquiry_item.expected_information_value
        - inquiry_item.acquisition_and_Human_interruption_cost
        - inquiry_item.timing
        - inquiry_item.stop_or_escalation_condition
      duplicate_object: false
  unknown_required_field: fail_closed

state_transition_and_invariants:
  state_dimensions: 10
  dimensions:
    - SD-01_epistemic_claim_state
    - SD-02_semantic_grounding_state
    - SD-03_goal_and_boundary_state
    - SD-04_preference_state
    - SD-05_issue_and_objection_state
    - SD-06_option_disposition
    - SD-07_decision_state
    - SD-08_confirmation_state
    - SD-09_review_state
    - SD-10_execution_and_verification_state
  generic_complete_substitution: prohibited
  current_projection: object_file.state_dimensions
  authoritative_history: append_only_transition_files
  active_invariants: 16
  invariant_evaluation_points:
    - object_creation
    - transition_attempt
    - stage_start_gate
    - stage_completion_gate
    - material_event_ingestion
    - external_action_authorization
    - execution_authorization
    - receipt_validation
  INV_16:
    rule: vote_majority_or_headcount_does_not_constitute_reasoned_disposition
    implementation: require_disposition_basis_and_reject_count_as_sole_basis
    count_may_be_context: true
    failure_code: headcount_used_as_disposition

transition_contract:
  required_fields:
    - transition_id
    - sequence
    - object_id
    - dimension_id
    - from_state
    - to_state
    - trigger_event_ref
    - evidence_or_authority_refs
    - actor_role
    - exact_artifact_version
    - evaluated_invariant_ids
    - validation_result
    - timestamp
  rejected_transition_is_durable: true
  unknown_state_or_transition: fail_closed

routers:
  trigger_activation:
    order:
      - validate_versions_profile_and_active_contract
      - identify_load_bearing_gaps
      - evaluate_profile_triggers
      - evaluate_simple_or_dormant_route
      - emit_trigger_evaluation
      - obtain_exact_Human_activation_authorization_when_activating
      - create_session
    modes:
      dormant: no_load_bearing_gap_and_no_mandatory_trigger
      full: new_or_structurally_changed_bearing_model
      incremental: ordinary_bearing_update_with_known_affected_scope
    round_minimums: {full: 5, incremental: 2}
    empty_or_formalistic_rounds_count: false
  inquiry:
    gap_types: [missing_field, unknown_fact, unverified_assumption, terminology_ambiguity, claim_conflict, insufficient_evidence, lack_of_capability, true_unknown]
    priority_order:
      - correctness_safety_testability_or_integration_blocker
      - downstream_decision_or_authority_impact
      - risk_and_irreversibility
      - expected_information_gain
      - blocker_reduction
      - lower_acquisition_and_Human_interruption_cost
    universal_numeric_threshold: false
    stop_when:
      - no_blocking_gap_and_required_results_complete
      - remaining_questions_durably_deferred_nonblocking
      - next_question_cannot_change_result_test_or_authority_scope_and_cost_exceeds_value
      - valid_Human_stop_or_scope_decision
  material_event:
    order:
      - normalize_event
      - bind_exact_source
      - load_dependency_graph_version
      - classify_affected_unaffected_unknown
      - emit_dependency_impact
      - invalidate_affected_scope
      - preserve_explicitly_justified_unaffected_scope
      - block_unknown_scope
      - create_successor_and_reconfirmation_requirements
    global_invalidation_default: false
    unknown_dependency: fail_closed_for_affected_progression
  granularity:
    ordered_classes:
      - main_mechanism
      - first_order_required_detail
      - ordinary_local_choice
      - second_order_detail_divergence
      - classification_blocked_insufficient_information
    ordinary_local_choice: resolve_and_record_without_Human_scope_gate
    second_order_detail: durable_event_and_Human_scope_decision_before_expansion
    nonblocking_detail: durable_defer_and_continue_independent_main_work_only
  external_action:
    order:
      - create_exact_action_model
      - obtain_Human_authorization
      - execute_authorized_scope_only
      - record_returned_material
      - normalize_sources_and_fact_policy_inference
      - ingest_and_route_material_event_if_bearing
    report_count_as_independence: false
  review_execution_verification:
    executor_self_review: prohibited
    blocker_or_major_self_clearance: prohibited
    execution_requires_exact_task_branch_base_allowlist_authorization: true
    implementation_complete_equals_verified: false

