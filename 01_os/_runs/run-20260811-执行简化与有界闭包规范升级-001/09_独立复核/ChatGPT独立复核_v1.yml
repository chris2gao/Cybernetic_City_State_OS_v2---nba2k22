blocking_finding:
  id: publication_taxonomy_conflation
  severity: blocking_before_master
  files:
    - 01_os/开发入口与单窗口任务规范_v1.md
  locations:
    - section 7 T3_high_risk description
    - section 11 class 4 protected action
  observed: >-
    Section 11 says any of the six classes causes stop-and-return, while class 4 names unqualified
    publication as a protected action. Existing section 6 still requires ordinary work-branch push after
    validation, and repository_publisher_authority_v1.yml explicitly grants push_source_branch without a
    new per-push Human action gate. Therefore the new wording can be read to force a Human micro-gate before
    an otherwise pre-authorized source-branch publication. Section 7 also uses "master and shared publication
    blast radius" in T3 wording without distinguishing protected shared-state publication from ordinary
    authorized task-branch publication; because the objective path ends at a pushed completion pointer, this
    can over-classify ordinary implementation tasks as T3.
  required_correction: >-
    Introduce no new mechanism. Clarify the existing publication taxonomy in the same file: ordinary
    source/task-branch publication already authorized by the current task packet plus
    repository_publisher_authority_v1.yml remains part of normal section 6 execution and is not itself a
    class-4 stop. Class 4 covers publication/protected actions that are not already authorized by the current
    authority/packet, actions that require an action-bound Human gate, master/shared protected-state
    publication, failed required publication gates, non-fast-forward conditions, and destructive/history
    actions. Align the T3 wording with the same distinction so a normal authorized task-branch push does not
    itself imply T3.
  prohibited_fix: >-
    Do not weaken master, destructive Git, runtime/scheduler, secret/security or publication gate rules; do
    not change repository_publisher_authority_v1.yml; do not create a second publication policy.

nonblocking_finding:
