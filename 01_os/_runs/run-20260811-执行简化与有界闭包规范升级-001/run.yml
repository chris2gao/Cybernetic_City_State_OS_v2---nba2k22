  method: >-
    机器级仅覆盖物理事实（base/branch/worktree、changed-path ledger、allowlist closure、
    编码与换行、git diff --check、既有 run 未改、禁止路径未触、master 未变、远端读回）。
    本仓无任何 validator 读取这两份散文文件，故不存在证明散文语义正确的机器门，本任务未制造一个。
  new_files_outside_run: 0
  new_schema_fields: 0
  new_machine_tools: 0
  new_workflows: 0
  new_policy_documents: 0
lifecycle: candidate_ready_for_independent_review
next_owner: ChatGPT_independent_review
