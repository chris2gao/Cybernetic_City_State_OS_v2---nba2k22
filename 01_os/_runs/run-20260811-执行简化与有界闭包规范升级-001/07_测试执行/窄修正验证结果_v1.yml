executor_note_on_third_hunk:
  what: >-
    §2 的 protected-action scope 子句原本也把无限定的「发布」列在其中，与被复核判定为 blocker
    的第 11 类第 4 项是同一处 taxonomy conflation 的第二个实例。
  why_included: >-
    它在本轮授权边界内（同一文件），且由本轮 objective 已固定的规则算出——统一本文件内的
    publication taxonomy。留着它会让同一概念在同一文件里有两个互相矛盾的表述，
    违反"一个概念只在一个 canonical 位置完整定义"。
  what_it_does_not_do: >-
    不放宽任何授权：该句仍然声明 §2 不授权任何 protected action，只是把"发布"限定为
    "受保护的 publication"，并把分类权指回第 11 节第 4 类唯一定义处。
  reviewer_action: 若复核者认为超出窄修正范围，可要求回退此 hunk，其余两处独立成立。
