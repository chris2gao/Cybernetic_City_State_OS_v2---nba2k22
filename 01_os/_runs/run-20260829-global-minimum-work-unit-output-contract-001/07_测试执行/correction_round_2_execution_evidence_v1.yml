minimum_work_unit_output:
  role: execution
  work_performed_or_requested: >-
    Execute Global MWU correction round 2: make the rationale and assessment structural
    text floor Unicode-safe and language-neutral, and require non-empty text for
    work_performed_or_requested and implementation_or_review_method, closing
    MWU-R1-FG-IR-001 and MWU-R1-FG-IR-002 without reopening the MWU architecture.
  implementation_or_review_method: >-
    Replaced the ASCII-only normalization with the exact complement rule so ASCII output
    is unchanged, added a declared codepoint-range content-unit rule for scripts written
    without word separators, added a type-and-emptiness floor for the two non-rationale
    core fields, declared both in the canonical contract, bound them with new static drift
    mutations, then reproduced each finding against the pre-correction validator extracted
    from 6eb8441c before rerunning selftest, static, drift, artifact CLI, an ASCII
    differential probe and a base-versus-candidate quiet_verify comparison.
  supportability_rationale: >-
    Closure rests on observed opposite behaviour rather than on assertion: the
    pre-correction validator rejects both valid Chinese fixtures and accepts the non-text
    core-field fixture, while the corrected validator inverts all three, and the ASCII
    differential probe returns zero behaviour differences over 207 samples with a working
    positive control, so the multilingual fix demonstrably did not move the English floor.
  feasibility_rationale: >-
    Every change is confined to the two MWU canonical paths and this run directory, needs
    only the PyYAML dependency already present, requires no protected action beyond an
    ordinary task-branch push, and is checkable by rerunning the four validator modes on
    the exact candidate commit.
  exact_result_or_candidate_ref: b17bdc0826a4519af0da69b61370f0b657acc7c4
  verification_evidence:
    - selftest exit 0 with 58 cases, a strict superset of the previous 38
    - static exit 0 and drift exit 0 with 13 cases, up from 9
    - artifact CLI 6 focused cases each matching its expected exit code
    - ASCII differential probe exit 0, 0 differences over 207 samples
    - quiet_verify identical failure set at base and candidate, delta 0
  residual_risk_or_unproved_limits:
    - No independent review of this correction has been performed in this window.
    - >-
      The generic-only rejection set remains an English-only enumeration, so a vacuous
      non-English phrase that clears the content-unit floor is not caught. This is a
      structural limit of a closed list, not a defect introduced by this round, and
      closing it would require the language heuristics the dispatch prohibits.
    - >-
      The unspaced-script codepoint list is finite and declared. A script that lacks word
      separators but is absent from that list is still measured by whitespace tokens.
    - Machine checks remain a structural floor and prove nothing about semantic truth.
    - >-
      Windows-only execution; no Linux measurement, and the repository is not globally
      green at the dispatch master baseline.
