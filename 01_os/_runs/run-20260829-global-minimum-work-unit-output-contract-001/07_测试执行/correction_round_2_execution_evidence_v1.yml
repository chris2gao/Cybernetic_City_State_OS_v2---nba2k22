local_environment_incident_and_recovery:
  classification: local execution accident, not a correction-round finding
  what_happened: >-
    The preflight and checkout steps were written into one PowerShell script without
    fail-fast. `git switch dev/os-v2-global-minimum-work-unit-output-contract-001`
    returned exit 128 because that branch is checked out by another worktree at
    C:/Users/gk/.codex/worktrees/mwu-independent-review-001, which holds the historical
    independent-review checkout at c76bc77c. The script did not stop, so the next line
    `git merge --ff-only 6eb8441c` executed while HEAD was still on master.
  effect: local master fast-forwarded d9a18b57 -> 6eb8441c
  remote_master_effect: none
  remote_master_observed_after_incident: 1559346ca2eab776cad110c7d96475f34a33f9b2
  push_performed_during_incident: false
  disclosure: reported to the Human before any further write
  recovery_authorization: explicit current-Human approval, scoped to undoing this exact accident only
  recovery_command: git reset --hard d9a18b57749a0608a06ab546fd179b63e696e7f1
  recovery_verified:
    head_after_reset: d9a18b57749a0608a06ab546fd179b63e696e7f1
    worktree_clean_before_reset: true
    worktree_clean_after_reset: true
    remote_master_after_reset: 1559346ca2eab776cad110c7d96475f34a33f9b2
    master_pushed: false
    git_clean_run: false
    force_push_run: false
    codex_worktree_touched: false
  method_change_after_recovery: >-
    Correction round 2 was executed in a new detached worktree created from the exact
    remote branch head, so the occupied branch was never checked out.
  root_cause: the script did not fail fast after a non-zero exit code
  remedy_applied: >-
    Every script in this window now defines an Assert-Ok helper that exits on a non-zero
    $LASTEXITCODE, and precondition checks abort before any mutating command.

