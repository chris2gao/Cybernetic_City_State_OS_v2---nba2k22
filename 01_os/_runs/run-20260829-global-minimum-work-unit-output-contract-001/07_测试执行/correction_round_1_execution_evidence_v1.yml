residual_limits:
  - >-
    The rationale and assessment checks are a structural floor only. They cannot show
    that a justification is true, sufficient or task-appropriate.
  - >-
    Evidence-ref containment proves the refs were drawn from the declared examined set.
    It does not prove the reviewer actually attacked the rationale or reasoned correctly.
  - >-
    The tightened containment rule makes the previous round's independent_review_codex_v1.yml
    non-conforming under --require-mwu. It was deliberately left unmodified. Whether the
    rule should also accept a document-level primary_evidence_examined is a semantic choice
    that this correction did not make and that a reviewer or the foreground should settle.
