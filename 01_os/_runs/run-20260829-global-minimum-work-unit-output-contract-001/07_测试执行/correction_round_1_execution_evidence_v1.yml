minimum_work_unit_output:
  role: execution
  work_performed_or_requested: >-
    Execute correction round 1 of the Global MWU output contract, closing MWU-IR-001
    through MWU-IR-004 in the mechanism contract, its READMEs and the validator, and
    record the exact commands, exit codes and regression comparison.
  implementation_or_review_method: >-
    Converted each blocking finding into a deterministic structural check, mirrored the
    check constants into the canonical contract, bound the two representations to each
    other in static validation, and added a drift mode that applies shadow mutations to
    an isolated copy of the consumed paths to prove the bindings actually fire. Ran the
    full case matrix plus the artifact CLI, and compared quiet_verify on the exact
    baseline and candidate trees.
  supportability_rationale: >-
    Every one of the nine reproduced false accepts now has a named case in the built-in
    matrix with an observed rejecting error code, the duplicate-key fixtures return exit
    code 1 with a clean duplicate-key error, and the four static mutations the reviewer
    used are re-run automatically by the drift mode. The contract text was changed in the
    same commit so the validator never claims more than the structural floor it enforces.
  feasibility_rationale: >-
    The change stayed inside the MWU mechanism, boot, registry and validator surface plus
    this run directory, needed only the PyYAML dependency already in use, and required no
    protected master action; the branch was published with an ordinary non-force push.
  exact_result_or_candidate_ref: 04e243dac34dd9e2183acebd3fd9f71919804d01
  verification_evidence:
    - selftest exit 0 with 38 cases and zero mismatches
    - static exit 0 with the new contract-to-implementation bindings active
    - drift exit 0 over one clean control plus eight shadow mutations
    - duplicate-key top-level and nested fixtures both exit 1 without a traceback
    - quiet_verify identical on baseline 1559346c and candidate 04e243da
    - git diff --check exit 0
  residual_risk_or_unproved_limits:
    - Structural floor proves structure, never semantic sufficiency.
    - Prior-round review artifact no longer validates under the tightened rule; left unmodified.
    - No Linux execution and no globally green repository verification.
    - Executor self-measurement; a fresh isolated independent review has not yet run.
