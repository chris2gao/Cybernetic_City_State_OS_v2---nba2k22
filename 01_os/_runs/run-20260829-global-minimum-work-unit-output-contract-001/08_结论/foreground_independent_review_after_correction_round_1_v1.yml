findings:
  - id: MWU-R1-FG-IR-001
    severity: blocking
    claim: The rationale text floor has a material multilingual false-reject because normalization discards non-ASCII text.
    evidence: >-
      _normalized_phrase applies re.sub(r"[^a-z0-9]+", " ", value.lower()). A non-empty
      Chinese rationale such as “该实现由当前契约和验证证据直接支撑。” normalizes to an
      empty string and _text_floor_errors returns missing_or_empty even though the value is
      valid non-empty text. The global repository and Human task language are not English-only.
    consequence: >-
      Legitimate Chinese or other non-ASCII MWU rationales and reviewer assessments can be
      rejected by the global mechanism, so the candidate is not safe to promote as a
      repository-wide output contract.
  - id: MWU-R1-FG-IR-002
    severity: blocking
    claim: Two of the four core narrative fields still accept arbitrary non-text scalars.
    evidence: >-
      validate_document applies _text_floor_errors only to supportability_rationale and
      feasibility_rationale. work_performed_or_requested and implementation_or_review_method
      use _present(), for which booleans and numbers are present. The T2 source contract says
      these fields must state the concrete work and implementation/review method.
    consequence: >-
      A formal MWU can satisfy half of the four-field core with values such as true and 1,
      contradicting the core narrative-output semantics and the advertised structural floor.
nonblocking_observations:
  - >-
    The prior review artifact failing the corrected unit-local evidence-containment rule is
    historical compatibility, not a blocker; do not weaken unit-local containment merely to
    make old evidence retroactively compliant.
