residual_risk:
  - Full quiet verification is not green on either base or candidate; no candidate-caused delta was observed.
  - Natural-language semantic sufficiency cannot be completely machine-proved, so validator checks must be structural and independent review remains load-bearing.
  - No Linux execution was performed in this review.

next_action: >-
  Keep the candidate out of master. Correct the blocking validator/parser and
  schema-binding gaps on the task branch, publish a new exact canonical candidate
