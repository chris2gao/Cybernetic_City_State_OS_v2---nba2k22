candidate_caused_regression_assessment:
  result: no_candidate_caused_failure_observed_in_quiet_verify
  notes: >-
    The exact base and exact candidate produced the same two nonzero checks and the
    same two passing checks. Those full-repository failures are baseline state, not
    evidence against this candidate; they also prevent claiming a globally green
    repository verification.

findings:
  - id: MWU-IR-001
    severity: blocking
    claim: Rationale type and semantic-minimum checks have material false passes.
    evidence: >-
      validate_minimum_work_unit_output.py:38-46 treats any nonempty non-container
      scalar as present and only rejects a small exact normalized phrase set.
      The candidate accepted boolean/integer rationales, "All tests passed", and
      "This work is feasible" in the independent adversarial run.
    consequence: >-
      A new formal output can be declared MWU-compliant without either required
      task-specific justification, contradicting field_semantics and quality_rules.
  - id: MWU-IR-002
    severity: blocking
    claim: Independent-review rationale attack is not structurally bound to examined primary evidence.
    evidence: >-
      validate_minimum_work_unit_output.py:86-95 checks mapping keys and nonemptiness
      only. It accepted primary_evidence_examined=[evidence:A], assessment refs=[evidence:B],
      one-word supported/feasible assessments, and an unbounded BANANA verdict.
    consequence: >-
      The load-bearing implementation-choice-to-rationale-to-primary-evidence-to-
      independent-attack invariant can pass without an actual evidence linkage or
      meaningful independent assessment.
  - id: MWU-IR-003
    severity: blocking
    claim: Static validation does not bind key contract, boot, and registry structures to implementation constants.
    evidence: >-
      validate_minimum_work_unit_output.py:169-203 checks the core field list and
      role-name set but not role additions, assessment field list, boot load_order,
      or registry entries. Four independently mutated shadow bundles erased or
      changed those structures and still returned no static errors.
    consequence: >-
      Future schema/validator, boot, or registry drift can remain silent while the
      advertised static gate reports success.
  - id: MWU-IR-004
    severity: blocking
    claim: Artifact YAML parsing accepts duplicate mapping keys.
    evidence: >-
      _load_yaml uses yaml.safe_load without a unique-key loader. A fixture with two
      supportability_rationale keys, the second boolean true, returned
      validation_passed with exit code 0.
    consequence: >-
      Ambiguous last-key-wins artifacts can cross the formal compliance gate and
      different parsers may observe different rationale evidence.

executor_rationale_assessment:
  supportability_assessment: >-
    Partially supported. Exact comparison with the T2 trial proves that the four
    fields and role-specific obligations were preserved, and the canonical diff
    proves excluded mechanisms were not modified. The single real T2 execution
    sample shows usability in one task. It does not prove the global validator's
    rationale-quality or reviewer-attack gates are adequate; independent tests
    directly contradict that wider implication.
  feasibility_assessment: >-
    Supported for implementation mechanics but not for acceptance readiness. The
    YAML/Python surface runs locally with existing dependencies, official selftest
    and static commands exit 0, all changed paths are in scope, and no protected
    master action is needed for the task branch. Safe global enforcement remains
    infeasible on this candidate until the blocking false-pass and drift gaps are
    corrected and independently retested.
  primary_evidence_refs:
    - a71db910e9f0e17963e73aa8e6bd5d05f5aa7574:01_os/_runs/run-20260828-t2-stage04-structural-provenance-upstream-001/04_机制试验/minimum_work_unit_output_contract_v1.yml
    - c8f38c67595747f851785218c511ae461c233167:01_os/03_mechanisms/minimum_work_unit_output/最小工作单元输出契约_v1.yml
    - c8f38c67595747f851785218c511ae461c233167:01_os/06_execution/boot/minimum_work_unit_output/validate_minimum_work_unit_output.py
    - 1559346ca2eab776cad110c7d96475f34a33f9b2..c8f38c67595747f851785218c511ae461c233167
    - 01_os/_runs/run-20260828-t2-completion-001/07_测试执行/p2_2_execution_evidence_v1.yml
    - 01_os/_runs/run-20260829-global-minimum-work-unit-output-contract-001/07_测试执行/targeted_validation_v1.yml
  unsupported_or_inferred_claims:
    - Eight built-in cases are sufficient to establish validator quality.
    - Exact-phrase vague-rationale rejection enforces the task-specific rationale semantics.
    - Presence of primary_evidence_refs proves the reviewer attacked the executor rationale against examined evidence.
    - Current static validation prevents role-addition, assessment-field, boot-load-order, or registry-entry drift.

authority_and_scope_regression:
  result: PASS
  notes: >-
    No authority, communication, context-management, model-routing, T2 implementation,
    or automatic-progression path appears in the exact canonical diff. Candidate
