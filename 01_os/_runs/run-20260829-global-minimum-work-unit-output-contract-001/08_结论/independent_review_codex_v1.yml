semantic_review:
  trial_fidelity:
    result: PASS
    notes: >-
      The candidate preserves the four-field core, all three material-work-unit
      roles, their role-specific additions, the distinction between measurement
      and inference, and the executor-rationale-as-claim invariant. Task-local
      carrier and experiment metadata were correctly not promoted.
  abstraction_level:
    result: PASS
    notes: >-
      The mechanism is a thin cross-workflow output obligation. It does not create
      a second workflow, context selector, model router, communication envelope, or
      per-tool-call log.
  authority_neutrality:
    result: PASS
    notes: >-
      Contract and boot both declare authority_effect none; the contract declares
      scope_effect none and preserves current Human confirmation rules. The exact
      canonical diff does not touch authority or publication policy files.
  communication_boundary:
    result: PASS
    notes: >-
      The contract leaves envelope, delivery, acknowledgement, progression, and
      exact-pointer transport with communication_system and only allows MWU output
      to be carried or referenced.
  reviewer_attack_of_rationale:
    result: FAIL
    notes: >-
      Contract prose states the invariant, but the validator permits disjoint
      evidence sets and one-word assessments, so formal compliance does not prove
      that the reviewer examined or attacked the executor rationale.
  diff_scope:
    result: PASS
    changed_paths: 11
    out_of_scope_paths: 0
    notes: >-
      The canonical diff changes only MWU mechanism, boot, registry, validator,
      navigation, and this task run. The later evidence commit does not change the
      canonical mechanism.

