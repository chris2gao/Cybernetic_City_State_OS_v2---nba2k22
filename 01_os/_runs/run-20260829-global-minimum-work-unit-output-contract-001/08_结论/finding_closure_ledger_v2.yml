closure_meaning: >-
  CLOSED means the executor observed the finding's failure shape rejecting or accepting
  as the finding describes on the pre-correction validator, and the opposite result on
  the candidate. It is not an independent acceptance.

findings:
  - id: MWU-R1-FG-IR-001
    severity: blocking
    claim: rationale/assessment normalization is ASCII-only, so valid non-ASCII text is judged empty
    status: CLOSED
    root_cause: >-
      _normalized_phrase applied re.sub(r"[^a-z0-9]+", " ", value.lower()), which deletes
      every non-ASCII character before the floor is applied.
    correction: >-
      Normalization now uses re.sub(r"[\W_]+", " ", value.lower()), the exact complement of
      the old class for ASCII input, so ASCII results are unchanged while the letters and
      digits of every script survive. Content units are counted with a declared
      codepoint-range rule in which one character of a script written without a word
      separator is one unit, because a whitespace token count cannot measure such a script.
    language_understanding_introduced: false
    declared_in_contract:
      - rationale_machine_floor.text_normalization
      - rationale_machine_floor.content_token_rule.unspaced_script_ranges
    static_bindings_added:
      - contract_unicode_normalization_drift
      - contract_language_heuristic_prohibition_drift
      - contract_unspaced_script_ranges_drift
    executed_closure_cases:
      - pre-correction validator from 6eb8441c rejects multilingual_valid_execution_artifact_v1.yml with missing_or_empty:supportability_rationale; candidate accepts it, exit 0
      - pre-correction validator from 6eb8441c rejects multilingual_valid_review_artifact_v1.yml with missing_or_empty on both rationales and both assessments; candidate accepts it, exit 0
      - positive_chinese_supportability_rationale, positive_chinese_feasibility_rationale, positive_chinese_core_narrative_fields, positive_chinese_full_unit, positive_chinese_independent_review_assessments, positive_mixed_unicode_text all accepted
      - negative_generic_only_survives_unicode_normalization still rejected with vague_rationale_alone
      - negative_below_floor_unspaced_rationale and negative_below_floor_unspaced_assessment rejected with rationale_below_content_floor
      - ASCII differential probe, 207 samples, 0 behaviour differences, positive control observed
    not_proved:
      - that a non-English rationale is meaningful; the generic-only list stays English-only

  - id: MWU-R1-FG-IR-002
    severity: blocking
    claim: work_performed_or_requested and implementation_or_review_method accept non-text scalars
    status: CLOSED
    root_cause: >-
      validate_document applied the text floor only to the two rationale fields; the other
      two core fields used _present(), for which True, 1 and non-empty containers are present.
    correction: >-
      Both fields now pass through a type-and-emptiness floor that rejects any non-string
      value with core_field_must_be_text and any empty or whitespace-only string with
      missing_or_empty. The generic-only set and content-token count deliberately stay on
      the two rationale fields, matching the dispatch's split of the four core fields.
    declared_in_contract:
      - core_narrative_text_floor
    static_bindings_added:
      - contract_core_narrative_text_fields_drift
      - contract_core_narrative_required_type_drift
      - contract_core_narrative_reject_non_text_drift
    executed_closure_cases:
      - pre-correction validator from 6eb8441c accepts non_text_core_field_artifact_v1.yml, exit 0; candidate rejects it with core_field_must_be_text on both fields, exit 1
      - boolean, numeric, list and mapping negatives rejected for work_performed_or_requested
      - boolean, numeric, list and mapping negatives rejected for implementation_or_review_method
      - whitespace-only negatives rejected with missing_or_empty for both fields
      - negative_missing_core_work_performed_or_requested and negative_missing_core_implementation_or_review_method keep their original missing_or_empty error codes
    not_proved:
      - that a non-empty string states real work; only that it is text

