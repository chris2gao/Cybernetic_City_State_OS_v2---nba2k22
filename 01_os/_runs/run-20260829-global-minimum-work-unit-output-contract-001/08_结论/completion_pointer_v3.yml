    - >-
      The unspaced-script set is a finite declared codepoint list; a separator-less script
      outside it is still measured by whitespace tokens.
    - >-
      One character equals one content unit makes the three-unit floor easier to clear in
      those scripts than in space-delimited ones. This is a deliberate structural trade,
      and whether three units is the right floor for them is a reviewer question.
