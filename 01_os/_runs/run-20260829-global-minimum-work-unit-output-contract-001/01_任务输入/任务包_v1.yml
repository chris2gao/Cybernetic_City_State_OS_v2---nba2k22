protected_actions_not_authorized:
  - merge_to_master
  - force_push
  - rewrite_published_history
  - delete_master_or_repository
  - change_repository_visibility_or_credentials
  - activate_runtime_scheduler_or_coordinator
  - access_secrets_credentials_or_key_material
success_criteria:
  - decision_architecture_output_supports_four_core_fields_constraints_and_stop_conditions
  - execution_output_supports_four_core_fields_result_verification_and_unproved_limits
  - independent_review_output_supports_four_core_fields_verdict_primary_evidence_findings_and_executor_rationale_assessment
  - reviewer_must_assess_executor_supportability_and_feasibility_rationales_against_primary_evidence
  - legacy_artifacts_without_declared_MWU_remain_readable
  - ordinary_tasks_gain_no_new_Human_authorization_requirement
  - private_chain_of_thought_is_not_requested_or_required
  - bare_tests_passed_best_practice_or_feasible_are_not_sufficient_rationales
  - mechanism_boot_registry_and_validator_are_self_consistent
non_goals:
  - create_a_second_workflow
  - modify_communication_envelope_schema
  - modify_context_management_or_model_routing_ownership
  - create_new_authority_or_delegation_system
  - require_MWU_for_each_tool_call_micro_operation_or_private_reasoning_step
  - reopen_T2_or_S02
  - merge_to_master
review_method: >-
  Foreground architecture review and targeted machine validation on the task branch.
  Independent review is intentionally left for the Human's later cross-model check.
