task_id: os-v2-global-minimum-work-unit-output-contract-001
objective: >-
  Promote the observed T2 minimum-work-unit output experiment into one thin global
  mechanism that makes material decision/architecture dispatch, execution completion,
  and independent-review completion state what was done, how, why it is supportable,
  and why it is feasible; require reviewers to attack executor rationales against
  primary evidence without creating a permission gate or chain-of-thought requirement.
work_branch: dev/os-v2-global-minimum-work-unit-output-contract-001
big_task: false
exact_base_sha: 1559346ca2eab776cad110c7d96475f34a33f9b2
source_evidence:
  - a71db910e9f0e17963e73aa8e6bd5d05f5aa7574:01_os/_runs/run-20260828-t2-stage04-structural-provenance-upstream-001/04_机制试验/minimum_work_unit_output_contract_v1.yml
  - 01_os/_runs/run-20260828-t2-completion-001/07_测试执行/p2_2_execution_evidence_v1.yml
  - 01_os/_runs/run-20260828-global-human-authorization-simplification-001/03_方案设计/authorization_flow_design_v1.yml
allowed_changed_paths:
  - 01_os/README.md
  - 01_os/03_mechanisms/README.md
