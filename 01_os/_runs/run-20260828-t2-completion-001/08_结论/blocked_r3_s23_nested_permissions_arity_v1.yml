  - "P00 unsupported_or_ambiguous_representation: mechanism/roles_v1.yml: no authoritative structural binding resolves this position, so it fails closed as unknown (role_contract_v1:no_rule_for_container)"
  unbound_position: roles.*.permissions and its entries, under role_contract_v1
  why_it_is_unbound: >-
    role_contract_v1 binds [roles], [roles,"*"], [roles,"*",evidence_refs] and
    [role_label_effect]. S23 nests the grant one level deeper, under a `permissions`
    sub-container that no rule covers, so the position fails closed as unknown while
    P05 independently and correctly detects the grant.
  affected_tests:
  - test_v4_reviewer_replay.test_B_v4_returns_fourteen_predicates_for_every_case
  - test_v4_reviewer_replay.test_A_control_really_ran_seven_predicates

why_this_is_a_choice_and_not_a_derivation:
- This failure is not a wrong verdict. The engine judges S23 correctly and additionally
  reports a visible unknown at a genuinely unbound nested position, which is the
  accepted fail-closed invariant behaving as written.
- There are two coherent closures and they are not equivalent. Binding
  [roles,"*",permissions] declares what is claimable at a new nested position inside
  the role contract. Reclassifying the fixed-arity expectation instead accepts that a
  result vector may carry an accompanying P00, which changes what the suite asserts.
- R2 states fixture_or_test_change_required_by_ruling: false, so the second closure is
  outside what R2 authorised, and the first is a claimability decision the executor is
  forbidden to make alone.
- The precedent for the second option exists and is not the executor's to apply: ruling
  F04-A_REFINED already says that if a tested form is not in the contract, reclassify
  the test rather than the candidate. Whether that precedent governs a fixed-arity
  expectation is exactly the question being returned.
- As in both previous rounds, each option turns the suite green. That is the reason to
  return it rather than to pick one.

