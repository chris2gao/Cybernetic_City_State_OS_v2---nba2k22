executor_rationale_boundary: >-
  The executor chose nothing that decided what is claimable. At each of the four
  blocking signatures there was an option that would have turned the suite green
  immediately; in each case the executor stopped and returned the primary signature
  instead, and the foreground ruled. This candidate is therefore the product of applied
  adjudications, not of executor preference. That is the whole reason its green state
  is worth reviewing.

