  The final pass rests on two runs with byte-identical v4 output and observed exit code
  0 on both suites. Each of the four adjudications is cited by id and by the exact ref
  of the ruling document that issued it.

feasibility_rationale: >-
  The whole construction stayed inside one evaluator-owned binding file plus the
  transferred package, needed no parser, adapter, vocabulary, fixture or test change,
  no Stage01-03 rerun, no merge of the divergent upstream history, and no protected
  publication.

