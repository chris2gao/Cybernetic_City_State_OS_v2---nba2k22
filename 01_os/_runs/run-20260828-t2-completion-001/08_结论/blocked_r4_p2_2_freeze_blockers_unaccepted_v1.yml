retraction:
  retracted_at: '2026-08-28'
  retracted_by: claude-cowork-t2-completion-executor-001
  what_was_wrong: >-
    This finding claimed the freeze step was blocked because V4-FND-01 to -04 carry
    blocks_freeze true without independent acceptance. That was an error of reading, not
    of measurement: the flags and statuses reported below are all accurate.
  the_evidence_that_overturned_it:
  - >-
    freeze_receipt_v3.yml, the precedent artifact in this same tree, carries
    status: corrected_frozen_awaiting_fresh_independent_acceptance and
    next_gate.required: fresh_independent_acceptance_review. It was itself produced while
    its required independent acceptance was still outstanding, with the open items
    disclosed under known_limitations and handed to the reviewer to re-attack.
  - >-
    V4-FND-01's own sentence reads "fresh independent acceptance AFTER freeze remains
    mandatory". It states an ordering - freeze first, acceptance second - and this finding
    misread that ordering as a prohibition.
  corrected_understanding: >-
    blocks_freeze true means the finding must be disclosed in the freeze receipt and named
    for the reviewer to re-attack. It does not mean freeze may not be produced. Independent
    acceptance is the gate on Stage05 entry, not on freeze.
  consequence: P2-2 items 1 through 6 are all unblocked; execution proceeds.
  what_is_kept: >-
    The delegation-gate verification and the independence-waiver disclosure below stand
    unchanged. Only the freeze-blocked conclusion is withdrawn.
