work_performed_or_requested: >-
  Transfer the independently accepted structural-provenance capability from exact
  source 7cf9195715dcc7aa34bd09a8bc0f8320415f3930 onto the parent-based completion
  branch, then measure the parent Stage04 regressions before and after the transfer.

implementation_or_review_method: >-
  Measured the parent regression baseline first. Compared the two lineages by blob
  identity rather than by narrative, which showed the accepted capability is a
  5-file superset of the parent's own semantic_acceptance package and that the
  remaining 9 files are byte-identical. Wrote the 5 source blobs into the parent
  package with byte-exact copies and verified each written file with git hash-object
  against its source blob SHA. Re-ran both suites unchanged and compared to baseline.

supportability_rationale: >-
  Every number below comes from a run performed in this session in the task-scoped
  worktree, not from a dispatch document or an earlier report. The transfer claim
  rests on blob-SHA equality, which is stronger than a diff review. The regression
  claims rest on running the parent's own unmodified runners.

feasibility_rationale: >-
  The capability is location-independent: structural_binding.evaluator_binding_path()
  resolves the binding file as Path(__file__).resolve().parent / BINDING_FILE_NAME,
  so the package works identically under the parent's successor_v4 layout. The v4
  package layers on the v3 package by import, so the transferred binding reaches v4
  through the existing import graph with no v4 source edit.

