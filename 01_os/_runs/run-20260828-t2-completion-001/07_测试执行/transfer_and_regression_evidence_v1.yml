what_these_results_do_and_do_not_prove:
- The transfer is faithful: five blob SHAs match their sources exactly.
- The transferred capability does not regress the v3 baseline: 65/65 before and after.
- The 14 v4 failures are a single root cause, not fourteen defects.
- The failures are the fail-closed invariant working, not a crash: every one is a
  visible `unknown` at an unbound position, which is the behaviour correction-003
  required.
- Nothing here proves the correction-003 replacement is complete. It is not.
- These are executor measurements. They are not independent acceptance.

residual_risk_or_unproved_limits:
- Process exit codes were not observed for either run. The baseline invocation lost them
  to a pipeline; the candidate invocation assigned them to variables, but the shell call
  was cut off by a tool read timeout before those variables were printed, so they were
  never read. Both comparisons therefore rest on the runners' own printed N/M summaries.
  Recorded as not_observed rather than reported as captured.
- Only the two parent suites were run. No claim is made about any other Stage04 gate.
- The v4 corpus was exercised only through the parent's own fixtures; no new fixture
  was authored, so no statement is made about corpora outside that set.
