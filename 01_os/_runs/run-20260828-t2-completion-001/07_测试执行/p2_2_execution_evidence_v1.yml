  v4_tests: {before_this_round: 29/29, after_this_round: 57/57, exit_code: 0}

what_this_does_and_does_not_prove:
- The six P2-2 items exist, run, and pass with their exit codes observed.
- The provenance hole was real and is closed, and cannot silently reopen.
- The freeze receipt binds this exact candidate and survives its own validator.
- It does NOT prove the new tests are adequate. Each proves its own asserted
  proposition; whether those propositions are the right ones is a review judgement.
- It does NOT prove the four blocks_freeze findings are resolved. They are disclosed.
- It is NOT independent acceptance and does not claim parent Stage04 PASS.

residual_risk_or_unproved_limits:
- external_closure_complete is false on the receipt: the receipt's own bytes cannot be
  observed in Git before the commit containing them. A post-publication verification is
  recorded separately rather than asserted here.
- Windows only; no Linux measurement this round.
- The executor applied three foreground adjudications it did not independently re-derive.
- The independence waiver disclosed in BLK-004 still stands and is repeated in the
  refreeze report and result pointer.
