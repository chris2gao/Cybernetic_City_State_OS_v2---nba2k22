worktree_pollution_found_by_the_topology_check:
  what: >-
    The first freeze attempt failed naming 34 .pyc files across four __pycache__
    directories as unhashed members of the candidate tree.
  why_git_did_not_see_it: they are ignored, so git status --porcelain -uall read clean throughout
  lesson: git-clean and tree-clean are different properties, and only the topology check tests the second
  action: removed; none was tracked; receipt regenerated and validates

suites:
