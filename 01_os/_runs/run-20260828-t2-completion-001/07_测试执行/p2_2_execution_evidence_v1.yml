  binding and tamper tests, the requirement trace, the test inventory, and the freeze
  receipt, refreeze report and result pointer.

implementation_or_review_method: >-
  Each item was built against the package's own machinery rather than reimplemented, and
  each carries a guard against passing vacuously: the applicability negatives include a
  gate-removal control, the tamper battery includes an honest control that must validate
  and a distinctness check so one blanket rejection cannot masquerade as thirteen, and
  the three derived artifacts are generated by the same function that asserts them
  current, so document and code cannot drift apart.

supportability_rationale: >-
  Every count came from a run in this session with its exit code observed. The freeze
  receipt was validated by the package's own validator with the SHAs supplied from
  outside it. The provenance hole was found by measurement, not by reading.

feasibility_rationale: >-
  All six items sat inside existing machinery and the task allowlist; none required a
  parser, adapter or vocabulary change, a Stage01-03 rerun, or any protected action.

corrected_earlier_error:
  finding: T2-COMPLETION-BLK-004
  what_it_claimed: freeze was blocked by four blocks_freeze findings
  why_it_was_wrong: >-
    freeze_receipt_v3 in this same tree was itself produced while its required
    independent acceptance was outstanding, with open items disclosed and handed to the
    reviewer; and V4-FND-01's sentence says acceptance is mandatory AFTER freeze. The
    finding read an ordering as a prohibition. Retracted in place, and its
    gate-verification and waiver-disclosure sections were kept.

items:
  item_1_adapter_applicability:
    module: 03_validation/v4_tests/test_v4_adapter_applicability.py
    tests: 8
    proposition: >-
      all 14 v4 adapters stay inert - no facts AND no evidence - on a document failing
      any limb of _applicable, and the inertness is attributable to the gate.
    anti_vacuity_control: >-
      _applicable is replaced with a constant True and the same document must then
      produce output; without that the negatives would pass against an adapter set with
      no applicability rule at all.
  item_2_decision_provenance:
    module: 03_validation/v4_tests/test_v4_decision_provenance.py
    tests: 7
    finding: >-
      the committed decision_provenance_v4.yml carried 76 rules, which is the accepted
      package alone. The v4 half's 52 rules, deciding P21 to P27, were absent. Every one
      of them declares an authority and none was untraced, so nothing failed and only a
      combined audit could see it. The ledger was regenerated to 128 rules.
    now_guarded_by: test_the_committed_ledger_is_current
  item_3_receipt_binding:
    module: 03_validation/v4_tests/test_v4_receipt_binding.py
    tests: 7
    attacks: 16
    result: all 16 rejected, with at least 6 distinct failure signatures
    honest_control: an untampered receipt over the package's real artifacts validates
    note: >-
      the control caught a defect in the test itself on first run - the external diff
      omitted the receipt's own path, so the honest receipt was being rejected 6 vs 5.
      Recorded because a battery whose baseline is invalid proves nothing.
  items_4_and_5_trace_and_inventory:
