objective: >-
  Produce a Human-decidable root-cause architecture that preserves the mandatory Human
  stage-alignment objective while closing exactly three blockers from the frozen predecessor:
  CR-002 self-assertable Human provenance, the CR-005 residual where seven-stage loop
  children are not validated as complete stage receipts, and RR2-001 stale completion
  evidence binding. Do not implement canonical mechanism changes in this phase.
architecture_constraints:
  - predecessor_task_is_frozen_no_third_correction_round
  - start_from_current_master_not_from_predecessor_branch
  - accepted_predecessor_semantics_are_source_evidence_not_branch_authority
  - Human_provenance_must_not_be_satisfiable_by_ordinary_model_repo_write_access_alone
  - trusted_Human_boundary_must_be_explicit_machine_verifiable_and_fail_closed
  - seven_stage_loop_children_must_be_full_valid_stage_receipts_not_alignment_subsets
  - successor_completion_evidence_must_bind_exact_semantic_candidate_and_exact_test_and_path_ledger
  - preserve_no_microapproval_for_ordinary_local_reversible_choices
  - preserve_full_and_incremental_escalation_for_load_bearing_or_material_divergence
  - no_runtime_or_scheduler_activation
  - no_master_publication
blocking_scope:
  CR-002:
    statement: Human provenance is self-assertable by a model with repository write access.
    required_outcome: define a trusted provenance boundary and verification contract that a normal repo-writing model cannot self-satisfy.
  CR-005-residual:
    statement: seven-stage operational-loop children are checked only as alignment subsets, not as complete stage receipts.
    required_outcome: define the validator composition and negative-control contract for complete child receipt validation.
  RR2-001:
    statement: required completion pointer remained bound to a superseded semantic candidate and stale evidence counts.
    required_outcome: define immutable successor completion-evidence/version-binding rules for corrected candidates.
