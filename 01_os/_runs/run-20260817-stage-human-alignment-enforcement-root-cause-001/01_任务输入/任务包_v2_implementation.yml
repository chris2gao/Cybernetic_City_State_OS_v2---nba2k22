objective: >-
  Modify the existing stage_collaborative_deliberation mechanism itself so its stage modeling,
  inquiry, deliberation, result projection and progression contract require foreground and Human
  to jointly establish an adequate current stage model before substantive work. The model must
  determine foreground understanding of Human intent, stage objective, proposed implementation,
  feasibility support, relevant models/tools/data/environment, outputs, verification, risks,
  alternatives, Human decision boundary, model-owned local choices and downstream impact. A stage
  brief is the Human-visible projection of this same model; Human feedback updates the same model.
  Explicit Human disposition on the exact model/version is required before downstream execution,
  review or next-stage progression. Close CR-005 residual and RR2-001 as supporting defects.
