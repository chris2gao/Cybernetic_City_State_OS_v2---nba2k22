# ---------------------------------------------------------------------------
# Findings: where the dispatch, the packet or the repository disagreed with
# what was measured. Reality was followed and the conflict is reported.
# ---------------------------------------------------------------------------
findings:
  - id: packet_field_name_breaks_the_repository_ledger_tool
    severity: medium
    measured: >-
      01_os/06_execution/task_discipline/path_ledger/changed_path_ledger.py reads a
      top-level key named allowed_changed_paths, which is also the field name
      section 7 of the 01_os entry requires. This run's packet carries the list
      under scope.allowed_write_paths, so the tool exits 3 on the packet itself.
    action_taken: >-
      The packet was not edited. The list was copied verbatim into
      07_测试执行/allowlist_v1.yml under the name the tool reads, and the ledger ran
      against that. Nothing was added or widened.
    result: paths=10 allowlist=ok, exit 0

  - id: os_entry_section_12_outlives_its_target
    severity: medium
    measured: >-
      Section 12 of 01_os/开发入口与单窗口任务规范_v1.md still lists
      .ai/TOKEN_USAGE_PROFILE.md as the authority for token and risk tiers. After
      this rewrite it is the only live pointer to that file, while the tiers are
      already defined in section 7 of the same document and the discipline is now in
      AGENT_WORKING_DISCIPLINE.md.
    action_taken: Not fixed - 01_os/** is prohibited this task. Returned as a finding.

  - id: content_readme_describes_the_old_bootstrap_as_current
    severity: low
    measured: >-
      01_os/07_content/README.md line 21 describes 06_Silicon_Index/ as the shared
      directory holding the bootstrap every instance starts from. False after step 1.
    action_taken: Not fixed - inside 01_os/** and domain-owned. Returned as a finding.

  - id: manifest_named_four_absent_paths
    severity: medium
    measured: >-
      core_owned_paths listed 07_Execution_Plans/, 0号方案.md, 1号方案.md and
      2号方案.md; git ls-files at the base returns no entry at or under any of them.
    action_taken: >-
      Removed, with the removal and its evidence recorded as a comment in the file.
      This records a false line being deleted, not a file being deleted.

  - id: root_readme_and_project_context_are_shipped_by_core_while_declared_domain_owned
    severity: medium
    measured: Both are tracked in core; domain_owned_paths says core ships nothing there.
    action_taken: >-
      Ownership lists left unchanged - that is a Human decision. Only the prose was
      corrected to state the measured exception. Raised as ownership_of_root_readme.

  - id: publisher_authority_is_the_only_dot_ai_file_load_bearing_for_publication
    severity: high
    corrected_in_round_1: >-
      Round 1 titled this "the single blocking dependency on .ai", which is wider
      than the evidence and wider than the same report's own list: three other items
      also block deleting .ai/. Narrowed to the proposition actually established.
    measured: >-
      Of 290 tracked files under .ai/, exactly one is directly load-bearing for
      repository publication authority: .ai/REPOSITORY_PUBLISHER_AUTHORITY.yml. The
      01_os entry section 1.1 and 01_os/05_registry/repository_guards_v1.yml both
      resolve "who may publish" to it, as do four retained root files and the guard
      README. This says nothing about other kinds of dependency on .ai/.
    action_taken: >-
      Classified migrate_then_delete_source. Its migration is a declared non-goal of
      this task.
    what_blocks_deleting_dot_ai_in_total: >-
      Four items, not one: this file, .ai/TOKEN_USAGE_PROFILE.md (one surviving
      01_os pointer), .ai/PROGRAM_RUNS/ (declared run root, machine-enforced) and
      .ai/HANDOFF_COMMON_CONVENTIONS.md (provisional keep pending a Human decision).

  - id: handoff_conventions_is_invisible_to_the_reference_graph
    severity: medium
    measured: >-
      .ai/HANDOFF_COMMON_CONVENTIONS.md is referenced by no tracked file, so every
      reference-graph pass classifies it as unused. Its section 4.1, lines 61-88,
      does define brief-vault routing - the vault root, the per-repository suffix
      rule and the 03_决策档案 target.
    corrected_in_round_1: >-
      Round 1 promoted it to migrate_then_delete_source on the strength of an
      external Human standing instruction quoted from the executing session's own
      context. That is not evidence a reviewer can re-derive: no durable reference
      for it exists in the packet, the repository, or any immutable ref. The claim is
      withdrawn as a proven dependency and the edge is recorded under withdrawn_edges.
    action_taken: >-
      Moved to Human_decision_required as a provisional keep-until-Human-decides
      item. Still recorded prominently, because a purely mechanical closure deletes
      it and the asymmetry is unequal: deleting it loses the cited source of the
      brief-vault rule, keeping it costs one stale file for one more round.

  - id: dot_ai_program_runs_is_an_empty_but_load_bearing_path
    severity: medium
    measured: >-
      .ai/PROGRAM_RUNS/ holds zero tracked files in core, yet 20 files and 45
      occurrences name it - the context validator alone 10 times - and
      verify_context_structure.py fails with CM023 if CORE_MANIFEST drops it. An
      inventory driven by file counts would have treated it as absent.
    corrected_in_round_1: >-
      Round 1 classified it retain_non_08. Under the task's own definitions that is
      wrong: retain means "must remain after the old OS is physically deleted", and
      this path sits on the legacy surface and is meant to move. Reclassified
      migrate_then_delete_source with its full relocation closure, .gitignore
      included.
    action_taken: See migrate_then_delete_source in the inventory.

