      result: >-
        38 hits, each explained: 7 are the deliberate publisher-authority reference;
        29 are CORE_MANIFEST retirement-inventory entries and its PROGRAM_RUNS and
        mailbox ownership lines; 1 is the AGENTS.md sentence declaring
        PROJECT_CONTEXT.md and ARCHITECTURE.md historical; 1 is the README sentence
        naming the legacy categories as inactive.
      exit: 0
    - check: R3 frozen .githooks executables byte-identical to base
      result: "git diff --name-only base -- pre-push install.ps1 test_pre_push_logic.ps1 .gitattributes returned 0 paths"
      exit: 0
    - check: R4 CORE_MANIFEST parses, keeps both machine keys, no ownership overlap, every core-owned path exists
      result: "0 problems"
      exit: 0
    - check: bucket assignment completeness, correction round 1
      command: python 07_测试执行/classify_counts.py
      result: >-
        505 non-08 files; retain 15, migrate 3, delete 453, Human 34, unassigned 0;
        sum equals file count; declaration-only .ai/PROGRAM_RUNS/ confirmed at 0
        tracked files, which the script now asserts rather than assumes
      exit: 0
    - check: reviewer factual claims re-measured before acting
      result: >-
        .gitignore PROGRAM_RUNS rule present (line 19); new-domain.ps1 legacy paths
        present (line 99); hook test is nine cases (line 1 header, nine Case calls,
        line 64). The predicted bucket movement was not reproduced and is answered in
        correction_rounds.
      exit: 0
    - check: git diff --cached --check
      result: no whitespace errors
      exit: 0
  independently_reproduced: false
  independence_disclosure: >-
    Every result above was produced by the executing session. R1 initially failed on
    nine references and R2 on one; the R1 failures were vendor conventions the file
    documents as absent and a sibling-relative reference, so the checker's model of a
    resolvable reference was corrected and re-run, while the R2 hit was a real
    surviving .ai/PROTOCOL.md dependency in AGENT_WORKING_DISCIPLINE.md and was fixed
    in the file. That distinction - one checker corrected, one file corrected - is
    exactly the kind of call an author should not be the only party to make. The
    reviewer should re-run all four checks and re-derive the classifications from
    raw_edges_v1.yml rather than accepting this report's reading of them.
  not_run:
    - 01_os/06_execution/task_discipline own unit tests (unchanged by this task)
    - any check requiring a second clone or a second transport

acceptance_criteria_from_review:
  - criterion: corrected bucket definitions and totals are internally consistent
    met: >-
      Yes. Files and entries are now counted in separate tables with the unit named
      on each, and classify_counts.py fails if any non-08 path is unassigned or if a
      declaration-only entry turns out to hold tracked files.
  - criterion: every retain item that still requires a future rewrite is explicitly marked
    met: >-
      Yes. new-domain.ps1 and .gitignore carry rewrite_required_before_final_cutover
      with the exact line that forces it. The other seven retained root files and the
      six retained linked files carry no such marker, checked line by line this round.
  - criterion: every migrate-before-delete item names its migration closure
    met: >-
      Yes. Publisher authority names its consumers; TOKEN_USAGE_PROFILE names the one
      surviving pointer; 系统机制总结.md names the seven evidence records;
      .ai/PROGRAM_RUNS/ names all 20 files and 45 occurrences, split into
      machine-enforced, documentation, and superseded drafts that need no rewrite.
  - criterion: external-only dependencies are distinguished from repository-proven ones
    met: >-
      Yes, and one was demoted for it. The withdrawn_edges section exists so a claim
      that was made and dropped stays visible.
  - criterion: final summary is safe to use as the Human's pre-deletion whitelist
    met: >-
      With one stated limit. The whitelist is safe for what it lists; it does not
      authorise deletion, and four items must be resolved before .ai/ can go at all.

