  findings; uncovered actions, malformed action items, and contradictory preconfirmed
  master state all fail closed with explicit findings.
feasibility_rationale: >-
  The repair is confined to the existing preflight derivation/validation layer and its
  tests. It reuses the existing eight-field closure contract and does not add a new
  authority mechanism, workflow, runtime, scheduler, or publication path. Historical
  T3 packets remain readable under the candidate.

