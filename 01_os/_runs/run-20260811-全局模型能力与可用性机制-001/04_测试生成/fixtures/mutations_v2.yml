schema_version: citystate.stage04.mutation_set.v2
task_id: os-v2-global-model-capability-and-availability-routing-001
run_id: run-20260811-全局模型能力与可用性机制-001
supersedes:
  path: fixtures/mutations_v1.yml
  disposition: >-
    retained_for_history。v1 原样保留，它记录的是 artifact_version 2 的杀伤集合。
    删掉它会抹去 Stage 07 证明存在的那两处设计缺陷（MR-T10 只测非空、MR-T25 词法误伤）
    曾经存在的痕迹。
purpose: >-
  每条 mutation 把 good_tree 改成一棵"看起来完整但违反某一条已接受证据"的树，
  用来证明对应验收检查确实能杀死它。检查杀不掉自己的 mutation，等于该检查不可失败，
  按 01_os/01_workflow/04_测试生成/实现/测试schema_v1.md 属于不合格测试。
  collateral（顺带变红的其他检查）被记录但不算失败，因为一处违规常常同时破坏多个契约面。

correction_round_note: >-
  M28–M36 是本轮新增，对应 Stage 07 确认的 F1/F2/F3。M15 与 M23 的锚点随 fixture
  修正而更新，语义不变。M01–M27 的其余部分逐字保持 v1。

good_tree_assembly:
  committed: fixtures/good_tree/**
  materialized_at_runtime:
    - path: 01_os/05_registry/repository_publisher_authority_v1.yml
      source: 从被测仓库根目录原样复制
      reason: >-
        MR-T20 断言该文件字节不变。把 canonical 内容复制进 run 目录会产生第二份权威副本，
        因此 fixture 不提交它，改为在 selftest 组装临时树时复制。

