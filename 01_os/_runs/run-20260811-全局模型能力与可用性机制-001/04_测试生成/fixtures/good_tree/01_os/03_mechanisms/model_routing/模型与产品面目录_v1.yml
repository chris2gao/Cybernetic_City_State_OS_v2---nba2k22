schema_version: citystate.model_routing.catalog.v1
mechanism_version: 1
catalog_version: 1
status: fixture_not_canonical
entitlement_is_account_availability: false
identity_key: [surface_id, model_label]

# Source-resolution entry point.
#
# Reachable from the mechanism's declared load surface (this file is named in the
# boot manifest load_order), so every token used in source_refs and
# surface_exposure_evidence can be resolved without reading 01_os/_runs/**, which
# 开发入口 §1.7 forbids preloading.
#
# GOOGLE_AG_PRICING is present on purpose: it is a real first-party source whose
# identifier contains "PRICING". A citation is not a cost-routing field, and
# MR-T25 must not fire on it.
sources:
  OAI_CHATGPT_56:
    kind: provider_first_party
    title: GPT-5.6 in ChatGPT
    url: https://help.openai.com/en/articles/20001354-gpt-5-6-in-chatgpt
    verified_at: '2026-08-11'
  OAI_CODEX_APP:
    kind: provider_first_party
    title: Introducing the Codex app
    url: https://openai.com/index/introducing-the-codex-app/
    verified_at: '2026-08-11'
  ANTH_PRO_CODE:
    kind: provider_first_party
    title: Use Claude Code with your Pro or Max plan
    url: https://support.claude.com/en/articles/11145838-use-claude-code-with-your-pro-or-max-plan
    verified_at: '2026-08-11'
  ANTH_CODE_MODELS:
