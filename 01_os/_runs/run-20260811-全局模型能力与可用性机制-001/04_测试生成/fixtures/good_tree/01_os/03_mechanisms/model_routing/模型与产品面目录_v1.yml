  GEMINI_PASS:
    kind: independent_web_research
    title: independent research pass held as durable task evidence
    ref: 02_信息收集与提炼/证据对齐与冲突消解_v1.yml#source_registry.GEMINI_PASS
    verified_at: '2026-08-11'
  C04_ChatGPT_Plus_current_control:
