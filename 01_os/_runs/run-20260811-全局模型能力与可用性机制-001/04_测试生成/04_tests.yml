credential_selection_record:
  adjudicator: Stage 04 independent test designer (Claude Opus 5, Cowork surface)
  date: '2026-08-11'
  evidence_basis:
    - 02_信息收集与提炼/证据对齐与冲突消解_v1.yml
    - 02_信息收集与提炼/Stage02_证据结论_v2.yml
    - 01_需求建模/requirement/A_需求建模_v3.yml
  selected_properties:
    - 机制边界与自描述（独立机制、registry/boot/loader pointer、失效显现）
    - 路由输入输出契约与 authority 常量
    - 可用性来源（Human override，而非自动探测）
    - 目录新鲜度与来源（source/verified_at/invalidation/confidence）
    - model 与 product surface 的身份分离，以及参数的 surface 归属
    - vendor 事实与 project 观察的分栏及证据等级
    - 入口 §7.1 变薄的同时 §8/§9/T3/publisher authority 不被削弱
    - 决策原语中不出现 cost/token/quota、自动 fallback 链与后台探测
  why_these: >-
    这八组属性是 Stage 02 已接受 claim 中"可被结构化观察"的那部分。A 的成功判据里凡是
    描述运行期行为却无法在静态树上判定的（例如"每次路由输出…"），一律降级为对契约声明的
    检查，而不是伪造一个运行时断言。criterion 9（至少一轮盲式独立 research）是 Stage 02
    的过程事实、已由 Human 关闭，本阶段不为它编造实现测试。
  measurement_choice: >-
    静态结构与契约检查，全部由 实现/verify_stage04_acceptance.py 以确定性方式判定；
    唯一的动态检查是 MR-T24，它实际运行机制自带 validator 并要求非零退出码。
  tolerance: >-
    零容差：28 条检查全部为二值判定，不设阈值、不设采样。规范化摘要采用与
    01_os/06_execution/workflow/minimum_operational_loop/run_minimum_operational_loop.py
    完全相同的 yaml.safe_dump(sort_keys=True, width=4096) + SHA-256。

method_qualification:
  testability: 每条检查都能在任意树上运行并返回二值结果；good fixture 全绿、27 条 mutation 全部被杀。
  peer_review: 待 Stage 04 之后的独立审核窗口执行；本包由非 B 作者、非实现方生成。
  known_error_rate: >-
    以 mutation kill rate 量化：27/27（100%）。这是本套检查对已声明违规形态的杀伤率，
    不等于对未预期违规形态的覆盖率。
  operating_standard: 实现/verify_stage04_acceptance.py 的三个子命令（package / acceptance / selftest）。
  general_acceptance: 沿用本仓既有 validator 形态（communication_system、context_management、minimum_operational_loop）。

pre_implementation_check:
  constraints_satisfiable: 是
  boundary_overreach:
    - claim: B02 列出 target_paths（含具体文件名）
      disposition: >-
        按派单"不要过拟合文件名"，本包只冻结机制目录、三条 repository-convention pointer 路径
        （boot 清单、registry、execution loader 目录）与三个 schema_version token；
        机制目录内部的文件名不构成成功条件。
    - claim: B13 声明失效显现，但 B.requirement_satisfaction 未把 B13 映射到任何 A 成功判据
      disposition: >-
        记为 finding，不作为 blocker。本包把 B13 相关检查（MR-T03/T21/T22/T23/T24/T28）
        绑到 A 成功判据 1（机制作为独立全局机制存在）——一个无法显现失效的机制不满足"存在且可验证"。
    - claim: A 成功判据 9（盲式独立 research）无对应实现测试
      disposition: >-
        不编造。该判据是 Stage 02 过程事实，已由 Stage02_证据结论_v2 记录为 complete，
        并由 Human 在 人类确认_v3 关闭 Antigravity qualification。本包显式声明未覆盖。

