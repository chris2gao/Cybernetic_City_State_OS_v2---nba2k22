      pass_condition: 六锚点齐全。
      can_fail: true
      fails_when: 迁出模型内容时顺手削掉了证据、审核或受保护动作条款。
      baseline_2026_08_11: pass

    - test_id: MR-T20
      kind: positive
      title: publisher authority registry is byte-identical to the Stage 04 baseline
      subject_result_claim_ids: [B12_preserve_nonrouting_controls]
      evidence_claim_ids: [C12_architecture_boundary]
      success_criterion_index: 11
      measurement: 01_os/05_registry/repository_publisher_authority_v1.yml 的 SHA-256 等于冻结基线值。
      pass_condition: 字节一致。
      can_fail: true
      fails_when: Stage 06 顺手改了发布权限——本任务未授权的动作。
      baseline_2026_08_11: pass

    - test_id: MR-T21
      kind: positive
      title: boot, registry and execution-loader pointers all resolve
      subject_result_claim_ids: [B13_failure_surfacing, B02_minimal_canonical_composition]
      evidence_claim_ids: [C12_architecture_boundary]
      success_criterion_index: 1
      measurement: boot 清单 load_order/validator/registry 每条路径存在；loader 目录存在；registry 每条 path（展开 {} 与 **）存在。
