payload:
  frozen: true
  freeze_authorization_ref: 04_测试生成/独立测试生成派单_v2.md@dev/os-v2-global-model-capability-and-availability-routing-002
  test_package_sha256: 72898d54c86ca52449aa96f1dfaed0d6ca8153b93dbc9ae36089a9e8edb55478
  tests:
    - test_id: MR-T01
      kind: positive
      title: model routing exists as an independent 03_mechanisms capability
      subject_result_claim_ids: [B01_module_boundary, B02_minimal_canonical_composition]
      evidence_claim_ids: [C12_architecture_boundary, C01_surface_is_first_class]
      success_criterion_index: 1
      measurement: >-
        verify_stage04_acceptance.py acceptance <tree>：机制目录存在，含 README，并且能按
        schema_version token 发现 contract / catalog / project observation ledger 三份文件。
      pass_condition: 三份文件全部可发现且 README 存在。
      can_fail: true
      fails_when: 机制被写进 workflow 或入口而非独立 03_mechanisms 目录，或缺任一份契约文档。
      baseline_2026_08_11: fail

    - test_id: MR-T02
      kind: negative
      title: workflow does not duplicate the model catalog
      subject_result_claim_ids: [B01_module_boundary]
      evidence_claim_ids: [C12_architecture_boundary]
      success_criterion_index: 1
      measurement: >-
        扫描 01_os/01_workflow/**：不得出现 model_routing 的 schema token，
        单个文件不得复现 3 个及以上 catalog 中的 model_label。
      pass_condition: 无越权文件。
      can_fail: true
      fails_when: 任一 workflow 文件把模型目录抄了一份。
      baseline_2026_08_11: pass_vacuously

    - test_id: MR-T03
      kind: positive
      title: mechanism declares purpose, loader, disk dependency and failure surfacing
      subject_result_claim_ids: [B13_failure_surfacing, B02_minimal_canonical_composition]
      evidence_claim_ids: [C12_architecture_boundary]
      success_criterion_index: 1
      measurement: >-
        registry 每条 entry 的 path/purpose/loader/loader_class/discovery/evidence/
        cache_dirs/failure_surfacing/deletion_rule 全部非空。
      pass_condition: 无缺字段的 entry，且机制 README 存在。
      can_fail: true
      fails_when: 机制注册但不声明失效如何显现——03_mechanisms/README.md 点名的那类静默失败。
      baseline_2026_08_11: fail

    - test_id: MR-T04
      kind: positive
      title: routing input contract carries task/role/risk/shape/capabilities and availability
      subject_result_claim_ids: [B03_routing_input_contract]
      evidence_claim_ids: [C02_Human_availability_override, C12_architecture_boundary]
      success_criterion_index: 2
      measurement: contract.inputs.required 覆盖五个必填键，且存在 Human availability 输入或 availability_default。
      pass_condition: 五键齐全且可用性输入存在。
      can_fail: true
      fails_when: 实现只按模型名路由，不消费 role/risk/task_shape。
      baseline_2026_08_11: fail

    - test_id: MR-T05
      kind: positive
      title: routing output contract carries model, surface, parameters, basis, evidence and limits
      subject_result_claim_ids: [B04_routing_output_contract]
      evidence_claim_ids: [C01_surface_is_first_class, C09_surface_parameter_profile_required]
      success_criterion_index: 2
      measurement: contract.outputs.required 覆盖九个必填输出键。
      pass_condition: 九键齐全。
      can_fail: true
      fails_when: 输出只给模型名，不给 surface、参数、依据、证据或限制。
      baseline_2026_08_11: fail

    - test_id: MR-T06
      kind: positive
      title: route output authority is the constant routing_only
      subject_result_claim_ids: [B04_routing_output_contract]
      evidence_claim_ids: [C12_architecture_boundary, C02_Human_availability_override]
      success_criterion_index: 2
      measurement: >-
        outputs.authority_constant 等于 routing_only，且契约中不出现任何形如
        `*_authorized` 且取值为真的授权字段。
      pass_condition: 常量正确且无授权授予。
      can_fail: true
      fails_when: 路由结果被写成一种权限来源，绕过 Human gate。
      baseline_2026_08_11: fail

    - test_id: MR-T07
      kind: positive
      title: registered candidates default available; only Human override excludes or restores
      subject_result_claim_ids: [B05_availability_rule]
      evidence_claim_ids: [C02_Human_availability_override, entitlement_vs_account_availability]
      success_criterion_index: 3
      measurement: >-
        availability_rule.registered_default == available；unavailable_only_by 与 restored_by
        均为 explicit_Human_override；automatic_quota_probe 为 false；决策第一步是应用 Human override。
      pass_condition: 四项全部成立。
      can_fail: true
      fails_when: 实现从 entitlement 表或余额推断可用性，或缺少"恢复"路径。
      baseline_2026_08_11: fail

    - test_id: MR-T08
      kind: negative
      title: no cost, token or quota scoring in the routing decision procedure
      subject_result_claim_ids: [B06_selection_procedure]
      evidence_claim_ids: [C03_routing_optimizes_fit_not_cost, R05, cost_efficiency_vs_quality_fit]
      success_criterion_index: 10
      measurement: >-
        decision_steps 无 cost/token/quota 步骤；契约声明 prohibited_routing_inputs 且至少含
        token_cost、price、quota_balance；除该禁止清单外契约任何键或值不得出现这些 token。
      pass_condition: 无泄漏。
      can_fail: true
      fails_when: 有人把"更省"重新写进选择步骤——R05 明确被需求否决的那条。
      baseline_2026_08_11: fail

    - test_id: MR-T09
      kind: positive
      title: model and product surface stay separate; identity is (surface, model)
      subject_result_claim_ids: [B08_catalog_evidence_and_freshness, B10_initial_current_surface_set]
      evidence_claim_ids: [C01_surface_is_first_class]
      success_criterion_index: 5
      measurement: 每条 entry 具备 provider/surface_id/model_label，且 (surface_id, model_label) 不重复。
      pass_condition: 无缺字段、无重复身份。
      can_fail: true
      fails_when: 目录退化成一张模型名清单，同一模型在不同 surface 上的差异被抹掉。
      baseline_2026_08_11: fail

    - test_id: MR-T10
      kind: positive
      title: current product facts carry source, verified_at, invalidation and confidence
      subject_result_claim_ids: [B08_catalog_evidence_and_freshness]
      evidence_claim_ids: [C04_ChatGPT_Plus_current_control, C05_Codex_Plus_current_candidates, C06_Claude_Code_Pro_is_active_surface, C07_Antigravity_model_labels_verified, C08_Antigravity_Pro_access]
      success_criterion_index: 4
      measurement: 每条 registered entry 的 source_refs/verified_at/invalidation_conditions/confidence 非空，verified_at 为 ISO 日期。
      pass_condition: 全部齐备。
      can_fail: true
      fails_when: 高时变产品事实以无来源、无时间的断言形式长期留存。
      baseline_2026_08_11: fail

    - test_id: MR-T11
      kind: positive
      title: parameter profiles are surface-scoped and evidence-bound
      subject_result_claim_ids: [B07_surface_specific_parameters]
      evidence_claim_ids: [C09_surface_parameter_profile_required, API_parameter_vs_surface_parameter]
      success_criterion_index: 5
      measurement: 每条 registered entry 至少一个 parameter profile，且每个 profile 带 profile_id 与 surface_exposure_evidence。
      pass_condition: 全部满足。
      can_fail: true
      fails_when: 参数被写在模型层而不是 surface 层，或无证据支撑。
      baseline_2026_08_11: fail

    - test_id: MR-T12
      kind: negative
      title: API-only reasoning enums cannot masquerade as Web/Desktop parameters
      subject_result_claim_ids: [B07_surface_specific_parameters]
      evidence_claim_ids: [C09_surface_parameter_profile_required, C04_ChatGPT_Plus_current_control, R01, API_parameter_vs_surface_parameter]
      success_criterion_index: 6
      measurement: >-
        source_class == api_documentation 的 profile 必须带 surface_exposure_evidence；
        chatgpt_web 的 reasoning_levels 不得含 extra_high/xhigh/pro/max；
        chatgpt_web 不得注册 Terra/Luna。
      pass_condition: 三项均无违例。
      can_fail: true
      fails_when: 把 API 的 reasoning 枚举直接抄成 Web 档位——R01 被拒绝的正是这种推断。
      baseline_2026_08_11: fail

    - test_id: MR-T13
      kind: negative
      title: project observation ledger is separate from the vendor catalog
      subject_result_claim_ids: [B09_project_evidence_separation]
      evidence_claim_ids: [vendor_benchmark_vs_project_history, C10_project_qualification_required]
      success_criterion_index: 8
      measurement: ledger 存在且有 observations；catalog entry 内不得出现 observations/validity/observed_failure_or_strength 等项目观察字段。
      pass_condition: 两栏不混。
      can_fail: true
      fails_when: 项目印象被写进 vendor 目录，此后无法区分谁说的。
      baseline_2026_08_11: fail

    - test_id: MR-T14
      kind: boundary
      title: diagnostic or anecdotal evidence cannot create a hard qualification boundary
      subject_result_claim_ids: [B09_project_evidence_separation]
      evidence_claim_ids: [C10_project_qualification_required, C11_qualification_shape, vendor_benchmark_vs_project_history]
      success_criterion_index: 8
      measurement: >-
        每条 observation 的 validity ∈ {formal, diagnostic, anecdotal} 且 confidence 非空；
        非 formal 的 observation 不得设置 qualified/disqualified/max_task_tier/task_ceiling/hard_gate；
        任何 antigravity observation 不得声称 formal。
      pass_condition: 无越级。
      can_fail: true
      fails_when: 已被 Stage 02 判为 invalid_for_formal_qualification 的三次试验被提升成任务上限。
      baseline_2026_08_11: fail

    - test_id: MR-T15
      kind: positive
      title: catalog expresses the five in-scope product surfaces
      subject_result_claim_ids: [B10_initial_current_surface_set]
      evidence_claim_ids: [C04_ChatGPT_Plus_current_control, C05_Codex_Plus_current_candidates, C06_Claude_Code_Pro_is_active_surface, C07_Antigravity_model_labels_verified, C08_Antigravity_Pro_access]
      success_criterion_index: 6
      measurement: catalog 的 surface_id 集合覆盖 chatgpt_web、codex_desktop、claude_code_desktop、gemini_web、antigravity。
      pass_condition: 五个 surface 全在。
      can_fail: true
      fails_when: 只登记了当前顺手用的那一两个 surface。
      baseline_2026_08_11: fail

    - test_id: MR-T16
      kind: boundary
      title: unknown stays unknown and entitlement is not account availability
      subject_result_claim_ids: [B08_catalog_evidence_and_freshness, B10_initial_current_surface_set]
      evidence_claim_ids: [C08_Antigravity_Pro_access, entitlement_vs_account_availability, C07_Antigravity_model_labels_verified]
      success_criterion_index: 7
      measurement: >-
        catalog 声明 entitlement_is_account_availability: false；每条 entry 有 registered 标志；
        registered entry 的 capabilities 无空值（未知须写成显式 unknown）；未登记 entry 必须带 status。
      pass_condition: 全部满足。
      can_fail: true
      fails_when: 用留空代替 unknown，或把静态 entitlement 当成账户事实。
      baseline_2026_08_11: fail

    - test_id: MR-T17
      kind: negative
