not_covered_by_this_package:
  - criterion_index: 9
    criterion_head: 至少一轮 blind independent deep research 完成，之后逐 claim reconciliation
    reason: >-
      这是 Stage 02 的过程事实而非 Stage 06 可实现的结构性质。Stage02_证据结论_v2 已记录
      independent_pass: complete_with_source_cleaning 与 reconciliation: complete。
      为它编造一条静态检查只会产生一条不可能失败的测试。
  - item: 路由运行期行为（"每次路由都输出…"）
    reason: >-
      本任务在 Stage 06 前不产生可执行路由器，运行期断言无法在冻结时点诚实地失败。
      已降级为对 contract 声明的静态检查（MR-T04 / MR-T05 / MR-T06）。
