      can_fail: true
      fails_when: §7.1 继续内嵌会过期的价格与模型目录。
      baseline_2026_08_11: fail

    - test_id: MR-T18
      kind: positive
      title: entry spec keeps the stable routing preflight rule and a mechanism pointer
