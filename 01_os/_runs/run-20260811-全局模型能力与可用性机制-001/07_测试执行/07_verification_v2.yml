non_blocking_notes:
  - id: N1
    title: source locator durability is checked for presence, not for reachability
    observation: >-
      validate_source_index requires a kind plus one non-empty locator among url, ref and path.
      Reviewer probe X01 replaced a cited source's url with a path to a file that does not exist,
      kept kind, and both the canonical validator and the full 35-test package stayed green.
    current_impact: none — all 10 current locators are durable as written
    why_not_blocking: >-
      Neither A nor B requires locator reachability, and MR-T29 states in its own not_frozen clause
      that it freezes the existence of a reachable resolution contract rather than the strength of
      each locator. Treating this as a blocker would freeze a reviewer preference that no accepted
      evidence supports, which is the failure mode this dispatch warns about.
    suggested_follow_up: a later task may extend the source index contract to require that a path
      locator resolves and that a url locator is absolute; that is a new requirement, not a fix
  - id: N2
    title: two guards live in the frozen package rather than in the canonical mechanism
    observation: >-
      Probes X06 (Opus 4.8 rebound to antigravity) and X02 (price_weight inside a catalog entry)
      pass the canonical validator and are caught only by MR-T30 and MR-T25.
    current_impact: none while the run evidence travels with the repository
    why_not_blocking: >-
      B13 enumerates what the validator must surface and neither evidence-conformance of a surface
      attribution nor an economic key outside the routing contract is on that list. The division of
      labour is deliberate and MR-T30 documents it.
    suggested_follow_up: if the frozen package is ever retired, the MR-T30 unsupported-combination
      table should move into the canonical mechanism first
  - id: N3
    title: the 2026-08-01 model-routing authorization_ref no longer appears in canonical text
    observation: >-
      §7.1 previously carried an authorization_ref recording the Human grant that superseded the
      "Codex always uses GPT-5.4" default and the blanket Gemini suspension. The thinned §7.1 and
      the new mechanism carry no equivalent record.
    current_impact: >-
      none for routing behaviour — the restrictions that ref authorized were themselves removed by
      B11, so there is no surviving rule whose provenance is now unbacked
    why_not_blocking: B11 explicitly designates the Gemini restriction and the price table as content
      that stops being a long-term entry-spec fact; the ref remains in git history at d5aef4b
  - id: N4
    title: A criterion 2 is satisfied jointly by the input contract and routing_basis, not by output fields
    observation: >-
      A v3 criterion 2 reads as though role, risk tier, task shape and required capabilities are
      emitted in the route record. The contract's required outputs do not name them; B04 resolved
      the criterion that way and B's requirement_satisfaction maps criterion 2 to B03 plus B04.
    current_impact: none — the inputs are fixed in the task packet's executor_profile and the
      rationale travels in routing_basis
    why_not_blocking: this is an accepted upstream modelling choice, not a candidate defect; it is
      recorded so the reading is not lost rather than rediscovered as a finding later

risks_not_covered_by_this_review:
  - The route selection procedure was never executed end to end; no routing decision was produced,
    so this review proves structural and evidence discipline, not routing quality.
  - Provider URLs in the source index were not fetched. Their durability is judged from locator
    shape, not from a live retrieval, and provider pages change without notice.
  - Reproducibility across operating systems was not measured; every command ran on one Windows
    workstation with CPython 3.14.
  - MR-T20's byte-identity baseline for the publisher authority registry was verified only by
    confirming the file is absent from the master..HEAD diff.
  - No independent check of whether the Stage 02 corpus itself is accurate; the review takes the
    Human-accepted Stage 02 conclusions as given and checks only conformance to them.
