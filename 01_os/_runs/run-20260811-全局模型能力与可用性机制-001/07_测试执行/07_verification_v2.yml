        registered false, status discovered_unregistered_needs_Human_task_time_observation
      - the only Anthropic entry on surface_id antigravity is Claude Opus 4.6, matching Stage 02 C07/C08
      - source_refs are ANTH_CODE_MODELS, ANTH_CODE_USAGE, GEMINI_PASS — all Anthropic-Claude-Code or
        independent-research identities, consistent with the Stage 02 corpus where every first-party
        Opus 4.8 statement names the Anthropic Claude / Claude Code access surface
      - B10 permits recording Opus 4.8 as discovered/unregistered pending Human task-time observation;
        the entry does exactly that and does not enter the default-available set
      - reviewer probe X06 restored the defective binding and turned MR-T30 red, so the guard is live
  F2:
    title: source resolution / evidence laundering
    closed: true
    reviewer_evidence:
      - >-
        source index is reachable from the declaration surface — it is item 5 of the boot manifest
        load_order, the catalog's source_index_ref points at it, and the boot manifest names both
        the canonical validator and the registry
      - 10 distinct tokens collected from catalog source_refs and parameter_profiles
        surface_exposure_evidence; 0 unresolved against the canonical index
      - 0 tokens shaped like a Stage 02 claim id, and no C<nn>_ string occurs anywhere in the catalog
        or the source index — the C08_Antigravity_Pro_access-as-source-id shape is absent
      - GOOGLE_AG_PRICING is present as provider_first_party with url https://antigravity.google/pricing
        and is cited by 3 catalog positions; the real provider source identity was restored, not deleted
      - >-
        all 10 locators are durable as written — 9 absolute https provider URLs plus one
        content-addressed Human_upload_sha256 ref
      - 0 unused source ids; the index is not padded
      - the 10 shared records carry byte-equivalent kind, title and locator values to the Stage 02
        source_registry, so this is a filtered copy that preserves source class and locator semantics,
        not a mechanical flattening
      - the four Stage 02 records excluded from the canonical index are A2, CHATGPT_PASS, GPT_WEB_FAILED
        and GOOGLE_GEMINI_THINKING; the first three resolve into 01_os/_runs/** or a noncompliant attempt
        and the fourth is uncited, so excluding them is what keeps the canonical mechanism from depending
        on a path the startup rules forbid preloading
    residual: see non_blocking_notes N1
  F3:
    title: B13 failure surfacing
    closed: true
    reviewer_evidence:
      - all 8 dispatch-listed defect classes produce a non-zero exit from the boot-declared validator
        under reviewer-authored probes; see independent_measurement.required_defect_classes
      - the unmutated control copy validates green, so the red results are caused by the defects
      - probes were constructed from the mechanism declaration surface, not by calling the Stage 04
        selftest or reusing its mutation table
    residual: see non_blocking_notes N1 and N2

