blocking_findings:
  - finding_id: F1_opus48_false_surface_and_source_attribution
    attack_point: R7-P3
    severity: blocking
    location: 01_os/03_mechanisms/model_routing/模型与产品面目录_v1.yml (last entry)
    observed:
      provider: Anthropic
      surface_id: antigravity
      model_label: Claude Opus 4.8
      registered: false
      source_refs: [GOOGLE_AG_MODELS, GEMINI_PASS]
    evidence_against:
      - ref: 02_信息收集与提炼/证据对齐与冲突消解_v1.yml#C07_Antigravity_model_labels_verified
        says: Antigravity selector lists Gemini 3.6 Flash, Gemini 3.1 Pro, Claude Opus 4.6.
      - ref: 02_信息收集与提炼/证据对齐与冲突消解_v1.yml#C08_Antigravity_Pro_access
        says: Google AI Pro Antigravity models table lists Gemini 3.6 Flash, Gemini 3.1 Pro, Claude Sonnet/Opus 4.6.
      - ref: 02_信息收集与提炼/DeepResearch_ChatGPT官方一手资料_v1.md lines 69,75,76,85,92
        says: >-
          Every first-party statement about Opus 4.8 concerns the Anthropic Claude /
          Claude Code access surface. Line 92 states explicitly that Opus 4.8 is a
          candidate in the Human's Claude Code Pro account pending task-time observation.
    reviewer_measurement: >-
      Repository-wide scan for "4.8": zero occurrences bind Opus 4.8 to Antigravity in
      any Stage 02 evidence file. The only binding is the catalog entry itself.
    why_blocking: >-
      Neither cited source supports the claim. Both cited sources support Opus 4.6 on
      that surface. registered:false records the entry as an unverified candidate; it
      does not make a false surface binding acceptable, and the validator skips all
      source checks for unregistered entries, so nothing surfaces the error later.
      B08 requires source-backed entries and B10 places the entitlement-conflict Opus 4.8
      candidate on the Anthropic account surface, not on Antigravity.
    root_cause: implementation_defect_plus_stage04_test_gap
    stage04_gap: >-
      No frozen test asserts that a catalog entry's surface binding is supported by the
      source it cites. MR-T09 checks provider/surface separation structurally only.
    upstream_invalidation_required: false
    suggested_fix_boundary:
      - 01_os/03_mechanisms/model_routing/模型与产品面目录_v1.yml
    suggested_fix: >-
      Rebind the Opus 4.8 entry to surface_id claude_code_desktop with the Anthropic
      first-party refs, or delete the entry. Do not keep it on antigravity.

  - finding_id: F2_source_refs_unresolvable_and_laundered_citation
    attack_point: R7-P1
    severity: blocking
    location: 01_os/03_mechanisms/model_routing/模型与产品面目录_v1.yml (all entries)
    observed:
      opaque_tokens_from_load_surface: 10
      canonical_sources_block_present: false
      canonical_pointer_to_source_index: false
      tokens_resolving_to_no_source_anywhere: [C08_Antigravity_Pro_access]
    reasoning:
      - >-
        The mechanism's declared load surface is its boot manifest load_order plus
        validator, registry and loader README. None of those defines OAI_*, GOOGLE_*,
        ANTH_* or GEMINI_PASS. A reader who obeys the boot manifest cannot resolve a
        single source_ref.
      - >-
        Nine of the ten resolve only in 01_os/_runs/**/证据对齐与冲突消解_v1.yml.
        That file is unregistered by 开发入口 §4 and forbidden from default preload by
        §1.7 and AGENTS.md startup rule 9. A canonical mechanism whose evidence chain
        terminates in a path the OS forbids preloading is not auditable from itself.
      - >-
        C08_Antigravity_Pro_access is worse: it is a Stage 02 *claim* ID, not a source
        ID. It appears in the source_registry of no file. It is cited as both
        source_refs and surface_exposure_evidence on two registered Antigravity entries.
    laundering_trace:
      ref: 06_执行/Stage06_执行证据_v1.yml#steps.S5.attempts[0]
      executor_recorded: >-
        "S2 catalog source identifier contained an economic-token substring even though
        it was only an evidence pointer; remedy: replace the pointer with the accepted
        Stage 02 claim identity and non-economic provider catalog pointer"
      reviewer_reading: >-
        MR-T25 measures by line-level token scan (04_tests.yml: 逐行扫描机制目录下
        yml/md/py，命中价格/额度 token 且该行无否定标记即失败). The real first-party source
        GOOGLE_AG_PRICING (antigravity.google/pricing, the actual origin of C08's
        per-plan model table) contains the substring PRICING and tripped that scan.
        The remedy deleted the primary-source citation and substituted a project claim
        ID. GOOGLE_AG_PRICING is now absent from the canonical mechanism entirely.
        MR-T25's own fails_when is "价格表从入口 §7.1 被搬进机制目录" — a source URL
        citation is not a price table, so the test over-fired and the chosen remedy
        traded evidence integrity for a green light. This is the failure mode the
        dispatch names as evidence laundering / satisfying the validator rather than
        the objective.
    why_blocking: >-
      B08 requires每个 entry 带 source_refs 且为 evidence-backed. MR-T10 only measures
      非空. Field non-emptiness was accepted as source auditability, which the dispatch
      explicitly forbids. The defect is the missing resolution entry point, not missing
      evidence: the underlying Stage 02 evidence is intact and correct.
    root_cause: implementation_defect_plus_stage04_test_gap
    stage04_gap:
      - MR-T10 measures field non-emptiness, not resolvability.
      - MR-T25 is an over-broad lexical scan that cannot distinguish a source-ID citation from a routing field.
    upstream_invalidation_required: false
    upstream_note: >-
      Stage 02 and Stage 03 remain valid. Only the canonical link to them is broken.
    suggested_fix_boundary:
      - 01_os/03_mechanisms/model_routing/模型与产品面目录_v1.yml
      - 01_os/03_mechanisms/model_routing/实现/verify_model_routing.py
      - 04_测试生成 (only if Human reopens the frozen package)
    suggested_fix: >-
      Add a canonical sources: block to the catalog mapping every token to kind/title/
      url/verified_at, restore GOOGLE_AG_PRICING as the first-party citation for the
      Antigravity plan table, replace the C08 claim ID with real source IDs, and make
      the validator fail closed when a source_ref or surface_exposure_evidence token is
      not defined in that block. Re-freezing MR-T25 to exempt a sources: block is a
      Human decision, not a reviewer one.

  - finding_id: F3_validator_does_not_deliver_B13
    attack_point: R7-P4
    severity: blocking
    location: 01_os/03_mechanisms/model_routing/实现/verify_model_routing.py
    b13_promise_vs_implementation:
      schema_and_duplicate_keys: implemented
      duplicate_surface_model_identity: implemented
      required_source_and_freshness_fields: implemented_for_registered_entries_only
      surface_specific_parameter_evidence: implemented_as_nonempty_only
      illegal_cost_quota_routing_fields: not_implemented
      entry_boot_registry_pointer_breakage: partially_implemented
      registry_coverage: not_implemented
      diagnostic_evidence_cannot_hard_qualify: implemented
    concrete_defects:
      - id: D1
        detail: >-
          validate_static loads 01_os/05_registry/model_routing_v1.yml and then reads
          only mechanism_version from it. registry["entries"] is never touched. The
          registry is a dead read: no registered path is checked for existence and no
          mechanism file is checked for coverage. B13 names registry coverage and
          pointer breakage explicitly. MR-T21/MR-T28 do check it, but a frozen run test
          is not the mechanism's runtime failure surfacing.
      - id: D2
        detail: >-
          No cost/price/quota field scan exists anywhere in the validator, although B13
          names 非法 cost/quota routing fields as a validator responsibility. The only
          enforcement is MR-T25, outside the mechanism.
      - id: D3
        detail: >-
          Line 126-129: an entry with registered:false short-circuits after a status
          non-emptiness check. source_refs, verified_at, confidence and capability shape
          go entirely unvalidated. This is the exact hole F1 passed through; the Opus 4.8
          entry also carries capabilities as the scalar string "unknown" rather than a
          mapping, which would fail validation for any registered entry.
      - id: D4
        detail: >-
          The entry specification's pointer into the mechanism is never validated, so
          "entry/boot/registry pointer 断裂" is only two-thirds covered.
      - id: D5
        detail: >-
          boot manifest catalog_version and catalog catalog_version are both asserted
          equal to the literal 1 independently, never cross-checked against each other.
          A future version bump on one side passes.
    why_blocking: >-
      B02 lists the validator as one of five canonical components and B13 makes it the
      failure-surfacing organ of the mechanism. Exit 0 today proves the frozen tests'
      literal, not B13's promise. The dispatch instructs that this situation be reported
      as blocker or upstream/test gap rather than passed on 28/28.
    root_cause: implementation_defect_plus_stage04_test_gap
    upstream_invalidation_required: false
    suggested_fix_boundary:
      - 01_os/03_mechanisms/model_routing/实现/verify_model_routing.py
    suggested_fix: >-
      Consume registry["entries"] and fail closed on uncovered mechanism files and
      missing registered paths; add the cost/quota field scan; validate unregistered
      entries' source and capability shape instead of skipping them; cross-check
      catalog_version between boot manifest and catalog.

non_blocking_findings:
  - finding_id: N1_cowork_opus5_surface_out_of_scope
    attack_point: R7-P2
    verdict: out_of_declared_scope_record_as_followup_not_blocker
    reasoning: >-
      A v3 success criterion 6 names the researched surfaces as ChatGPT Plus web,
      Codex Desktop, Claude Pro / Claude Code Desktop, Gemini Pro web and Antigravity,
      with Claude Code CLI deferred. B10 registers exactly that set and MR-T15 measures
      exactly those five surface_ids. Cowork is neither in A v3 nor excluded by it —
      it was not yet an observed surface when A v3 was confirmed.
    first_hand_observation: >-
      This review is itself running on Claude Desktop — Cowork mode / Claude Opus 5,
      and Stage 04's freeze receipt already recorded that surface. Its existence is
      therefore established, not speculative.
    why_not_blocking: >-
      B10 claims the catalog registers the surfaces Stage 02 verified; it does not claim
      the catalog enumerates every surface that exists. A later-appearing surface does
      not make the B10 statement false, and treating it as a blocker would retroactively
      widen a Human-confirmed scope.
    followup: >-
      A separate catalog-update task should register (claude_desktop_cowork, Claude Opus 5)
      with its own source evidence and a reasoning_setting: not_exposed parameter profile.
      Until then routing must not claim Cowork/Opus 5 as an available candidate.

  - finding_id: N2_entry_thinning_is_clean
    verdict: pass
    detail: >-
      Reviewer scan of the post-candidate entry specification found zero residual price
      tokens and zero residual hardcoded model labels, and the pointer to
      01_os/03_mechanisms/model_routing resolves. The §7.1 replacement is a single diff
      hunk (-85/+26); §8, §9, §11, the T-tier table, the publisher/executor_profile
      distinction and every protected-action control are byte-unchanged. B11 and B12 hold.

  - finding_id: N3_gemini_scope_restriction_and_authorization_ref_now_live_nowhere
    verdict: non_blocking_recommend_human_decision
    detail: >-
      The deleted §7.1 carried a Human authorization ref (immutable_ref …@d5aef4b) and a
      per-model restriction stating that Gemini 3.1 Pro does not take architecture
      selection, semantic adjudication, security review, irreversible operations, master
      publication or final independent acceptance. B11 explicitly authorized removing the
      stale Gemini limitation from the entry, so its removal is in scope, but no artifact
      inherited the substance: the catalog carries no per-model role restriction and the
      routing contract has no field for one.
    why_not_blocking: B11 authorized the removal; §9 still carries reviewer independence.
    followup: >-
      Human should decide whether per-model role restriction belongs to the routing
      mechanism now or waits for the future role mechanism.

  - finding_id: N4_untracked_file_inside_run_evidence_area
    verdict: informational_preexisting_not_reviewer_scope
    path: 01_os/_runs/run-20260811-全局模型能力与可用性机制-001/01_需求建模/requirement/独立DeepResearch任务包_v2_网页模型.md
    detail: >-
