  detail: >-
    列表项的 plain scalar 以反引号 ` 开头。YAML 1.1/1.2 把反引号列为保留指示符，
    不能作为 plain scalar 的首字符，因此整份文件在标准 parser 下抛
    "found character '`' that cannot start any token"。
    第 55 行同样含反引号，但出现在句中，不触发该规则——这是本缺陷只影响一行的原因。
