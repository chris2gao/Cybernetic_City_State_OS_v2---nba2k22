resolved_evidence_ready_for_stage_03:
  - routing object is model + product_surface + parameter_profile.
  - current account availability is Human task-time override; registered candidates default available.
  - routing optimizes task-model fit / reliable completion, not cost/token/quota economics.
  - surface-specific parameters must be recorded; API settings are not copied blindly to Web/Desktop.
  - model routing is an independent global mechanism; workflow calls it, context management and role mechanisms remain separate responsibilities.
  - stable entry/discipline files should point to the mechanism rather than becoming a volatile model catalog.
  - current product facts require source/ref, verified_at and invalidation conditions.
  - no exact Antigravity project task ceiling is claimed in this task.

