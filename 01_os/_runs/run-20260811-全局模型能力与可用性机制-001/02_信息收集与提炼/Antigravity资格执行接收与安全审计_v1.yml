  Gemini_3_6_Flash_High:
    source_result: antigravitytest/gemini 3.6 flash - qualification_results.txt on quarantined branch
    reported_cases: [Q1, Q2, Q3, Q4, Q5]
    reported_hard_gate: all_pass
    validity: invalid_for_qualification
