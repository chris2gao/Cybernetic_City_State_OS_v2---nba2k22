stage_03_input_claims:
  - model + surface + parameter_profile 是路由基本对象。
  - 当前账户可用性采用 Human task-time override；默认 registered candidates available，不做自动额度探测。
  - task-model fit / reliable completion 是唯一优化方向；不进行 token/价格/额度经济优化。
  - model routing 是跨阶段复用能力，应低耦合为独立 global mechanism；workflow 只调用。
  - context_management、role mechanism、model routing、future task execution envelope 各自独立，通过小接口组合。
  - provider/API/catalog facts 与 project qualification evidence 分层；后者决定本 OS 内任务适配边界。
  - parameter profile 必须是 surface-specific，不能把 API-only 参数复制到 Web/Desktop。
  - qualification 至少覆盖 mechanical、standard implementation、semantic judgment、long-chain closure、primary-diff review，并区分 hard gates 与 diagnostic metrics。

stage_03_prohibitions:
  - 不把被拒绝的 258K/250K 等弱来源数值写成 routing contract。
  - 不把 vendor benchmark 当 project qualification。
  - 不建立 quota watcher、自动 entitlement scraper、token/cost scorer。
  - 不因为 GPT_Web 研究失败而降低 evidence 标准或把其泛化报告计入独立事实票数。
