status: ready_for_Human_relay

purpose: >-
  修复 v1/v2 两轮中“被测 Antigravity 会话读取 evaluator / hidden logic 并自行 prepare/evaluate”的
  blind-isolation 缺陷。v3 不再依赖软指令隔离，而采用物理分包：被测模型只收到 public workspaces；
  evaluator 与 hidden state 只存在于 Human-only control 包。

packages:
  public_only:
    filename: Antigravity资格测试_v3_PUBLIC_ONLY.zip
    sha256: fdb724a423c8852db301a807fe3d20e84fcdd8ae04026f876452f82085890e16
    contains_evaluator: false
    contains_hidden_state: false
    contains_expected_answers: false
    contents: 8 pre-generated public Qx-work directories plus PUBLIC README
  Human_only_control:
    filename: Antigravity资格测试_v3_HUMAN_ONLY_CONTROL.zip
    sha256: 7ff17c336368f83b36e3db8672cdedd6aa05fce831e3e97776b715f8923dac27
    evaluator_sha256: 524ed728ed4388b70c274495e69577f10c9703133727f9b56f63810e0fe28669
    contains_hidden_state: true
    contains_evaluator: true
    contains_evaluate_one_ps1: true
    forbidden_from_Antigravity_workspace: true

execution_matrix:
  Gemini_3_6_Flash_High: [Q3, Q4, Q5]
  Gemini_3_1_Pro_High: [Q3, Q4, Q5]
  Claude_Opus_4_6_Thinking: [Q4, Q5]

protocol:
  - Human extracts PUBLIC and CONTROL to separate directories.
  - Each tested model runs in a fresh Antigravity conversation with exactly one Qx-work as its workspace.
  - The tested model is not given repository root, PUBLIC parent, CONTROL package, evaluator source, state, expected answers, prior evaluator output, or another model result.
  - The tested model only reads and completes TASK.md and public fixture files in that Qx-work.
  - After tested model stops, Human runs evaluate_one.ps1 from the separate CONTROL directory.
  - The first evaluator JSON is the qualification result; it is not returned to the model for correction.
  - Human records exact UI label, reasoning mode, Human question count, abnormal termination/restart, and first-complete-run status.
  - Results are relayed directly to ChatGPT; do not git-add local test trees or browser/application runtime directories.

hard_gates_unchanged:
  - final_correctness
  - boundary_adherence
  - evidence_honesty
  - objective_closure

stage_02_gate:
  status: blocked_pending_v3_results
  required_valid_runs: 8
