# ---------------------------------------------------------------------------
# SSH: one current state, and the trail that led to it kept as history only.
# ---------------------------------------------------------------------------
ssh_final_state:
  repository_dot_ssh_present: false
  accepted_by_Human: true
  restoration_required: false
  external_copy_verification_required: false

ssh_repository_state:
  repository_dot_ssh_present: false
  state: intentionally_removed_by_Human
  restoration_required: false
  external_preservation_required: false
  operational_dependency: none_for_current_repository_workflow
  human_statement: >-
    Local GitHub operations already go through the GitHub CLI, so a .ssh/ directory
    inside the repository worktree is not needed. Its removal was deliberate. This
    records only that the current workflow does not depend on an in-repository
    .ssh/; it is not a statement about how the CLI authenticates and creates no new
    repository authority.

ssh_history:
  earlier_observation:
    state: repository_dot_ssh_previously_present
    context: >-
      Raised by this task family as a finding - a private key inside a working tree
      is one broad archive or folder copy away from travelling, which is the same
      failure mode new-domain.ps1 exists to prevent for remotes. It was never read,
      moved or deleted by any task.
  later_observation:
    state: repository_dot_ssh_absent
  Human_final_decision:
    state: intentionally_removed
    restore: false
    verify_external_copy: false

superseded_by_Human_decision:
  - claim: ".ssh/id_ed25519 is present in the repository and must remain so"
    status: superseded
    note: the earliest version of the check asserted this
  - claim: ".ssh/ was relocated to the user profile"
    status: superseded
    note: >-
      an inference from matching names and byte sizes, offered as likely rather than
      verified. The Human has since stated the removal was deliberate, which settles
      it; the relocation guess is not current fact and must not be cited as one.
  - claim: "awaiting Human confirmation"
    status: superseded
    note: the confirmation was given
  - claim: "key material must be proven not destroyed"
    status: superseded
    note: >-
      No longer this task's responsibility, and it was the wrong shape of check
      regardless: a machine test demanding the file exist somewhere else would have
      stood in judgement over a decision that is the Human's to make.
  check_now_asserts: >-
    Only that .ssh/ is absent from the repository worktree. The checker searches
    nothing outside the repository, reads no key material, and makes no claim about
    any external copy.

preservation_final:
  tracked_tree:
    proven: true
  tracked_python:
    proven: true
    count: 92
    path_equality: true
    blob_identical: 91 of 92
    authorized_exception: >-
      01_os/_runs/run-20260810-旧OS物理删除-001/04_验证/verify_exact_deletion.py, this
      task's own instrument, which successive Human corrections ordered corrected.
      Named in the checker and its before/after blobs printed, on the same principle
      as CORE_MANIFEST.yml: an exception that is not written down cannot be told
      apart from an undetected change.
    unauthorized_changes: 0
  ordinary_untracked_snapshot:
    scope: recorded_entries_only
  claude_local_settings:
    path: .claude/settings.local.json
    present: true
  repository_dot_ssh:
    present: false
    state: intentionally_removed_by_Human
  runtime_pydeps:
    state: intentionally_deleted
  cache:
    disposable: true
    permission_blocked_residual: 2

preservation:
  untracked_and_ignored_files_touched: 0
  check_corrected_after_the_commit: >-
    The first post-phase run reported a lost local file and failed. It had not been
    lost: the check compared "is this still untracked?" before and after, and the
    file it named was 04_验证/verify_exact_deletion.py, which this run had just
    committed. A status change is not a disappearance. Two things were wrong and
    both are fixed rather than excused. Preservation is now a question about the
    filesystem - does the path still exist on disk - and the snapshot it compares
    against was built with --exclude-standard, so it never contained an ignored file
    at all: .ssh/, .claude/settings.local.json and the _runtime trees were outside
    it, which are precisely the paths a deletion task must not touch. Those four are
    now asserted directly against the filesystem instead of through a list that
    structurally could not contain them.
  ssh_private_key: >-
    .ssh/id_ed25519 is present, unread, unmoved and undeleted. It is untracked, so
    it was never a deletion candidate - but a task that removes 490 files is exactly
    when a key inside a working tree gets caught by accident, so its survival is
    asserted as a checked post-condition rather than left implicit.
  claude_local_settings: .claude/settings.local.json present
  runtime_dirs: untouched and still ignored

validation:
  executor_evidence:
    - check: pre-delete gate
      command: python 04_验证/verify_exact_deletion.py --phase pre
      result: CLEARED_FOR_DELETION
      exit: 0
    - check: post-delete exact-set equality, whitelist equality, blob integrity, untracked preservation
      command: python 04_验证/verify_exact_deletion.py --phase post
      result: >-
        post_delete_non08=15, whitelist_set_equality=True,
        delete_list_still_present=0, survivor_blobs_unchanged=14 of 14,
        local_files_still_on_disk=1 of 1 with 0 lost, protected_local_present=4 of 4,
        ssh_key_untouched=True
      exit: 0
      first_attempt: >-
        exit 1, on a preservation check that was measuring the wrong thing. See
        preservation.check_corrected_after_the_commit. The deletion result itself was
        identical on both runs; only the check changed.
    - check: context-management structure validator
      result: "context-management structure: PASS"
      exit: 0
    - check: repository default check set
      result: "workflow_static 0, context_structure 0, no_canonical_live_state 0, stage_deliberation_v2_static 0, checks 4/4 ok"
      exit: 0
    - check: migration closure from the predecessor run
      result: 0 active dependency hits on any migrated-from path
      exit: 0
    - check: git diff --check
      result: clean
      exit: 0
  independently_reproduced: false
  independence_disclosure: >-
    All of the above was produced by the executing session. The gate was written
    first, run first, and cleared on the first attempt; the deletion set and the
    post-delete tree were identical on every run of the checks. One check was
    corrected after the fact - the untracked-preservation test, which measured index
    status instead of existence on disk and did not cover ignored files at all. That
    correction narrowed what counts as a failure, which is the move a reviewer should
    re-derive rather than accept: the raw first-attempt output and the reason are
    recorded above. The reviewer should re-run both phases; the snapshot is a file
    this session wrote, and a check that reads its own earlier output is only as good
    as that output.
  not_run:
    - any check requiring a second clone or a second publication transport
    - restoration of any deleted path, which would need its own authorization

