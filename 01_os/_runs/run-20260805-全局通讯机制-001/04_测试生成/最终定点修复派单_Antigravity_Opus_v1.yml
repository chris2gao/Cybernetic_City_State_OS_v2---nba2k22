execution_requirements:
  - id: C01
    requirement: before editing, write an independent primary-code review recording exact defects and source locations

  - id: C02
    requirement: delete the three current root helper files by ordinary git rm in a new commit; no history rewrite

  - id: C03
    requirement: >-
      Replace the circular mutation protocol. Frozen failure_code must never be passed into an adapter,
      fixture, action input, observation, or mutation instruction. Only the evaluator may map an observed
      mismatch to the frozen failure_code.

  - id: C04
    requirement: >-
      Define a typed immutable TestCase for every GC-T001..GC-T050 with explicit fixture_factory,
      action/invoke, observation contract, evaluator, and frozen failure_code. Shared helpers are allowed,
      but each case must provide case-specific data and assertions; no PASS merely because no exception occurred.

  - id: C05
    requirement: >-
      SyntheticConformingAdapter must return concrete observable outputs satisfying each case.
      Synthetic mutation execution must alter a concrete field, set, path, event, command trace, or state transition;
      evaluator independently derives the exact frozen failure_code. Mutation id may be passed, failure_code may not.

  - id: C06
    requirement: >-
      GC-T004..GC-T007 must exercise an explicit safe-YAML parser boundary. Fix GC-T006 escaping and test anchors,
      aliases, and merge keys as distinct subcases. A regex that only recognizes fixture text is insufficient as
      production oracle; scanner/parser rejection must be represented by the adapter contract.

  - id: C07
    requirement: >-
      GC-T031..GC-T034 must create real temporary Git repositories and a local bare remote.
      GC-T031 verifies remote-ahead non-overlapping convergence and final local==remote head.
      GC-T032 verifies two sender-owned non-overlapping paths converge and push.
      GC-T033 creates an actual same-path conflict, verifies continuation stops and exact conflict path is surfaced.
      GC-T034 performs an actual rejected non-fast-forward push and proves no force flag and no automatic retry.

  - id: C08
    requirement: >-
      GC-T050 must read the frozen experiment packet and score each fixture_result in each model response against
      the packet's expected task_id, sender_endpoint_id, expected_recipient_endpoint_id,
      message_type_and_purpose, authority_interpretation, requested_action when applicable, and exact required_refs set.
      Do not compare the two response files to each other and do not accept field presence alone.

  - id: C09
    requirement: >-
      Startup validation must compare the exact 50 test_ids and failure_codes in code against all five frozen specs.
      Harness must prove every evaluator has both a conforming PASS path and a mutation-derived exact failure path.

  - id: C10
    requirement: >-
      Persist all three final outputs under stage04/results using atomic non-overwriting writes:
      preimplementation_baseline_v3.yml, synthetic_conforming_full_v3.yml, mutation_suite_v3.yml.
      Each binds final tested_commit, candidate SHA256, semantic-specs SHA256, runner blob/SHA256,
      adapter id/version, mode, exact command, exit code, and per-test expected/observed/status/failure_code.

required_outcomes:
  preimplementation_baseline:
    adapter: production
    ERROR: 0
    FAIL: 0
    BLOCKED_EXTERNAL: 0
    EXPECTED_FAIL: allowed_only_when_concrete_stage06_capability_is_missing
    exit_code: 0
  synthetic_conforming_full:
    adapter: synthetic_conforming
    PASS: 50
    EXPECTED_FAIL: 0
    FAIL: 0
    ERROR: 0
    BLOCKED_EXTERNAL: 0
    exit_code: 0
  mutation_suite:
    mutated_cases: 50
    exact_frozen_failure_codes_derived_by_evaluators: 50
    wrong_or_missing_codes: 0
    ERROR: 0
    exit_code: 0

