  - 其他模型的私有推理或未发布scratch

required_deliverables:
  candidate_validator:
    path: 01_os/_runs/run-20260805-全局通讯机制-001/04_测试生成/实现/validate_test_candidate.py
    responsibilities:
      - 解析5个规格文件和冻结测试候选
      - 校验5个精确Git blob
      - 校验50个唯一且连续的test_id
      - 校验50个唯一failure_code
      - 校验每条测试均绑定有效E-01至E-10和AC-01至AC-09
      - 重算候选索引SHA256并要求等于2bd1fb7237cbb95527b9cae75542c7e81a1412be393307b8b96b7c96a7c7a70b
      - 重算完整规格语义SHA256并要求等于9b506c7b1d4b95f296ad398a9c4b4187ed135333a12cb59e236ed467366971e5
      - 对损坏fixture提供确定性非零退出码和机器可读findings

  executable_runner:
    path: 01_os/_runs/run-20260805-全局通讯机制-001/04_测试生成/实现/run_stage04_executable_tests.py
    requirements:
      - 自动发现GC-T001至GC-T050
      - 每条测试必须有可执行handler或明确的model_assisted_scoring_adapter
      - 结果状态只允许PASS、EXPECTED_FAIL、FAIL、ERROR、BLOCKED_EXTERNAL
      - ERROR表示harness、解析、fixture或路径故障，不能冒充EXPECTED_FAIL
      - 当前机制尚未实现时，依赖阶段六产物的测试应产生EXPECTED_FAIL而非ERROR
      - GC-T050允许BLOCKED_EXTERNAL或基于现有冻结实验数据执行确定性评分；不得伪造新模型运行
      - 输出机器可读JSON或YAML结果和稳定退出码

  fixtures:
    root: 01_os/_runs/run-20260805-全局通讯机制-001/04_测试生成/fixtures/
    requirements:
      - 正例、负例、边界例
      - 临时Git仓库fixture用于fast-forward、不同sender目录收敛、同路径冲突、non-fast-forward
      - private sentinel用于隐私与归档泄漏测试
      - fixtures不得引用开发者机器绝对路径
      - fixtures不得包含真实秘密

  harness_self_tests:
    path: 01_os/_runs/run-20260805-全局通讯机制-001/04_测试生成/实现/test_stage04_harness.py
    requirements:
      - 验证测试发现数量为50
      - 验证未知test_id、重复failure_code、缺失fixture、损坏YAML会成为ERROR或候选校验失败
      - 验证EXPECTED_FAIL与ERROR可区分
      - 验证输出排序和摘要稳定

  preimplementation_baseline:
    path: 01_os/_runs/run-20260805-全局通讯机制-001/04_测试生成/实现前基线_Antigravity_Opus_v1.yml
    required_fields:
      - tested_commit
      - commands
      - command_exit_codes
      - candidate_validator_result
      - harness_self_test_result
      - discovered_test_count
      - counts_by_status
      - tests_by_status
      - unexpected_failures
      - errors
      - blocked_external
      - baseline_interpretation

  execution_receipt:
    path: 01_os/_runs/run-20260805-全局通讯机制-001/04_测试生成/本地执行结果_Antigravity_Opus_v1.yml
    required_fields:
      - endpoint_id
      - actual_model
      - environment
      - initial_master_head
      - initial_branch_head
      - final_branch_head
      - exact_changed_paths
      - commands_and_exit_codes
      - candidate_index_sha256
      - complete_semantic_specs_sha256
      - discovered_test_count
      - harness_error_count
      - baseline_status_counts
      - global_validator_results
      - limitations
      - verdict

required_commands_after_implementation:
  - python 01_os/_runs/run-20260805-全局通讯机制-001/04_测试生成/实现/validate_test_candidate.py --repo-root .
  - python -m unittest 01_os/_runs/run-20260805-全局通讯机制-001/04_测试生成/实现/test_stage04_harness.py
