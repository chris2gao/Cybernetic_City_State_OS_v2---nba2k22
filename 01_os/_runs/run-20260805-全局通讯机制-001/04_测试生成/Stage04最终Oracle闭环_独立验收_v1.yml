blocking_findings:
  - id: S04-FINAL-ORACLE-F01
    severity: critical
    component: runner
    issue: production EXPECTED_FAIL_STAGE06 conversion is not mode-gated
    observed_logic: EXPECTED_FAIL_STAGE06 is converted whenever adapter == production
    required_logic: adapter == production AND mode == preimplementation-baseline
    consequence: production/full can still masquerade as expected baseline failure

  - id: S04-FINAL-ORACLE-F02
    severity: critical
    test_id: GC-T033
    issue: conforming escalation payload is hardcoded rather than derived from real Git conflict observation
    details:
      - fixture creates a real divergent same-path repository
      - pull_fail_escalate does not execute git pull/fetch/merge or inspect unresolved paths
      - conflict_paths is prefilled as README.md
      - operation_stopped and escalation fields are prefilled booleans
      - mutation subcases are swallowed and only the final omit_required_escalation result reaches evaluator
    required:
      - execute real convergence operation that produces conflict
      - derive exact unresolved paths from git status or diff-filter=U
      - record actual no-continuation/no-push trace
      - evaluate every mutation subcase independently

  - id: S04-FINAL-ORACLE-F03
    severity: critical
    test_id: GC-T034
    issue: NFF structured observation is hardcoded rather than measured
    details:
      - push_stale_escalate does not execute actual stale push
      - trace is prefilled
      - retry_count is prefilled zero
      - remote_head_before_equals_after is prefilled true
      - mutation subcases are swallowed and only escalation_missing reaches evaluator
    required:
      - execute actual ordinary stale push
      - capture command argv and return code
      - read remote head before and after
      - prove retry_count zero from actual trace
      - independently test force/retry/remote-change/escalation mutations

  - id: S04-FINAL-ORACLE-F04
    severity: high
    test_id: GC-T039
    issue: discovery lifecycle is modeled inside the task directory instead of as the communication-root discovery entry
    details:
      - discovery.yml is created under active_task
      - archive implementation rewrites copied archive/discovery.yml
      - frozen oracle requires discovery updated as task moves active to archive
      - mutation subcases reuse one destructive fixture and swallow intermediate failures
    required:
      - model discovery separately at communication root
      - assert active pointer removed/transitioned and archive pointer exposed
      - run each mutation from an isolated fresh fixture

  - id: S04-FINAL-ORACLE-F05
    severity: critical
    test_id: GC-T040
    issue: private-runtime frozen oracle remains partially simulated
    details:
      - no external private runtime sentinel exists outside public task folder
      - no temporary Git repository or git ls-files tracked-state assertion exists
      - private_runtime_becomes_git_tracked branch is explicitly simulated by copytree, not Git
      - evaluator only checks archive directory absence
      - mutation subcases reuse one destructive fixture and swallow failures
    required:
      - add external sentinel plus ignored _runtime sentinel
      - use real Git index/tracked-state observation
      - verify durable prerequisite before deletion
      - verify private runtime deletion after gate
      - isolate each mutation subcase

  - id: S04-FINAL-ORACLE-F06
    severity: critical
    test_id: GC-T041
    issue: exact pointer and Human-request archive exceptions are not physically exercised
    details:
      - valid load_default_context subcases do no file reads and produce no read trace
      - evaluator conforming path checks only absence of exception
      - invalid implicit archive load directly raises a prebuilt escalation
    required:
      - execute active-context read
      - execute exact archive-pointer authorized read
      - execute Human-request authorized archive read
      - persist structured read path trace and authorization source
      - reject only implicit archive read without either authority input

  - id: S04-FINAL-ORACLE-F07
    severity: critical
    test_id: GC-T043
    issue: material-trigger semantics are not actually tested
    details:
      - conforming adapter writes minimal Human/current fields whenever any messages list is present
      - ordinary message unchanged state is not observed before material message
      - mutation mode with messages performs no mutation action
      - evaluator mutation failure is caused by initial state lacking required fields
    required:
      - observe current before and after ordinary event
      - prove ordinary event leaves bytes unchanged
      - then apply material event and prove exact minimal-field update
      - mutation must perform an actual policy violation, not no-op

  - id: S04-FINAL-ORACLE-F08
    severity: critical
    test_id: GC-T044
    issue: authority is still encoded as subcase labels rather than structured task authority state
    details:
      - adapter branches directly on execution_or_review_without_task_authority and architecture_role_but_not_navigation_owner labels
      - no endpoint_id/navigation_owner_endpoint_id/current_task_role/Human_authorization state is evaluated
      - conforming correct-owner subcase performs no write and evaluator only checks no exception
    required:
      - build structured writer identity and current task authority inputs
      - compare writer endpoint to manifest task_navigation_owner_endpoint_id
      - require current task role/authority state
      - prove unauthorized state leaves Human/current unchanged
      - prove authorized owner write changes only allowed fields

  - id: S04-FINAL-ORACLE-F09
    severity: critical
    test_id: GC-T045
    issue: invalid sender-index mutations are label-driven rather than physical-state-driven
    details:
      - invalid mutations directly raise SENDER_INDEX_INTEGRITY without mutating index.yml
      - act_GC_T045 swallows all subcase results and only repeats point_to_missing_message for evaluator
      - append_duplicate_m1 mutation is not independently evaluated
    accepted:
      - conforming m3 message exists
      - conforming append writes m3 pointer
      - conforming evaluator checks exact final list
    required:
      - create fresh physical index/message tree per invalid subcase
      - physically delete/modify/embed/missing-pointer/duplicate-append states
      - evaluator independently reads each resulting index and message target
      - every subcase must be independently fail-closed

