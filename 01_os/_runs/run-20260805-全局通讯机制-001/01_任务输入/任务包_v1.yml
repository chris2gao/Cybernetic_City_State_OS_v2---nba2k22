schema_version: citystate.os_task_packet.v1
task_id: os-v2-global-communication-system-001
repository: chris2gao/Cybernetic_City_State_OS_v2---core
risk_tier: T3_high_risk
exact_base_sha: c7a508abbcda58361fc9b649236d44b706e0bdd4
branch: dev/os-v2-global-communication-system-001
objective: >-
  依照 01_os 七阶段工作流，从第一性需求调研、建模、测试并实现一个供应商无关的
  全局多端人工中转通讯机制，覆盖 Desktop 本地模型、Web 云端模型、CLI 本地模型和 Human；
  以文件承载长内容、最小化聊天累积上下文，并保持可追溯、可验证和 Human 监督。
Human_authorization:
  authority: current_explicit_Human_instruction
  date: 2026-08-05
  decisions:
    - start_this_single_large_task
    - adopt_architecture_decisions_D1_through_D8
    - design_new_system_independently_from_legacy_communication_protocol
    - run_full_new_workflow_with_research_modeling_and_tests
    - keep_delivery_Human_triggered_and_Human_relayed
    - prohibit_automation_in_v1
  does_not_authorize:
    - master_update
    - old_OS_deletion
    - legacy_dot_ai_communication_mutation
    - global_dot_claude_migration
    - force_push_or_history_rewrite
intent:
  one_goal: true
  definition_of_done:
    - A is confirmed by Human against an exact artifact version
    - research evidence includes reproducible encoding and routing comparisons
    - B is complete before legacy comparison
    - legacy comparison produces explicit adopt_reject_defer dispositions without compatibility obligation
    - tests are frozen before implementation and cannot be modified by executor
    - canonical mechanism boot registry loader validator and documentation are mutually aligned
    - local and GitHub carriers are modeled without automatic synchronization
    - Human relay is required and no watcher polling daemon scheduler cron or unattended progression exists
    - canonical directories contain no live message session or mailbox state
    - deterministic tests and independent review pass on an exact candidate head
completion_policy:
  completion_preserving: true
  one_large_task: true
  one_task_id: true
  one_work_branch: true
  ordered_internal_checkpoints: true
  single_active_model_serial_execution: true
  same_task_review_correction: true
  one_consolidated_independent_review: true
workflow:
  contract: 01_os/01_workflow/实现/七阶段最小运行契约_v1.yml
  stage_01:
    output: 01_os/_runs/run-20260805-全局通讯机制-001/01_需求建模/A_需求建模_v1.yml
    collaborative_deliberation_route: full
    Human_exact_version_confirmation_required: true
  stage_02:
    output_root: 01_os/_runs/run-20260805-全局通讯机制-001/02_信息收集与提炼/
    legacy_communication_analysis_prohibited: true
    required_tracks:
      - candidate_encoding_token_and_parse_comparison
      - local_file_carrier_layout_and_lifecycle
      - GitHub_carrier_tradeoffs_for_web_endpoints
      - Human_manual_relay_failure_modes
      - endpoint_addressing_and_multi_recipient_semantics
      - ordering_duplicate_replay_stale_partial_and_conflict_handling
      - cross_platform_paths_and_atomic_file_publication
      - privacy_secret_and_unintended_recipient_risks
  stage_03:
    output_root: 01_os/_runs/run-20260805-全局通讯机制-001/03_结果建模/
    first_principles_B_before_legacy_comparison: true
    legacy_read_only_comparison_after_B: true
    Human_reconfirmation_after_legacy_comparison: true
  stage_04:
    output_root: 01_os/_runs/run-20260805-全局通讯机制-001/04_测试生成/
    frozen_before_execution: true
    executor_may_modify_frozen_tests: false
  stage_05:
    output_root: 01_os/_runs/run-20260805-全局通讯机制-001/05_步骤拆分/
    retry_budget_per_step: 1_to_3
    exits: [pass, retry, invalidate_upstream]
  stage_06:
    output_root: 01_os/_runs/run-20260805-全局通讯机制-001/06_执行/
  stage_07:
    output_root: 01_os/_runs/run-20260805-全局通讯机制-001/07_测试执行/
    independent_reviewer_required: true
    reviewer_must_differ_from_executor: true
source_evidence:
  required_now:
    - 01_os/README.md
    - 01_os/开发入口与单窗口任务规范_v1.md
    - 01_os/03_mechanisms/context_management/**
    - 01_os/03_mechanisms/stage_collaborative_deliberation/**
    - 01_os/01_workflow/实现/七阶段最小运行契约_v1.yml
    - 01_os/01_workflow/*/实现/最小运行schema_v1.yml
  legacy_comparison_only_after_B:
    - .ai/PROTOCOL.md
    - .ai/HANDOFF_COMMON_CONVENTIONS.md
    - .ai/AUTONOMOUS_HANDOFF_COMMUNICATION_v0.1.md
    - .ai/communication_compliance/**
    - .ai/lanes/**
allowed_changed_paths:
  - 01_os/_runs/run-20260805-全局通讯机制-001/**
  - 01_os/03_mechanisms/communication_system/**
  - 01_os/02_boot/communication_system/**
  - 01_os/05_registry/communication_system_v1.yml
  - 01_os/06_execution/boot/communication_system/**
  - 01_os/README.md
  - 01_os/02_boot/README.md
  - 01_os/03_mechanisms/README.md
  - 01_os/05_registry/README.md
  - 01_os/06_execution/README.md
read_only_legacy_paths:
  - .ai/**
  - 06_Silicon_Index/**
explicit_prohibitions:
  - modify_master_without_new_Human_fast_forward_authorization
  - modify_any_dot_ai_path
  - modify_global_dot_claude_or_other_host_configuration
  - delete_or_rewrite_old_OS
  - build_legacy_compatibility_adapter
  - let_legacy_protocol_constrain_initial_A_research_or_B
  - enable_watcher_polling_daemon_scheduler_cron_or_unattended_delivery
  - automatic_local_to_GitHub_or_GitHub_to_local_synchronization
  - automatic_state_progression
  - store_live_messages_mailboxes_sessions_or_endpoint_instance_state_in_canonical_paths
  - claim_workspace_partition_as_security_boundary
  - freeze_encoding_before_measurement
  - git_add_dot_or_git_add_A
  - force_push
  - rebase
  - squash
  - merge_commit
  - history_rewrite
  - modify_unrelated_paths
required_tests:
  workflow_and_mechanism:
    - python 01_os/03_mechanisms/context_management/实现/verify_context_structure.py
    - python 01_os/03_mechanisms/stage_collaborative_deliberation/实现/verify_no_canonical_live_state.py <repo-root>
    - python 01_os/03_mechanisms/stage_collaborative_deliberation/实现/verify_stage_collaborative_deliberation_v2.py static <repo-root>
    - communication_system_static_validator_exit_0
    - communication_system_unit_and_adversarial_suite_pass
  required_failure_classes:
    - missing_partial_stale_or_malformed_message
    - wrong_or_ambiguous_recipient
    - duplicate_replay_or_out_of_order_sequence
    - sender_lane_collision
    - payload_digest_mismatch
    - local_carrier_unavailable_for_web_recipient
    - forbidden_automatic_delivery_or_progression
    - secret_or_private_payload_publication_attempt
    - canonical_live_state_attempt
    - broad_publish_allowlist_violation
    - cross_platform_path_or_encoding_failure
    - Human_relay_receipt_missing
  publication:
    - compare_exact_base_to_candidate_head
    - actual_changed_paths_subset_of_allowlist
    - remote_candidate_head_readback
    - remote_master_unchanged_readback
publisher:
  principal_binding: connector_authenticated
  publication_transport: github_api_connector
  development_branch_write_authorized: true
  source_write_authorized: false
  master_write_authorized: false
  destructive_git_authorized: false
  authorization_ref: current_Human_instruction_2026-08-05_start_global_communication_task
  expected_remote_master_head: c7a508abbcda58361fc9b649236d44b706e0bdd4
  replacement_gate:
    - read_remote_master_40_sha
    - bind_exact_expected_branch_head
    - non_force_compare_and_swap
    - write_only_allowed_paths
    - compare_remote_base_to_new_head
    - read_back_commit_and_changed_paths
    - report_actual_remote_head
executor_profile:
  provider: Codex
  model: GPT-5.6_Sol_or_current_Human_approved_equivalent
  reasoning_effort: high
  mode: goal
  rollout_token_budget: null
  routing_basis: T3 architecture mechanism with cross_environment semantics adversarial validation and repository publication
  authority: routing_only
verification_profile:
  reproduce_before_change: required
  independent_reviewer: separate_fresh_review_window
  different_execution_context: true
  primary_diff_required: true
  executor_summary_not_accepted_as_review_evidence: true
required_completion_pointer:
  packet_id: <task-id>-completion
  status: completed | completed_with_blockers | blocked
  report_ref: 01_os/_runs/run-20260805-全局通讯机制-001/08_结论/完成报告_v1.yml
  validation_ref: 01_os/_runs/run-20260805-全局通讯机制-001/07_测试执行/验证结果_v1.yml
  work_branch: dev/os-v2-global-communication-system-001
  candidate_head: <40-sha>
  source_head: c7a508abbcda58361fc9b649236d44b706e0bdd4
  exact_changed_paths: []
  tests: []
  unresolved_blockers: []
  final_original_task_status: <status>
  remaining_real_Human_decisions_only: []
  human_gate: required_for_master_fast_forward
only_stop_for:
