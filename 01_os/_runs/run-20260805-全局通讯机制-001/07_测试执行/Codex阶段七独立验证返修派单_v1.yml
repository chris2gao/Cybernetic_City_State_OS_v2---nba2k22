objective: >-
  Correct the Stage06 implementation and its frozen-production bridge so GC-T001..GC-T050 are measured
  against the real Stage06 system. Preserve the frozen tests, accepted Stage05 plan, B_v3, Human-relayed
  V1 boundary, and exact task allowlist. Do not redesign the architecture and do not weaken an oracle.

B01_production_oracle_requirements:
  prohibited:
    - mutation_marker_to_expected_error_mapping_as_business_evaluation
    - test_id_to_expected_failure_code_mapping_as_business_evaluation
    - fallback_or_delegation_to_Stage04_StrictValidationAdapter_for_business_behavior
    - no_op_validate_document
    - treating_source_string_checks_as_physical_behavior_proof
  required:
    - >-
      A frozen compact fixture may be translated into a concrete Stage06 message, document, task tree,
      endpoint card set, Git repository, or authority state, but the action must call real Stage06 code.
    - >-
      Pass/fail evidence must be derived from real return values/exceptions and measured physical post-state:
      exact files, bytes, Git refs, argv/return codes, read/write traces, index state, or archive state.
    - every frozen case GC-T001..GC-T050 must have an explicit real-implementation route
    - production bridge must fail closed if a required real route is absent
    - validate_document must call actual Stage06 document validation

B02_authority_role_requirements:
  frozen_refs: [GC-T015, GC-T016, GC-T017, GC-T018, GC-T044]
  required:
    - endpoint-card sender/recipient task-role binding is enforced on the real processing/publication path
    - protected beyond-role action cannot be authorized by role or content text
    - authorization_ref must be physically readable and included in required_refs when required
    - independent current Human authorization is physically checked for protected action authority
    - >-
      Human/current ordinary write authority must derive from structured state containing current task,
      writer endpoint, writer task role, navigation owner, current authority, and optional explicit Human
      authorization; a simple endpoint-id equality or bare boolean authorization is insufficient
    - rejected Human/current writes must leave bytes unchanged

B03_archive_requirements:
  frozen_refs: [GC-T039, GC-T040, GC-T041]
  required:
    - use the real Stage06 archive implementation for frozen physical scenarios
    - preserve indexes/messages/documents/Human/final_results/material_failures as a whole public task archive
    - discovery is updated after the move
    - private runtime never enters archive or tracked Git content
    - use physical Git evidence such as git ls-files to distinguish tracked content before private deletion
    - durable prerequisites are verified before private-runtime deletion
    - required convergence/material residual/private-runtime durable-source preconditions are fail-closed
    - archive default-load tests use the real Stage06 context resolver and structured read traces

B04_publication_bootstrap_requirements:
  frozen_refs: [GC-T019, GC-T021, GC-T022, GC-T024, GC-T026, GC-T027, GC-T029, GC-T030, GC-T035]
  required:
    - new communication documents referenced for publication are validated before canonical message visibility
    - malformed/missing required document causes zero visible canonical message and zero new sender-index entry
    - controlled Web/Human GitHub republication physically publishes repository-shareable required material first, then message, then index
    - local-only/forbidden material is physically blocked before GitHub publication
    - receiver bootstrap binds expected recipient identity/task role to the actual endpoint card
    - receiver bootstrap preserves the exact bounded direct read set and does not recursively expand context
    - failed index completion must not create a misleading successfully-published state; physical bytes/index state must satisfy GC-T035

physical_groups_that_must_not_use_synthetic_business_fallback:
  GC-T033: actual_same_path_Git_conflict_with_exact_unresolved_paths_and_escalation
  GC-T034: actual_stale_non_fast_forward_push_with_argv_rc_ls_remote_before_after_no_force_no_retry
  GC-T039: actual_whole_public_task_archive_and_discovery_update
  GC-T040: actual_git_tracked_state_plus_private_runtime_delete_after_durable_prerequisite
  GC-T041: actual_archive_read_authorization_and_structured_read_trace
  GC-T043: actual_Human_current_byte_snapshot_and_material_trigger_update
  GC-T044: actual_structured_authority_and_rejected_write_unchanged_bytes
  GC-T045: actual_sender_index_files_and_target_existence_state

mutation_independence_requirement: >-
  Add real negative controls proving the frozen production runner depends on Stage06 behavior. For representative
  groups, deliberately alter or inject a broken Stage06 behavior in an isolated test context and show the frozen
  production oracle detects it. Do not mutate frozen Stage04 files and do not persist broken canonical code.

commit_and_evidence_protocol:
  required_shape: new_implementation_commit_I2_then_exact_runs_then_result_only_commit_R2
  implementation_commit_I2:
    contains: corrected_Stage06_implementation_and_production_bridge_only_plus_in_progress_execution_record_if_needed
  execution:
    - run mechanism unit/regression tests
    - run frozen production full GC-T001..GC-T050 against exact I2
    - run frozen mutation-suite GC-T001..GC-T050 against exact I2
    - run all repository validators required by original Stage06 dispatch
  result_only_commit_R2:
    contains_only:
      - new_or_updated_Stage06_result_files
      - final_06_execution_evidence_binding
      - run_state_submission_metadata
    rule: every persisted test result must bind tested_commit exactly to I2
  if_implementation_bytes_change_after_runs: create_I3_and_rerun_everything
  manual_rebinding_of_tested_commit_without_exact_rerun: prohibited

