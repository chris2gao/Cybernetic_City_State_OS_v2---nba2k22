correction_acceptance_rule: >-
  A correction is eligible for Stage07 rereview only after a new implementation commit changes the real
  Stage06 implementation/production bridge, the complete frozen surface is executed against that exact
  implementation commit without synthetic business fallback or marker-to-code shadowing, and a later
  result-only commit persists the new physical evidence. Green self-authored unit tests remain supporting
  evidence only and do not replace the frozen physical oracle.
