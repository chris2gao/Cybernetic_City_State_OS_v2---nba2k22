schema_version: citystate.communication_system.result_model.v3
artifact_id: B-global-communication-system-001
artifact_version: 3
status: candidate_pending_exact_Human_confirmation
task_id: os-v2-global-communication-system-001
run_id: run-20260805-全局通讯机制-001
created_at: 2026-08-05T23:52:00-07:00

input_refs:
  requirement_model:
    path: ../01_需求建模/A_需求建模_v2.yml
    git_blob_sha: e91f32b54224d6048df25cca080a259db380911f
  evidence_package:
    path: ../02_信息收集与提炼/02_evidence.yml
    git_blob_sha: 99a62194b22cee4712b25dc422b932ebe00d7ba6
  first_principles_model: B_结果模型_v1.yml
  legacy_gap_overlay: B_结果模型_v2.yml
  joint_review:
    - Human答复_共同审阅批次001_v1.yml
    - Human答复_共同审阅批次002_v1.yml
    - Human答复_共同审阅批次003_v1.yml
    - B_主要实现说明_v1.md
    - B_主要实现说明_v2.md

normative_effect:
  complete_self_contained_model: true
  supersedes_for_downstream_use:
    - B_结果模型_v1.yml
    - B_结果模型_v2.yml
  history_preserved: true
  stage_04_must_not_merge_prior_versions: true

modeling_boundary:
  operating_scale: low_to_moderate_message_volume
  execution_order: predominantly_sequential_one_task_one_branch
  relay: Human_triggered_and_Human_selected
  default_carrier: local
  supported_endpoints:
    - desktop_local_model
    - web_cloud_model
    - terminal_local_model
    - Human
  no_automatic_delivery_polling_or_state_progression: true
  old_protocol_compatibility_required: false
  provider_specific_wire_roles: false
  private_chain_of_thought_storage_or_transport: prohibited

result_id: global-communication-system-v1

Human_readable_result:
  summary: >-
    每个任务拥有一个独立的公开通讯目录，默认建立在本地；消息需要交给 Web 模型、Human
    明确要求，或当前任务需要本地与 GitHub 全量收敛时，才把 repository_shareable 内容发布到
    当前任务分支。每个 endpoint 在当前 task 内独占自己的消息、文档与索引，序号从 00001
    到 10000。Human 在聊天中只中转紧凑指针并决定实际接收者。任务结束后，公开 task 目录
    整体从 active 移入 archive；未跟踪的私有 runtime 不归档并按上下文机制删除。
  essential_mechanisms:
    - one_task_one_public_communication_space
    - task_and_role_bound_context_entry
    - sender_owned_message_document_and_index_zones
    - immutable_short_messages_and_external_long_documents
    - Human_manual_routing_and_authority_separation
    - direct_required_refs_only_and_fail_closed_missing_context
    - local_default_with_conditional_GitHub_publication_and_convergence
    - endpoint_native_publication_under_one_canonical_contract
    - minimal_Human_current_navigation
    - whole_task_public_archive_and_private_runtime_deletion
    - deterministic_validator_and_negative_fixtures

role_and_context_model:
  no_new_coordinator_role: true
  task_navigation_owner:
    occupied_by_task_role: architecture_and_decision
    meaning: responsibility_set_not_new_authority
    responsibilities:
      - create_or_confirm_task_communication_space
      - maintain_manifest_and_active_task_discovery_entry
      - maintain_Human_current_on_material_events_only
      - decide_or_recommend_local_GitHub_convergence
      - resolve_or_escalate_communication_structure_conflicts
      - close_and_archive_task_after_completion_gate
    does_not_grant:
      - business_execution_authority
      - permission_to_modify_other_sender_owned_paths
      - Human_authority
  independent_review_role:
    owns: own_message_document_and_index_zone
    default_context: review_entry_and_explicit_refs
    may_not: mutate_execution_or_decision_sender_zones
  execution_role:
    current_occupants:
      - Codex
      - Antigravity
      - future_Claude_Code_CLI_or_Desktop_when_available
    owns: own_message_document_and_index_zone
    default_context: execution_entry_and_explicit_refs
    authority_source: current_task_current_role_and_explicit_Human_authorization
  Human:
    responsibilities:
      - select_actual_recipient
      - decide_whether_chain_continues
      - provide_or_withhold_authorization
      - request_GitHub_publication_or_full_convergence
      - resolve_unrecoverable_conflict
      - confirm_or_override_task_closure_when_required
  message_role_fields:
    required:
      - sender_task_role
      - expected_recipient_task_role
    purpose:
      - Human_routing
      - role_context_selection
      - endpoint_card_consistency_validation
    grants_authority: false

logical_roots:
  local:
    communication_root: configured_machine_global_communication_root
    repository_root_pattern: <root>/<repository_id>/
  GitHub:
    communication_root: 01_os/_communication/<repository_id>/
    branch: current_task_work_branch
    repository: current_business_repository
  shared_structure:
    active_root: active/
    archive_root: archive/
    discovery_file: discovery.yml
    active_task_path: active/<task_id>/
    archived_task_path: archive/<task_id>/
  discovery_contract:
    purpose: locate_active_task_and_archived_task_roots_only
    maintained_by: task_navigation_owner
    update_frequency:
      - task_start
      - task_archive
      - Human_requested_navigation_change
    prohibited:
      - message_body
      - sender_message_index_entries
      - delivery_state
      - full_task_history

public_task_directory:
  path: <communication_root>/<repository_id>/active/<task_id>/
  archived_whole: true
  layout:
    manifest.yml: task_entry_and_contract_binding
    endpoints/: endpoint_instance_cards
    indexes/<sender_endpoint_id>.yml: sender_owned_append_only_message_index
    messages/<sender_endpoint_id>/: sender_owned_immutable_canonical_messages
    documents/<sender_endpoint_id>/: sender_owned_communication_documents
    Human/current.yml: minimal_material_navigation_view
    Human/decisions/: durable_Human_decisions
    final_results/: final_task_results
    material_failures/: failures_that_block_or_change_conclusion
  prohibited:
    - private_reasoning
    - untracked_role_scratch
    - secrets_credentials_or_authentication_files
    - unrelated_repository_files

private_runtime:
  purpose: role_private_working_state_and_scratch
  preferred_location: outside_repository
  repository_fallback: <task_run>/_runtime/
  tracked: false
  published_or_archived: false
  delete_on_task_completion: true
  must_not_be_implicit_source_of_durable_message_or_result: true

manifest_contract:
  required_fields:
    - repository_id
    - task_id
    - task_goal
    - task_role_context_refs
    - communication_root
    - active_task_root
    - current_carrier_state
    - work_branch_when_GitHub
    - task_navigation_owner_endpoint_id
    - endpoint_card_refs
    - Human_current_ref
    - privacy_policy_ref
    - lifecycle_status
    - communication_contract_version
  current_carrier_state_values:
    - local_only_current
    - GitHub_current
    - local_and_GitHub_converged
  authority_effect: none

endpoint_card_contract:
  one_card_per_endpoint_instance_per_task: true
  required_fields:
    - endpoint_id
    - principal_class
    - model_or_product
    - environment_class
    - interface_class
    - task_role
    - local_file_read
    - local_file_write
    - GitHub_read
    - GitHub_write
    - instance_label
    - role_context_entry_ref
  self_declared_identity_grants_authority: false
  capability_claim_rule: truthful_current_capability_only

sender_zone_and_sequence_contract:
  scope_key: task_id + sender_endpoint_id
  sequence:
    minimum: 1
    maximum: 10000
    filename_width: 5
    first_value: '00001'
    reset_on_new_task: true
    reuse_within_same_task: prohibited
    exhaustion_behavior:
      - fail_closed
      - surface_sequence_exhaustion
      - require_task_boundary_or_Human_decision
  ownership:
    sender_may_write:
      - indexes/<sender_endpoint_id>.yml
      - messages/<sender_endpoint_id>/
      - documents/<sender_endpoint_id>/
    sender_may_not_write:
      - another_sender_index
      - another_sender_message_or_document_zone
      - Human/decisions_without_explicit_Human_authority
      - final_results_or_material_failures_without_current_task_authority
  sender_index:
    one_per_sender_per_task: true
    append_only_semantics: true
    entry_fields:
      - sequence
      - message_id
      - title
      - message_type
      - expected_recipient_endpoint_id
      - expected_recipient_task_role
      - exact_message_path
    prohibited:
      - message_body
      - long_summary
      - delivery_read_understood_or_accepted_state
    included_in_whole_task_archive: true

canonical_message_contract:
  definition: >-
    canonical message 是满足本 schema、路径、所有权、序号、不可变和 validator 契约的正式
    通讯文件；canonicality 不依赖某一个 CLI 或提供商。
  encoding: safe_subset_YAML
  one_file_per_message: true
  path_pattern: messages/<sender_endpoint_id>/<zero_padded_seq>_<message_type>.yml
  message_id_pattern: <task_id>::<sender_endpoint_id>::<zero_padded_seq>
  immutable_after_publication: true
  required_fields:
    - message_id
    - task_id
    - title
    - message_type
    - sender_endpoint_id
    - sender_task_role
    - expected_recipient_endpoint_id
    - expected_recipient_task_role
    - content
    - required_refs
  conditional_required_fields:
    requested_action:
      required_for:
        - request
        - decision_required
        - blocked
      omitted_or_optional_for:
        - response
        - result
        - correction
  allowed_message_types:
    - request
    - response
    - result
    - decision_required
    - correction
    - blocked
  optional_fields_when_material:
    - in_reply_to
    - supersedes
    - references
    - authorization_ref
    - facts
    - decisions
    - assumptions
    - unknowns
    - constraints
    - risks
  field_rules:
    title: short_Human_and_index_locator
    content: complete_information_needed_for_current_action_without_long_artifact_duplication
    expected_recipient: sender_recommendation_only
    required_refs: exact_direct_nonrecursive_read_set_may_be_empty
    authorization_ref: must_also_appear_in_required_refs
  prohibited_fields_or_semantics:
    - summary_duplicate_of_content
    - delivery_state
    - read_state
    - understood_state
    - accepted_state
    - actual_recipient_record
    - message_custom_digest
    - per_message_protocol_version
    - mandatory_timestamp
    - private_chain_of_thought
  correction_rule:
    old_message_mutation: prohibited
    method: publish_new_correction_with_supersedes

communication_document_contract:
  applies_to: newly_created_long_communication_documents
  default_encoding: Markdown_with_minimal_YAML_front_matter
  structured_alternative: safe_subset_YAML
  required_front_matter:
    - document_id
    - task_id
    - author_endpoint_id
    - author_task_role
    - purpose
    - privacy_class
  optional_front_matter:
    - supersedes
  immutable_after_publication: true
  correction: new_version_and_new_message_reference
  existing_repository_resource:
    may_be_referenced_directly: true
    rewrite_to_add_front_matter: false
  separate_attachment_protocol: false

pointer_and_receiver_bootstrap:
  Human_chat_pointer_required_fields:
    - task_id
    - message_id
    - carrier
    - exact_path_or_GitHub_ref
    - sender_endpoint_id
    - sender_task_role
    - expected_recipient_endpoint_id
    - expected_recipient_task_role
    - one_line_routing_purpose
  receiver_default_load_order:
    - manifest
    - own_endpoint_card
    - own_role_context_entry
    - exact_message
    - each_direct_required_ref
    - authorization_ref_when_present
  default_directory_scan: prohibited
  recursive_reference_expansion: prohibited
  default_all_sender_index_read: prohibited
  missing_or_insufficient_material_context:
    - do_not_guess
    - do_not_expand_history_implicitly
    - publish_blocked_or_request_message_naming_exact_missing_information
    - Human_decides_whether_to_supply_or_continue

Human_current_contract:
  path: Human/current.yml
  owner: task_navigation_owner
  purpose:
    - Human_current_task_entry
    - new_window_navigation
    - current_checkpoint_and_pending_decision_pointer
  minimal_fields:
    - task_id
    - title
    - current_stage_or_checkpoint
    - important_refs
    - pending_Human_decision
    - last_material_update
  update_only_when:
    - task_started
    - Human_decision_required
    - material_block_or_risk
    - stage_completed
    - final_result_ready
    - Human_requests
  update_for_every_message: false
  full_report_or_message_copy: prohibited

carrier_and_publication_model:
  default_publish_target: local
  publish_to_GitHub_when_any:
    - expected_recipient_environment_is_web_cloud_model
    - Human_explicitly_requests_GitHub_publication
    - Human_or_task_navigation_owner_requests_full_task_convergence
  GitHub_publication_scope:
    include: repository_shareable_files_under_current_public_task_folder
    exclude:
      - local_only
      - forbidden
      - private_runtime
      - unrelated_repository_paths
  local_to_Web_publication:
    semantics: controlled_republication_not_automatic_sync
    steps:
      - verify_privacy_class
      - publish_required_documents_to_current_task_branch
      - publish_new_GitHub_canonical_message_with_GitHub_readable_refs
      - update_sender_GitHub_index
      - Human_forwards_GitHub_pointer
  full_convergence:
    semantic_file_by_file_comparison_required: false
    normal_steps:
      - fetch_current_task_branch
      - fast_forward_local_when_remote_is_ahead_and_no_local_divergence
      - stage_exact_repository_shareable_current_task_paths
      - commit_local_current_task_changes
      - push_current_task_branch
      - leave_local_at_latest_remote_head
    one_branch_one_task_assumption: true
    conflict_interpretation: frequent_conflict_indicates_ownership_or_sequence_design_failure
    conflict_behavior:
      different_sender_owned_paths: ordinary_Git_convergence_may_proceed
      same_path_or_shared_navigation_conflict: fail_closed
      non_fast_forward_or_unresolved_divergence: fail_closed
      escalation: task_navigation_owner_then_Human
    automatic_retry_loop: false

endpoint_native_publication:
  local_desktop_or_CLI:
    tools:
      - terminal_file_tools
      - Git
      - GitHub_CLI_when_GitHub_publication_needed
      - optional_publisher_helper
  web_endpoint:
    tools:
      - authorized_GitHub_connector
      - GitHub_API
  invariant_across_endpoints:
    - same_schema
    - same_path_and_owner_rules
    - same_sequence_rules
    - same_privacy_rules
    - same_validation_rules
  central_mandatory_CLI: false

publication_order:
  - create_and_validate_required_documents_and_authorization_refs
  - publish_immutable_canonical_message
  - append_sender_owned_index
  - update_Human_current_only_when_material_trigger_exists
  pointer_must_not_reference_unpublished_artifact: true

permission_boundary:
  message_grants_permission: false
  task_role_field_grants_permission: false
  authority_sources:
    - current_task
    - current_task_role
    - current_Human_authorization
    - repository_and_tool_guards
  beyond_role_action:
    requires_explicit_Human_authorization: true
    authorization_ref_must_be_readable: true
    authorization_ref_must_be_in_required_refs: true
  validator_authority: validation_only_never_authorizes_action

sent_and_failure_semantics:
  sent_definition: carrier_write_or_publish_operation_reports_success
  sent_does_not_mean:
    - delivered
    - opened
    - read
    - understood
    - accepted
  mandatory_physical_readback: false
  optional_lightweight_validation: allowed_when_incremental_cost_is_negligible
  response_or_acknowledgment: new_message_if_any
  material_failure_persistence:
    - blocks_current_action
    - may_change_final_conclusion
    - represents_material_risk
  routine_repaired_tool_error_persistence: false

privacy_contract:
  classes:
    repository_shareable: may_enter_current_private_GitHub_task_folder
    local_only: local_public_task_folder_only_and_must_not_converge_to_GitHub
    forbidden: must_not_be_materialized_in_any_communication_carrier
  GitHub_prepublication_privacy_check: required
  forbidden_examples:
    - passwords
    - access_tokens
    - private_keys
    - authentication_files
    - unnecessary_highly_sensitive_data
  strong_OS_level_access_control_in_scope: false

safe_YAML_and_validator_contract:
  parser_profile:
    encoding: UTF-8
    documents_per_file: 1
    duplicate_keys: reject
    custom_tags: reject
    anchors_and_aliases: reject
    merge_keys: reject
    executable_or_object_construction_features: reject
    unknown_required_fields: reject
    optional_extension_fields: only_when_contract_explicitly_allows
  path_validation:
    directory_where_file_required: reject
    path_outside_declared_task_root: reject_unless_explicit_external_ref_allowed
    GitHub_symlink_or_submodule_communication_artifact: reject
  semantic_validation:
    - endpoint_card_role_matches_message_role
    - sender_path_matches_sender_endpoint_id
    - message_id_matches_task_sender_and_sequence
    - sequence_is_monotonic_and_within_00001_10000
    - required_refs_exact_set_is_recoverable
    - authorization_ref_is_in_required_refs
    - requested_action_present_for_required_message_types
    - prohibited_state_and_authority_semantics_absent
  frozen_negative_cases:
    - missing_required_field
    - duplicate_YAML_key
    - multi_document_YAML
    - alias_or_merge_key
    - malformed_message_id_or_sequence
    - sequence_reuse_or_over_10000
    - sender_path_ownership_violation
    - endpoint_role_mismatch
    - required_ref_missing
    - authorization_ref_not_in_required_refs
    - recursive_scan_attempt
    - privacy_class_GitHub_violation
    - forbidden_data_marker
    - mutation_of_published_message
    - sender_index_points_to_missing_message
    - natural_language_semantically_plausible_but_wrong_exact_field
    - same_path_Git_conflict_not_surfaced
  validator_release_rule: positive_and_negative_suite_must_pass_before_protocol_use
  tests_establish: validator_behavior_not_result_model_correctness

task_lifecycle_and_archive:
  active_task_default_load_scope: active/<current_task_id>/only
  archive_trigger:
    - task_completion_confirmed_under_current_workflow
    - Human_explicitly_requests_archive
  pre_archive:
    - final_result_or_completion_pointer_exists
    - material_failures_and_residuals_recorded
    - GitHub_convergence_completed_when_GitHub_copy_is_required
    - private_runtime_not_required_as_implicit_durable_source
  archive_action:
    - move_entire_public_task_folder_from_active_to_archive
    - preserve_sender_indexes_messages_documents_Human_decisions_results_and_failures
    - update_discovery_file
    - delete_untracked_private_runtime
  per_file_promotion_or_cleanup_analysis: not_required
  archive_history_default_loading: prohibited
  archived_task_reading: only_by_exact_task_pointer_or_Human_request
  secure_erasure_claim: false

implementation_methods:
  - method_id: B3-M01
    type: document_and_schema
    name: canonical_contract_templates_and_role_bindings
    purpose: 定义任务目录、manifest、endpoint card、sender index、message、document、Human current、角色与权限边界
    supports:
      - task_and_role_context_binding
      - cross_endpoint_canonical_semantics
  - method_id: B3-M02
    type: script
    name: deterministic_validator
    purpose: 校验安全YAML、身份角色、序号、所有权、路径、隐私、引用、授权和禁止状态
  - method_id: B3-M03
    type: script_or_skill
    name: task_space_initializer
    purpose: 创建 repository communication root、active task、manifest、endpoint cards和Human current骨架
  - method_id: B3-M04
    type: endpoint_native_process_with_optional_helpers
    name: canonical_message_publication
    purpose: 本地端通过终端/Git发布，Web端通过GitHub connector/API发布；共享同一契约
  - method_id: B3-M05
    type: prompt_or_skill
    name: role_aware_endpoint_bootstrap
    purpose: 从manifest、endpoint card和role context进入，只加载目标消息与direct refs
  - method_id: B3-M06
    type: Git_process_or_script
    name: conditional_GitHub_publication_and_convergence
    purpose: 在三类触发条件下发布或收敛当前task的repository_shareable文件，冲突fail-closed
  - method_id: B3-M07
    type: process_or_script
    name: whole_task_archive
    purpose: 在完成条件满足后整体移动公开task目录、更新discovery并删除private runtime
  - method_id: B3-M08
    type: test_fixture_suite
    name: cross_endpoint_and_failure_fixtures
    purpose: 验证不同endpoint发布、读取、角色、路径、授权、冲突、隐私和归档语义

claims:
  - claim_id: B3-R01
    statement: 每个task拥有独立公开通讯空间，当前上下文默认只加载active当前task，历史task整体归档且不进入默认加载面
    evidence_claim_ids: [E-02, E-05]
  - claim_id: B3-R02
    statement: 默认本地发布；预期接收者为Web、Human要求或请求全量收敛时才发布或收敛到当前task GitHub分支
    evidence_claim_ids: [E-01, E-04, E-05]
  - claim_id: B3-R03
    statement: 每个sender在每个task内独占消息、文档和索引，序号00001至10000且新task重置
    evidence_claim_ids: [E-05, E-06, E-09]
  - claim_id: B3-R04
    statement: canonical message由统一schema与路径所有权定义，各endpoint可使用原生工具发布
    evidence_claim_ids: [E-06, E-09, E-10]
  - claim_id: B3-R05
    statement: 消息包含sender与预期接收者的endpoint和task role，角色用于路由与上下文选择但不授权
    evidence_claim_ids: [E-04, E-09]
  - claim_id: B3-R06
    statement: 短消息不重复summary，长内容外置，接收方只加载direct required refs且缺失时fail-closed
    evidence_claim_ids: [E-01, E-02, E-03, E-09]
  - claim_id: B3-R07
    statement: requested_action仅对request、decision_required和blocked强制，避免接收方猜测下一动作
    evidence_claim_ids: [E-06, E-09, E-10]
  - claim_id: B3-R08
    statement: 架构与决策角色承担task_navigation_owner职责，不创建新coordinator角色也不获得额外权限
    evidence_claim_ids: [E-04, E-05]
  - claim_id: B3-R09
    statement: Human/current仅在重大事件更新，为Human和新窗口提供最小当前导航，不复制消息历史
    evidence_claim_ids: [E-02, E-05]
  - claim_id: B3-R10
    statement: 本地与GitHub全量收敛无需语义逐文件比对，但必须保留普通Git fast-forward、同路径冲突和non-fast-forward保护
    evidence_claim_ids: [E-05, E-08, E-09]
