comparison:
  preferred_format: F1
  reason: YAML 在表达多行及树状结构时具备更高的人类可读性和修订兼容性，在进行版本控制（Git diff）对比时比 JSON 清晰得多，且杜绝了自由文本不可靠的解析风险。
  fields_that_can_be_removed_without_information_loss: 
    - title
  fields_that_are_missing_and_material: 
    - timestamp
    - explicit_protocol_version
limitations: 
