    handling: accept_semantic_lane_output; verify_load_bearing_claims_against_primary_sources; do_not_compute_exact_source_overlap
  - source: Gemini_Deep_Research_lane
    limit: some_primary_papers_were_reached_through_secondary_sources_according_to_report
    handling: verify_load_bearing_claims_against_identified_primary_publications
  - source: repository_working_mirrors
    limit: supplied_upload_sha256_and_repository_blob_sha_are_distinct_identity_layers
    handling: preserve_both_in_receipt

inaccessible_sources:
  - source: ChatGPT_inline_turn_citations
    reason: original_Deep_Research_session_citation_objects_are_not_repository_resources
    handling: treat_as_non_reproducible_lane_detail_and_use_primary_verification_for_bearing_claims
