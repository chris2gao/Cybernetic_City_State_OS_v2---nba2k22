    reason: source_report_declared_access_failure
    handling: key_format_restriction_claim_verified_against_ACL_Anthology_primary_publication

search_asymmetry:
  - lanes: [ChatGPT, Gemini]
    difference: ChatGPT_final_output_is_summary_oriented_while_Gemini_output_contains_detailed_source_table_and_search_paths
    effect_on_coverage: semantic_overlap_is_valid; exact_source_overlap_and_capture_recapture_are_not_claimed
  - lanes: [ChatGPT, Gemini]
    difference: Gemini_emphasizes_industry_blogs_and_recent_agent_frameworks; ChatGPT_emphasizes_standards_governance_and_distributed_system_analogues
    effect_on_coverage: complementary_discovery_spaces_strengthen_pattern_breadth_but_prevent_equal_capture_assumption

source_quality_limits:
  rejected_numeric_claims:
    - coordination_failures_approximately_35_percent
    - explicit_state_validation_reduces_failures_approximately_70_percent
    - TOON_token_savings_30_to_60_percent_as_general_rule
    - Markdown_retry_rate_5_to_15_percent_as_general_rule
  reason: not_stably_supported_by_identified_primary_empirical_sources
  allowed_use: discovery_leads_only

scope_limits:
  supported_operating_boundary:
    - low_to_moderate_message_volume
    - high_value_Human_supervised_tasks
    - explicit_repository_or_local_file_artifacts
    - one_task_per_communication_space
  not_established:
    - high_concurrency_reliability
    - hard_real_time_delivery
    - regulated_secure_erasure
    - cross_host_compatibility_for_Claude_Code_Desktop_and_Codex_Desktop
    - automatic_delivery_or_polling

NotebookLM:
  used: false
  mandatory: false
  reason:
    - direct_comparison_and_primary_verification_are_sufficient
    - key_conflicts_are_already_resolved_or_durable
    - it_cannot_improve_source_reproducibility_of_the_summary_oriented_lane
    - expected_information_gain_is_low

