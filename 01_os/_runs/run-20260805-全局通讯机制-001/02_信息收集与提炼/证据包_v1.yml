fact_findings:
  - finding_id: E-F01
    statement: Independent agent protocols separate agent identity and capabilities from the work message itself.
    evidence_refs:
      - SRC-A2A-1
      - SRC-MCP-LIFECYCLE-1
    supports_requirement_areas:
      - endpoint_instance_identity
      - capability_based_carrier_selection
    inference: false

  - finding_id: E-F02
    statement: A2A explicitly separates Messages from Artifacts and recommends outputs as Artifacts rather than message bodies.
    evidence_refs:
      - SRC-A2A-1
    supports_requirement_areas:
      - lightweight_message_index
      - external_long_documents
    inference: false

  - finding_id: E-F03
    statement: Exact URI or path resources and explicit filesystem roots are established patterns for selective context access.
    evidence_refs:
      - SRC-MCP-ROOTS-1
      - SRC-MCP-RESOURCES-1
    supports_requirement_areas:
      - configured_local_root
      - exact_path_refs
      - on_demand_reading
    inference: false

  - finding_id: E-F04
    statement: Handoff systems may pass the entire conversation by default, but explicit input filtering can restrict the receiving agent context.
    evidence_refs:
      - SRC-OPENAI-HANDOFF-1
    supports_requirement_areas:
      - direct_parent_and_required_refs_only
      - no_full_history_default
    inference: false

  - finding_id: E-F05
    statement: Git content is content-addressed and can be identified by Git object and commit identity.
    evidence_refs:
      - SRC-GIT-OBJECTS-1
    supports_requirement_areas:
      - GitHub_carrier_content_binding
      - no_redundant_message_digest
    inference: false

  - finding_id: E-F06
    statement: JSON and YAML specifications both expect unique mapping or object keys, but common tested Python parsers accepted duplicates and retained the final value.
    evidence_refs:
      - SRC-JSON-1
      - SRC-YAML-1
      - EXP-04-duplicate-key-parser-behavior
    supports_requirement_areas:
      - malformed_or_ambiguous_input_handling
    inference: mixed_source_fact_and_project_observation

  - finding_id: E-F07
    statement: Claude Code automatically loads CLAUDE memory files into context, so live task messages placed there would create persistent context accumulation.
    evidence_refs:
      - SRC-ANTHROPIC-MEMORY-1
    supports_requirement_areas:
      - stable_boot_instructions_separate_from_task_traffic
      - future_global_CLAUDE_cleanup_task
    inference: project_application_of_product_fact

project_experiment_findings:
  - finding_id: E-X01
    statement: In the six-scenario corpus, a rich delivery envelope was 2.918 times the average byte size of a minimal YAML index with no increase in required semantic coverage.
    evidence_refs:
      - EXP-01-representation-density
    supports_requirement_areas:
      - necessary_fields_only
      - no_delivery_state_machine

  - finding_id: E-X02
    statement: Externalizing long content produced much larger savings than choosing between minimal YAML and compact JSON.
    evidence_refs:
      - EXP-01-representation-density
      - EXP-02-long-content-externalization
    supports_requirement_areas:
      - message_as_index
      - path_based_long_content
      - physical_format_secondary_to_context_topology

  - finding_id: E-X03
    statement: A compact schema rejected missing task identity, multiple recipients, empty refs, unknown message type, and unexpected digest fields.
    evidence_refs:
      - EXP-03-schema-negative-cases
    supports_requirement_areas:
      - minimal_machine_contract
      - single_expected_recipient

  - finding_id: E-X04
    statement: Direct-only reference loading avoided a controlled 31-times expansion caused by recursive incidental references.
    evidence_refs:
      - EXP-05-direct-versus-recursive-ref-loading
    supports_requirement_areas:
      - required_refs_are_direct
      - sender_declares_action_complete_ref_set

  - finding_id: E-X05
    statement: A title-and-index Human view avoids persistent duplicate synthesis; narrative summaries can be generated on demand from selected refs.
    evidence_refs:
      - EXP-06-view-generation-cost-model
    supports_requirement_areas:
      - minimal_Human_current_view
      - AI_generated_summary_on_demand
    evidence_class: project_modeling_inference

