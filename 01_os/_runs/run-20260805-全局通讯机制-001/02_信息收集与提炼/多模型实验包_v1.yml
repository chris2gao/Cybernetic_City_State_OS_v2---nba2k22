schema_version: citystate.manual_multi_model_experiment.v1
experiment_id: global-communication-cross-model-001
task_id: os-v2-global-communication-system-001
run_id: run-20260805-全局通讯机制-001
status: ready_for_Human_relay
purpose: >-
  检查不同模型端点能否在不读取完整聊天历史的情况下，从极简消息索引准确恢复任务、身份、
  预期目标、消息用途、必读路径和授权边界；同时比较结构化索引与自由文本指针的歧义。

Human_relay_rule:
  automatic_delivery: prohibited
  Human_selects_endpoints: true
  recommended_endpoint_classes:
    - one_desktop_local_model
    - one_terminal_local_model_if_available
    - one_web_cloud_model_from_a_different_model_family
  minimum_independent_responses: 2
  do_not_use_response_as_authority: true

instructions_to_test_endpoint:
  - 只读取本实验包，不读取旧通讯协议或完整task历史。
  - 标明自己的endpoint身份、模型产品和环境类别。
  - 对每个fixture回答六个问题，不重写fixture全文。
  - 不提出实现方案；只报告理解结果、歧义和必要字段缺口。
  - 将结果保存为独立文档，并把精确路径交给Human中转。

questions_per_fixture:
  - Q1_task_id
  - Q2_sender_endpoint_id
  - Q3_expected_recipient_endpoint_id
  - Q4_message_type_and_purpose
  - Q5_exact_paths_that_must_be_read
  - Q6_authority_interpretation

fixtures:
  - fixture_id: F1-minimal-yaml-index
    format: yaml
    payload: |-
      task_id: os-v2-global-communication-system-001
      message_id: planner-004
      title: 执行超出默认角色的受保护发布
      message_type: request
      sender_endpoint_id: chatgpt-web-planner-01
      expected_recipient_endpoint_id: claude-code-cli-executor-01
      refs:
        - 01_os/_runs/run-x/06_执行/发布任务包.yml
      authorization_ref: 01_os/_runs/run-x/durable/Human_decisions/授权发布.yml

  - fixture_id: F2-compact-json-index
    format: json
    payload: |-
      {"task_id":"os-v2-global-communication-system-001","message_id":"planner-004","title":"执行超出默认角色的受保护发布","message_type":"request","sender_endpoint_id":"chatgpt-web-planner-01","expected_recipient_endpoint_id":"claude-code-cli-executor-01","refs":["01_os/_runs/run-x/06_执行/发布任务包.yml"],"authorization_ref":"01_os/_runs/run-x/durable/Human_decisions/授权发布.yml"}

  - fixture_id: F3-free-text-pointer
    format: prose
    payload: |-
      [os-v2-global-communication-system-001] planner-004 | chatgpt-web-planner-01 ->
      claude-code-cli-executor-01 | request | 执行超出默认角色的受保护发布 |
      path=01_os/_runs/run-x/06_执行/发布任务包.yml |
      auth=01_os/_runs/run-x/durable/Human_decisions/授权发布.yml

  - fixture_id: F4-long-content-reference
    format: yaml
    payload: |-
      task_id: os-v2-global-communication-system-001
      message_id: reviewer-001
      title: B结果模型审核意见
      message_type: response
      sender_endpoint_id: claude-code-desktop-reviewer-01
      expected_recipient_endpoint_id: chatgpt-web-planner-01
      in_reply_to: planner-001
      refs:
        - 01_os/_runs/run-x/03_结果建模/审核意见_v1.md
    special_question: >-
      在形成回应前，你会读取哪些内容？是否会扫描整个task目录或递归读取审核意见文档中的所有引用？

required_response_shape:
  endpoint:
    endpoint_id: <self_declared_test_identity>
    model_or_product: <value>
    environment_class: desktop_local_model | terminal_local_model | web_cloud_model
  fixture_results:
    - fixture_id: <F1-F4>
      recovered:
        task_id: <value>
        sender_endpoint_id: <value>
        expected_recipient_endpoint_id: <value>
        message_type_and_purpose: <value>
        exact_paths_to_read: [<paths>]
        authority_interpretation: <value>
      ambiguity: none | <short description>
      missing_field: none | <field and reason>
  comparison:
    preferred_format: F1 | F2 | F3
    reason: <short evidence-based reason>
    fields_that_can_be_removed_without_information_loss: []
    fields_that_are_missing_and_material: []
  limitations: [<what_this_endpoint_could_not_test>]

acceptance_for_evidence:
  - response_identifies_actual_endpoint_and_model_family
  - response_uses_required_shape_or_semantically_equivalent_structure
  - response_does_not_claim_independence_if_generated_by_same_model_family_as_another_response
  - response_path_is_returned_by_Human
