objective: >-
  Execute the accepted Stage05 v2 step package exactly as S-01 through S-10, serially, to implement the
  global multi-endpoint Human-relayed communication system. Preserve the V1 boundary: Human-triggered and
  Human-relayed only; no polling, watcher, daemon, scheduler, automatic delivery, automatic acknowledgment,
  automatic task-state progression, or canonical live instance state. Produce a complete Stage06 execution
  package and stop for independent Stage07 verification. Do not self-accept the implementation.

execution_protocol:
  order: [S-01, S-02, S-03, S-04, S-05, S-06, S-07, S-08, S-09, S-10]
  follow_each_step_exactly_from: ../05_步骤拆分/05_steps.yml
  retry_budget_source: ../05_步骤拆分/05_steps.yml
  allowed_exits: [pass, retry, invalidate_upstream]
  on_invalidate_upstream: >-
    Stop implementation immediately. Do not alter the upstream artifact. Persist the physical finding and
    return the exact invalidate target/reason for Human/project-lead decision.
  attempt_recording: >-
    For every actual attempt, record step_id, attempt number, result, actual_write_paths, and any
    unauthorized_write_attempts as the work occurs. Do not reconstruct or estimate attempt history later.
  intermediate_commits: allowed_if_intentional_and_linear
  one_commit_per_step: not_required
  history_rewrite: prohibited

stage06_allowed_write_paths:
  - 01_os/_runs/run-20260805-全局通讯机制-001/06_执行/**
  - 01_os/_runs/run-20260805-全局通讯机制-001/run.yml
