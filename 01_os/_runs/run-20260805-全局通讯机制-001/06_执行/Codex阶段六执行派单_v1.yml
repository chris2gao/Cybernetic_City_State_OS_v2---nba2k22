    - allowed_write_paths_subset_of_task_packet_allowed_changed_paths
    - frozen_test_package_sha256_must_match_stage_04
    - attempts_must_respect_step_retry_budget
    - attempts_must_cover_every_step_id_S01_to_S10
    - last_attempt_result_per_step_must_be_pass
    - unauthorized_write_attempts_must_be_empty

