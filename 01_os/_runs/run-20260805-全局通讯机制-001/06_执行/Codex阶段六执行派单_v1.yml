  - verify git config --get core.hooksPath equals .githooks before publication commits
  - verify Human Stage06 authorization is present and true
  - verify accepted 05_steps.yml blob is exactly 9422de27de6794ba2c247c7dae3dcddaa5c9e562
  - verify Stage04 04_tests.yml blob is exactly 360571b6b29a3baecd753dc45611457da9ab6bf2
  - if local branch is behind remote, synchronize only by fetch plus ordinary fast-forward; never pull --rebase

required_stage06_artifact:
  path: 06_execution.yml
  schema: 01_os/01_workflow/06_执行/实现/最小运行schema_v1.yml
  required_payload_fields:
