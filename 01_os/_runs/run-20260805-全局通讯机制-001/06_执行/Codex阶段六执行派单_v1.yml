  - python 01_os/03_mechanisms/stage_collaborative_deliberation/实现/verify_no_canonical_live_state.py .
  - python 01_os/03_mechanisms/stage_collaborative_deliberation/实现/verify_stage_collaborative_deliberation_v2.py static .
  - execute the frozen Stage04 production test surface against the real Stage06 implementation and require GC-T001..GC-T050 to pass under the frozen definitions
  - validate 06_execution.yml against the Stage06 schema and integrity rules
  - verify exact changed paths from physical Git against this dispatch and the task packet
  - verify remote branch head after push
  - verify master remains unchanged

