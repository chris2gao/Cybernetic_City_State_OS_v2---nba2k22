schema_version: citystate.stage_collaborative_deliberation.inquiry_set.v1
inquiry_set_id: IQ-global-communication-001
task_id: os-v2-global-communication-system-001
run_id: run-20260805-全局通讯机制-001
created_at: 2026-08-05T05:03:00-07:00
status: awaiting_Human_answers
source_event_ref: 01_os/_runs/run-20260805-全局通讯机制-001/01_需求建模/重要信息事件_Human流程修正_v1.yml
question_policy:
  ask_only_load_bearing_questions: true
  already_confirmed_scope_not_reopened: true
  recommendation_is_not_Human_decision: true
items:
  - inquiry_id: IQ-01
    target_model_element: token_and_information_efficiency_objective
    gap_type: terminology_ambiguity
    question: >-
      是否确认优化优先级为：信息完整性第一、事实与权限表达准确性第二、信息密度和总 token 成本第三；
      不以最短文本或某个 tokenizer 的最低计数作为目标？
    recommended_answer: confirm
    downstream_impact:
      - evidence_metrics
      - result_model_invariants
      - frozen_test_oracles
    expected_information_value: high
    Human_interruption_cost: low
    acceptance_condition: explicit_confirm_or_correct_priority_order

  - inquiry_id: IQ-02
    target_model_element: external_research_action
    gap_type: unknown_fact
    question: >-
      阶段二是否授权使用 Deep Research，调查多模型文件通讯、结构化信息压缩、Human-in-the-loop relay、
      append-only mailbox、完整性与失败检测等公开资料？
    options:
      A: authorize_Deep_Research_with_bounded_questions_and_source_requirements
      B: official_primary_sources_and_project_experiments_only
      C: repository_and_local_experiments_only_no_external_web_research
    recommended_answer: A
    scope_if_A:
      - read_only_external_research
      - source_provenance_required
      - facts_and_inferences_separated
      - no_external_account_action
      - no_file_or_repository_mutation_outside_current_task
    downstream_impact:
      - research_source_plan
      - evidence_independence
      - architecture_failure_modes
    expected_information_value: high
    Human_interruption_cost: low
    acceptance_condition: select_A_B_or_C

  - inquiry_id: IQ-03
    target_model_element: cross_endpoint_empirical_validation
    gap_type: insufficient_evidence
    question: >-
      是否授权在阶段二或阶段四通过 Human 手动中转，使用当前可用的不同端模型做小规模对照实验，
      测量同一信息包被读取后的事实保留、约束保留、未知项保留、行动理解准确率和输出密度？
    options:
      A: authorize_manual_multi_endpoint_pilot
      B: deterministic_fixture_and_single_environment_tests_only_for_v1
    recommended_answer: A
    constraints_if_A:
      - Human_manually_triggers_each_endpoint
      - no_automation_or_polling
      - fixed_non_sensitive_corpus
      - exact_prompt_and_output_retained_as_evidence
      - no_provider_result_treated_as_authority
    downstream_impact:
      - semantic_efficiency_measurement
      - encoding_selection
      - adapter_requirements
    expected_information_value: high
    Human_interruption_cost: medium
    acceptance_condition: select_A_or_B

  - inquiry_id: IQ-04
    target_model_element: emergency_chat_fallback
    gap_type: missing_field
    question: >-
      当目标端暂时无法访问本地文件或 GitHub 文件时，v1 是否允许 Human 在聊天框粘贴一个有大小上限、
      有摘要与哈希的应急完整载荷，还是必须阻断并先恢复文件可达性？
    options:
      A: allow_bounded_emergency_chat_payload_with_explicit_fallback_receipt
      B: block_without_reachable_file_carrier
    recommended_answer: A
    recommended_limits:
      normal_route: pointer_only_or_compact_summary
      emergency_route: explicit_and_bounded
      long_logs_and_private_data: prohibited
    downstream_impact:
      - carrier_router
      - failure_recovery
      - token_budget
    expected_information_value: medium
    Human_interruption_cost: low
    acceptance_condition: select_A_or_B

  - inquiry_id: IQ-05
    target_model_element: sensitive_information_boundary
    gap_type: missing_field
    question: >-
      是否确认 v1 对 credentials、tokens、keys、.env 和认证材料在所有载体上一律禁止；
      其他项目私有信息可以 local-only，但进入 GitHub 前必须通过显式发布资格检查？
    recommended_answer: confirm
    downstream_impact:
      - message_classification
      - carrier_eligibility
      - negative_tests
    expected_information_value: high
    Human_interruption_cost: low
    acceptance_condition: explicit_confirm_or_correct_boundary

  - inquiry_id: IQ-06
    target_model_element: local_runtime_lifecycle
    gap_type: missing_field
    question: >-
      是否确认本地通讯文件属于 task runtime：任务完成前保留，完成时先提炼耐久事实、正式失败和 receipt，
      再清理可重建的本地消息与中间载荷；需要长期共享或供 Web 端读取的内容才进入 GitHub？
    recommended_answer: confirm
    downstream_impact:
      - runtime_layout
      - archive_and_cleanup
      - registry_exclusion
    expected_information_value: medium
    Human_interruption_cost: low
    acceptance_condition: explicit_confirm_or_correct_lifecycle

response_contract:
  compact_answer_allowed: true
  example: IQ-01确认；IQ-02=A；IQ-03=A；IQ-04=A；IQ-05确认；IQ-06确认
  after_response:
    - create_successor_A_v2
    - bind_answers_and_material_event
    - request_exact_Human_confirmation_of_A_v2
    - enter_stage_02_only_after_confirmation
