blocking_findings:
  - finding_id: STAGE05-B01
    severity: blocker
    title: planned_stage06_paths_violate_exact_task_allowlist
    evidence:
      task_packet_allowed_changed_paths:
        - 01_os/03_mechanisms/communication_system/**
        - 01_os/02_boot/communication_system/**
        - 01_os/05_registry/communication_system_v1.yml
        - 01_os/06_execution/boot/communication_system/**
      stage05_planned_roots:
        - 01_os/03_mechanisms/global_communication_system/
        - 01_os/02_boot/global_communication_system/
        - 01_os/05_registry/global_communication_system_v1.yml
        - 01_os/06_execution/communication/
    impact: >-
      Stage06 按当前计划施工会写入未获 Human 授权的路径；exact changed-path allowlist 是权限边界，
      不能由 Stage05 或 Stage06 执行者自行改名、扩展或替换。
    required_correction:
      - 把所有 canonical source/boot/registry/execution intended paths 改为任务包已授权的精确路径族。
      - 不得以“Stage06 与 registry 再决定确切目录名”为由延后；这些目录边界已由任务包固定。
      - 01_os/_communication/<repository_id>/ 只可作为 B_v3 定义的运行时逻辑载体引用；本实现任务不得创建 canonical live instance state，且它不属于当前 implementation changed-path allowlist。

  - finding_id: STAGE05-B02
    severity: blocker
    title: stage06_entry_Human_gate_not_modeled_as_executable_prerequisite
    evidence:
      stage05_authorization: Human授权_进入阶段五_v1.yml
      observed_enter_stage_06_execution: false
      current_S01_prerequisite: old_stage05_authorization_remains_false
    impact: >-
      S-01 是 Stage06 第一施工步骤，但当前计划没有要求新的 Stage06 Human authorization artifact
      作为机器可检查的开始条件。旧 Stage05 授权保持 false 只能证明“之前没授权”，不能证明“现在可施工”。
    required_correction:
      - 保留旧 Stage05 authorization 的 enter_stage_06_execution:false 不变。
      - 在 Stage05 计划中定义新的 Stage06 Human gate artifact/ref 作为 S-01 开始前提。
      - S-01 必须要求该新授权明确 enter_stage_06_execution:true，并绑定 reviewed 05_steps artifact/head。
      - 未取得该授权时 Stage06 executor 必须 fail-closed，不得创建任何实现文件。

  - finding_id: STAGE05-B03
    severity: blocker
    title: mandatory_stage06_execution_package_missing_from_plan
    evidence:
      stage06_schema: 01_os/01_workflow/06_执行/实现/最小运行schema_v1.yml
      required_artifact: 01_os/_runs/run-20260805-全局通讯机制-001/06_执行/06_execution.yml
      required_payload_fields:
        - executor_role
        - allowed_write_paths
        - actual_write_paths
        - frozen_test_package_sha256
        - attempts
        - unauthorized_write_attempts
      current_plan: S10 claims Stage06 complete without assigning materialization/validation of 06_execution.yml
    impact: >-
      即使 S-01..S-10 的代码与测试全部完成，当前计划也无法满足七阶段 workflow 对 Stage06 的正式完成契约。
    required_correction:
      - 在步骤计划中明确由 Stage06 哪一步持续/最终物化 06_执行/06_execution.yml。
      - execution package 必须绑定 Stage04 frozen package 与最终 accepted Stage05 05_steps.yml。
      - 每个 step 的真实 attempt/retry、actual_write_paths 和 unauthorized_write_attempts 必须可累计并在最终包中校验。
      - S-10 只有在 06_execution.yml schema/integrity validation 通过后才可宣称 Stage06 complete 并交 Stage07。

