blocking_findings:
  - id: ST04-V3-IR-001
    severity: blocking
    title: The active v3 freeze receipt is invalid YAML and its path ledger is incomplete
    evidence:
      - 04_测试生成/freeze_receipt_v3.yml#L79
      - 04_测试生成/freeze_receipt_v3.yml#changed_paths
      - independent_v3_probe_results_v1.json#package_audit
    observed: >-
      Strict YAML parsing stops at line 79. The later changed_paths node also
      combines a sequence with count/all_inside keys. Independently measured
      primary diff scope is six paths, while the receipt lists and claims five,
      omitting the receipt itself. The green package command never loads this
      receipt. In addition, 04_tests.yml still calls the RW-T37..T42 environment
      a boot-declared dependency closure even though the executable package uses
      the full candidate tree.
    impact: >-
      The active freeze artifact is not machine-consumable and its durable scope
      and probe-topology statements disagree with physical evidence.
    required_fix: >-
      Produce a valid strict-YAML receipt, record the exact six-path primary
      diff without a self-hash recursion, make package validation load it, and
      align every frozen topology statement with the full-candidate-tree method.

  - id: ST04-V3-IR-002
    severity: blocking
    title: Prohibition normalization still rejects equivalent prefix and record forms
    evidence:
      - independent_v3_probe_results_v1.json#I01_negative_prefix_handoff_prohibitions
      - independent_v3_probe_results_v1.json#I02_list_record_handoff_prohibitions
      - independent_v3_probe_results_v1.json#I04_prohibited_provider_list
    observed: >-
      Negative-prefix handoff declarations and list-of-record declarations are
      rejected by RW-T25. A prohibited_provider list is rejected by RW-T19 as
      if it selected those providers. The fixture validator exits zero for all
      three semantically conforming candidates.
    required_fix: >-
      Normalize positive and negative polarity across prefix, suffix, mapping,
      list and record forms before judging the semantic field. Do not equate a
      negative provider constraint with a normative provider selection.

  - id: ST04-V3-IR-003
    severity: blocking
    title: Entry-mode normalization remains limited to two author-enumerated containers
    evidence:
      - independent_v3_probe_results_v1.json#I03_list_pair_entry_modes
    observed: >-
      A list of two-item mode pairs preserves fresh/reentry separation, exact
      predecessor semantics and passes the mechanism validator, yet RW-T08 and
      RW-T09 both reject it.
    required_fix: >-
      Judge the A-required fresh/reentry semantics through a representation-
      neutral normalized view rather than a closed list of mapping and
      list-of-record containers.

  - id: ST04-V3-IR-004
    severity: blocking
    title: RW-T07 freezes run_id even though A R02 does not require it
    evidence:
      - 01_需求建模/requirement/A_需求建模_v1.yml#R02_window_identity
      - independent_v3_probe_results_v1.json#I15_no_run_id_binding
    observed: >-
      Removing run_id while retaining task_id, role, stage/step and exact
      repository entry facts leaves the mechanism validator green but makes
      RW-T07 red. run_id is a B/fixture choice, not an A or Stage02 mandate.
    required_fix: >-
      Require the task, role, stage/step and repository-entry facts stated by A;
      treat run_id as an optional project binding unless Human confirms it as a
      requirement.

  - id: ST04-V3-IR-005
    severity: blocking
    title: Provider-pin detection has both polarity and subtree blind spots
    evidence:
      - independent_v3_probe_results_v1.json#I04_prohibited_provider_list
      - independent_v3_probe_results_v1.json#I05_resource_neighbor_provider_pin
      - independent_v3_probe_results_v1.json#I06_unlisted_provider_pin
    observed: >-
      A negative provider list is falsely rejected. A real OpenAI pin nested
      under resource_constraints stays 43/43 because the substring 'source'
      triggers provenance exclusion. A real Mistral pin also stays 43/43 because
      the provider token list is hard-coded and incomplete.
    required_fix: >-
      Apply provenance exclusion only to exact provenance/evidence path segments,
      normalize polarity, and reject a positive normative provider selector by
      structure rather than by an enumerated vendor vocabulary.

  - id: ST04-V3-IR-006
    severity: blocking
    title: Role-source detection confuses references with ownership and misses generic IDs
    evidence:
      - independent_v3_probe_results_v1.json#I07_role_reference_matrix
      - independent_v3_probe_results_v1.json#I08_generic_id_second_role_source
    observed: >-
      A role-keyed matrix containing only stage scope plus model-route, handoff
      and authority pointers is rejected by RW-T05/RW-T31. Conversely, a real
      second role source with generic record IDs and role concepts in label
      fields remains 43/43 green.
    required_fix: >-
      Distinguish pointer/reference metadata from owned role semantics, and
      inspect semantic role labels as well as mapping keys when identifying a
      second source of truth.

  - id: ST04-V3-IR-007
    severity: blocking
    title: RW-T43 still misses obvious structured YAML and Markdown catalogs
    evidence:
      - independent_v3_probe_results_v1.json#I09_yaml_mapping_model_catalog
      - independent_v3_probe_results_v1.json#I10_markdown_heading_model_catalog
    observed: >-
      A YAML mapping whose keys are three live catalog model labels and a
      Markdown document with those labels as repeated headings both remain
      43/43 green. Definition-list coverage does not cover these equally
      structured representations.
    required_fix: >-
      Inspect structured YAML keys and values recursively and recognize common
      Markdown entry structures beyond tables and definition lists, while
      preserving the pointer/receipt allowlist.

  - id: ST04-V3-IR-008
    severity: blocking
    title: Autonomy checks miss enabled non-boolean behavior values
    evidence:
      - independent_v3_probe_results_v1.json#I11_non_boolean_autonomy_enablement
    observed: >-
      automatic_task_progression set to after_handoff_publication and scheduler
      set to run_on_window_entry remain 43/43 green because enabled_positions()
      recognizes only a small boolean-like string set.
    required_fix: >-
      Treat any non-negative configured action/schedule value under an autonomy
      key as enabled, or validate against an explicit safe negative schema.

  - id: ST04-V3-IR-009
    severity: blocking
    title: RW-T25 allows the handoff to carry mutable delivery state
    evidence:
      - independent_v3_probe_results_v1.json#I12_carried_delivery_state
    observed: >-
      Adding handoff_record.delivery_state while retaining a separate
      prohibited_fields declaration remains 43/43 green. The test checks carried
      private reasoning but not carried delivery/read/acceptance fields named in
      its own contract.
    required_fix: >-
      Reject carried delivery, read and acceptance state independently of whether
      a prohibition declaration also exists.

  - id: ST04-V3-IR-010
    severity: blocking
    title: Authority checks miss explicit grants expressed as ordinary strings
    evidence:
      - independent_v3_probe_results_v1.json#I13_string_authority_grant
    observed: >-
      master_write_authorized set to 'granted' in a role remains 43/43 green.
      RW-T04 and RW-T18 only recognize a narrow boolean-like truth vocabulary.
    required_fix: >-
      Fail closed on any non-negative authority-grant value or validate authority
      fields against a closed safe schema; do not infer safety from an unknown
      string value.

