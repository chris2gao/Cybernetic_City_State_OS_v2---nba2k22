blocking_findings:
  - id: ST04-IR-001
    severity: blocking
    title: RW-T31 omits A11 model-catalog thinness on a false physical premise
    evidence:
      - 01_需求建模/requirement/A_需求建模_v1.yml#A11
      - 04_测试生成/测试设计说明_v1.md#有意不覆盖的部分
      - 01_os/开发入口与单窗口任务规范_v1.md#7.1
      - 04_测试生成/实现/verify_stage04_acceptance.py#t31
    finding: >-
      A11 explicitly prohibits a second mutable model catalog in workflow or the stable entry.
      The design note excludes that check because it says entry section 7.1 still contains the
      old model tier table. On the frozen candidate's actual base, section 7.1 is already the thin
      model-routing preflight and explicitly says the entry does not copy the catalog. RW-T31
      therefore leaves an A11 violation able to pass for a premise contradicted by the reviewed tree.
    required_fix: Add an ownership-aware negative test that rejects a second mutable model catalog in workflow or entry without rejecting pointers to model_routing.

  - id: ST04-IR-002
    severity: blocking
    title: RW-T08 turns a permissive Stage02 option and B preference into a mandatory exact mode
    evidence:
      - 01_需求建模/requirement/A_需求建模_v1.yml#A02
      - 02_信息收集与提炼/evidence/证据索引_v1.yml#E-003
      - 03_结果建模/B_结果模型_v1.yml#B05
      - 04_测试生成/实现/verify_stage04_acceptance.py#ENTRY_MODES
      - 04_测试生成/fixtures/mutations_v1.yml#M08
    finding: >-
      A02 requires fresh-versus-reentry classification but does not require a third mode named
      forked_successor. E-003 says lifecycle may model a forked successor; it does not make that
      representation mandatory. The harness requires the exact token forked_successor and M08
      kills a mere rename to forked_child. This is a literal/B-shaped requirement, not an A-level
      semantic defect.
    required_fix: Either remove the mandatory third mode or bind it to a new Human-confirmed requirement; if retained, test successor semantics rather than the exact token.

  - id: ST04-IR-003
    severity: blocking
    title: Exact schema-version tokens freeze naming despite the naming-neutral claim
    evidence:
      - 04_测试生成/实现/verify_stage04_acceptance.py#TOKEN_ROLE
      - 04_测试生成/实现/verify_stage04_acceptance.py#Tree.mech
      - 04_测试生成/测试设计说明_v1.md#测试从哪里推导
    finding: >-
      Directory and filename choices are genuinely variable, but discovery only recognizes a
      mechanism when schema_version contains the exact English substrings role_contract.v,
      window_contract.v and handoff_contract.v prefixed by the directory name. A semantically
      equivalent contract using another registered schema naming convention is invisible to all
      42 checks. The package therefore freezes document-kind naming even though A does not.
    required_fix: Discover contract roles through boot/registry-declared artifact kinds or another naming-neutral semantic binding, and add a conforming alternate-schema probe.

  - id: ST04-IR-004
    severity: blocking
    title: Highlighted lexical checks reject compliant negative declarations
    evidence:
      - 04_测试生成/实现/verify_stage04_acceptance.py#key_positions
      - 04_测试生成/实现/verify_stage04_acceptance.py#t19
      - 04_测试生成/实现/verify_stage04_acceptance.py#t25
      - 04_测试生成/实现/verify_stage04_acceptance.py#t34
      - 04_测试生成/实现/verify_stage04_acceptance.py#t35
      - 04_测试生成/实现/verify_stage04_acceptance.py#t36
    finding: >-
      RW-T34..T36 treat every truthy key whose name contains an autonomy, quota or retention token
      as enabled. Compliant forms such as automatic_task_progression_prohibited:true,
      quota_probe_prohibited:true or retention_policy_disabled:true are false positives.
      RW-T25 only recognizes a list-of-field-names representation under a prohibited key and rejects
      an equivalent mapping representation. RW-T19 scans every scalar in the role document, so a
      provenance/evidence citation naming a provider is rejected even when no role pins that provider.
      The mutations cover enabled fixture keys, not these conforming counterexamples.
    required_fix: Make the scans polarity- and structure-aware, scope provider checks to normative role bindings, and add conforming false-positive probes for alternate YAML shapes.

  - id: ST04-IR-005
    severity: blocking
    title: RW-T37 through RW-T42 overconstrain validator dependency topology
    evidence:
      - 01_需求建模/requirement/A_需求建模_v1.yml#A10
      - 04_测试生成/实现/verify_stage04_acceptance.py#stage_mechanism_surface
      - 04_测试生成/实现/verify_stage04_acceptance.py#probe_mech_validator
    finding: >-
      The six probes do execute the mechanism's declared validator and correctly require baseline
      zero followed by non-zero after an injected defect. However, they stage only the new mechanism,
      its boot/loader and registry. A valid composition validator that resolves or calls the existing
      context_management/model_routing contracts or validators can fail the unmutated isolated
      baseline because those declared dependencies are absent. A10 permits and encourages those
      references, so the probe topology rejects a valid implementation choice.
    required_fix: Run the validator against a full candidate tree, or stage its complete boot-declared dependency closure before injecting each defect.

  - id: ST04-IR-006
    severity: blocking
    title: RW-T05 documented dual-condition protection is incomplete for Markdown
    evidence:
      - 04_测试生成/测试设计说明_v1.md#词法扫描的假阳性边界
      - 04_测试生成/实现/verify_stage04_acceptance.py#markdown_role_table
      - 04_测试生成/实现/verify_stage04_acceptance.py#yaml_role_table
    finding: >-
      YAML role-table detection requires role concepts plus per-role attributes, but Markdown
      detection only counts role concepts in a table's first column. The design note claims the
      dual condition generally. A boot-loaded model-routing applicability table with three role-like
      rows can therefore be mistaken for a second canonical role source.
    required_fix: Apply the same per-role-attribute/source-of-truth discrimination to Markdown and add a model-catalog or stage-profile counterexample.

