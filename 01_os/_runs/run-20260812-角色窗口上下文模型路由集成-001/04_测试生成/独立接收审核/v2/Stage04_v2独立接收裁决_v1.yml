new_blocking_findings:
  - id: ST04-V2-IR-001
    title: RW-T25 rejects a compliant disabled-suffix prohibition shape
    evidence: independent_variant_probe_results_v1.json#V10_disabled_suffix_prohibitions
    observed: 42/43; only RW-T25 red
    required_fix: >-
      Normalize prohibition, forbidden, disallowed and disabled suffixes before
      judging both declared prohibitions and carried private-reasoning fields.

  - id: ST04-V2-IR-002
    title: RW-T08/RW-T09 freeze entry_modes as a mapping of mappings
    evidence: independent_variant_probe_results_v1.json#V11_list_shaped_entry_modes
    observed: 41/43; RW-T08 and RW-T09 red while the candidate validator exits zero
    required_fix: >-
      Normalize mapping and list-of-record mode declarations, then judge only
      fresh/reentry identity and exact-predecessor semantics.

  - id: ST04-V2-IR-003
    title: RW-T19 misses a normative provider pin expressed as a mapping key
    evidence: independent_variant_probe_results_v1.json#V12_structured_provider_pin
    observed: nonconforming candidate remains 43/43 green
    required_fix: >-
      Inspect complete normative key paths and structured mapping keys/values;
      keep provenance exclusion segment-aware and scoped to the provenance subtree.

  - id: ST04-V2-IR-004
    title: YAML applicability metadata is still mistaken for a second role source
    evidence: independent_variant_probe_results_v1.json#V13_yaml_role_applicability_matrix
    observed: 41/43; RW-T05 and RW-T31 red
    required_fix: >-
      Require actual per-role source-of-truth properties rather than allowing
      generic `scope` plus `context` substrings to establish a canonical role table.

  - id: ST04-V2-IR-005
    title: RW-T43 misses a second mutable catalog in Markdown definition-list form
    evidence: independent_variant_probe_results_v1.json#V15_markdown_definition_list_catalog
    observed: nonconforming candidate remains 43/43 green
    required_fix: >-
      Parse structured Markdown representations semantically, including
      definition lists, while retaining the pointer/receipt allowlist.

  - id: ST04-V2-IR-006
    title: The validator dependency closure is history-heavy and not closed
    evidence: independent_variant_probe_results_v1.json#dependency_closure
    observed: >-
      two builds identical; 1012 staged files; 776 historical run files; all
      three named foreign mechanisms present; 16 resolvable file refs and 11
      directory members still unresolved
    required_fix: >-
      Use explicit boot/registry/validator dependency declarations or a full
      candidate tree. A staged closure must exclude unrelated history, reach a
      real bounded fixpoint and report zero required resolvable dependencies left out.

