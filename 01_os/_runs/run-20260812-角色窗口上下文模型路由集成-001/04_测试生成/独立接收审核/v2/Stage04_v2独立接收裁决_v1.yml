old_blocker_readjudication:
  ST04-IR-001:
    status: remains_blocking
    judgment: >-
      RW-T43 now exists and correctly allows C07-style pointers, but V15 proves
      that a second mutable catalog in Markdown definition-list form remains
      43/43 green. The A11 requirement is therefore present but not enforced
      across an obvious structured Markdown representation.
  ST04-IR-002:
    status: remains_blocking
    judgment: >-
      Absence and renaming of a third mode are fixed. V11 expresses fresh and
      reentry as a list of structured mode records, preserves exact predecessor
      semantics and updates the candidate validator accordingly, yet RW-T08 and
      RW-T09 reject it. A still does not require a mapping-of-mappings shape.
  ST04-IR-003:
    status: closed_in_isolation
    judgment: >-
      C01/C02 and independent V14 cover alternate schema/filenames plus mixed
      role/window/handoff descriptive wording. V14 remains 43/43 green and
      confirms that content evidence wins over ambiguous descriptions. Other
      blocking representation defects are recorded under their owning tests.
  ST04-IR-004:
    status: remains_blocking
    judgment: >-
      V10 uses the explicitly requested `*_disabled: true` prohibition suffix
      and is rejected by RW-T25. V12 adds a normative
      `preferred_provider: {openai: true}` binding and remains 43/43 green,
      proving that the provider scan misses mapping-shaped pins while accepting
      the existing scalar mutation.
  ST04-IR-005:
    status: remains_blocking
    judgment: >-
      The closure is deterministic over two independent builds and contains the
      directly referenced context_management, model_routing and
      communication_system files. It nevertheless stages 1012 files, including
      776 under historical `_runs`, while leaving 16 resolvable file references
      and 11 resolvable directory members unstaged. Green therefore depends on
      an accidental history-heavy, still-incomplete path scan rather than a
      complete bounded dependency closure.
    unrelated_history_sensitivity: >-
      Before the final review evidence files existed, the same probe staged
      1009 files with 773 historical paths. Adding unrelated v2 review evidence
      changed those counts to 1012/776 without changing the candidate mechanism
      or its declared dependencies.
  ST04-IR-006:
    status: remains_blocking
    judgment: >-
      C06 covers only Markdown. V13 adds a legitimate YAML role/stage/context
      applicability matrix with no responsibility, independence, handoff or
      authority source-of-truth fields; RW-T05 and RW-T31 reject it because
      `stage_scope` and `context_hint` are misread as two normative role
      attributes.

