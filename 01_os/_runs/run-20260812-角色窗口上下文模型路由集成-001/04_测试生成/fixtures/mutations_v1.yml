run_id: run-20260812-角色窗口上下文模型路由集成-001
purpose: >-
  Each mutation turns the good tree into a tree that looks complete but violates
  exactly one accepted requirement, and must turn its target check red. A check
  that cannot kill its own mutation is a check that cannot fail, which by
  01_os/01_workflow/04_测试生成/README.md is not a test at all.
collateral_policy: >-
  Other checks going red as well is recorded, not counted as a failure: one
  violation frequently breaks several contract surfaces at once. Mutations that
  also make the mechanism's own validator exit non-zero necessarily turn the six
  validator probes red, because a probe whose baseline is already failing cannot
  prove anything.
good_tree_assembly:
  base: the repository tree under test, copied without .git/08_os/caches
  new_files: fixtures/overlay/**
  edits_to_existing_files: fixtures/overlay_edits_v1.yml
  git: the copy is re-initialised and committed so that the context_management
    validator's `git ls-files` and `git check-ignore` calls have a real index
