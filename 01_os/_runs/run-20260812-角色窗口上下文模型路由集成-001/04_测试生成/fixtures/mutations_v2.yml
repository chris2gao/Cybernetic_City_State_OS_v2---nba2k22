        replace: "schema_version: wrb.契约.丙.v1"
      - file: 01_os/02_boot/window_role_binding/boot_v1.yml
        operation: replace_all
        find: "    purpose: provider-independent canonical role contract"
        replace: "    purpose: canonical document one"
      - file: 01_os/02_boot/window_role_binding/boot_v1.yml
        operation: replace_all
        find: "    purpose: formal working window identity, lifecycle and bindings"
        replace: "    purpose: canonical document two"
      - file: 01_os/02_boot/window_role_binding/boot_v1.yml
        operation: replace_all
        find: "    purpose: structured cross-window handoff contract"
        replace: "    purpose: canonical document three"

  - variant_id: C02
    closes: [ST04-IR-003]
    note: canonical filenames carry no meaning; the boot manifest is updated to match.
    operations:
      - file: 01_os/03_mechanisms/window_role_binding/windows_v1.yml
        operation: replace
        find: "role_source_ref: 01_os/03_mechanisms/window_role_binding/roles_v1.yml"
        replace: "role_source_ref: 01_os/03_mechanisms/window_role_binding/doc_a.yml"
      - file: 01_os/03_mechanisms/window_role_binding/roles_v1.yml
        operation: move_file
        to: 01_os/03_mechanisms/window_role_binding/doc_a.yml
      - file: 01_os/03_mechanisms/window_role_binding/windows_v1.yml
        operation: move_file
        to: 01_os/03_mechanisms/window_role_binding/doc_b.yml
      - file: 01_os/03_mechanisms/window_role_binding/handoff_v1.yml
        operation: move_file
        to: 01_os/03_mechanisms/window_role_binding/doc_c.yml
      - file: 01_os/02_boot/window_role_binding/boot_v1.yml
        operation: replace
        find: "  - path: 01_os/03_mechanisms/window_role_binding/roles_v1.yml"
        replace: "  - path: 01_os/03_mechanisms/window_role_binding/doc_a.yml"
      - file: 01_os/02_boot/window_role_binding/boot_v1.yml
        operation: replace
        find: "  - path: 01_os/03_mechanisms/window_role_binding/windows_v1.yml"
        replace: "  - path: 01_os/03_mechanisms/window_role_binding/doc_b.yml"
      - file: 01_os/02_boot/window_role_binding/boot_v1.yml
        operation: replace
        find: "  - path: 01_os/03_mechanisms/window_role_binding/handoff_v1.yml"
        replace: "  - path: 01_os/03_mechanisms/window_role_binding/doc_c.yml"

  - variant_id: C03
    closes: [ST04-IR-004]
    note: >-
      Negative-polarity declarations. `*_prohibited: true` asserts the
      prohibition; v1 read the truthy value as the behaviour being enabled.
    operations:
      - file: 01_os/03_mechanisms/window_role_binding/handoff_v1.yml
        operation: append
        append: |
          autonomy_posture:
            automatic_task_progression_prohibited: true
            automatic_handoff_delivery_prohibited: true
            scheduler_prohibited: true
            watcher_prohibited: true
            daemon_prohibited: true
      - file: 01_os/03_mechanisms/window_role_binding/windows_v1.yml
        operation: append
        append: |
          out_of_scope_posture:
            retention_policy_disabled: true
            long_running_continuation_prohibited: true
            quota_probe_prohibited: true
      - file: 01_os/02_boot/window_role_binding/boot_v1.yml
        operation: append
        append: "account_quota_probe_prohibited: true\n"

  - variant_id: C04
    closes: [ST04-IR-004]
