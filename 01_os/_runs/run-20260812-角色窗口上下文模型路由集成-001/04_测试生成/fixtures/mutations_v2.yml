schema_version: citystate.stage04.mutation_set.v2
task_id: os-v2-role-window-context-model-routing-integration-001
run_id: run-20260812-角色窗口上下文模型路由集成-001
supersedes:
  path: fixtures/mutations_v1.yml
  disposition: >-
    retained_for_history。v1 记录的是 artifact_version 1 的杀伤集合，包括独立审核证明
    有缺陷的那两条（M08 的 mere rename、M19 的 provenance 误伤）。删掉它会抹掉这些缺陷
    曾经存在的痕迹。

purpose: >-
  两类样本。mutations 把 candidate tree 改成"看起来完整但违反一条已接受要求"的树，
  必须让目标检查变红；conforming_variants 把 candidate tree 改成"合法的另一种实现"，
  必须保持全绿。第二类是本轮新增的：独立审核指出 v1 会拒绝多种合规表达，只有正面反例
  才能证明这些误伤真的被修掉了。

collateral_policy: >-
  顺带变红的其他检查记录但不计失败。让机制自带 validator 变红的 mutation 会必然让六条
  validator 探针一起红——探针基线已失败时它证明不了任何事。

candidate_tree_assembly:
  base: the repository tree under test, copied without .git/08_os/caches
  new_files: fixtures/overlay/**
  edits_to_existing_files: fixtures/overlay_edits_v1.yml
  git: the copy is re-initialised and committed so the context_management
    validator's `git ls-files` / `git check-ignore` calls have a real index

