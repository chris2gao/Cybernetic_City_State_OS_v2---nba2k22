    closes: [ST04-IR-004]
    note: >-
      Provenance naming vendors. Nothing here binds a role to a vendor; it says
      where the taxonomy was cross-checked. v1 rejected this.
    file: 01_os/03_mechanisms/window_role_binding/roles_v1.yml
    operation: append
    append: |
      provenance:
        evidence_note: >-
          Role taxonomy cross-checked against Anthropic Claude Code session
          semantics and the OpenAI Agents SDK handoff model; neither is adopted
          as architecture.
        source_refs:
          - external primary docs, OpenAI Agents SDK
          - external primary docs, Claude Code CLI
        citation_of_prior_art: gemini and gpt-5.6 product surfaces were compared

