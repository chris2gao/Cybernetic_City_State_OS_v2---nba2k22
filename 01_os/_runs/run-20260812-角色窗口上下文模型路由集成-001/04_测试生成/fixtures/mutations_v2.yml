conforming_variants:
  - variant_id: C01
    closes: [ST04-IR-003]
    note: >-
      Same semantics, different schema_version naming, and boot purposes made
      deliberately non-committal so that only content-based discovery can
      succeed. v1 recognised a mechanism solely by the English substrings
      role_contract.v / window_contract.v / handoff_contract.v.
    operations:
      - file: 01_os/03_mechanisms/window_role_binding/roles_v1.yml
        operation: replace
        find: "schema_version: window_role_binding.role_contract.v1"
        replace: "schema_version: wrb.契约.甲.v1"
      - file: 01_os/03_mechanisms/window_role_binding/windows_v1.yml
