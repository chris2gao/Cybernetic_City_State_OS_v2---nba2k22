credential_selection_record:
  adjudicator: Stage 04 independent test designer, correction round 2 (Claude Opus 5, Cowork desktop surface)
  reasoning_setting: not_exposed
  entry_mode: explicit_reentry
  date: '2026-08-12'
  independence: >-
    Same session that produced artifact_version 1 and 2, re-entered explicitly
    and re-reading task, head and authorization facts from the remote rather
    than from conversational continuity. This author is not the final acceptor;
    a fresh independent session must review the corrected package. Two
    independent OpenAI/Codex reviews have already overturned this author's own
    completeness judgement, which is the reason the gate exists.
  measurement_choice: >-
    Static structure and contract checks decided deterministically by
    实现/verify_stage04_acceptance.py. Six checks execute the mechanism's own
    declared validator against the FULL candidate tree and require exit 0 before
    the injected defect and non-zero after it. The dependency crawler used by
    artifact_version 2 is deleted, not improved.
  tolerance: >-
    Zero tolerance; all 43 checks are binary. The normalized digest uses the same
    normalization as
    01_os/06_execution/workflow/minimum_operational_loop/run_minimum_operational_loop.py.

method_qualification:
  testability: every check runs on an arbitrary tree and returns a binary result
  peer_review: >-
    artifact_version 1 and artifact_version 2 were each independently reviewed by
    an OpenAI/Codex session and each returned FIX_REQUIRED. This third package has
    not been reviewed; a fresh independent acceptance is a hard gate before Stage 05.
  known_error_rate: >-
    Mutation kill rate 47/47 and conforming-variant pass rate 14/14. Neither is a
    completeness claim, and the history says so plainly: v1 reported 42/42 and was
    overturned on six findings; v2 reported 43/43 plus 9/9 conforming and was
    overturned on six more. Four of the v2 findings were false positives that no
    mutation can expose and two were false negatives that no conforming variant
    can expose, so both sample classes had to be extended adversarially.
  operating_standard: 实现/verify_stage04_acceptance.py subcommands package / acceptance / selftest

frozen_contract_surface:
  note: >-
    Neither the mechanism directory name, nor canonical filenames, nor field
    names, nor schema_version naming, nor the number of contract documents, nor
    the existence of a third entry mode is frozen.
  mechanism_parent: 01_os/03_mechanisms
  discovery_rule: >-
    exactly one directory under 01_os/03_mechanisms whose documents cover the
    role, window and handoff contract kinds, established either by a descriptive
    declaration in its boot manifest or registry, or by document content.
    Content evidence takes precedence over descriptive wording.
  discovery_is_naming_neutral: true
  pointer_convention:
    boot: 01_os/02_boot/<mechanism>/
    registry: 01_os/05_registry/<mechanism>_v*.yml
    execution_loader: 01_os/06_execution/boot/<mechanism>/
  validator_cli_convention: <validator> static <tree_root>
  validator_probe_environment: full boot-declared dependency closure
  publisher_authority_baseline_sha256: ae9abdf5d729550511de857511a73d36c53f5d52d76e9f57c77b23ad19c29c1a

