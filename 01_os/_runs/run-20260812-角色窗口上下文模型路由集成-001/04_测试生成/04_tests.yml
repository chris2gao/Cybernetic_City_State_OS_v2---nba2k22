not_covered_by_this_package:
  - item: runtime window behaviour
    reason: no executable window runtime exists before Stage 06; such assertions cannot fail honestly at freeze time
  - item: real host-session freshness
    reason: not machine observable; only the disclosure requirement is frozen (RW-T23)
  - item: window and handoff instance storage location
    reason: A does not constrain it
  - item: completeness of the mechanism and boot index READMEs
    reason: pre-existing drift unrelated to T2; RW-T30 is scoped to the T2 mechanism only

findings:
  - id: F1
    statement: >-
      v1 的设计说明以"入口 §7.1 仍有完整模型档位表"为由跳过 A11 catalog thinness。该前提
      在本任务分支上不成立——它读的是另一个 worktree 上的旧版 §7.1。本轮已在 T2 worktree
      重新实测，§7.1 已是薄的模型路由 preflight，A11 检查补为 RW-T43，在当前仓库为绿。
    blocking: false
  - id: F2
    statement: >-
      修正过程中自身踩到一次同类缺陷：naming-neutral 发现的第一版把 boot/registry 条目的
      path 值也拼进描述性 blob，目录名 window_role_binding 里的 role/window 让每个文件都
      自称是角色契约与窗口契约，43 条中 15 条静默绑错文档。已修为只取描述性键并丢弃含
      "/" 的 token，并加入内容优先规则。记录在此以免同一形状再犯。
    blocking: false
  - id: F3
    statement: >-
      `preferred_provider` 曾因含有子串 "ref" 被 provenance 排除规则误放行，M19 存活。
      provenance 的 ref 现按整段匹配。裸子串匹配是 T1 MR-T25 已经付过一次学费的形状。
    blocking: false
  - id: F4
    statement: >-
      B13 未规定 composition validator 调用既有 validator 的语义。本包只要求 T2 自带
      validator 对六类缺陷 fail closed，并要求既有三个 validator 仍退出 0；不冻结
      "必须调用"这一实现选择。
    blocking: false
  - id: F5
    statement: 未发现 B 的 claim 与 Stage 02 已接受证据矛盾。
    blocking: false

payload:
  frozen: true
  freeze_authorization_ref: 04_测试生成/Stage04_Human窄修正授权_v1.yml@dev/os-v2-role-window-context-model-routing-integration-001
  test_package_sha256: 3567d3409c181efd970bdeeab1952c9a2c37419b8f8401d63097653ea5781e9f
  counts:
    positive: 17
    negative: 17
    boundary: 9
    total: 43
  tests:
    - test_id: RW-T01
      kind: positive
      title: a single role/window composition mechanism exists and is self-describing
      success_criterion_ids: [A01, A10]
      evidence_claim_ids: [E-001, E-006, I09]
      closes: [ST04-IR-003]
      measurement: >-
        exactly one directory under 01_os/03_mechanisms covers the role, window
        and handoff contract kinds, established by descriptive declaration in its
        boot manifest or registry, or by document content, and carries a README.
      pass_condition: exactly one such directory, README present
      can_fail: true
      fails_when: the composition lives inside workflow or the entry spec, or more than one candidate exists
      baseline_2026_08_12: fail

    - test_id: RW-T02
      kind: positive
      title: role contract registers the real project roles A requires
      success_criterion_ids: [A01]
      evidence_claim_ids: [E-006, I03]
      closes: [ST04-IR-003]
      measurement: at least five structured role entries covering all five A R01 role concepts, matched by concept not literal id
      pass_condition: all five A R01 role concepts are registered
      can_fail: true
      fails_when: a role is dropped or a new backend executor role replaces the existing one
      baseline_2026_08_12: fail

    - test_id: RW-T03
      kind: positive
      title: every role entry declares responsibility, independence, handoff and authority limits
      success_criterion_ids: [A01]
      evidence_claim_ids: [E-006]
      measurement: each role entry's key set covers the four A R01 properties by concept
      pass_condition: no role entry is missing any of the four
      can_fail: true
      fails_when: a role is registered as a bare label with no declared constraints
      baseline_2026_08_12: fail

    - test_id: RW-T04
      kind: negative
      title: role metadata cannot grant publisher, filesystem, security or Human-gated authority
      success_criterion_ids: [A13, A01]
      evidence_claim_ids: [E-006, I01]
      measurement: polarity-aware scan for enabled authority-granting keys, plus a required declaration that the contract's authority effect is none
      pass_condition: no enabled grant key, and authority declared none
      can_fail: true
      fails_when: a role entry carries an enabled publication or filesystem grant
      baseline_2026_08_12: fail

    - test_id: RW-T05
      kind: negative
      title: no second canonical role source outside the composition mechanism
      success_criterion_ids: [A01, A11]
      evidence_claim_ids: [E-006, I01, I08]
      closes: [ST04-IR-006, ST04-V2-IR-004]
      measurement: >-
        scan the active surface for a table keyed by three or more role concepts
        whose entries also carry normative per-role attributes. Markdown and YAML
        use the same dual condition.
      pass_condition: no such table outside the mechanism directory
      can_fail: true
      fails_when: the working discipline or a workflow README keeps its own normative role table
      baseline_2026_08_12: fail
      false_positive_boundary: >-
        A role-keyed applicability table with no normative per-role attribute
        column is not a role source; conforming variant C06 proves it stays green.
      vacuous_on_empty_tree: true

    - test_id: RW-T06
      kind: negative
      title: context_management boot does not carry an active role source
      success_criterion_ids: [A01, A10]
      evidence_claim_ids: [I02, I03, E-007]
      measurement: every load_order entry of the context boot manifest whose declared purpose names a role must point inside the composition mechanism
      pass_condition: no foreign role source in the context boot manifest
      can_fail: true
      fails_when: context_management keeps loading a _dev role decision as an active source
      baseline_2026_08_12: fail
      retained_by_independent_review: true

    - test_id: RW-T07
      kind: positive
      title: window contract defines a project-level window identity bound to task facts
      success_criterion_ids: [A02]
      evidence_claim_ids: [E-002, E-004]
      measurement: the window contract binds window_id, task_id, run_id, role, stage/step, repository head or branch, and declares a uniqueness scope
      pass_condition: all seven bindings present
      can_fail: true
      fails_when: the window identity is not bound to the task facts that make it reconstructable
      baseline_2026_08_12: fail

    - test_id: RW-T08
      kind: positive
      title: fresh and reentry are separately defined, and any further mode keeps its own identity
      success_criterion_ids: [A02, A03]
      evidence_claim_ids: [E-003]
      closes: [ST04-IR-002, ST04-V2-IR-002]
      measurement: >-
        fresh and reentry must both be declared. A third mode is optional; if one
        exists it must declare its own window identity and name the window it
        descends from.
      pass_condition: fresh and reentry separable; any further mode does not impersonate reentry
      can_fail: true
      fails_when: an additional mode carries no identity of its own and behaves as reentry
      baseline_2026_08_12: fail
      false_positive_boundary: >-
        Absence of a third mode is conforming (C08) and so is a differently named
        one (C09). A rename alone is no longer a defect.

    - test_id: RW-T09
      closes: [ST04-V2-IR-002]
      kind: positive
      title: formal reentry requires an exact predecessor window identity
      success_criterion_ids: [A02, A05]
      evidence_claim_ids: [E-002, E-003]
      measurement: the reentry mode block declares a predecessor window id as required and requires an exact match
      pass_condition: predecessor declared required and exact
      can_fail: true
      fails_when: reentry accepts a window without naming the exact predecessor
      baseline_2026_08_12: fail

    - test_id: RW-T10
      kind: negative
      title: latest or most-recent session is rejected as a formal window identity
      success_criterion_ids: [A02, A05]
      evidence_claim_ids: [E-003]
      measurement: any latest/most-recent pointer must be marked prohibited or discovery-only and must never be an identity field
      pass_condition: explicitly rejected, never enabled
      can_fail: true
      fails_when: the convenience continue pointer is treated as identity
      baseline_2026_08_12: fail

    - test_id: RW-T11
      kind: boundary
      title: host session identity may be not_observable and is never required
      success_criterion_ids: [A02, A08]
      evidence_claim_ids: [E-003]
      measurement: not_observable is a declared legal value and no host session id field is mandatory
      pass_condition: optional with an explicit not_observable disposition
      can_fail: true
      fails_when: the contract demands a provider-specific session id that cannot be produced
      baseline_2026_08_12: fail

    - test_id: RW-T12
      kind: positive
      title: window lifecycle declares its states and deterministic invalidation
      success_criterion_ids: [A03]
      evidence_claim_ids: [E-003, E-004]
      measurement: lifecycle covers entered, active, handoff_ready, closed and stale, and declares invalidation conditions
      pass_condition: five states plus invalidation
      can_fail: true
      fails_when: staleness has no deterministic trigger
      baseline_2026_08_12: fail

    - test_id: RW-T13
      kind: positive
      title: window binds context_management by pointer, with fingerprints and stale receipt
      success_criterion_ids: [A04, A05, A10]
      evidence_claim_ids: [E-004, E-007, I02]
      measurement: the window contract names context_management and binds entry/refs, fingerprints and stale state
      pass_condition: all four bindings present
      can_fail: true
      fails_when: context is bound as free text with no mechanism pointer
      baseline_2026_08_12: fail

    - test_id: RW-T14
      kind: negative
      title: the composition mechanism does not restate context_management policy
      success_criterion_ids: [A10]
      evidence_claim_ids: [E-007, I02]
      measurement: no document inside the mechanism claims a context_management schema token or copies its policy keys
      pass_condition: no duplicated context semantics
      can_fail: true
      fails_when: the composition layer grows its own copy of the layout or lifecycle contract
      baseline_2026_08_12: fail

    - test_id: RW-T15
      kind: negative
      title: no silent fallback to full run history or old chat
