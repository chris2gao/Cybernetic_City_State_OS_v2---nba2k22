known_limitations:
  - statement: >-
      43/43 kills and 9/9 conforming passes are not a completeness claim.
      artifact_version 1 also reported 42/42 and was still found to contain six
      blocking defects, four of which no mutation could have exposed.
  - statement: >-
      The conforming variants cover the representation classes the independent
      review named. Other legitimate shapes may still be rejected; only a fresh
      adversarial review can find them.
  - statement: >-
      Two defects were introduced and caught inside this correction round itself
      (the path-leak in declared-kind discovery, and the bare `ref` substring).
      Both are recorded rather than silently repaired, because both are instances
      of failure shapes this project has already paid for.

