closes_blockers:
  - id: ST04-IR-001
    how: >-
      New RW-T43. Ownership-aware A11 model-catalog thinness: a workflow or entry
      document may point at model_routing, invoke its validator and name receipt
      fields, but may not restate three or more of the live catalog's own model
      identifiers as structured entries, nor claim the catalog schema. Identifiers
      are read from the tree under test rather than hard-coded.
    regression: M43 (a model tier table appended to a workflow stage README)
    conforming_counterexample: C07 (pointer plus receipt field names)
    premise_correction: >-
      v1 omitted this check because its design note claimed entry section 7.1
      still carried the old model tier table. That was measured on a different
      worktree; on this task branch section 7.1 is already the thin model-routing
      preflight. Re-measured on the T2 worktree this round.
  - id: ST04-IR-002
    how: >-
      RW-T08 rewritten. Only fresh and reentry are mandatory. A third mode is
      optional and unnamed by the test; if present it must declare its own window
      identity and name the window it descends from.
    regression: M08 (third mode degraded to `behaves_like: reentry` with no identity)
    conforming_counterexample: C08 (no third mode at all), C09 (third mode renamed to 分叉后继)
    note: the fixture validator was relaxed to match, or C08/C09 would have failed inside the fixture
  - id: ST04-IR-003
    how: >-
      Discovery is naming-neutral. A mechanism is recognised when its documents
      cover the role, window and handoff kinds, established either by a
      descriptive declaration in its boot manifest or registry, or by document
      content. Content evidence takes precedence over descriptive wording.
    regression: covered indirectly by every mechanism-dependent check
    conforming_counterexample: C01 (renamed schema_version plus non-committal boot purposes), C02 (renamed canonical files)
    self_inflicted_defect_found_and_fixed: >-
      The first correction attempt built the descriptive blob from all string
      values in a boot/registry entry, including `path`. The directory name
      window_role_binding then declared every one of its files to be both the
      role contract and the window contract, and 15 of 43 checks silently bound
      the wrong document. Fixed by restricting the blob to descriptive keys and
      dropping any token containing a slash.
  - id: ST04-IR-004
    how: >-
      Three independent fixes. Polarity: enabled_positions() skips keys whose own
      name carries a negation marker and treats prohibition-naming values as not
      truthy. Structure: declared_prohibitions() accepts list, mapping and
      `<field>_prohibited: true` forms. Provenance: RW-T19 scans only normative
      binding keys and excludes provenance, evidence and citation fields.
    regression: M19, M25, M26, M34, M35, M36
    conforming_counterexample: C03 (negative-polarity declarations), C04 (mapping-form prohibitions), C05 (provenance naming vendors)
    self_inflicted_defect_found_and_fixed: >-
      `preferred_provider` was initially excluded as provenance because the bare
      substring `ref` matched inside "preferred". M19 survived. `ref` is now
      matched as a whole segment. This is the same bare-substring shape T1 paid
      for in MR-T25.
  - id: ST04-IR-005
    how: >-
      stage_dependency_closure() replaces the mechanism-only staging. Starting
      from the mechanism, boot, loader and registry, it follows every
      repository-relative path appearing in staged text to a bounded fixpoint,
      pulling in a whole foreign mechanism when a dependency lands inside one.
      Zero-before / non-zero-after semantics unchanged.
    regression: M37..M42
    conforming_counterexample: >-
      The fixture validator now really reads
      01_os/03_mechanisms/model_routing/路由契约_v1.yml and asserts its authority
      constant. Measured closure size 1004 files; if model_routing were missing
      from the closure all six probes would fail at baseline.
  - id: ST04-IR-006
    how: >-
      markdown_role_table() now requires the same dual condition as the YAML
      side: three or more role concepts in the first column AND a normative
      per-role attribute in the header.
    regression: M05, M31 (`| Role | Produces |` tables)
    conforming_counterexample: C06 (`| 角色 | 推荐档位 |` applicability table)

