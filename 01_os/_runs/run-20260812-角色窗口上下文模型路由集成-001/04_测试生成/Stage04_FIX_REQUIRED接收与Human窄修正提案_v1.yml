  reason: >-
    The independent review identifies defects in the frozen acceptance definition itself: one
    Human-confirmed A11 requirement is omitted, several checks overconstrain naming or optional
    design choices, several lexical/structural checks reject conforming representations, and the
    validator-probe staging topology can reject a valid cross-mechanism composition. These are
    Stage04 test-definition defects, not Stage02/03 evidence/result invalidation.

accepted_blockers:
  - id: ST04-IR-001
    disposition: must_fix
    correction: >-
      Add an ownership-aware A11 negative check that rejects a second mutable model catalog in
      workflow or the stable entry while allowing thin pointers/invocation of model_routing.
  - id: ST04-IR-002
    disposition: must_fix
    correction: >-
      Fresh-versus-reentry remains mandatory. Do not require the exact token forked_successor.
      A successor/fork mode may be represented when implemented, but tests must judge its semantics
      only if present unless a later Human-confirmed requirement makes it mandatory.
  - id: ST04-IR-003
    disposition: must_fix
    correction: >-
      Remove exact role_contract.v/window_contract.v/handoff_contract.v token naming as the sole
      discovery mechanism. Discover semantic contract roles through a naming-neutral declared
      artifact-kind/boot/registry binding or equivalent semantic declaration, and include a
      conforming alternate-schema-name probe.
  - id: ST04-IR-004
    disposition: must_fix
    correction: >-
      Make prohibition/autonomy/quota/retention scans polarity- and structure-aware; scope provider
      independence to normative role bindings rather than provenance text; accept equivalent YAML
      list/mapping forms where A does not constrain representation. Add conforming false-positive
      probes including *_prohibited: true and *_disabled: true shapes.
  - id: ST04-IR-005
    disposition: must_fix
    correction: >-
      Run RW-T37..RW-T42 mechanism-validator probes against the full candidate tree or a complete
      boot-declared dependency closure, so valid dependencies on context_management/model_routing/
      communication_system do not make the unmutated baseline fail. Preserve zero-before/nonzero-after
      fail-closed semantics.
  - id: ST04-IR-006
    disposition: must_fix
    correction: >-
      Apply the same source-of-truth/per-role-attribute discrimination to Markdown role-table
      detection as to YAML; add a role-like model/stage applicability table that must remain conforming.

