    engine's traversal from the start. F04-A as ruled is the first step either
    way.
  what_would_change_this_assessment: >-
    If F04-A turns out to close V4-FND-04 and F02-A closes both manifestations of
    V4-FND-02 without touching predicate logic, the remaining defect surface is
    small and patching is reasonable. That is not known yet and is not assumed
    here.

