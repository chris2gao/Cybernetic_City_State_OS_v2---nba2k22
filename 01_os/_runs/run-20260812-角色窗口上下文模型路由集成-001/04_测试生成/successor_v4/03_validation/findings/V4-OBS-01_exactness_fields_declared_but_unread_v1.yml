title: >-
  Two fields in the conforming fixture read as decision-bearing declarations and
  are never consumed by any predicate.

why_recorded_separately_from_the_findings: >-
  Neither is a false pass against the requirement its predicate cites. They were
  found while probing for poisoned vocabulary, and both initially looked like
  holes. Checking the A statements is what separated them - which is the reason
  this file exists rather than two more findings: a reader should be able to see
  that the distinction was made by reading the requirement, not by judgement.

observation:
  - id: V4-OBS-01
    field: minimum_effective_context.exactness.entry_form
    also: minimum_effective_context.exactness.unbounded_subtree_entry
    predicate: P22
    requirement:
      id: A04
      statement: >-
        A deterministic minimum-context contract derives the window load set from
        task, role, stage/step and approved refs without default historical preload.
    measured:
      transformation: entry_form set to "whatever_the_loader_finds"
      observed: {P22: pass, overall: pass}
      load_entries_after: all five still exact=true
    why_it_is_not_a_false_pass: >-
      A04 requires the load set to BE exact. After the transformation every entry
      still is, judged per entry from the path itself. The predicate is reading
      facts rather than prose, which is the correct behaviour for this
      methodology.
    what_is_worth_knowing: >-
      A reader of the fixture would reasonably assume these two fields are
      enforced. They are not. A candidate could declare
      unbounded_subtree_entry: permitted and still pass, provided its actual
      entries happen to be exact. The counterexample that DOES fail is V4AB04,
      which adds a real unbounded entry.
    suggested_disposition: >-
      Either consume the fields, or say in the fixture that they are declarative
      only. Not decided here.


