likely_mechanism_not_confirmed: >-
  The transformation moves the identifiers from VALUE position into KEY position.
  Two of them - `missing_or_duplicate_window_id` and
  `missing_or_stale_route_receipt` - carry tokens that other region locators
  claim (`window`/`id`, `route`/`receipt`). A locator that walks the whole
  document by key token then sees a region that was never declared. This is
  stated as a hypothesis: it was not confirmed by reading the accepted adapters,
  because doing so was not needed to establish that the movement is the accepted
  engine's own behaviour, and confirming it would be work inside a package this
  task may not change.

the_open_question:
  statement: >-
    Is `[a, b]` -> `[{a: {}}, {b: {}}]` meaning-preserving for a list of failure
    CASE NAMES?
  case_for_yes: >-
    `normalize_keyed_collection`'s own docstring lists both forms as required to
    produce identical output, and the reviewer's S02/S04 established list-form
    equivalence as required.
  case_for_no: >-
    In this methodology, key position is declaration position. Turning a list of
    names into a set of keys with empty bodies genuinely changes the document's
    declaration surface, so it may be a different document rather than the same
    one written differently.
  ruling_needed_under: 01_os/开发入口与单窗口任务规范_v1.md section 11, stop condition 3
  who_decides: not this executor

what_this_does_not_claim:
  - no claim that the accepted package's independent acceptance was wrong
  - the accepted adapters were not read; the mechanism above is a hypothesis
  - no other container was probed with this form
  - no estimate of how many real documents would be affected

