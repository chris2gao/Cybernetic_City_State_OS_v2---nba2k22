title: >-
  Rewriting a list of bare identifiers as a list of single-entry mappings - a
  form the accepted equivalence contract admits - moves accepted P02 and v4 P24.
  The accepted engine alone moves P02 on it.

why_this_is_an_observation_and_not_a_finding_against_successor_v4: >-
  The movement is reproduced by the vendored accepted engine with
  `semantic_acceptance_v4` never imported. It is therefore a property of the
  independently accepted package, whose bytes this task may not edit
  (`no_vendored_semantic_acceptance_byte_edits`), and it is outside the
  `successor_v4/**` write boundary. Raising it as a v4 defect would attribute it
  to the wrong code. Whether it is a defect at all is a semantic question this
  executor has no authority to settle - see `the_open_question` below.

discovered_while: >-
  Verifying the 08affd retraction of V4-FND-04-a and -04-c rather than accepting
  the commit message for it. Probing the in-contract forms alongside the
  out-of-contract ones is what surfaced this; checking only the retracted claim
  would not have.

