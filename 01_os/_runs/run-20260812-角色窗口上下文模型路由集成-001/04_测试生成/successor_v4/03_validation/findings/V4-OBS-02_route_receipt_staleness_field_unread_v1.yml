title: >-
  Two fields in the conforming fixture read as decision-bearing declarations and
  are never consumed by any predicate.

why_recorded_separately_from_the_findings: >-
  Neither is a false pass against the requirement its predicate cites. They were
  found while probing for poisoned vocabulary, and both initially looked like
  holes. Checking the A statements is what separated them - which is the reason
  this file exists rather than two more findings: a reader should be able to see
  that the distinction was made by reading the requirement, not by judgement.

observation:
  - id: V4-OBS-02
    field: model_route_binding.route_receipt.missing_or_stale_or_inconsistent
    predicate: P24
    requirements:
      - id: A07
        statement: >-
          Each routed window binds an executor profile and routing receipt with
          surface/model/profile/evidence/limitations/availability and routing_only authority.
        engaged: false
        reason: A07 is about what the receipt CARRIES, not about stale-receipt behaviour.
      - id: A12
        statement: >-
          Validator/test design makes invalid role/window/context/model bindings
          and required independence violations visibly fail rather than silently
          fall back.
        engaged: possibly
        reason: >-
          "best_effort" in place of "fail_closed" is a silent fallback in
          ordinary reading, and SILENT_FALLBACK_TOKENS does not contain it. But
          whether A12 reaches a field inside the route-receipt contract, rather
          than the validator design, is a semantic question.
    measured:
      transformation: missing_or_stale_or_inconsistent set to "best_effort"
      observed: {P24: pass, P27: pass, overall: pass}
    contrast_case:
      case_id: V4PV05
      transformation: on_failure set to "log_and_proceed"
      observed: {P27: fail}
      what_it_establishes: >-
        P27 reads a POSITIVE visible-failure vocabulary, so an unknown token
        there fails closed - the correct direction. The two fields differ in
        which vocabulary shape they are judged by, not in how dangerous they are.
    suggested_disposition: >-
      A ruling on whether A12 covers this field. If it does, this becomes a
      finding rather than an observation.


next_owner:
  role: foreground_stage04_successor_dispatch
  required_action: >-
    Optional. Neither blocks the freeze. V4-OBS-02 becomes freeze-blocking if A12
    is ruled to reach the route-receipt staleness field.
