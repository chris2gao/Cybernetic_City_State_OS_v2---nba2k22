title: >-
  The v4 vocabularies were matched without reading NEGATION, so "not_X" was
  scored as "X". Depending on which list the token belongs to this produced a
  false PASS or a false FAIL.

# ---------------------------------------------------------------------------
# Reconciliation, 2026-08-16
# ---------------------------------------------------------------------------

reconciliation:
  why_this_file_changed: >-
    The implementation landed at checkpoint 08affd and this file still described
    the pre-implementation state, including a mechanism claim the implementation
    measured to be wrong. Dispatch 00009 required the durable finding to be
    brought to measured truth before any new semantic code was written. This is
    that reconciliation; it records implementation state and claims nothing about
    independent acceptance.
  corrected_mechanism_claim:
    filed_as: >-
      "the v4 vocabularies are matched by SUBSTRING without reading negation"
    measured_as: >-
      The matchers were already WHOLE-TOKEN. `_seg_tokens` calls the accepted
      `tokens()`, so ST04-V3-IR-005's "source inside resource" could not happen
      here and never was the defect. What the matchers did not read was NEGATION.
      `tokens("not_prohibited")` is ['not', 'prohibited'], the intersection with
      a rejection vocabulary is non-empty, and a document PERMITTING self-review
      was scored as rejecting it.
    why_the_distinction_matters: >-
      A substring defect and a negation-blindness defect call for different
      fixes. Leaving "substring" in the record would have sent the next reader
      to audit tokenization, which was never wrong, and away from polarity,
      which was. Both manifestations and both directions still hold exactly as
      filed; only the named mechanism was wrong.
  what_is_now_claimed: implementation_green_at_08affd
  what_is_not_claimed:
    - independent acceptance
    - that every v4 token-list matcher was proved correct rather than audited
    - that the accepted engine's own vocabularies were audited for the same shape

ruling:
  option: F02-A_WITH_CONSTRAINTS
  ruled_by: foreground-stage04-successor-dispatch-001
  ruled_at: '2026-08-15'
  ruling_ref: documents/foreground-stage04-successor-dispatch-001/00008_F02_F03_F04_blocker_rulings.yml
  decision: >-
    Route every v4 token-vocabulary polarity decision through the accepted
    engine's whole-token and negation-parity semantics. Do not patch only the two
    observed fields. A v4 helper may compose accepted tokens / negation_count /
    is_negated / path_is_negated / extract_declarations without editing vendored
    bytes.
  implemented: true
  implemented_at: 08affd036a4033960b69aff2def4a0932d8193b9
  implementation: >-
    Two helpers in `adapters_v4.py` apply the accepted V-POL-02 parity rule -
    which the engine already applies to KEY names - to VALUES by composition:
    `_vocabulary_assertion` returns asserted / inverted / absent, and
    `_enablement_with_parity` runs `classify_enablement` on the base term and
    inverts once per odd parity. Zero vendored bytes changed.
  the_correction_that_was_caught_by_regression: >-
    Parity counts MODIFYING negations only. Most rejection vocabularies OVERLAP
    the negation-token set - "prohibited" is both the term being matched and a
    negation marker - so counting every negation token read the plain word
    "prohibited" as a negation of itself and broke the conforming baseline.
    Excluding the matched terms is what makes "prohibited" asserted,
    "not_prohibited" inverted, and "never_not_prohibited" asserted again. This
    was found by the baseline regression, not by review, and is recorded because
    a fix that passes only its own new cases is the failure mode this project
    keeps paying for.

