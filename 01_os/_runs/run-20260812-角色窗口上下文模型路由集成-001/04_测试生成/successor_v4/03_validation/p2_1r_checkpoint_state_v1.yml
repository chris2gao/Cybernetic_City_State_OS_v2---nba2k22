# ---------------------------------------------------------------------------
# 1. Evidence reconciliation, done before any new semantic code
# ---------------------------------------------------------------------------

evidence_reconciliation:
  method: >-
    every claim inherited from the 08affd commit message was re-measured in this
    session rather than accepted. Two of them were confirmed, one was found
    unsupported by the corpus as it stood, and one adjacent fact was found that
    no finding recorded.
  V4-FND-02:
    was: open finding, mechanism recorded as "matched by substring"
    now: ruled_and_implemented_pending_independent_acceptance
    correction: >-
      the matchers were already whole-token; `_seg_tokens` calls the accepted
      `tokens()`. The defect was negation blindness, not substring matching. Both
      manifestations and both directions stand as filed.
    measured: nine required regressions, all green
  V4-FND-03:
    was: open finding, unruled at the time it was written
    now: ruled_and_implemented_pending_independent_acceptance
    implemented_this_round: true
  V4-FND-04:
    was: three manifestations, all recorded open
    now: a and c RETRACTED as executor test errors; b CLOSED
    correction: >-
      `state` and `case` are not COLLECTION_ID_FIELD_TOKENS, so the filed forms
      were single-entry mappings keyed literally "state" and "case" - outside the
      accepted equivalence contract. All three in-contract forms were measured to
      move no predicate.
  hole_table_disagreement_found_and_resolved:
    observed: >-
      the 08affd commit message retracted V4-FND-04-a and -04-c, but
      `corpus_v4.OPEN_INVARIANCE_HOLES` at 08affd still carried all three as open.
      Only the F02 entries had been removed. Code, findings and hole table
      disagreed about what was open.
    resolved: >-
      OPEN_INVARIANCE_HOLES is now empty and carries a comment recording which
      entries were test errors and which was a real defect; OPEN_HOLES no longer
      contains a false_pass entry; the two finding files say the same thing.
  dispatch_claim_not_reproduced_as_stated:
    claim: >-
      "the load-entry adapter's region scoping reaches into derivation_inputs"
      (08affd commit message, repeated in dispatch 00009)
    measured: >-
      NOT reproduced by the filed V4MT05 transform - load entries were unchanged
      at 5 under it. The claim is nonetheless CORRECT, and this session
      constructed the case that shows it: declaring the A-required input
      `approved_reference_set` as a structured record rather than the scalar
      `required` makes the load-set locator claim it, because
      `approved_reference_set` carries the token `set`. Recorded because the
      claim was true but had no demonstration behind it, and a claim with no
      case is one a reviewer cannot check.
    now_covered_by: INVARIANTS V4MT17

# ---------------------------------------------------------------------------
# 2. Implementation
# ---------------------------------------------------------------------------

implemented_this_round:
  F03-D_typed_determinism_fact:
    ruling: F03-D, dispatch 00008
    deleted: NONDETERMINISTIC_CONDITION_TOKENS (the closed negative vocabulary)
    added_rules: [V4-LIFE-04, V4-LIFE-06, V4-LIFE-07, V4-LIFE-08]
    slot_3_reuses: [V4-FRESH-05, V4-FRESH-06]
    fact_change: >-
      LifecycleConditionFact drops `marker` and gains `subject_resolved`,
      `observation_role`, `consequence_role`, `unresolved_slots`
    not_a_lexical_whitelist: >-
      the SUBJECT is never compared with any vocabulary. It is read verbatim from
      a declared slot position, or from the structured definition a bare string
      resolves to. That is what separates the implementation from rejected
      option F03-A.
    not_a_canonical_shape: >-
      four admitted representations are asserted invariant (V4MT11-V4MT14). That
      is what separates it from rejected option F03-B.
  F04-A_REFINED_surviving_corrections:
    root_cause_1:
      name: entity-identity normalization applied to a field mapping
      fix: adapters_v4._normalize_field_mapping
    root_cause_2:
      name: over-broad load-entry sub-region scoping
      fix: adapters_v4._subregion gained a `not_under` barrier
      why_structural_not_lexical: >-
        narrowing LOAD_SET_REGION_TOKENS would only move the collision; any token
        shared between two locators reproduces it. Terminating descent at a
        sibling declared region removes the class.

fixture_change_and_its_authority:
  file: 02_acceptance/fixtures/baseline_v4/mechanism/windows_v1.yml
  change: >-
    lifecycle.invalidation_conditions rewritten from four bare strings to four
    structured records naming subject and observation; stale_effect unchanged
  necessity: >-
    under F03-D a bare string is admitted only by resolving to an explicit
    structured definition, and baseline_v4 had none. Reading the slots out of the
    strings' own spellings is rejected option F03-A.
  authority: >-
    reported to the Human before it was made rather than absorbed silently;
    authorised in-session on 2026-08-16. The path is inside the successor_v4
    write boundary.
  accepted_baseline_untouched: true
  consequence_recorded_in:
    - test_v4_reviewer_replay.UNSATISFIED_BY_ACCEPTED_BASELINE
    - test_v4_v3_variants.FIXTURE_ROOT_ACCOUNTED_DIFFERENCES
  consequence: >-
    fixtures/baseline now fails P21 as well as P22. Both are criteria the
    accepted seven-predicate package never covered. Before F03-D its bare-string
    conditions scored deterministic because they matched no vagueness word -
    V4-FND-03's false pass, visible on the accepted fixture itself.

