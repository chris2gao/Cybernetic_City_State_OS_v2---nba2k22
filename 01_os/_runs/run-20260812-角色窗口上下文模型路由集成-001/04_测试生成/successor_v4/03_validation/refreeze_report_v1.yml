a_second_finding_the_topology_check_caught:
  what: >-
    The receipt was first written against candidate a1d376c0, then this report was added
    to the tree in the following commit. The post-publication readback rejected the
    committed receipt: `unhashed=['03_validation/refreeze_report_v1.yml']`. The receipt
    claimed the whole tree while the tree had grown by one file underneath it.
  why_it_matters: >-
    Both suites passed and the worktree was clean at every point. Nothing except the
    receipt's own topology check could see that the freeze no longer covered what it
    said it covered. This is the second time in one round that the check found something
    no other gate could.
  action: >-
    The receipt was regenerated against candidate c733726f, the commit that contains
    this report, and now covers 83 artifact entries over 27 changed paths. The receipt
    file itself lives outside the artifact root, so the commit carrying the regenerated
    receipt does not change the artifact tree and the topology claim stays true.
  recorded_because: >-
    the sequencing error was the executor's, and a freeze whose defect was found by
    readback rather than by construction is worth the reviewer knowing about.

what_changed_since_freeze_v3:
- >-
  The accepted structural-provenance capability was transferred onto the parent
  checkpoint: five files, each verified by git hash-object against its source blob.
  Four remain byte-identical to that source; structural_binding_v1.yml has since been
  extended by three foreground rulings and no longer is.
- >-
  Three foreground adjudications were applied to the evaluator-owned binding:
  FG-T2-COMPLETION-BLK-001-R1, -002-R2 and -003-R3. Every one of them was returned to
  the foreground as a question rather than chosen by the executor.
- >-
  P2-2 items 1 to 5 were built: adapter applicability negatives, receipt tamper battery,
  the combined decision-provenance audit, the requirement trace and the test inventory.
- >-
  The decision provenance ledger was corrected from 76 rules to 128. The v4 half's 52
  rules - the ones deciding P21 to P27 - had never been in it.

