a_finding_the_topology_check_caught:
  what: >-
    The first freeze attempt failed with `full_candidate_tree hash scope does not equal
    the artifact tree`, naming 34 .pyc files under four __pycache__ directories.
  why_it_matters: >-
    `git status --porcelain -uall` reported a clean worktree throughout, because those
    files are ignored. Git-clean and tree-clean are not the same property, and only the
    topology check could see the difference. A freeze receipt written without that check
    would have declared a tree it did not cover.
  action: the untracked bytecode caches were removed; none was tracked; the receipt was regenerated and validates.

still_open_and_carried_into_review:
  freeze_blocking_findings_not_independently_accepted:
  - V4-FND-01
  - V4-FND-02
  - V4-FND-03
  - V4-FND-04
  note: >-
    All four carry blocks_freeze true. Per V4-FND-01's own text, that flag stays true
    until a reviewer who did not write the fix has read the primary evidence, and fresh
    independent acceptance AFTER freeze remains mandatory. They are disclosed here and
    named for the reviewer to re-attack, which is what freeze_receipt_v3 did with its own
    open items. Freezing is not accepting.
  observations_awaiting_foreground_ruling: [V4-OBS-01, V4-OBS-02, V4-OBS-03]
  interaction_the_reviewer_should_see_first: >-
    V4-FND-01 is freeze-blocking specifically because the package's central safety claim
    is that the vendored engine is untouched and that claim rests on byte-identity alone.
    This task modified structural_binding_v1.yml inside that vendored package under
    foreground ruling. The byte-identity half of that claim now has a documented,
    adjudicated exception, and the reviewer should have it up front.
  independence_waiver: >-
    The narrow independent correction-003 review was waived by current Human decision
    D-T2-COMPLETION-002. No reviewer artifact exists. The foreground that issued rulings
    R1 to R3 also performed the review the acceptance rests on, so author and verifier of
    those rulings are the same endpoint. Disclosed per entry spec section 9.

external_closure:
  complete: false
  reason: >-
    The receipt's own bytes cannot be observed in Git before the commit that contains
    them, so this validation supplied base and candidate SHAs but no ObservedExecution.
    A post-publication verification against the committed blob is recorded separately.
  checked_bindings: [base_sha, candidate_sha]

