# ---------------------------------------------------------------------------
# Correction to this executor's own earlier report
# ---------------------------------------------------------------------------

corrections_to_earlier_executor_claims:
  - id: V4-COR-01
    earlier_claim: >-
      The write_prefix field in dispatch messages 00002 and 00003 is mojibake and points at
      a path that does not exist.
    status: withdrawn_incorrect
    evidence: >-
      git cat-file blob on both message blobs returns
      \xe8\xa7\x92\xe8\x89\xb2 ... for the run directory segment, which is well-formed UTF-8
      for 角色窗口上下文模型路由集成-001/04_测试生成/. The same bytes fail to decode as GBK.
      The blobs were always correct.
    actual_cause: >-
      This executor piped git stdout through PowerShell without setting
      [Console]::OutputEncoding, so git's UTF-8 output was decoded using the host ANSI code
      page and re-encoded. The corruption was produced by the reading pipeline, not present
      in the repository.
    work_affected: none
    reason_work_unaffected: >-
      The path actually used was derived from the successor_v4_only write boundary, which is
      the same path the field always held. No file was written to a wrong location.
    rule_reinforced: >-
      AGENT_WORKING_DISCIPLINE.md#3 — verify against the real bytes before reporting a
      contradiction. A rendering artifact reported as a dispatch defect is a false finding,
      and a false finding costs a reader the same as a missed one.

  - id: V4-COR-02
    earlier_claim: none
    status: self_reported_construction_defect
    what_happened: >-
      The first draft of this checkpoint file was itself invalid strict YAML. A plain scalar
      began with a backtick, and three others embedded the sequence ": " inside a plain
      scalar. Both are the exact failure mode of ST04-V3-IR-001, the blocking finding that
      the v3 freeze receipt was not machine-consumable.
    caught_by: >-
      The pre-commit gate in this run strict-parses every YAML file it is about to stage and
      refuses to stage on failure. It refused, so the defect never entered a commit.
    significance: >-
      Worth recording rather than quietly fixing. The finding that ended v3 was not an
      unusual mistake; it is what happens whenever a receipt is authored as prose and never
      parsed. The gate, not the author's care, is what prevented the repeat.

