why_this_refreeze_exists: >-
  The previous frozen candidate 4ce3e09e was independently reviewed at
  5f4520dd123ba634b1082f3ac7dbb6284a79849c and returned FIX_REQUIRED with four
  reproducible counterexamples. That candidate and that review are historical
  evidence and are untouched: nothing here relabels them, and no history was
  rewritten. This is a forward successor.

what_the_review_proved_about_the_previous_round: >-
  The inherited suites were 65/65 and 57/57 with observed exit code 0, the exact-Git
  receipt and provenance closure passed, and all four material defects were still
  there. Executor greenness was necessary and not sufficient, exactly as the previous
  result pointer said it might not be. That is the finding worth carrying forward.

work_performed_or_requested: >-
  Close all four independently established findings, persist a direct regression for
  each, apply the foreground R6 structural ruling, regenerate the derived evidence and
  refreeze one successor candidate.

implementation_or_review_method: >-
  Each finding was reproduced first against the unmutated tree, then corrected at the
  mechanism rather than at the reported string, then re-measured. The four cases are
  now persisted test functions rather than a transcript, because a finding that exists
  only in a transcript cannot be re-run by the next round.

findings_closed:
- id: T2-PARENT-IR-001
  was: >-
    `failure_states` rewritten to the admitted `[{X: {}}]` form moved P24 pass -> fail,
    because a RouteReceiptFact was sourced from a failure-case instance identity.
  correction: >-
    v4 claim sites now come from bound_nodes / bound_leaves filtered to
    structurally_claimable, which is what that traversal's own contract requires and
    what the accepted adapters already did. The whole family was converted - preload
    positions, freshness binding, route/window binding, family requirements, mechanism
    separation and fallback positions - not only the reported witness.
  now: the same mutation moves no predicate at all, asserted over the whole vector
- id: T2-PARENT-IR-002
  was: >-
    `missing_or_stale_or_inconsistent: best_effort` left all fourteen predicates passing;
    the candidate declared the policy and nothing read it.
  correction: >-
    the policy is a typed fact on RouteReceiptFact and is decision-bearing for A12 in
    P27. It resolves through the accepted freshness-effect roles, so parity applies.
  now: best_effort, absent and not_fail_closed are each non-pass; no spelling is blacklisted
- id: T2-PARENT-IR-003
  was: >-
    `not_stale`, `not_changed` and `not_fail_closed` each normalized to the positive
    role, so an inverted declaration passed.
  correction: >-
    _role_of and _effect_role resolve through _vocabulary_assertion; an INVERTED
    assertion returns unmapped and never the positive role. _observation_role and
    _consequence_role delegate to _effect_role, so these two functions are every v4
    polarity decision site.
  now: each inverted declaration is non-pass, and the resolvers are asserted directly
- id: T2-PARENT-IR-004
  was: >-
    any non-empty subject slot counted as resolved, so
    `whatever_the_operator_feels_has_drifted_enough` was deterministic.
  correction: >-
    a subject must name a position the candidate itself declares, verified structurally
    against the document. Subject slots are excluded from the set they would otherwise
    vouch for themselves with. No subject vocabulary exists; the question asked is only
    whether the named position is there.
  fixture_consequence: >-
    baseline_v4's four subjects were semantic labels that resolved to nothing, so they
    now name real declared positions. Foreground adjudication 00005 anticipated exactly
    this and authorised it.
  now: the subjective subject is non-pass and a real declared position passes

