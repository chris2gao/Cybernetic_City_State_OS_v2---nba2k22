one_addition_beyond_the_ruling_and_why_it_is_not_a_new_choice:
  what: window_contract_v1 gained a container rule for [context_binding] as declaration_name
  why_it_was_needed: >-
    with claim sites correctly gated, `context_binding.dependency_fingerprints` fell to
    `unknown` and P23 lost the binding leaf it reads.
  why_it_is_derived: >-
    `context_binding` is a contract-owned field block with fixed slots and no
    author-chosen entries - the same shape as `model_route_binding`, which the same
    profile already rules declaration_name. The rule is by direct analogy with the
    entry immediately below it, not a new structural judgement. Reported here rather
    than absorbed silently.

