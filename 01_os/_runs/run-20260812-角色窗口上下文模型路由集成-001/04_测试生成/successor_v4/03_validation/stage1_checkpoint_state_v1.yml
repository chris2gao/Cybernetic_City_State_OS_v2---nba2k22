V4_FND_01:
  finding_ref: 03_validation/findings/V4-FND-01_shared_registry_false_fail_v1.yml
  class: shared_registry_false_fail
  summary: >-
    Importing semantic_acceptance_v4 registers P21..P27 into the shared REGISTRY,
    so semantic_acceptance.evaluate.evaluate_tree calls them too - against a
    FactSet that build_fact_set never augmented. The v4 predicates read absent
    fact lists as empty, applied "absence is never a pass", and returned FAIL on
    a fully conforming tree.
  measured_before_fix:
    tree: 02_acceptance/fixtures/baseline_v4
    evaluate_full: {predicates: 14, overall: pass, failing: []}
    evaluate_tree: {predicates: 14, overall: fail, failing: [P21, P22, P23, P24, P25, P27]}
  resolution:
    option: R-A
    ruled_by: Human
    ruled_at: '2026-08-15'
    change: >-
      predicates_v4.v4_predicate wraps the accepted predicate decorator and
      returns UNSUPPORTED when the FactSet lacks the v4 fact attributes.
    why_it_is_fail_closed: >-
      UNSUPPORTED is already the accepted contract's third outcome (V-FACT-08),
      and evaluate.overall already treats it as not-pass. No new status was
      introduced and no vendored file was edited.
    vendored_engine_bytes_changed: 0
    vendored_engine_evidence: git diff HEAD -- '*/semantic_acceptance/*' is empty
  measured_after_fix:
    tree: 02_acceptance/fixtures/baseline_v4
    evaluate_tree: {predicates: 14, overall: unsupported_or_ambiguous_representation}
    accepted_seven_under_evaluate_tree: all pass
    evaluate_full: {predicates: 14, overall: pass, failing: []}
  guard_tests:
    - test_v4_reviewer_replay.test_FND01_unaugmented_factset_is_unsupported_not_fail
    - test_v4_reviewer_replay.test_FND01_accepted_seven_are_unaffected_by_the_guard
    - test_v4_reviewer_replay.test_FND01_augmented_factset_still_judges_normally
  discovery_context: >-
    Found because the replay's accepted-engine control could not be built
    in-process. The control was a defective test and was repaired by moving it to
    a subprocess; the reason it failed was a property of the package, so the
    property was reported rather than the test quietly fixed.

