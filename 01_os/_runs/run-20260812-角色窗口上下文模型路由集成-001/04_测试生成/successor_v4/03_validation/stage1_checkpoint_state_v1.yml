defects_this_session_found_and_closed:
  - id: S1-DEF-01
    symptom: >-
      _bootstrap_v4.ls_tree returned an empty list with exit code 0 for every
      historical revision.
    cause: >-
      git ls-tree defaults its pathspec to the current directory prefix. Run from
      inside successor_v4/ - a path absent from those revisions - it succeeded and
      matched nothing.
    fix: --full-tree, with the reason recorded in the function docstring.
    significance: >-
      An empty result from a zero exit code is the worst available failure shape:
      a caller checking only the return code reads "nothing matched" as
      "nothing exists".
  - id: S1-DEF-02
    symptom: >-
      predicates_v4.py was rewritten with CRLF line endings while every other file
      in the tree is LF.
    cause: the editing tool used by this executor, not the repository configuration
    fix: normalised to LF; a CRLF check is now part of the checkpoint gate
    significance: >-
      The repository declares `* text=auto eol=lf`, so Git would have normalised it
      on commit and the diff would have looked clean. But the freeze receipt binds
      candidate bytes, and a CRLF working copy hashes to a value no Git blob
      equals - which is exactly what the任务包 invariant
      receipt_candidate_bytes_are_bound_from_physical_Git_blobs exists to prevent.

