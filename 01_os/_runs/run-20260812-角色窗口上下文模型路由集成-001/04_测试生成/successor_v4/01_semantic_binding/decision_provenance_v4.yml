- rule_id: V4-LIFE-03
  kind: vocabulary
  authority: A03/R03_window_lifecycle
  interpretation: Token set that identifies the region of a document declaring a window lifecycle. Deliberately narrow. An earlier draft also matched the bare token `states`, which claimed `failure_states` as a lifecycle and reported a lifecycle covering one role. A region locator that over-claims produces confident wrong facts, so the states collection is reached as a SUB-region of a lifecycle node instead.
  accepted_alternatives:
  - match the lifecycle node, then descend to its states collection
  rejected_alternatives:
