- rule_id: V-AUTH-01
  kind: vocabulary
  authority: A13/R13_no_authority_escalation
  interpretation: 'Keys that CONFER authority: a permission set, a capability set, or an act declared authorised. Distinguished from keys that merely speak ABOUT authority (authority_effect, authority_boundary, authority_limit), which are descriptive scope statements and grant nothing. Closes S23 (permissions.master_write_authorized.state=granted) and S24 (capabilities.publish_master=true); removes the S14/i08 false positive where `authority_limit` was read as a grant.'
  accepted_alternatives: []
  rejected_alternatives:
  - 'treating every key containing ''authority'' as a grant position: it made `authority_effect: none` and `authority_boundary` grant candidates and produced the S14/S18/S20 false positives'
  value:
