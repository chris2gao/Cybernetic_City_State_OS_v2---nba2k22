  authority: A10/R10_existing_mechanism_separation
  interpretation: 'A collection is two or more entries. This is the definition of a collection, not a tolerance: it mirrors CATALOG_MIN_ENTRIES in the accepted engine, which replaced the untraced CATALOG_RESTATEMENT_THRESHOLD = 3 that AB-02 named. A single referenced value is a reference; two or more owned entries is a copied table.'
