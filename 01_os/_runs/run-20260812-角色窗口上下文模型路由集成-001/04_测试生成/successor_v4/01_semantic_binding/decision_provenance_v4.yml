    - complete
    - completed
    - done
    - ended
    - finished
    - terminated
    create_or_enter:
    - create
    - created
    - creation
    - enter
    - entered
    - entry
    - init
    - initialise
    - initialised
    - initialize
    - initialized
    - open
    - opened
    - start
    - started
    handoff_ready:
    - deliverable
    - handoff
    - handoffready
    - handover
    - ready
    stale_or_invalidated:
    - expire
    - expired
    - invalid
    - invalidated
    - invalidation
    - obsolete
    - stale
    - superseded
    - void
    - voided
