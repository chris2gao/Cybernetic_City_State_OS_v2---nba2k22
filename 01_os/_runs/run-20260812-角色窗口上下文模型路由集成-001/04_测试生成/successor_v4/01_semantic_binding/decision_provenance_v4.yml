- rule_id: V4-LIFE-01
  kind: mapping
  authority: A03/R03_window_lifecycle
  interpretation: A R03 requires at least create/enter, active, handoff-ready, closed and stale-or-invalidated states. The state SET is A-required; the exact spellings are not (requirement_traceability_v1.yml b_only_inventory). This maps declared state identifiers onto the five A-required roles by token, so a package may spell them however it likes.
  accepted_alternatives:
  - match the five roles by token synonym
  rejected_alternatives:
  - require the exact lifecycle state spellings used by B05
  - require exactly five states and reject any additional project state
