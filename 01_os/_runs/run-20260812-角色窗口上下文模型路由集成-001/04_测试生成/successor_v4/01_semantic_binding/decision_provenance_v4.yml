- rule_id: V4-LIFE-07
  kind: mapping
  authority: A03/R03_window_lifecycle
  interpretation: 'Synonym map onto the normalized observation roles a machine can evaluate. This is a synonym map, not a completeness mechanism: an unrecognised observation does not fall through to deterministic, it produces UNSUPPORTED. That inversion is the whole of F03-D, and it is what distinguishes this rule from rejected option F03-A, where an unrecognised subject fell through to a pass.'
  accepted_alternatives:
  - any spelling that maps onto one of these three observation roles
  rejected_alternatives:
  - treat an unrecognised observation as deterministic
  - treat presence of a subject keyword as proof of a machine-observable comparison
  value:
    absent_or_invalid:
