  kind: mapping
  authority: A07/R07_model_route_binding
  interpretation: 'Structural position in which a receipt enumerates its own required field names as VALUES rather than as keys. `route_receipt: {authority: routing_only}` and `route_receipt: {required_fields: [authority]}` both declare that the receipt carries an authority concept. Reading only the key form made a conforming list-form receipt report one concept out of five, which is the ST04-V3-IR-003 defect in a new place.'
