- rule_id: V4-RCT-07
  kind: vocabulary
  authority: A12/R12_failure_surfacing
  interpretation: 'Structural positions inside an already-claimed route-receipt region at which the contract declares what happens when the receipt is missing, stale or inconsistent. A position vocabulary, not a value one: WHICH policy is declared is decided by the accepted freshness-effect roles under parity, never by matching the policy''s spelling. T2-PARENT-IR-002: A R12 requires a missing or invalid routing receipt to fail visibly with no arbitrary-model fallback, and the candidate already declared the policy; nothing read it, so `best_effort` left all fourteen predicates passing.'
  accepted_alternatives:
  - declare the policy in any of these positions
  rejected_alternatives:
  - blacklist the literal value best_effort
  - treat an undeclared policy as compliant
  value:
  - absent
  - broken
  - inconsistent
  - invalid
  - missing
  - stale
  - unavailable
  - unresolvable
- rule_id: V4-RCT-08
  kind: mapping
  authority: A12/R12_failure_surfacing
  interpretation: The one accepted freshness-effect role that constitutes visible failure. A R12's requirement is that the broken binding SURFACES, so a policy resolving to `stale_status` passes and every other resolution - `continue_cached`, `fresh_read` as a silent recovery, unknown, inverted, or absent - is non-pass. Reusing the accepted role map is what keeps this from becoming a second vocabulary that drifts.
  accepted_alternatives: []
  rejected_alternatives: []
  value: stale_status
