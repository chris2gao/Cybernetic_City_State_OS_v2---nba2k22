known_limitations:
  - statement: >-
      47/47 kills and 14/14 conforming passes are not a completeness claim.
      artifact_version 1 reported 42/42 and was overturned on six findings;
      artifact_version 2 reported 43/43 plus 9/9 and was overturned on six more.
  - statement: >-
      Four of the six v2 findings were false positives, which no mutation can
      expose, and two were false negatives, which no conforming variant can
      expose. Both sample classes have now been extended, but the extension came
      from an external reviewer both times. This author has not yet demonstrated
      the ability to find its own representation blind spots.
  - statement: >-
      New representation boundaries may still exist. The corrections above were
      each derived from a shape someone else thought of first.
  - statement: >-
      The `retry` exit remains declared in the seven-stage step contract while the
      separately authorized canonical change makes it unreachable by budget. That
      residue belongs to the other commit and is reported there, not fixed here.

