closes_blockers:
  - id: ST04-V2-IR-001
    finding: RW-T25 rejected the requested `*_disabled: true` prohibition shape
    how: >-
      declared_prohibitions() now strips the whole negation-suffix family
      (prohibited/forbidden/disallowed/disabled/banned/excluded/blocked/denied)
      through a shared strip_ban_suffix(), and the carried-private-reasoning check
      no longer counts a key that is itself the prohibition declaration. The
      candidate validator accepts list, mapping and suffix forms natively, so the
      conforming variant needs no validator patch.
    conforming_regression: C10
    violating_regression: M46
  - id: ST04-V2-IR-002
    finding: RW-T08/RW-T09 froze entry_modes as a mapping of mappings
    how: >-
      _modes_from_list() normalises a list of mode records carrying any of
      mode_id/entry_mode/mode/id/name/kind into the same shape a mapping gives.
      Only fresh-versus-reentry separability and exact-predecessor semantics are
      judged. The candidate validator normalises identically.
    conforming_regression: C11
    violating_regression: M08, M09
  - id: ST04-V2-IR-003
    finding: RW-T19 missed a normative provider pin expressed as a mapping key
    how: >-
      The scan is now subtree-based. Once a path segment selects a
      provider/model/family/surface/vendor/engine/executor/route, every key name
      and scalar below it belongs to that selection, so
      `preferred_provider: {openai: true}` is caught exactly as the scalar form is.
      Provenance exclusion is applied per path segment and only to provenance
      subtrees.
    conforming_regression: C05
    violating_regression: M44
  - id: ST04-V2-IR-004
    finding: a YAML role/stage/context applicability matrix was read as a second role source
    how: >-
      ROLE_SOURCE_CONCEPTS is separated from the wider ROLE_ATTR_CONCEPTS and used
      for source-of-truth detection in both YAML and Markdown. Bare `scope` and
      bare `context` are removed: `stage_scope` plus `context_hint` says where a
      role applies, not what it is. Three or more entries must each declare two
      genuine ownership properties.
    conforming_regression: C12
    violating_regression: M47, M05, M31
  - id: ST04-V2-IR-005
    finding: RW-T43 missed a second mutable catalog in Markdown definition-list form
    how: >-
      structured_entry_lines() recognises definition-list terms (a term line whose
      next non-empty line begins with `:`), in addition to table rows, list items
      and `key:` lines. The pointer/receipt allowlist is unchanged, and live model
      identifiers are still read from the tree under test.
    conforming_regression: C13
    violating_regression: M45
  - id: ST04-V2-IR-006
    finding: the validator dependency closure was history-heavy and not closed
    how: >-
      The crawler is deleted, not improved. stage_dependency_closure(),
      probe_mech_validator() and REPO_PATH_RX are removed from the harness (103
      lines) and the six probes call probe_full_tree(), which runs the mechanism's
      declared validator against the full candidate tree. One writable copy is made
      per tree under test and shared by all six probes; the mechanism surface is
      snapshotted before each injection and restored after, so the probes remain
      independent without copying the tree six times.
    conforming_regression: C14
    violating_regression: M37..M42
    measured: >-
      Deleting the crawler also made the run faster, not slower: the full selftest
      dropped from 844.7 s at artifact_version 2 to 470.8 s here, on a larger
      sample set.

