      v25 includes typed Native observation and season/game/history/market
      containers, source atomic units and query-as-of/read paths suitable
      as candidates for a common save-local database structure.
    evidence_refs: [E-02-009, E-02-014, E-02-018]
    level: CODE_SUPPORTED_WITH_OLDER_DEVELOPER_LEDGER
  - claim: >-
      Current bounded REA live investigation reported correct source metadata
      and six valid raw Overall cache float32 observations, making a
      provenance-preserving conditional read design plausible.
    evidence_refs: [E-02-022]
    level: HUMAN_SUPPLIED_DELEGATED_CODEX_REPORT_NOT_INDEPENDENTLY_VERIFIED
