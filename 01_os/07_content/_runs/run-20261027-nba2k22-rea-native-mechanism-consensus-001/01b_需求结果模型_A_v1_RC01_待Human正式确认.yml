    p0_exit_gate_candidate: >-
      Q3=A: three representative mechanism dossiers with traceable source
      evidence at their available verified level, clear specific negative
      or bounded unknown explanations where full execution cannot be
      observed, and a trade-native validator/commit callability verdict
      of FEASIBLE/INFEASIBLE/BOUNDED_UNKNOWN. Q4=A one badge deep with
      second comparison only; Q5=A one coach setting deep with other
      side light; Q6=B coach native call is first PoC candidate, trade
      only secondary if independently safe and authorized. Keep raw
      evidence, timeouts, contradictory observations, side-effects,
      fallback system architectures and remaining research roadmap.
      Any PoC not run is declared NOT_EXECUTED and not L4. The P0
      research is eligible for Human acceptance and resumption of
      the paused world-data Stage02 only after independent evidence
      limitations and residual risk are visible, not automatically
      upon Codex self-report.
    bounded_result_rules:
      representative_badge_selection:
        choose_by: most_observable_real_MyLEAGUE_UI_native_event_and_negative_boundary_in_the_test_build
        full_case_count: 1
        second_case: light_contrast_lead_not_required_to_reach_same_depth
        badge_threshold_rule: only_claim_numeric_threshold_when_game_native_branch_or_real_original_table_and_boundary_prove_it
        fallback_when_no_upgrade_event: report_data_layout_and_branch_hypothesis_with_inaccessible_event_reasons_never_invent_upgrade
      coach_mechanism_selection:
        choose_by: one_of_offense_or_defense_with_observable_setting_and_original_consumption_path
        full_case_count: 1
        opposite_side: bounded_comparison_not_second_full_trace
        evidence_states: [UI_DISPLAY, NATIVE_PERSISTED, CONSUMER_CODE_SEEN, GAME_APPLIED_OBSERVED]
        disallow: UI_PERSISTED_AUTO_EQUALS_GAME_APPLIED
      conditional_PoC:
        order: [COACH_SETTING_FIRST, TRADE_SECOND_ONLY_IF_PROVEN_AND_SEPARATELY_AUTHORIZED]
