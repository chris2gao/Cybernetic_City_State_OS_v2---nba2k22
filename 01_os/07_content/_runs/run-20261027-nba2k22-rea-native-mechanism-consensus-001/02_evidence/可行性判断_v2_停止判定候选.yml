bearing_statement: >-
  The existing REA Windows/Frida research has already obtained selected
  NBA2K22 live type definitions and can preserve fixed evidence. Owned
  fixture read/write and hook observations provide bounded tool tests.
  Together with legacy badge, coach and trade research, this supports
  the feasibility of a bounded three-mechanism discovery program and
  a provenance-aware Mechanism Atlas. It does NOT establish that one
  MyLEAGUE badge's natural upgrade rule is understood, that a coach
  tactical setting is consumed in game, that native trade commit is safely
  callable, or that any effectful game PoC has been performed.
supported_parts:
  - claim: A can use a reproducible source catalog and field/function research plan rather than a global unbounded EXE disassembly.
    evidence_refs: [E-REA02-101, E-REA02-102, E-REA02-104, E-REA02-105, E-REA02-108]
    scope: STATIC_AND_REPORTED_BOUNDED_GAME_METADATA_SUPPORT
  - claim: Native source type-definition retrieval in selected actual game metadata has occurred, including FRANCHISE-related fields.
    evidence_refs: [E-REA02-104, E-REA02-105]
    scope: L1_FIELD_LAYOUT_ON_OBSERVED_TYPES_NOT_INSTANCE_OR_FUNCTION_CONSUMER
  - claim: The practical toolchain can be tested in isolated owned-process memory and native ABI call observation without game side effects.
    evidence_refs: [E-REA02-106, E-REA02-107]
    scope: NON_GAME_4096_WRITE_RESTORE_AND_16_TRACE_EVENTS
  - claim: Existing project research gives usable badge, coaching and trade source leads while keeping original/nextgen/player guide distinctions explicit.
    evidence_refs: [E-REA02-109, E-REA02-110, E-REA02-111, E-REA02-112]
    scope: HISTORIC_GUIDE_OR_ENGINEERING_REFERENCE_NOT_NEW_RUNTIME_VALIDATION
refuted_or_limited_parts:
  - claim: Badge gameplay-effect tuning or CAREERMODE badge points prove exact MyLEAGUE natural upgrade attribute thresholds.
    evidence_refs: [E-REA02-104, E-REA02-105, E-REA02-109]
    consequence: >-
      False as evidence equivalence. Require same-mode instance, actual
      input predicate, consumer branch and a negative control or a
      bounded UNKNOWN.
  - claim: A coach field written/read by the previous memory executor proves it has been changed through the game's own setter or applied by in-game AI.
    evidence_refs: [E-REA02-110]
    consequence: >-
      Distinguish native stored field from setter/consumer and applied state.
      Coach-first call PoC is still only a conditional future research goal.
  - claim: Original project roster/trade menu studies or the owned ABI fixture show native trade commit can be called safely.
    evidence_refs: [E-REA02-107, E-REA02-111, E-REA02-112]
    consequence: >-
      Need original validator, commit dispatch, thread/this, legality and
      complete side-effects; otherwise retain existing external path
      without silently replacing the approved architecture.
  - claim: Whole game Ghidra static analysis is a proven cost-effective required method.
    evidence_refs: [E-REA02-108]
    consequence: >-
      Four bounded whole-exe attempts reported timeout; prefer exact
      targeted metadata, registered static source/callsite and small
      real-time observations. Reopen only with a new hypothesis and budget.
  - claim: Source files in multiple project documents establish independent native proof.
    evidence_refs: [E-REA02-101, E-REA02-102, E-REA02-110]
    consequence: >-
      Codex handoff, findings and raw evidence share one first-hand origin;
      project manuals may cite the same initial community guide, so
      source-count inflation is prohibited.
