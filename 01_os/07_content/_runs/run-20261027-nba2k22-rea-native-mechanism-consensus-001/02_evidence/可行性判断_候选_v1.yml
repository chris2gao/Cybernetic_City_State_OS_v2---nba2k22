stop_decision:
  stop: false
  basis:
    - >-
        More static exploration in the same project sources now has low EIG
        for unknown actual runtime function consumers and trade commit.
        Stage02 can preserve a partial feasibility draft and a bounded
        B0 research schema, but Human gate remains open.
    - >-
        No independent same-mode runtime evidence has yet closed the
        core badge, applied tactic and trade validator/commit unknowns.
        These should be handled by a future separately approved Codex
        technical investigation, not guessed from guide numbers.
    - >-
        A conditional PoC's not-executed state is an honest outcome when
        no safely evidenced callable function or Human authorization
        exists; it cannot be promoted to L4.
  residual_risk: >-
    Native code might have a field defined but not actively used in PC22
    offline MyLEAGUE, require an inaccessible game manager/selector,
    depend on hidden thread state, or lack a safe external transaction
    commit path. Exact attributes, signatures, thresholds and game
    effect are not known.
