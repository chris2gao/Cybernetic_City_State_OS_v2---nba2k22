  not_sufficient: absence_of_AI_trace_in_a_single_static_probe
rejected_transitions:
- transition: L1 -> L3/L4 without intermediate game-specific proof
  failure_code: UNSUPPORTED_MATURITY_PROMOTION
- transition: fixture traced event -> game original function verified
  failure_code: FIXTURE_TO_GAME_CONFLATION
- transition: stored coaching config -> applied game tactic
  failure_code: PERSISTENCE_IS_NOT_APPLICATION
- transition: badge effect constants -> natural badge upgrade threshold
  failure_code: WRONG_MECHANISM
- transition: MyCAREER or next-generation MyNBA -> PC22 MyLEAGUE game fact
  failure_code: GAME_MODE_PLATFORM_SCOPE_MISMATCH
- transition: partial roster state change -> complete trade commit
  failure_code: INCOMPLETE_TRANSACTION
- transition: authorized requirement or stage transition -> runtime permission
  failure_code: MISSING_ACTION_AUTHORIZATION
- transition: unknown -> proven negative without bounded reason
  failure_code: ABSENCE_OF_EVIDENCE_AS_REFUTATION
- transition: same-source archived evidence -> two independent first-hand game confirmations
  failure_code: SHARED_ORIGIN_DOUBLE_COUNT
- transition: no actual test -> PoC success
  failure_code: FALSE_POC_SUCCESS
- transition: human trader dialog or player confirmation -> AI_AI native trade proof
  failure_code: HUMAN_UI_PATH_AS_AI_TRANSACTION
- transition: MyCAREER human badge point rule -> MyLEAGUE AI badge growth
  failure_code: HUMAN_BADGE_PATH_AS_AI_GROWTH
- transition: manual coach UI edit -> AI coach selection or game AI consumer
  failure_code: HUMAN_GAMEPLAN_UI_AS_AI_COACH_FUNCTION
- transition: shared function -> AI execution without proven AI caller
  failure_code: SHARED_KERNEL_NO_AI_CALLSITE
- transition: external AI-model role -> game internal AI flag without verifying game controller state
  failure_code: UNPROVEN_AI_CONTROLLER_CONTEXT
- transition: native function not callable -> arbitrary unverified memory patch
  failure_code: UNVERIFIED_FALLBACK_WRITE
- transition: field modified -> correct original game decision or full behavior
  failure_code: FIELD_WRITE_AS_GAMEPLAY_PROOF
- transition: agent receives reverse engineering address -> direct free-form process memory operation
  failure_code: UNGUARDED_LLM_NATIVE_MEMORY_CONTROL
- transition: documented claim without evidence -> agent guideline states verified game rule
  failure_code: UNSOURCED_AGENT_MECHANISM_KNOWLEDGE
- transition: native backend result and memory backend result not semantically equivalent -> both marked interchangeable
  failure_code: BACKEND_SEMANTIC_CONTRACT_MISMATCH
invariants:
- id: INV-01
  assertion: Any game-mechanic factual claim has source ID, first-hand or archived origin, build/mode scope and evidence
    maturity.
  on_violation: UNSUPPORTED_CLAIM
- id: INV-02
  assertion: Product requirement approval, technical qualification, action authorization, run receipt and independent
    acceptance are distinct states.
  on_violation: AUTHORITY_CONFLATION
- id: INV-03
  assertion: Missing safe PoC conditions yield NOT_EXECUTED, never PASS; bounded unknown can fulfill an honest research
    report only with documented attempts and Human acceptance.
  on_violation: FALSE_SUCCESS
- id: INV-04
  assertion: M1 one deep badge/one light comparison and M2 one deep coach offense or defense setting/other side light;
    M3 original trade validator and commit remain in scope.
  on_violation: HUMAN_SCOPE_DRIFT
- id: INV-05
  assertion: Before claiming a complete original game trade, roster, contract, finance, pick and game-event impact must
    be traced or each missing part explicitly identified.
  on_violation: PARTIAL_TRANSACTION_CLAIM
- id: INV-06
  assertion: No future path may silently replace Human-approved external trading/signing/draft design without separate
    change approval.
  on_violation: SILENT_ARCHITECTURE_CHANGE
- id: INV-07
  assertion: Old Codex 52-source manifest is archival; independent confirmation of all 52 checks or same-mode engine
    behavior must not be inferred.
  on_violation: EVIDENCE_PROVENANCE_INFLATION
- id: INV-08
  assertion: P0 exit and resumption of paused world-data Stage02 require distinct Human acceptance after real evidence
    work.
  on_violation: PREMATURE_P0_EXIT
- id: INV-09
  assertion: Only actual AI actor or AI-to-AI flows qualify as target native mechanism; Human input/confirmation/editing functions are excluded as execution pathways.
  on_violation: ACTOR_SCOPE_DRIFT
- id: INV-10
  assertion: AI player entity is distinct from a human controller. A function shared with Human UI must have a proven AI callsite before selection.
  on_violation: CONTROLLER_ROLE_OR_SHARED_KERNEL_CONFLATION
- id: INV-11
  assertion: MyCAREER AI-NPC badge growth equivalence to PC22 MyLEAGUE AI player growth is a Human-reported hypothesis, not a verified identical algorithm.
  on_violation: UNSUPPORTED_CROSS_MODE_AI_EQUIVALENCE
- id: INV-12
  assertion: A MyLEAGUE game save's Human-controlled-team engine flag is not overwritten simply because an external GM AI model represents that team.
  on_violation: UNSANCTIONED_GAME_CONTROLLER_CHANGE
- id: INV-13
  assertion: Every useful reversed AI mechanism delivers both a human/model-readable original game rule explanation and evidence with applicability, not only raw addresses or assembly.
  on_violation: RAW_RE_ONLY_NO_AGENT_KNOWLEDGE
- id: INV-14
  assertion: When a safe qualified native AI function exists, choose it ahead of live memory editing; unqualified functions cannot be invoked on priority alone.
  on_violation: NATIVE_PRIORITY_WITHOUT_SAFETY
- id: INV-15
  assertion: Live-memory fallback is only eligible if field semantics, game constraints, dependent state changes, cache and fresh verification are proven for that current build and action.
  on_violation: BLIND_MEMORY_FALLBACK
- id: INV-16
  assertion: Native and memory implementations of one domain action share identical expected business effects and postconditions and both respect precise action authorization.
  on_violation: DIFFERENT_BUSINESS_SEMANTICS_BY_BACKEND
- id: INV-17
  assertion: Without a proven safe native or memory path the action is blocked, not reported as completed; knowledge remains valuable independently of actionability.
  on_violation: FALSE_EXECUTION_AND_KNOWLEDGE_CONFLATION
- id: INV-18
  assertion: Agent guides reveal only role-approved knowledge and typed actions. Internal native data exposed during reverse engineering is not automatically available to ordinary AI roles.
  on_violation: ROLE_INFORMATION_LEAK
