canonical_result_shape:
  identity: [task_id, mechanism_id, game_build_sha, mode, AI_actor_control, evidence_snapshot_revision]
  output_set:
    - mechanism_atlas_index
    - selected_AI_badge_knowledge_dossier_with_light_control
    - selected_AI_coach_knowledge_dossier_with_light_control
    - AI_AI_trade_validation_and_commit_dossier
    - conditional_coach_first_native_call_test_dossier_or_NOT_EXECUTED
    - decision_and_backend_qualification_matrix
    - pinned_evidence_manifest_and_review
  reusable_contracts:
    KnowledgeCard:
      keys: [mechanism_id, AI_actor_scope, original_game_rule, source_confidence, native_field_meanings, update_triggers, game_effects, examples, not_applicable_or_unknown, role_visibility]
      content_criterion: >
        A role model can distinguish the supported game rule, unverified
        hypothesis, applicable AI actors and whether it may only reason,
        recommend or submit a typed action. Native RVA dumps alone fail.
      accepted_readiness: [EVIDENCED, BOUNDED_UNKNOWN_DOCUMENTED, NOT_APPLICABLE_WITH_SUPPORT]
      unacceptable: [UNSOURCED_NUMERIC_THRESHOLD, CROSS_MODE_MIGRATION_AS_FACT, SECRET_FIELD_TO_ROLE_WITHOUT_PERMISSION]
    FieldSemantics:
      keys: [field_id, source_type_or_pointer_lifetime, owning_AI_entity, real_unit_and_enum_domain, read_path, legal_write_scope, consumer_and_refresh, dependent_states, reversible_test_or_safe_abort, original_evidence]
      constraint: game_semantics_may_be_known_even_when_write_path_is_NOT_QUALIFIED
    DomainActionIntent:
      keys: [action_type, initiator_AI, counterparty_AI_or_NONE, game_mode, save_and_scene, target_object_ids, typed_arguments, business_preconditions, expected_affected_set, expected_postconditions, Human_permission_ref]
      rule: typed_intent_must_not_expose_raw_RVA_or_memory_address_to_external_role_agents
    BackendProof:
      native:
        requires: [AI_callsite, signature_ABI, this_and_object_lifetime, right_thread_and_engine_state, legality_or_business_rules, affected_state_completeness, failure_behavior, action_authorization_if_executed]
      memory:
        requires: [real_field_id_and_value_domain, ownership_and_write_window, original_rule_meaning, game_consumer_and_refresh, consistency_updates_and_staleness, game_build_specific_read_write_test, fresh_readback, action_authorization_if_executed]
      never_claim: fixture_games_are_equivalent_or_stale_save_values_prove_live_effect
    ResultReceipt:
      keys: [intent_ref, backend_selected, reason, before_snapshot, actual_call_or_write_status, new_native_snapshot, UI_or_game_behavioral_check_if_applicable, affected_set_comparison, complete_or_block_reason, provenance]
      invariant: NO_CALL_OR_WRITE_IMPLIES_NOT_EXECUTED_NOT_PASS
    KnowledgeDistribution:
      roles: [GM, COACH, PLAYER]
      visibility_states: [PUBLIC_ROLE_APPROVED, INTERNAL_NATIVE_RESEARCH_ONLY, NOT_YET_VERIFIED]
      rule: original_native_hidden_fields_are_not_automatically_distributed_to_ordinary_personas
  no_production_service_in_P0: true

