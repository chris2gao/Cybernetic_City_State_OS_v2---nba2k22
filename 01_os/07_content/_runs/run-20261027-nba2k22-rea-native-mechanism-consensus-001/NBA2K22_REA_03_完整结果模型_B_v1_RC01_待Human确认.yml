  requires: [PC22_AI_mechanism_provenance, original_game_field_or_function_context, conditions_and_effect_evidence]
  not_sufficient: project_guide_numeric_assertion
- from: MECHANISM_EXPLANATION_EVIDENCED
  to: ROLE_GUIDE_QUALIFIED_TO_SCOPE
  requires: [source_links, game_mode_and_build, permitted_role_visibility, conditions_and_uncertainty, illustrative_AI_decision_rationale]
  not_sufficient: raw_decompiler_dump_without_semantic_explanation
- from: UNASSESSED
  to: NATIVE_AI_FUNCTION_QUALIFIED
  requires: [AI_callsite, function_signature, ABI_this_thread_context, complete_business_effect, failure_guards]
  not_sufficient: function_address_or_fixture_Hook
- from: UNASSESSED
  to: MEMORY_WRITE_SEMANTICALLY_QUALIFIED
  requires: [native_field_identity, real_game_semantic_value_domain, original_mechanism_effect, dependencies_and_cache, validated_write_and_fresh_readback_in_current_scope]
  not_sufficient: prior_memory_writer_exists_or_field_value_changes
- from: NATIVE_AI_FUNCTION_QUALIFIED
  to: VERIFIED_NATIVE_FUNCTION
  requires: [exact_action_authorization, current_game_build_and_AI_actor_context, independently_tested_game_result]
  not_sufficient: research_model_permission_or_static_callgraph
- from: MEMORY_WRITE_SEMANTICALLY_QUALIFIED
  to: VALIDATED_MEMORY_WRITE
  requires: [native_not_selected_for_supported_reason, exact_action_authorization, value_and_scope_guards, fresh_poststate_consistency]
  not_sufficient: generic_Fraida_memory_write_or_no_known_function
- from: NEITHER_PATH_SAFE
