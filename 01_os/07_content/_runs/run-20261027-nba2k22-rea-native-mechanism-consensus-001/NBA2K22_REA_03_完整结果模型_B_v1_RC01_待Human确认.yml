B_success_relation: >-
  B outcome is a bounded, evidence-linked study of AI-controlled actors
  and AI-to-AI interaction mechanisms actually used by PC22 offline MyLEAGUE,
  using one AI player's badge progression, one AI coach/team strategy effect,
  one AI-GM-to-AI-GM transaction validation/commit route, and a conditional
  coach-AI-first native call PoC. Human-controlled menu handlers are excluded
  from mechanism execution targets, but can serve as clearly tagged read-only
  observation aids; no native AI mechanism or unsafe call is presumed proven.
long_term_product_goal_vs_P0_scope:
  final_product_goal: >
    Reverse engineer the game AI mechanisms to create reliable, permission-
    filtered knowledge usable by external GM/Coach/Player reasoning and
    action planning; choose a native game-function backend when safely
    proven, or a semantically validated live-memory writing backend when
    native callability is absent, without changing the game behavior contract.
  P0_approved_research_exit: >
    One deep AI badge-growth case, one deep AI coach strategy case,
    one AI-to-AI GM trade validator/commit research case, with conditional
    coach-first safe native call PoC and honest unknown/negative outcomes.
    Full game encyclopedia and all production backend integrations are
    long-term follow-up work, not hidden new P0 completion requirements.
  rule: Game mechanic knowledge and actionable intent must exist
    independently of which backend is available.
