      Produce a bounded, evidence-based REA Native Mechanism Atlas and
      three representative NBA2K22 offline MyLEAGUE mechanism dossiers
      (badge thresholds/upgrade trigger, coach offense-defense strategy
      settings, trade validation/commit state path), plus conditional
      representative game-native function-call PoC specification and
      evidence when separately authorized and technically feasible,
      with an explicit safe-integration feasibility verdict for future
      GM/Coach/Player external decision systems.
