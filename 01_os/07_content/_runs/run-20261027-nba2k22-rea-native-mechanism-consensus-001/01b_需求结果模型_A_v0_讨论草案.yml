      Q2_A: BADGE_COACH_TRADE_REPRESENTATIVES_WITH_OPTIONAL_SIGNING_CONTROL
      Q3_A: THREE_BOUNDED_EVIDENCE_DOSSIERS_AND_FUNCTION_REUSE_VERDICT_SUFFICIENT_TO_REQUEST_TASK_EXIT
      parent_world_data_stage02: PAUSED_NOT_ASSESSED
      game_scope: PC_NBA2K22_OFFLINE_MYLEAGUE
      owner: CODEX_ONLY_FOR_GAME_NATIVE_ENGINEERING_GPT_FOR_PLANNING
    non_goals:
