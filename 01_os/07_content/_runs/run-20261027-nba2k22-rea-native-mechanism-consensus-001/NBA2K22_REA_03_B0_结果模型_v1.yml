  - FeasibilityGrades
  - PriorApprovedExecutionPath
  - HumanChangeRequest_if_needed
  boundary: The same evidence/source is referenced, not duplicated as independently observed.
state_dimensions:
  proof_level:
  - UNASSESSED
  - L0_GUIDE_HYPOTHESIS
  - L1_NATIVE_TYPE_OR_INSTANCE
  - L2_STATIC_FUNCTION_BRANCH
  - L3_SAME_MODE_GAME_BEHAVIOR
  - L4_AUTHORIZED_CALL_WITH_FRESH_READBACK
  - L5_PRODUCTION_ACCEPTED_OUT_OF_SCOPE
  research_disposition:
  - OPEN
  - SUPPORTED_TO_SCOPE
  - REFUTED_TO_SCOPE
  - BOUNDED_UNKNOWN
  - NOT_APPLICABLE_TO_THIS_BUILD
  game_applicability:
  - UNKNOWN
  - PC22_OFFLINE_MYLEAGUE_PROVEN
  - OTHER_MODE_ONLY
  - OTHER_PLATFORM_ONLY
  callability:
  - NOT_EVALUATED
  - FUNCTION_CANDIDATE_ONLY
  - CONTEXT_MISSING
  - PRECONDITIONS_QUALIFIED_FOR_FUTURE_TEST
  - INFEASIBLE_TO_SCOPE
  - BOUNDED_UNKNOWN
  - TESTED_WITH_RECEIPT
  authorization:
  - NONE
  - PROPOSED
  - EXACT_HUMAN_APPROVED_FOR_SPECIFIC_ACTION
  - DENIED
  - EXPIRED
  execution:
  - NOT_EXECUTED
  - STARTED
  - ABORTED
  - COMPLETED_REPORTED
  verification:
  - NOT_PERFORMED
  - RAW_SOURCE_PRESENT
  - FRESH_NATIVE_COMPARISON_PRESENT
  - AFFECTED_SET_CONSISTENT
  - MISMATCH_OR_INCOMPLETE
  independent_review:
  - PENDING
  - PARTIAL_LIMITED_REVIEW
  - ACCEPTED_TO_SCOPE
  - REJECTED
  P0_task_outcome:
  - DESIGN_IN_PROGRESS
  - ENGINEERING_EVIDENCE_PENDING
  - RESEARCH_EVIDENCE_COMPLETE_PENDING_HUMAN
  - HUMAN_ACCEPTED_P0_EXIT
allowed_transitions:
- from: L0_GUIDE_HYPOTHESIS
  to: L1_NATIVE_TYPE_OR_INSTANCE
  requires:
  - same_build_source
  - mode_tag
  - original evidence
  not_sufficient:
  - guide_repeated_in_another_project_document
- from: L1_NATIVE_TYPE_OR_INSTANCE
  to: L2_STATIC_FUNCTION_BRANCH
  requires:
  - original code/reference link
  - function identity
  - scoped branch evidence
  not_sufficient:
  - field name resembles game rule
- from: L2_STATIC_FUNCTION_BRANCH
  to: L3_SAME_MODE_GAME_BEHAVIOR
  requires:
  - same-mode game scene
  - game state observations
  - consumer or behavioral corroboration
  not_sufficient:
  - static xref alone
- from: PRECONDITIONS_QUALIFIED_FOR_FUTURE_TEST
  to: TESTED_WITH_RECEIPT
  requires:
  - exact Human approval
  - separate Codex test permission
  - effect-specific fresh game readback
  not_sufficient:
  - approved A-v1 or stage02 result
- from: STARTED
  to: ABORTED
  requires:
  - failure or stop trigger
  - retained reason and source
  not_sufficient: []
- from: COMPLETED_REPORTED
  to: AFFECTED_SET_CONSISTENT
  requires:
  - new data observation
  - applicable affected-entity invariants checked
  not_sufficient:
  - call return value only
- from: RESEARCH_EVIDENCE_COMPLETE_PENDING_HUMAN
  to: HUMAN_ACCEPTED_P0_EXIT
  requires:
  - all three scoped dossiers with honest dispositions
  - architecture matrix
  - evidence archive
  - Human explicit P0 exit judgment
  not_sufficient:
  - the Codex runner reports done
rejected_transitions:
- transition: L1 -> L3/L4 without intermediate game-specific proof
  failure_code: UNSUPPORTED_MATURITY_PROMOTION
- transition: fixture traced event -> game original function verified
  failure_code: FIXTURE_TO_GAME_CONFLATION
- transition: stored coaching config -> applied game tactic
  failure_code: PERSISTENCE_IS_NOT_APPLICATION
- transition: badge effect constants -> natural badge upgrade threshold
  failure_code: WRONG_MECHANISM
- transition: MyCAREER or next-generation MyNBA -> PC22 MyLEAGUE game fact
  failure_code: GAME_MODE_PLATFORM_SCOPE_MISMATCH
- transition: partial roster state change -> complete trade commit
  failure_code: INCOMPLETE_TRANSACTION
- transition: authorized requirement or stage transition -> runtime permission
  failure_code: MISSING_ACTION_AUTHORIZATION
- transition: unknown -> proven negative without bounded reason
  failure_code: ABSENCE_OF_EVIDENCE_AS_REFUTATION
- transition: same-source archived evidence -> two independent first-hand game confirmations
  failure_code: SHARED_ORIGIN_DOUBLE_COUNT
- transition: no actual test -> PoC success
  failure_code: FALSE_POC_SUCCESS
invariants:
- id: INV-01
  assertion: Any game-mechanic factual claim has source ID, first-hand or archived origin, build/mode scope and evidence
    maturity.
  on_violation: UNSUPPORTED_CLAIM
- id: INV-02
  assertion: Product requirement approval, technical qualification, action authorization, run receipt and independent
    acceptance are distinct states.
  on_violation: AUTHORITY_CONFLATION
- id: INV-03
  assertion: Missing safe PoC conditions yield NOT_EXECUTED, never PASS; bounded unknown can fulfill an honest research
    report only with documented attempts and Human acceptance.
  on_violation: FALSE_SUCCESS
- id: INV-04
  assertion: M1 one deep badge/one light comparison and M2 one deep coach offense or defense setting/other side light;
    M3 original trade validator and commit remain in scope.
  on_violation: HUMAN_SCOPE_DRIFT
- id: INV-05
  assertion: Before claiming a complete original game trade, roster, contract, finance, pick and game-event impact must
    be traced or each missing part explicitly identified.
  on_violation: PARTIAL_TRANSACTION_CLAIM
- id: INV-06
  assertion: No future path may silently replace Human-approved external trading/signing/draft design without separate
    change approval.
  on_violation: SILENT_ARCHITECTURE_CHANGE
- id: INV-07
  assertion: Old Codex 52-source manifest is archival; independent confirmation of all 52 checks or same-mode engine
    behavior must not be inferred.
  on_violation: EVIDENCE_PROVENANCE_INFLATION
- id: INV-08
  assertion: P0 exit and resumption of paused world-data Stage02 require distinct Human acceptance after real evidence
    work.
  on_violation: PREMATURE_P0_EXIT
five_deferred_gaps:
  GAP-REA02-01:
    on_future_evidence: M1 real badge upgrade logic and predicate or bounded negative
    not_blocking_current_B_draft: true
  GAP-REA02-02:
    on_future_evidence: M2 actual game tactic consumer and applied state
    not_blocking_current_B_draft: true
  GAP-REA02-03:
    on_future_evidence: M3 validator/commit and cross-entity update
    not_blocking_current_B_draft: true
  GAP-REA02-04:
    on_future_evidence: qualified native call plus explicit Human test approval if feasible
    not_blocking_current_B_draft: true
  GAP-REA02-05:
    on_future_evidence: independent game-mode-specific verification or recorded limitation
    not_blocking_current_B_draft: true
