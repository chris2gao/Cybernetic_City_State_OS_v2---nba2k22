- stable_id
- type
- game_build
- platform
- game_mode
- mechanism_id
- source_claim_ids
- original_evidence_ids
- source_origin_group
- proof_level
- research_disposition
- scoped_counterexamples
- unresolved_gaps
- last_verified_at_or_unknown
