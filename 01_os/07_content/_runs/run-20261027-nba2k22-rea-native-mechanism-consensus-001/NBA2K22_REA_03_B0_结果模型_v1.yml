B_success_relation: B outcome is a bounded, evidence-linked study of three representative PC22 offline MyLEAGUE mechanisms,
  with a conditional coach-first PoC receipt or explicit nonexecution and an architecture decision input. It does not
  assert every unknown game mechanic is proven.
