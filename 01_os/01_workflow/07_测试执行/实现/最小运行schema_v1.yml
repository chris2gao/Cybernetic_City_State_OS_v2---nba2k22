schema_version: citystate.workflow.stage_artifact_schema.v1
artifact_schema_version: 1
common_required_fields:
- schema_version
- run_id
- stage_id
- artifact_kind
- artifact_version
- status
- input_refs
- deliberation_receipt
- payload
common_rules:
- status_must_equal_complete
- artifact_version_must_be_positive_integer
- input_refs_must_bind_required_predecessor_sha256
- deliberation_receipt_must_bind_stage_profile
- dormant_receipt_must_not_create_session
- full_or_incremental_receipt_requires_task_gate_and_Human_authorization_ref
stage_id: workflow_stage_07_test_execution
artifact_kind: verification_package
artifact_filename: 07_verification.yml
required_predecessors:
- workflow_stage_03_result_modeling
- workflow_stage_04_test_generation
- workflow_stage_06_execution
payload_required_fields:
- reviewer_role
- verdict
- test_results
- implementation_claims
- upstream_invalidation
- completion
stage_specific_rules:
- reviewer_role_must_differ_from_executor_role
- all_required_tests_must_pass
- completion_must_be_true
- verdict_must_be_accepted
