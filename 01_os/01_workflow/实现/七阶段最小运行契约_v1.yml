schema_version: citystate.workflow.minimum_operational_loop.v1
workflow_id: citystate_seven_stage_minimum_operational_loop
workflow_version: 1
status: minimum_operational
semantic_boundary:
  deterministic_control_plane:
  - stage_order
  - typed_artifact_presence
  - version_and_hash_binding
  - deliberation_receipt_validation
  - frozen_test_integrity
  - execution_write_allowlist
  - retry_and_invalidation
  - independent_verification
  - completion
  model_or_Human_judgment:
  - requirement_semantics
  - evidence_quality
  - result_reasoning
  - test_adequacy
  - step_design
  - implementation_content
  - review_judgment
  runner_must_not_claim_to_generate_semantic_answers: true
mechanism_bindings:
  context_management:
    boot_manifest: 01_os/02_boot/context_management/启动清单_v1.yml
    validator: 01_os/03_mechanisms/context_management/实现/verify_context_structure.py
  stage_collaborative_deliberation:
    activation_state: 01_os/03_mechanisms/stage_collaborative_deliberation/激活状态_v1.yml
    runtime_guard: 01_os/03_mechanisms/stage_collaborative_deliberation/实现/verify_no_canonical_live_state.py
    validator: 01_os/03_mechanisms/stage_collaborative_deliberation/实现/verify_stage_collaborative_deliberation_v2.py
    required_activation_state: active_dormant
    default_route: dormant
run_roots:
  shared_os_development: 01_os/_runs/<run-id>/
  domain_workflow: 01_os/07_content/_runs/<run-id>/
  private_runtime_suffix: _runtime/
  canonical_live_state: prohibited
artifact_common_required_fields:
- stage_control
- schema_version
- run_id
- stage_id
- artifact_kind
- artifact_version
- status
- input_refs
- deliberation_receipt
- payload

stage_control_contract:
  purpose: >-
    the exact bindings a stage artifact must carry so that composition and publication
    verification are possible. It holds references, never content.
  fields:
    action_id: the id of the packet stage_actions entry this stage acts under
    current_model_ref: {path, blob_sha}
    plan_acceptance: {commit, path, blob_sha, accepted_model_commit, accepted_model_path, accepted_model_blob_sha}
    completion_acceptance: {path, blob_sha, bound_output_version, output_path, output_blob_sha, verification_result}
  reference_not_copy: true
  deliberately_absent:
    a_second_receipt_reference: >-
      deliberation_receipt is already a required field of this artifact. A parallel ref would
      create two locations for one object. A receipt short of the mechanism's required fields is
      a content gap for its author to fill, not a reason for a second field.
    predecessor_binding: >-
      stages two through seven bind the previous stage's completion acceptance inside the plan
      acceptance artifact itself, where the blob hash covers it. A summary field here could be
      edited without disturbing the record it summarises.
    proof_vocabulary: >-
      the node names, ancestry, phase separation and transition rules used to verify a published
      history belong to the runner and the publication gate. They are not stage semantics and do
      not appear in these schemas.
stage_order:
- stage_id: workflow_stage_01_requirement_modeling
  artifact_kind: requirement_package
  artifact_filename: 01_requirement.yml
  schema_path: 01_os/01_workflow/01_需求建模/实现/最小运行schema_v1.yml
  required_predecessors: []
- stage_id: workflow_stage_02_information_collection
  artifact_kind: evidence_package
  artifact_filename: 02_evidence.yml
  schema_path: 01_os/01_workflow/02_信息收集与提炼/实现/最小运行schema_v1.yml
  required_predecessors:
  - workflow_stage_01_requirement_modeling
- stage_id: workflow_stage_03_result_modeling
  artifact_kind: result_package
  artifact_filename: 03_result.yml
  schema_path: 01_os/01_workflow/03_结果建模/实现/最小运行schema_v1.yml
  required_predecessors:
  - workflow_stage_01_requirement_modeling
  - workflow_stage_02_information_collection
- stage_id: workflow_stage_04_test_generation
  artifact_kind: frozen_test_package
  artifact_filename: 04_tests.yml
  schema_path: 01_os/01_workflow/04_测试生成/实现/最小运行schema_v1.yml
  required_predecessors:
  - workflow_stage_01_requirement_modeling
  - workflow_stage_02_information_collection
  - workflow_stage_03_result_modeling
- stage_id: workflow_stage_05_step_decomposition
  artifact_kind: step_package
  artifact_filename: 05_steps.yml
  schema_path: 01_os/01_workflow/05_步骤拆分/实现/最小运行schema_v1.yml
  required_predecessors:
  - workflow_stage_04_test_generation
- stage_id: workflow_stage_06_execution
  artifact_kind: execution_package
  artifact_filename: 06_execution.yml
  schema_path: 01_os/01_workflow/06_执行/实现/最小运行schema_v1.yml
  required_predecessors:
  - workflow_stage_04_test_generation
  - workflow_stage_05_step_decomposition
- stage_id: workflow_stage_07_test_execution
  artifact_kind: verification_package
  artifact_filename: 07_verification.yml
  schema_path: 01_os/01_workflow/07_测试执行/实现/最小运行schema_v1.yml
  required_predecessors:
  - workflow_stage_03_result_modeling
  - workflow_stage_04_test_generation
  - workflow_stage_06_execution
completion:
  run_identity_must_state: final_stage_completion_commit
  final_stage_completion_commit:
    where: the run's run.yml
    shape: a 40-character commit sha
    why_here_and_not_a_pointer_file: >-
      which record is current is only a question when several accumulate, and 08_結論 accumulates
      pointer versions. A path at a commit resolves to exactly one blob, so this field has no
      currency question to answer and needs no supersession rule. It is never inferred from a
      version suffix, a timestamp, directory enumeration or history search.
    artifact_identity_comes_from: >-
      stage seven's own stage_control.completion_acceptance path and blob_sha. This field supplies
      only which commit carries it.
  final_stage: workflow_stage_07_test_execution
  required_final_verdicts:
  - PASS
  - PASS_WITH_NON_BLOCKING_NOTES
  all_stage_status: complete
  canonical_live_state_absent: true
exit_codes:
  0: pass
  20: missing_static_path
  21: malformed_static_contract
  22: mechanism_binding_failure
  23: workflow_contract_failure
  24: boot_or_registry_failure
  30: missing_run_artifact
  31: artifact_hash_mismatch
  32: stage_order_or_input_reference_failure
  33: artifact_schema_failure
  34: deliberation_receipt_failure
  35: frozen_test_integrity_failure
  36: execution_allowlist_failure
  37: retry_or_invalidation_failure
  38: independent_verification_failure
  39: completion_failure
  40: prohibited_output_root
