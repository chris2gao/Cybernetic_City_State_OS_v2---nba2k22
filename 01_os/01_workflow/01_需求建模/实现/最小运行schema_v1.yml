schema_version: citystate.workflow.stage_artifact_schema.v1
artifact_schema_version: 1
common_required_fields:
- stage_control
- schema_version
- run_id
- stage_id
- artifact_kind
- artifact_version
- status
- input_refs
- deliberation_receipt
- payload
common_rules:
- status_must_equal_complete
- artifact_version_must_be_positive_integer
- input_refs_must_bind_required_predecessor_sha256
- deliberation_receipt_must_bind_stage_profile
- dormant_receipt_must_not_create_session
- full_or_incremental_receipt_requires_task_gate_and_Human_authorization_ref
- stage_control_must_carry_exact_refs_only
stage_id: workflow_stage_01_requirement_modeling
artifact_kind: requirement_package
artifact_filename: 01_requirement.yml
required_predecessors: []
payload_required_fields:
- requirement_id
- objective
- success_criteria
- constraints
- consensus_A0
- consensus_Human_confirmation
- requirement_result_A
- Human_confirmation
stage_specific_rules:
- consensus_A0_and_requirement_result_A_have_distinct_model_id_and_versioned_content
- two_distinct_Human_confirmations_bind_exact_model_kind_id_version_and_content_sha256
- requirement_result_A_binds_confirmed_consensus_A0
- nonempty_result_items_map_all_success_criteria_and_unknown_evidence_questions
- exact_coverage_agrees_with_result_item_criterion_and_question_links
- structural_binding_does_not_authenticate_Human_or_prove_semantic_sufficiency
