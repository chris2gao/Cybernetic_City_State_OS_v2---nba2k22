policy_version: "human_ai.communication_material_event_policy.v3"
validator_version: "3.0.0"

# source_mailbox_base_head is only the neutral-mailbox comparison baseline.
# protocol_release_head is bound in the second, binding-only release commit.
source_mailbox_base_head: "d235e602c14250d16b91f2897cb8308e031cc13c"
protocol_release_head: "8d0c698d67ecc7aa54b0f7cdbf818bbd06dcb993"
release_binding_status: "bound"

wire_schemas:
  chatgpt_to_codex_v1:
    core_keys:
      - signal_id
      - decision
      - task_ref
      - packet_ref
      - brief_ref
      - source_head
      - human_gate
    optional_tail_keys: []
  codex_to_chatgpt_v1:
    core_keys:
      - packet_id
      - status
      - report_ref
      - brief_ref
      - source_head
      - review_branch_head
      - human_gate
    optional_tail_keys:
      - detail_ref

role_mapping:
  Human:
    occupied_role: human_speaker
    wire_schema: null
    direct_dispatch_wire_schema: chatgpt_to_codex_v1
  ChatGPT:
    occupied_role: foreground_review_and_task_dispatch
    wire_schema: chatgpt_to_codex_v1
  Claude:
    occupied_role: foreground_review_and_task_dispatch
    wire_schema: chatgpt_to_codex_v1
  Codex:
    occupied_role: backend_execution_and_handoff
    wire_schema: codex_to_chatgpt_v1
  Claude Code:
    occupied_role: backend_execution_and_handoff
    wire_schema: codex_to_chatgpt_v1

event_classes:
  C0:
    event_types:
      - ordinary_discussion
      - teaching
      - brainstorming
      - non_state_changing_chat
  C1:
    event_types:
      - backend_dispatch
      - material_review
      - completion_handoff
      - correction_handoff
      - blocked_report
      - conflict_report
      - risk_report
      - significant_acceptance
      - human_gate_report
  C2:
    event_types:
      - source_publication
      - master_publication
      - merge
      - rebase
      - runtime_activation
      - coordinator_activation
      - communication_gateway_activation
      - ui_middleware_activation
      - polling_activation
      - cron_activation
      - unattended_automation_activation
      - destructive_operation
      - secrets_sensitive_action
      - objective_change
      - engine_routing_change

unknown_event_policy: fail_closed
bootstrap_required_loaded_files:
  - "06_Silicon_Index/AI_Bootstrap_Sequence.md"
  - "AGENTS.md"
  - ".ai/HANDOFF_INIT_PROMPT.md"
  - ".ai/PROTOCOL.md"
  - ".ai/PROTOCOL_ADHERENCE.md"
  - ".ai/HANDOFF_COMMON_CONVENTIONS.md"
  - ".ai/AUTONOMOUS_HANDOFF_COMMUNICATION_v0.1.md"
bootstrap_on_demand_requirements:
  foreground_review_and_task_dispatch:
    - ".ai/CODEX_TASK_INPUT_CONTRACT.md"
  backend_execution_and_handoff:
    - ".ai/CODEX_WORK_MECHANISM_PROTOCOL.md"
    - ".ai/CODEX_TASK_INPUT_CONTRACT.md"
dispatch_event_types:
  - backend_dispatch
material_event_classes:
  - C1
  - C2

human_response_preflight_fields:
  - factual_status_grounded
  - required_refs_dereferenced
  - canonical_pointer_present_when_applicable
  - execution_recommendation_present_when_dispatching
  - independent_expression_present_for_material_event
  - independent_expression_separated_from_authority
  - no_long_task_or_report_echo
  - no_hidden_chain_of_thought_request_or_disclosure

execution_recommendation_fields:
  - recommended_model
  - recommended_thinking_level
  - mode
  - subagents
  - task_ref_or_plan_ref
  - short_complexity_rationale
  - human_gate

expression_policy:
  heading: "Independent expression"
  minimum_sentences: 2
  maximum_sentences: 5
  generic_warning_phrases:
    - looks good
    - great work
    - everything is fine
    - approved without reservation

reference_policy:
  production_kinds:
    - git_blob
  test_only_kinds:
    - test_fixture_blob
  require_full_commit_sha: true
  require_commit_object: true
  reject_symlinks: true
  reject_submodules: true
  reject_trees: true
  reject_mutable_refs: true

state_evidence:
  review_branch: ai/review/latest
  state_path: .ai/STATE.yml
  aliases:
    neutral_baseline: closed
    idle: closed
    accepted_closed: closed
    completed: closed
    awaiting_codex: backend_assigned
    authorized_awaiting_codex_execution: backend_assigned
    awaiting_chatgpt_review: foreground_review_pending
    awaiting_chatgpt_exact_head_review: foreground_review_pending
    complete_awaiting_chatgpt_review: foreground_review_pending
    complete_awaiting_chatgpt_semantic_review: foreground_review_pending
    accepted_awaiting_human_publication_gate: human_gate_pending
    awaiting_human_gate: human_gate_pending
    publication_authorized_in_progress: publication_in_progress
    complete_published_and_post_verified: published_pending_ack
    blocked: blocked
    blocked_awaiting_human_authority: blocked

transitions:
  dispatch_to_backend:
    allowed_actor_roles:
      - human_speaker
      - foreground_review_and_task_dispatch
    from_states:
      - closed
    to_state: backend_assigned
    to_status: awaiting_codex
    event_types:
      - backend_dispatch
    required_event_class: C1
    external_human_authority_required: false
  backend_completion:
    allowed_actor_roles:
      - backend_execution_and_handoff
    from_states:
      - backend_assigned
      - publication_in_progress
    to_state: foreground_review_pending
    to_status: awaiting_chatgpt_review
    event_types:
      - completion_handoff
      - correction_handoff
      - blocked_report
      - conflict_report
    required_event_class: C1
    external_human_authority_required: false
  foreground_revision_dispatch:
    allowed_actor_roles:
      - human_speaker
      - foreground_review_and_task_dispatch
    from_states:
      - foreground_review_pending
    to_state: backend_assigned
    to_status: awaiting_codex
    event_types:
      - backend_dispatch
      - correction_handoff
    required_event_class: C1
    external_human_authority_required: false
  foreground_acceptance:
    allowed_actor_roles:
      - human_speaker
      - foreground_review_and_task_dispatch
    from_states:
      - foreground_review_pending
      - published_pending_ack
    to_state: closed
    to_status: completed
    event_types:
      - significant_acceptance
      - material_review
    required_event_class: C1
    external_human_authority_required: false
  publication_candidate:
    allowed_actor_roles:
      - human_speaker
      - foreground_review_and_task_dispatch
    from_states:
      - foreground_review_pending
    to_state: human_gate_pending
    to_status: awaiting_human_gate
    event_types:
      - significant_acceptance
      - material_review
    required_event_class: C1
    external_human_authority_required: false
  protected_publication_entry:
    allowed_actor_roles:
      - human_speaker
      - foreground_review_and_task_dispatch
    from_states:
      - human_gate_pending
    to_state: publication_in_progress
    to_status: publication_authorized_in_progress
    event_types:
      - source_publication
      - master_publication
      - merge
    required_event_class: C2
    external_human_authority_required: true

protected_actions:
  - source_publication
  - master_publication
  - merge
  - rebase
  - runtime_activation
  - coordinator_activation
  - communication_gateway_activation
  - ui_middleware_activation
  - polling_activation
  - cron_activation
  - unattended_automation_activation
  - destructive_operation
  - secrets_sensitive_action
  - objective_change
  - engine_routing_change

drift_policy:
  recurrence_threshold: 2
  fixture_requirement: "matching_immutable_negative_fixture_or_deterministic_impossibility_with_foreground_review"
  migration_anchor:
    kind: git_blob
    commit: "4530b4f684f64cc7928884cf96d9a221aa5a2b8a"
    path: .ai/COMMUNICATION_DRIFT_LEDGER.yml
    content_sha256: "549be021da2313309055872c7cf95153be5ea8a4b5662ea7e4721745e5d0dc76"
  contains_private_reasoning: false
  contains_secret_content: false
