policy_version: "human_ai.communication_material_event_policy.v1"
validator_version: "1.0.0"
protocol_head: "d235e602c14250d16b91f2897cb8308e031cc13c"

wire_schemas:
  chatgpt_to_codex_v1:
    core_keys:
      - signal_id
      - decision
      - task_ref
      - packet_ref
      - brief_ref
      - source_head
      - human_gate
    optional_tail_keys: []
  codex_to_chatgpt_v1:
    core_keys:
      - packet_id
      - status
      - report_ref
      - brief_ref
      - source_head
      - review_branch_head
      - human_gate
    optional_tail_keys:
      - detail_ref

role_mapping:
  Human:
    occupied_role: human_speaker
    wire_schema: null
  ChatGPT:
    occupied_role: foreground_review_and_task_dispatch
    wire_schema: chatgpt_to_codex_v1
  Claude:
    occupied_role: foreground_review_and_task_dispatch
    wire_schema: chatgpt_to_codex_v1
  Codex:
    occupied_role: backend_execution_and_handoff
    wire_schema: codex_to_chatgpt_v1
  Claude Code:
    occupied_role: backend_execution_and_handoff
    wire_schema: codex_to_chatgpt_v1

event_classes:
  C0:
    event_types:
      - ordinary_discussion
      - teaching
      - brainstorming
      - non_state_changing_chat
  C1:
    event_types:
      - backend_dispatch
      - material_review
      - completion_handoff
      - correction_handoff
      - blocked_report
      - conflict_report
      - risk_report
      - significant_acceptance
      - human_gate_report
  C2:
    event_types:
      - source_publication
      - master_publication
      - merge
      - rebase
      - runtime_activation
      - coordinator_activation
      - communication_gateway_activation
      - ui_middleware_activation
      - polling_activation
      - cron_activation
      - unattended_automation_activation
      - destructive_operation
      - secrets_sensitive_action
      - objective_change
      - engine_routing_change

unknown_event_policy: fail_closed
bootstrap_required_loaded_files:
  - "06_Silicon_Index/AI_Bootstrap_Sequence.md"
  - "AGENTS.md"
  - ".ai/HANDOFF_INIT_PROMPT.md"
  - ".ai/PROTOCOL.md"
  - ".ai/PROTOCOL_ADHERENCE.md"
  - ".ai/HANDOFF_COMMON_CONVENTIONS.md"
  - ".ai/AUTONOMOUS_HANDOFF_COMMUNICATION_v0.1.md"
bootstrap_on_demand_requirements:
  foreground_review_and_task_dispatch:
    - ".ai/CODEX_TASK_INPUT_CONTRACT.md"
  backend_execution_and_handoff:
    - ".ai/CODEX_WORK_MECHANISM_PROTOCOL.md"
    - ".ai/CODEX_TASK_INPUT_CONTRACT.md"
dispatch_event_types:
  - backend_dispatch
material_event_classes:
  - C1
  - C2

human_response_preflight_fields:
  - factual_status_grounded
  - required_refs_dereferenced
  - canonical_pointer_present_when_applicable
  - execution_recommendation_present_when_dispatching
  - independent_expression_present_for_material_event
  - independent_expression_separated_from_authority
  - no_long_task_or_report_echo
  - no_hidden_chain_of_thought_request_or_disclosure

execution_recommendation_fields:
  - recommended_model
  - recommended_thinking_level
  - mode
  - subagents
  - task_ref_or_plan_ref
  - short_complexity_rationale
  - human_gate

expression_policy:
  heading: "Independent expression"
  minimum_sentences: 2
  maximum_sentences: 5
  generic_warning_phrases:
    - looks good
    - great work
    - everything is fine
    - approved without reservation

reference_policy:
  production_kinds:
    - git_blob
  test_only_kinds:
    - test_fixture_blob
  require_full_commit_sha: true
  reject_symlinks: true
  reject_submodules: true
  reject_trees: true
  reject_mutable_refs: true

transitions:
  dispatch_to_backend:
    from_states:
      - idle
      - completed
      - awaiting_human_gate
    to_state: awaiting_codex
    event_types:
      - backend_dispatch
    required_event_class: C1
    external_human_authority_required: false
  backend_completion:
    from_states:
      - codex_running
    to_state: awaiting_chatgpt_review
    event_types:
      - completion_handoff
      - correction_handoff
      - blocked_report
      - conflict_report
    required_event_class: C1
    external_human_authority_required: false
  foreground_acceptance:
    from_states:
      - chatgpt_reviewing
    to_state: completed
    event_types:
      - significant_acceptance
      - material_review
    required_event_class: C1
    external_human_authority_required: false
  publication_candidate:
    from_states:
      - chatgpt_reviewing
    to_state: awaiting_human_gate
    event_types:
      - significant_acceptance
      - material_review
    required_event_class: C1
    external_human_authority_required: false
  protected_publication_entry:
    from_states:
      - awaiting_human_gate
    to_state: null
    event_types:
      - source_publication
      - master_publication
      - merge
    required_event_class: C2
    external_human_authority_required: true
    eligibility_only: true

protected_actions:
  - source_publication
  - master_publication
  - merge
  - rebase
  - runtime_activation
  - coordinator_activation
  - communication_gateway_activation
  - ui_middleware_activation
  - polling_activation
  - cron_activation
  - unattended_automation_activation
  - destructive_operation
  - secrets_sensitive_action
  - objective_change
  - engine_routing_change

drift_policy:
  recurrence_threshold: 2
  fixture_requirement: "matching_negative_fixture_or_deterministic_impossibility_with_foreground_review"
  contains_private_reasoning: false
  contains_secret_content: false
