independent_review_corrections:
  authority_precedence:
    status: "implemented_pending_exact_head_review"
    evidence: >-
      The registry now reproduces the canonical eight-tier order from
      .ai/PROTOCOL.md, treats same-tier source order as unordered, separates
      authenticated tier-3 Human override from ordinary tier-7 task details,
      and distinguishes granting, governing, and operational-detail sources.
  replay_boundary:
    status: "implemented_pending_exact_head_review"
    evidence: >-
      Authorization now reports that the host-supplied replay snapshot is
      read-only point-in-time evidence. P0 performs membership checking only;
      atomic nonce consumption, persistence, and cross-process replay
      protection are explicitly false and remain host responsibilities.
  secret_path_classifier:
    status: "implemented_pending_exact_head_review"
    evidence: >-
      A fixed case-insensitive policy floor denies .env variants, credential
      directories and filenames, private-key suffixes, SSH material, Git and
      common cloud/tool credential stores. Control characters, Windows ADS,
      non-normalized paths, trailing dot/space components, and policy-instance
      override attempts fail closed without reading file contents.
  admission_trust_sealing:
    status: "implemented_pending_exact_head_review"
    evidence: >-
      Authorization and admission requests, grants, decisions, and admission
      evidence are accepted only when factory-issued and fingerprint-intact;
      verifier and admission flows consume checked snapshots instead of
      rereading caller-owned objects after validation.
      Direct construction, copying, serialization reentry, duck typing,
      post-issuance mutation, and test-fixture evidence in production fail
      closed; admission result mappings are read-only.

