schema_version: citystate.workflow.stage_artifact_schema.v1
artifact_schema_version: 1
common_required_fields:
- schema_version
- run_id
- stage_id
- artifact_kind
- artifact_version
- status
- input_refs
- deliberation_receipt
- payload
common_rules:
- status_must_equal_complete
- artifact_version_must_be_positive_integer
- input_refs_must_bind_required_predecessor_sha256
- deliberation_receipt_must_bind_stage_profile
- dormant_receipt_must_not_create_session
- full_or_incremental_receipt_requires_task_gate_and_Human_authorization_ref
stage_id: workflow_stage_06_execution
artifact_kind: execution_package
artifact_filename: 06_execution.yml
required_predecessors:
- workflow_stage_04_test_generation
- workflow_stage_05_step_decomposition
payload_required_fields:
- executor_role
- allowed_write_paths
- actual_write_paths
- frozen_test_package_sha256
- attempts
- unauthorized_write_attempts
stage_specific_rules:
- actual_write_paths_subset_of_allowed_write_paths
- frozen_test_package_sha256_must_match_stage_04
- attempts_must_respect_step_retry_budget
- unauthorized_write_attempts_must_be_empty
