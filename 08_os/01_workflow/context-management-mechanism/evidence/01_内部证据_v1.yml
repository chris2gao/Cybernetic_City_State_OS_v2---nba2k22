workflow_id: context-management-mechanism
stage: 02_信息收集与提炼
version: 1
created_at: 2026-07-29

证据条目:
  - id: INT-001
    主张: 第一代 OS 的上下文机制不是全仓库预读，而是固定启动控制面、单一角色 Profile、当前任务引用和条件协议组成的懒加载结构。
    方向: 支持
    来源:
      path: 系统机制总结.md
      location: 第 7–11 行附近
      类型: 第一代系统盘点
    适用性: 证明角色化加载与按需引用已经在真实系统中使用过，可作为第二代候选机制，不代表应继承其文件集合。
    对B的影响: 保留“固定最小启动入口 + 角色配置 + 当前任务引用 + 条件加载”的结构候选。

  - id: INT-002
    主张: 第一代完整初始化约有 13 个公共控制文件，不同角色再增加 2–6 个固定扩展，并动态读取当前任务引用。
    方向: 支持并限制
    来源:
      path: 系统机制总结.md
      location: 第二层完整上下文初始化、第三层角色 Profile
      类型: 第一代系统盘点
    适用性: 证明角色 Profile 可行；同时说明固定控制集可能偏重，第二代必须实测 token 与加载必要性，不能整体复制。
    对B的影响: 将“固定入口尽量小”作为候选方案筛选条件。

  - id: INT-003
    主张: 第一代在 source 分支的 neutral STATE/INBOX 与 review 分支活动版本之间存在误读风险，不能把空状态当成当前任务状态。
    方向: 反例
    来源:
      path: 系统机制总结.md
      location: 完整初始化部分关于 STATE.yml 与 INBOX.md 的说明
      类型: 第一代失败风险
    适用性: 状态声明若与实际产物或分支脱节，会恢复错误上下文。
    对B的影响: 第二代状态应尽量由产物和精确版本引用推导；入口文件不能仅声明阶段。

  - id: INT-004
    主张: 第一代同一上下文中的 fast path 只读取当前 Human 指令、STATE、必要时 INBOX，以及 signal 的全部非空引用。
    方向: 支持
    来源:
      path: 系统机制总结.md
      location: 通信与 Handoff 协议栈的 fast path
      类型: 第一代运行经验
    适用性: 证明“固定入口 + 引用展开”可减少重复加载。
    对B的影响: 候选角色入口应引用必要产物，而不是复制完整历史。

  - id: INT-005
    主张: 第一代 Role Memory 只加载 core memory 与当前角色对应 memory，其他角色记忆不加载。
    方向: 支持
    来源:
      path: 系统机制总结.md
      location: Role Memory 机制
      类型: 第一代运行经验
    适用性: 已有按角色分配固定上下文的先例。
    对B的影响: 固定基础角色可以各有最小角色配置；角色配置本身不授予权限。

  - id: INT-006
    主张: 测试、Schema、validator、fixture 和路由文件可能不进入模型上下文，但仍属于真实运行依赖。
    方向: 支持
    来源:
      path: 系统机制总结.md
      location: 系统实际存在三种使用、通信合规与 Release Binding
      类型: 第一代系统盘点
    适用性: 模型上下文与系统执行依赖必须分开建模。
    对B的影响: 第二代角色入口只描述模型需要读取的内容；权限校验、版本检查等确定性机制不必注入模型上下文。

  - id: INT-007
    主张: Git worktree 能提供独立工作目录，但“加载分区”与“访问边界”不是同一件事；有 shell 的模型仍可能触达其他路径。
    方向: 支持并限制
    来源:
      path: 08_os/_dev/WORKFLOW_MECHANISM_v0.1.md
      location: 上下文分区是加载纪律，不是访问边界
      类型: 第二代设计与仓库实测
    适用性: A 已明确主要防无意污染，不追求零信任；因此 worktree 可作为候选默认分区，但不能被描述为绝对安全边界。
    对B的影响: 方案必须分别声明“默认加载边界”和“技术访问限制”做到什么程度。

  - id: INT-008
    主张: 当前可用模型已形成规划管理、独立审核、外部研究与本地执行的角色能力集合。
    方向: 支持
    来源:
      path: 08_os/可使用的独立模型和角色.md
      location: 全文
      类型: 当前环境清单
    适用性: Claude Code Desktop 与 ChatGPT web 可承担规划分析；Codex 与 Antigravity 可执行；Gemini web 可独立研究；NotebookLM 可做给定语料综合。
    对B的影响: 第一版无需发明新的模型类别，但精确角色契约仍需在 B 中定义。

  - id: INT-009
    主张: 当前通信协议已经把机器指针、Human 可读操作信息和耐久 Human Brief 分成不同通道，并要求长任务内容留在 GitHub、聊天只传紧凑引用。
    方向: 支持
    来源:
      path: .ai/PROTOCOL.md
      location: Three Distinct Communication Channels
      类型: 第一代成熟机制
    适用性: 证明“结构化交接 + 耐久正文引用”已经在当前协作中工作。
    对B的影响: 可借鉴通道分离思想，但不继承第一代七字段协议与历史状态。

  - id: INT-010
    主张: 第一代大型任务与长周期 Program 已有 preflight、allowed paths、checkpoint、rollback、issue log 与 exact-head review 等成熟机制，但尚无通用自动编排引擎。
    方向: 支持并限制
    来源:
      path: 系统机制总结.md
      location: 大任务执行分两层、但目前还缺少什么
      类型: 第一代系统盘点
    适用性: 可提取版本引用、检查点和审核思想；不应把完整 Program 控制面直接移植到第一版上下文机制。
    对B的影响: 第一版只保留完成小型任务闭环所需的最小状态、版本与恢复能力。

内部证据综合:
  已支持:
    - 角色化懒加载与任务引用在第一代真实运行过。
    - 结构化交接、角色记忆、fast path 与精确引用具有复用价值。
    - 模型上下文与系统执行依赖应分离。
    - 当前模型班子足以覆盖第一版主要角色。
  已发现反例:
    - 状态声明与实际分支或产物脱节会导致恢复错误。
    - 固定启动文件过多会削弱最小上下文目标。
    - worktree 提供工作目录分离，但不能自动等同于安全访问边界。
    - 第一代长周期协议完整但控制面较重，不能直接整体迁移。
  已解决的A中歧义:
    - 系统机制总结.md 已在 core 根目录定位。
    - 08_os/可使用的独立模型和角色.md 已在 master 定位。
  尚需外部证据:
    - 最小上下文对模型表现和 token 成本的经验支持。
    - 跨会话持久化、结构化 handoff、版本失效的现有实现模式。
    - GitHub 受限仓库与当前本地隔离方案的实际成本。
