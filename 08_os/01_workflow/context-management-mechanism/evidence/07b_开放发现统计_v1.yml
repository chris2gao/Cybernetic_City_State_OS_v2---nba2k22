  eig_assessment:
    more_broad_web_search: low
    primary_source_verification_for_disputed_claims: medium
    local_partition_runtime_experiment: high
    github_handoff_cost_experiment: high
  current_decision: >-
    不启动第三轮宽泛 Deep Research。下一步转向高 EIG 的运行试验，并在最终证据索引中把争议性 Gemini 主张降级为未决或候选约束。

calculation_check:
  mechanism_patterns: "((14+1)*(8+1)/(4+1))-1 = 26; 18/26 = 69.23%"
