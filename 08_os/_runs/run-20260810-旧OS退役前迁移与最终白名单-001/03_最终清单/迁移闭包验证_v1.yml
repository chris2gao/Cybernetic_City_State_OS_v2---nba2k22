    A zero dependency count is a statement about the active surface as defined
    above, not about the whole tree. 08_os/_dev/** still names the old run root in
    four files and 08_os/_runs/** in twenty-one; both are historical by the file
    placement rules and neither is in this task's allowed paths.
  - >-
    The validator previously required the literal old run root token in
    08_os/_dev/开发产物与文件隔离规范_v1.md. That requirement was removed rather than
    satisfied: requiring current path tokens inside _dev made a superseded design
    document a live contract surface, which contradicts what _dev is for. The two
    canonical files it still checks are unchanged in that respect.
