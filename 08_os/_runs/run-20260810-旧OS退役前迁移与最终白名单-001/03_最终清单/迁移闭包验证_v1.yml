      AGENT_WORKING_DISCIPLINE.md sections 2 and 7 for the discipline, section 7 of
      the entry itself for the risk tiers, and the migrated authority file for
      publication - all three of which already held that content.
  - id: M3_domain_run_root
    token: .ai/PROGRAM_RUNS
    active_dependency_hits: 0
    annotation_lines:
      - "CORE_MANIFEST.yml:176 - comment recording that the root moved"
    historical_mentions: 21
