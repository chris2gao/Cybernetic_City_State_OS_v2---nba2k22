active_surface_definition: >-
  08_os/** minus 08_os/_runs/**, plus the fifteen tracked non-08 files that survive
  the approved deletion, minus the files that declare their own supersession or
  historical status. 08_os/_dev/ is IN the active surface: 08_os/README.md defines
  it as holding active development design AND superseded versions, so directory
  membership establishes nothing. Status is per file, by the file's own marker -
  either the repository's existing supersession line "状态：已被 <newer> 取代", or a
  provenance header declaring status: historical_input_evidence. Superseded files
  are counted and reported separately, never edited to remove a token.
active_surface_files: 253
corrected_in_round_1: >-
  The first version of this scanner excluded 08_os/_dev/** wholesale as historical
  and reported M3 active hits = 0 on that basis. Independent review rejected it and
  was right: four current _dev documents still named the old run root - three
  carrying "状态：活动" and one being the developer-readable entry for the machine
  contract. Directory membership was never evidence of status. The exclusion is
  replaced by the per-file marker rule above, the four files were updated, and the
  validator's ownership-text check on 08_os/_dev/开发产物与文件隔离规范_v1.md - which
  this task had removed earlier the same day on the same bad reasoning - is restored.
scan_order_note: >-
  The counts in this file were produced after two corrections the scanner itself
  forced, both recorded rather than quietly folded in. Its first run counted five
  provenance and ownership-inventory lines as dependencies; its second, run after
  this task's own artifacts landed, counted the migrated authority file's provenance
  header and the migrated historical document as dependencies. In both cases the
  fix was to the scanner's model of what a dependency is - and in both cases the
  excluded material is now printed verbatim, because an author narrowing the
  definition of "problem" is precisely what an independent reviewer is for.

declared_historical_on_the_active_surface:
  rule: >-
    A migrated historical document is historical wherever it is stored. The scanner
    skips any file whose first 40 lines declare `status: historical_input_evidence`
    in its provenance header, and prints the filename when it does - so the rule is
    re-derivable from the file itself rather than from a name hardcoded in the
    checker.
  files:
    - path: 08_os/03_mechanisms/context_management/依据材料/系统机制总结_历史输入_v1.md
      why: >-
        Byte-exact copy of the retired root document, carried across so the evidence
        records citing it stay checkable. Its body mentions .ai/TOKEN_USAGE_PROFILE.md
        because that is what the document said in 2026; the copy is a record, not a
        dependency, and rewriting its body would defeat the point of preserving it.

annotation_only_exclusions:
  rule: >-
    Four active-surface files legitimately name an old path without depending on
    it. They are excluded from the dependency count and every excluded line is
    printed verbatim by the script, so the exclusion can be judged rather than
    trusted. The one way this could hide a real dependency - an ownership list
    entry, which is a live declaration and not an annotation - is closed by a
    separate direct check of the manifest's two machine-read keys.
  files:
    - path: 08_os/05_registry/repository_publisher_authority_v1.yml
      reason: >-
        the migrated file's own provenance header names where it came from. The real
        risk - carrying the old communication plane across with it - is checked
        directly by M1_migrated_authority_clean rather than by substring.
    - path: CORE_MANIFEST.yml
      reason: >-
        ownership inventory of physically present paths; its own header states that
        ownership is not activity, so naming a legacy path is its job
    - path: 08_os/claude与人类的开发对话日志.md
      reason: development log, same historical class as _dev/ and _runs/
    - path: 08_os/05_registry/repository_guards_v1.yml
      reason: carries the migration provenance of the file that moved

