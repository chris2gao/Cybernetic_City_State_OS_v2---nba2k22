active_surface_definition: >-
  08_os/** minus 08_os/_runs/** minus 08_os/_dev/**, plus the fifteen tracked non-08
  files that survive the approved deletion. _dev holds active design and superseded
  versions - the file placement table says "supersede, do not erase history" - so a
  superseded draft naming an old path is correct as history rather than a live
  dependency, and _runs is past run evidence for the same reason. Both are counted
  separately below instead of being dropped.
active_surface_files: 245

annotation_only_exclusions:
  rule: >-
    Three active-surface files legitimately name an old path without depending on
    it. They are excluded from the dependency count and every excluded line is
    printed verbatim by the script, so the exclusion can be judged rather than
    trusted. The one way this could hide a real dependency - an ownership list
    entry, which is a live declaration and not an annotation - is closed by a
    separate direct check of the manifest's two machine-read keys.
  files:
    - path: CORE_MANIFEST.yml
      reason: >-
        ownership inventory of physically present paths; its own header states that
        ownership is not activity, so naming a legacy path is its job
    - path: 08_os/claude与人类的开发对话日志.md
      reason: development log, same historical class as _dev/ and _runs/
    - path: 08_os/05_registry/repository_guards_v1.yml
      reason: carries the migration provenance of the file that moved

