known_limits:
  - >-
    A zero dependency count is a statement about the active surface as defined
    above, not about the whole tree. 08_os/_runs/** still mentions the old run root
    22 times. Those are run records - each a statement about one past task, not a
    contract anything loads - and rewriting them would falsify what those tasks did.
  - >-
    Status is taken from a file's own marker. A current document that forgot to
    declare itself would be scanned as active, which is the safe direction; a
    retired document that forgot its supersession line would also be scanned as
    active and would surface as a dependency hit rather than be silently skipped.
    Both failure modes point at "report it", not at "assume it is fine".
  - >-
    The validator's ownership-text check on 08_os/_dev/开发产物与文件隔离规范_v1.md was
    removed earlier on 2026-08-10 and is restored here. Removing it was the same
    error as excluding the directory: it treated a current entry document as
    history because of where it lives.
