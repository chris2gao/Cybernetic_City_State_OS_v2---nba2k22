    token: .ai/REPOSITORY_PUBLISHER_AUTHORITY.yml
    active_dependency_hits: 0
    annotation_lines:
      - "08_os/05_registry/repository_guards_v1.yml:155 - migration provenance in the new entry's evidence field"
      - "CORE_MANIFEST.yml:147 - legacy-group ownership entry for a file still physically present"
    historical_mentions: 9
    verdict: PASS
  - id: M2_token_profile
    token: .ai/TOKEN_USAGE_PROFILE.md
    active_dependency_hits: 0
    annotation_lines:
