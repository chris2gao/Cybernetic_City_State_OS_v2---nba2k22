# ---------------------------------------------------------------------------
# Findings
# ---------------------------------------------------------------------------
findings:
  - id: private_ssh_key_inside_the_repository_tree
    severity: high
    measured: >-
      .ssh/ in the working tree holds id_ed25519, id_ed25519.pub, known_hosts and
      known_hosts.old. All four are git-ignored and none is on the remote, so nothing
      has leaked. The contents were not opened.
    why_it_still_matters: >-
      Ignored protects a file from `git add` and from nothing else. A broad archive
      step, a folder copy, or any tool that walks the directory instead of the index
      carries it - which is the same failure mode new-domain.ps1 exists to prevent
      for remotes.
    action_taken: reported only; not read, not moved, not deleted
    recommended: Human moves the key to the user profile SSH directory

  - id: packet_calls_token_profile_files_measurements
    severity: low
    measured: they are two modules, two tests and two generated index files
    action_taken: preserved as instructed; description corrected in this report

  - id: seven_refs_resolves_to_five_files_and_four_prose_lines
    severity: low
    measured: 17 structured refs across 5 files, plus 4 prose sentences about the past
    action_taken: structured refs repointed, prose left as history, difference reported

