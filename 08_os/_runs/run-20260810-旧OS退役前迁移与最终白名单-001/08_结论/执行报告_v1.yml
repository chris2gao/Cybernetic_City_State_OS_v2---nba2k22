        The packet names physical_master_expected as the base. Run against master the
        ledger reports 61 paths and 13 allowlist violations - and every one of the 13
        is a file the ACCEPTED PREDECESSOR run committed between master and
        c932eafb53881ae32d5dd926391bb1d23e7fdade, not something this task wrote. The
        allowlist governs what this task changed, so the correct base for that
        question is this task's own starting head. Both numbers are reported rather
