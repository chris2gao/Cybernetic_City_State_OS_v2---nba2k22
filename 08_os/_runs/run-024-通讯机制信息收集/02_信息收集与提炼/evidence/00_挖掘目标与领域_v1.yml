workflow_id: os-v2-communication-mechanism
requirement_version: 1
evidence_version: 1
建立日期: "2026-08-02"
相信A可实现的条件: >-
  旧系统的已验证不变量、失败历史、传输能力和真实 pointer 闭环能够给出可复查的支持证据，
  且关键缺口能被明确隔离为后续实验、B 或冻结测试输入，而不是靠旧实现存在本身证明可行。
相信A不可实现的条件: >-
  状态唯一性、actor 与授权分离、immutable evidence/current-head CAS、跨传输回读或真实 rollback
  任一关键需求在现有环境中被证据推翻，且没有不扩大 Human 授权或不产生双权威的可测试路径。

研究问题:
  - id: RQ-01
    问题: 旧 .ai 通讯栈当前提供哪些可区分能力，每项应保留、改造、拒绝还是待验证？
    类型: 定向核实
    用途: 为阶段三提供能力边界与约束，不在本阶段选择结果模型。
    捕获单位: ""
    停止条件: §3.3 指定的旧栈证据面均有来源覆盖，能力矩阵无空判定、理由或失败历史。
  - id: RQ-02
    问题: 哪些真实事故和 drift 证明了旧栈不变量，哪些又暴露了实现缺口？
    类型: 定向核实
    用途: 防止把已修正缺陷误当成无需保留的复杂度，或把通过测试误当成生产事实。
    捕获单位: ""
    停止条件: discipline、drift ledger 与至少一组实际 pointer 记录均已交叉读取。
  - id: RQ-03
    问题: 当前 base 上有哪些 08_os 外 core 窗口任务类型、活动路径和真实实例？
    类型: 开放发现
    用途: 支持 A 假设 7 与未来 core 全窗口迁移/测试覆盖。
    捕获单位: CORE_MANIFEST 中的 core-owned path 与 .ai/TASKS tracked task carrier
    停止条件: 对 immutable base 的有限 manifest/tree 全量枚举完成、分类无遗漏且脚本重跑字节稳定。
  - id: RQ-04
    问题: 最低充分 token 且成本不上升是否已有可比较的旧基线、计量口径与样本？
    类型: 定向核实
    用途: 收敛或升级 A 中唯一阻塞阶段二的未解歧义。
    捕获单位: ""
    停止条件: 找到 3–5 组匹配 run，或证明现有记录不足并留下明确升级条件。
  - id: RQ-05
    问题: local Git、GitHub CLI 与 connector 的发布证据边界能否在语义上等价？
    类型: 定向核实
    用途: 约束未来传输适配与 fail-closed 测试。
    捕获单位: ""
    停止条件: 当前 receipt、传输矩阵、publisher authority 与未知能力边界全部记录。
  - id: RQ-06
    问题: 旧系统是否已证明 live enforcement、全窗口迁移与真实 rollback？
    类型: 定向核实
    用途: 分离 repository-level eligibility 证据与尚未发生的 runtime/cutover 事实。
    捕获单位: ""
    停止条件: 文档自述的 non-goals 与现有运行证据边界一致，未验证项明确移交后续阶段。

领域:
  - 领域: 多模型与人机协同通讯
    为什么相关: 稳定角色、pointer、Human 内容和 durable ref 是 RQ-01 的直接对象。
    对应研究问题: [RQ-01, RQ-02]
    不研究会漏掉什么: provider 名称与角色合同、机器与 Human 通道边界。
  - 领域: 分布式状态机与事件溯源
    为什么相关: transition、幂等、防重放、状态唯一性和 drift ledger 属于旧栈核心能力。
    对应研究问题: [RQ-01, RQ-02, RQ-06]
    不研究会漏掉什么: validator 通过与真实状态改变之间的边界。
  - 领域: 身份、授权与最小权限
    为什么相关: A 要求 state evidence、actor origin 与 Human authority 互不替代。
    对应研究问题: [RQ-01, RQ-05]
    不研究会漏掉什么: payload 自证、角色越权和 C2 重放风险。
  - 领域: Git 引用、CAS 与发布原子性
    为什么相关: immutable refs、expected-head、传输门与回读是发布证据基础。
    对应研究问题: [RQ-01, RQ-03, RQ-05]
    不研究会漏掉什么: local/API/CLI 门禁差异和真实非 08_os 任务实例。
  - 领域: 可观测性、审计与恢复
    为什么相关: receipt、proof、drift、失败显露和 rollback 都需可复验。
    对应研究问题: [RQ-02, RQ-05, RQ-06]
    不研究会漏掉什么: 记录存在与能力已激活之间的差异。
  - 领域: 兼容迁移与单写权威
    为什么相关: lane、legacy mailbox、adapter 与 canonical 切换必须避免双写。
    对应研究问题: [RQ-01, RQ-06]
    不研究会漏掉什么: 旧路径只作 adapter/evidence 的退役边界。
  - 领域: LLM 上下文与 Token 工程
    为什么相关: R8 的成本判断必须有匹配 measurement records，不能只引用纪律文本。
    对应研究问题: [RQ-04]
    不研究会漏掉什么: 计量口径、null 指标和无基线时的升级条件。
  - 领域: 工作流与阶段门治理
    为什么相关: 本阶段只收集证据，不能越入 B、测试冻结或 canonical 切换。
    对应研究问题: [RQ-01, RQ-04, RQ-06]
    不研究会漏掉什么: 阶段完成与后续机器门之间的责任边界。
