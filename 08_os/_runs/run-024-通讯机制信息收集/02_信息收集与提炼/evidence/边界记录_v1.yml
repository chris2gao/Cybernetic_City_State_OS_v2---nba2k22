workflow_id: os-v2-communication-mechanism
requirement_version: 1
evidence_version: 1
searched:
  - research_question_id: RQ-01
    queries_or_paths: [.ai/PROTOCOL.md, .ai/communication_compliance/, .ai/HANDOFF_INIT_PROMPT.md, .ai/lanes/, .ai/REPOSITORY_PUBLISHER_AUTHORITY.yml]
    result: 形成 34 项能力 universe，四选一判定无空项。
  - research_question_id: RQ-02
    queries_or_paths: [AGENT_WORKING_DISCIPLINE.md, .ai/COMMUNICATION_DRIFT_LEDGER.yml, e8ac5ba, 9c11407]
    result: 得到 7 条结构化 drift、工作纪律事故与一组实际 dispatch/completion 对照。
  - research_question_id: RQ-03
    queries_or_paths: [CORE_MANIFEST.yml@a66ee67, git ls-tree, git diff-tree d56ac9e/ea653f1/5739a29, .ai/TASKS/index.md]
    result: 44 core-owned declarations、34 个 08_os 外路径、8 类任务、5 tracked/4 indexed task files。
  - research_question_id: RQ-04
    queries_or_paths: [.ai/TOKEN_USAGE_PROFILE.md, .ai/token_profile/, v03 immutable Human Brief]
    result: 计量合同存在；matched run corpus 不存在，category metrics 记录为 null。
  - research_question_id: RQ-05
    queries_or_paths: [run-020 environment receipt, 08_os transport matrix, publisher authority]
    result: local/CLI 有事实，API connector 当前不可用，等价 replacement gate 仅有规范未实测。
  - research_question_id: RQ-06
    queries_or_paths: [compliance README non-goals, A rollback ambiguity, plan v2 cutover/rollback requirements]
    result: repository gate 有实现；live host enforcement、cutover 与真实 rollback 均未证明。

empty_returns:
  - query_or_source: git log --all -- 08_os/_runs/run-024-通讯机制信息收集
    interpretation: 所有本地 refs 未发现同名 run；只证明创建前未占用，不证明未来不会出现并发创建。
  - query_or_source: repository search for token_profile_run.v1 records
    interpretation: 当前 tree 未找到匹配记录；不等于宿主机或未提供外部存储中不存在记录。
  - query_or_source: ai/review/latest@cd70147 lane events
    interpretation: 当前 review head 无 lane event path；不等于历史没有 events，历史通过 immutable commits 另行读取。

truncations:
  - source: 初次合并读取 full protocol stack 的工具输出
    limit: combined output 达客户端截断；随后按文件和明确行段重读缺失范围，未以截断文本支持结论。
  - source: .ai/communication_compliance/ 207-file tree
    limit: 未逐文件全文读取；用 canonical README/policy、suite summary、drift ledger 与代表性 actual records 覆盖能力语义。
  - source: 全部历史 pointer records
    limit: 只选 e8ac5ba dispatch 与 9c11407 completion 做实际对照；不得外推所有旧任务的成功率。

inaccessible_sources:
  - source: live UI/Codex/Claude window instance inventory
    reason: Git 只能观察 tracked task/path 和 worktree refs，不能证明全部打开窗口、provider session 或迁移顺序。
    handling: 待人工/host capability；切换门前必须补 runtime inventory。
  - source: GitHub API connector production execution
    reason: run-020 receipt 标 available=false。
    handling: 在 connector 可用环境独立实测 CAS/read-back/actor binding；当前保持未决。
  - source: v03 local token run record body
    reason: immutable Human Brief 只给摘要与 hash，record 未在本任务提供的 repository refs 中。
    handling: 只使用“category metrics unavailable/null”这一已读事实，不推断缺失字段值。
  - source: 其他成熟代理系统外部资料
    reason: 本轮内部 finite evidence 已足以判定旧能力与主要缺口，外部检索不会改变阶段二 feasibility judgment。
    handling: 若 B 遇到内部证据无法回答的高 EIG 设计问题，再按外部工具中转合同派单。

search_asymmetry:
  - lanes: [finite Git tree enumeration, historical pointer sampling]
    difference: 前者对 immutable base 全量，后者只读代表性实际 records。
    effect_on_coverage: task/path counts 可作精确点值；pointer 行为只能作存在性与失败例证。
  - lanes: [repository contract, live runtime]
    difference: schema/fixtures 丰富，trusted host、connector、cutover、rollback 的 production runtime 证据不足。
    effect_on_coverage: 可以判断 contract feasibility，不能宣告 runtime/canonical readiness。
  - lanes: [token measurement contract, token measurement corpus]
    difference: 口径完整但 matched records 缺失。
    effect_on_coverage: 可收敛测量方法，不能收敛成本阈值。

循环与共享来源:
  - protocol、HANDOFF_INIT、common conventions 与 policy 多处重复同一 invariant，不按多独立来源计数。
  - fixture result 是执行方产物；未由本窗口独立重跑，因此只证明存档结果内容，不作为独立 acceptance。
  - Human确认_v1.yml 是 Human 决定的 repository 转录；不把执行/审核模型重复引用算第二个 Human 来源。
  - 同一 independence_group 内的多个原始 artifact 只计一个首发来源；shared_origin_groups 必须列出所有重复组。
  - 本 run 生成的枚举 JSON 是可重跑 measurement artifact，标为 original_source=false，不能替代 manifest、Git commit、tree 或 index 首发锚点。
  - 27 条证据均按关键主张保守处理；独立来源不足双源的条目显式标为 single_source，不以可信度等级掩盖来源数量。
