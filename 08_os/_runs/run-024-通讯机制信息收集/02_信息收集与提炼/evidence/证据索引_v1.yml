    信息可信度: "1"
    可信度理由: 当前 immutable base 文件与 A 实测摘要完全一致。
    时间适用性: 绑定 A version 1；A 内容变化即失效。
    适用边界: 只确认需求 A，不授权阶段三、实现或 canonical 切换。
