    对测试的潜在线索: A hash mismatch 必须使后续阶段 fail closed。
    事实与推断:
      读到的事实: status=human_confirmed，candidate sha256=cfff1e...f4a7。
      合并方推断: 阶段二输入门已成立，但其他门未由此成立。

  - evidence_id: E-002
    research_question_ids: [RQ-01, RQ-06]
    主张: 活动方案要求旧 .ai 通讯栈逐项判定，而不是整套平移或因旧而丢弃。
    方向: 支持
