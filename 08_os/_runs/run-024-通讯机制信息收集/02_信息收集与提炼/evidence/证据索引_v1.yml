        original_source: true
    独立性: {independent_source_count: 2, shared_origin: 两个不同 Git refs 的物理回读}
    信息可信度: "1"
    可信度理由: 本轮直接读取 source 与 remote review head。
    时间适用性: ai/review/latest mutable；仅对 2026-08-02 observed head cd70147 有效。
    适用边界: neutral 不证明历史从未有活动任务。
    与A的关系:
      supports_success_criteria: [R3, R9]
      tests_assumptions: [一个 authoritative current-state source 可与 durable source 分离]
      resolves_ambiguities: []
    对B的约束: source neutral baseline 与 active current state 不能共用含义。
    对测试的潜在线索: source mailbox 携带 active task 时 publication 必须失败。
    事实与推断: {读到的事实: 两个 head 的 STATE 均 status=neutral_baseline。, 合并方推断: mutable latest 仍需外部 current-head evidence，不能因名称“latest”自证。}

  - evidence_id: E-008
