        original_source: true
    独立性: {independent_source_count: 1, shared_origin: Human-approved program plan}
    信息可信度: "1"
    可信度理由: 当前 master 活动总体方案的直接阶段边界。
    时间适用性: P1 阶段二有效。
    适用边界: 不自行授权 B、实现、迁移或删除。
    与A的关系:
      supports_success_criteria: [R1-R14 的证据收集边界]
      tests_assumptions: [旧系统可作为高价值证据输入]
      resolves_ambiguities: []
    对B的约束: 每个采用的不变量都需证据和失败历史，而非来源路径偏好。
    对测试的潜在线索: 能力矩阵不得有空判定。
    事实与推断: {读到的事实: 方案逐项列出主要证据源和四选一判定。, 合并方推断: 外部研究在内部证据不足时才有高 EIG。}

  - evidence_id: E-003
    research_question_ids: [RQ-01]
    主张: 旧协议将 Human、foreground、backend 定义为稳定角色，provider、profile、lane 和模型标签均不授权。
    方向: 支持
    source_refs:
      - source_id: SRC-003
        location: PROTOCOL.md Protocol Role Compatibility
        original_source: true
    独立性: {independent_source_count: 2, shared_origin: PROTOCOL 与 publisher authority 为不同合同}
    信息可信度: "1"
    可信度理由: 两份 canonical 文件一致，且 compliance policy 有 role mapping。
    时间适用性: 当前旧通讯 release。
    适用边界: 角色合同不等于当前 action authorization。
    与A的关系:
      supports_success_criteria: [R1, R4]
      tests_assumptions: [稳定角色可覆盖兼容 provider]
      resolves_ambiguities: []
    对B的约束: 新模型必须继续把 stable role 与 provider/transport 分开。
    对测试的潜在线索: provider 名称替换不得改变允许的 role edge。
    事实与推断: {读到的事实: policy 对五种 provider occupant 映射三个 stable roles。, 合并方推断: provider-branded wire 名称应由 adapter 兼容而非继续作为新 canonical 名称。}

  - evidence_id: E-004
    research_question_ids: [RQ-01]
    主张: 两向 pointer 核心各七字段，长内容先发布为 durable ref，接收方必须解引用所有适用非空 ref。
    方向: 支持
    source_refs:
      - source_id: SRC-003
        location: PROTOCOL.md Pointer-Based Message Format 与 Pointer Dereference Obligation
        original_source: true
    独立性: {independent_source_count: 2, shared_origin: protocol 与 material_event_policy 同一旧栈但不同机器/文档表达}
    信息可信度: "1"
    可信度理由: policy 明确列出顺序，fixtures 验证缺字段、顺序与 ref 攻击。
    时间适用性: 当前旧通讯 release。
    适用边界: fixed old wire label 不必原样成为新 provider-neutral 名称。
    与A的关系:
      supports_success_criteria: [R2, R3, R13]
      tests_assumptions: [pointer 加 durable refs 能保留 primary evidence]
      resolves_ambiguities: []
    对B的约束: 必须存在可机器解析的最小 pointer、发布顺序和 missing-ref fail-closed。
    对测试的潜在线索: 缺 key、乱序、unknown tail、missing ref 均为负例。
    事实与推断: {读到的事实: backend wire 仅允许可选 detail_ref tail。, 合并方推断: 新字段扩展必须版本化，不能在 core mapping 中任意加 prose。}

  - evidence_id: E-005
    research_question_ids: [RQ-01, RQ-02]
    主张: 旧栈要求 machine pointer、Human operational content 与 durable Human brief 三通道分离。
    方向: 支持
    source_refs:
      - source_id: SRC-003
        location: PROTOCOL.md Canonical Human-AI Communication Completeness
        original_source: true
    独立性: {independent_source_count: 2, shared_origin: protocol 与实际 lane event}
    信息可信度: "1"
    可信度理由: canonical 规则与 9c11407 实际 completion event/brief 同时存在。
    时间适用性: 当前旧通讯 release 与历史真实任务。
    适用边界: 三通道结构不证明 brief 内容与当前 task 正确绑定。
    与A的关系:
      supports_success_criteria: [R2]
      tests_assumptions: [pointer 可显著减少短消息正文]
      resolves_ambiguities: []
    对B的约束: 保留语义隔离，并独立验证 brief ref 的 task/content 绑定。
    对测试的潜在线索: pointer 合法但 brief 内容属于另一任务时必须失败。
    事实与推断: {读到的事实: actual completion event 使用独立 immutable Human Brief。, 合并方推断: 三通道是必要非充分条件。}

  - evidence_id: E-006
    research_question_ids: [RQ-01]
    主张: full initialization 与 same-context fast path 有互斥触发条件，bootstrap receipt 绑定加载文件字节但不授权。
    方向: 支持
    source_refs:
      - source_id: SRC-005
        location: Full Initialization Read Order、Fast Path、Bootstrap Receipt
        original_source: true
    独立性: {independent_source_count: 2, shared_origin: HANDOFF_INIT 与 actual completion receipt}
    信息可信度: "1"
    可信度理由: 文档规则、schema/fixtures 与 9c11407 receipt 三者一致。
    时间适用性: 绑定 protocol release head。
    适用边界: receipt 不证明模型理解、不认证 live actor。
    与A的关系:
      supports_success_criteria: [R7, R8]
      tests_assumptions: [旧 bootstrap 可恢复任务上下文]
      resolves_ambiguities: []
    对B的约束: 新机制必须显式区分 context boundary 与 fast path。
    对测试的潜在线索: stale release、loaded blob digest mismatch、错误 fast path 均失败。
    事实与推断: {读到的事实: receipt authority_boundary 声明 receipt_is_authorization=false。, 合并方推断: receipt 可保留为 deterministic load evidence。}

  - evidence_id: E-007
    research_question_ids: [RQ-01, RQ-06]
