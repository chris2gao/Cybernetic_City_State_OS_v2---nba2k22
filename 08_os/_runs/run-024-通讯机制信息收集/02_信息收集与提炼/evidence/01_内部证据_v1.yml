workflow_id: os-v2-communication-mechanism
requirement_version: 1
evidence_version: 1
capability_universe_definition: >-
  以方案 v2 §3.3 指定的旧 .ai 证据面为边界，从 PROTOCOL、compliance policy/README、
  HANDOFF_INIT、STATE/mailbox/brief/lane/release-binding、Token profile、工作纪律、publisher
  authority、环境 receipt 和实际 pointer 记录中抽取互不重复的可执行能力。矩阵共 34 项；
  每项恰有一个四选一判定，并保留理由、失败历史与证据引用。

source_coverage:
  - source: 08_os/第二代OS替换与退役方案_v2.md §3.3
    status: covered
    finding: 旧系统是证据源而非默认复制源；外部成熟系统研究为必要时可选。
  - source: .ai/PROTOCOL.md
    status: covered
    finding: 角色、pointer、通道、状态、Git、Human gate 与 handoff 主合同已读取。
  - source: .ai/communication_compliance/
    status: covered
    finding: README、policy、suite summary、proof review、drift ledger 与代表性 fixture 已读取。
  - source: .ai/HANDOFF_INIT_PROMPT.md
    status: covered
    finding: full initialization、fast path、receipt 与 C1/C2 gate 边界已读取。
  - source: .ai/STATE.yml 和 mailbox/brief
    status: covered
    finding: source 与远端 ai/review/latest 当前均为 neutral baseline；历史活动记录另从 immutable commits 读取。
  - source: .ai/lanes/ 与 release binding
    status: covered
    finding: append-only lane、reducer、epoch、local shadow 与双 head release 语义已读取。
  - source: .ai/TOKEN_USAGE_PROFILE.md 与 .ai/token_profile/
    status: covered_with_gap
    finding: 计量合同和工具存在，但仓库中没有可匹配的 token_profile_run.v1 样本集。
  - source: AGENT_WORKING_DISCIPLINE.md
    status: covered
    finding: 丢失聊天、证据过宽、传输误判、陈旧记忆与作者自验等事故已提取。
  - source: 当前 pointer-only 实际工作记录
    status: covered
    finding: e8ac5ba dispatch 与 9c11407 completion lane event 形成前后对照。
  - source: 其他成熟代理系统
    status: not_needed_this_round
    finding: 本轮问题是现有内部能力和失败事实盘点；外部设计选择属于 RQ-01 后续高 EIG 缺口或 B 输入。

old_capability_decisions:
  - capability_id: CAP-01
    capability: 稳定 Human/foreground/backend 角色与 provider compatibility mapping
    判定: 保留
    理由: A R1/R4 直接要求角色语义不随 provider 变化，旧合同已有清晰边界。
    失败历史: provider 名称曾被误读为权限来源；publisher authority 明确禁止 self-declared provider 授权。
    evidence_refs: [E-003, E-009, E-018]
  - capability_id: CAP-02
    capability: 两向固定七字段 machine pointer 与 backend 可选 detail_ref
    判定: 保留
    理由: 固定最小字段能绑定身份、状态和耐久引用，并可生成确定性负例。
    失败历史: e8ac5ba dispatch 添加 note 且 source_head 为占位符，证明字段边界和精确 head 必须机器检查。
    evidence_refs: [E-004, E-016]
  - capability_id: CAP-03
    capability: ChatGPT-to-Codex 与 Codex-to-ChatGPT 的 provider 品牌 wire 名称
    判定: 改造
    理由: 保留字节语义和 adapter 映射，但新 canonical 应使用 provider-neutral 名称。
    失败历史: 历史名称反复需要兼容解释，增加“品牌即所有权/权限”的误读面。
    evidence_refs: [E-003, E-004]
  - capability_id: CAP-04
    capability: 长任务、报告和证据先耐久发布，再发送引用的 writer-side 顺序
    判定: 保留
    理由: 直接满足 A R2/R3，并避免聊天成为唯一事实源。
    失败历史: 工作纪律记录过 UI 会话不可达；只因结论已落 Git/brief vault 才未丢失。
    evidence_refs: [E-004, E-027]
  - capability_id: CAP-05
    capability: 每个非空 ref 强制解引用与 missing-ref 一次检查后 fail closed
    判定: 保留
    理由: 防止凭文件名、旧聊天或相邻材料重建任务。
    失败历史: 旧 handoff 曾出现 required ref 缺失；协议为此把缺失输入与执行 retry budget 分开。
    evidence_refs: [E-004, E-012]
  - capability_id: CAP-06
    capability: machine pointer、Human operational、durable Human brief 三通道结构隔离
    判定: 保留
    理由: A R2 的直接不变量，且实际 completion event 能绑定独立 brief。
    失败历史: e8ac5ba 的 brief_ref 指向无关历史简报，证明分通道后仍需 content/ref 精确绑定。
    evidence_refs: [E-005, E-015, E-016]
  - capability_id: CAP-07
    capability: Human-facing completeness、execution recommendation 与 bounded independent expression
    判定: 改造
    理由: 保留 grounded status、Human/机器分离和必要行动字段；具体聊天仪式应转成可验证最小合同。
    失败历史: incomplete brief fixtures 与历史无关简报说明“有 brief”不等于 Human 内容完整或绑定正确。
    evidence_refs: [E-005, E-011, E-016]
  - capability_id: CAP-08
    capability: context boundary full initialization 与 same-context fast path
    判定: 保留
    理由: 同时满足 A R7 与 R8，减少重复加载但不删决定性证据。
    失败历史: 旧上下文曾依赖隐藏记忆或陈旧协议；bootstrap receipt stale/digest mismatch fixtures 专门拒绝此类漂移。
    evidence_refs: [E-006, E-011]
  - capability_id: CAP-09
    capability: load profile 与可失效 role memory 的 routing-only 机制
    判定: 改造
    理由: routing 价值保留，但应进入新 boot/discovery 区且持续声明不授权。
    失败历史: 角色标签、profile、receipt 曾被混作权限；现协议需多处重复否认。
    evidence_refs: [E-003, E-006, E-009]
  - capability_id: CAP-10
    capability: source neutral mailbox 与活动 review state 分离
    判定: 保留
    理由: 防止结束任务快照污染 durable source baseline。
    失败历史: source publication neutralization gate 因活动 INBOX/STATE/OUTBOX/HUMAN_BRIEF 曾可能被并入 source 而建立。
    evidence_refs: [E-007, E-026]
  - capability_id: CAP-11
    capability: 共享 STATE/INBOX/OUTBOX/HUMAN_BRIEF 作为长期活动 canonical
    判定: 拒绝
    理由: 新机制要求单一权威和并发安全；共享可变文件只能作 adapter、derived view 或 neutral baseline。
    失败历史: 共享 mailbox 多 writer 和陈旧快照会覆盖或误导；lane cutover 已把 legacy OUTBOX 降为只读。
    evidence_refs: [E-007, E-014]
  - capability_id: CAP-12
    capability: C0/C1/C2 分类、显式状态别名与 transition graph
    判定: 改造
    理由: 语义应保留，但旧图只覆盖有限 workflow edges，需由 P1 B 基于 A 扩展。
    失败历史: HUMAN_ROUTING_STATE_GRAPH_GAP 证明 Human direct dispatch 与 persisted review state 曾不可达。
    evidence_refs: [E-008, E-012]
  - capability_id: CAP-13
    capability: production ref 仅允许 full-commit git blob、精确 digest 并拒绝 mutable/tree/symlink/submodule
    判定: 保留
    理由: 这是 A R3/R13 的直接安全不变量。
    失败历史: reference attack fixtures 覆盖 mutable ref、tree、symlink、submodule 和 digest mismatch。
    evidence_refs: [E-010, E-011]
  - capability_id: CAP-14
    capability: immutable STATE 加外部 ActiveStateContext 与 exact-head CAS
    判定: 保留
    理由: immutable 历史只能证明过去，当前性必须由外部 observed head 与执行 CAS 补齐。
    失败历史: 旧 STATE 重放和 claimed-from mismatch 是已冻结负例。
    evidence_refs: [E-009, E-010, E-011]
  - capability_id: CAP-15
    capability: 每个 state-changing event 的外部 ActorOriginContext
    判定: 待验证
    理由: schema/validator 已有，但当前 repository gate 不能认证 live host，生产注入与 replay store 未实测。
    失败历史: ACTOR_ORIGIN_EVENT_BINDING_INCOMPLETE 记录了只绑标识、未绑 exact event digest 的缺陷。
    evidence_refs: [E-009, E-012, E-024]
  - capability_id: CAP-16
    capability: C2 独立 AuthorizationContext、与 event/actor-origin digest 绑定并原子消费
    判定: 待验证
    理由: fail-closed schema 和 fixtures 存在，但 trusted Human host 与原子消费不在 repository validator 能力内。
    失败历史: forged trusted、cross-actor transplant、replay 等 fixtures 证明 payload 自证不可接受。
    evidence_refs: [E-009, E-011, E-024]
  - capability_id: CAP-17
    capability: validator 只重新计算 eligibility，不自证、不授权、不执行 transition
    判定: 保留
    理由: A R4 与 R14 的核心边界。
    失败历史: TRANSITION_VALIDATION_SELF_AUTHENTICATION 是 drift ledger 首条修正。
    evidence_refs: [E-009, E-012]
  - capability_id: CAP-18
    capability: communication compliance schema、validator、215-case suite 与 79-case inherited coverage map
    判定: 改造
    理由: 保留测试语义、攻击面和独立 measurement；不把 207 个旧路径整套平移成新 canonical。
    失败历史: INHERITED_FIXTURE_EXECUTION_OVERCLAIM 曾把 inventory 冒充本轮执行结果。
    evidence_refs: [E-011, E-012]
  - capability_id: CAP-19
    capability: neutral mailbox base 与 protocol semantics release head 分离的两提交 release binding
    判定: 保留
    理由: 避免把中性 mailbox base 错作协议语义版本。
    失败历史: PROTOCOL_RELEASE_HEAD_STALE 的 root cause 正是 receipts 锚定 neutral base。
    evidence_refs: [E-013, E-012]
  - capability_id: CAP-20
    capability: bootstrap receipt 对 loaded blobs/digests、role、wire 与 authority boundary 的绑定
    判定: 改造
    理由: 保留确定性字节证明，但继续明确它不证明理解、不认证身份、不授予权限。
    失败历史: stale release、head mismatch、digest mismatch 均已有负例；receipt 曾被误读为能力/权限证明。
    evidence_refs: [E-006, E-011, E-015]
  - capability_id: CAP-21
    capability: per-instance append-only lane、独立 envelope 与 deterministic foreground reducer
    判定: 改造
    理由: 保留避免共享文件覆盖和单写归并语义；路径和 reducer 结构由 B 决定。
    失败历史: shared OUTBOX 多 writer 风险促成 lane；mixed legacy/lane 与 duplicate backend claims 已设拒绝条件。
    evidence_refs: [E-014, E-015]
  - capability_id: CAP-22
    capability: 本地 lane/local bus 作为权威 C1/C2 状态源
    判定: 拒绝
    理由: 当前实现明确仅 C0 与 C1 shadow；把低延迟传输升级为权威会绕过 immutable Git evidence。
    失败历史: 过去将“传输存在”误作“传输授权/可信”的错误已在纪律和 transport matrix 中记录。
    evidence_refs: [E-014, E-017]
  - capability_id: CAP-23
    capability: ai/review/latest 作为活动通讯总线并用 expected-head lease 发布
    判定: 改造
    理由: Git review bus 可作兼容 adapter 和 evidence source；新 canonical 不应永久依赖旧分支命名与共享 latest。
    失败历史: review lease 冲突、stale refs 与 latest 已回到 neutral baseline 表明 mutable branch 不能单独证明当前任务。
    evidence_refs: [E-007, E-015, E-026]
  - capability_id: CAP-24
    capability: append-only drift ledger、prior-prefix/hash-chain 与 recurrence fixture
    判定: 保留
    理由: 将失败历史变成可执行防回归证据，符合本阶段“不丢已付代价”的目标。
    失败历史: DRIFT_LEDGER_HISTORY_UNENFORCED 说明 prose-only append-only 曾不可执行。
    evidence_refs: [E-012]
  - capability_id: CAP-25
    capability: CODEX task input、Goal/large-task completion-preserving 与三次失败预算
    判定: 改造
    理由: 执行纪律继续适用，但通用 workflow 合同最终属于 P3，不应塞进 P1 通讯事件模型。
    失败历史: 任务碎片化、缺失 critical fields 和重复 repair 曾增加 Human 成本并制造假完成。
    evidence_refs: [E-027]
  - capability_id: CAP-26
    capability: local Git/API connector/CLI 分传输门禁与 publisher authority 分离
    判定: 保留
    理由: 同一发布语义必须在不同传输上产生等效证据，身份绑定与工具机会分开。
    失败历史: 执行者曾把“API 无法运行 hook”误报为无发布权限，并在同一传输上作出相反判断。
    evidence_refs: [E-017, E-018]
  - capability_id: CAP-27
    capability: 执行者与独立审核者分离、作者不设计自己的最终验证
    判定: 保留
    理由: 阻止 validator 迎合和自报计数成为验收结论。
    失败历史: 六轮审查重复出现 claim 宽于 evidence；本轮 T3 也发生“Human 已确认”与空门文件冲突。
    evidence_refs: [E-001, E-027]
  - capability_id: CAP-28
    capability: pointer、按需读取与 quiet output 的最低充分 token 纪律
    判定: 保留
    理由: 可减少重复正文和无界输出，同时不牺牲 primary evidence。
    失败历史: 曾出现 1.79M 字符递归输出和大量无界读取；证明成本控制需在 call site 执行。
    evidence_refs: [E-022, E-027]
  - capability_id: CAP-29
    capability: token_profile_run.v1 匹配基线与量化成本阈值
    判定: 待验证
    理由: 合同要求 3–5 组匹配 run，但仓库当前无记录集，旧实际 handoff 的 category metrics 仍为 null。
    失败历史: 缺失指标若被估算填充会制造不可比较成本结论；现规范要求 null 而非推断。
    evidence_refs: [E-022, E-023]
  - capability_id: CAP-30
    capability: live Communication Gateway、UI middleware、polling 或 runtime interception
    判定: 待验证
    理由: repository validator 明确不拦截 live output，不改变 STATE，也不执行 CAS/授权消费。
    失败历史: 文档曾容易把 gate 已实现表述成 runtime 已激活，README 因此明确列出 non-goals。
    evidence_refs: [E-024]
  - capability_id: CAP-31
    capability: 从新通讯入口回到旧 bootstrap 的真实 rollback
    判定: 待验证
    理由: 当前只有旧 bootstrap 与切换前置协议，没有新 canonical 或真实 rollback run。
    失败历史: A 将未能证明真实 rollback 设为 adapter_only kill criterion，说明文档步骤不能冒充执行结果。
    evidence_refs: [E-025]
  - capability_id: CAP-32
    capability: 全部 core 窗口与非 08_os 任务类型的可执行枚举
    判定: 改造
    理由: 本 run 已用 immutable manifest/tree 得到 8 类与 34 个 08_os 外 core-owned paths；live window 实例仍非 Git 可观测。
    失败历史: Human 确认中的 37 条和“5 个已登记任务文件”均与当前可复算结果不完全一致。
    evidence_refs: [E-019, E-020, E-021]
  - capability_id: CAP-33
    capability: .ai/TASKS tracked task carrier 与 generated index 路由
    判定: 改造
    理由: carrier 有实际价值，但 ownership、tracked、indexed 和 active pointer 必须分别表达。
    失败历史: 当前 5 个 tracked 文件只有 4 个被 index 覆盖，漏项证明索引不能替代 tree。
    evidence_refs: [E-021]
  - capability_id: CAP-34
    capability: source publication mailbox neutralization 与 protected master/Human gate
    判定: 保留
    理由: 防止活动任务状态进入 durable source，并保持 master/cutover 的 Human 决策权。
    失败历史: source mailbox residue 和模型把 human_gate 文本当批准均有专门 gate/fixtures 防护。
    evidence_refs: [E-007, E-009, E-018]

ambiguity_tracking:
  - ambiguity_id: A-AMB-01
    topic: 兼容观察期时长、样本量、跨传输覆盖与通过阈值
    stage2_status: unresolved_but_not_stage2_blocking
    evidence: 现有协议只定义风险和门，暂无新 canonical 观察样本。
    handoff: 阶段三约束 + 阶段四冻结测试阈值。
  - ambiguity_id: A-AMB-02
    topic: 全部 core 窗口枚举、迁移顺序与新窗口归属
    stage2_status: partially_resolved
    evidence: immutable base 上 8 类、34 个 08_os 外 core-owned paths 可重跑；live 窗口实例不可由 Git 观测。
    handoff: B 使用 path-based coverage rule；切换前由 runtime inventory 补 live instance/migration order。
  - ambiguity_id: A-AMB-03
    topic: connector 与 local Git 等价门禁
    stage2_status: partially_resolved
    evidence: 传输矩阵定义 replacement gate；当前 receipt 中 API connector 不可用，未实测生产 CAS。
    handoff: connector 可用环境的独立 capability/negative test。
  - ambiguity_id: A-AMB-04
    topic: 新 canonical 的 event/pointer/state/brief/lane/release 文件版本关系
    stage2_status: deferred_by_stage_boundary
    evidence: 旧栈提供候选不变量，但选择具体结构属于 B。
    handoff: 03_结果建模。
  - ambiguity_id: A-AMB-05
    topic: trusted Human host 注入 action-bound authorization 与跨传输防重放
    stage2_status: unresolved
    evidence: schema/fixtures 存在，live host verifier、replay store 与原子消费未实现。
    handoff: B 安全边界 + 阶段四/六实测。
  - ambiguity_id: A-AMB-06
    topic: 真实 rollback 的在途状态、恢复点、数据损失与续跑标准
    stage2_status: unresolved
    evidence: 旧 bootstrap 可读，但尚无新 canonical 和真实 rollback run。
    handoff: B 定义候选语义，阶段四冻结，阶段六/七真实执行与独立复验。
  - ambiguity_id: A-AMB-07
    topic: 最低充分 token、匹配旧基线、计量口径和样本数
    stage2_status: escalated
    evidence: TOKEN_USAGE_PROFILE 要求 3–5 matched runs；仓库无 run records，实际 handoff category metrics 为 null。
    handoff: >-
      在阶段四冻结 R8 阈值前，收集同 task type/scale/acceptance 的旧入口与候选入口各至少 3–5 组
      token_profile_run.v1；不可观测字段保持 null。此前禁止声称“成本不上升”或给数值阈值。
  - ambiguity_id: A-AMB-08
    topic: 观察期结论与未来新领域仓 Human 决定的版本绑定形状
    stage2_status: deferred_by_stage_boundary
    evidence: A 固定必须绑定且两道门不可互相继承，具体载体未决定。
    handoff: P1 B 提出约束，P5 release design 与 Human gate 最终裁定。
