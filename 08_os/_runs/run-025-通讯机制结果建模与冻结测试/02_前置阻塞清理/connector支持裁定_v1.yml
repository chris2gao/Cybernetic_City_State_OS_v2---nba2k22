decision_kind: P1_transport_support_boundary
base_sha: 822fb2d1d6be39cd0777f2a26a4febc7b2a55f15
evidence_refs: [E-017, E-018, E-024]
canonical_support_matrix:
  local_git:
    mode: read_write_candidate
    required_equivalence_evidence:
      - authenticated principal binding
      - exact branch and head binding
      - registered hook guard execution opportunity
      - non-force publication and remote read-back
      - failure surfaced before state advancement
  github_cli:
    mode: read_write_candidate
    required_equivalence_evidence:
      - authenticated principal binding
      - exact expected remote head
      - non-force compare-and-swap
      - allowed-path verification
      - remote commit and changed-path read-back
      - failure surfaced before state advancement
  github_api_connector:
    mode: excluded
    reason: >-
      run-020 实测 available=false，当前没有生产 CAS、read-back、actor binding 正负例；规范上
      存在 replacement gate 不等于该传输已被实测。
    invalidation_condition: >-
      一旦任一目标环境实测 connector available=true，本排除自动失效；进入 P1 canonical
      支持矩阵前必须重新执行身份、expected-head CAS、allowed paths、read-back、失败显露及
      授权防重放的正负例，并由独立审核确认。
  unknown:
    mode: fail_closed
R6_scope_for_P1:
  supported_equivalence_pair: [local_git, github_cli]
  connector_claim: not_verified
  rule: >-
    等价只按实际证据合同判定；不得用“规范写了相同语义”代替任何传输的生产实测。
