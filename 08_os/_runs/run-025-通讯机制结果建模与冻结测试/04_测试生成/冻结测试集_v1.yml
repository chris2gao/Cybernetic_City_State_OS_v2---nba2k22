凭证选择记录:
  裁定人: "Claude（T56 派单/审核方，依据 Human 授权）"
  时间: 2026-08-02
  依据证据: [E-003, E-004, E-009, E-010, E-011, E-012, E-014, E-017, E-022, E-023, E-024, E-025, E-027]
  选定属性:
    - provider-neutral 角色与三通道
    - immutable ref、current-head CAS 与单写状态
    - actor、validation、authorization 分层与防重放
    - 传输等价的实测边界
    - fast/full 初始化一致性
    - matched Token 测量完整性
    - core 窗口覆盖、rollback 与 adapter_only kill criterion
  为何是这些: >-
    这些属性直接覆盖 A v2 的 R1–R14、方案 v2 §3.5 的攻击面和阶段二已记录的真实 drift；
    未把 B 的设计文本当判据，只用 R 编号与 E 编号决定通过语义。
  度量选择: >-
    结构合同用 parser/validator，Git 与传输用 expected-head CAS/read-back，状态与授权用重放和并发负例，
    Token 用 matched token_profile_run.v1，窗口用可重跑 host/worktree inventory，rollback 用真实演练。
  容差: >-
    结构、授权、重放、单写、引用与 branch/head 冲突零容忍；不可观测项必须明确 not_observable。
    成本只记录实际比较，冻结阶段不设置兼容观察期的数值阈值。

