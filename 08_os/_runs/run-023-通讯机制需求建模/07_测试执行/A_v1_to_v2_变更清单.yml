semantic_changes:
  - path: 约束[17]
    operation: add
    old: null
    new: B 只定义兼容观察期阈值的维度，包括真实任务数、传输类型覆盖、双权威事件数与 rollback 次数；不得给数值，数值由阶段四据实测冻结。
    basis: 裁定1
  - path: 约束[18]
    operation: add
    old: null
    new: 当前信任根是 Human 在本机操作的 shell 与其 git 凭据；该当前态事实不得外推为目标态授权机制已经完成。
    basis: 裁定2
  - path: 约束[19]
    operation: add
    old: null
    new: "`CITYSTATE_ALLOW_MASTER=1` 只计为防误操作机制，不构成 action-bound authorization；它不绑定具体动作或事件，且可被进程设置并重复使用。"
    basis: 裁定2
  - path: 约束[20]
    operation: add
    old: null
    new: 目标态 action-bound authorization 必须由宿主注入、绑定具体动作与事件，并一次性原子消费以防重放。
    basis: 裁定2
  - path: 约束[21]
    operation: add
    old: null
    new: 可信 Human host 的实际强度评估与加固留在 P4b 安全边界，不在 P1 结果模型中宣告完成。
    basis: 裁定2
  - path: 约束[22]
    operation: add
    old: null
    new: 真实 rollback 的损失边界为：任何已 push 到远端的 commit 一律不得丢失；未提交工作区内容允许丢失；在途任务必须可从耐久证据恢复并续跑。
    basis: 裁定3
  - path: 约束[23]
    operation: add
    old: null
    new: 对通讯观察期结论与未来新领域仓 Human 决定的版本绑定，B 只提出约束；最终载体由 P5 release design 与 Human gate 决定。
    basis: 附带处理
  - path: 未解歧义[0].为何未解
    operation: replace
    old: v2 规定了必须观察的风险与门的边界，但具体阈值需要阶段二从失败历史、成本和可观测能力中提炼。
    new: Human 已裁定 B 只定义计数维度而不给数值；具体阈值必须由阶段四依据实测冻结。
    basis: 裁定1
