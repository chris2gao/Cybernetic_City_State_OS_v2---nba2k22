# decisive-source: 2026-08-02_阶段二收口与A修订派单.md §3（Human 三项裁定与附带处理）

目标: >-
  使全部 core 窗口通过 provider-neutral 的单一通讯权威完成可审计、可验证且可真实 rollback 的
  任务闭环，并在兼容观察期内保持通讯 canonical、Token/资源 canonical、workflow canonical 与
  新 OS 默认活动系统宣告门之间的分层权威。

成功判据:
  - 描述: >-
      [R1] 一个真实任务中，Human、前台审核与派单者、后台执行者能够按明确接收者和稳定角色完成
      派单、执行回传与决定传递；更换兼容 provider 后，同一角色合同和权限边界不变。
    可观察: true
  - 描述: >-
      [R2] machine pointer、Human operational content、durable Human brief 在结构和载体上可区分；
      长任务、完整报告、日志与证据只通过可解引用的耐久引用传递，短消息不复制正文。
    可观察: true
  - 描述: >-
      [R3] 每个会改变任务状态的通讯事件都能回读其 task、branch、精确 head、status、证据引用和
      适用授权引用；任一绑定缺失、陈旧或彼此矛盾时不能推进状态。
    可观察: true
  - 描述: >-
      [R4] 状态新鲜度、actor identity、验证证据与动作授权由互不替代的证据表示；新鲜 head、
      自报 pass、角色名或 human_gate 文本均不能单独授权受保护动作。
    可观察: true
  - 描述: >-
      [R5] dispatch、completion、review、revision、blocked、conflict 与 Human gate 都有唯一、
      可验证的事件语义；重复、乱序、未知或不满足前置条件的事件不能产生第二次 transition。
    可观察: true
  - 描述: >-
      [R6] local Git、GitHub connector 与 GitHub CLI 三类传输都能执行同一语义合同，并分别证明
      其身份、精确 head 绑定、原子或 CAS 发布、回读和失败显露边界；未知传输 fail closed。
    可观察: true
  - 描述: >-
      [R7] 同一连续上下文可走只加载当前状态与非空引用的 fast path；新上下文、协议变化或状态
      不确定时必须完成 full initialization，且两条路径恢复出的有效任务状态一致。
    可观察: true
  - 描述: >-
      [R8] 正常通讯使用最低充分 token 的 pointer 与按需引用；与旧基线的匹配任务测量显示成本
      满足阶段四冻结的阈值，且独立证据读取、验证、审计追踪和 Human-facing 完整性没有被删减。
    可观察: true
  - 描述: >-
      [R9] 任一时刻恰有一个通讯状态写入权威；adapter、shadow 与 mirror 都明确标记非权威，
      双写或两套入口都能独立改变当前状态的测试必须失败并阻止切换。
    可观察: true
  - 描述: >-
      [R10] P1 通讯 canonical 切换门通过时，全部 core 窗口切到新通讯入口，并真实执行一次回到
      已验证旧 bootstrap 的 rollback；切换前后 Token/资源仍指向 `.ai/TOKEN_USAGE_PROFILE.md`，
      workflow 仍指向 `01_workflow` 既有规格，直到各自后续阶段另行切换。
    可观察: true
  - 描述: >-
      [R11] 通讯 canonical 切换门与 P5 新 OS 默认活动系统宣告门分别产生版本绑定 evidence；
      第一道门不能冒充第二道门，新领域仓仅能在通讯兼容观察期通过后由同一 Human 决定明确批准建立。
    可观察: true
  - 描述: >-
      [R12] canonical、boot、loader、registry、validator 与 compatibility adapter 均可从固定入口发现，
      并由一个跨模型真实任务覆盖派单、执行、审核、定点修复、Human gate 和完成闭环。
    可观察: true
  - 描述: >-
      [R13] 冻结测试能够证明当前状态唯一、旧事件不可重放、冲突可显露、引用可解、branch/head
      一致、rollback 可执行，并覆盖 core 仓内 `08_os` 之外的任务类型与全部 core 窗口。
    可观察: true
  - 描述: >-
      [R14] 在任务修正预算内若仍不能证明状态唯一性、事件防重放或真实 rollback，系统不切换通讯
      canonical，成果被确定性标记为 `adapter_only`，全部 core 窗口继续使用旧通讯入口。
    可观察: true

边界:
  - 本 A 只定义通讯、当前状态与 handoff 的需求，不实现协议、schema、validator、loader、adapter、gateway、scheduler 或 Coordinator。
  - 本阶段不修改 `.ai` 通讯协议、bootstrap、AGENTS、registry 或任何活动 mailbox，不执行通讯 canonical 切换。
  - 不在 A 中选择事件格式、目录布局、数据库、消息队列、connector API 或 CAS 算法；这些属于证据收集后的结果模型 B。
  - 不把 Token/资源机制纳入 P1 实现；P2 完成前其活动权威仍是 `.ai/TOKEN_USAGE_PROFILE.md`。
  - 不把 workflow runner 纳入 P1 实现；P3 完成前仍使用 `01_workflow` 既有阶段规格。
  - 不在 P1 宣告新 OS 为默认活动系统，不退役或删除旧 `.ai` canonical，不把通讯切换结论复制成 P5 结论。
  - 不创建、恢复或解冻任何领域仓；新领域仓建立必须等待通讯兼容观察期结论并由 Human 另行批准。
  - 不把 provider 名称、模型自报角色、状态新鲜度、验证结果或描述性 human_gate 字段视为动作授权。
  - 不设计或处理 secrets、凭证、私钥、token 值和宿主机密钥库；传输能力只描述必要边界和失败行为。
  - 不要求保留模型私有推理或完整聊天记录；只保留下游消费、独立审核与恢复所需的耐久内容和引用。

约束:
  - 必须恰好使用 `需求建模schema_v1.md` 的八个顶层槽位；不得增加第九个语义槽位或新建替代 schema。
  - A 只有在 Human 明确确认并绑定候选版本与内容摘要后才完成；任何语义变更都使旧确认失效并要求新版本重新确认。
  - 通讯语义按稳定角色而非 provider 品牌定义，环境、模型、lane、load profile 和传输名称均不自行授予权限。
  - machine pointer 必须保持可机器解析且与 Human operational content 分离；长内容与完整证据必须先耐久发布，再发送短引用。
  - task、branch、head、status、actor origin、证据和授权必须显式绑定；缺失、陈旧、冲突、不可解引用或重复消费时 fail closed。
  - 状态证据、actor identity、验证 provenance 与 Human authority 是独立边界，validator 只能证明 eligibility，不能授权或执行 transition。
  - C2 或其他受保护动作必须使用来自可信 Human host、绑定具体动作与事件的独立授权；普通文本确认和 payload 自证无效。
  - 每个状态 transition 必须唯一且可重放检测；发布需使用适合该传输的原子更新或 expected-head CAS，并在发布后回读。
  - 同一时刻只允许一个 authoritative writer；兼容 adapter、shadow 或 mirror 不得独立推进当前状态，也不得与 canonical 双写。
  - fast path 只适用于同一连续上下文且协议与状态确定的情形；新上下文、协议变化、引用异常或状态不确定必须 full initialization。
  - token 优化只能减少重复加载与正文传输，不得减少决定性 primary evidence、独立审核、验证、问责或 Human-facing 必需内容。
  - P1 完成时只有通过通讯 canonical 切换门才能切换全部 core 窗口；否则按 kill criterion 降级为 `adapter_only`。
  - 通讯切换必须保留 Token/资源和 workflow 的旧 canonical 指针，且不得授权新 OS 默认活动、旧系统退役或新领域仓建立。
  - compatibility adapter 必须支持从新通讯入口回到已验证旧 bootstrap 的真实 rollback，并保存可审计的 rollback evidence。
  - 通讯 canonical 切换门与 P5 默认活动系统宣告门必须分别形成版本绑定 evidence，不能相互继承结论。
  - 新领域仓建立必须在通讯兼容观察期通过后，与该观察结论绑定在同一个 Human 决定中；此前一律禁止建立。
  - capability receipt 必须在切换与 transport 验证时可用；环境未知字段保持 `not_observable`，不得用历史猜测代填。
  - B 只定义兼容观察期阈值的维度，包括真实任务数、传输类型覆盖、双权威事件数与 rollback 次数；不得给数值，数值由阶段四据实测冻结。
  - 当前信任根是 Human 在本机操作的 shell 与其 git 凭据；该当前态事实不得外推为目标态授权机制已经完成。
  - "`CITYSTATE_ALLOW_MASTER=1` 只计为防误操作机制，不构成 action-bound authorization；它不绑定具体动作或事件，且可被进程设置并重复使用。"
  - 目标态 action-bound authorization 必须由宿主注入、绑定具体动作与事件，并一次性原子消费以防重放。
  - 可信 Human host 的实际强度评估与加固留在 P4b 安全边界，不在 P1 结果模型中宣告完成。
  - 真实 rollback 的损失边界为：任何已 push 到远端的 commit 一律不得丢失；未提交工作区内容允许丢失；在途任务必须可从耐久证据恢复并续跑。
  - 对通讯观察期结论与未来新领域仓 Human 决定的版本绑定，B 只提出约束；最终载体由 P5 release design 与 Human gate 决定。

术语:
  - 词: 全部 core 窗口
    含义: >-
      core 仓中所有使用通讯、状态或 handoff 入口的当前及新开工作窗口，不限于 `08_os` 任务，
      也不以 provider、客户端或执行工具区分是否纳入切换范围。
    别名: [所有 core 会话, core 全窗口]
  - 词: provider-neutral
    含义: >-
      合同按 Human、前台审核与派单、后台执行与交接等稳定角色定义；兼容 provider 可占据角色，
      但 provider 品牌、模型名称或能力声明不产生权限。
    别名: [供应商中立, 模型无关]
  - 词: 单一通讯权威
    含义: >-
      任一时刻只有一个入口能够权威地改变当前通讯状态；其他 adapter、shadow 或 mirror 只能读取、
      转换或校验，不能形成第二个独立写入事实源。
    别名: [单写权威, single writer, 单一 canonical]
  - 词: 通讯 canonical
    含义: >-
      对当前消息、状态、事件、handoff 与恢复入口具有规范解释权和写入权的通讯机制版本及其绑定证据。
    别名: [通讯权威入口, 通讯主路径]
  - 词: 任务闭环
    含义: >-
      一个真实任务从 dispatch 经执行、completion、review、必要 revision，到 Human gate 或最终完成，
      每一步均能从耐久证据恢复和验证的全过程。
    别名: [真实任务闭环, 端到端通讯闭环]
  - 词: 可审计
    含义: 每个重要消息、状态变化、决定、失败与 gate 都能从耐久原始证据追溯其来源、顺序、绑定和结果。
    别名: [可追溯, auditability]
  - 词: 可验证
    含义: 需求能够转成确定性正负例、冲突、重放、迁移与回滚测试，并由独立审核者从原始产物复验。
    别名: [可测试, verifiability]
  - 词: machine pointer
    含义: >-
      面向机器消费的短小、固定结构消息，只承载身份、状态及耐久引用，不承载长任务、报告或 Human prose。
    别名: [机器指针, pointer-only 消息]
  - 词: Human operational content
    含义: >-
      面向 Human 的当前决定、行动请求、风险与必要说明；它与 machine pointer 结构分离，必要时由
      durable Human brief 承载。
    别名: [Human 操作内容, 人类操作说明]
  - 词: durable Human brief
    含义: >-
      已耐久发布、可按 immutable ref 解引用的人类简报，用于保存短指针无法安全承载的完整 Human-facing 内容。
    别名: [耐久人类简报, Human brief]
  - 词: 状态新鲜度
    含义: 当前读取的状态与活动 head 是否一致的证据；它说明“现在是什么”，不说明“允许做什么”。
    别名: [freshness, 当前状态证据]
  - 词: actor identity
    含义: >-
      将具体事件与稳定角色、实际来源和任务上下文绑定的身份事实；身份成立仍不等于具备受保护动作授权。
    别名: [actor origin, 行为者身份]
  - 词: 动作授权
    含义: >-
      对某一具体状态改变或受保护操作生效、由可信授权源注入并绑定该动作与事件的权限证据，
      不能由消息 payload、角色自报或验证通过自行生成。
    别名: [Human authority, AuthorizationContext]
  - 词: fast path
    含义: 同一连续上下文中，在协议与状态未变化时只读取当前状态和最新非空引用的恢复路径。
    别名: [同上下文快速路径, 增量恢复]
  - 词: full initialization
    含义: >-
      在新上下文、协议变化或状态不确定时，从固定 bootstrap、角色规则、活动状态及全部必需引用恢复执行前提的完整初始化。
    别名: [完整初始化, context-boundary load]
  - 词: 兼容观察期
    含义: >-
      通讯 canonical 切换后、旧入口退役或新领域仓建立前，以单一权威模式持续观测状态一致性、
      drift、rollback 与真实任务闭环的版本绑定时期。
    别名: [通讯观察期, compatibility observation]
  - 词: 真实 rollback
    含义: >-
      在受控真实任务路径中实际从新通讯入口恢复到已验证旧 bootstrap，并证明状态、引用和未完成任务仍可安全继续；
      仅有文档步骤、mock 或未执行脚本不算成功。
    别名: [实际回滚, rollback 演练]
  - 词: 分层权威
    含义: >-
      通讯、Token/资源、workflow 与新 OS 默认活动声明分别由各自 canonical 和阶段门控制，
      任一层的切换不自动改变或授权其他层。
    别名: [分层 canonical, 权威分离]
  - 词: Token/资源 canonical
    含义: P2 完成并另行切换前，由 `.ai/TOKEN_USAGE_PROFILE.md` 承担的 Token 与资源路由权威。
    别名: [资源权威, Token 路由]
  - 词: workflow canonical
    含义: P3 完成并另行切换前，由 `01_workflow` 既有阶段规格承担的工作流权威。
    别名: [工作流权威, 阶段规格]
  - 词: 通讯 canonical 切换门
    含义: >-
      P1 完成时仅决定全部 core 窗口是否切换通讯、状态与 handoff canonical 的技术与 Human gate；
      通过不等于新 OS 整体接管。
    别名: [第一道门, P1 通讯门]
  - 词: 新 OS 默认活动系统宣告门
    含义: >-
      P5 在通讯、资源、workflow、安全、审计、恢复与发布等条件全部满足后，才可决定新 OS 是否成为默认活动系统的独立门。
    别名: [第二道门, P5 默认活动门]
  - 词: adapter_only
    含义: >-
      P1 未通过状态唯一性、防重放或真实 rollback kill criterion 时的降级状态；成果只能兼容或验证，
      不能成为通讯 canonical。
    别名: [适配器降级, 非 canonical 候选]

关联领域:
  - 领域: 多模型与人机协同通讯
    为什么相关: 需要在 Human、前台和后台稳定角色之间表达消息、决定、修订和 Human gate。
  - 领域: 分布式状态机与事件溯源
    为什么相关: 状态唯一性、事件顺序、防重放、幂等消费、冲突和恢复都依赖明确事件语义。
  - 领域: 身份、授权与最小权限
    为什么相关: 必须把 actor identity、状态证据和动作授权分开，并对受保护 transition fail closed。
  - 领域: Git 引用、CAS 与发布原子性
    为什么相关: branch/head 绑定、immutable evidence、expected-head 更新和发布后回读是主要传输不变量。
  - 领域: 多传输适配与能力发现
    为什么相关: local Git、connector 与 CLI 的可见能力和门禁不同，但必须保持同一语义结果。
  - 领域: 可观测性、审计与恢复
    为什么相关: 每个状态改变、失败、冲突、gate 与 rollback 都必须留下可独立复验的耐久证据。
  - 领域: 兼容迁移与单写权威
    为什么相关: 新旧入口在 shadow、adapter、切换、观察与退役期间必须避免双权威和状态漂移。
  - 领域: LLM 上下文与 Token 工程
    为什么相关: pointer、durable ref、fast path 和 full initialization 共同决定通讯成本及证据完整性。
  - 领域: 工作流与阶段门治理
    为什么相关: 通讯切换、默认活动宣告、领域仓建立和旧系统退役是不同阶段、不同授权的决定。

假设:
  - 假设: 稳定角色合同可以覆盖不同 provider 与模型，而不依赖 provider 专属权限语义。
    如果不成立会怎样: 必须在 B 中引入受控的 provider 能力差异层，并重新验证每类角色和传输。
  - 假设: 一个权威状态源加非权威 adapter 或 shadow 足以覆盖兼容期，不需要双写。
    如果不成立会怎样: 单一权威约束无法满足，P1 不得切换 canonical，成果只能保持 `adapter_only`。
  - 假设: immutable refs、事件摘要与 expected-head CAS 足以检测陈旧状态、重放和并发冲突。
    如果不成立会怎样: B 必须寻找更强的状态协调机制，且相关冻结测试在方案确定前保持阻塞。
  - 假设: local Git、GitHub connector 与 GitHub CLI 都能提供或组合出身份、精确 head、原子发布和回读所需证据。
    如果不成立会怎样: 不满足门禁的传输必须从 canonical 支持矩阵排除或降级为只读路径。
  - 假设: pointer 加按需耐久引用能够显著降低重复上下文，同时保留独立审核需要的全部 primary evidence。
    如果不成立会怎样: 必须提高默认加载量或修改载体边界，Token 成本目标需要重新定基线。
  - 假设: 旧 `.ai` bootstrap 能在观察期内作为已验证 rollback 目标继续安全运行。
    如果不成立会怎样: P1 在新的恢复目标经独立验证前不得切换通讯 canonical。
  - 假设: 能够枚举并测试全部 core 窗口及至少一个 `08_os` 之外的真实 core 任务类型。
    如果不成立会怎样: “全部 core 窗口切换”的覆盖无法证明，第一道门不能通过。
  - 假设: 一个有界兼容观察期能够发现双权威、状态 drift、重放、跨传输差异和 rollback 缺陷。
    如果不成立会怎样: 需要扩大观察样本或引入持续验证，旧入口退役和新领域仓建立继续禁止。
  - 假设: capability receipt 能在各传输验证与切换时提供足够的环境事实，未知能力可以诚实标记为 `not_observable`。
    如果不成立会怎样: 依赖未知能力的传输或测试必须停止，不能用历史值或推测补齐。

未解歧义:
  - 歧义: 兼容观察期的最短时长、最低真实任务样本量、跨传输覆盖和“通过”阈值尚未确定。
    为何未解: Human 已裁定 B 只定义计数维度而不给数值；具体阈值必须由阶段四依据实测冻结。
    影响: 高
    阻塞范围: [04_测试生成]
  - 歧义: “全部 core 窗口”的可执行枚举、已有窗口迁移顺序和切换期间新开窗口的归属算法尚未确定。
    为何未解: A 固定覆盖范围，具体发现与迁移机制依赖当前 bootstrap、客户端和活动任务证据。
    影响: 高
    阻塞范围: [04_测试生成, 06_执行]
  - 歧义: connector 无本地 hook 或 shell 时，哪组 API/CAS/read-back 证据与 local Git 门禁等价尚未确定。
    为何未解: 需要阶段二逐一实测传输能力，A 不能凭 provider 名称假定等价。
    影响: 高
    阻塞范围: [04_测试生成, 06_执行]
  - 歧义: 新 canonical 的事件、pointer、当前状态、Human brief、lane 与 release binding 应采用哪些具体文件和版本关系。
    为何未解: 这是结果模型 B 必须基于旧系统证据作出的结构选择，不属于需求槽位。
    影响: 中
    阻塞范围: [04_测试生成]
  - 歧义: 宿主注入的 action-bound authorization 如何实现一次性 replay store、原子消费与跨传输等价验证尚未确定。
    为何未解: Human 已裁定当前信任根和目标态形状；实现细则、实际强度与加固仍需阶段四和 P4b 安全证据。
    影响: 高
    阻塞范围: [04_测试生成, 06_执行]
  - 歧义: 真实 rollback 的恢复点具体选取与“在途任务可续跑”的判定细则尚未确定。
    为何未解: Human 已裁定 commit、未提交工作区与在途任务的损失边界；恢复点和续跑判定仍需阶段四冻结并在阶段六、七实测。
    影响: 高
    阻塞范围: [04_测试生成, 06_执行, 07_测试执行]
  - 歧义: “最低充分 token 且成本不上升”的匹配旧基线、计量口径和统计样本数尚未确定。
    为何未解: P1 A 只固定不以省 token 换取证据；量化阈值必须使用可比较实测而非估计。
    影响: 中
    阻塞范围: [02_信息收集与提炼, 04_测试生成]
  - 歧义: 通讯观察期结论与未来新领域仓建立 Human 决定之间的版本绑定 evidence 具体形状尚未确定。
    为何未解: A 固定两者必须绑定，载体和验证规则属于 P1 B 与后续 P5 release 设计。
    影响: 中
    阻塞范围: [04_测试生成]
