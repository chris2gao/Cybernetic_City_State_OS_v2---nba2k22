    - 08_os/_runs/run-20260810-根级保留文件重写与依赖盘点-001/02_保留清单/依赖边清单_v1.yml
    - 08_os/_runs/run-20260810-根级保留文件重写与依赖盘点-001/02_保留清单/执行报告_v1.yml
  allowed_write_paths:
