objective: >-
  在不删除旧 OS、不移动 08_os、不修改新 OS canonical 的前提下，先把确定会保留的根级全局
  文档改写为“当前 08_os 是唯一活动 OS 事实源”的过渡版本；随后从这些改写后的保留文件出发，
  做一次非 08_os 路径的真实依赖闭包盘点，形成 Human 可裁决的保留/迁移/删除候选清单。

Human_intent:
  - 本轮只做两个步骤：先重写，再统计。
  - 08_os/** 整体保留，本轮不对其内部文件逐项做保留裁决。
  - 不因旧文件现存就把它算作应保留；必须区分活动依赖、过渡依赖、历史描述和删除候选。
  - CC 执行，ChatGPT 独立审查；双方需对最终保留清单达成一致后才进入物理删除阶段。

