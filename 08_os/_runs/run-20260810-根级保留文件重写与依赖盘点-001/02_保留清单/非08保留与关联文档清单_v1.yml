# ===========================================================================
# 2. MIGRATE, THEN DELETE THE SOURCE
# ===========================================================================
migrate_then_delete_source:
  - path_or_glob: .ai/REPOSITORY_PUBLISHER_AUTHORITY.yml
    classification: migrate_then_delete_source
    dependency_type: canonical_authority_reference
    referenced_by:
      - 08_os/开发入口与单窗口任务规范_v1.md
      - 08_os/05_registry/repository_guards_v1.yml
      - AGENTS.md
      - AGENT_WORKING_DISCIPLINE.md
      - CLAUDE.md
      - GEMINI.md
      - .githooks/README.md
    why_needed_or_why_not: >-
      Live and load-bearing: it answers who may publish at all and which acts stay
      action-bound under the widest Human grant. Seven files across the active OS,
      the retained root surface and the guard documentation resolve to it. It is
      also core-owned for the same reason .githooks/ is - a domain able to edit its
      own copy could widen its own publication grant.
    migration_target_if_required: >-
      A canonical location under 08_os/** - the registry area is the natural home
      given 08_os/05_registry/repository_guards_v1.yml already points at it. Its
      migration is a declared non-goal of this task, so the source stays.
    evidence_ref: 08_os spec section 1.1; repository_guards_v1.yml line 41
    confidence: high
    blocking_for_deletion_of: .ai/

  - path_or_glob: .ai/TOKEN_USAGE_PROFILE.md
    classification: migrate_then_delete_source
    dependency_type: canonical_authority_reference
    referenced_by: [08_os/开发入口与单窗口任务规范_v1.md]
    why_needed_or_why_not: >-
      After the rewrite exactly one live pointer survives: section 12 of the 08_os
      entry lists it as the authority for "token 与风险层级". The risk tiers it names
      are already fully defined in section 7 of that same entry, and this run
      absorbed its remaining Layer-1 discipline into AGENT_WORKING_DISCIPLINE.md -
      complete command capture with exit codes, immutable-versus-mutable caching
      with a fresh read before a protected action, dated routing-only persistence,
      resume by explicit session id, and tool-ACL fail-closed on secrets (the last
      into AGENTS.md Safety Rules). What remains is the dangling pointer, not the
      content.
    migration_target_if_required: >-
      No content migration needed. One line: 08_os spec section 12 must stop citing
      this path. Editing 08_os/** is prohibited this task, so it is returned as a
      finding.
    evidence_ref: 08_os spec section 12; commit 4bd8d4d absorbing the discipline
    confidence: high
    blocking_for_deletion_of: .ai/TOKEN_USAGE_PROFILE.md

  - path_or_glob: .ai/HANDOFF_COMMON_CONVENTIONS.md
    classification: migrate_then_delete_source
    dependency_type: external_convention_dependency
    referenced_by: [Human standing instruction]
    why_needed_or_why_not: >-
      No tracked file references it, so every repository-graph pass classifies it as
      unused. It is not: the Human's standing instruction names it as the authority
      for brief-vault routing, and section 4.1 at line 61 does define the vault root
      E:\newStand\城邦简报, the per-repository suffix rule and the 03_决策档案 target.
      Deleting it removes the cited authority for where every decision record lands.
    migration_target_if_required: >-
      Section 4.1's routing rule needs a home in the retained surface or under
      08_os/** before this file can go. The rest of the file (role defaults,
      forbidden actions, Git defaults, communication and pointer defaults) is old-OS
      material and should be re-derived rather than carried across.
    evidence_ref: .ai/HANDOFF_COMMON_CONVENTIONS.md lines 61-88
    confidence: high
    blocking_for_deletion_of: .ai/

  - path_or_glob: 系统机制总结.md
    classification: migrate_then_delete_source
    dependency_type: explicit_path_reference
    referenced_by:
      - 08_os/03_mechanisms/context_management/依据材料/evidence/00_挖掘目标与领域_v1.md
      - 08_os/03_mechanisms/context_management/依据材料/evidence/00_挖掘目标与领域_v1.yml
      - 08_os/03_mechanisms/context_management/依据材料/evidence/01_内部证据_v1.md
      - 08_os/03_mechanisms/context_management/依据材料/evidence/01_内部证据_v1.yml
      - 08_os/03_mechanisms/context_management/依据材料/evidence/07c_证据索引草案_v1.yml
      - 08_os/03_mechanisms/context_management/依据材料/requirement/A_需求建模_v1.yml
      - 08_os/03_mechanisms/context_management/依据材料/requirement/A_需求建模_v2.yml
    why_needed_or_why_not: >-
      Cited by `path:` in active-OS evidence records for the context-management
      mechanism. The citation is to content, so deleting the file turns seven
      canonical evidence records into unresolvable references - the exact failure
      the discipline's "citations that can still be checked months later" is about.
      It is a legacy root document, so retention in place is not the answer either.
    migration_target_if_required: 08_os/03_mechanisms/context_management/依据材料/
    evidence_ref: 01_内部证据_v1.yml lines 11, 21, 31, 41
    confidence: medium

