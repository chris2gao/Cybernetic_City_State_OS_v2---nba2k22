delete_candidate_summary:
  total_paths: 453
  deleted_this_run: 0
  grouping_rule: >-
    Location decides the group, so a generated index.md inside a legacy tree is
    counted with that tree and nothing is counted twice. Across all non-08 paths,
    107 files are generated navigation artifacts (index.md, abstracts.json,
    repository_index_manifest.json, search_results.json); only the 5 at the
    repository root form their own group below.
  groups:
    - path_or_glob: 06_Silicon_Index/**
      files: 63
      dependency_type: none_after_rewrite
      referenced_by: [CORE_MANIFEST.yml retirement inventory, 08_os/07_content/README.md prose]
      why_needed_or_why_not: >-
        The old bootstrap, constitution digest, awakening contract and silicon-index
        routing. Step 1 removed every startup reference to it from AGENTS.md,
        CLAUDE.md, GEMINI.md and README.md. The only remaining live-surface mention
        is one stale prose sentence in a domain-owned file. Nothing loads it.
      evidence_ref: raw_edges_v1.yml target '06_Silicon_Index/'
      confidence: high

    - path_or_glob: .ai/** except REPOSITORY_PUBLISHER_AUTHORITY.yml, TOKEN_USAGE_PROFILE.md, HANDOFF_COMMON_CONVENTIONS.md, token_profile/ and the PROGRAM_RUNS/ declaration
      files: 281
      dependency_type: none_after_rewrite
      referenced_by: [CORE_MANIFEST.yml retirement inventory]
      why_needed_or_why_not: >-
        The old communication plane: PROTOCOL.md, PROTOCOL_ADHERENCE.md,
        HANDOFF_INIT_PROMPT.md, CODEX_WORK_MECHANISM_PROTOCOL.md,
        CODEX_TASK_INPUT_CONTRACT.md, DEFAULT_LARGE_TASK_EXECUTION_PROFILE.md,
        LONG_RUN_AUTONOMOUS_PROGRAM_PROTOCOL.md, TOKEN_USAGE_OPERATIONAL_NORMS.md,
        AUTONOMOUS_HANDOFF_COMMUNICATION_v0.1.md, MECHANISM_REGISTRY.yml,
        COMMUNICATION_DRIFT_LEDGER.yml, DECISIONS.md, index.md, the STATE/INBOX/
        OUTBOX/HUMAN_BRIEF mailbox quartet, load_profiles/ (4), lanes/ (12),
        role_memory/ (7), token_profile/ (6), communication_compliance/ (207),
        TASKS/ (5), CODEX_REPORTS/ (15), HUMAN_BRIEFS/ (2) and runs/ (12).
        After step 1 no root file and no active-OS file resolves to any of them.
        The one apparent exception, .ai/PROTOCOL.md in a path-ledger test, is a
        synthetic string in a temporary repository and not a read of the file.
      evidence_ref: 依赖边清单_v1.yml inactive_edges; raw_edges_v1.yml
      confidence: high
      note: >-
        .ai/token_profile/ holds six measurement records. Deleting them loses the
        measured history behind the token discipline, not a capability. Flagged
        under Human_decision_required/token_profile_measurements.

    - path_or_glob: generated navigation artifacts at the repository root
      files: 5
      dependency_type: none_after_rewrite
      referenced_by: []
      why_needed_or_why_not: >-
        index.md, abstracts.json, repository_index_manifest.json,
        search_results.json and the generator generate_repository_indexes.py. The
        generator hardcodes 06_Silicon_Index paths and AGENTS.md and never mentions
        08_os, so it indexes a tree that is being retired; nothing in the active OS
        reads its output. A further 102 generated index.md files sit inside the
        legacy trees and are counted with those trees.
      evidence_ref: generate_repository_indexes.py lines 197-232; raw_edges scan
      confidence: high

    - path_or_glob: legacy root documents
      files: 11
      dependency_type: none_after_rewrite
      referenced_by: [CORE_MANIFEST.yml retirement inventory]
      why_needed_or_why_not: >-
        00_City_State_Routing_Table.md, 3号方案.md, True_Fork_Protocol.md,
        INSTANCE_CONFIG.md, 城邦系统需要实现的目标原则.md,
        "Plan 3 External Augmentation OS 总体架构设计方案 v0.1.md",
        开发分支与合并进度总账.md, 未完成任务备忘录.yml, agent-run.ps1,
        agent-status.ps1, agent-stop.ps1. No live-surface reference after step 1.
        The three agent-*.ps1 scripts drive the previous runtime.
      evidence_ref: raw_edges_v1.yml; git ls-files root listing
      confidence: high
      note: >-
        开发分支与合并进度总账.md and 未完成任务备忘录.yml are ledgers whose content may
        still be wanted as history even though nothing loads them.

    - path_or_glob: legacy content trees
      files: 93
      dependency_type: none_after_rewrite
      referenced_by: [CORE_MANIFEST.yml retirement inventory]
      why_needed_or_why_not: >-
        04_Parliament/ (62), system_backbone/ (13), 07_Compiler/ (8),
