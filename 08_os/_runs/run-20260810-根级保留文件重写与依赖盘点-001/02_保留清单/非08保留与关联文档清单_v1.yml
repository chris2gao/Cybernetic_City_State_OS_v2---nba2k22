      The 08_os entry defers to it by name for whole-repository output control,
      evidence honesty and irreversible-action discipline rather than repeating them.
    migration_target_if_required: null
    evidence_ref: 08_os spec opening paragraph and section 12; rewritten this run
    confidence: high

  - path_or_glob: CLAUDE.md
    classification: retain_non_08
    dependency_type: external_tool_conventional_load
    referenced_by: [AGENTS.md, GEMINI.md, README.md, CORE_MANIFEST.yml]
    why_needed_or_why_not: Root router discovered by Claude Code by filename convention.
    migration_target_if_required: null
    evidence_ref: rewritten this run
    confidence: high

  - path_or_glob: GEMINI.md
    classification: retain_non_08
    dependency_type: external_tool_conventional_load
    referenced_by: [AGENTS.md, CLAUDE.md, README.md]
    why_needed_or_why_not: >-
      Root router discovered by Antigravity's directory-scoped rule walk, which
