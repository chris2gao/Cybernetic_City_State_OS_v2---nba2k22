    classification: retain_non_08
    dependency_type: loader_router_reference
    referenced_by: [CLAUDE.md, GEMINI.md, README.md, 08_os/开发入口与单窗口任务规范_v1.md, CORE_MANIFEST.yml]
    why_needed_or_why_not: >-
      Backend startup contract, engineering design principles, Git and publication
      discipline. Discovered directly by Codex and by Antigravity's directory-scoped
      rule walk, so it is loaded whether or not anything points at it.
    migration_target_if_required: null
    evidence_ref: rewritten this run; 08_os spec section 12 权威参考 lists it as 后端执行入口
    confidence: high

  - path_or_glob: AGENT_WORKING_DISCIPLINE.md
    classification: retain_non_08
