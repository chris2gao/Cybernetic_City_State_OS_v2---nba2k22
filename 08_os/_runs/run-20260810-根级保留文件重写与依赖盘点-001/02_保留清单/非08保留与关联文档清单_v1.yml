# ===========================================================================
# 4. HUMAN DECISION REQUIRED
# ===========================================================================
Human_decision_required:
  - id: research_reports_in_core
    path_or_glob: 01_Research_Reports/**
    files: 25
    dependency_type: ownership_manifest_dependency
    question: >-
      CORE_MANIFEST.yml lists 01_Research_Reports/ under domain_owned_paths with the
      comment that core ships none, and core ships 25 files there. One of the two is
      wrong. Either the files are core material and the ownership line is, or the
      ownership line is right and these are a domain's research left in core.
    why_evidence_is_insufficient: >-
      Nothing loads them either way, so the reference graph cannot decide it. The
      answer is a property decision.
    evidence_ref: CORE_MANIFEST.yml domain_owned_paths; git ls-files '01_Research_Reports'
    confidence: high

  - id: project_context_and_architecture
    path_or_glob: [PROJECT_CONTEXT.md, ARCHITECTURE.md]
    files: 2
    dependency_type: none_after_rewrite
    question: >-
      This task was explicitly prohibited from rewriting either file. After step 1
      no active-OS file and no retained root file depends on them; the only mention
      is the rewritten AGENTS.md sentence saying they describe the previous system.
      They are therefore delete candidates on the evidence, but the prohibition
      means the decision is the Human's: rewrite them for the new OS, retire them,
      or keep them as historical description.
    why_evidence_is_insufficient: >-
      The evidence settles that nothing loads them. It does not settle whether the
      architecture description they carry should be reproduced anywhere.
    evidence_ref: raw_edges_v1.yml targets 'PROJECT_CONTEXT.md' and 'ARCHITECTURE.md'
    confidence: high

  - id: ownership_of_root_readme
    path_or_glob: [README.md, PROJECT_CONTEXT.md]
    dependency_type: ownership_manifest_dependency
    question: >-
      Both are declared domain-owned while core physically ships them, and this run
      rewrote README.md in core as the root entry. Should they move to
      core_owned_paths, or stay domain-owned and be replaced per domain after a fork?
    why_evidence_is_insufficient: >-
      Changing an ownership declaration changes what a domain merge is allowed to
      touch. This rewrite therefore left both lists unchanged and corrected only the
      prose that claimed core ships nothing at those paths.
    evidence_ref: CORE_MANIFEST.yml domain_owned_paths comment, amended this run
    confidence: high

  - id: gemini_md_not_core_owned
    path_or_glob: GEMINI.md
    dependency_type: ownership_manifest_dependency
    question: >-
      CLAUDE.md and AGENTS.md are core-owned; GEMINI.md, its exact counterpart, is
      in neither list. A domain could edit it locally with no merge conflict.
    why_evidence_is_insufficient: >-
      Adding an entry is an ownership decision, and omission is not a false claim,
      so this run reported it instead of deciding it.
    evidence_ref: CORE_MANIFEST.yml core_owned_paths
    confidence: high

  - id: os_entry_spec_not_core_owned
    path_or_glob: 08_os/开发入口与单窗口任务规范_v1.md
    dependency_type: ownership_manifest_dependency
    question: >-
      Every sibling 08_os area is core-owned, and this file is the entry the whole
