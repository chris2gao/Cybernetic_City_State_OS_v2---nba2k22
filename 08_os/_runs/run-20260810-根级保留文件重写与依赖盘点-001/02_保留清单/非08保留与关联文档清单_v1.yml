scope:
  covers: every tracked path outside 08_os/**
  excluded_from_itemized_decision: 08_os/**
  excluded_reason: >-
    Human instruction for this run: 08_os/** is retained as a whole and is not
    adjudicated file by file. Confirmed: no entry below proposes any action on an
    08_os path.
  counts:
    tracked_files_total: 1307
    tracked_files_under_08_os: 802
    tracked_files_outside_08_os: 505
    measured_by: 07_测试执行/classify_counts.py at head 4bd8d4d, exit 0
    note: >-
      The 08_os figure includes this run's own evidence files. Bucket totals below
      are produced by that script, which assigns every tracked non-08 path to
      exactly one bucket and fails if any path is unassigned or the sum does not
      equal the file count.
  bucket_totals:
    retain_non_08: 15
    migrate_then_delete_source: 4
    delete_candidate: 453
    Human_decision_required: 33
    unassigned: 0
  deletion_performed: false
  move_or_rename_performed: false

classification_meanings:
  retain_non_08: must remain after the old OS is physically deleted
  migrate_then_delete_source: >-
    the capability or data-root semantics are still required, but the current
    source path sits on the legacy surface; the source may only be deleted after
    the named migration lands
  delete_candidate: no active dependency remains after the step-1 rewrite
  Human_decision_required: >-
    the evidence does not establish whether the artifact should survive, or the
    answer is a preference rather than a fact

# ===========================================================================
# 1. RETAIN
# ===========================================================================
retain_non_08:
