# ---------------------------------------------------------------------------
# INACTIVE edges: mentions that exist but do not make the target live.
# ---------------------------------------------------------------------------
inactive_edges:
  - from_path: 08_os/06_execution/task_discipline/path_ledger/test_changed_path_ledger.py
    to_path: .ai/PROTOCOL.md
    edge_type: explicit_path_reference
    active_after_rewrite: false
    evidence: >-
      lines 46 and 50 use the string as a synthetic "outside the allowlist" path in
      a temporary repository built by the test. The test never reads the real file,
      so deleting .ai/PROTOCOL.md does not affect it. Name coincidence, not a
      dependency.

  - from_path: CORE_MANIFEST.yml
    to_path: 06_Silicon_Index/, 04_Parliament/, 05_Carbon_Index/, 07_Compiler/, system_backbone/, .ai/PROTOCOL.md, .ai/load_profiles/, .ai/lanes/, .ai/role_memory/, .ai/token_profile/, .ai/communication_compliance/, .ai/TOKEN_USAGE_OPERATIONAL_NORMS.md, .ai/CODEX_*, .ai/HANDOFF_INIT_PROMPT.md, .ai/LONG_RUN_AUTONOMOUS_PROGRAM_PROTOCOL.md, .ai/PROTOCOL_ADHERENCE.md, .ai/DEFAULT_LARGE_TASK_EXECUTION_PROFILE.md, .ai/STATE.yml, .ai/INBOX.md, .ai/OUTBOX.md, .ai/HUMAN_BRIEF.md, .ai/TASKS/, .ai/CODEX_REPORTS/, .ai/HUMAN_BRIEFS/, 00_City_State_Routing_Table.md, 3号方案.md, ARCHITECTURE.md, INSTANCE_CONFIG.md, True_Fork_Protocol.md, 城邦系统需要实现的目标原则.md, 01_Research_Reports/, 07_Silicon_Private_Zones/
    edge_type: ownership_manifest_dependency
    active_after_rewrite: false
    evidence: >-
      Retirement inventory, not operational dependency. This rewrite grouped them
      under an explicit "legacy pending Human retirement" comment: ownership says
      who may author a path while it exists, never that the system loads it. A
      manifest entry is the only live-surface mention for every path in this list.

  - from_path: AGENTS.md
    to_path: PROJECT_CONTEXT.md, ARCHITECTURE.md
    edge_type: explicit_path_reference
    active_after_rewrite: false
    evidence: >-
      The rewritten startup section names them only to say they describe the
      previous system and that claims in them are historical. Prose about an
      obsolete path is not a dependency on it.

  - from_path: README.md
    to_path: legacy surface (collective)
    edge_type: explicit_path_reference
    active_after_rewrite: false
    evidence: >-
      The rewritten root entry names the legacy categories - bootstrap, protocol,
      mailbox, state, load-profile, navigation - to declare them inactive, and
      names no individual legacy file.

  - from_path: 08_os/07_content/README.md
    to_path: 06_Silicon_Index/
    edge_type: explicit_path_reference
    active_after_rewrite: false
    evidence: >-
      line 21 describes 06_Silicon_Index/ as "a directory declared shared because
      it holds the bootstrap every ...". After this rewrite that description is
      stale: the bootstrap is no longer the startup path. The sentence is prose in
      a domain-owned file inside 08_os/**, doubly out of scope here, and is
      returned as a finding rather than edited.

  - from_path: 08_os/_dev/**, 08_os/claude与人类的开发对话日志.md, 08_os/01_workflow/**/依据材料/**
    to_path: .ai/CODEX_TASK_INPUT_CONTRACT.md, .ai/communication_compliance/, .ai/TASKS/, .ai/TOKEN_USAGE_PROFILE.md, .claude/, AGENTS.md, CLAUDE.md
    edge_type: historical_incident_example
    active_after_rewrite: false
    evidence: >-
      Development logs, superseded design drafts (_dev holds "活动设计与被取代版本")
      and 依据材料 source material. They record what was true when written. None is
      a loader, a contract or an authority.
