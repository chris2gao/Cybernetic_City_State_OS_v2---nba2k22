schema_version: citystate.dependency_edges.v1
task_id: os-v2-root-global-retention-rewrite-001
run_id: run-20260810-根级保留文件重写与依赖盘点-001
derived_from_head: 4bd8d4d6094721d69676d2e02ca2fa7118167107
base_master: eb4be95a25cb4b0929def284a7fb4b6a412aed55

method:
  live_surface: >-
    08_os/** minus 08_os/_runs/**, plus the seven rewritten retained root files,
    plus the four frozen .githooks infrastructure files. 239 files read.
  excluded_and_why: >-
    08_os/_runs/** is run evidence: it records what a past task did and is not
    loaded by the system, so a mention there is not an active edge. Its mentions
    are counted per target in 07_测试执行/raw_edges_v1.yml rather than dropped.
  matching: >-
    Exact substring occurrence of a tracked non-08 path or non-08 directory
    prefix. Over-reports rather than under-reports: a false edge costs a sentence,
    a missed edge costs a deleted dependency. Every edge below was then opened and
    read at the cited line before being marked active or not.
  raw_output: 08_os/_runs/run-20260810-根级保留文件重写与依赖盘点-001/07_测试执行/raw_edges_v1.yml
  totals:
    non08_targets_including_directories: 608
    targets_with_any_live_surface_mention: 56
    targets_with_no_live_surface_mention: 552

