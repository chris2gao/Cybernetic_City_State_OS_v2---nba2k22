      result: "505 non-08 files, 0 unassigned, bucket sum equals file count"
      exit: 0
    - check: git diff --cached --check
      result: no whitespace errors
      exit: 0
  independently_reproduced: false
  independence_disclosure: >-
    Every result above was produced by the executing session. R1 initially failed on
    nine references and R2 on one; the R1 failures were vendor conventions the file
    documents as absent and a sibling-relative reference, so the checker's model of a
    resolvable reference was corrected and re-run, while the R2 hit was a real
    surviving .ai/PROTOCOL.md dependency in AGENT_WORKING_DISCIPLINE.md and was fixed
    in the file. That distinction - one checker corrected, one file corrected - is
    exactly the kind of call an author should not be the only party to make. The
    reviewer should re-run all four checks and re-derive the classifications from
    raw_edges_v1.yml rather than accepting this report's reading of them.
