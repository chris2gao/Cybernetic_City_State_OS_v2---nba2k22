# ---------------------------------------------------------------------------
# Findings: where the dispatch, the packet or the repository disagreed with
# what was measured. Reality was followed and the conflict is reported.
# ---------------------------------------------------------------------------
findings:
  - id: packet_field_name_breaks_the_repository_ledger_tool
    severity: medium
    measured: >-
      08_os/06_execution/task_discipline/path_ledger/changed_path_ledger.py reads a
      top-level key named allowed_changed_paths, which is also the field name
      section 7 of the 08_os entry requires. This run's packet carries the list
      under scope.allowed_write_paths, so the tool exits 3 on the packet itself.
    action_taken: >-
      The packet was not edited. The list was copied verbatim into
      07_测试执行/allowlist_v1.yml under the name the tool reads, and the ledger ran
      against that. Nothing was added or widened.
    result: paths=10 allowlist=ok, exit 0

  - id: os_entry_section_12_outlives_its_target
    severity: medium
    measured: >-
      Section 12 of 08_os/开发入口与单窗口任务规范_v1.md still lists
      .ai/TOKEN_USAGE_PROFILE.md as the authority for token and risk tiers. After
      this rewrite it is the only live pointer to that file, while the tiers are
      already defined in section 7 of the same document and the discipline is now in
      AGENT_WORKING_DISCIPLINE.md.
    action_taken: Not fixed - 08_os/** is prohibited this task. Returned as a finding.

  - id: content_readme_describes_the_old_bootstrap_as_current
    severity: low
    measured: >-
      08_os/07_content/README.md line 21 describes 06_Silicon_Index/ as the shared
      directory holding the bootstrap every instance starts from. False after step 1.
    action_taken: Not fixed - inside 08_os/** and domain-owned. Returned as a finding.

  - id: manifest_named_four_absent_paths
    severity: medium
    measured: >-
      core_owned_paths listed 07_Execution_Plans/, 0号方案.md, 1号方案.md and
      2号方案.md; git ls-files at the base returns no entry at or under any of them.
    action_taken: >-
      Removed, with the removal and its evidence recorded as a comment in the file.
      This records a false line being deleted, not a file being deleted.

  - id: root_readme_and_project_context_are_shipped_by_core_while_declared_domain_owned
    severity: medium
    measured: Both are tracked in core; domain_owned_paths says core ships nothing there.
    action_taken: >-
      Ownership lists left unchanged - that is a Human decision. Only the prose was
      corrected to state the measured exception. Raised as ownership_of_root_readme.

  - id: publisher_authority_is_the_single_blocking_dependency_on_dot_ai
    severity: high
    measured: >-
      Of 290 tracked files under .ai/, exactly three carry a live dependency after
      the rewrite, and only .ai/REPOSITORY_PUBLISHER_AUTHORITY.yml is load-bearing
      for the active OS: the 08_os entry section 1.1 and
      08_os/05_registry/repository_guards_v1.yml both resolve publication authority
      to it, as do four retained root files and the guard README.
    action_taken: >-
      Classified migrate_then_delete_source. Its migration is a declared non-goal of
      this task, so .ai/ cannot be deleted until that migration lands.

  - id: handoff_conventions_is_invisible_to_the_reference_graph
    severity: high
    measured: >-
      .ai/HANDOFF_COMMON_CONVENTIONS.md is referenced by no tracked file, so every
      reference-graph pass classifies it as unused. Its section 4.1, lines 61-88,
      is the authority the Human's standing instruction cites for brief-vault
      routing - the vault root, the per-repository suffix rule and the 03_决策档案
      target.
    action_taken: >-
      Classified migrate_then_delete_source. Recorded because a purely mechanical
      closure would have deleted it.

  - id: dot_ai_program_runs_is_an_empty_but_load_bearing_path
    severity: medium
    measured: >-
      .ai/PROGRAM_RUNS/ holds zero tracked files in core, yet five active-OS files
      name it and verify_context_structure.py fails with CM023 if CORE_MANIFEST
      drops it. An inventory driven by file counts would have treated it as absent.
    action_taken: Classified retain_non_08 as a declared path root.

