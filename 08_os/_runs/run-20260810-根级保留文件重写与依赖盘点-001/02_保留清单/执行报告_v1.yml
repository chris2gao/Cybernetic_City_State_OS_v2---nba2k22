step_1_rewrite:
  commit: 4bd8d4d6094721d69676d2e02ca2fa7118167107
  files: 7
  summary:
    AGENTS.md: >-
      Startup Rules replaced. Was: read 06_Silicon_Index/AI_Bootstrap_Sequence.md
      first, then .ai/TOKEN_USAGE_PROFILE.md, then one .ai/load_profiles manifest,
      then .ai/PROTOCOL.md and .ai/STATE.yml for handoff work, then
      .ai/LONG_RUN_AUTONOMOUS_PROGRAM_PROTOCOL.md. Now: fresh remote master SHA,
      AGENT_WORKING_DISCIPLINE.md, this file, the current task, and the two 08_os
      entry documents only when the task touches the OS. Declares the retained
      global surface and states that everything else outside 08_os/** is legacy and
      not a source of truth. Engineering Design Principles, Git workflow including
      the transport paragraph, and test/review expectations kept unchanged. One
      Safety Rule added, absorbing the old profile's tool-ACL and secrets
      fail-closed item.
    AGENT_WORKING_DISCIPLINE.md: >-
      Header no longer defers to .ai/PROTOCOL.md; it defers to the 08_os entry.
      Section 2 gains three habits absorbed from the old token profile: failure by
      signature rather than command spelling, complete command capture with exit
      code and full stdout/stderr summarised only at presentation, and the
      immutable-versus-mutable caching rule with a fresh read before a protected
      action. Section 7 gains dated routing-only persistence and resume-by-explicit
      -session-id. The roles table drops the vendor column: roles are stable, and
      who fills one is decided in the task packet. Research-report routing no longer
      points at a legacy folder as active.
    GEMINI.md: >-
      Read order replaced with the same five steps. The measured "What Antigravity
      actually loads" section is kept verbatim, because it records what was read out
      of the shipped language_server.exe rather than what was assumed.
    CLAUDE.md: >-
      Reduced to a router. The bootstrap-then-load-profile startup, the
      backend_execution_and_handoff role claim, the frozen seven-field wire schema
      and the .ai/PROTOCOL plus ai/review/latest mailbox routing are gone. Role,
      model and reasoning level now come from the task packet.
    README.md: >-
      Rewritten as the repository root entry. Declares 08_os/** the sole active OS,
      tabulates the retained global surface, states that everything else outside it
      is legacy awaiting Human retirement and is not a source of truth for startup,
      communication, state, tasks, roles or navigation, and points at this run's
      inventory. The previous City-State folder tour and the "AI Agent Override"
      instruction to read the old bootstrap first are gone.
    CORE_MANIFEST.yml: >-
      Both machine-read keys kept, and all twelve entries the validator requires.
      core_owned_paths regrouped by comment into retained global surface, active OS,
      and legacy pending retirement. Four entries naming paths absent from the
      tracked tree removed - 07_Execution_Plans/, 0号方案.md, 1号方案.md, 2号方案.md -
      with the removal and its evidence recorded in a comment, because a manifest
      that names absent paths cannot detect drift. AGENT_WORKING_DISCIPLINE.md added
      on the strength of its own tracked self-declaration. A transition_status block
      states that nothing has been deleted. The domain_owned_paths comment claiming
      core ships nothing at those paths corrected to name the measured exception.
    .githooks/README.md: >-
      Opening line no longer credits "the protocol"; it names section 6 of
      AGENT_WORKING_DISCIPLINE.md. The run-007 reference resolved to its full path.
      A paragraph added stating that the hook covers one transport, that the API and
      CLI transports owe the equivalent gates in section 1.1 of the 08_os entry, and
      that reporting hook_guard passed on a transport that cannot run the hook is an
      invalid completion pointer.
  not_done_deliberately:
    - No compatibility shim, alias or redirect was added for any old-OS path.
    - .ai/** untouched.
    - PROJECT_CONTEXT.md and ARCHITECTURE.md untouched.
    - .githooks/pre-push, install.ps1, test_pre_push_logic.ps1 and .gitattributes untouched.
