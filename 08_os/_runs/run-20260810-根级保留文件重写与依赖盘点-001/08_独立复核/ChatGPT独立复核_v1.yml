reviewer: ChatGPT_independent_project_reviewer
reviewed_executor_head: ef332d29124242bf6d9c498131aa83a9f796fa4e
base_master: eb4be95a25cb4b0929def284a7fb4b6a412aed55
verdict: REVISE_NARROW_CORRECTION

scope_judgment:
  step_1_root_rewrite:
    verdict: PASS
    correction_required: false
    findings:
      - 08_os/** is now explicitly the sole active OS in the rewritten startup/root routing surface.
      - old 06_Silicon_Index bootstrap, old .ai protocol/state/mailbox/load-profile startup dependencies were removed from default startup.
      - retained Engineering Design Principles, physical-state/evidence discipline, Git transport gate and Human protected-action rules remain intact.
      - publication authority remains an explicit temporary dependency because its migration was a declared non-goal.
  step_2_dependency_inventory:
    verdict: REVISE
    overall_method: accepted
    reason: the dependency scan and active/inactive edge distinction are useful, but the final deletion whitelist contains classification/factual defects that must be corrected before Human physical deletion.

blocking_findings:
  - id: R1_program_runs_wrong_bucket
    severity: high_for_deletion_whitelist
    finding: >-
      .ai/PROGRAM_RUNS/ is classified retain_non_08 even though the inventory itself says
      its current path is a live new-OS dependency that needs a separate relocation change.
      The task defines retain_non_08 as "must remain after old OS physical deletion" and
      migrate_then_delete_source as required semantics whose current source sits on the
      legacy surface. Under those definitions .ai/PROGRAM_RUNS/ belongs in
      migrate_then_delete_source, not retain_non_08.
    required_correction:
      - move .ai/PROGRAM_RUNS/ from retain_non_08 to migrate_then_delete_source
      - identify every active-OS and retained-root reference that must change with the relocation, including .gitignore
      - recompute bucket totals; absent another reclassification this changes retain 15 -> 14 and migrate 4 -> 5

  - id: R2_unverifiable_external_handoff_dependency
    severity: medium
    finding: >-
      .ai/HANDOFF_COMMON_CONVENTIONS.md is promoted to migrate_then_delete_source solely
      through a Human_standing_instruction edge that is not present in the current task
      packet or repository graph. The independent reviewer can confirm the file contains
      the stated brief-vault routing section, but cannot independently establish from this
      task's primary Git evidence that the external instruction remains current.
    required_correction: >-
      Either provide a current durable/verifiable Human authority reference for this
      external dependency, or move the item to Human_decision_required as a provisional
      keep-until-Human-decides item. Do not classify it as a proven repository dependency
      solely from the executor's own statement.

  - id: R3_new_domain_script_needs_cutover_rewrite_annotation
    severity: medium
    finding: >-
      new-domain.ps1 is a genuine live operational capability and should not be deleted,
      but its current user-facing next-step instructions still name 08_Domain_Applications/
      and 03_Daily_Execution/. Therefore "retain" must not be read as "retain unchanged"
      for the final cutover.
    required_correction: >-
      Keep it protected from deletion, but mark rewrite_required_before_final_cutover: true
      (or equivalent) and state that its post-creation paths/domain procedure must be
      revalidated against the final new-OS/root layout before the physical replacement is closed.

nonblocking_corrections:
  - id: N1_hook_test_count
    finding: the inventory calls .githooks/test_pre_push_logic.ps1 a five-case test; the physical file contains nine cases.
    required_correction: say nine-case decision-table test.
  - id: N2_dot_ai_single_blocker_wording
    finding: >-
      The execution report heading/wording calls publisher authority the "single blocking
      dependency on .ai", while the same report separately identifies TOKEN_USAGE_PROFILE,
      HANDOFF_COMMON_CONVENTIONS and the .ai/PROGRAM_RUNS path as deletion constraints.
    required_correction: narrow the claim to the exact proposition actually established
      (for example, the only tracked .ai file directly load-bearing for repository publication authority).
  - id: N3_gitignore_future_rewrite
    finding: >-
      .gitignore is correctly retained, but it currently contains the .ai/PROGRAM_RUNS
      private-runtime ignore rule. Once that run root migrates, .gitignore is another
      retained file requiring a corresponding path rewrite.
    required_correction: add this dependency to the migration closure/annotation.

accepted_observations:
  - .ai/REPOSITORY_PUBLISHER_AUTHORITY.yml is a proven live migrate-before-delete dependency.
  - .ai/TOKEN_USAGE_PROFILE.md has one surviving active 08_os pointer and cannot be deleted until that pointer is removed/replaced.
  - 系统机制总结.md is referenced by retained 08_os evidence and must either remain or have those evidence refs migrated before deletion.
  - .claude/settings.json is externally tool-loaded and must not be deleted merely because repository reference scans do not find it; ownership remains a Human decision.
  - .gitignore and root .gitattributes are conventional Git infrastructure and belong in the retained set.
  - PROJECT_CONTEXT.md and ARCHITECTURE.md are no longer active dependencies after the rewrite; their final archival/deletion choice remains Human policy.
  - legacy bootstrap/protocol/mailbox/lane/compliance trees are not restored as active dependencies by the rewritten root surface.

correction_scope:
  root_rewrite_files_must_not_change: true
  allowed: only this run's inventory, dependency-edge, report, count/test evidence and correction metadata
  deletion_authorized: false
  move_or_rename_authorized: false
  master_publication_authorized: false

acceptance_after_correction:
  required:
    - corrected bucket definitions and totals are internally consistent
    - every retain item that still requires a future rewrite is explicitly marked
    - every migrate-before-delete item names its migration closure
    - external-only dependencies are distinguished from repository-proven dependencies
    - final summary is safe to use as the Human's pre-deletion whitelist
  expected_status: ready_for_independent_rereview
