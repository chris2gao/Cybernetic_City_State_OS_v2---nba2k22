# 需求建模 A · 自测实例
# 需求：建第二代城邦系统
# 按 01_需求建模/实现/需求建模schema_v1.md 填写

目标: >-
  使人机协作开发从"给几句话然后期望模型做对"，
  变成"需求 → 证据 → 结果建模 → 测试 → 执行"的可验证链条。

成功判据:
  - 描述: 一个需求能在本系统内走完全程，不需要查阅第一代仓库
    可观察: true
  - 描述: 每个阶段的产出能被下一阶段直接消费，不需要人工转译
    可观察: true
  - 描述: 实现完成且测试通过，即等于需求被满足，无需额外人工验收
    可观察: true

边界:
  - 不做通用任务编排引擎（协议齐备、编排器缺位是已知且接受的状态）
  - 不迁移第一代系统的领域内容
  - 不在本系统内解决"认识论意义上的停止判据"
  - 不动 teacher 仓库

约束:
  - 只能调动现有七个模型伙伴
  - core 历史永不改写
  - 每个机制第一版允许手工触发、允许慢
  - 注册表必须与开发同批更新

术语:
  - 词: A
    含义: 需求建模。结构化的需求对象，本阶段的产出
    别名: [需求建模, requirement model]
  - 词: B
    含义: 结果建模。"需求实现后是什么样"的命题，满足 B 即满足 A
    别名: [结果建模, result model]
  - 词: 证据
    含义: 从选定信源挖掘并交叉验证过的外部事实，同时支撑 B 的可行性与测试的生成
    别名: [信息依据, evidence]
  - 词: 机制
    含义: 一个工作流阶段的核心实现。八个机制实现完，工作流即实现
    别名: []

关联领域:
  - 领域: 需求工程
    为什么相关: 阶段一的追问与停止条件在这个领域
  - 领域: 工作流编排
    为什么相关: 阶段之间如何交接、状态如何表示
  - 领域: 多智能体协作
    为什么相关: 角色分区、上下文隔离、并行测量
  - 领域: 软件架构（隔离与版本化）
    为什么相关: 每个机制要能独立换 v2 而不牵动其他

假设:
  - 假设: 八个机制可以独立实现，且相邻机制之间的接口稳定
    如果不成立会怎样: >-
      退化成一个大泥球，隔离失效，v2 重构的成本与重写相当，
      "先做第一版再升级"这个开发方式失去前提
  - 假设: 模型班子的能力与可用性在项目期内不发生根本变化
    如果不成立会怎样: 分派原则（按视野分）需要重写，已有的并行测量数据失去参考价值
  - 假设: "测试通过即需求满足"成立
    如果不成立会怎样: >-
      必须重新引入独立验收阶段，
      而这与"没有单独验收阶段"这条设计直接冲突，整条链的完成定义要改
  - 假设: 信源清单可跨任务复用
    如果不成立会怎样: 机制 2 相对于直接搜索的核心增益消失，方法论退化为流程包装

未解歧义:
  - 歧义: 谁执行——现有后端执行角色，还是本系统内定义的角色
    为何未解: 需要先知道加载器长什么样，而加载器设计在下游
    影响: 高
  - 歧义: 阶段契约是否沿用 .ai/CODEX_TASK_INPUT_CONTRACT.md 的形状
    为何未解: 沿用最省且语义已验证，替换更干净但要重推一遍，取舍未定
    影响: 中
  - 歧义: _runs/ 是否入注册表、保留多久
    为何未解: "中间产物不保留"与"运行记录是方法论证据"两条规则冲突
    影响: 低
