payload:
  result_id: global-communication-system-v1
  normative_ref: B_结果模型_v3.yml
  normative_git_blob_sha: 314b76061a32d62bbcc49e2bf53b8968b2e194bd
  result_summary: >-
    每个 task 使用一个独立公开通讯空间，默认本地发布；在 Web 接收、Human要求或全量收敛
    触发时发布到当前任务 GitHub 分支。每个 sender 在 task 内独占消息、文档和索引，Human
    手动路由；接收方只加载直接引用。公开 task 完成后整体归档，私有 runtime 删除。

  claims:
    - result_claim_id: B3-R01
      evidence_claim_ids: [E-02, E-05]
      statement: 每个task独立，当前上下文默认只加载active当前task，历史task整体归档且不默认加载
    - result_claim_id: B3-R02
      evidence_claim_ids: [E-01, E-04, E-05]
      statement: 默认本地发布，三类触发条件下发布或收敛到当前task GitHub分支
    - result_claim_id: B3-R03
      evidence_claim_ids: [E-05, E-06, E-09]
      statement: 每个sender在每个task内独占消息文档索引，序号00001至10000且新task重置
    - result_claim_id: B3-R04
      evidence_claim_ids: [E-06, E-09, E-10]
      statement: canonical message由统一schema和路径所有权定义，各endpoint使用原生工具发布
    - result_claim_id: B3-R05
      evidence_claim_ids: [E-04, E-09]
      statement: 消息携带sender和预期接收者endpoint及task role，角色用于路由与上下文选择但不授权
    - result_claim_id: B3-R06
      evidence_claim_ids: [E-01, E-02, E-03, E-09]
      statement: 短消息不重复summary，长内容外置，只加载direct required refs，缺失时fail-closed
    - result_claim_id: B3-R07
      evidence_claim_ids: [E-06, E-09, E-10]
      statement: requested_action仅对request、decision_required和blocked强制
    - result_claim_id: B3-R08
      evidence_claim_ids: [E-04, E-05]
      statement: 架构与决策角色承担task_navigation_owner职责，不创建新角色或额外权限
    - result_claim_id: B3-R09
      evidence_claim_ids: [E-02, E-05]
      statement: Human/current仅在重大事件更新并提供最小导航
    - result_claim_id: B3-R10
      evidence_claim_ids: [E-05, E-08, E-09]
      statement: 全量收敛不要求语义逐文件比对，但保留Git fast-forward和冲突保护
    - result_claim_id: B3-R11
      evidence_claim_ids: [E-05]
      statement: 完成后整体归档公开task目录并删除私有未跟踪runtime
    - result_claim_id: B3-R12
      evidence_claim_ids: [E-01, E-05]
      statement: 新建通讯长文档使用最小front matter，既有仓库资源可直接引用
    - result_claim_id: B3-R13
      evidence_claim_ids: [E-03, E-04, E-09]
      statement: 消息与角色字段均不授权，越权动作依赖独立Human授权引用并纳入必读集合
    - result_claim_id: B3-R14
      evidence_claim_ids: [E-04]
      statement: sent只表示载体写入成功，不建立投递已读理解接受或actual recipient状态机
    - result_claim_id: B3-R15
      evidence_claim_ids: [E-03, E-06, E-09]
      statement: validator采用安全YAML子集并通过冻结正负例和逐字段语义测试

  requirement_satisfaction:
    - criterion_id: every_message_identifies_sender_and_expected_recipient
      result_claim_ids: [B3-R04, B3-R05]
    - criterion_id: Human_controls_actual_routing_and_whether_the_chain_continues
      result_claim_ids: [B3-R05, B3-R13, B3-R14]
    - criterion_id: local_and_Web_endpoints_can_locate_required_information_by_exact_pointer
      result_claim_ids: [B3-R02, B3-R04, B3-R06, B3-R10]
    - criterion_id: message_text_remains_small_and_long_content_is_externalized
      result_claim_ids: [B3-R06, B3-R12]
    - criterion_id: recipient_loads_only_direct_message_and_explicitly_required_paths_by_default
      result_claim_ids: [B3-R06]
    - criterion_id: no_automatic_polling_delivery_or_state_progression_exists
      result_claim_ids: [B3-R02, B3-R14]
    - criterion_id: communication_does_not_duplicate_or_override_task_permission_system
      result_claim_ids: [B3-R05, B3-R08, B3-R13]
    - criterion_id: task_runtime_can_be_cleaned_by_fixed_subtree_without_reading_file_contents
      result_claim_ids: [B3-R01, B3-R11]
      interpretation: public_task_archived_whole_private_runtime_deleted_by_fixed_boundary
    - criterion_id: deterministic_tests_cover_supported_routes_and_material_failure_cases
      result_claim_ids: [B3-R03, B3-R04, B3-R06, B3-R10, B3-R13, B3-R15]

  alternatives_rejected:
    - alternative: one_shared_message_index
      reason: multi_endpoint_publication_would_add_shared_write_and_conflict_cost
    - alternative: automatic_local_GitHub_sync_or_dual_write
      reason: conflicts_with_Human_control_privacy_and_sequential_task_operation
    - alternative: new_coordinator_role
      reason: duplicates_existing_architecture_and_decision_role
    - alternative: central_CLI_required_for_all_endpoints
      reason: Web endpoints publish through GitHub connector or API
    - alternative: per_file_public_runtime_cleanup_and_promotion
      reason: whole_task_archive_is_lower_cost_and_preserves_history
    - alternative: unrestricted_YAML_or_free_text_canonical_message
      reason: deterministic parsing and negative validation require a safe structured boundary
    - alternative: delivery_receipt_state_machine_or_actual_recipient_log
      reason: Human is governance router rather than reliable delivery bus

  completion:
    B_v3_exactly_confirmed: true
    joint_review_complete: true
    result_shape_and_implementation_methods_present: true
    every_result_claim_has_evidence_claim_ids: true
    every_success_criterion_has_result_claim_mapping: true
    stage_04_test_generation_authorized: true
    stage_05_not_authorized: true
