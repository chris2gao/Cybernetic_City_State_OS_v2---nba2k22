        documents用于长内容和其他独立文件；消息文本仅保存轻量索引与动作信息。

  IQ-34:
    selected: A
    normalized_decision: >-
      本地与GitHub task通讯目录保持基本同构；GitHub不包含local_only数据和可重建缓存。

  IQ-35:
    selected: confirm
    normalized_decision:
      message_summary: current_change_or_core_purpose_for_fast_orientation
      message_content: compact_index_and_complete_routing_or_action_information
      long_content: external_document_referenced_by_exact_path
      required_refs: exact_paths_to_required_external_documents
      anti_duplication: message_must_not_repeat_long_document_body

  IQ-36:
    selected: A
    normalized_decision: >-
      不自动递归解引用；默认只读取消息直接声明的required_refs。
      发送方负责提供完成当前动作所需的直接引用集合。

  IQ-37:
    selected: Human_override
    normalized_decision: >-
      不建立独立附件元数据协议。大型日志、diff、图片、数据文件或其他长内容
      直接存放在本地或GitHub task目录中的独立文件；消息只提供精确路径。
      接收方仅在需要时读取该路径。
    removed_default_fields:
      - attachment_type
      - attachment_summary
      - attachment_digest
      - attachment_required_flag

  IQ-38:
    selected: B
    normalized_decision: >-
      不建立coordinator交接记录。预期接收者与协调建议均不构成确定路由或义务；
      Human最终决定是否采纳发送方建议、转交给哪个模型以及是否需要回应。
      Human可通过当前聊天口头告知新的操作安排。
    consequence:
      coordinator_endpoint: optional_operational_hint_only
      coordinator_single_writer_contract: not_required_in_v1
      coordinator_handover_artifact: prohibited_by_default

  IQ-39:
    selected: confirm
    normalized_decision:
      global_index_purpose: active_task_discovery_only
      fields:
        - repository_id
        - task_id
        - task_root
        - carrier
        - status
        - last_Human_update_at
      optional_field:
