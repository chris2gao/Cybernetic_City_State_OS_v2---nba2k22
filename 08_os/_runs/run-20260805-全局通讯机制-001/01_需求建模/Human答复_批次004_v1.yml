      prohibited_content:
        - message_body
        - full_history
        - sensitive_content
      note: coordinator_endpoint_id_if_present_is_non_authorizing_hint

  IQ-40:
    selected: Human_override_no_digest
    normalized_decision: >-
      消息文本不计算payload_digest。消息文本是轻量索引；长内容始终放入独立文档，
      消息通过精确路径引用。GitHub文件已有commit/blob身份，本地普通索引也不强制哈希。
    digest_policy:
      message_digest: prohibited_by_default
      long_document_digest: not_required_by_communication_protocol
      carrier_native_identity: may_be_used_when_already_available_without_extra_protocol_cost

