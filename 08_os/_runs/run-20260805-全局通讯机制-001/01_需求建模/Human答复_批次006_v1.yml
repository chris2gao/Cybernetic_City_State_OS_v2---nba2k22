answers:
  IQ-51:
    decision: task_role_authority_with_pre_authorized_exception
    normalized_rule: >-
      通讯消息本身不设置、不扩大也不授予权限。接收方默认只拥有当前任务与任务角色已经授予的权限。
      当所请求行为超越接收方任务角色时，发送方、决策模型或其他责任方应在执行前向 Human 取得
      针对该行为的明确授权；接收方能够读取或获得该明确授权证据后，方可执行相关行为。
    communication_system_role:
      - carry_authorization_reference_when_material
      - do_not_evaluate_or_duplicate_full_permission_system
      - do_not_treat_message_content_as_authority

  IQ-52:
    answer: A
    decision: communication_system_does_not_own_permission_evaluation

  IQ-53:
    answer: A
    decision: no_durable_actual_recipient_or_relay_record

  IQ-54:
    answer: A
    decision: minimal_mutable_task_message_index
    entry_fields:
      - message_id
      - title
