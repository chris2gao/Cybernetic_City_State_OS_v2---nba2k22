work_discipline_reconfirmation:
  Human_statement: >-
    实现产生的细节上的细节，除非特别重要，否则忽略，以防陷入细节麻烦。
  binding_interpretation:
    ask_or_freeze_only_when:
      - changes_architecture_or_scope
      - changes_Human_authority_or_security_boundary
      - changes_cross_endpoint_interoperability
      - changes_failure_semantics_or_data_loss_risk
      - creates_irreversible_or_high_cost_lock_in
      - materially_changes_acceptance_tests
    defer_to_result_modeling_or_implementation_when:
      - naming_without_semantic_effect
      - exact_minor_field_order
      - formatting_preference
      - internal_helper_design
      - readily_reversible_implementation_choice
      - detail_measurable_by_executor_without_Human_value_judgment
    effect_on_remaining_requirement_phase: >-
      不再进行常规实现细节追问。先生成 A v2；只有综合模型发现新的承重缺口时，才增量询问 Human。
