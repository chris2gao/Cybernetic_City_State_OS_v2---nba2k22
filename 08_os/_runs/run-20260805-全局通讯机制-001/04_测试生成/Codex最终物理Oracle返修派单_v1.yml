hard_prohibitions:
  - Do not modify frozen candidate or semantic spec files.
  - Do not modify prior independent-review artifacts.
  - Do not weaken a frozen oracle to make tests green.
  - Do not manufacture or edit tested_commit values manually.
  - Do not redirect runner stdout into any result YAML.
  - Do not leave DEBUG output in persisted result YAMLs.
  - Do not use mutation-loop swallowing where only one final mutation reaches the evaluator.
  - Do not reuse a destructively changed sandbox across independent negative subcases.
  - Do not enter Stage 05.
  - Do not update master.

implementation_objective:
  summary: >-
    Close the remaining physical-oracle gaps in GC-T033, GC-T034, GC-T039,
    GC-T040, GC-T041, GC-T043, GC-T044, and GC-T045. Each negative subcase
    must start from an independently initialized fresh fixture and must be
    independently observed/evaluated. Business-state conclusions must be
    derived from actual Git/filesystem/authority observations, not from a
    mutation label, prefilled boolean, or final synthetic exception string.

requirements:
  result_evidence_integrity:
    - Runner-generated result files must begin with valid YAML at byte 0.
    - Capture/suppress subprocess stdout and stderr where needed; never shell-redirect command output into result YAML paths.
    - Remove DEBUG prints from the persisted evidence path.
    - Each result must be parseable with yaml.safe_load as one document.
    - tested_commit must be the exact remote implementation commit and must exist remotely.

  GC-T033:
    conforming:
      - Build a real same-path divergent repository in a fresh sandbox.
      - Execute git fetch followed by a conflict-producing merge attempt; do not use rebase.
      - Capture actual argv/return code.
      - Derive unresolved paths from git diff --name-only --diff-filter=U or an equivalent physical Git observation.
      - After conflict, perform no auto-resolution, no merge/rebase continuation, and no push.
      - Build escalation data using the observed conflict paths plus the frozen routing policy to task_navigation_owner and Human.
    independent_negative_subcases:
      auto_resolve_and_continue:
        - Fresh sandbox.
        - Physically resolve the conflict and continue/commit; evaluator must detect prohibited continuation from Git state/trace.
      push_after_conflict:
        - Fresh sandbox.
        - Physically attempt a push after the conflict; evaluator must detect push_attempts > 0 even if Git rejects it.
      omit_exact_conflict_path:
        - Fresh sandbox.
        - Preserve physical Git observation separately and corrupt only the emitted escalation path set; evaluator compares emitted paths to observed unresolved paths.
      omit_required_escalation:
        - Fresh sandbox.
        - Preserve the physical conflict but omit required routing/escalation fields; evaluator rejects.
    aggregation:
      - Every subcase must be independently captured and independently asserted; no swallowed loop followed by one final subcase.

  GC-T034:
    conforming:
      - Fresh sandbox.
      - Read remote master head before the push using a real Git query.
      - Execute exactly one ordinary stale push and capture real argv/return code/output.
      - Read remote head after the rejected push.
      - Derive push_attempt_count from the actual command trace; retries = push_attempt_count - 1.
      - Assert no --force, -f, or --force-with-lease occurred.
      - Assert remote before equals remote after using measured SHAs.
      - Route unresolved NFF to task_navigation_owner and Human.
    independent_negative_subcases:
      force_push:
        - Fresh sandbox; actually execute a force push attempt and detect force argv from trace.
      automatic_retry:
        - Fresh sandbox; actually execute a second push attempt after the first rejection and derive retry_count=1 from the trace.
      remote_head_changes:
        - Fresh sandbox; physically change the remote after the rejected stale push using an independent actor, then measure before/after inequality.
      escalation_missing:
        - Fresh sandbox; retain the measured NFF observation but omit escalation route; evaluator rejects.

  GC-T039:
    - communication-root discovery.yml must be outside the active task directory.
    - Conforming archive moves the complete public task unit containing indexes, messages, documents, Human_decisions, final_results, and material_failures.
    - Observe active path absent, archive path present, and communication-root discovery transitioned from active to archive while remaining roots-only.
    - Run omit_public_history_category and fail_to_update_discovery as separate fresh fixtures and evaluate each independently.

  GC-T040:
    fixture:
      - Use a real temporary Git repository for public tracked content.
      - Put tracked public_results.yml under the public task.
      - Provide an ignored/private runtime sentinel inside the repo and a separate external private-runtime sentinel outside the public task/repository scope.
    conforming:
      - Prove private sentinels are absent from git ls-files.
      - Prove durable public prerequisite exists before deletion.
      - Archive only public tracked task content.
      - Private runtime must not be archived.
      - Delete private runtime only after durable prerequisite success; retain a trace/order observation proving the gate happened first.
    independent_negative_subcases:
      leak_into_archive:
        - Fresh fixture; physically place private runtime in archive and detect it from filesystem state.
      becomes_git_tracked:
        - Fresh fixture; physically add/force-add a private sentinel to the Git index and detect it via git ls-files.
      deleted_before_durable_prerequisite:
        - Fresh fixture; make the durable prerequisite absent and physically delete private runtime first; evaluator detects ordering/gate violation.

  GC-T041:
    independent_subcases:
      default_load:
        - Physically read active context only; archive must not be read.
      exact_archive_pointer:
        - Physically read archive context under an explicit exact archive pointer.
      Human_explicit_request:
        - Physically read archive context under explicit Human request authority.
      invalid_implicit_archive_load:
        - Attempt an unauthorized archive resolution/read request; reject before reading archive bytes.
    trace_contract:
      - Record exact attempted paths, exact successfully read paths, authority source, and target.
      - Success and failure paths both require structured trace.
      - Evaluator checks actual paths/content/authority, not exception wording.

  GC-T043:
    conforming_sequence:
      - Fresh fixture; snapshot Human/current bytes.
      - Execute ordinary message event and prove bytes unchanged.
      - Execute Human-decision-required material event and prove exact minimal navigation update.
      - Execute stage-completion material event and prove the frozen minimal navigation shape remains valid.
    exact_allowed_fields:
      - task_id
      - title
      - current_stage_or_checkpoint
      - important_refs
      - pending_Human_decision
      - last_material_update
    independent_negative_subcases:
      - ordinary_message_wrongly_updates_current
      - material_event_fails_to_update
      - material_update_missing_required_field
      - material_update_contains_prohibited_extra_payload
    rule:
      - A mutation selector may choose which mutant behavior to execute, but evaluator pass/fail must be derived solely from before/after event and file observations, never from the mutation name.

  GC-T044:
    structured_authority_inputs:
      - current_task_id
      - writer_endpoint_id
      - writer_task_role
      - task_navigation_owner_endpoint_id
      - current_task_authority
      - explicit_Human_authorization_if_the_frozen_model_requires_it
    cases:
      unauthorized_execution_or_review:
        - Fresh fixture; reject and prove Human/current bytes unchanged.
      architecture_role_not_navigation_owner:
        - Fresh fixture; reject and prove bytes unchanged.
      correct_navigation_owner_with_task_authority:
        - Fresh fixture; allow write and prove only frozen minimal navigation fields change.
    rules:
      - Do not grant authority from vendor/model identity.
      - Do not branch authorization on a subcase label.
      - Evaluate actual structured task authority state.

  GC-T045:
    validator_contract:
      - validate_sender_index receives only physical index/message state and must not receive a mutation label.
      - Validator parses index.yml, checks allowed pointer structure, uniqueness/preservation rules, and verifies each pointer target physically exists.
    conforming:
      - Fresh fixture with existing messages m1, m2, m3 and initial index [m1, m2].
      - Perform valid append of m3.
      - Require exact final index [m1, m2, m3].
    independent_negative_subcases:
      delete_existing_entry:
        - Fresh fixture; physically write an index with an old entry removed, then call state-only validator.
      modify_existing_entry:
        - Fresh fixture; physically alter an existing pointer, then validate.
      embed_message_body:
        - Fresh fixture; physically embed body/object content in index, then validate.
      point_to_missing_message:
        - Fresh fixture; physically point to a nonexistent target, then validate.
      duplicate_append:
        - Fresh fixture; physically append an existing pointer again, then validate.
    rule:
      - Every invalid state is independently evaluated; no final repeated mutation and no shared corrupted index.

implementation_commit_protocol:
  - Make implementation changes only after the dispatch commit.
  - Create one new implementation-only commit I containing only implementation/test-harness files needed for this correction.
  - Do not include result YAML changes in I.
  - Push I normally, then read remote branch head back and require it to equal I.
  - Confirm no implementation/spec/candidate bytes change after I before final test runs.

final_test_protocol:
  - Run all three modes on the exact pushed remote implementation commit I.
  - Before each run, verify implementation/spec/candidate files are clean; previously generated result files may be the only allowed dirty paths.
  - Do not use shell stdout redirection to result files; allow the runner to write them itself.
  - After the three runs, parse each result YAML independently and assert byte 0 begins valid YAML content rather than command logs.
  - Assert all three tested_commit values equal I.
  - Assert all three runner_blob_sha256 values are identical.
  - Assert I exists on the remote.

