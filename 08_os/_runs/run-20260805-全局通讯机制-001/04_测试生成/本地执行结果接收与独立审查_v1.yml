blocking_findings:
  - finding_id: S04-R01
    severity: blocking
    statement: >-
      GC-T001-T003 and GC-T008-T049 are not implemented as executable tests. The runner
      registers a generic handler that unconditionally returns EXPECTED_FAIL instead of
      executing each frozen fixture and oracle.
    evidence:
      path: 04_测试生成/实现/run_stage04_executable_tests.py
      blob_sha: 4578a7a1a5157e3b38cbdad2b932d896c0c4b5a0
      symbols:
        - generate_expected_fail_handler
        - HANDLERS population loop for ranges 1-3 and 8-49
    effect: >-
      The test package cannot detect future implementation regressions and cannot become
      the unchanged stage-07 acceptance suite.
  - finding_id: S04-R02
    severity: blocking
    statement: >-
      The --mode argument does not change test semantics. Full mode would continue to emit
      45 EXPECTED_FAIL results, so stage-07 cannot require real PASS/FAIL outcomes.
    effect: full-mode acceptance is not implemented
  - finding_id: S04-R03
    severity: blocking
    statement: >-
      Canonical-message fixtures use legacy-like fields such as type, sender, recipient and
      timestamp instead of the B v3 canonical fields message_type, sender_endpoint_id,
      sender_task_role, expected_recipient_endpoint_id, expected_recipient_task_role,
      content and required_refs. The mismatch is hidden because those tests are placeholders.
    affected_fixtures:
      - fixtures/canonical_message/valid_request.yml
      - fixtures/canonical_message/valid_result_no_action.yml
      - fixtures/canonical_message/request_missing_action.yml
      - fixtures/canonical_message/prohibited_delivery_state.yml
      - fixtures/canonical_message/prohibited_summary.yml
      - fixtures/canonical_message/message_id_mismatch.yml
  - finding_id: S04-R04
    severity: blocking
    statement: >-
      The 14 harness tests verify discovery, uniqueness, fixture presence, deterministic output
      and zero ERROR count, but do not verify that every frozen test has a concrete oracle
      implementation or that baseline and full modes differ correctly.
  - finding_id: S04-R05
    severity: non_blocking_recording_issue
    statement: >-
      The result receipt records final_branch_head as ad4e133e..., while the actual remote push
      head is 7c899ba.... This is caused by the self-referential final receipt commit and must
      be resolved by external remote readback, not by trusting the embedded value.

