independent_findings:
  - finding_id: OPUS-F01
    severity: critical
    location: run_stage04_executable_tests.py:29-34
    statement: >-
      generic_fixture_factory passes frozen failure_code into fixture dict as _expected_failure.
      This violates the fundamental prohibition: failure_code must never enter adapter/fixture/action/observation.
    code_evidence: |
      def generic_fixture_factory(test_id, failure_code, should_mutate):
          return {
              "test_id": test_id,
              "_should_fail_test_id": test_id if should_mutate else None,
              "_expected_failure": failure_code if should_mutate else None
          }
    dispatch_requirement_violated: C03, C05

  - finding_id: OPUS-F02
    severity: critical
    location: run_stage04_executable_tests.py:36-60
    statement: >-
      evaluate_generic treats any adapter call that does not raise CommunicationSystemError as PASS.
      No actual observable output is checked. A no-op adapter achieves 50 PASS.
    code_evidence: |
      # Line 49: return "PASS", None  (reached if no exception)
    dispatch_requirement_violated: C04

  - finding_id: OPUS-F03
    severity: critical
    location: run_stage04_executable_tests.py:70-109
    statement: >-
      evaluate_git_convergence passes failure_code directly to adapter.converge_task_branch via test_ctx.
      Git tests GC-T031..T034 share a single function that does not create a bare remote.
      GC-T031 creates a local commit but no remote-ahead scenario.
      GC-T032/GC-T033 have no scenario-specific logic at all — they fall through to PASS.
      GC-T034 creates two local branches and attempts merge instead of testing rejected non-fast-forward push.
    dispatch_requirement_violated: C03, C07

  - finding_id: OPUS-F04
    severity: critical
    location: run_stage04_executable_tests.py:111-149
    statement: >-
      GC-T050 (evaluate_gc_t050) compares top-level fields of two response files against EACH OTHER
      instead of scoring each fixture_result against the frozen experiment packet's expected values.
      It checks fields [task_id, sender_endpoint_id, expected_recipient_endpoint_id, message_type,
      purpose, authority] at the top level of the response dict — those fields don't exist there.
      The experiment data has fixture_results arrays with per-fixture recovered fields.
    dispatch_requirement_violated: C08

  - finding_id: OPUS-F05
    severity: critical
    location: run_stage04_executable_tests.py:151-186 (run_yaml_harness)
    statement: >-
      GC-T006 uses regex with OVER-ESCAPED patterns (double-escaped backslashes in Python raw strings)
      that don't match the fixture content. The regex r'(?:^|\\s)&\\w+' contains literal backslash-s
      instead of whitespace pattern. This causes GC-T006 to return FAIL in conforming mode.
    code_evidence: |
      # Line 202: regex_checks=[r'(?:^|\\\\s)&\\\\w+', r'(?:^|\\\\s)\\\\*\\\\w+', r'<<\\\\s*:']
      # The \\\\s is literal backslash-s, not \s whitespace
    dispatch_requirement_violated: C06

  - finding_id: OPUS-F06
    severity: critical
    location: run_stage04_executable_tests.py:188-328
    statement: >-
      40+ tests (GC-T001..T003, GC-T008..T030, GC-T035..T049) all use identical generic_fixture_factory
      with no case-specific fixture data, action semantics, observation contract, or evaluator logic.
      They are indistinguishable stubs that pass/fail based solely on whether the adapter raises.
    dispatch_requirement_violated: C04

  - finding_id: OPUS-F07
    severity: high
    location: repository root
    statement: >-
      Three out-of-scope root helper files remain in tracked tree:
      build_harness_v2.py (3326B), build_runner_v2.py (33720B), generate_runner.py (18059B).
    dispatch_requirement_violated: C02

  - finding_id: OPUS-F08
    severity: high
    location: run_stage04_executable_tests.py:455-464
    statement: >-
      In mutation-suite mode, the result dict sets failure_code from the adapter's returned reason
      string rather than from the evaluator independently deriving it from observation.
      The failure_code field in results is set to `reason if status == "PASS" and args.mode == "mutation-suite"`
      — meaning it echoes whatever the adapter returned.
    dispatch_requirement_violated: C05

  - finding_id: OPUS-F09
    severity: medium
    location: run_stage04_executable_tests.py:498-505
    statement: >-
      Result filenames use _v2 suffix instead of required _v3.
      The dispatch requires preimplementation_baseline_v3.yml, synthetic_conforming_full_v3.yml,
      mutation_suite_v3.yml.
    dispatch_requirement_violated: C10

  - finding_id: OPUS-F10
    severity: medium
    location: run_stage04_executable_tests.py:473
    statement: >-
      runner_identity is "Antigravity_Gemini_v2" which is inaccurate for Opus execution.
      Result files should bind the actual adapter id/version.

