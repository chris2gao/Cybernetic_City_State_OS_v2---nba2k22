correction_plan:
  - step: 1
    action: git rm build_harness_v2.py build_runner_v2.py generate_runner.py
    requirement: C02

  - step: 2
    action: >-
      Rewrite the entire test infrastructure with typed TestCase dataclasses, explicit per-case
      fixture_factory/action/observation/evaluator, SyntheticConformingAdapter that returns
      concrete observable outputs, and SyntheticMutatingAdapter that mutates concrete fields.
      failure_code NEVER enters any adapter, fixture, or action. Only evaluators map observations
      to frozen failure_codes.
    requirement: C03, C04, C05

  - step: 3
    action: >-
      Fix GC-T006 to use proper YAML scanner/parser rejection via StrictSafeLoader that forbids
      anchors and aliases, plus separate merge-key detection.
    requirement: C06

  - step: 4
    action: >-
      Rewrite GC-T031..T034 with real temporary Git repos and local bare remote.
      GC-T031: remote-ahead with non-overlapping fast-forward.
      GC-T032: two sender zones converge non-overlapping paths.
      GC-T033: same-path conflict on diverged heads, verify conflict path surfaced.
      GC-T034: rejected non-fast-forward push, verify no force flag.
    requirement: C07

  - step: 5
    action: >-
      Rewrite GC-T050 to read frozen experiment packet expected values and score each
      fixture_result in each model response against those expectations field-by-field,
      including exact required_refs set comparison.
    requirement: C08

  - step: 6
    action: >-
      Verify specs match frozen test_ids and failure_codes at startup. Harness proves
      every evaluator has both conforming PASS path and mutation-derived failure path.
    requirement: C09

  - step: 7
    action: >-
      Save results as _v3 with full metadata binding.
    requirement: C10
