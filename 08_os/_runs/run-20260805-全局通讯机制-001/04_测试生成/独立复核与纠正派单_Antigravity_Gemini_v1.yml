review_first_requirement:
  before_any_correction:
    write: 08_os/_runs/run-20260805-全局通讯机制-001/04_测试生成/独立复核记录_Antigravity_Gemini_v1.yml
    include:
      - independently_verified_changed_paths
      - findings_by_severity
      - whether_each_of_GC-T001_through_GC-T050_has_a_real_executable_oracle
      - whether_preimplementation_and_full_modes_have_distinct_semantics
      - whether_fixtures_match_B_v3
      - whether_Opus_counts_are_reproducible
      - exact_source_locations_for_each_finding

non_negotiable_test_semantics:
  - do_not_modify_the_50_test_ids_titles_evidence_claim_ids_criterion_ids_or_failure_codes
  - do_not_modify_the_candidate_normalized_test_index_digest
  - do_not weaken an oracle to make the baseline pass
  - every test GC-T001 through GC-T050 must have a concrete executable handler or adapter
  - a handler must inspect a fixture, repository state, temporary Git repository, target interface, or frozen external result; it may not return a constant expected status
  - preimplementation-baseline may return EXPECTED_FAIL only after a concrete check proves the required stage-06 target is absent or not yet compliant
  - full mode must never return EXPECTED_FAIL
  - full mode outcomes are PASS, FAIL, ERROR, or BLOCKED_EXTERNAL only
  - test-program or fixture faults are ERROR, never EXPECTED_FAIL
  - oracle mismatch is FAIL
  - missing stage-06 target in full mode is FAIL
  - GC-T050 must use deterministic field-by-field scoring and must preserve known Opus discrepancies rather than treating field presence alone as semantic correctness

required_corrections_if_findings_confirmed:
  - replace placeholder expected-fail generator with concrete test implementations for all 50 tests
  - implement baseline/full mode distinction
  - replace canonical-message fixtures with exact B v3 canonical fields and IDs
  - add or generate all required fixtures, including temporary Git convergence/conflict and archive/privacy cases
  - add a stable implementation adapter contract so stage-06 code can be tested without modifying frozen semantics
  - add harness self-tests that fail if any test has no concrete handler, any handler is a constant-status placeholder, or full mode can emit EXPECTED_FAIL
  - add harness tests for fixture-to-spec binding and B-v3 field names
  - ensure GC-T006 tests anchors, aliases and merge keys as distinct subcases
  - ensure GC-T050 scores exact recovered values and required-ref sets, not mere field presence

allowed_write_paths:
  - 08_os/_runs/run-20260805-全局通讯机制-001/04_测试生成/独立复核记录_Antigravity_Gemini_v1.yml
