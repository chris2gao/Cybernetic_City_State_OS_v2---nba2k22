    - build_runner.py
    - full_results.yml
    - preimpl_results.yml
  rule: delete_from_current_task_branch_without_rebase_amend_force_push_or_history_rewrite

executable_oracle_contract:
  adapter_loading:
    - runner accepts an explicit adapter implementation by stable CLI argument or import contract
    - no production implementation path is frozen before Stage 05
    - absent adapter in preimplementation-baseline maps to EXPECTED_FAIL
    - absent adapter in full maps to FAIL
  per_test_required_executable_elements:
    - test_id
    - capability
    - fixture_factory_or_exact_fixture_ref
    - concrete_capability_arguments
    - action_invocation
    - executable_evaluator
    - expected_observation
    - exact_failure_code
  prohibited:
    - returning a status solely from test_id
    - storing prose setup/action/oracle without executing it
    - calling every capability with empty args
    - treating method existence as PASS
    - mapping unrelated sequence_authority_context_Git_archive_tests to validate_message
    - catching MissingCapabilityError as the only behavior of a test

required_capability_interfaces:
  - validate_message
  - validate_document
  - validate_sender_index
  - publish_message
  - bootstrap_receiver
  - evaluate_authority
  - publish_to_GitHub
  - converge_task_branch
  - update_Human_current
  - archive_task
  - inspect_forbidden_automation

proof_harness:
  conforming_synthetic_adapter:
    purpose: prove_the_frozen_runner_can_drive_all_fifty_oracles
    required_result_in_full_mode:
      PASS: 50
      EXPECTED_FAIL: 0
      FAIL: 0
      ERROR: 0
      BLOCKED_EXTERNAL: 0
  mutation_suite:
    requirement: >-
      For every GC-T001 through GC-T050, inject or select a targeted faulty observation so that the test
      fails through its own executable evaluator and emits its exact frozen failure_code.
    coverage_required: 50_of_50_failure_codes_reached
  production_boundary:
    synthetic_adapters_are_test_fixtures_only: true
    must_not_implement_stage_06_production_mechanism: true

special_test_requirements:
  GC-T004_to_GC-T007:
    - retain_real_parser_or_scanner_execution
    - merge_key_case_must_be_independently_exercised_not_only_anchor_fixture
  GC-T031_to_GC-T034:
    - use_temporary_Git_repositories_or_a_behaviorally_equivalent_deterministic_Git_adapter
    - verify_fast_forward_disjoint_same_path_and_non_fast_forward_oracles_separately
  GC-T050:
    - compare_frozen_expected_values_field_by_field
    - compare_exact_required_ref_sets
    - file_existence_alone_must_not_pass

mode_contract:
  preimplementation_baseline:
    capability_absent: EXPECTED_FAIL
    capability_present_oracle_pass: PASS
    capability_present_oracle_fail: FAIL
    harness_or_fixture_fault: ERROR
    exit_zero_only_when_FAIL_0_ERROR_0_BLOCKED_0: true
  full:
    capability_absent: FAIL
    capability_present_oracle_pass: PASS
    capability_present_oracle_fail: FAIL
    harness_or_fixture_fault: ERROR
    EXPECTED_FAIL_allowed: false
    exit_zero_only_when_PASS_50_and_all_other_counts_0: true

allowed_write_paths:
