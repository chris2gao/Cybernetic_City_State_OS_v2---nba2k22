same_host_cross_family_comparison:
  Gemini_result_ref: 02_信息收集与提炼/antigravity_desktop_executor_01_result.yml
  Opus_result_ref: 02_信息收集与提炼/antigravity_desktop_opus_executor_01_result.yml
  common_findings:
    - F1 YAML and F2 JSON preserve the tested core semantics
    - free text is understandable but less reliable for deterministic parsing
    - long content should remain external and be loaded only through explicit refs
    - receiver should not scan the task directory or recursively expand references by default
  material_difference:
    - Gemini included both execution and authorization paths in exact_paths_to_read
    - Opus correctly reasoned about authorization but omitted its path from exact_paths_to_read
    - Opus introduced one false missing-message-id claim for F3
  inference_boundary: >-
    Two model families in one host support the basic architecture direction, but do not prove behavior in
    Claude Code Desktop or Codex Desktop and do not justify freezing optional fields or final serialization.

