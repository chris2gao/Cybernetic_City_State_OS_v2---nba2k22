prompt: |-
  补充跨模型通讯实验，不是 Deep Research。

  你当前运行于 Antigravity Desktop，请使用当前实际 Claude Opus 模型完成测试，并在结果中如实声明模型名称与环境。

  task_id: os-v2-global-communication-system-001
  sender_endpoint_id: chatgpt-web-planner-01
  expected_recipient_endpoint_id: antigravity-desktop-opus-executor-01
  message_type: request
  purpose: 在与 Gemini 相同的 Antigravity Desktop 宿主中，测试不同模型家族对轻量通讯索引的理解结果。

  Repository:
  chris2gao/Cybernetic_City_State_OS_v2---core

  Branch:
  dev/os-v2-global-communication-system-001

  只读取：
  08_os/_runs/run-20260805-全局通讯机制-001/02_信息收集与提炼/多模型实验包_v1.yml

  不要读取：
  - 旧通讯协议；
  - 完整任务历史；
  - antigravity_desktop_executor_01_result.yml；
  - 其他模型的实验答案。

  按实验包中的 required_response_shape 独立完成所有 fixture。

  将结果保存并提交到：
  08_os/_runs/run-20260805-全局通讯机制-001/02_信息收集与提炼/antigravity_desktop_opus_executor_01_result.yml

  Push 到同一分支后，只返回：
  1. endpoint 身份和实际模型名称；
  2. 结果文档精确路径；
  3. 分支名；
  4. 提交后的 40 位 HEAD。

acceptance:
  - actual_endpoint_and_model_declared
  - prior_Gemini_result_not_read
  - required_shape_semantically_satisfied
  - all_fixtures_answered
  - exact_result_path_returned
  - exact_40_char_head_returned
