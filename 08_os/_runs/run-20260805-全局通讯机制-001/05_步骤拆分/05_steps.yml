payload:
  objective: >-
    把已冻结的 Stage 04 验收面（GC-T001..GC-T050）与已确认的 B v3 架构，转换为有序、
    可直接执行的 Stage 06 步骤包。步骤按"契约先于机制、机制先于发布、发布先于收敛与归档"
    串行推进，降低共享写入风险，保留 Human 触发/Human 转交的 V1 边界。
  executor_role_for_stage_06: backend_execution_and_handoff
  stage_06_authorized: false
  step_count: 10
  frozen_test_authority: ../04_测试生成/04_tests.yml
  frozen_tests_are_immutable: true
  execution_mode: ordered_serial_checkpoints
  parallel_write_to_shared_communication_metadata: prohibited
  path_ownership_model:
    one_primary_owner_per_path: true
    authority: ../01_任务输入/任务包_v1.yml#allowed_changed_paths
    authority_is_not_renameable_by_executor: true
    planned_implementation_path_families:
    - 08_os/03_mechanisms/communication_system/
    - 08_os/02_boot/communication_system/
    - 08_os/05_registry/communication_system_v1.yml
    - 08_os/06_execution/boot/communication_system/
    - 08_os/_runs/run-20260805-全局通讯机制-001/06_执行/
    canonical_mechanism_root: 08_os/03_mechanisms/communication_system/
    canonical_execution_root: 08_os/06_execution/boot/communication_system/
    canonical_boot_root: 08_os/02_boot/communication_system/
    canonical_registry_file: 08_os/05_registry/communication_system_v1.yml
    stage_06_run_output_root: 08_os/_runs/run-20260805-全局通讯机制-001/06_执行/
    private_runtime_untracked: 08_os/_runs/run-20260805-全局通讯机制-001/_runtime/
    runtime_logical_carrier_reference_only:
      value: 08_os/_communication/<repository_id>/
      writable_in_this_task: false
      reason: >-
        B v3 定义的运行时逻辑载体根，不在任务包 allowed_changed_paths 内。
        Stage 06 不得在此物化 canonical live instance state，也不得把它写入任何步骤的
        intended_changed_paths。
    note: >-
      以上为 Stage 06 的意图变更路径族，全部取自任务包已授权的精确 allowlist，
      执行者不得改名或扩展。Stage 05 本身只写
      08_os/_runs/run-20260805-全局通讯机制-001/05_步骤拆分/ 与本 run 的 run.yml。
  steps:
  - step_id: S-01
    name: bootstrap_and_contracts
    depends_on: []
    action: >-
      建立通讯机制 canonical 目录与契约骨架：逻辑根（local / GitHub）、共享结构
      active/archive/discovery.yml、公开任务目录布局、manifest 契约必填字段、
      private runtime 与公开目录的显式分离，以及任务空间初始化器（B3-M03）。
    implementation_methods:
    - B3-M01
    - B3-M03
    blocking_prerequisite_ref: 08_os/_runs/run-20260805-全局通讯机制-001/06_执行/Human授权_进入阶段六_v1.yml
    fail_closed_without_blocking_prerequisite: true
    prerequisites:
    - Stage04 冻结包 blob 360571b6b29a3baecd753dc45611457da9ab6bf2 可读且未变更
    - >-
      新的 Stage06 Human 授权产物 06_执行/Human授权_进入阶段六_v1.yml 存在且
      enter_stage_06_execution 为 true，并绑定独立审查已接受的 05_steps.yml blob 与提交 head；
      不满足任一条即 fail-closed，不得创建任何实现文件。
    - >-
      Human授权_进入阶段五_v1.yml 保持不变（enter_stage_06_execution 仍为 false）；
      它只证明"此前未授权施工"，不构成开始条件。
    intended_changed_paths:
    - 08_os/03_mechanisms/communication_system/README.md
    - 08_os/03_mechanisms/communication_system/通讯契约_v1.yml
    - 08_os/06_execution/boot/communication_system/task_space_initializer/
    - 08_os/05_registry/communication_system_v1.yml
    outputs:
    - 契约版本号 communication_contract_version 与 manifest 必填字段清单
    - 可重复执行的任务空间初始化器与其正负例
    - registry entry（path/purpose/loader/discovery/evidence/deletion_rule）
    validation:
    - python 08_os/06_execution/workflow/minimum_operational_loop/run_minimum_operational_loop.py static .
    - 初始化器在空目录与已存在目录上均 fail-closed 或幂等，退出码显式
    - manifest 缺任一必填字段时初始化器拒绝
    test_ids:
    - GC-T013
    - GC-T022
    - GC-T042
    retry_budget: 2
    exits:
    - pass
    - retry
    - invalidate_upstream
    exit_handling:
      pass: 进入 S-02
      retry: 修正目录/契约字段后重跑本步验证，最多 2 次
      invalidate_upstream: ../03_结果建模/B_结果模型_v3.yml
    invalidate_upstream_target: workflow_stage_03_result_modeling
    invalidate_upstream_reason: >-
      若 logical_roots / public_task_directory / manifest_contract 在物理落地时自相矛盾，
      属结果模型缺陷，必须重开 B v3 并经 Human 确认，禁止改动冻结测试。
  - step_id: S-02
    name: endpoint_cards_and_roles
    depends_on:
    - S-01
    action: >-
      实现 endpoint card 契约（每任务每端点实例一张卡）、task_role 模型与权限边界：
      角色与自述身份不授予任何权限；越出角色的动作必须有可读 authorization_ref，
      且该 ref 必须同时出现在消息 required_refs 中；validator 只校验、从不授权。
    implementation_methods:
    - B3-M01
    - B3-M02
    prerequisites:
    - S-01 通过
    intended_changed_paths:
    - 08_os/03_mechanisms/communication_system/端点卡契约_v1.yml
    - 08_os/03_mechanisms/communication_system/角色与权限边界_v1.yml
    - 08_os/06_execution/boot/communication_system/validator/
    outputs:
    - endpoint card 必填字段与能力声明规则
    - endpoint_card_role 与 message role 一致性校验规则
    - authorization_ref ⊂ required_refs 的强制规则
    validation:
    - endpoint card 缺字段 / 角色不匹配 / 自授权消息均被拒绝
    - 角色字段变化不改变任何可执行权限（负例）
    test_ids:
    - GC-T015
    - GC-T016
    - GC-T017
    - GC-T018
    retry_budget: 2
    exits:
    - pass
    - retry
    - invalidate_upstream
    exit_handling:
      pass: 进入 S-03
      retry: 修正端点卡/角色规则后重跑本步验证，最多 2 次
      invalidate_upstream: ../03_结果建模/B_结果模型_v3.yml
    invalidate_upstream_target: workflow_stage_03_result_modeling
    invalidate_upstream_reason: >-
      若 permission_boundary 与 endpoint_card_contract 无法在不新增隐式授权的前提下同时成立，
      须重开 B v3 的权限边界章节，不得放宽冻结测试。
  - step_id: S-03
    name: canonical_message_and_safe_yaml
    depends_on:
    - S-01
    - S-02
    action: >-
      实现 canonical message schema 与 safe-subset YAML 解析档：必填字段、
      条件必填 requested_action、允许的 message_type 集合、禁止字段与禁止语义
      （delivery/read/understood/accepted state、summary、私有思维链），
      以及 duplicate key / multi-document / alias / merge key / custom tag 一律拒绝。
    implementation_methods:
    - B3-M01
    - B3-M02
    prerequisites:
    - S-02 通过
    intended_changed_paths:
    - 08_os/03_mechanisms/communication_system/消息契约_v1.yml
    - 08_os/06_execution/boot/communication_system/validator/
    - 08_os/06_execution/boot/communication_system/validator/fixtures/
    outputs:
    - 消息 schema 与 message_id / 路径一致性规则
    - safe YAML parser profile 与其冻结负例集合
    validation:
    - 合法消息通过；缺必填字段、错误 message_id、禁止字段一律非零退出
    - 四类 YAML 不安全构造（重复键/多文档/别名或合并键/自定义标签）全部拒绝
    test_ids:
    - GC-T001
    - GC-T002
    - GC-T003
    - GC-T004
    - GC-T005
    - GC-T006
    - GC-T007
    - GC-T008
    - GC-T009
    - GC-T010
    retry_budget: 3
    exits:
    - pass
    - retry
    - invalidate_upstream
    exit_handling:
      pass: 进入 S-04
      retry: 修正 schema 或解析档后重跑，最多 3 次
      invalidate_upstream: ../03_结果建模/B_结果模型_v3.yml
    invalidate_upstream_target: workflow_stage_03_result_modeling
    invalidate_upstream_reason: >-
      若 canonical_message_contract 的必填/条件必填/禁止字段集合互相冲突，
      须重开 B v3 消息契约；禁止通过弱化 GC-T001..GC-T010 绕过。
  - step_id: S-04
    name: sender_zone_sequence_and_index
    depends_on:
    - S-03
    action: >-
      实现发送方专属区（messages/documents/indexes 三个 sender 拥有的路径族）、
      任务内单调序号 00001..10000、序号复用与耗尽 fail-closed、跨发送方写入拒绝，
      以及 append-only sender index 与"索引条目必须指向已存在消息"的完整性检查。
    implementation_methods:
    - B3-M01
    - B3-M02
    prerequisites:
    - S-03 通过
    intended_changed_paths:
    - 08_os/03_mechanisms/communication_system/发送方区与序号契约_v1.yml
    - 08_os/06_execution/boot/communication_system/validator/
    outputs:
    - 序号分配与耗尽处理规则（fail_closed，不自动重试）
    - sender index 条目字段集合与禁止字段（无正文、无长摘要、无投递状态）
    validation:
    - 序号复用、越界（>10000）、跨任务复用、跨发送方写入均非零退出
    - message_id 与 sender 路径不一致时拒绝
    - 索引指向缺失消息时拒绝
    test_ids:
    - GC-T010
    - GC-T011
    - GC-T012
    - GC-T013
    - GC-T014
    - GC-T045
    retry_budget: 3
    exits:
    - pass
    - retry
    - invalidate_upstream
    exit_handling:
      pass: 进入 S-05
      retry: 修正序号/所有权规则后重跑，最多 3 次
      invalidate_upstream: ../03_结果建模/B_结果模型_v3.yml
    invalidate_upstream_target: workflow_stage_03_result_modeling
    invalidate_upstream_reason: >-
      若 sender_zone_and_sequence_contract 的所有权划分导致无法避免共享写入，
      属架构缺陷，须重开 B v3 的所有权与序号设计。
  - step_id: S-05
    name: documents_context_and_required_refs
    depends_on:
    - S-03
    - S-04
    action: >-
      实现通讯文档契约（Markdown + 最小 YAML front matter、发布后不可变、
      已存在仓库资源直接引用而不改写）、required_refs 的精确非递归读取集合，
      以及接收方 bootstrap 加载顺序：禁止默认目录扫描、递归引用展开与默认全量索引读取。
    implementation_methods:
    - B3-M01
    - B3-M02
    - B3-M05
    prerequisites:
    - S-04 通过
    intended_changed_paths:
    - 08_os/03_mechanisms/communication_system/文档与引用契约_v1.yml
    - 08_os/03_mechanisms/communication_system/接收方bootstrap_v1.md
    - 08_os/06_execution/boot/communication_system/validator/
    outputs:
    - 长内容外置为文档并以 required_refs 精确引用的规则
    - front matter 必填字段校验
    - bootstrap 读取集合的封闭定义与越界检测
    validation:
    - required_refs 缺失或与实际读取集合不符时拒绝
    - 目录扫描/递归展开/默认读全部索引的尝试被识别为越界
    - 缺 front matter 的新建文档被拒绝；改写已存在仓库资源被拒绝
    test_ids:
    - GC-T019
    - GC-T020
    - GC-T021
    - GC-T022
    - GC-T023
    - GC-T024
    - GC-T025
    retry_budget: 3
    exits:
    - pass
    - retry
    - invalidate_upstream
    exit_handling:
      pass: 进入 S-06
      retry: 修正引用/上下文规则后重跑，最多 3 次
      invalidate_upstream: ../03_结果建模/B_结果模型_v3.yml
    invalidate_upstream_target: workflow_stage_03_result_modeling
    invalidate_upstream_reason: >-
      若"精确读取集合"与"接收方仍需足够材料"在物理上不可同时满足，
      须重开 B v3 的 pointer_and_receiver_bootstrap，而不是放宽 GC-T019..GC-T022。
  - step_id: S-06
    name: local_web_publication_and_Human_relay
    depends_on:
    - S-04
    - S-05
    action: >-
      实现载体与发布模型：默认发布到 local；仅在三类触发条件下发布到 GitHub；
      发布前隐私分级检查（repository_shareable / local_only / forbidden）；
      发布顺序为"文档与授权 ref → 不可变消息 → 追加发送方索引 → 必要时更新 Human/current"；
      pointer 不得指向未发布产物；sent 只表示写入成功，不表示已读或已接受；
      不引入轮询、守护进程、自动投递、自动确认或自动任务状态推进。
    implementation_methods:
    - B3-M04
    - B3-M06
    prerequisites:
    - S-05 通过
    intended_changed_paths:
    - 08_os/03_mechanisms/communication_system/载体与发布契约_v1.yml
    - 08_os/06_execution/boot/communication_system/publisher/
    - 08_os/06_execution/boot/communication_system/validator/
    outputs:
    - 本地默认路由与 GitHub 触发条件判定
    - local_only 内容禁止进入 GitHub 的强制拦截
    - forbidden 数据标记检测
    - Human 转交 pointer 的必填字段校验
    validation:
    - local_only 内容尝试收敛到 GitHub 时 fail-closed
    - forbidden 标记出现在任何载体时拒绝
    - pointer 指向未发布消息时拒绝
    - 无 Human 触发时不产生任何 GitHub 发布动作（负例）
    - 代码中不存在 watcher/scheduler/daemon/自动投递路径（静态检查）
    test_ids:
    - GC-T026
    - GC-T027
    - GC-T028
    - GC-T029
    - GC-T030
    - GC-T035
    - GC-T036
    - GC-T037
    - GC-T038
    retry_budget: 3
    exits:
    - pass
    - retry
    - invalidate_upstream
    exit_handling:
      pass: 进入 S-07
      retry: 修正发布顺序或隐私拦截后重跑，最多 3 次
      invalidate_upstream: ../03_结果建模/B_结果模型_v3.yml
    invalidate_upstream_target: workflow_stage_03_result_modeling
    invalidate_upstream_reason: >-
      若 carrier_and_publication_model 与 Human 转交边界要求任何自动化才能闭合，
      须重开 B v3 的发布模型并请 Human 重新裁决 V1 边界。
  - step_id: S-07
    name: Git_convergence_conflict_and_NFF_fail_closed
    depends_on:
    - S-06
    action: >-
      实现整任务 Git 收敛：fetch 当前任务分支、无本地分叉时 fast-forward、
      只 stage 当前任务的 repository_shareable 路径、commit、push、停在最新远端 head。
      不同发送方各自拥有的路径可正常收敛；同路径或共享导航冲突 fail-closed；
      non-fast-forward 或未解决分叉 fail-closed；不做自动重试循环，升级给
      task_navigation_owner 再到 Human。
    implementation_methods:
    - B3-M06
    prerequisites:
    - S-06 通过
    intended_changed_paths:
    - 08_os/03_mechanisms/communication_system/Git收敛契约_v1.yml
    - 08_os/06_execution/boot/communication_system/convergence/
    outputs:
    - 收敛步骤序列与失败分类（可继续 / fail-closed / 升级）
    - 冲突升级路径与显式报告字段
    validation:
    - 不相交发送方路径的并发收敛成功
    - 同路径冲突与 non-fast-forward 均以非零退出并显式暴露原因
    - 无自动重试循环（静态检查）
    test_ids:
    - GC-T031
    - GC-T032
    - GC-T033
    - GC-T034
    retry_budget: 3
    exits:
    - pass
    - retry
    - invalidate_upstream
    exit_handling:
      pass: 进入 S-08
      retry: 修正收敛步骤或冲突分类后重跑，最多 3 次
      invalidate_upstream: ../03_结果建模/B_结果模型_v3.yml
    invalidate_upstream_target: workflow_stage_03_result_modeling
    invalidate_upstream_reason: >-
      若频繁同路径冲突表明所有权或序号设计失败（B v3 自身的判据），
      须重开 B v3 的 ownership/sequence 设计，而不是在收敛层加自动解冲突。
  - step_id: S-08
    name: discovery_Human_current_archive_and_private_runtime
