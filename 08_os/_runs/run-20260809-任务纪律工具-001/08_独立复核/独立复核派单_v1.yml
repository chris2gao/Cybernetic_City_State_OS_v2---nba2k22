evidence_status:
  executor_self_check: 07_测试执行/验证结果_v1.yml
  treat_as: claim_not_evidence
  reason: >-
    该文件由本任务执行者撰写，其中的正向结果与反向探针均由同一方设计并运行。
    它可作为"该方声称跑过什么"的线索，不可作为"这些命令确实通过"的证据。

must_reproduce_independently:
  note: 在你自己的 checkout 上重跑，不要引用执行者的输出。
  commands:
    - python -m pytest 08_os/06_execution/task_discipline -q
    - python 08_os/06_execution/task_discipline/quiet_verify/quiet_verify.py
    - >-
      python 08_os/06_execution/task_discipline/path_ledger/changed_path_ledger.py
      --base c7a508abbcda58361fc9b649236d44b706e0bdd4
      --packet 08_os/_runs/run-20260809-任务纪律工具-001/01_任务输入/任务包_v1.yml --list
    - >-
      python 08_os/06_execution/task_discipline/preflight/preflight_task_context.py
      --packet 08_os/_runs/run-20260809-任务纪律工具-001/01_任务输入/任务包_v1.yml
  own_negative_probes_required: true
  own_negative_probes_guidance: >-
    自行设计破坏用例，不要照抄执行者那四条。至少覆盖：allowlist 匹配是否可能比意图更宽、
    preflight 是否会把"信息缺失"误报成"发现问题"或反之、quiet_verify 是否可能吞掉失败。

adjudication_questions:
  Q1_allowlist_matcher_width:
    ask: >-
      changed_path_ledger.matches 只支持 `dir/**` 前缀与精确路径。这个匹配器是否可能
      判定某个不该允许的路径为允许？特别检查 `dir/**` 的前缀匹配会不会命中
      `dir_other/...` 之类的兄弟前缀，以及尾部斜杠、大小写、Windows 反斜杠路径。
  Q2_ledger_completeness:
    ask: >-
      账本声称与 core.quotepath / status.showUntrackedFiles 无关。请构造你自己的敌对
      配置仓验证；并检查 rename/copy（R/C 状态）、删除（D）、子模块与符号链接是否被正确纳入或
      被有意排除。遗漏一类变更等于账本给出假阴性。
  Q3_preflight_hard_failure_set:
    ask: >-
      hard_failures 只把 5 类条件算作阻塞，并刻意让 None（信息未读）不阻塞。
      这个取舍是否会让 `--no-remote` 变成绕过 master 核对的后门？如果会，应如何收口？
  Q4_gate_semantics:
    ask: >-
      read_gate 用 `value is True` 判定门开。字符串 'true'、1、'yes' 都应判为未开。
      请验证并检查是否存在其他会被误判为开的取值。
  Q5_scope_extension:
    ask: >-
      执行者把 08_os/06_execution/README.md 加进了自己起草的任务包 allowlist，
      理由是新增 area 必须同步 area 清单（单窗口规范第 4 节）。
      这条自扩展是否成立？改动是否确实只限于追加 task_discipline 条目？
      判据：与 c7a508ab 的该文件逐行 diff。
  Q6_spec_section_accuracy:
    ask: >-
      规范新增第 1.2 节里引用了实测数字（54 文件清单 4720 → 3599 字符；单条路径 113 → 45）。
      请自行复算至少一项。规范正文里的数字若不可复现，比没有数字更糟。
  Q7_authority_language:
    ask: >-
      三个工具是否在任何地方隐含地授权了动作？特别是 preflight 报告 gate OPEN 时，
      文档、registry 与代码注释是否一致地声明"门开着不等于允许"。
  Q8_no_automation:
    ask: 确认未引入 watcher / scheduler / daemon / 后台轮询 / 自动状态推进。

acceptance_criteria:
  - 独立重跑的单测与校验器结果与你自己的观察一致，且退出码为 0
  - 你自己的反向探针证明三个工具在被破坏时会拒绝
  - Q1..Q8 每题有明确结论与其所依据的原始材料
  - 变更路径集合由你独立复算，且全部落在任务包 allowlist 内
  - master 远端 SHA 仍为 c7a508ab
  - 无 rebase / amend / squash / force-push / merge commit / 历史改写痕迹

known_open_items_declared_by_executor:
  note: >-
    以下由执行者主动声明，列出是为了避免复核者把"已知未做"误当成"隐瞒"。
    它们不是免检项：复核者仍应判断这些声明是否完整、是否还有未声明的缺口。
  items:
  - master 未修改也未合并；合并需合并时点的 Human 明确授权
  - .pytest_cache 三处目录权限异常未处理，仅用 .git/info/exclude 消除 git 噪声
  - git 配置与 .git/info/exclude 不进 Git，不随合并传播，换机器需重设
  - quiet_verify 内置检查集硬编码四个既有校验器路径，这些路径变动时需同任务更新
  - preflight 的 git 管道部分未做跨平台矩阵测试，仅在 Windows/Python 3.14 上真实调用过
  - 未提供 token 节省数字，因为没有同规模任务的实测对照
  - >-
    执行者在 c0c0024e 与 ab1310d7 两次提交里推送过 YAML 结构错误的 run 产物，
    原因是解析检查跑了但没被设为门；已在后续提交修复，并记入
    07_测试执行/验证结果_v1.yml 的 executor_incident_log。
    请自行确认 candidate_head 上所有 run 产物均可 safe_load 且为单文档。

out_of_scope_for_this_review:
  - 是否应当合并到 master（属 Human 授权，不属复核判定）
  - 工具未来是否扩展更多检查
  - 其他 run 目录下的任何产物

