MAJOR_1_reasoned_disposition_guard:
  source_finding: MAJOR-1
  source_evidence_refs: [E-002, E-020]

  required_distinction_addition:
    - counting_participants_votes_majorities_or_headcount_is_not_reasoned_issue_or_option_treatment

  object_contract_additions:
    objection_disposition_record:
      add_required_fields:
        - disposition_basis
      disposition_basis_contract:
        required_meaning: reasoned_treatment_of_the_issue_or_objection
        may_include:
          - argument_refs
          - evidence_refs
          - criteria_result
          - explicit_reason
          - authority_ref_when_authority_is_relevant
        prohibited_as_sole_basis:
          - vote_count
          - majority_count
          - participant_headcount
          - silence
          - objector_withdrawal_or_absence
    option_disposition_record:
      add_required_fields:
        - disposition_basis
      disposition_basis_contract:
        required_meaning: reasoned_treatment_against_declared_criteria_arguments_evidence_and_valid_Human_decision_when_selected
        prohibited_as_sole_basis:
          - vote_count
          - majority_count
          - participant_headcount
          - popularity_without_reasoned_criteria

  cross_dimension_invariant_addition:
    invariant_id: INV-16
    rule: vote_majority_or_headcount_does_not_constitute_issue_objection_or_option_disposition
    nuance: counting_may_be_recorded_as_context_but_cannot_satisfy_reasoned_disposition_by_itself
    violation_code: headcount_used_as_disposition

  failure_code_addition:
    - headcount_used_as_disposition

  Stage_06_negative_case_addition:
    - vote_or_majority_used_as_issue_objection_or_option_disposition

