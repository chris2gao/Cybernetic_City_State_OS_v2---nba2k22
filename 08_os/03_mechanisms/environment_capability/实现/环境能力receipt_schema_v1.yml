{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "$id": "urn:citystate:environment-capability-receipt:v1",
  "title": "City-State environment capability receipt v1",
  "type": "object",
  "additionalProperties": false,
  "required": [
    "schema_version",
    "receipt_id",
    "task_id",
    "measured_at",
    "environment_class",
    "model_availability",
    "toolchain",
    "publication_transport",
    "boundaries",
    "runtime_limits",
    "invalidation_events"
  ],
  "properties": {
    "schema_version": {
      "const": "citystate.environment_capability_receipt.v1"
    },
    "receipt_id": {
      "$ref": "#/$defs/identifier"
    },
    "task_id": {
      "$ref": "#/$defs/identifier"
    },
    "measured_at": {
      "type": "string",
      "format": "date-time"
    },
    "environment_class": {
      "$ref": "#/$defs/category"
    },
    "model_availability": {
      "$ref": "#/$defs/category"
    },
    "toolchain": {
      "$ref": "#/$defs/category"
    },
    "publication_transport": {
      "$ref": "#/$defs/category"
    },
    "boundaries": {
      "$ref": "#/$defs/category"
    },
    "runtime_limits": {
      "$ref": "#/$defs/category"
    },
    "invalidation_events": {
      "type": "array",
      "minItems": 1,
      "uniqueItems": true,
      "items": {
        "type": "object",
        "additionalProperties": false,
        "required": ["id", "trigger", "required_action"],
        "properties": {
          "id": {"$ref": "#/$defs/identifier"},
          "trigger": {"$ref": "#/$defs/safeString"},
          "required_action": {"const": "remeasure_before_use"}
        }
      }
    }
  },
  "$defs": {
    "identifier": {
      "type": "string",
      "pattern": "^[a-z0-9][a-z0-9._-]*$",
      "minLength": 1,
      "maxLength": 160
    },
    "safeString": {
      "type": "string",
      "minLength": 1,
      "allOf": [
        {"not": {"pattern": "[A-Za-z]:[\\\\/]"}},
        {"not": {"pattern": "/(home|Users|mnt)/"}},
        {"not": {"pattern": "\\\\\\\\[^\\\\/\\s]+[\\\\/]"}}
      ]
    },
    "safeValue": {
      "oneOf": [
        {"$ref": "#/$defs/safeString"},
        {"type": "number"},
        {"type": "boolean"},
        {"type": "null"},
        {
          "type": "array",
          "items": {"$ref": "#/$defs/safeValue"}
        },
        {
          "type": "object",
          "propertyNames": {"pattern": "^[a-z][a-z0-9_]*$"},
          "additionalProperties": {"$ref": "#/$defs/safeValue"}
        }
      ]
    },
    "measurementSource": {
      "type": "object",
      "additionalProperties": false,
      "required": ["kind", "probe", "result"],
      "properties": {
        "kind": {
          "enum": [
            "command",
            "derived_probe",
            "host_runtime_contract",
            "repository_protocol",
            "task_packet"
          ]
        },
        "probe": {"$ref": "#/$defs/safeString"},
        "result": {"$ref": "#/$defs/safeString"},
        "exit_code": {
          "oneOf": [
            {"type": "integer"},
            {"type": "null"}
          ]
        }
      }
    },
    "observation": {
      "type": "object",
      "additionalProperties": false,
      "required": ["id", "status", "measurement_source"],
      "properties": {
        "id": {"$ref": "#/$defs/identifier"},
        "status": {"enum": ["observed", "not_observable"]},
        "value": {"$ref": "#/$defs/safeValue"},
        "reason": {"$ref": "#/$defs/safeString"},
        "limitations": {
          "type": "array",
          "minItems": 1,
          "items": {"$ref": "#/$defs/safeString"}
        },
        "measurement_source": {"$ref": "#/$defs/measurementSource"}
      },
      "allOf": [
        {
          "if": {"properties": {"status": {"const": "observed"}}},
          "then": {
            "required": ["value"],
            "not": {"required": ["reason"]}
          }
        },
        {
          "if": {"properties": {"status": {"const": "not_observable"}}},
          "then": {
            "required": ["reason"],
            "not": {"required": ["value"]}
          }
        }
      ]
    },
    "category": {
      "type": "object",
      "additionalProperties": false,
      "required": ["observations"],
      "properties": {
        "observations": {
          "type": "array",
          "minItems": 1,
          "items": {"$ref": "#/$defs/observation"}
        }
      }
    }
  }
}
