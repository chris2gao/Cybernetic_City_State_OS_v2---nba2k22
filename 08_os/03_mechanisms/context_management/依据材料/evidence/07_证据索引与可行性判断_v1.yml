    信息可信度: 5
    可信度理由: 官方框架能力、内部经验与实际闭环一致。
    时间适用性: 框架 API 可能变化，机制原语稳定
    适用边界: 结构化不自动等于语义充分；必须定义下游关键字段、补充路径和验证。
