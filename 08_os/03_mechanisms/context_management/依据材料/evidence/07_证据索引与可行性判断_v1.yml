    - 显式 publish_allowlist；禁止角色交接使用 git add --all。
    - 确定性 current/stale validator；规划角色决定重跑范围。
    - 生命周期顺序：先提取耐久事实，再删除低价值私有过程。
    - Web 受限交接空间必须按任务和 Web 角色独立授权，只暴露获准输入并只接收结构化结果。
    - Web 角色不得读取主仓库、其他任务或其他角色空间；交接边界必须可撤销、可审计。
    - B 比较独立仓库、受控网关或其他同等边界实现；GitHub repo-per-role 只是未验证候选。
  must_not_claim:
    - clone/worktree 能提供技术访问隔离。
    - Windows DACL 是不可绕过的生产沙箱。
    - 最小输入体积等于模型质量提高。
    - 开放发现已达到领域完整。
    - 每任务每 Web 角色仓库的运营成本已验证。
  downstream_tests:
    - 真实小型第二代 OS planner-executor-reviewer 闭环。
    - 角色私有区代表性越界抽查与发布泄漏测试。
    - 无旧聊天恢复、补充申请、stale 阻断和独立审核。
    - 任务完成后耐久事实保留与私有过程清理。
    - B 选定 Web 交接实现后验证独立授权、越界拒绝、撤销和审计；选择 repo-per-role 时另行运行受保护的远程生命周期成本试验。

