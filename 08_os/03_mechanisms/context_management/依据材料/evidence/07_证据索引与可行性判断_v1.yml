    对测试的潜在线索: 缺失必填字段、哈希不匹配和语义不足必须产生可观察失败或补充请求。
    事实与推断:
      读到的事实: 多个框架提供 typed handoff、过滤、持久化和最小 worker output。
      合并方推断: 最小上下文必须由 OS policy/schema 强制，不应假定框架默认提供。
