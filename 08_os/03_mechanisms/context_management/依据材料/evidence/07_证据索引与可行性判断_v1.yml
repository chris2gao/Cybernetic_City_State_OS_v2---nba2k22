research_question_closure:
  - id: RQ-01
    类型: 定向核实
    status: answered_with_boundaries
    answer: 无关信息、输入长度和信息位置会造成可观察风险，但效应依模型、任务和检索质量变化，不能使用统一有效窗口阈值。
    stop_basis: 多项同行评审研究方向一致，且反例与改进边界已记录。
  - id: RQ-02
    类型: 开放发现
    捕获单位: 机制模式
    status: sufficient_for_B
    answer: 已获得角色专用上下文、结构化交接、持久化恢复、状态/事件分离、按需加载和有损缩减等主要机制族。
    stop_basis: Chapman 覆盖为方向性 69.23%；继续宽泛发现 EIG 低，现有机制空间足以定义 B 的主要维度。
  - id: RQ-03
    类型: 定向核实
    status: answered
    answer: 第一代 OS 的懒加载、角色 Profile、fast path、状态与失败记录可作为证据；旧格式、活动状态和隐式共享不可继承。
    stop_basis: 指定内部材料已形成结构化内部证据，过期与失败边界已标记。
  - id: RQ-04
    类型: 开放发现
    捕获单位: 隔离机制
    status: answered_with_runtime_limits
    answer: clone/worktree 可组织默认加载面但不是访问边界；当前 Windows 非提升环境可用可逆 DACL 约束正常读取路径，但不构成抗绕过安全边界。
    stop_basis: 机制族覆盖为方向性 86.27%，本机正负例已完成；继续枚举安全机制不再改变第一版 B 的分层结构。
  - id: RQ-05
    类型: 定向核实
    status: unresolved_non_blocking
    answer: >-
      A v2 已固定 Web 受限交接空间的结果要求：按任务和 Web 角色独立授权、不可读取主仓库或其他空间、可撤销且可审计。
      官方能力支持组织仓库的仓库级角色和团队授权，个人仓库权限过粗；repo-per-role 生命周期成本仍未做真实试验，
      独立仓库、受控网关或其他满足同等边界的具体传输实现由 B 比较选择。
    stop_basis: >-
      阶段二已有足够证据把 A v2 的硬结果约束和候选实现直接交给 B；具体实现的选择不阻塞 03_结果建模。
      B 选定实现后，相应 05_步骤拆分和 06_执行必须等待所需测试或受保护运行试验，禁止把未测 GitHub 拓扑写成已验证事实。
  - id: RQ-06
    类型: 开放发现
    捕获单位: 版本与失效模式
    status: answered_and_runtime_verified
    answer: 显式依赖、内容指纹和固定入口可确定性标记 stale；checkpoint 本身不等于依赖失效传播。
    stop_basis: 发现统计的 100% 不作为完整性证明，但哈希变化后 executor 与 reviewer 均被实际标记 stale。
  - id: RQ-07
    类型: 定向核实
    status: sufficient_for_next_stage
    answer: 规划、执行、审核和 Web 外部角色足以定义第一版角色族；精确 I/O 契约和最终名单属于 B 与测试阶段设计，不由阶段二拍板。
    stop_basis: 当前工具和角色路径已完成一次 planner-executor-reviewer 闭环，未发现必须在阶段二新增角色的证据。

证据条目:
  - evidence_id: E-CTX-001
    research_question_ids: [RQ-01]
    主张: 完整历史重放不应作为默认恢复方式，因为长输入、无关信息和位置变化会产生可观察的模型表现风险。
    方向: 支持
    source_refs:
      - source_id: SRC-DR-CGPT
        location: Directed findings / Long context；Evidence register E-01 至 E-04
        original_source: false
      - source_id: SRC-DR-GEM
        location: 1.1 长上下文与无关信息
        original_source: false
    独立性:
      independent_source_count: 4
      shared_origin: 两路报告共享部分论文；独立数按 Lost in the Middle、input-length、realistic RAG distractor、long-context scaling 等首发研究族计算。
    信息可信度: 5
    可信度理由: 多项同行评审研究方向一致，并保留模型与任务差异的反证边界。
    时间适用性: 当前但随模型训练进步可能变化
    适用边界: 不支持固定 10% 至 20% 有效上下文阈值，也不支持所有长上下文任务都会失败。
    与A的关系:
      supports_success_criteria: [执行角色默认只接收当前步骤的最小必要上下文]
      tests_assumptions: [默认最小上下文能够降低误读、注意力漂移和 token 消耗]
      resolves_ambiguities: []
    对B的约束: 默认入口使用小型有效状态和精确引用；保留原始证据或事件记录作为补充路径。
    对测试的潜在线索: 在真实任务比较全量历史包与最小入口的质量、补充次数和 token 成本。
    事实与推断:
      读到的事实: 长输入、位置和高质量干扰项在多种评测中会影响表现，且新模型并非统一失败。
      合并方推断: 最小上下文适合作为默认策略，但不能成为唯一恢复路径。
