workflow_id: context-management-mechanism
stage: 02_信息收集与提炼
version: 1
requirement_ref: 08_os/03_mechanisms/context_management/依据材料/requirement/A_需求建模_v1.yml
requirement_confirmation_ref: 08_os/03_mechanisms/context_management/依据材料/requirement/人类确认_v1.yml
created_at: 2026-07-29

挖掘目标:
  支持命题: >-
    在当前本地开发环境中，可以用较低的控制面成本建立一套角色化默认上下文隔离与耐久任务记忆机制，
    使规划、执行、审核等独立模型默认只获得完成自身职责所需的信息，并能跨会话恢复状态、结构化交接、
    处理上游版本变化，最终完成一个真实的小型第二代 OS 开发任务闭环。
  推翻条件:
    - 当前可用模型与工具无法在不共享完整工作区或对话历史的情况下完成协作。
    - 默认最小上下文不能降低误读、注意力漂移或 token 消耗，反而造成更高的反复补充成本。
    - 固定角色入口与结构化交接不足以恢复和推进任务，必须保留完整私有历史或全局上下文。
    - 当前本地环境无法以可接受成本实现任务与角色的默认信息分区。
    - Web 模型按任务和角色使用受限交接空间的管理成本高于它带来的上下文收益。
    - 版本依赖、失效传播和任务清理需要的控制面复杂度超过第一版可接受范围。

研究问题:
  - id: RQ-01
    问题: 无关信息、过长上下文或相关信息位置变化，是否会显著降低大模型任务表现？
    类型: 定向核实
    用途: 验证角色化最小上下文的核心价值假设。
    停止条件: 两个独立的一手研究或官方技术来源得出方向一致的结论，并记录适用边界。

  - id: RQ-02
    问题: 现有 agent 系统如何实现角色专用上下文、结构化交接、跨会话记忆和状态恢复？
    类型: 开放发现
    捕获单位: 机制模式
    用途: 为结果建模 B 提供候选机制空间，不在本阶段选最佳方案。
    停止条件: 新一轮不再产生会改变 B 结构的新机制模式，或 EIG 已不足。

  - id: RQ-03
    问题: 第一代 OS 已经验证了哪些上下文加载、角色分区、任务追踪与失效处理机制，哪些问题不应继承？
    类型: 定向核实
    用途: 选择性借鉴第一代，不兼容其格式与历史。
    停止条件: 指定内部材料均被读取，关键结论可回指原文件，矛盾与过期项已标记。

  - id: RQ-04
    问题: 当前本地开发环境中有哪些低成本机制可实现任务与角色的默认工作区分区，并约束模型可调用工具的正常读取路径？
    类型: 开放发现
    捕获单位: 隔离机制
    用途: 为第一版本地实现提供候选结构。
    停止条件: 已覆盖 Git 工作区、操作系统权限、容器或沙箱、工具网关等主要机制族，继续发现不再改变候选结构。

  - id: RQ-05
    问题: GitHub 的权限粒度是否支持 Web 模型按任务、按角色使用独立受限交接空间；其操作成本和限制是什么？
    类型: 定向核实
    用途: 验证每个任务、每个 Web 角色独立受限仓库这一需求假设。
    停止条件: GitHub 官方权限文档与一次实际仓库权限试验能够共同回答。

  - id: RQ-06
    问题: 现有工作流或 agent 系统如何表示产物版本依赖、状态恢复和上游变更后的下游失效？
    类型: 开放发现
    捕获单位: 版本与失效模式
    用途: 支撑角色入口、版本引用与确定性失效传播的 B 建模。
    停止条件: 新发现不再改变依赖表示、失效检测、恢复入口三类结构。

  - id: RQ-07
    问题: 当前可用独立模型、工具和角色分工是否足以覆盖第一版 workflow？
    类型: 定向核实
    用途: 核对固定基础角色及执行环境约束。
    停止条件: 指定角色材料与实际可用环境一致，缺口被明确记录。

领域:
  - 领域: LLM 上下文工程与长上下文评测
    为什么相关: 验证无关上下文、上下文长度和信息位置对模型表现的影响。
    研究问题: [RQ-01]
  - 领域: 多模型与多代理编排
    为什么相关: 寻找角色分工、专用上下文和受控交接模式。
    研究问题: [RQ-02, RQ-07]
  - 领域: Agent 记忆、检查点与状态持久化
    为什么相关: 支持会话丢失后的恢复、任务连续性和长期事实保存。
    研究问题: [RQ-02, RQ-06]
  - 领域: 结构化通信与 handoff
    为什么相关: 角色之间不能依赖共享私有区，必须传递最小充分信息。
    研究问题: [RQ-02]
  - 领域: 本地工作区、Git、权限与沙箱
    为什么相关: 为当前开发环境建立低成本的默认任务和角色分区。
    研究问题: [RQ-04]
  - 领域: GitHub 仓库权限与 Web 模型交接
    为什么相关: 验证受限交接仓库的权限粒度和运行成本。
    研究问题: [RQ-05]
  - 领域: 依赖图、版本、失效传播与生命周期
    为什么相关: 上游产物改变后需要阻止下游继续使用旧上下文，并在完成后清理私有过程。
    研究问题: [RQ-06]
  - 领域: 第一代 OS 内部机制与失败证据
    为什么相关: 提取已验证机制及反例，避免把旧格式和历史包袱带入第二代。
    研究问题: [RQ-03]

EIG_预筛选:
  暂不单独深挖:
    - 领域: 通用认知科学理论
      原因: 当前只需确认无关上下文会影响模型表现；不需要在阶段二建立完整人类注意力理论。
    - 领域: 零信任与对抗安全
      原因: A 明确不以抵御恶意模型或宿主机管理员为目标。
    - 领域: 跨平台兼容
      原因: 第一版只支持当前本地开发环境。

内部指定材料:
  - 系统机制总结.md
  - 08_os/可使用的独立模型和角色.md
  - 08_os/02_boot/协作伙伴.md
  - 08_os/03_mechanisms/context_management/依据材料/requirement/A_需求建模_v1.yml

问题类型规则:
  - 定向核实题看独立来源的一致性与矛盾，不计算捕获-再捕获覆盖率。
  - 开放发现题才计算重合与覆盖；每个问题单独声明捕获单位。
  - 同一 workflow 实例可以同时包含两类问题，不能给整轮研究只贴一个问题类型标签。
