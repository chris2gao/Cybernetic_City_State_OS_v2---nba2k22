schema_version: stage_collaborative_deliberation.profile_contract.v1
mechanism_id: stage_collaborative_deliberation_and_incremental_reconfirmation
mechanism_version: 1
status: staged_inert
purpose: Define the closed machine-readable contract for workflow-stage profiles without copying the global mechanism body.
required_profile_fields:
- mechanism_ref
- profile_id
- profile_version
- main_mechanism_ref
- trigger_conditions
- required_model_fields
- discussion_focus
- external_action_triggers
- material_event_triggers
- granularity_evaluation_required
- open_detail_divergence_event_refs
- start_gate
- completion_gate
- prohibited_actions
field_contracts:
  mechanism_ref:
    type: string
    required: true
    exact_value: 08_os/03_mechanisms/stage_collaborative_deliberation/README.md
  profile_id:
    type: string
    required: true
    pattern: ^workflow_stage_0[1-7]_[a-z0-9_]+$
  profile_version:
    type: integer
    required: true
    minimum: 1
  main_mechanism_ref:
    type: array
    required: true
    minimum_items: 1
    allowed_values:
    - MM-01
    - MM-02
    - MM-03
    - MM-04
    - MM-05
    - MM-06
    - MM-07
    - MM-08
  trigger_conditions:
    type: array
    required: true
    minimum_items: 1
  required_model_fields:
    type: array
    required: true
    minimum_items: 1
  discussion_focus:
    type: array
    required: true
    minimum_items: 1
  external_action_triggers:
    type: array
    required: true
  material_event_triggers:
    type: array
    required: true
    minimum_items: 1
  granularity_evaluation_required:
    type: boolean
    required: true
    exact_value: true
  open_detail_divergence_event_refs:
    type: array
    required: true
  start_gate:
    type: array
    required: true
    minimum_items: 1
  completion_gate:
    type: array
    required: true
    minimum_items: 1
  prohibited_actions:
    type: array
    required: true
    minimum_items: 1
common_invariants:
- profile_must_be_reference_not_copy
- profile_default_state_is_dormant
- profile_cannot_authorize_execution_activation_or_master_integration
- field_occupancy_alone_does_not_prove_model_completeness
- schema_adequacy_unknown_fails_closed
- ordinary_local_choice_must_not_require_Human_scope_escalation
- second_order_detail_requires_durable_event_and_Human_scope_decision
- open_detail_divergence_event_refs_must_be_explicit_even_when_empty
- start_and_completion_gates_must_be_stage_specific
- missing_partial_stale_unknown_invalid_or_unauthorized_fails_closed
model_space_contract:
  layers:
  - general_modeling_substrate
  - workflow_stage_schema
  - task_specific_schema
  - domain_specific_schema_when_needed
  bearing_dimension_test: changing_the_dimension_could_change_target_decision_risk_test_authority_dependency_version_validity_or_downstream_acceptance
  allowed_dispositions:
  - represented_with_supported_value
  - explicitly_irrelevant_with_reason_and_scope
  - unknown_with_blocking_or_deferred_disposition_and_revisit_trigger
  all_fields_present_alone: must_not_pass
  unknown_adequacy: fail_closed
activation_contract:
  default: dormant
  modes:
  - dormant
  - full
  - incremental
  minimum_substantive_rounds:
    full: 5
    incremental: 2
  formalistic_round_counts: false
  Human_authorization_required_when_profile_gate_requires_activation: true
reference_not_copy:
  workflow_stage_may_store:
  - mechanism_ref
  - profile_id
  - profile_version
  - gate_refs
  - receipt_ref
  workflow_stage_must_not_store:
  - mechanism_body
  - duplicated_router_logic
  - duplicated_profile_body
candidate_state:
  loadable_now: false
  activatable_now: false
  reason: P1 provides public method and profiles only; later packages and Human activation are absent.
