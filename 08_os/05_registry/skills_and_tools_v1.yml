tools:
  - name: check-jsonschema
    version: 0.37.4
    status: verified_on_demand
    mount: on_demand_cli
    default_loaded: false
    mcp_exposed: false
    expected_version: 0.37.4
    version_gate: exact_runtime_probe_before_validation
    schema_reference_policy: self_contained_json_fragment_only
    schema_preflight: 08_os/06_execution/tools/check_jsonschema/inspect_schema_refs.py
    validation_command: >-
      pwsh -NoProfile -File
      08_os/_runs/run-012-check-jsonschema安装接入验证/07_测试执行/run_validation.ps1
    validated_at: "2026-07-30"
    evidence: 08_os/_runs/run-012-check-jsonschema安装接入验证/07_测试执行/results.json
    upgrade_and_revalidation: >-
      After any version, runtime, wrapper or schema-policy change, rerun run-012
      metaschema, positive, core negative, reference-closure, version-drift,
      five-repeat, Unicode-path and unavailable-tool tests.
    canonical_wrapper: 08_os/06_execution/tools/check_jsonschema/invoke.ps1
  - name: mutmut
    version: 3.6.0
    status: verified_on_demand
    mount: on_demand_wsl_cli
    default_loaded: false
    mcp_exposed: false
    expected_version: 3.6.0
    version_gate: exact_runtime_probe_before_mutation
    workspace_policy: wsl_linux_filesystem_clean_git_worktree
    target_policy: explicit_single_python_file_allowlist
    validation_command: >-
      bash
      08_os/_runs/run-013-mutmut安装接入验证/07_测试执行/run_validation.sh
      /absolute/path/to/dedicated-mutmut-venv
    validated_at: "2026-07-30"
    evidence: 08_os/_runs/run-013-mutmut安装接入验证/07_测试执行/results.json
    upgrade_and_revalidation: >-
      After any mutmut, Python, wrapper, target configuration or test-semantics
      change, rerun run-013 calibration, real target, wrapper boundary and
      repository-state validation.
    canonical_wrapper: 08_os/06_execution/tools/mutmut/invoke.sh
  - name: cosmic-ray
    version: 8.4.6
    python_version: 3.14.4
    pytest_version: 9.1.1
    include_system_site_packages: false
    status: verified_on_demand
    mount: on_demand_wsl_cli
    default_loaded: false
    mcp_exposed: false
    expected_version: 8.4.6
    version_gate: exact_cosmic_ray_python_pytest_and_isolated_pyvenv_before_session_init
    python_environment: PYTHONPATH_PYTHONHOME_PYTHONUSERBASE_unset
    workspace_policy: wsl_linux_filesystem_clean_git_worktree
    target_policy: explicit_single_python_file_allowlist
    distributor: local
    workers: 1
    unsafe_outcome_policy: timeout_incomplete_incompetent_or_worker_error_exit_72
    validation_command: >-
      bash
      08_os/_runs/run-014-cosmic-ray安装对照验证/07_测试执行/run_validation.sh
      /absolute/path/to/dedicated-cosmic-ray-venv
    validated_at: "2026-08-01"
    evidence: 08_os/_runs/run-014-cosmic-ray安装对照验证/07_测试执行/results.json
    upgrade_and_revalidation: >-
      After any Cosmic Ray, Python, pytest, wrapper, summary, local distributor,
      target configuration or test-semantics change, rerun run-014 calibration,
      timeout, real target, wrapper matrix and repository-state validation.
    canonical_wrapper: 08_os/06_execution/tools/cosmic_ray/invoke.sh
excluded:
  - candidate packages, runtimes, MCP servers, and skills not explicitly listed under tools
  - 08_os/_runs/**
