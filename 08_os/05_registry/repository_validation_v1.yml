schema_version: citystate.registry.v1
mechanism_version: 1

validators:
  - path: 08_os/06_execution/validators/personal_paths/README.md
    purpose: Personal-path validator contract, invocation, variant configuration and exit-code semantics.
    loader: Human or development executor preparing to validate repository evidence.
    loader_class: in_repo_program
    discovery: referenced from 08_os/06_execution/README.md and this registry
    evidence: 08_os/06_execution/validators/personal_paths/tests/test_validate.py
    cache_dirs: []
    failure_surfacing: next validator invocation or contract review
    deletion_rule: protected

  - path: 08_os/06_execution/validators/personal_paths/validate.py
    purpose: Scan selected tracked or changed UTF-8 repository text for configured personal absolute-path variants.
    loader: Python invoked by a Human, development executor or later explicit machine gate.
    loader_class: in_repo_program
    discovery: referenced from its README and this registry
    evidence: 08_os/06_execution/validators/personal_paths/tests/test_validate.py
    cache_dirs: []
    failure_surfacing: immediately through exit code 1 for findings or 2 for invocation errors
    deletion_rule: protected

  - path: 08_os/06_execution/validators/personal_paths/patterns.json
    purpose: Configurable default segmented personal-path families, variants and case-sensitivity flags.
    loader: 08_os/06_execution/validators/personal_paths/validate.py
    loader_class: in_repo_program
    discovery: hardcoded default adjacent to validate.py; overridable with --config
    evidence: 08_os/06_execution/validators/personal_paths/tests/test_validate.py
    cache_dirs: []
    failure_surfacing: immediately as validator exit code 2 when missing or malformed
    deletion_rule: protected

  - path: 08_os/06_execution/validators/personal_paths/tests/test_validate.py
    purpose: Positive, negative, changed-mode, variant coverage, reporting and exit-code regression tests.
    loader: Python unittest discovery or explicit module invocation.
    loader_class: in_repo_program
    discovery: referenced from the validator README and registry evidence fields
    evidence: python -m unittest 08_os/06_execution/validators/personal_paths/tests/test_validate.py
    cache_dirs:
      - 08_os/06_execution/validators/personal_paths/tests/__pycache__/
    failure_surfacing: next validator test run
    deletion_rule: protected

  - path: 08_os/06_execution/validators/personal_paths/tests/fixtures/personal_path_segments.json
    purpose: Assemble a fake personal path at test runtime without committing a literal finding.
    loader: 08_os/06_execution/validators/personal_paths/tests/test_validate.py
    loader_class: in_repo_program
    discovery: hardcoded fixture path in test_validate.py
    evidence: negative-fixture test exits with validator finding code 1
    cache_dirs: []
    failure_surfacing: next validator test run
    deletion_rule: protected
