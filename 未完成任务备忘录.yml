schema_version: "plan3_unfinished_task_memo.v3"
document_name: "未完成任务备忘录"
document_role: "Plan 3 总体方案接管索引、进度总账与未完成任务路由"
last_architecture_review_date: "2026-07-15"
source_baseline:
  branch: "master"
  audited_start_head: "22cf4731cd29a2ebe271fe67fd561df1d0701d01"
  refreshed_publication_head: "merge_commit_containing_this_refresh"
  note: >
    audited_start_head 是 branch-consolidation-and-repository-ledger-0001 开始时物理核验的
    published master。refreshed_publication_head 使用自解析标记，因为 Git 提交不能在其
    自身内容中预先写入自己的 SHA；在 master 上读取本文件时，以包含本次刷新内容的
    normal merge commit 为准确发布 head，并继续用物理 Git 和活动 review mailbox 复核。

authority_and_freshness:
  authority_statement:
    - "本文件是 routing index 和 progress ledger，不是宪法、运行时授权或 live mailbox。"
    - "Human Speaker 是绝对路由器、跨域翻译者、首席裁判和最终授权门。"
    - "source/master push、PR/merge、runtime、Coordinator、Communication Gateway、destructive Git、secret-sensitive work 必须服从当前 Human 授权。"
  freshness_order:
    - "current explicit Human instruction"
    - "physical Git branch/HEAD and immutable evidence"
    - "validated active mailbox on ai/review/latest and every non-null dereferenced ref"
    - "published master baseline"
    - "this routing snapshot"
    - "historical reports and legacy branches"
  anti_hallucination:
    - "未读取，不声称。"
    - "未验证，不宣告成功。"
    - "README、PROJECT_CONTEXT、索引和本文件只用于路由，不能代替目标文件和 Git 证据。"

current_human_program_authorization:
  granted_at: "2026-07-15"
  authorization_status: "preapproved_for_program_scope"
  scope:
    - "完成 human-ai-communication-compliance-gate-0001 的范围内修正、exact-head review、正常 PR、normal merge commit、master publication 与 post-merge verification。"
    - "审计远端开发分支，并将确认仍有效、无冲突、无安全问题且可以进入 master 的分支通过正常 PR/merge 合并。"
    - "在根目录建立开发分支与合并进度总账，记录已合并、未合并、被替代、历史保留和 blocked 分支。"
    - "在本地切换到 master 后直接 git pull，使本地代码等于服务器最新合并后的 master。"
    - "除 Git 内部数据目录外，为 repository tracked tree 的根目录和各级目录建立或更新 index.md。"
    - "在最新 master 上重新检查总体方案，但暂停继续实现总体方案。"
  no_repeat_human_gate_required_for:
    - "原任务范围内的修正、验证、报告、commit、开发分支 push、正常 PR、normal merge 和 post-merge verification。"
    - "经审计确认 safe_to_merge 的开发分支正常发布。"
    - "分支总账、目录索引生成器、index.md 生成与验证。"
    - "总体方案只读检查和审计报告。"
  still_fail_closed_for:
    - "secret、凭证、隐私或安全风险。"
    - "force push、destructive Git、历史重写或不可恢复数据损坏。"
    - "无法自动解决的语义冲突、多个候选权威冲突或目标变化。"
    - "runtime、Coordinator、Communication Gateway、production writer 或 unattended automation 激活；这些不属于当前程序范围。"
  precedence_note: >
    “总体方案只检查、不继续实现”是当前更具体的 Human 指令，覆盖此前索引中
    “检查后继续实现 v0.2”的默认路线。恢复实现必须等待未来新的明确 Human 指令。

program_execution_order:
  - order: 1
    id: "finish-current-compliance-gate"
    status: "accepted_published"
    objective: "完成当前 Human-AI Communication Compliance Gate 任务。"
    execution: >
      候选 17f97d1b3378ff1040e8fd498849743445217c44 已通过正常 ready PR #8，
      以 normal merge commit 22cf4731cd29a2ebe271fe67fd561df1d0701d01 发布到 master。
    human_decision: "preapproved"
  - order: 2
    id: "branch-consolidation-and-local-sync"
    status: "accepted_published_when_observed_on_master"
    objective: "审计和整合开发分支，建立分支总账，并同步本地 master。"
    deliverables:
      - "开发分支与合并进度总账.md"
      - "已审计的分支分类和证据"
      - "所有 safe_to_merge 分支的正常 PR/merge 结果"
      - "local master 与最新 origin/master 一致的验证"
    branch_classification:
      - "merged"
      - "safe_to_merge"
      - "needs_reconciliation"
      - "superseded"
      - "historical_only"
      - "blocked"
    local_sync_policy:
      precheck_policy: "minimal"
      required_commands:
        - "git switch master"
        - "git pull origin master"
      acceptance:
        - "git rev-parse HEAD 与 git rev-parse origin/master 相同。"
      note: "按 Human 指令，不增加复杂的本地 unique-commit/dirty-worktree 预审流程；pull 失败时如实报告。"
    human_decision: "preapproved_for_safe_to_merge_branches"
  - order: 3
    id: "repository-directory-index-system"
    status: "semantic_audit_corrected_and_validated_pending_exact_master_publication"
    publication_head_resolution: "merge_commit_containing_the_complete_index_system"
    objective: "为根目录和各级 tracked 目录建立 index.md，支持模型懒加载。"
    scope:
      include: "repository tracked tree"
      exclude:
        - ".git/ 及其他 Git 内部对象目录"
        - "本地未跟踪缓存、构建产物、IDE 临时目录、node_modules 和临时 worktree"
      github_note: ".github/ 若是 tracked repository content，则属于索引范围。"
    implementation_requirements:
      - "使用确定性生成器从 git ls-files 构建目录树。"
      - "每个 index.md 介绍本目录定位、子目录、每个文件的内容与作用、权威级别、推荐读取顺序和不应默认加载项。"
      - "实际读取文件结构后再写介绍；不确定时标记 unknown_requires_read，不凭文件名编造。"
      - "保留已有人工 README/index 内容或提供明确人工区块，不能静默覆盖。"
      - "二次运行字节稳定。"
    validation_targets:
      tracked_directories_indexed: "100%"
      tracked_files_listed: "100%"
      duplicate_file_entries: 0
      missing_file_entries: 0
      broken_relative_links: 0
      git_internal_directories_indexed: 0
      untracked_local_directories_indexed: 0
      deterministic_second_run_diff: 0
    human_decision: "preapproved"
    semantic_audit_closeout:
      baseline_head: "817039595e78a21356068d3854e380c73eed1417"
      scope: "160 directory indexes / 1806 direct-file entries / 159 direct-child-directory entries"
      result: "all baseline entries reviewed exactly once; deterministic generator corrections recorded"
      audit_report: ".ai/CODEX_REPORTS/repository-directory-index-system-semantic-audit-0001.md"
      validation_report: ".ai/CODEX_REPORTS/repository-directory-index-system-semantic-validation-0001.md"
      changed_files_report: ".ai/CODEX_REPORTS/repository-directory-index-system-semantic-changed-files-0001.md"
  - order: 4
    id: "overall-plan-inspection-only"
    status: "blocked_by_phase_3_foreground_master_content_review"
    objective: "基于最新 master 和新目录索引重新检查总体方案。"
    mode: "read_only_audit"
    must_do:
      - "核验总体方案宪法、分层架构、已完成能力、候选能力、缺失控制面和 protected inactive 能力。"
      - "核验未完成任务备忘录.yml、根 index.md、各目录 index.md、分支总账和实际 Git 状态是否一致。"
      - "输出 actually_read_files、当前理解、证据、风险、缺口、优先级和建议的下一完整实现任务。"
      - "只生成审计报告和未来任务建议，不修改总体方案实现文件。"
    must_not_do:
      - "不创建 Plan 3 v0.2 控制面实现。"
      - "不创建 Context Memory、Task Type、Drift Recovery 或 Capability Registry 的正式实现文件。"
      - "不激活 runtime、Coordinator、Gateway、writer 或 automation。"
    human_decision: "preapproved_for_inspection_only"
    implementation_resume: "paused_until_new_explicit_human_instruction"

new_model_takeover:
  objective: >
    新模型从本文件进入后，应在不全量吞仓库的前提下，恢复 Plan 3 总体方案的
    宪法、分层架构、当前成熟度、正在进行的控制面任务和下一阶段顺序。
