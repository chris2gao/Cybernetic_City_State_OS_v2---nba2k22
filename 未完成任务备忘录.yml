    - "00_City_State_Routing_Table.md"

overall_plan:
  name: "Plan 3 External Augmentation OS"
  one_sentence_definition: >
    在多个可替换大模型外部建立一个由 Human Speaker 治理、以文档和 Git 为持久记忆、
    以懒加载控制上下文、以任务合同和验证控制执行、并逐步接入工具/skill/app/MCP 的
    本地化、可回溯、可审计、可扩展增强环境。
  governing_constitution:
    human_speaker:
      role:
        - "绝对路由器：决定任务进入 Engine A、Engine B 或先停在 Human gate。"
        - "跨域翻译者：把 Engine B 的知识裁决转译为明确 Engine A 工程任务。"
        - "首席裁判：处理语义、证据和跨学科冲突。"
        - "最终授权门：控制 protected publication、activation、secrets 和 destructive operations。"
    engine_a:
      name: "工业基建自动化引擎"
      scope: "代码、程序、测试、重构、脚本、协议文档落地和确定性计算。"
      workflow: "planning -> execution -> validation -> review"
    engine_b:
      name: "Human 主持的元老院知识法庭"
      scope: "医学、心理学、数学、哲学、认知科学、价值判断和跨学科含混问题。"
      workflow: "Human 主持 -> 多模型举证/反驳 -> 外部事实核查 -> Human 裁决"
      boundary: "AI 不得自行把 Engine B 裁决降格为 Engine A 执行任务。"
  target_outcomes:
    - "文档化的持久上下文记忆和可恢复接管。"
    - "长任务、短任务、规划任务、publication、drift recovery 等任务类型有统一合同。"
    - "新窗口、上下文边界和不可逆漂移可以通过索引与可信 checkpoint 恢复。"
    - "Git/GitHub 成为多模型高密度通信与证据层。"
    - "terminal、deterministic calculation、web、skill、app、MCP 等能力有明确状态与权限边界。"
    - "Human 获得简洁、可审计的 brief、决策入口和真实剩余决策。"
    - "未来 runtime/Coordinator/Gateway 只能在独立 Human gate 后启用。"

