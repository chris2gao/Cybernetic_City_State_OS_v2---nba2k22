  partially_implemented: "能力散布在现有协议中，但缺少统一权威文件或完整闭环。"
  planned: "已有架构定义，尚未实现。"
  absent: "目标文件或能力在本次 master 核验中不存在。"
  protected_inactive: "明确禁止默认激活，必须经过新的 Human gate。"
  historical: "仅保留历史证据，不代表当前状态。"

