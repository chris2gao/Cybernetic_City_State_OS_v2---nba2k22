schema_version: "1.0.0"
registry_id: "math-mentor-authority-registry-v1"
registry_role: "derived_non_authorizing_index"
operational_activation: false

baseline:
  source_branch: "master"
  source_head: "764d03d7d0a9ad553f4f3868699b06d9de5553ea"
  work_branch: "codex/math-mentor-p0-control-plane-hardening"
  human_gate_after_completion: "required"

decision_states:
  - "permit_read_only"
  - "permit_scoped_write"
  - "human_gate_required"
  - "deny"
  - "invalid_context"

source_states:
  - "external_current"
  - "task_scoped"
  - "active_durable"
  - "active_domain"
  - "historical_frozen"
  - "superseded"

global_invariants:
  - "This registry indexes authority; it does not create, authenticate, or elevate authority."
  - "Current platform, system, developer, and explicit Human instructions remain external inputs and outrank repository artifacts."
  - "Fresh Git or mailbox state establishes freshness only and never grants mutation, publication, runtime, or Coordinator authority."
  - "Unknown actions, unknown senders, missing required refs, stale source heads, and conflicting scope fail closed."
  - "A model-authored packet cannot authenticate or satisfy a Human Speaker gate."
  - "No rule permits Human Speaker bypass, Mode B machine pass, classroom-pass-to-graduated promotion, secret access, or unapproved protected actions."
  - "P0 validation is read-only control-plane work and does not activate a UI, runtime, production Coordinator, state writer, or scheduler writer."

authority_sources:
