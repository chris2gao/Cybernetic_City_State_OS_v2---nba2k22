action_rules:
  - action_id: "read_review_evidence"
    engine_route: "Plan3_Engine_A_or_B"
    default_decision: "permit_read_only"
    human_gate: "not_required"
    required_authority: ["platform_system_developer", "current_human_instruction"]
    required_evidence: ["task_scope", "required_refs"]
    allowed_side_effects: []
    forbidden_side_effects: ["write", "runtime_activate", "coordinator_activate"]

  - action_id: "write_scoped_p0_control_plane_artifact"
    engine_route: "Plan3_Engine_A"
    default_decision: "permit_scoped_write"
    human_gate: "task_scope_required"
    required_authority: ["current_human_instruction", "codex_task_input_contract"]
    required_evidence: ["exact_allowed_paths", "immutable_source_head"]
    allowed_side_effects: ["write_explicit_allowlist_only"]
    forbidden_side_effects: ["node_write", "bridge_write", "state_write", "scheduler_write", "runtime_activate", "coordinator_activate"]

  - action_id: "run_static_control_plane_validation"
    engine_route: "Plan3_Engine_A"
    default_decision: "permit_read_only"
    human_gate: "not_required_when_task_scoped"
    required_authority: ["current_human_instruction"]
    required_evidence: ["deterministic_command", "no_runtime_boundary"]
    allowed_side_effects: ["test_process", "explicit_task_evidence_write_only"]
    forbidden_side_effects: ["node_write", "bridge_write", "state_write", "scheduler_write", "runtime_activate", "coordinator_activate"]

  - action_id: "mutate_teaching_node"
    engine_route: "Plan3_Engine_A_with_Math_Mentor_semantic_review"
    default_decision: "human_gate_required"
    human_gate: "required"
    required_authority: ["current_human_instruction", "knowledge_completion_program"]
    required_evidence: ["exact_node_scope", "accepted_semantic_or_computational_evidence"]
    allowed_side_effects: []
    forbidden_side_effects: ["unscoped_node_write", "automatic_status_promotion"]

  - action_id: "open_p3_or_generate_bridge"
    engine_route: "Human_Speaker_required"
    default_decision: "human_gate_required"
    human_gate: "required"
    required_authority: ["current_human_instruction", "knowledge_completion_program", "bridge_schema_contract"]
    required_evidence: ["p3_reopened_true", "named_certified_endpoints", "immutable_source_head", "bridge_landing_authorized"]
    allowed_side_effects: []
    forbidden_side_effects: ["automatic_p3_open", "uncertified_endpoint_use", "automatic_bridge_write"]

  - action_id: "formal_coordinator_bridge_admission"
    engine_route: "Human_Speaker_required"
    default_decision: "human_gate_required"
    human_gate: "required"
    required_authority: ["current_human_instruction", "knowledge_completion_program", "bridge_schema_contract"]
    required_evidence: ["stage8_acceptance", "indexed_bridge", "mode_correct_validation", "integration_tests"]
    allowed_side_effects: []
    forbidden_side_effects: ["automatic_coordinator_consumption", "pending_bridge_consumption"]

  - action_id: "activate_runtime_or_production_coordinator"
    engine_route: "Human_Speaker_required"
    default_decision: "human_gate_required"
    human_gate: "required"
    required_authority: ["current_human_instruction", "ai_handoff_protocol"]
    required_evidence: ["separate_runtime_task", "exact_runtime_scope", "rollback_and_audit_plan"]
    allowed_side_effects: []
    forbidden_side_effects: ["documentation_only_activation", "implicit_coordinator_activation"]

  - action_id: "write_learning_state_or_review_schedule"
    engine_route: "Human_Speaker_required"
    default_decision: "human_gate_required"
    human_gate: "required"
    required_authority: ["current_human_instruction", "student_state_contract", "spaced_review_contract"]
    required_evidence: ["separate_writer_task", "privacy_scope", "persistence_and_rollback_plan"]
    allowed_side_effects: []
    forbidden_side_effects: ["legacy_prompt_write", "implicit_state_write", "implicit_scheduler_write"]

  - action_id: "publish_source_or_merge_master"
    engine_route: "Human_Speaker_required"
    default_decision: "human_gate_required"
    human_gate: "required"
    required_authority: ["current_human_instruction", "ai_handoff_protocol"]
    required_evidence: ["exact_accepted_head", "publication_authorization", "remote_readback"]
    allowed_side_effects: []
    forbidden_side_effects: ["force_push_protected_source", "publication_from_stale_head"]

  - action_id: "machine_pass_mode_b"
    engine_route: "none"
    default_decision: "deny"
    human_gate: "not_overridable_by_model_packet"
    required_authority: ["math_mentor_universal_protocol", "node_quality_audit_contract"]
    required_evidence: []
    allowed_side_effects: []
    forbidden_side_effects: ["machine_semantic_pass", "semantic_review_as_machine_proof"]

  - action_id: "promote_classroom_pass_directly_to_graduated"
    engine_route: "none"
    default_decision: "deny"
    human_gate: "not_a_valid_production_transition"
    required_authority: ["graduation_contract", "student_state_contract"]
    required_evidence: []
    allowed_side_effects: []
    forbidden_side_effects: ["r5_to_graduated", "classroom_pass_to_graduated", "legacy_table_status_promotion"]

  - action_id: "access_secrets_or_credentials"
    engine_route: "none"
    default_decision: "deny"
    human_gate: "explicit_exact_operation_and_platform_permission_required"
    required_authority: ["platform_system_developer", "current_human_instruction"]
    required_evidence: []
    allowed_side_effects: []
    forbidden_side_effects: ["secret_read", "credential_disclosure", "environment_dump"]

  - action_id: "bypass_human_speaker"
    engine_route: "none"
    default_decision: "deny"
    human_gate: "not_overridable_by_model_consensus"
    required_authority: ["plan3_human_speaker"]
    required_evidence: []
    allowed_side_effects: []
    forbidden_side_effects: ["authority_escalation", "model_consensus_replaces_human"]
