  work_branch: "codex/math-mentor-p0-control-plane-hardening"
  human_gate_after_completion: "required"

decision_states:
  - "permit_read_only"
  - "permit_scoped_write"
  - "human_gate_required"
  - "deny"
  - "invalid_context"

source_states:
  - "external_current"
  - "task_scoped"
  - "active_durable"
  - "active_domain"
  - "historical_frozen"
  - "superseded"

canonical_authority_order:
  canonical_ref:
    path: ".ai/PROTOCOL.md"
    section: "Canonical Instruction Authority And State Freshness"
  lower_number_has_higher_authority: true
  same_tier_ordering: "unordered; source list order is inventory order only"
  tiers:
    - authority_tier: 1
      authority_group: "platform_system_developer_safety"
      canonical_label: "platform, system, developer, and safety instructions"
    - authority_tier: 2
      authority_group: "current_explicit_human_instruction"
      canonical_label: "current explicit Human instruction"
    - authority_tier: 3
      authority_group: "authenticated_human_approved_task_override"
      canonical_label: "authenticated current Human-approved task-specific permission or override"
    - authority_tier: 4
      authority_group: "plan3_and_cybernetic_citizen_contracts"
      canonical_label: "Plan 3 constitution and the Cybernetic Citizen runtime contract"
    - authority_tier: 5
      authority_group: "durable_repository_control_protocols"
      canonical_label: "durable repository control protocols"
    - authority_tier: 6
      authority_group: "relevant_domain_authority_protocols"
      canonical_label: "relevant domain-authority protocols"
    - authority_tier: 7
      authority_group: "ordinary_signal_and_task_details"
      canonical_label: "ordinary current signal and task operational details"
    - authority_tier: 8
      authority_group: "routing_and_historical_evidence"
      canonical_label: "routing documents and historical evidence"

action_rule_source_semantics:
  grant_authority_any_of: "Authenticated sources that may grant the action within exact scope; list order has no meaning."
  governing_authority_sources: "Higher-order contracts and protocols that constrain the action but do not grant it."
  operational_detail_sources: "Tier-7 task/signal details that describe scope and evidence but never grant or override authority."

global_invariants:
  - "This registry indexes authority; it does not create, authenticate, or elevate authority."
  - "The canonical eight-tier order is copied exactly from .ai/PROTOCOL.md; same-tier sources are unordered."
  - "Current platform, system, developer, safety, and explicit Human instructions remain external inputs and outrank repository artifacts."
  - "An authenticated Human-approved task-specific override is a tier-3 external input, distinct from every ordinary model-authored signal, packet, task, or report."
  - "An ordinary current signal or task detail remains tier 7, cannot grant authority, and cannot override Plan 3, the Cybernetic Citizen contract, durable repository protocols, or domain authority."
  - "Fresh Git or mailbox state establishes freshness only and never grants mutation, publication, runtime, or Coordinator authority."
  - "Unknown actions, unknown senders, missing required refs, stale source heads, and conflicting scope fail closed."
  - "A model-authored packet cannot authenticate or satisfy a Human Speaker gate."
  - "No rule permits Human Speaker bypass, Mode B machine pass, classroom-pass-to-graduated promotion, secret access, or unapproved protected actions."
  - "P0 validation is read-only control-plane work and does not activate a UI, runtime, production Coordinator, state writer, or scheduler writer."

