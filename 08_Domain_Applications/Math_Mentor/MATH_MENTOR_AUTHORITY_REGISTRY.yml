    authority_rank: 1
    source_kind: "external"
    ref: null
    state: "external_current"
    verification: "provided_by_host_runtime"
    can_grant: true
    scope: "platform safety, system behavior, developer instructions, and tool permissions"

  - authority_id: "current_human_instruction"
    authority_rank: 2
    source_kind: "external"
