schema_version: "1.0.0"
registry_id: "math-mentor-capability-maturity-v1"
registry_role: "derived_evidence_index_not_activation"
operational_activation: false

baseline:
  source_head: "764d03d7d0a9ad553f4f3868699b06d9de5553ea"
  authority_registry_ref: "08_Domain_Applications/Math_Mentor/MATH_MENTOR_AUTHORITY_REGISTRY.yml"

evidence_tiers:
  T0:
    rank: 0
    meaning: "No implementation or validation evidence; absence, prohibition, or an unimplemented idea."
  T1:
    rank: 1
    meaning: "A repository contract, design, schema, prompt, source artifact, or implementation artifact exists; execution is not established."
  T2:
    rank: 2
    meaning: "Deterministic implementation has focused static, fixture, or unit-test evidence for the named scope; no runtime integration is established."
  T3:
    rank: 3
    meaning: "Integration or real-session evidence exists over real inputs and any claimed persistence is evidenced; production operation is not established."
  T4:
    rank: 4
    meaning: "Repeated production operation has audit, monitoring, rollback, and source-bound evidence."

maturity_states:
  absent:
    minimum_evidence_tier: "T0"
    maturity_rank: 0
  planned:
    minimum_evidence_tier: "T0"
    maturity_rank: 0
  specified:
    minimum_evidence_tier: "T1"
    maturity_rank: 1
  implemented_unvalidated:
    minimum_evidence_tier: "T1"
    maturity_rank: 1
  statically_validated:
    minimum_evidence_tier: "T2"
    maturity_rank: 2
  integration_validated:
    minimum_evidence_tier: "T3"
    maturity_rank: 3
  operational:
    minimum_evidence_tier: "T4"
    maturity_rank: 4

lifecycle_states:
  - "current"
  - "planned"
  - "blocked"
  - "deprecated"
  - "frozen"

activation_states:
  - "manual_only"
  - "read_only"
  - "human_gated"
  - "inactive"
  - "stale_historical"
  - "blocked"
  - "prohibited"

global_invariants:
  - "Maturity is an evidence statement, not activation or mutation authority."
  - "A maturity state cannot exceed the rank supported by evidence_tier."
  - "Evidence is bound to the source head and exact scope named by its reference."
  - "A stale result can remain historical evidence but cannot validate the current head."
  - "Mode B semantic review is never a machine pass."
  - "No documentation, schema, prompt, fixture, or static test activates runtime, Coordinator, UI, learning-state writes, or scheduler writes."
  - "classroom_passed is not graduated; no R5 or legacy table state may create production graduation semantics."

