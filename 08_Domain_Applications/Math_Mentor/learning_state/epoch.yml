# Binds learning events to a transition-table version.
#
# The reducer ignores any event whose learning_state_epoch differs from the
# bound value here.  Bumping the epoch is how a transition-table change avoids
# silently re-interpreting historical events.
#
# v1 -> v2 was forced by the 2026-07-19 independent review: transition edges,
# evidence requirements and correction support all changed, so v1 events must
# NOT be read under v2 semantics.

schema_version: "citystate.math_mentor.learning_state_epoch.v2"
bound_epoch: "learning-state-epoch-v2"
superseded_epoch: "learning-state-epoch-v1"
transition_table_ref: "08_Domain_Applications/Math_Mentor/learning_state/reduce_readonly.py"
transition_source_contract: "08_Domain_Applications/Math_Mentor/STUDENT_LEARNING_STATE_SCHEMA.md#5-status-transition-table"
graduation_contract: "08_Domain_Applications/Math_Mentor/GRADUATION_CRITERIA.md"
minimum_review_passes: 2

release_status: "pre_release_unfrozen"
release_note: >-
  No real v2 event has been written and production is not authorized, so v2
  semantics remain unfrozen until foreground acceptance. If a real v2 event is
  ever found to exist, this must stop and a Human epoch-v3 decision is required
  rather than an in-place semantics change.

v2_changes:
  - "Added review_passed -> review_due and stale -> review_due (contract section 5.1) after amending the contract first."
  - "Implemented blocked -> prior valid status with blocked_from and blocker-resolution evidence."
  - "Graduation now requires distinct review windows, not just a pass count, and is never persisted autonomously."
  - "Required student_ref, source_ref, evidence_timestamp and evidence_limitations on every event."
  - "Required classroom_evidence for classroom_passed and review_evidence for review_passed."
  - "Rejected reuse of a source_ref or a review_window_id."
  - "Disabled correction as unsupported_pending_contract; the v1 behaviour made later appends permanently fail."
  - "Round 3: typed review windows with id+kind matching, near_term before stability, strictly increasing RFC 3339 timestamps, qualifying-vs-historical evidence split, learner-bound store_meta, canonical schema enforced via Draft202012Validator with fail-closed, snapshot bound to its source anchor, three-outcome CLI."
  - "Round 4: blocker_evidence and stale_evidence required with cause distinctions (failure vs expiry vs decay), Human-only unblocking with explicit_human_override, failed/needs_reprep unpersistable, pass timestamp must exceed its window opening, store_meta validated by its own canonical schema and bound into the tail anchor, non-reentrant thread-safe lock, fail-closed derive_snapshot and repair_anchor, graduation_evidence_candidate terminology."
  - "Round 5: structured review_failure_evidence citing the pending window; exact stale cause-to-provenance mapping (exam_agent never valid for stale); transition-specific schema conditionals so no evidence bundle can enter the log on an unrelated transition; snapshot publication held under one lock end to end; anchor without store_meta_digest fails closed; event files must be a contiguous 1..N sequence of mappings and no stray .yml may sit in the events directory; cause counters and the open-window timestamp exposed in the derived snapshot."

human_acceptance_persistence:
  status: "disabled_pending_trusted_admission"
  rationale: >-
    No trusted Human admission path exists. A human_acceptance event is a label
    plus two strings, so persisting one would let anything able to write a file
    grant Human authority to itself. The reducer may still EVALUATE a proposed
    unblock or graduation - that is useful and harmless - but append_event
    refuses to make any human_acceptance event durable. This is a pre-release
    authority boundary, NOT identity verification.
  affected_transitions:
    - "blocked -> prior status (unblock)"
    - "review_passed -> graduated"

store_location:
  medium: "learner_bound_local_store"
  canonical_path: "%LOCALAPPDATA%/CityState/learning_state/<learner_key>/"
  repo_local_view: "08_Domain_Applications/Math_Mentor/learners/<learner_key>/"
  repo_local_view_role: >-
    Gitignored local view or junction only. It is a convenience entry point for
    the Human, not the canonical byte store, and it is never tracked.
  repository_storage: "forbidden"
  reason: >-
    A learning trace (which nodes a named person failed, how often, which
    misconceptions recur) is a sensitive profile. It stays out of Git regardless
    of the repository's current visibility, which is NOT independently verified
    by this project.

activation_status:
  implemented: true
  locally_reported_first_write: true
  independently_accepted: false
  production_authorized: false
  scheduler_writer_activated: false
  real_v2_write_performed: false
  note: >-
    A full v2 implementation exists: read-only reducer, canonical event schema,
    schema-enforcing validator, learner-bound store metadata with its own schema,
    and a writer with locking, tail anchor and failure-aware append. One local
    write was performed under the older v1 semantics and is self-reported only;
    it has not been independently verified and is quarantined. The v2 writer has
    NOT written any real learner event, and real v2 writes remain forbidden until
    foreground acceptance.

v1_store_disposition:
  status: "reported_local_unverified"
  quarantine: "quarantined_pending_migration"
  action_required: >-
    v1 events were written under the older transition and evidence semantics and
    lack the fields v2 requires. A Human-run, non-destructive migration is needed
    before they may be read under v2. Nothing was migrated automatically, and no
    learner detail is published here.
  migration_spec: "08_Domain_Applications/Math_Mentor/learning_state/MIGRATION_v1_to_v2.md"
