# Binds learning events to a transition-table version.
#
# The reducer ignores any event whose learning_state_epoch differs from the
# bound value here.  Bumping the epoch is how a transition-table change avoids
# silently re-interpreting historical events.
#
# Status: the writer program has NOT been activated.  This file declares the
# epoch that step-3 (first real write) would use; nothing is persisted yet.

schema_version: "citystate.math_mentor.learning_state_epoch.v1"
bound_epoch: "learning-state-epoch-v1"
transition_table_ref: "08_Domain_Applications/Math_Mentor/learning_state/reduce_readonly.py"
transition_source_contract: "08_Domain_Applications/Math_Mentor/STUDENT_LEARNING_STATE_SCHEMA.md#5-status-transition-table"
graduation_contract: "08_Domain_Applications/Math_Mentor/GRADUATION_CRITERIA.md"
minimum_review_passes: 2

store_location:
  medium: "local_citystate_store"
  path: "%LOCALAPPDATA%/CityState/learning_state/"
  repository_storage: "forbidden"
  reason: >-
    This repository is publicly readable (verified 2026-07-19 by anonymous
    git ls-remote). Learning traces are a sensitive profile and must not enter
    public history. Code and contracts live in the repository; events and
    snapshots do not.

activation_status:
  writer_activated: false
  scheduler_writer_activated: false
  first_real_write_performed: false
  note: >-
    Steps 1-2 of the landing order (read-only reducer, schema and validator) are
    complete. Step 3 (first real write, Human present) has not been authorized
    or performed.
