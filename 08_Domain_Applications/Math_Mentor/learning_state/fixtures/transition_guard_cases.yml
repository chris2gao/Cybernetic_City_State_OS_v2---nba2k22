# Read-only reducer fixture - entirely synthetic.
#
# PRIVACY: this file contains no real learner data by construction.  Node ids,
# aliases and refs are invented for testing.  Real learning traces belong in the
# local CityState store, never in this publicly readable repository.
#
# Events 1-2 walk the legal path; events 3+ each violate exactly one rule so the
# dry run proves every guard fires.  Nothing here is persisted anywhere.

bound_epoch: "learning-state-epoch-v1"

events:
  # --- legal path ------------------------------------------------------------
  - event_id: "ev-001"
    event_type: "classroom_result"
    student_ref: "fixture_alias_A"
    node_ref: { node_id: "n_fixture_001", file: "FIXTURE-001.yaml" }
    transition: { from: "not_seen", to: "introduced" }
    evidence_provenance:
      source_type: "exam_agent"
      source_ref: "fixture://session/1"
      actually_read_files: ["FIXTURE-001.yaml"]
      evidence_timestamp: "2026-01-01T00:00:00Z"
      evidence_limitations: "synthetic fixture"
    learning_state_epoch: "learning-state-epoch-v1"

  - event_id: "ev-002"
    event_type: "classroom_result"
    student_ref: "fixture_alias_A"
    node_ref: { node_id: "n_fixture_001", file: "FIXTURE-001.yaml" }
    transition: { from: "introduced", to: "classroom_passed" }
    evidence_provenance:
      source_type: "exam_agent"
      source_ref: "fixture://session/1#exam"
      actually_read_files: ["FIXTURE-001.yaml"]
      evidence_timestamp: "2026-01-01T00:00:00Z"
      evidence_limitations: "classroom pass only; not graduation"
    learning_state_epoch: "learning-state-epoch-v1"

  # --- rejection cases -------------------------------------------------------
  # R1: skip the review cycle straight to graduation
  - event_id: "ev-003"
    event_type: "human_acceptance"
    node_ref: { node_id: "n_fixture_001" }
    transition: { from: "classroom_passed", to: "graduated" }
    evidence_provenance: { source_type: "explicit_human_override" }
    human_authorization_ref: "fixture://human/1"
    learning_state_epoch: "learning-state-epoch-v1"

  # R2: classroom evidence reused as a spaced-review pass
  - event_id: "ev-004"
    event_type: "review_result"
    node_ref: { node_id: "n_fixture_001" }
    transition: { from: "classroom_passed", to: "review_due" }
    evidence_provenance: { source_type: "scheduler_placeholder" }
    learning_state_epoch: "learning-state-epoch-v1"
  - event_id: "ev-005"
    event_type: "review_result"
    node_ref: { node_id: "n_fixture_001" }
    transition: { from: "review_due", to: "review_passed" }
    evidence_provenance: { source_type: "exam_agent" }
    learning_state_epoch: "learning-state-epoch-v1"

  # R3: graduation attempted with only one review pass
  - event_id: "ev-006"
    event_type: "review_result"
    node_ref: { node_id: "n_fixture_001" }
    transition: { from: "review_due", to: "review_passed" }
    evidence_provenance: { source_type: "spaced_review" }
    learning_state_epoch: "learning-state-epoch-v1"
  - event_id: "ev-007"
    event_type: "human_acceptance"
    node_ref: { node_id: "n_fixture_001" }
    transition: { from: "review_passed", to: "graduated" }
    evidence_provenance: { source_type: "explicit_human_override" }
    human_authorization_ref: "fixture://human/1"
    learning_state_epoch: "learning-state-epoch-v1"

  # R4: epoch mismatch
  - event_id: "ev-008"
    event_type: "classroom_result"
    node_ref: { node_id: "n_fixture_002" }
    transition: { from: "not_seen", to: "introduced" }
    evidence_provenance: { source_type: "exam_agent" }
    learning_state_epoch: "learning-state-epoch-v0"

  # R5: private identity data present
  - event_id: "ev-009"
    event_type: "classroom_result"
    student_ref: "fixture_alias_A"
    real_name: "fixture violation value"
    node_ref: { node_id: "n_fixture_002" }
    transition: { from: "not_seen", to: "introduced" }
    evidence_provenance: { source_type: "exam_agent" }
    learning_state_epoch: "learning-state-epoch-v1"

  # R6: duplicate event id
  - event_id: "ev-001"
    event_type: "classroom_result"
    node_ref: { node_id: "n_fixture_002" }
    transition: { from: "not_seen", to: "introduced" }
    evidence_provenance: { source_type: "exam_agent" }
    learning_state_epoch: "learning-state-epoch-v1"

  # R7: stale from-state
  - event_id: "ev-010"
    event_type: "classroom_result"
    node_ref: { node_id: "n_fixture_001" }
    transition: { from: "not_seen", to: "introduced" }
    evidence_provenance: { source_type: "exam_agent" }
    learning_state_epoch: "learning-state-epoch-v1"

  # R8: graduation without human authorization, after two legitimate passes
  - event_id: "ev-011"
    event_type: "review_result"
    node_ref: { node_id: "n_fixture_001" }
    transition: { from: "review_passed", to: "review_due" }
    evidence_provenance: { source_type: "spaced_review" }
    learning_state_epoch: "learning-state-epoch-v1"
  - event_id: "ev-012"
    event_type: "review_result"
    node_ref: { node_id: "n_fixture_001" }
    transition: { from: "review_due", to: "review_passed" }
    evidence_provenance: { source_type: "spaced_review" }
    learning_state_epoch: "learning-state-epoch-v1"
  - event_id: "ev-013"
    event_type: "human_acceptance"
    node_ref: { node_id: "n_fixture_001" }
    transition: { from: "review_passed", to: "graduated" }
    evidence_provenance: { source_type: "explicit_human_override" }
    human_authorization_ref: null
    learning_state_epoch: "learning-state-epoch-v1"
