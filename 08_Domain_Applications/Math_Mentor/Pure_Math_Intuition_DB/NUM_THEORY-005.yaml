id: "NUM_THEORY-005"
concept_name: "最大公因数/最小公倍数 - 最大公因数与最小公倍数的乘积关系（gcd(a,b) * lcm(a,b) = a * b）的质因数指数推导 (n_199)"
version: "9.1"
sub_topics:
  - "基于质因数指数 min 运算的 GCD 定义"
  - "基于质因数指数 max 运算的 LCM 定义"
  - "指数关系 min(x,y) + max(x,y) = x + y 的代数证明"
  - "乘积关系公式的适用范围与扩展"
llm_physical_mapping: "Think of two collections of Lego blocks representing the prime factors of two numbers. The GCD is the intersection of these sets (taking the minimum number of each block type shared by both), while the LCM is the union (taking the maximum number of each block type needed to cover both). When you multiply the two original numbers together, you combine all their blocks. This is physically identical to combining the blocks from the intersection (GCD) and the union (LCM), demonstrating the underlying rule that min(x,y) + max(x,y) = x + y for every prime block type."
code_implementation: |
  import torch

  def verify_gcd_lcm_relation(a_val: int, b_val: int) -> bool:
      a = torch.tensor([a_val], dtype=torch.long)
      b = torch.tensor([b_val], dtype=torch.long)
      
      gcd_val = torch.gcd(a, b)
      lcm_val = torch.lcm(a, b)
      
      left_side = gcd_val * lcm_val
      right_side = a * b
      
      return torch.equal(left_side, right_side)
v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy

    def test_gcd_lcm_product(a, b):
        g = sympy.gcd(a, b)
        l = sympy.lcm(a, b)
        assert g * l == a * b

    test_gcd_lcm_product(12, 18)
    test_gcd_lcm_product(15, 20)
    test_gcd_lcm_product(100, 75)
    test_gcd_lcm_product(7, 13)
