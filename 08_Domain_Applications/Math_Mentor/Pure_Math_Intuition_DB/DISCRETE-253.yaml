id: "DISCRETE-253"
concept_name: "偏序集与格 - 格 (Lattices) 的代数性质及其在程序语义分析中的应用雏形 (n_253)"
sub_topics:
  - "格作为代数系统的定义 (∧, ∨)"
  - "模格与分配格的特征性质"
  - "克里尼格 (Kleene Lattice) 与布尔格"
  - "抽象解释理论中的不动点迭代"
llm_physical_mapping: "mundane physical metaphor: A pegboard sorting machine where each pair of input pegs inevitably drops to a unique lowest common meeting point (meet) or gets lifted to a unique highest common encompassing level (join), forming a structured scaffolding."
code_implementation: |
  def lattice_meet(a, b, divisors):
      # Example of a greatest lower bound (meet) in a divisor lattice
      return max(d for d in divisors if a % d == 0 and b % d == 0)

  def lattice_join(a, b, multiples, max_val):
      # Example of a least upper bound (join) in a divisor lattice
      return min(m for m in multiples if m % a == 0 and m % b == 0 and m <= max_val)

  # Example using divisors of 12
  divs = [1, 2, 3, 4, 6, 12]
  print("Meet of 4 and 6:", lattice_meet(4, 6, divs))
  print("Join of 4 and 6:", lattice_join(4, 6, divs, 12))
v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy
    
    # In the divisor lattice of 12, meet is gcd and join is lcm
    a, b = 4, 6
    meet = sympy.gcd(a, b)
    join = sympy.lcm(a, b)
    
    assert meet == 2
    assert join == 12
    # Commutative
    assert sympy.gcd(a, b) == sympy.gcd(b, a)
    # Absorptive
    assert sympy.gcd(a, sympy.lcm(a, b)) == a
