concept_node:
  id: MAPPING-003
  title: Injective, Surjective, and Bijective (单射、满射、双射)
  description: Core properties of mappings/functions determining how elements in a
    domain connect to a codomain.
  llm_physical_mapping:
    Injective: No information collision (column sums <= 1).
    Surjective: Full coverage of the output space (column sums >= 1).
    Bijective: Reversible, perfect permutation (column sums == 1, row sums == 1, making
      it an orthogonal permutation matrix).
  code_implementation:
    language: python
    code: "import torch\n\ndef check_mapping_properties(M: torch.Tensor):\n    \"\"\
      \"\n    Evaluates mapping properties on a boolean adjacency matrix M.\n    M[i,\
      \ j] = 1 if input i maps to output j.\n    Rows represent the domain, columns\
      \ represent the codomain.\n    \"\"\"\n    col_sums = M.sum(dim=0)\n    row_sums\
      \ = M.sum(dim=1)\n    \n    # Is it a valid function? (each input maps to exactly\
      \ one output)\n    is_function = torch.all(row_sums == 1).item()\n    \n   \
      \ # Injective: No information collision\n    is_injective = torch.all(col_sums\
      \ <= 1).item()\n    \n    # Surjective: Full coverage of the output space\n\
      \    is_surjective = torch.all(col_sums >= 1).item()\n    \n    # Bijective:\
      \ Reversible, perfect permutation\n    is_bijective = is_function and is_injective\
      \ and is_surjective\n    # or: is_bijective = torch.all(col_sums == 1).item()\
      \ and torch.all(row_sums == 1).item()\n    \n    return {\n        \"is_function\"\
      : is_function,\n        \"is_injective\": is_injective,\n        \"is_surjective\"\
      : is_surjective,\n        \"is_bijective\": is_bijective\n    }\n"
  v8_sanity_audit:
    sympy_pseudo_code: "def validate_bijective_mapping(mapping_dict):\n    \"\"\"\n\
      \    Validate a bijective mapping on finite sets using Python dictionaries\n\
      \    and inverse mapping assertions.\n    \"\"\"\n    # Create reverse mapping\
      \ to check injectivity\n    inverse_mapping = {}\n    for x, y in mapping_dict.items():\n\
      \        if y in inverse_mapping:\n            # Output space collision -> Not\
      \ injective\n            return False\n        inverse_mapping[y] = x\n    \
      \    \n    # Assert perfect reversibility\n    for x, y in mapping_dict.items():\n\
      \        assert inverse_mapping[y] == x, f\"Inverse mapping failed for {x} ->\
      \ {y}\"\n        \n    return True\n"
  sub_topics:
  - 单射（一对一）的形式化定义
  - 满射（映上的）的形式化定义
  - 双射（一一对应）的定义
  - 逆映射存在的充分必要条件
