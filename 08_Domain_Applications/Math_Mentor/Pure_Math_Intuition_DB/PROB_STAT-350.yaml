  import sympy as sp
  from sympy.stats import Binomial, P, E, variance
  
  n, p = sp.symbols('n p', positive=True)
  X = Binomial('X', n, p)
  
  mean_X = E(X)
  var_X = variance(X)
v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy as sp
    from sympy.stats import Binomial, P, E, variance
    
    # Concrete Binomial
    X = Binomial('X', 10, sp.Rational(1, 2))
    
    assert E(X) == 5
    assert variance(X) == sp.Rational(10, 4)
    assert P(sp.Eq(X, 0)) == sp.Rational(1, 1024)
