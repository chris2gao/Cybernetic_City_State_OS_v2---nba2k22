id: "PROB_STAT-350"
concept_name: "常用分布（正态/泊松/指数等） - 二项分布：多次独立实验 (n_350)"
sub_topics:
  - "伯努利试验序列的计数模型"
  - "二项分布公式 B(n, p) 的组合意义"
  - "二项分布的期望与方差推导"
  - "在大样本下向正态分布的逼近（棣莫弗-拉普拉斯定理）"
llm_physical_mapping: "mundane physical metaphor: flipping a weighted coin N times and dropping chips into a bucket for every 'heads'. The binomial distribution tracks the final chip count in the bucket."
code_implementation: |
  import sympy as sp
  from sympy.stats import Binomial, P, E, variance
  
  n, p = sp.symbols('n p', positive=True)
  X = Binomial('X', n, p)
  
  mean_X = E(X)
  var_X = variance(X)
v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy as sp
    from sympy.stats import Binomial, P, E, variance
    
    # Concrete Binomial
    X = Binomial('X', 10, sp.Rational(1, 2))
    
    assert E(X) == 5
    assert variance(X) == sp.Rational(10, 4)
    assert P(sp.Eq(X, 0)) == sp.Rational(1, 1024)
