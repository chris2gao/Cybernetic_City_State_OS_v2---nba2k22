llm_physical_mapping: "mundane physical metaphor: A set of modular Lego blocks that can only be assembled or broken down into absolute fundamental single-peg bricks. In special tool-kits, there is a dedicated ruler mechanism that measures remainder lengths to precisely find the greatest common block size."
code_implementation: |
  import sympy as sp
  x = sp.Symbol('x')
  poly = x**4 - 1
  factors = sp.factor(poly)
  p1 = x**3 - 1
  p2 = x**2 - 1
  gcd_poly = sp.gcd(p1, p2)
legacy_v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy as sp
    x = sp.Symbol('x')
    poly1 = x**3 - 1
    poly2 = x**2 - 1
    gcd_poly = sp.gcd(poly1, poly2)
    assert sp.simplify(gcd_poly - (x - 1)) == 0
    factors = sp.factor(poly1)
    assert factors == (x - 1)*(x**2 + x + 1)
