id: "REAL_ANALYSIS-007"
title: "Sequences and Limits via Autoregressive Generation"
sub_topics:
  - "Convergence of Sequences"
  - "Autoregressive Sampling"
  - "Top-K / Top-P Truncation as Limit Bounds"
llm_physical_mapping:
  - "Autoregressive decoding models limits of token sequences $T_n \\to T_{\\infty}$ via probability mass functions."
  - "Temperature scaling reshapes the sequence probability distribution limit behavior (deterministic vs chaotic)."
  - "Top-K and Top-P truncation dynamically bound the sample space, enforcing convergence of sequence paths."
code_implementation: |
  import torch
  import torch.nn.functional as F

  def autoregressive_limit_step(logits, temperature=1.0, top_k=50):
      scaled_logits = logits / temperature
      top_k_values, top_k_indices = torch.topk(scaled_logits, top_k)
      
      probs = F.softmax(top_k_values, dim=-1)
      next_token = torch.multinomial(probs, num_samples=1)
      return top_k_indices.gather(-1, next_token)
v8_sanity_audit:
  sympy_pseudo_code: |
    import torch
    
    # Verify probability distribution limits
    logits = torch.randn(1, 10000)
    top_k = 50
    temp = 0.5
    
    scaled = logits / temp
    vals, idx = torch.topk(scaled, top_k)
    probs = torch.nn.functional.softmax(vals, dim=-1)
    
    assert probs.sum().item() - 1.0 < 1e-6
    assert probs.shape[-1] == top_k
