llm_physical_mapping: "mundane physical metaphor: Imagine finding the shortest distance from a hovering drone to a slanted roof. Instead of measuring random angles, you drop a plumb bob straight down (orthogonal projection) along the roof's normal vector. For two non-intersecting pipes, you wedge a single straight rod between them so it makes a 90-degree angle with both."
code_implementation: |
  import sympy as sp
  
  def point_plane_distance(point, plane_point, normal_vector):
      p = sp.Matrix(point)
      p0 = sp.Matrix(plane_point)
      n = sp.Matrix(normal_vector)
      
      vec = p - p0
      distance = abs(vec.dot(n)) / n.norm()
      return distance
