    import sympy as sp
    from sympy.stats import FiniteRV, P
    
    density = {1: sp.Rational(1, 6), 2: sp.Rational(2, 6), 3: sp.Rational(3, 6)}
    X = FiniteRV('X', density)
    
    total_mass = sum(density.values())
    assert total_mass == 1
    assert P(sp.Eq(X, 1)) == sp.Rational(1, 6)
