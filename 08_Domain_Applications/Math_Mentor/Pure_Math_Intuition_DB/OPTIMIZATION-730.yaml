  import numpy as np
  
  def convex_conjugate(x_vals, f_vals, p):
      px_minus_fx = p * x_vals - f_vals
      return np.max(px_minus_fx)
  
  x = np.linspace(-5, 5, 100)
  f_x = 0.5 * x**2
  p_val = 2.0
  f_star_p = convex_conjugate(x, f_x, p_val)
