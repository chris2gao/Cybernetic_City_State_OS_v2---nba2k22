code_implementation: |
  import torch
  
  def subgradient_relu(x):
      # x: scalar tensor
      if x.item() > 0:
          return torch.tensor(1.0)
      elif x.item() < 0:
          return torch.tensor(0.0)
      else:
          # pick any value in [0, 1], choosing 0.5 as mechanical pivot baseline
          return torch.tensor(0.5)
