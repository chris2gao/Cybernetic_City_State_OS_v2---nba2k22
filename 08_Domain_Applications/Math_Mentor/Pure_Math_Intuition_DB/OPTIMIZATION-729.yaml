    import sympy as sp
    
    x = sp.Symbol('x', real=True)
    f = sp.Abs(x)
    g = 0.5
    y = sp.Symbol('y', real=True)
    val_diff = sp.Abs(y) - g * y
    assert val_diff.subs(y, 1) >= 0
    assert val_diff.subs(y, -1) >= 0
