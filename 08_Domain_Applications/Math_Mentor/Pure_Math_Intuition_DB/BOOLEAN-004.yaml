concept_node:
  id: "BOOLEAN-004"
  domain: "boolean_algebra"
  name: "斯通表示定理 (Stone's Representation Theorem) 简介"
  sub_topics:
    - 定理内容的通俗解释
    - 布尔代数与集合代数的同构
    - 斯通空间 (Stone space) 的概念
    - 拓扑学与逻辑学的桥梁
  core_intuition: "每一个抽象的布尔代数，无论看起来多么奇特，实际上都可以看作是某个集合（具体来说是斯通空间）的子集族，在这个子集族上进行普通的交、并、补运算。斯通定理就像一面镜子，把抽象的逻辑代数结构完美地映射到了具体的几何/拓扑空间（开闭集）上。"
  llm_physical_mapping: "想象你有一套规则极其复杂的电子开关系统（抽象布尔代数），由于规则太抽象，很难直观理解。斯通表示定理告诉你，你总可以建造一个有无数个房间的巨大迷宫般的房子（斯通空间），每个房间代表这套开关系统一种极致的具体状态组合（超滤子）。在这座房子里，开关系统里的每一个抽象的“开关”或“变量”，都完美等价于这栋房子里特定一部分房间的集合（比如“亮着红灯的房间集合”）。于是，你对抽象开关的任何逻辑操作（与、或、非），就完全变成了对实体房间集合的拼凑操作（交集、并集、补集），将抽象逻辑彻底实体化。"
  code_implementation: |
    # PyTorch Boolean Simulation of Stone's Representation Theorem concept
    import torch
    
    # Consider a simple boolean algebra B generated by a single variable 'a'.
    # B has 4 elements: {0, a, ~a, 1}.
    # The Stone space X of this algebra consists of ultrafilters, which for finite 
    # algebras correspond to the atoms. There are 2 atoms here.
    # We represent the Stone space X as indices [0, 1].
    X_size = 2
    
    # According to Stone's theorem, elements of B map to subsets of X (clopen sets).
    # We represent subsets as boolean masks (tensors) over X.
    element_0 = torch.tensor([False, False])    # The empty set, represents False
    element_1 = torch.tensor([True, True])      # The whole space X, represents True
    
    element_a = torch.tensor([True, False])     # Subset corresponding to 'a'
    element_not_a = torch.tensor([False, True]) # Subset corresponding to '~a'
    
    # Boolean logic operations seamlessly translate to set operations on the subsets:
    # Logic NOT -> Set Complement (Bitwise NOT in PyTorch)
    assert torch.equal(~element_a, element_not_a), "NOT 'a' matches complement of subset 'a'"
    
    # Logic OR -> Set Union (Bitwise OR in PyTorch)
    assert torch.equal(element_a | element_not_a, element_1), "'a' OR '~a' equals the whole space (1)"
    
    # Logic AND -> Set Intersection (Bitwise AND in PyTorch)
    assert torch.equal(element_a & element_not_a, element_0), "'a' AND '~a' equals the empty set (0)"
    
    print("Stone's Representation mapping successful: Abstract boolean logic simulates precisely via subset tensors.")
  v8_sanity_audit:
    sympy_pseudo_code: |
      import sympy
      from sympy.logic.boolalg import And, Or, Not
      from sympy.abc import A, B
      
      # In SymPy, abstract boolean formulas form a Boolean algebra.
      # Stone's Representation Theorem states we can map these to subsets of a space.
      # For logic formulas, this "Stone space" can be interpreted as the set of all 
      # possible truth assignments (models).
      
      formula1 = A & B
      formula2 = A | B
      
      # Let's explicitly build the finite Stone space (truth assignments for A and B)
      stone_space_models = [
          {A: True, B: True}, 
          {A: True, B: False}, 
          {A: False, B: True}, 
          {A: False, B: False}
      ]
      
      # The abstract formula maps to the SUBSET of the Stone space where it evaluates to True.
      subset_1 = [model for model in stone_space_models if formula1.subs(model)]
      subset_2 = [model for model in stone_space_models if formula2.subs(model)]
      
      # Let's verify that a logic theorem (Absorption Law: A | (A & B) == A) 
      # correctly maps to identical subsets in the Stone space.
      absorption_formula = Or(A, And(A, B))
      subset_absorption = [model for model in stone_space_models if absorption_formula.subs(model)]
      subset_A = [model for model in stone_space_models if A.subs(model)]
      
      assert subset_absorption == subset_A
      # Thus, logical equivalence perfectly mirrors set equality in the Stone space.
