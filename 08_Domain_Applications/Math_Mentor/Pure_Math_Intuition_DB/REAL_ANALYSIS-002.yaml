id: "REAL_ANALYSIS-002"
title: "Metric Spaces and Topology of R"
sub_topics:
  - "Open and Closed Sets"
  - "Compactness and Heine-Borel"
  - "Connectedness"
llm_physical_mapping: "Directly mirrors Rotary Positional Encoding (RoPE) and complex manifold geometry. RoPE maps position vectors into 2D orthogonal rotation subspaces in the complex plane, defining a robust topological metric space where relative distances between tokens decay smoothly with mathematical invariance, defining the 'neighborhood' of attention."
code_implementation: |
  import torch
  import torch.nn as nn

  class TopologyRoPE(nn.Module):
      def __init__(self, dim, base=10000):
          super().__init__()
          self.dim = dim
          inv_freq = 1.0 / (base ** (torch.arange(0, dim, 2).float() / dim))
          self.register_buffer('inv_freq', inv_freq)

      def forward(self, positions):
          # Creating open neighborhoods of frequencies
          freqs = torch.einsum('i,j->ij', positions.float(), self.inv_freq)
          emb = torch.cat((freqs, freqs), dim=-1)
          return torch.cos(emb), torch.sin(emb)
v8_sanity_audit:
  sympy_pseudo_code: |
    import torch
    pos = torch.arange(5)
    inv_freq = 1.0 / (10000 ** (torch.arange(0, 16, 2).float() / 16))
    freqs = torch.einsum('i,j->ij', pos.float(), inv_freq)
    emb = torch.cat((freqs, freqs), dim=-1)
    cos_emb = torch.cos(emb)
    assert cos_emb.shape == (5, 16)
