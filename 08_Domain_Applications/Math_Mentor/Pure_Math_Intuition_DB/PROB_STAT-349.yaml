id: "PROB_STAT-349"
concept_name: "随机变量 - 离散型（PMF）与连续型（PDF）及其累积分布函数（CDF） (n_349)"
sub_topics:
  - "PMF 与 PDF 的物理量纲区分"
  - "CDF 的定义与单调性、右连续性质"
  - "CDF 作为连接离散与连续的统一语言"
  - "通过 CDF 求随机变量函数分布的方法"
llm_physical_mapping: "mundane physical metaphor: stacking chips sequentially. The PMF is the height of each individual chip stack. The CDF is sweeping your arm from left to right, accumulating the total weight of chips gathered so far."
code_implementation: |
  import sympy as sp
  from sympy.stats import Normal, density, cdf, P
  
  # Continuous RV
  X = Normal('X', 0, 1)
  
  # PDF
  pdf_X = density(X)
  
  # CDF
  cdf_X = cdf(X)
v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy as sp
    from sympy.stats import Normal, density, cdf
    
    X = Normal('X', 0, 1)
    x = sp.Symbol('x')
    
    # CDF is integral of PDF
    pdf_expr = density(X)(x)
    cdf_expr = cdf(X)(x)
    
    # CDF derivative is PDF
    assert sp.simplify(sp.diff(cdf_expr, x) - pdf_expr) == 0
