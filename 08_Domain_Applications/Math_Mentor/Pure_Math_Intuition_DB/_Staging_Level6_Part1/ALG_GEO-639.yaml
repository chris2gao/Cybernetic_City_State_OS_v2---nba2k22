id: ALG_GEO-639
name: "上同调 - 跨层级关联：从局部代数性质推演全局拓扑结构的核心工具。 (n_639)"
sub_topics:
  - 库内特 (Künneth) 公式与 Mayer-Vietoris 序列
  - 局部线性化与全局非线性空洞的关联
  - 在神经网络拓扑数据分析 (TDA) 中的应用
  - 权重特征流形上同调类对模型智能的指示
llm_physical_mapping: "A network of physical water pipes with pressure sensors. A local pressure difference indicates flow, but if a sequence of pipes forms a loop and the total pressure drop around it isn't zero, it indicates a structural 'hole' (a pump or external void) in the system's global geometry."
code_implementation: |
  import torch
  
  # A graph representing a simple 1D pipe network
  # Nodes: 0, 1, 2 (triangle)
  # Edges: (0,1), (1,2), (2,0)
  
  # Edge-node incidence matrix (boundary operator d1)
  # columns = nodes, rows = edges
  d1 = torch.tensor([
      [-1.,  1.,  0.], # Edge 0->1
      [ 0., -1.,  1.], # Edge 1->2
      [ 1.,  0., -1.]  # Edge 2->0
  ])
  
  # "cochain": a pressure value at each node
  node_pressures = torch.tensor([10.0, 5.0, 2.0])
  
  # Differential: pressure drop across edges
  edge_flows = d1 @ node_pressures
  
  # The total circulation (sum of drops) around the loop is zero
  # exact cochains sum to zero around closed loops
  total_drop = edge_flows.sum()
  assert torch.abs(total_drop) < 1e-6
v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy as sp
    
    x, y = sp.symbols('x y')
    # Differential forms: checking exactness and closedness
    # 1-form w = P dx + Q dy
    # Closed if dQ/dx = dP/dy
    P = -y / (x**2 + y**2)
    Q =  x / (x**2 + y**2)
    
    dP_dy = sp.diff(P, y)
    dQ_dx = sp.diff(Q, x)
    
    # verify it is a closed form
    assert sp.simplify(dP_dy - dQ_dx) == 0
