id: "ALG_TOPOLOGY-671"\nconcept_name: "同伦论 - 物理直觉：空间在连续形变下保持绝对不变的特性。 (n_671)"\nsub_topics:\n  - "同伦等价 (Homotopy equivalence) 的形式定义"\n  - "空间的收缩性 (Contractibility)"\n  - "同伦群 $\pi_n$ 的高维构造"\n  - "物理直觉：研究物体在不被撕裂的情况下能被塑造成什么形状"\nllm_physical_mapping: "如同加热一块工业橡胶泥，你可以把它揉拉成一根长条，也可以把它压成一张饼，但只要你不用剪刀剪断它，这块橡胶泥在流水线上就还是原来的那块材料。"\ncode_implementation: |\n  def linear_homotopy(f_x, g_x, t):\n      return (1 - t) * f_x + t * g_x\nv8_sanity_audit:\n  sympy_pseudo_code: |\n    import sympy as sp\n    f, g, t = sp.symbols('f g t')\n    homotopy = (1 - t)*f + t*g\n    assert sp.simplify(homotopy.subs(t, 0) - f) == 0\n