id: "ALG_GEO-646"
name: "代数曲线的分类"
llm_physical_mapping: "Categorizing different types of mechanical molds and castings (like spheres, donuts, pretzels) by literally counting their structural holes. The 'genus' is the number of distinct loops of safety wire you can tie around the object without being able to pull the wire completely tight. The hole count directly locks in the thermal and structural limits of the casting."
code_implementation: |-
  import torch

  def compute_genus_from_degree(degree: torch.Tensor) -> torch.Tensor:
      # Genus formula for smooth plane curves: g = (d-1)(d-2)/2
      return (degree - 1) * (degree - 2) // 2

  degrees = torch.tensor([1, 2, 3, 4])
  genera = compute_genus_from_degree(degrees)
  
  # Output genera expected: 0, 0, 1, 3
  # A cubic curve (degree 3) forms an elliptic curve with genus 1 (donut)
v8_sanity_audit:
  sympy_pseudo_code: |-
    import sympy as sp
    
    d = sp.Symbol('d', integer=True)
    g = (d - 1) * (d - 2) / 2
    
    # For a cubic curve (d=3), genus is 1 (elliptic curve)
    g_cubic = sp.simplify(g.subs(d, 3))
    assert g_cubic == 1, "Cubic plane curve must have genus 1"
    
    # For a conic (d=2), genus is 0 (rational curve)
    g_conic = sp.simplify(g.subs(d, 2))
    assert g_conic == 0, "Conic curve must have genus 0"
sub_topics:
  - "亏格 0 (有理曲线)、亏格 1 (椭圆曲线) 与高亏格曲线"
  - "曲线的单值化定理"
  - "代数曲线的模空间 $M_g$"
  - "物理直觉：空间“洞”的数量定义了其代数本质"
