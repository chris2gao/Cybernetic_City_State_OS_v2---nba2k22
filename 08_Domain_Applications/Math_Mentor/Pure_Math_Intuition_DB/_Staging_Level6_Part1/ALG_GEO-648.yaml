id: "ALG_GEO-648"
name: "除子与线丛（Picard群） - 物理直觉：通过记录空间中极点与零点的位置，推测整个空间的几何形态与函数性质。 (n_648)"
node_id: 648
llm_physical_mapping: "A physical landscape featuring water springs (positive divisors, zeros) and sinkholes (negative divisors, poles). The overall fluid flow field (meromorphic function) is strictly defined by the configuration of these sources and sinks. The Picard group classifies essentially different source-sink arrangements that cannot smoothly deform into one another."
code_implementation: |
  import torch
  import torch.nn.functional as F
  
  # A 2D grid representing a space
  N = 20
  grid = torch.zeros(1, 1, N, N)
  
  # Positive divisor (source) at (5, 5), Negative divisor (sink) at (15, 15)
  grid[0, 0, 5, 5] = 1.0
  grid[0, 0, 15, 15] = -1.0
  
  # Simulate solving the Poisson equation to find the potential (line bundle section)
  kernel = torch.tensor([[[[0., 1., 0.], [1., -4., 1.], [0., 1., 0.]]]])
  potential = torch.zeros_like(grid)
  
  for _ in range(100):
      # Jacobi iteration
      laplacian = F.conv2d(potential, kernel, padding=1)
      potential = potential + 0.25 * (grid - laplacian)
      
  print("Sum of potential:", torch.sum(potential).item())
v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy as sp
    
    z = sp.symbols('z')
    # Rational function with zeros and poles (divisor)
    # f(z) = (z-1)^2 / ((z-2)*(z-3)^3)
    # Divisor = 2[1] - 1[2] - 3[3]
    f = (z-1)**2 / ((z-2)*(z-3)**3)
    
    # In P^1, the degree of the principal divisor must be 0
    # Evaluate limit at infinity to find degree at infinity
    w = sp.symbols('w')
    f_inf = f.subs(z, 1/w)
    
    leading_term = sp.limit(f_inf / w**2, w, 0)
    
    # Since leading term is a non-zero finite constant, order at infinity is 2.
    assert leading_term != 0
    assert leading_term != sp.oo
