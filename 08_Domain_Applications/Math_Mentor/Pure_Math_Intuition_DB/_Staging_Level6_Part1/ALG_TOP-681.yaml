id: "ALG_TOP-681"
name: "万有系数定理"
llm_physical_mapping: "Swapping out different sensory diagnostic probes on a jet engine. A continuous 'real number' acoustic probe only hears the bulk airflow (Betti numbers). But switching to a discrete 'Z2' electrical continuity tester suddenly lights up and detects hidden twisted wire configurations (torsion) that the continuous flow probe was completely blind to."
code_implementation: |-
  import torch

  # Boundary matrix for a simplicial complex over Z (integers)
  # A twisted topological space (like a Mobius band boundary) might yield a multiple of 2
  boundary_Z = torch.tensor([[2]])
  
  # Universal Coefficient Theorem effect:
  # Computing homology over Z_2 by taking the boundary matrix modulo 2
  boundary_Z2 = boundary_Z % 2
  
  # The previously solid boundary disappears under Z_2, exposing a new twisted cycle!
  assert boundary_Z2.item() == 0, "Torsion twist should disappear under Z2 coefficients"
v8_sanity_audit:
  sympy_pseudo_code: |-
    import sympy as sp
    
    # Computing the Tor functor for Abelian groups: Tor(Z_n, Z_m) = Z_{gcd(n,m)}
    # The Universal Coefficient Theorem splits homology into a tensor part and a Tor part.
    def tor_Z_n_Z_m(n, m):
        return sp.gcd(n, m)
    
    # Calculate torsion between Z_2 and Z_2
    tor_val = tor_Z_n_Z_m(2, 2)
    
    assert tor_val == 2, "Tor(Z2, Z2) must yield Z2, revealing the torsion"
sub_topics:
  - "同调群关于系数域的扩张"
  - "Ext 演算与扭元 (Torsion elements)"
  - "在离散拓扑分析中识别空间手性的工具"
  - "物理直觉：使用不同的“测量波段”观察空间深层结构"
