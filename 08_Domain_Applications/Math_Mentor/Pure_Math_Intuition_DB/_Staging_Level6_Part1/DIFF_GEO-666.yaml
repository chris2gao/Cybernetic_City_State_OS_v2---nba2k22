id: "DIFF_GEO-666"\nconcept_name: "Lie群与Lie代数 - 【RoPE 映射】：连续对称性的终极语言。旋转位置编码正是利用特殊正交群的分解，实现序列平移等变性。 (n_666)"\nsub_topics:\n  - "李群作为带有群结构的光滑流形"\n  - "李代数作为恒等元处的切空间"\n  - "指数映射从代数向群的演化"\n  - "旋转对称性 (SO(n)) 在位置感知特征中的刚性约束"\nllm_physical_mapping: "如同一根装满转盘的旋转传动轴，我们只研究它在刚启动那一瞬间的极小扭动角度（李代数），就能推算出机器运转一整天的所有可能姿态（李群）。"\ncode_implementation: |\n  import numpy as np\n  import scipy.linalg\n  def lie_algebra_to_group(skew_symmetric_matrix):\n      return scipy.linalg.expm(skew_symmetric_matrix)\nv8_sanity_audit:\n  sympy_pseudo_code: |\n    import sympy as sp\n    theta = sp.Symbol('theta')\n    matrix = sp.Matrix([[0, -theta], [theta, 0]])\n    assert matrix.trace() == 0\n