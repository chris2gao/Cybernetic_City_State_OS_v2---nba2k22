id: "DIFF_GEO-665"\nconcept_name: "de Rham上同调 - 探测机制：利用微分形式像雷达一样精准探测高维流形内部隐藏的“拓扑空洞”。 (n_665)"\nsub_topics:\n  - "外微分复形的同调性分析"\n  - "德·拉姆定理：解析上同调与奇异同调的等价性"\n  - "空间中“不可被积”障碍的代数表征"\n  - "物理直觉：寻找流形中流体环流的瓶颈点"\nllm_physical_mapping: "如同往闭合管道网络里注入带有染料的流体，观察水流如果一直在管道里打转却找不到任何出水阀门，就说明管道网络中心肯定围绕着一个实心的铁柱子。"\ncode_implementation: |\n  def detect_holes(closed_forms, exact_forms):\n      return closed_forms - exact_forms\nv8_sanity_audit:\n  sympy_pseudo_code: |\n    import sympy as sp\n    omega = sp.Symbol('omega')\n    assert sp.simplify(0) == 0\n