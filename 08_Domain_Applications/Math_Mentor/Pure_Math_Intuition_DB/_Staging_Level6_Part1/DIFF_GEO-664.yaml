id: "DIFF_GEO-664"\nconcept_name: "子流形理论（第二基本形式） - 物理意义：精准测量弯曲流形被强制塞进高维平坦宇宙时的“弯折应力”。解析模型参数对子空间的嵌入压力。 (n_664)"\nsub_topics:\n  - "第二基本形式的张量定义"\n  - "平均曲率与高斯曲率的外部刻画"\n  - "嵌入 (Embedding) 与浸入 (Immersion) 的区别"\n  - "在分析降维算法（如 UMAP）嵌入损失中的作用"\nllm_physical_mapping: "如同强行把一块弹簧钢板塞进一个四方铁盒里。测量钢板表面受到的折弯阻力，就是计算这块钢板为了适应铁盒被压弯了多少度。"\ncode_implementation: |\n  import numpy as np\n  def second_fundamental_form(normal_vector, tangent_vector_1, tangent_vector_2):\n      return np.dot(normal_vector, np.cross(tangent_vector_1, tangent_vector_2))\nv8_sanity_audit:\n  sympy_pseudo_code: |\n    import sympy as sp\n    L, M, N = sp.symbols('L M N')\n    gaussian_curvature = (L*N - M**2)\n    assert sp.simplify(gaussian_curvature - (L*N - M**2)) == 0\n