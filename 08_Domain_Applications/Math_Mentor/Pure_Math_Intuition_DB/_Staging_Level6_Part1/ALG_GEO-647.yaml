id: ALG_GEO-647
name: 代数曲线的分类 - 密码学底座：椭圆曲线加密理论的几何原点。 (n_647)
description: 代数曲线的分类
hierarchy_info:
  chapter: ALG_GEO
  section: 代数曲线的分类
  level: 6
llm_physical_mapping: 一个带有椭圆边界的无摩擦台球桌。小球在边界碰撞反弹的轨迹对应于点群加法，呈现出混沌但具有绝对确定性的动力学演化。
code_implementation: |-
  import torch
  # 用向量模拟椭圆曲线点
  P1 = torch.tensor([0.5, 0.8])
  P2 = torch.tensor([1.2, 0.4])
  # 伪群加法：沿X轴反射
  P3_raw = P1 + P2
  P3 = torch.tensor([P3_raw[0], -P3_raw[1]])
  assert P3.shape == (2,)
v8_sanity_audit:
  sympy_pseudo_code: |-
    import sympy as sp
    x1, y1, x2, y2, m = sp.symbols('x1 y1 x2 y2 m')
    # 椭圆曲线上点的加法斜率运算验证
    x3 = m**2 - x1 - x2
    y3 = m*(x1 - x3) - y1
    assert sp.simplify(y3 + y1 - m*(x1 - x3)) == 0
sub_topics:
- 椭圆曲线上的群律 (Group Law) 构造
- 离散对数问题在椭圆曲线上的困难度
- 双线性对 (Pairings) 的代数几何基础
- ECC 密钥空间与曲线亏格性质的关联
