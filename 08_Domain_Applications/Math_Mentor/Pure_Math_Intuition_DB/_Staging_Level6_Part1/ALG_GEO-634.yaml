id: ALG_GEO-634
name: "Zariski拓扑 - 发生学溯源：抛弃欧氏距离，仅承认代数簇为“闭集”。这种极度粗糙的拓扑赋予了空间极强的“刚性”。 (n_634)"
sub_topics:
  - 闭集的定义：多项式的零点集
  - Zariski 拓扑的不可约性与稠密性
  - 连续映射在代数几何中的特殊形态
  - 认知跃迁：从微观连续向宏观结构的一致性跃迁
llm_physical_mapping: "A rigid construction of steel girders (polynomial constraints). In this framework, you cannot isolate a soft, small, localized piece of the material (no open balls). You can only specify entire rigid structural walls (closed sets) defined by equations."
code_implementation: |
  import torch
  
  # Define points in a 2D space
  x = torch.linspace(-5, 5, 100)
  y = torch.linspace(-5, 5, 100)
  X, Y = torch.meshgrid(x, y, indexing='ij')
  
  # Polynomial P(x,y) = x^2 - y
  # The Zariski closed set is the zero locus of this polynomial
  P = X**2 - Y
  
  # A "closed set" in Zariski topology is extremely rigid.
  # We find points where P is exactly zero (or close to zero in numerical simulation)
  closed_set_mask = torch.abs(P) < 0.1
  zariski_surface = torch.zeros_like(P)
  zariski_surface[closed_set_mask] = 1.0
  # We can't have a "small open neighborhood", only the complement of such rigid lines/curves.
v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy as sp
    
    x, y = sp.symbols('x y')
    # Ideal generated by a polynomial corresponds to a closed set
    poly1 = x**2 - y
    poly2 = x**2 + y**2 - 1
    
    # Intersection of two closed sets is a closed set defined by both polynomials
    # Find common roots
    roots = sp.solve([poly1, poly2], (x, y))
    
    # Verify the points satisfy the original polynomials
    for root in roots:
        assert sp.simplify(poly1.subs({x: root[0], y: root[1]})) == 0
        assert sp.simplify(poly2.subs({x: root[0], y: root[1]})) == 0
