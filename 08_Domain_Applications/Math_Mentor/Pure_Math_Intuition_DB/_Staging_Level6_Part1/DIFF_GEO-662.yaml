id: "DIFF_GEO-662"\nconcept_name: "陈类 - 物理意义：规范场论中纤维丛（Fiber Bundles）的全局代数不变量。测量高维物理系统底层的拓扑荷。 (n_662)"\nsub_topics:\n  - "示性类 (Characteristic classes) 的公理化"\n  - "陈类 (Chern classes) 在复向量丛上的构造"\n  - "拓扑绝缘体与量子霍尔效应的数学关联"\n  - "物理意义：流形扭曲程度的量子化度量"\nllm_physical_mapping: "如同流水线上计算零件翻转次数的机械计数器，齿轮一旦咬合就只能记录整数圈，无论传送带怎样抖动，最终的总圈数绝对不变。"\ncode_implementation: |\n  import numpy as np\n  def compute_integer_twists(phases):\n      diffs = np.diff(phases)\n      diffs = (diffs + np.pi) % (2 * np.pi) - np.pi\n      return np.round(np.sum(diffs) / (2 * np.pi))\nv8_sanity_audit:\n  sympy_pseudo_code: |\n    import sympy as sp\n    phase_diff = sp.Symbol('phase_diff')\n    twist = phase_diff / (2 * sp.pi)\n    assert sp.simplify(twist * 2 * sp.pi - phase_diff) == 0\n