id: "CALCULUS-301"
concept_name: "隐函数定理与反函数定理 - 隐函数求导定理 (n_301)"
sub_topics:
  - "隐函数存在的条件：雅可比行列式非零"
  - "利用偏导数公式直接求解隐函数导数"
  - "隐函数求导的物理链式法则本质"
  - "隐函数定理在流形局部坐标映射中的作用"
llm_physical_mapping: "mundane physical metaphor: measuring the slope of a shadow cast by an intertwined object, using the gradients of the object's 3D shape."
code_implementation: |
  import sympy as sp
  x, y = sp.symbols('x y')
  F = x**2 + y**2 - 1
  dydx = -sp.diff(F, x) / sp.diff(F, y)
v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy as sp
    x, y = sp.symbols('x y')
    F = x**2 + y**2 - 1
    dydx = -sp.diff(F, x) / sp.diff(F, y)
    assert sp.simplify(dydx - (-x/y)) == 0