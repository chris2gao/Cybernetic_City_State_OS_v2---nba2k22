v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy as sp
    t = sp.symbols('t', real=True)
    z = sp.cos(t) + sp.I * sp.sin(t)
    dz_dt = sp.diff(z, t)
    f_z = z**3
    closed_loop_integral = sp.integrate(f_z * dz_dt, (t, 0, 2*sp.pi))
    assert sp.simplify(closed_loop_integral) == 0
