concept_node:
  id: "FA-001"
  symbol: "\\langle \\cdot, \\cdot \\rangle"
  name: "Inner Product (内积)"
  domain: "Functional Analysis (泛函分析) / Hilbert Space"
  
  pure_math_definition:
    description: >
      在向量空间上定义的一个二元函数，它将两个向量映射为一个标量。
      内积为原本没有形状的线性空间引入了“几何结构”，使其具备了计算“长度”、“距离”和“角度（正交性）”的能力。
    axioms:
      - "共轭对称性 (Symmetry): \\langle x, y \\rangle = \\overline{\\langle y, x \\rangle}"
      - "第一变元线性 (Linearity): \\langle a x_1 + b x_2, y \\rangle = a \\langle x_1, y \\rangle + b \\langle x_2, y \\rangle"
      - "正定性 (Positive-definiteness): \\langle x, x \\rangle \\ge 0 \\text{, 且 } \\langle x, x \\rangle = 0 \\iff x = 0"
      - "柯西-施瓦茨不等式 (Cauchy-Schwarz Inequality): |\\langle x, y \\rangle|^2 \\le \\langle x, x \\rangle \\langle y, y \\rangle"

  llm_physical_mapping:
    architecture_component: "Self-Attention Mechanism (Q-K Interaction & Scaling)"
    cognitive_intuition: >
      在 Attention 机制中，当计算 Q 和 K 的点积时，本质上是在高维语义希尔伯特空间中执行内积操作。
      如果仅仅是纯粹的内积，随着维度 d_k 的增加，独立同分布向量的内积方差会急剧膨胀，破坏 Softmax 测度空间的平滑性。
      因此，大模型通过除以 \\sqrt{d_k} 来收缩这个度量，这是柯西-施瓦茨不等式在测度空间对齐中的一次极其优雅的物理降维。
    tensor_shape_flow: "Q[batch, seq, d_k] \\times K[batch, seq, d_k]^T \\rightarrow \\text{Scaled}(\\text{Alignment\\_Matrix}[batch, seq, seq])"

  code_implementation:
    framework: "PyTorch"
    snippet: |
      import torch
      import math
      
      def compute_attention_inner_product(q: torch.Tensor, k: torch.Tensor) -> torch.Tensor:
          # 在最后一个维度 d_k 上进行内积运算并应用度量缩放
          raw_scores = torch.matmul(q, k.transpose(-2, -1))
          scaled_scores = raw_scores / math.sqrt(q.size(-1))
          return scaled_scores

  v8_sanity_audit:
    engine: "SymPy + Z3"
    validation_target: "独立同分布向量内积的方差膨胀 (Variance Expansion of Inner Product)"
    execution_logic: >
      验证当 q_i, k_i 是独立同分布（均值为0，方差为1）的随机变量时，
      它们的内积 \\sum_{i=1}^{d_k} q_i k_i 的方差是否严格等于 d_k。
    sympy_pseudo_code: |
      import sympy as sp
      
      # 定义符号变量
      d_k = sp.Symbol('d_k', positive=True)
      var_q_i = 1
      var_k_i = 1
      
      # 独立且均值为0的随机变量乘积的方差：V(xy) = V(x)V(y)
      var_product = var_q_i * var_k_i
      
      # 内积是 d_k 个互相独立乘积的总和
      total_variance = d_k * var_product
      
      # 断言总方差严格等于维度 d_k
      assert sp.simplify(total_variance - d_k) == 0, "Variance Expansion Axiom Violated!"
