id: "CRYPTO_MATH-750"
concept_name: "秘密共享（Shamir方案） - 物理分布：利用多项式插值理论将秘密分片。主宰隐私计算预警与联邦学习（MPC）中的多节点互信架构。 (n_750)"
sub_topics:
  - "拉格朗日插值在秘密重构中的作用"
  - "门限 (Threshold) 机制的设计"
  - "容忍节点故障与恶意篡改的能力"
  - "物理映射：将一把钥匙锯成碎片，只有多数人聚集才能开锁"
llm_physical_mapping: "A heavy blast door locked by a complex multi-point lever system. Instead of one master key, the activation requires placing several distinct mechanical struts across a grid. Any t struts provide exactly enough structural support to align the main gear and turn the lock, acting as points defining a smooth polynomial curve. If you have fewer than t struts, the gear slips completely, offering absolutely zero torque to the lock mechanism."
code_implementation: |
  import torch

  def shamir_share(secret, num_shares, threshold):
      coeffs = torch.cat([torch.tensor([secret], dtype=torch.float32), 
                          torch.randn(threshold - 1)])
      shares = []
      for x in range(1, num_shares + 1):
          x_tensor = torch.tensor(x, dtype=torch.float32)
          y = sum(c * (x_tensor ** i) for i, c in enumerate(coeffs))
          shares.append((x, y))
      return shares
