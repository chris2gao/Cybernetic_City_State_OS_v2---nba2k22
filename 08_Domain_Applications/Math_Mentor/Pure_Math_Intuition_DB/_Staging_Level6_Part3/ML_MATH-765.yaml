id: "ML_MATH-765"
concept_name: "正则化理论（L1/L2/弹性网/岭回归） - 物理映射：L2 为权重“弹簧阻尼器”防止能量撕裂网络；L1 为“奥卡姆剃刀”，通过菱形几何边界强行归零无关特征，启发了 MoE 专家剪枝路由。 (n_765)"
sub_topics:
  - "约束域几何形状对最优解位置的导向"
  - "L1 范数的稀疏性诱导机制"
  - "L2 范数在权重衰减与平滑化中的动力学解释"
  - "正则化强度作为复杂度与准确率博弈的平衡杆"
llm_physical_mapping: "mundane physical metaphor: hydraulic dampeners (L2) preventing extreme gear velocity, coupled with a mechanical shearing blade (L1) that physically snips unengaged auxiliary belts to conserve engine power."
code_implementation: |
  import torch
  import numpy as np

  weights = torch.tensor([1.5, -0.2, 0.05, 3.1], requires_grad=True)

  # L2 Dampener (Spring resistance)
  l2_penalty = 0.1 * torch.sum(weights ** 2)

  # L1 Shearing Blade (Sparsity enforcer)
  l1_penalty = 0.05 * torch.sum(torch.abs(weights))

  # Simulate loss
  task_loss = torch.sum(weights)
  total_loss = task_loss + l1_penalty + l2_penalty
  total_loss.backward()

  # Update weights (L1 will push small weights to exactly zero over time)
  with torch.no_grad():
      weights -= 0.1 * weights.grad
v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy as sp
    w = sp.Symbol('w', real=True)
    l2 = w**2
    assert sp.diff(l2, w) == 2*w
