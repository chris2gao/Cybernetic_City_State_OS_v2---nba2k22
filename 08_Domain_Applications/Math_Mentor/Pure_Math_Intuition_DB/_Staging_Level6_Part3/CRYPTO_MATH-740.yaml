id: "CRYPTO_MATH-740"
concept_name: "有限域 - 认知跃迁：计算机内存有限，必须退回到封闭循环的 $GF(p)$ 伽罗瓦域。在此宇宙中加减乘除完美自洽，加乘为“单向陷门”提供机械结构。 (n_740)"
sub_topics:
  - "特征为 p 的有限域构造"
  - "既约多项式诱导的域扩张"
  - "有限域上的线性代数运算"
  - "物理直觉：在像素化的代数世界中建立精确逻辑"
llm_physical_mapping: "mundane physical metaphor: an old-school mechanical odometer or clock face built with heavy metal gears, where numbers strictly wrap around upon reaching a maximum value along a closed-loop conveyor belt."
code_implementation: |
  def finite_field_add(a, b, p):
      return (a + b) % p
      
  def finite_field_mult(a, b, p):
      return (a * b) % p
      
  p = 7
  res_add = finite_field_add(5, 4, p)
  res_mult = finite_field_mult(5, 4, p)
v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy as sp
    gf_mod = 7
    a, b = 5, 4
    assert (a + b) % gf_mod == 2
    assert (a * b) % gf_mod == 6
