id: "CRYPTO_MATH-743"
concept_name: "零知识证明 - 物理动态：交互式证明系统的概率迷宫。在完全不泄露“秘密本身”的情况下，通过循环测试向对方证明“我知道”。 (n_743)"
sub_topics:
  - "完备性、可靠性与零知识性的严格定义"
  - "基于模拟器的安全性证明"
  - "物理类比：通过解决无数个与秘密关联的谜题来验证身份"
  - "非交互式零知识证明 (NIZK) 的演化"
llm_physical_mapping: "mundane physical metaphor: a worker repeatedly demonstrating the ability to open a complex mechanical vault from the inside to an inspector outside, without ever revealing the combination lock code."
code_implementation: |
  import random
  
  def zkp_interactive_round(prover_secret, challenger_bit):
      r = random.randint(1, 100)
      if challenger_bit == 0:
          return r
      else:
          return (r + prover_secret) % 101
          
  secret = 42
  challenge = random.choice([0, 1])
  response = zkp_interactive_round(secret, challenge)
v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy as sp
    s, r, c = sp.symbols('s r c')
    # Abstract representation of verification relation
    assert sp.simplify(r + c*s - (r + c*s)) == 0
