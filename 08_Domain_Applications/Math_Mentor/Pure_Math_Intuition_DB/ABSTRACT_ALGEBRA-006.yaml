id: ABSTRACT_ALGEBRA-006
title: "Group Actions"
sub_topics:
  - "Group Action on a Set"
  - "Orbits and Stabilizers"
  - "Faithful and Transitive Actions"
  - "Burnside's Lemma"
llm_physical_mapping: "Hierarchical Task Network (HTN) and Attention Actions. The attention matrices act continuously on the hidden state tokens (the set). Each transformer layer is a group element acting on the semantic manifold, translating the meaning towards the final output space."
code_implementation: "PyTorch self-attention acting on a sequence state."
v8_sanity_audit:
  sympy_pseudo_code: |
    import torch
    
    seq_len, dim = 2, 4
    # State set
    X = torch.randn(seq_len, dim)
    
    # Action operator (Attention Matrix)
    # A acts on X
    A = torch.softmax(torch.randn(seq_len, seq_len), dim=-1)
    
    # Group action applying transformation
    X_transformed = torch.matmul(A, X)
    
    assert X_transformed.shape == X.shape
    # Check that it's a convex combination
    assert torch.allclose(torch.sum(A, dim=-1), torch.ones(seq_len))
