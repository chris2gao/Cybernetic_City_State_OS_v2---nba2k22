concept_name: "Tautologies, Contradictions, Satisfiability, and Entailment / 永真式、矛盾式、可满足性与逻辑蕴含"
canonical_concept: "propositional_semantic_classification_and_entailment"
domain: "Mathematical Logic / Propositional Calculus"
symbol: "⊨φ, Γ⊨φ"

sub_topics:
  - "Definition and decision of tautologies / 永真式（重言式）的定义与判定"
  - "Definition and decision of contradictions / 矛盾式的定义与判定"
  - "Satisfiable formulas and semantic entailment / 可满足式与逻辑蕴含"

pure_math_definition:
  english: |-
    A valuation v satisfies a formula φ when v(φ)=True. Formula φ is a
    tautology, written ⊨φ, when every valuation of its atoms satisfies it. It is
    a contradiction when no valuation satisfies it, and satisfiable when at
    least one valuation satisfies it. A formula can be satisfiable without
    being a tautology.

    A set of premises Γ semantically entails φ, written Γ⊨φ, when every
    valuation satisfying every member of Γ also satisfies φ. Equivalently,
    there is no countermodel that makes all premises true and the conclusion
    false. Entailment is vacuously true if Γ has no satisfying valuation; that
    semantic fact must not be confused with evidence that the premises are
    factually true.
  chinese: |-
    若赋值 v 使 v(φ)=真，则称 v 满足公式 φ。若对 φ 的原子命题的每个赋值都满足
    φ，则 φ 是永真式，记作 ⊨φ；若没有赋值满足 φ，则它是矛盾式；若至少一个
    赋值满足 φ，则它是可满足式。可满足式不一定是永真式。

    若每个同时满足前提集 Γ 中所有公式的赋值也满足 φ，则称 Γ 在语义上蕴含 φ，
    记作 Γ⊨φ。等价地，不存在让全部前提为真而结论为假的反模型。若 Γ 根本不可
    满足，则蕴含在语义上真空成立；这不能被误解为前提在现实中为真。

assumptions_and_notation:
  - "The valuation domain is classical and two-valued. / 赋值采用经典二值语义。"
  - "⊨ is semantic entailment; it is distinct from a proof-system symbol such as ⊢. / ⊨ 表示语义蕴含，与证明系统符号 ⊢ 不同。"
  - "A countermodel satisfies all premises and falsifies the conclusion. / 反模型使所有前提为真且结论为假。"

