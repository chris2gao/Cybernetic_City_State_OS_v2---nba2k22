mode_a_intuition:
  occurrence_crisis:
    english: "A formula may be true in the current case yet fail elsewhere, so one successful example cannot classify it."
    chinese: "一个公式可能在当前情形为真却在别处为假，因此单个成功例子不能完成分类。"
  primary:
    english: |-
      View the truth-table column as a coverage board. All marked means
      tautology, none marked means contradiction, and at least one marked means
      satisfiable. For entailment, search specifically for a forbidden row:
      every premise marked true while the conclusion is false.
    chinese: |-
      把真值表输出列看作覆盖板：全为真是永真式，全为假是矛盾式，至少一真是可
      满足。判断蕴含时专门寻找禁行：所有前提都真而结论为假。
  low_friction_example:
    english: "P∨¬P is true on both P rows; P∧¬P is false on both; P∨Q is satisfiable but not a tautology."
    chinese: "P∨¬P 在 P 的两行都真；P∧¬P 两行都假；P∨Q 可满足但不是永真式。"
  limitations:
    - "Coverage-board language models valuations only, not probability or empirical frequency. / 覆盖板只模拟赋值，不表示概率或经验频率。"
    - "Failure to find a countermodel by sampling is not proof of entailment. / 抽样未找到反模型并不证明蕴含。"

mapping_boundary:
  status: "semantic_only_accepted"
  valid_uses: ["classifying complete truth-table columns / 分类完整真值表输出列", "searching for a satisfying valuation / 寻找满足赋值", "searching for an entailment countermodel / 寻找蕴含反模型"]
  invalid_inferences:
    - "Tautology does not mean every atomic proposition is factually true. / 永真式不表示每个原子命题事实上为真。"
    - "Satisfiable does not mean true under every valuation. / 可满足不表示所有赋值下都真。"
    - "Semantic entailment does not by itself provide a formal derivation. / 语义蕴含本身不提供形式推导。"
    - "Vacuous entailment does not establish consistent premises. / 真空蕴含不证明前提一致。"

common_misconceptions:
  - "A formula true on one row is a tautology. / 误以为一行真就是永真式。"
  - "A non-tautology must be a contradiction. / 误以为非永真式必是矛盾式。"
  - "Satisfiable and valid mean the same thing. / 误以为可满足与有效同义。"
  - "Γ⊨φ means φ appears among Γ. / 误以为 Γ⊨φ 只表示 φ 已列在 Γ 中。"
  - "No sampled counterexample proves entailment. / 误以为抽样未见反例即可证明蕴含。"

definition_restatement_hook:
  prompt_en: "Contrast tautology, contradiction, and satisfiable formula using quantifiers over valuations; then define Γ⊨φ by the absence of a countermodel."
  prompt_zh: "用对赋值的量词对比永真式、矛盾式和可满足式，再用不存在反模型定义 Γ⊨φ。"
  required_elements: ["every valuation", "no valuation", "at least one valuation", "all premises true", "conclusion false countermodel"]

forcing_question_plan:
  - {question_en: "Can a formula be satisfiable and not a tautology? Give one truth-table pattern.", question_zh: "公式能否可满足但不是永真式？给出一种真值列模式。"}
  - {question_en: "What exact row would refute Γ⊨φ?", question_zh: "哪种精确赋值行会否定 Γ⊨φ？"}
  - {question_en: "Why does P∧(P→Q) entail Q?", question_zh: "为什么 P∧(P→Q) 语义蕴含 Q？"}
  - {question_en: "Why can an inconsistent premise set entail a conclusion vacuously?", question_zh: "为什么不可满足的前提集会真空蕴含结论？"}

