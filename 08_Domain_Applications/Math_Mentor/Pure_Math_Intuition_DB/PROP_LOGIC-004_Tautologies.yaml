v8_sanity_audit:
  status: "run_with_log"
  execution_claim: "bounded_finite_audit_only"
  language: "sympy"
  script_ref: ".ai/PROGRAM_RUNS/kcp-batch-1-prop-logic-certification-0001/AUDITS/run_prop_logic_audit.py"
  tested_properties: ["excluded middle tautology", "P and not P contradiction", "XOR satisfiable non-tautology", "modus ponens entailment", "one non-entailment countermodel"]
  explicitly_not_validated: ["general_semantic_metatheory", "proof_system_completeness", "pedagogy", "learner_mastery"]
  sympy_pseudo_code: |
    import itertools
    import sympy as sp
    from sympy.logic.boolalg import And, Implies, Not, Or
    P, Q = sp.symbols("P Q")
    rows = list(itertools.product((False, True), repeat=2))
    assert all(bool(Or(P, Not(P)).subs({P: p, Q: q})) for p, q in rows)
    assert not any(bool(And(P, Not(P)).subs({P: p, Q: q})) for p, q in rows)
    assert not any(bool(And(P, Implies(P, Q)).subs({P: p, Q: q})) and not q for p, q in rows)

