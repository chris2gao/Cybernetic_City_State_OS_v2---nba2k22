id: "CALCULUS-274"
concept_name: "积分（定积分/不定积分） - 核心积分法：换元积分法（代数替换降维）与分部积分法（积的求导法则逆运算） (n_274)"
sub_topics:
  - "第一换元法（凑微分法）"
  - "第二换元法（变量代换法）"
  - "分部积分公式 ∫u dv = uv - ∫v du"
  - "递归分部积分的应用场景"
llm_physical_mapping: "Substitution is like changing currencies before buying a foreign product; integration by parts is like undoing a braided rope one strand at a time."
code_implementation: |
  import sympy as sp
  x = sp.Symbol('x')
  # Integration by parts example: int(x * exp(x))
  u = x
  dv = sp.exp(x)
  v = sp.integrate(dv, x)
  du = sp.diff(u, x)
  # uv - int(v du)
  integral_by_parts = u * v - sp.integrate(v * du, x)
v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy as sp
    x = sp.Symbol('x')
    # Integration by parts: int(x * exp(x))
    result = sp.integrate(x * sp.exp(x), x)
    # uv - int(v du) = x*exp(x) - exp(x)
    assert sp.simplify(result - (x * sp.exp(x) - sp.exp(x))) == 0
