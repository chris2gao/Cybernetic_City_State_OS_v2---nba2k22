llm_physical_mapping: "mundane physical metaphor: Think of parameterizing a surface like wrapping a flat sheet of grid paper around a globe or a vase. The math maps each grid intersection (u, v) from the flat paper to a specific 3D coordinate (x, y, z) in space, acting like a GPS coordinate system plastered onto a curved object."
code_implementation: |
  import sympy as sp
  
  def sphere_parameterization(u, v, r):
      # u: azimuthal angle, v: polar angle
      x = r * sp.sin(v) * sp.cos(u)
      y = r * sp.sin(v) * sp.sin(u)
      z = r * sp.cos(v)
      return sp.Matrix([x, y, z])
v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy as sp
    
    u, v = sp.symbols('u v')
    r = 1
    x = r * sp.sin(v) * sp.cos(u)
    y = r * sp.sin(v) * sp.sin(u)
    z = r * sp.cos(v)
    
    # Check that x^2 + y^2 + z^2 = r^2
    radius_squared = sp.simplify(x**2 + y**2 + z**2)
    assert radius_squared == 1
