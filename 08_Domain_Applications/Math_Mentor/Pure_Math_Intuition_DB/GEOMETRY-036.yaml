concept_node:
  id: "GEOMETRY-036"
  name: "几何变换（平移/旋转/反射/缩放） - 非等距变换：缩放/位似变换 (Dilation) 与相似图形的等价性 (n_156)"
  description: |
    缩放变换（Dilation或Scaling）是改变图形大小而不改变形状的非等距变换。
    这种变换维持角度不变，保持直线为直线，并且使得变换后的图形与原图形具有相似性。
    缩放由一个位似中心（Center of dilation）和一个位似比（Scale factor）决定。
  sub_topics:
    - "位似中心与位似比（Scale Factor）"
    - "缩放变换对对应角相等性的保持"
    - "缩放变换下长度比与面积比的变化规律"
    - "相似图形在笛卡尔坐标系中的坐标缩放"
  llm_physical_mapping: |
    This can be visualized like resizing an image on a computer screen. When you drag the corner of an image while holding the shift key, the center or opposite corner stays fixed (the center of dilation), and every pixel's distance from the center is multiplied by the same amount (the scale factor). The shape remains identical, just larger or smaller.
  code_implementation: |
    import torch
    
    # Define a set of points (e.g., vertices of a triangle) in 2D
    points = torch.tensor([[1.0, 1.0], [3.0, 1.0], [2.0, 3.0]])
    
    # Define scale factors
    scale_x = 2.0
    scale_y = 2.0
    
    # Scaling transformation matrix
    scaling_matrix = torch.tensor([
        [scale_x, 0.0],
        [0.0, scale_y]
    ])
    
    # Apply scaling: P' = P @ S^T
    scaled_points = points @ scaling_matrix.T
    print("Original points:\n", points)
    print("Scaled points:\n", scaled_points)
  v8_sanity_audit:
    sympy_pseudo_code: |
      from sympy.geometry import Point, Polygon
      
      # Define a polygon
      p = Polygon(Point(0, 0), Point(2, 0), Point(1, 2))
      
      # Scale the polygon by a factor of 3 with respect to the origin (0,0)
      scaled_p = p.scale(x=3, y=3, pt=Point(0, 0))
      print(scaled_p)
