code_implementation: |
  import sympy as sp
  
  t = sp.Symbol('t')
  A = sp.Matrix([[1, 2], [3, 4]])
  
  # Matrix exponential e^{At}
  exp_At = sp.exp(A * t)
v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy as sp
    
    t = sp.Symbol('t', real=True)
    A = sp.Matrix([[2, 0], [0, 3]])
    exp_At = sp.exp(A * t)
    
    # Asserting that the derivative of e^{At} is A * e^{At}
    deriv = sp.diff(exp_At, t)
    assert sp.simplify(deriv - A * exp_At) == sp.zeros(2, 2)
