llm_physical_mapping: "spatial deformation where pure stretching cannot be separated. Imagine a shear deformation in space where multiple stretching directions collapse into one. The space cannot be neatly pulled apart into independent stretching axes. The Jordan block represents this defect, functioning as a chained, intertwined stretching and shearing operation along a single dominant direction, showing the limits of diagonal uncoupling."
