v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy as sp
    A = sp.Matrix([[2, 1], [0, 2]])
    P, J = A.jordan_form()
    assert J == sp.Matrix([[2, 1], [0, 2]])
    assert P * J * P.inv() == A
