id: "PROB_STAT-357"
concept_name: "大数定律 - 弱大数定律与强大数定律的直觉区分 (n_357)"
sub_topics:
  - "依概率收敛 (Convergence in Probability)"
  - "几乎处处收敛 (Almost Sure Convergence)"
  - "无限序列均值稳定性的哲学解释"
  - "辛钦大数定律的条件放宽"
llm_physical_mapping: "bullet hole maps where weak law means occasional scattered shots happen but vanish in probability, while strong law means individual sequences of shots strictly form a solid path towards the center."
code_implementation: |
  import sympy as sp
  n, epsilon = sp.symbols('n epsilon')
  X_n = sp.Function('X_n')(n)
  X = sp.Symbol('X')
  # Convergence in probability
  limit_prob = sp.Limit(sp.Probability(sp.Abs(X_n - X) > epsilon), n, sp.oo)
v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy as sp
    n = sp.Symbol('n', integer=True, positive=True)
    prob_deviation = 1 / n
    limit_val = sp.limit(prob_deviation, n, sp.oo)
    assert limit_val == 0
