  symbol: A \subseteq B
  name: Subset and Set Operations (集合与子集)
  domain: Set Theory (集合论)
  sub_topics:
  - 包含关系与子集定义
  - 真子集的判定条件
  - 幂集 (Power Set) 的构造
  - 空集的特殊性质
  - 集合相等的定义
  pure_math_definition:
    description: 'A set A is a subset of a set B if every element of A is also an
      element of B.

      '
    axioms:
    - 'Subset definition: For all x, if x in A, then x in B.'
    - 'Extensionality: A = B iff A is a subset of B and B is a subset of A.'
  llm_physical_mapping:
    tensor_shape_flow: 'Indexing and Slicing: tensor_A is a subset of tensor_B if
      all elements of A exist in B.'
    cognitive_intuition: 'Think of sets as distinct containers. If every item in container
      A can also be found in container B, A is a subset.

      '
  code_implementation:
    snippet: 'import torch


      # Using 1D tensors as sets

      B = torch.tensor([1, 2, 3, 4, 5])

      A = torch.tensor([2, 4])


      # Check if A is subset of B

      # Is every element of A in B?

      is_subset = torch.all(torch.isin(A, B)).item()

      '
  v8_sanity_audit:
    sympy_pseudo_code: 'import sympy as sp

      from sympy import FiniteSet


      A = FiniteSet(1, 2, 3)

      B = FiniteSet(1, 2, 3, 4, 5)

      C = FiniteSet(4, 5, 6)


      # Assertion checks

      assert A.is_subset(B) == True

      assert C.is_subset(B) == False


      # Extensionality

      A2 = FiniteSet(3, 2, 1)

      assert A == A2

      '
