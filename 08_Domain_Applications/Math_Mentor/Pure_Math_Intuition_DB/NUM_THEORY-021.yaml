id: "NUM_THEORY-021"
concept_name: "欧拉函数φ(n) - 定义：小于或等于 n 且与 n 互质的正整数个数 (n_215)"
sub_topics:
  - "互质性的判定标准"
  - "欧拉函数的计数逻辑"
  - "φ(p) = p-1 的初等情形"
  - "容斥原理在 φ(n) 计算中的体现"
llm_physical_mapping: "mundane physical metaphor: filtering out non-coprime gears to find how many can engage without jamming. Imagine a master gear with n teeth. If a smaller gear shares a common factor > 1, its teeth hit the same slots repeatedly, causing jams. Perfectly engaging gears must be coprime to n."
code_implementation: |
  import math
  def phi_list_comprehension(n):
      return len([k for k in range(1, n + 1) if math.gcd(n, k) == 1])
v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy
    n = 10
    result = sympy.totient(n)
    assert result == 4
