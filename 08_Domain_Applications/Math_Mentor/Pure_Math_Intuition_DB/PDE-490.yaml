code_implementation: |
  import torch

  def simulate_wave_1d(length=100, steps=200, c=1.0, dt=0.1, dx=1.0):
      u = torch.zeros(length)
      u_prev = torch.zeros(length)
      
      x = torch.arange(length, dtype=torch.float32)
      u_prev = torch.exp(-0.1 * (x - length/2)**2)
      u = u_prev.clone()
      
      C = c * dt / dx
      
      trajectory = [u.clone()]
      for _ in range(steps):
          u_next = torch.zeros_like(u)
          u_next[1:-1] = 2*u[1:-1] - u_prev[1:-1] + (C**2) * (u[2:] - 2*u[1:-1] + u[:-2])
          
          u_next[0] = 0
          u_next[-1] = 0
          
          u_prev = u
          u = u_next
          trajectory.append(u.clone())
          
      return torch.stack(trajectory)
v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy as sp

    x, t, c = sp.symbols('x t c', real=True)
    f = sp.Function('f')
    g = sp.Function('g')

    u = f(x - c*t) + g(x + c*t)

    u_tt = sp.diff(u, t, 2)
    u_xx = sp.diff(u, x, 2)

    wave_eq = u_tt - c**2 * u_xx
    assert sp.simplify(wave_eq) == 0, "d'Alembert solution must satisfy the wave equation"
