concept_name: "稳定性分析 - 李雅普诺夫稳定性 (Lyapunov Stability)：研究系统在噪声扰动后的收敛或崩溃 (n_451)"
sub_topics:
  - "稳定性、渐进稳定性与不稳定性定义"
  - "李雅普诺夫第一方法（线性化方法）"
  - "李雅普诺夫第二方法（直接法/能量泛函法）"
  - "李雅普诺夫函数的构造与导数判定"
llm_physical_mapping: "mundane physical metaphor: Imagine a coffee cup on a table. If you nudge it slightly (noise perturbation) and it returns to its upright position or stays very close, it is Lyapunov stable. The Lyapunov function is like checking the 'total mechanical energy' of the cup; if the energy continuously decreases due to friction every time it's bumped, we know it will eventually settle down to the bottom (asymptotic stability) without needing to track its exact wobbling path."
code_implementation: |
  import sympy as sp
  
  x, y = sp.symbols('x y')
  # System: dx/dt = -x, dy/dt = -y
  f_x = -x
  f_y = -y
  
  # Candidate Lyapunov function V(x, y) = x^2 + y^2
  V = x**2 + y**2
  
  # Orbital derivative dV/dt = (dV/dx)*(dx/dt) + (dV/dy)*(dy/dt)
  dVdt = sp.diff(V, x) * f_x + sp.diff(V, y) * f_y
v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy as sp
    
    x, y = sp.symbols('x y', real=True)
    f_x = -x
    f_y = -y
    V = x**2 + y**2
    dVdt = sp.diff(V, x) * f_x + sp.diff(V, y) * f_y
    
    # V must be positive definite, dVdt must be negative definite
    # Check at a specific non-zero point
    assert V.subs({x: 1, y: 1}) > 0
    assert dVdt.subs({x: 1, y: 1}) < 0
