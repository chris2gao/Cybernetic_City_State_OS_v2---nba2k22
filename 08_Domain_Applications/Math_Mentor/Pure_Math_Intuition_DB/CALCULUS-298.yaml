id: "CALCULUS-298"
concept_name: "Green定理/Stokes定理/Gauss散度定理 - 格林定理：平面闭曲线积分与二重积分转换 (n_298)"
sub_topics:
  - "平面区域上的环流量与旋度强度"
  - "格林公式的代数形式与证明"
  - "路径无关性的充要条件：P对y偏导等于Q对x偏导"
  - "利用格林定理计算平面图形面积"
llm_physical_mapping: "mundane physical metaphor: measuring the total spin of water in a pool either by walking around the edge with a flow meter or summing up all tiny whirlpools inside."
code_implementation: |
  import sympy as sp
  x, y = sp.symbols('x y')
  P, Q = -y, x
  dQdx = sp.diff(Q, x)
  dPdy = sp.diff(P, y)
  curl = dQdx - dPdy
v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy as sp
    x, y = sp.symbols('x y')
    P, Q = -y, x
    assert sp.diff(Q, x) - sp.diff(P, y) == 2