  title: "比例与百分比 (ratios_and_percentages) - 正比例与反比例函数的雏形 (n_62)"
  sub_topics:
    - "正比例关系：y=kx 的特征与常量 k 的几何意义"
    - "反比例关系：xy=k 的特征与乘积恒定性质"
    - "正比例与反比例的图像直观辨析"
    - "生活中的比例模型（如速度、时间、路程的关系）"
  llm_physical_mapping: "Mundane metaphor: A road trip or a shared task. Direct proportion (y=kx) is like driving at a constant speed: the longer you drive, the further you go. Inverse proportion (xy=k) is like dividing a fixed task among a team: the more workers (x) you have, the less time (y) it takes to complete the task, but the total worker-hours (k) remains constant."
  code_implementation: |-
    import torch

    def simulate_proportions():
        # Direct proportion: y = k * x (e.g., Distance = Speed * Time)
        k_direct = 5.0  # Constant speed
        x_time = torch.tensor([1.0, 2.0, 3.0, 4.0])
        y_distance = k_direct * x_time
        
        # Inverse proportion: y = k / x (e.g., Time = Distance / Speed)
        k_inverse = 120.0  # Constant distance
        x_speed = torch.tensor([10.0, 20.0, 30.0, 40.0])
        y_time_taken = k_inverse / x_speed
        
        return y_distance, y_time_taken
  v8_sanity_audit:
    sympy_pseudo_code: |-
      import sympy as sp
      
      x, y, k = sp.symbols('x y k', positive=True)
      
      # Define the inverse proportion relationship: x * y = k
      inverse_relation = sp.Eq(x * y, k)
      
      # Solve for y
      y_solution = sp.solve(inverse_relation, y)[0]
      
      # Verify properties: the rate of change of y with respect to x should be negative
      derivative_y_wrt_x = sp.diff(y_solution, x)
      # Prints -k/x**2
      print(f"Derivative dy/dx: {derivative_y_wrt_x}")
