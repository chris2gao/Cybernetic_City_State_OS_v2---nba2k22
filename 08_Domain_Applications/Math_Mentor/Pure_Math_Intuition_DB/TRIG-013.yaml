version: 9.1
id: TRIG-013
name: 正弦/余弦定理 - 发生学溯源：航海与测量中非直角三角形无法直接使用三角函数的工程危机 (n_174)
domain: math
sub_topics:
  - 古代航海中的测距与定位需求
  - 勾股定理在斜三角形中的失效
  - 天文测量对非直角解三角形的需求
  - 从特殊到一般的几何认知演变
llm_physical_mapping: |
  Mundane physical metaphor: Ships triangulating distances on the open sea. When two ships and a lighthouse form a triangle, it is rarely a perfect right triangle. To calculate the distance to the lighthouse from one ship, given the known distance between the two ships and the two observed angles, sailors needed a new mathematical tool, since basic SOH CAH TOA only works for right triangles. The sine and cosine rules emerged as the general-case tools to resolve these non-right navigation and surveying crises.
code_implementation: |
  import torch
  import math

  # Modeling an oblique triangle for ship triangulation
  # Ship A is at the origin, Ship B is 10 units away on the x-axis
  A = torch.tensor([0.0, 0.0])
  B = torch.tensor([10.0, 0.0])
  
  # Angles measured from ships to a Lighthouse C
  angle_A = torch.tensor(math.radians(45.0))
  angle_B = torch.tensor(math.radians(60.0))
  
  # The third angle C (at the lighthouse)
  angle_C = torch.tensor(math.pi) - angle_A - angle_B
  
  # Distance between ships (side c)
  c = torch.norm(B - A)
  
  # Using Sine Rule: a/sin(A) = b/sin(B) = c/sin(C)
  # Distance from Ship B to Lighthouse (side a)
  a = c * torch.sin(angle_A) / torch.sin(angle_C)
  
  # Distance from Ship A to Lighthouse (side b)
  b = c * torch.sin(angle_B) / torch.sin(angle_C)
  
  # Coordinates of Lighthouse C
  C = A + torch.tensor([b * torch.cos(angle_A), b * torch.sin(angle_A)])
  
  # Verify with Cosine Rule: c^2 = a^2 + b^2 - 2ab*cos(C)
  c_squared_calc = a**2 + b**2 - 2*a*b*torch.cos(angle_C)
  assert torch.isclose(c**2, c_squared_calc, atol=1e-5), "Cosine rule failed"
v8_sanity_audit:
  sympy_pseudo_code: |
    from sympy import symbols, sin, cos, pi, Eq, solve
    
    a, b, c = symbols('a b c', positive=True)
    A, B, C = symbols('A B C', positive=True)
    
    # Define Sine Rule relations
    sine_rule_1 = Eq(a / sin(A), b / sin(B))
    sine_rule_2 = Eq(b / sin(B), c / sin(C))
    
    # Define Cosine Rule for side 'a'
    cosine_rule_a = Eq(a**2, b**2 + c**2 - 2*b*c*cos(A))
    
    # Example: Ship A and B are 10km apart (c=10)
    # Ship A measures angle A=45 deg (pi/4), Ship B measures angle B=60 deg (pi/3)
    knowns = {c: 10, A: pi/4, B: pi/3, C: pi - pi/4 - pi/3}
    
    # Find distance 'a' (Ship B to Lighthouse) using Sine Rule
    eq_a = Eq(a / sin(knowns[A]), knowns[c] / sin(knowns[C]))
    a_sol = solve(eq_a, a)[0]
    
    # Find distance 'b' (Ship A to Lighthouse) using Sine Rule
    eq_b = Eq(b / sin(knowns[B]), knowns[c] / sin(knowns[C]))
    b_sol = solve(eq_b, b)[0]
    
    # Verify the findings satisfy the Cosine Rule for 'c'
    # c^2 = a^2 + b^2 - 2*a*b*cos(C) => a^2 + b^2 - 2*a*b*cos(C) - c^2 == 0
    diff = a_sol**2 + b_sol**2 - 2*a_sol*b_sol*cos(knowns[C]) - knowns[c]**2
    assert diff.simplify() == 0
