formal_definition: >-
  A rank-r smooth vector bundle over a smooth manifold M is a smooth map
  π:E→M whose fibers E_p=π^{-1}(p) are r-dimensional vector spaces and which
  is locally trivial: over each suitable open U⊂M there is a diffeomorphism
  φ:π^{-1}(U)→U×R^r that is linear on every fiber. Transition functions take
  values in GL(r) and satisfy cocycle compatibility. A section is a smooth map
  s:M→E with π∘s=id_M; the tangent bundle is a canonical example. A principal
  G-bundle P→M is locally trivial with fiber G and has a free right G-action
  that is transitive on each fiber. A representation of G produces associated
  vector bundles. A connection on a vector bundle is a covariant derivative
  on sections satisfying linearity and a Leibniz rule. A principal connection
  may be described by a G-equivariant horizontal distribution or by a
  Lie-algebra-valued connection one-form satisfying equivariance and vertical
  normalization. Its curvature measures the failure of horizontal transport
  to be locally path independent. A gauge transformation is a
  structure-preserving bundle automorphism covering the identity on M. For a
  principal G-bundle it is G-equivariant, and for a vector bundle it is
  fiberwise linear. It is not an arbitrary map between neural-network layers.
formal_definition_zh: >-
  光滑流形 M 上秩为 r 的光滑向量丛是光滑映射 π:E→M，其中纤维
  E_p=π^{-1}(p) 是 r 维向量空间，并且局部平凡：每个适当开集 U⊂M 上存在
  微分同胚 φ:π^{-1}(U)→U×R^r，且它在每条纤维上是线性的。转移函数取值于
  GL(r) 并满足余圈条件。截面是满足 π∘s=id_M 的光滑映射 s:M→E；切丛是
  典型例子。主 G-丛 P→M 局部平凡、纤维为 G，并带有在每条纤维上自由且传递
  的右 G-作用；G 的表示产生伴随向量丛。向量丛上的联络是作用于截面的协变导数，
  满足线性和 Leibniz 法则。主联络可由 G-等变水平分布描述，也可由满足等变性与
  垂直归一化的 Lie 代数值联络一形式描述；其曲率刻画水平运输局部路径无关性的
  失败。规范变换是覆盖 M 上恒等映射的结构保持丛自同构；在主 G-丛情形它必须
  G-等变，在向量丛情形它必须逐纤维线性，并非神经网络层之间的任意映射。
