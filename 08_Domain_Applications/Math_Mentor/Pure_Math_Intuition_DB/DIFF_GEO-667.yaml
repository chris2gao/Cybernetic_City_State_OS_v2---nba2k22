mapping_boundary:
  primary_mapping_kind: "llm_architecture_bounded_structural_analogy"
  primary_mapping: >-
    A bundle analogy is permitted only when a model defines a base space of
    states or positions, a family of feature spaces over that base, explicit
    local trivializations or basis choices, and transition transformations in
    a stated structure group. Under those assumptions, basis-dependent
    coordinates may change while an underlying fiber object remains
    invariant, giving a disciplined analogy for gauge freedom. Without those
    structures, a sequence of layers or feature vectors is ordinarily only a
    product-like collection, not a nontrivial bundle with connection.
  primary_mapping_zh: >-
    只有当模型明确给出状态或位置的基空间、其上逐点的一族特征空间、局部平凡化或
    基底选择，以及属于指定结构群的转移变换时，才能使用丛类比。在这些假设下，
    依赖基底的坐标可以改变，而底层纤维对象保持不变，从而形成受约束的规范自由度
    类比。若缺少这些结构，层序列或特征向量族通常只是乘积式集合，并不是带联络的
    非平凡丛。
  boundary:
    - "A stack of neural-network layers is not automatically a smooth base manifold."
    - "A feature vector at each token or layer often forms a trivial product bundle, not a nontrivial principal bundle."
    - "Ordinary learned linear maps are not automatically gauge transformations."
    - "Attention matrices and residual updates are not connection forms."
    - "A change of basis is gauge-like only when a symmetry group and invariant content are explicitly defined."
    - "Yang-Mills terminology must not be imported merely because a model has layers or transformations."
    - "A principal connection requires equivariance and vertical normalization, not merely a matrix-valued parameter."
    - "No nontrivial bundle topology, connection, curvature, or gauge symmetry of an ordinary model is established by this node."
  preserve_full_boundary: true
  existing_physical_metaphor_status: "secondary_teaser_only"
  secondary_teaser_limitation: >-
    The conveyor-and-robot-arm image only hints at a base coordinate paired
    with a fiber coordinate. It does not define local trivializations,
    transition cocycles, a principal action, connection, curvature, or gauge
    transformation.
