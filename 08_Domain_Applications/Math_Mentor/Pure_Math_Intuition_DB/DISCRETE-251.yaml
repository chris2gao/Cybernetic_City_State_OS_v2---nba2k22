code_implementation: |
  def is_partial_order(relation, elements):
      # Must be reflexive, antisymmetric, and transitive
      for x in elements:
          if (x, x) not in relation: return False
      for x, y in relation:
          if x != y and (y, x) in relation: return False
          for z in elements:
              if (y, z) in relation and (x, z) not in relation: return False
      return True
v8_sanity_audit:
  sympy_pseudo_code: |
    # Subset inclusion is a partial order
    # {} subset {1} subset {1, 2}
    subset_relations = {
        (frozenset(), frozenset()),
        (frozenset(), frozenset([1])),
        (frozenset([1]), frozenset([1])),
        (frozenset([1]), frozenset([1, 2])),
        (frozenset([1, 2]), frozenset([1, 2])),
        (frozenset(), frozenset([1, 2])) # transitive
    }
    assert (frozenset([1]), frozenset([1, 2])) in subset_relations
