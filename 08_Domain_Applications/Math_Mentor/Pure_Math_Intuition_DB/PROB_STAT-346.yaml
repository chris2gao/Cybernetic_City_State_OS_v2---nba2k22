v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy as sp
    # A = rolling 2, B = rolling even
    # P(A) = 1/6, P(B) = 3/6, P(A and B) = P(A) = 1/6
    prob_A_and_B = sp.Rational(1, 6)
    prob_B = sp.Rational(3, 6)
    prob_A_given_B = prob_A_and_B / prob_B
    assert prob_A_given_B == sp.Rational(1, 3)
