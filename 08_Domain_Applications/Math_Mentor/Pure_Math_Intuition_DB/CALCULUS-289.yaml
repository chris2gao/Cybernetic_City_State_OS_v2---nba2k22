llm_physical_mapping: "mundane physical metaphor: stretching a rubber sheet with a grid drawn on it; the Jacobian is the local stretch factor that tells you how much bigger or smaller a specific grid square has become."
code_implementation: |
  import sympy as sp
  
  r, theta = sp.symbols('r theta')
  # Polar to Cartesian coordinates
  x = r * sp.cos(theta)
  y = r * sp.sin(theta)
  
  # Jacobian Matrix J
  J = sp.Matrix([
      [sp.diff(x, r), sp.diff(x, theta)],
      [sp.diff(y, r), sp.diff(y, theta)]
  ])
  
  # Jacobian Determinant
  det_J = sp.trigsimp(J.det())
v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy as sp
    
    r, theta, phi = sp.symbols('r theta phi')
    
    # Spherical to Cartesian coordinates
    x = r * sp.sin(phi) * sp.cos(theta)
    y = r * sp.sin(phi) * sp.sin(theta)
    z = r * sp.cos(phi)
    
    J = sp.Matrix([
        [sp.diff(x, r), sp.diff(x, theta), sp.diff(x, phi)],
        [sp.diff(y, r), sp.diff(y, theta), sp.diff(y, phi)],
        [sp.diff(z, r), sp.diff(z, theta), sp.diff(z, phi)]
    ])
    
    det_J = sp.simplify(sp.trigsimp(J.det()))
    # The absolute value is r^2 sin(phi), but determinant might be negative depending on column order
    # Here, our order gives r^2 sin(phi) or -r^2 sin(phi). Let's check magnitude.
    assert sp.simplify(abs(det_J) - abs(r**2 * sp.sin(phi))) == 0
