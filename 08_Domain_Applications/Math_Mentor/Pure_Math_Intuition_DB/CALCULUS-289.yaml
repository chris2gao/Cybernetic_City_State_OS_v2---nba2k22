concept_name: "曲线/曲面积分 - 雅可比行列式 (Jacobian) 在坐标变换中的体积形变补偿系数 (n_289)"
sub_topics:
  - "局部线性变换的面积/体积缩放比"
  - "雅可比矩阵的行列式定义"
  - "坐标变换公式中的补偿项引入证明"
