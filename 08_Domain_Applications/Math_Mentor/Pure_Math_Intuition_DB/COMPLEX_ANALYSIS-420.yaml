v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy as sp
    x, y = sp.symbols('x y', real=True)
    z = x + sp.I * y
    f = z**2
    # Wirtinger derivative df/dz_bar = 1/2 * (df/dx + i*df/dy)
    df_dzbar = 0.5 * (sp.diff(f, x) + sp.I * sp.diff(f, y))
    assert sp.simplify(df_dzbar) == 0
