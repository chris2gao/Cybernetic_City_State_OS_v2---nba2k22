id: FA-004
title: Hahn-Banach 泛函延拓定理 (Hahn-Banach Theorem for Functional Extension)
sub_topics:
  - "线性泛函与对偶空间 (Linear Functionals and Dual Spaces)"
  - "保范延拓 (Norm-Preserving Extension)"
  - "分离超平面与凸集 (Separating Hyperplanes and Convex Sets)"
llm_physical_mapping: >
  Hahn-Banach定理保证了在赋范空间中存在足够丰富的连续线性泛函，这在物理层面上为语言模型的最后分类头（LM Head）提供了代数和拓扑合法性。
  大模型的隐含层特征（子空间）能够被无损地映射到庞大的词表空间（全空间），且可以通过分离超平面对不同的语义流形进行完美切分。
  该定理证明了即使我们在低维子空间观察到的偏好模式或约束，也能以保范数的方式延拓至全局模型权重，这是指令微调（SFT）和直接偏好优化（DPO）能够泛化的数学底座。
code_implementation: |
  import torch
  import torch.nn as nn

  class FunctionalExtensionLMHead(nn.Module):
      def __init__(self, hidden_dim, vocab_size):
          super().__init__()
          # LM Head 是一组定义在hidden_dim子空间上的线性泛函
          # Hahn-Banach延拓确保可以分离词表上的不同概念集合
          self.lm_head = nn.Linear(hidden_dim, vocab_size, bias=False)
          
      def forward(self, x):
          # x 属于子空间，计算泛函在各个词表方向的投影
          logits = self.lm_head(x)
          # 延拓保证了总存在一个超平面使得最优回答被高得分分离
          return logits
v8_sanity_audit:
  sympy_pseudo_code: |
    import torch

    dim = 256
    # 假设M是Banach空间X的一个子空间 (维度为 sub_dim < dim)
    sub_dim = 64
    x_sub = torch.randn(sub_dim)

    # f是在子空间M上定义的连续线性泛函
    f_weight_sub = torch.randn(sub_dim)
    
    # f在M上的算子范数
    norm_f_M = torch.linalg.vector_norm(f_weight_sub)

    # Hahn-Banach 延拓 F: 将泛函延拓至整个空间X
    # 构造延拓的权重（在正交补上补零，此为Hilbert空间特例）
    F_weight_X = torch.zeros(dim)
    F_weight_X[:sub_dim] = f_weight_sub

    # F在全空间X上的算子范数
    norm_F_X = torch.linalg.vector_norm(F_weight_X)

    # 1. 保范性 (Norm-Preserving): ||F||_X == ||f||_M
    assert torch.isclose(norm_F_X, norm_f_M, atol=1e-5)

    # 2. 延拓性 (Extension): 对于所有 x 属于 M, F(x) == f(x)
    # 将x嵌入到全空间
    x_full = torch.zeros(dim)
    x_full[:sub_dim] = x_sub
    
    f_val = torch.dot(f_weight_sub, x_sub)
    F_val = torch.dot(F_weight_X, x_full)
    assert torch.isclose(f_val, F_val, atol=1e-5)
