name: Feynman-Kac公式 - 认知大统一：证明求解宏观偏微分方程（PDE）等价于计算无数条微观随机 SDE 粒子路径的期望总和。 (n_572)
domain: STOCHASTIC
sub_topics:
  - 抛物型 PDE 的随机表示
  - 终值问题与路径期望的关联
  - 势能项在 Feynman-Kac 路径积分中的体现
  - 物理直觉：宏观扩散是无数随机漫步者的统计结果
llm_physical_mapping:
  metaphor: A block of ice melting in a room. The deterministic heat equation dictating
    the melting rate at a point (PDE) perfectly mirrors the statistical aggregate
    of millions of imaginary micro-particles randomly diffusing from that point and
    recording the boundary temperature they hit (SDE).
code_implementation:
  pytorch_simulation: 'import torch


    # Estimating u(t, x) for Heat Equation u_t = 0.5 * u_xx with u(0, x) = f(x)

    x0 = 0.0

    t_end = 1.0

    dt = 0.01

    N_paths = 10000

    steps = int(t_end / dt)


    # Microscopic particle paths (SDE)

    dW = torch.randn(N_paths, steps) * torch.sqrt(torch.tensor(dt))

    W_end = x0 + torch.sum(dW, dim=1)


    # Payoff function f(x) = x^2

    f_x = W_end**2

    # PDE solution via expected value of SDE paths

    u_approx = torch.mean(f_x)


    # Theoretical value is x0^2 + t_end

    u_exact = x0**2 + t_end

    error = torch.abs(u_approx - u_exact)

    '
v8_sanity_audit:
  sympy_pseudo_code: 'import sympy as sp


    x, t, mu, sigma = sp.symbols(''x t mu sigma'', real=True)

    u = sp.Function(''u'')(x, t)


    # Generator of the diffusion process (Kolmogorov backward operator)

    L_u = mu * sp.diff(u, x) + sp.Rational(1, 2) * sigma**2 * sp.diff(u, x, 2)


    # Feynman-Kac states that u_t + L_u - V*u = 0 (for a potential V)

    V = sp.symbols(''V'')

    fk_pde = sp.diff(u, t) + L_u - V * u


    # If mu=0, sigma=sqrt(2), V=0, this is the reverse heat equation u_t + u_xx =
    0

    fk_heat = fk_pde.subs({mu: 0, sigma: sp.sqrt(2), V: 0})

    assert sp.simplify(fk_heat - (sp.diff(u, t) + sp.diff(u, x, 2))) == 0

    '
