pure_math_definition:
  english: |-
    For real x>=0, define the prime-counting function
    π(x)=#{p prime : p<=x}. The prime number theorem states
    π(x)~x/log x as x tends to infinity, meaning
    lim_{x->infinity} π(x)log(x)/x=1. For x>=2, define
    Li(x)=integral from 2 to x of dt/log(t). The theorem also gives
    π(x)~Li(x). These are asymptotic statements, not exact formulas at
    finite x and not probability assignments to individual integers.

    With θ(x)=sum_{p<=x} log p and the von Mangoldt function
    Λ(n)=log p when n=p^k for a prime p and integer k>=1, and Λ(n)=0
    otherwise, define ψ(x)=sum_{n<=x}Λ(n)=sum_{p^k<=x}log p. The
    standard statements θ(x)~x and ψ(x)~x are equivalent classical
    formulations of PNT. Ordinary PNT does not assume the Riemann
    hypothesis. RH would provide substantially stronger error control, but
    ordinary PNT and RH must not be presented as equivalent.
  chinese: |-
    对实数 x>=0，定义素数计数函数 π(x)=不超过 x 的素数个数。素数定理断言
    当 x 趋于无穷时 π(x)~x/log x，即
    lim_{x->infinity} π(x)log(x)/x=1。对 x>=2，定义
    Li(x)=从 2 到 x 的 dt/log(t) 积分，则定理也给出 π(x)~Li(x)。
    这些是渐近关系，不是有限 x 上的精确公式，也不是对单个整数成为素数的
    概率赋值。

    定义 θ(x)=sum_{p<=x}log p；再定义 von Mangoldt 函数：当
    n=p^k（p 为素数且 k>=1）时 Λ(n)=log p，否则 Λ(n)=0，并令
    ψ(x)=sum_{n<=x}Λ(n)=sum_{p^k<=x}log p。θ(x)~x 与 ψ(x)~x 是
    素数定理的经典等价表述。普通素数定理不以黎曼猜想为假设；黎曼猜想会
    给出更强的误差控制，但不能把普通素数定理表述成与 RH 等价。
  finite_equality_boundary: |-
    The symbol ~ is defined by a limit of a ratio. It does not assert
    π(x)=x/log x or π(x)=Li(x) at any declared finite input.

assumptions_and_notation:
  - "EN: p ranges over positive primes and x is a nonnegative real number. / 中文：p 表示正素数，x 为非负实数。"
  - "EN: A prime is an integer greater than one with exactly two positive divisors. / 中文：素数是大于 1 且恰有两个正约数的整数。"
  - "EN: log is the natural logarithm; the theorem concerns x tending to infinity. / 中文：log 表示自然对数，定理讨论 x 趋于无穷。"
  - "EN: f(x)~g(x) means f(x)/g(x) tends to one where the ratio is eventually defined. / 中文：f(x)~g(x) 表示在比值最终有定义时 f(x)/g(x) 趋于 1。"
  - "EN: Li(x) uses the Human-approved lower limit 2 and is defined here only for x>=2. / 中文：Li(x) 使用已批准的下限 2，并在本节点中只对 x>=2 定义。"
  - "EN: The theorem has no RH assumption. / 中文：该定理不包含 RH 假设。"

