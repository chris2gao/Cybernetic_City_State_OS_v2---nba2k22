code_implementation: |
  import math

  def prime_count_prefix(limit):
      is_prime = [True] * (limit + 1)
      if limit >= 0:
          is_prime[0] = False
      if limit >= 1:
          is_prime[1] = False
      for p in range(2, math.isqrt(limit) + 1):
          if is_prime[p]:
              for multiple in range(p * p, limit + 1, p):
                  is_prime[multiple] = False
      prefix = []
      count = 0
      for flag in is_prime:
          count += int(flag)
          prefix.append(count)
      return prefix

  def prime_count_at(prefix, x):
      return prefix[math.floor(x)]

