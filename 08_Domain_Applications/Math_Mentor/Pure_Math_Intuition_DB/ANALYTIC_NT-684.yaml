    - "prime_number_theorem_limit"
    - "analytic_proof"
    - "zero_free_region"
    - "Riemann_hypothesis"
    - "global_error_term"
    - "prime_gap_distribution"
    - "monotone_error_decay"
  sympy_pseudo_code: |
    import math

    def prime_counts(limit):
        sieve = [True] * (limit + 1)
        sieve[0:2] = [False, False]
        for p in range(2, math.isqrt(limit) + 1):
            if sieve[p]:
                sieve[p*p:limit+1:p] = [False] * (((limit-p*p)//p)+1)
        out = []
        running = 0
        for flag in sieve:
            running += int(flag)
            out.append(running)
        return out

    pi = prime_counts(10000)
    assert (pi[10], pi[100], pi[1000], pi[10000]) == (4, 25, 168, 1229)

