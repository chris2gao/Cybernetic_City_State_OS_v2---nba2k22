mode_a_intuition:
  occurrence_crisis:
    english: |-
      Prime gaps look irregular locally, so a few nearby integers do not
      reveal a stable density. The question is whether cumulative counting
      nevertheless has a reliable large-scale law.
    chinese: |-
      素数间隔在局部很不规则，少量相邻整数看不出稳定密度；真正的问题是累计
      计数在大尺度上是否仍有可靠规律。
  primary:
    english: |-
      Imagine a production stream whose local gaps vary sharply while its
      cumulative output rate approaches a stable macroscopic law. This
      supports the distinction between local irregularity and asymptotic
      density.
    chinese: |-
      想象一条生产流：局部产出间隔变化剧烈，但累计产出率逐步接近稳定的宏观
      规律。这个图像帮助区分局部不规则与渐近密度。
  low_friction_example:
    english: |-
      At x=100 there are exactly 25 primes, whereas 100/log(100) is about
      21.7147. The mismatch is expected because PNT is a limit statement,
      not a finite equality.
    chinese: |-
      x=100 时恰有 25 个素数，而 100/log(100) 约为 21.7147。二者不等并不
      反驳定理，因为 PNT 是极限陈述而非有限等式。
  limitations:
    - "EN: The stream is an analogy, not a stochastic model of primes. / 中文：生产流只是类比，不是素数的随机模型。"
    - "EN: A stable cumulative rate does not determine each local gap. / 中文：稳定的累计速率不决定每个局部间隔。"
    - "EN: No LLM token process is established as a prime-counting process. / 中文：本节点没有把任何 LLM token 过程建立为素数计数过程。"

mapping_boundary:
  status: "human_approved"
  valid_uses:
    - "EN: contrasting local irregularity with cumulative asymptotic density / 中文：对比局部不规则与累计渐近密度"
    - "EN: distinguishing a finite count from a large-scale main term / 中文：区分有限计数与大尺度主项"
    - "EN: motivating why a ratio limit is needed / 中文：说明为何需要比值极限"
  invalid_inferences:
    - "EN: Primes are deterministic, not literally random. / 中文：素数是确定性对象，不是字面意义上的随机事件。"
    - "EN: x/log x is not an exact finite prime count. / 中文：x/log x 不是有限范围内的精确素数计数。"
    - "EN: The density heuristic 1/log x does not make primality events independent. / 中文：密度启发 1/log x 不会使素性事件彼此独立。"
    - "EN: A finite numerical table cannot prove a limit as x tends to infinity. / 中文：有限数表不能证明 x 趋于无穷时的极限。"
    - "EN: Better agreement at selected samples does not establish monotone error decay. / 中文：若干样本更接近不能证明误差单调下降。"
    - "EN: PNT alone does not determine every prime gap. / 中文：PNT 本身不决定每一个素数间隔。"
    - "EN: RH-related error estimates require separate hypotheses and are not equivalent to ordinary PNT. / 中文：RH 误差估计需要单独假设，不能与普通 PNT 等同。"
    - "EN: A production stream or LLM token distribution is not established as a prime-counting process. / 中文：生产流或 LLM token 分布并未被建立为素数计数过程。"

common_misconceptions:
  - "EN: The symbol ~ means exact or uniformly close finite equality. / 中文：误以为 ~ 表示有限点上的精确等式或一致接近。"
  - "EN: A mismatch at x=100 refutes PNT. / 中文：误以为 x=100 时不相等就反驳 PNT。"
  - "EN: Each integer is independently prime with probability 1/log x. / 中文：误以为每个整数以 1/log x 的独立概率成为素数。"
  - "EN: Four exact prime counts prove the infinite theorem. / 中文：误以为四个精确计数就证明了无穷定理。"
  - "EN: A successful sieve run proves an analytic theorem or zero-free region. / 中文：误以为筛法运行通过就证明了解析定理或零点自由区域。"
  - "EN: Ordinary PNT and the Riemann hypothesis are equivalent. / 中文：误以为普通 PNT 与黎曼猜想等价。"
  - "EN: Macroscopic density determines all local prime gaps. / 中文：误以为宏观密度决定所有局部素数间隔。"
  - "EN: Finite approximation error must decrease monotonically. / 中文：误以为有限近似误差必须单调下降。"

