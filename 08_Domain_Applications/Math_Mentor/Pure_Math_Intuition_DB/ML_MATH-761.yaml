    import sympy as sp
    p1, p2 = sp.symbols('p1 p2')
    loss = sp.log(p1**2 + p2**2)
    grad_p1 = sp.diff(loss, p1)
    grad_p2 = sp.diff(loss, p2)
    assert sp.simplify(grad_p1 - 2*p1/(p1**2 + p2**2)) == 0
