v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy as sp
    x, y = sp.symbols('x y')
    X = sp.Matrix([x, y])
    A = sp.Matrix([[2, 1], [1, 3]])
    expr = (X.T * A * X)[0]
    expanded_expr = sp.expand(expr)
    expected_expr = 2*x**2 + 2*x*y + 3*y**2
    assert sp.simplify(expanded_expr - expected_expr) == 0
