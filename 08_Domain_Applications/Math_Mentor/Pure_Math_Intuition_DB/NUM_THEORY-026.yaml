title: "Order of an Integer Modulo m"
chinese_name: "原根与离散对数初步 - 阶 (Order) 的概念：满足 a^k ≡ 1 (mod m) 的最小正整数 k"
description: "In number theory, the multiplicative order of an integer a modulo m is the smallest positive integer k such that a^k ≡ 1 (mod m). It dictates the cycle length of the sequence of powers of a."
sub_topics:
  - "幂序列的周期性特征"
  - "阶的定义与基本性质"
  - "阶对欧拉函数 φ(m) 的整除性"
  - "寻找最小幂次的算法思维"
llm_physical_mapping: "mundane physical metaphor: the number of turns a wheel needs before it clicks back into its exact starting position."
code_implementation: |
  import torch

  def multiplicative_order(a: int, m: int) -> int:
      a_t = torch.tensor(a, dtype=torch.int64)
      m_t = torch.tensor(m, dtype=torch.int64)
      
      val = a_t % m_t
      k = 1
      
      # Will loop infinitely if gcd(a, m) != 1 unless bounded
      while val.item() != 1 and k <= m:
          val = (val * a_t) % m_t
          k += 1
          
      return k if val.item() == 1 else -1
