id: "ZFC-002"
title: "ZFC Axiom 2 - Regularity (Foundation)"
sub_topics: 
  - "Well-founded Sets"
  - "No Infinite Descending Chains"
  - "Acyclic Structures"
llm_physical_mapping: |
  Maps to Causal Masking in Auto-regressive generation and the DAG (Directed Acyclic Graph) structure of the computational graph. Causal masking ensures that token t can only attend to tokens < t, preventing infinite recursive loops of attention and enforcing a strict, well-founded temporal hierarchy in the generative flow.
code_implementation: |
  def forward_zfc_regularity(seq_len: int) -> torch.Tensor:
      # Generate a causal mask that prevents a set from containing itself
      # (a token attending to future or self cyclically)
      mask = torch.tril(torch.ones(seq_len, seq_len))
      mask = mask.masked_fill(mask == 0, float('-inf'))
      # The diagonal is usually kept for self-attention, but strictly speaking,
      # strict foundation implies no self-containment, thus masking diagonal too:
      mask = mask.fill_diagonal_(float('-inf'))
      return mask
v8_sanity_audit:
  sympy_pseudo_code: |
    import torch
    
    def test_causal_foundation():
        seq_len = 4
        mask = torch.tril(torch.ones(seq_len, seq_len))
        # Ensure that information strictly flows from past to future
        # No cycle exists: token i only depends on j where j <= i
        assert mask[0, 1].item() == 0.0
        assert mask[3, 0].item() == 1.0
