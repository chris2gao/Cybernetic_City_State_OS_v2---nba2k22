concept_name: "级数与收敛 - 数项级数的收敛与发散判别法（比值法、根值法、莱布尼茨判别法） (n_277)"
sub_topics:
  - "级数收敛的必要条件（通项趋于零）"
  - "正项级数的比较判别法与比值判别法"
  - "根值判别法（柯西判别法）"
  - "交错级数的莱布尼茨判别准则"
llm_physical_mapping: "Checking if a leaky bucket will eventually empty out completely by observing if the dripping rate decreases fast enough, or just stays steady forever."
code_implementation: |
  import sympy as sp
  n = sp.Symbol('n', integer=True, positive=True)
  a_n = 1 / sp.factorial(n)
  # Ratio test: limit of a_{n+1}/a_n as n -> oo
  a_n_plus_1 = a_n.subs(n, n + 1)
  ratio = sp.limit(a_n_plus_1 / a_n, n, sp.oo)
v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy as sp
    n = sp.Symbol('n', integer=True, positive=True)
    a_n = 1 / sp.factorial(n)
    a_n_plus_1 = 1 / sp.factorial(n + 1)
    ratio = sp.limit(a_n_plus_1 / a_n, n, sp.oo)
    # Ratio < 1 means the series converges
    assert ratio == 0
