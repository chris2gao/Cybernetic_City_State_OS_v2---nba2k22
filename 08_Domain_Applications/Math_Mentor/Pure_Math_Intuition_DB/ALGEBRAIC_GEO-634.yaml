llm_physical_mapping: "mundane physical metaphor: Instead of measuring distance with a tape measure, the factory floor is painted entirely black except for precise grooves carved by heavy milling machines. You are either perfectly inside the groove or entirely outside it. There is no close-enough rubber padding; it is absolutely rigid metal."
code_implementation: |
  import numpy as np
  
  def zariski_closed_set_checker(points, coeffs):
      results = np.polyval(coeffs, points)
      is_closed = np.isclose(results, 0.0, atol=1e-7)
      return is_closed
      
  pts = np.array([1.0, 2.0, 1.0001])
  roots_mask = zariski_closed_set_checker(pts, [2, -3, 1])
legacy_v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy as sp
    x = sp.Symbol('x')
    poly = (x - 1)*(x - 3)
    roots = sp.solve(poly, x)
    assert 1 in roots
    assert 3 in roots
    assert 2 not in roots
