llm_physical_mapping: "mundane physical metaphor: Like a CNC router bit moving along a complex 2D vector path on a wooden board. As the tool bit moves along x(t) and y(t), it continuously accumulates sawdust (integral) depending on the density of the wood at each point."
code_implementation: |
  import sympy as sp
  t = sp.symbols('t', real=True)
  z = t + sp.I * t**2
  dz = sp.diff(z, t)
  f = z**2
  integrand = f * dz
v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy as sp
    t = sp.symbols('t', real=True)
    z = t + sp.I * t**2
    f_z = z**2
    dz_dt = sp.diff(z, t)
    val_path = sp.integrate(f_z * dz_dt, (t, 0, 1))
    val_direct = ((1 + sp.I)**3) / 3
    assert sp.simplify(val_path - val_direct) == 0
