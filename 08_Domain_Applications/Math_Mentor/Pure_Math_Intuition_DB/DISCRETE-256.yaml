id: "DISCRETE-256"
concept_name: "算法复杂度基础（大O表示法） - 常见复杂度类的物理压迫感比对：O(1) < O(log n) < O(n) < O(n log n) < O(n²) < O(2^n) (n_256)"
sub_topics:
  - "指数爆炸与 P=NP 问题的物理直觉"
  - "对数增长在搜索中的高效性"
  - "算力提升对不同复杂度算法的增益差异"
  - "多项式时间作为“可计算”的分界线"
llm_physical_mapping: "mundane physical metaphor: Packing boxes. O(1) is always grabbing one box. O(log n) is slicing the pile in half continuously. O(n) is carrying each box one by one. O(n^2) is pairing every box with every other box. O(2^n) is trying every possible grouping of boxes until the warehouse explodes."
code_implementation: |
  import math

  def complexity_classes(n):
      classes = {
          "O(1)": 1,
          "O(log n)": math.log2(n) if n > 0 else 0,
          "O(n)": n,
          "O(n log n)": n * math.log2(n) if n > 0 else 0,
          "O(n^2)": n ** 2,
          "O(2^n)": 2 ** n if n < 20 else "Overflow" # Prevent freezing
      }
      return classes

  for n in [10, 20]:
      print(f"For n={n}:")
      for c_name, val in complexity_classes(n).items():
          print(f"  {c_name}: {val}")
v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy
    from sympy.abc import n
    
    # Verifying the asymptotic order: O(n) < O(n log n)
    lim1 = sympy.limit(n / (n * sympy.log(n)), n, sympy.oo)
    assert lim1 == 0
    
    # Verifying O(n^2) < O(2^n)
    lim2 = sympy.limit((n**2) / (2**n), n, sympy.oo)
    assert lim2 == 0
