concept_node:
  id: "GEOMETRY-008"
  topic: "三角形（全等/相似） - 相似三角形 (Similarity) 的判定（AA, SAS, SSS）与 Thales 定理 (n_128)"
  sub_topics:
    - "形状相同但大小不同的严格数学定义"
    - "相似判定的三大定理(AA, SAS, SSS)"
    - "截线定理 (Thales Theorem) 与平行截割"
    - "相似在测量不可达距离中的应用"
  llm_physical_mapping: "A mundane physical metaphor for similarity is shadows cast by a flashlight against a wall, or zooming in and out with a camera lens. The overall shape, angles, and proportions remain perfectly preserved, while the absolute scale changes."
  code_implementation: >
    # PyTorch scaling a coordinate tensor
    import torch

    def apply_similarity_transform(points: torch.Tensor, scale_factor: float) -> torch.Tensor:
        """
        Scales a set of 2D or 3D points by a uniform factor, representing a similarity transformation
        (scaling centered at the origin, preserving all angles and relative distance ratios).
        """
        return points * scale_factor

    # Triangle ABC coordinates
    triangle = torch.tensor([[0.0, 0.0], [4.0, 0.0], [0.0, 3.0]])
    # Triangle A'B'C' scaled by 2.0 (SAS ratio)
    similar_triangle = apply_similarity_transform(triangle, 2.0)
  v8_sanity_audit:
    sympy_pseudo_code: |
      from sympy.geometry import Point, Triangle
      
      t1 = Triangle(Point(0, 0), Point(4, 0), Point(0, 3))
      t2 = Triangle(Point(0, 0), Point(8, 0), Point(0, 6))
      
      # Validate similarity
      assert t1.is_similar(t2) == True
