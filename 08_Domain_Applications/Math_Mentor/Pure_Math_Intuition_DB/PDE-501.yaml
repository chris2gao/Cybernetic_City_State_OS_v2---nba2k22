llm_physical_mapping: Ink drops diffusing in a flowing river, where the river's current provides drift and thermal agitation provides random diffusion.
code_implementation: |
  import torch

  # Fokker-Planck: Ink drops diffusing in a flowing river
  # P is the concentration of ink
  N = 100
  P = torch.zeros(N)
  P[N//2] = 1.0 # Drop of ink at center
  dx = 0.1
  dt = 0.001
  D = 0.5   # Thermal diffusion
  mu = 0.1  # River drift

  for _ in range(500):
      P_pad = torch.nn.functional.pad(P, (1, 1), mode='replicate')
      dP_dx = (P_pad[2:] - P_pad[:-2]) / (2 * dx)
      d2P_dx2 = (P_pad[2:] - 2 * P_pad[1:-1] + P_pad[:-2]) / (dx**2)
      # P_t = -mu * P_x + D * P_xx
      P_new = P + dt * (-mu * dP_dx + D * d2P_dx2)
      P = torch.clamp(P_new, min=0.0)
      P = P / P.sum() # Conservation of ink mass
v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy as sp
    x, t = sp.symbols('x t', real=True, positive=True)
    D = sp.Symbol('D', real=True, positive=True)
    P = 1/sp.sqrt(4*sp.pi*D*t) * sp.exp(-x**2 / (4*D*t))
    dP_dt = sp.diff(P, t)
    d2P_dx2 = sp.diff(P, x, 2)
    FP_eq = dP_dt - D * d2P_dx2
    assert sp.simplify(FP_eq) == 0, "Fokker-Planck equation fails for Gaussian diffusion"
