concept_name: "Propositional Algebra Laws / 命题代数定律"
canonical_concept: "boolean_algebra_laws_for_propositions"
domain: "Mathematical Logic / Propositional Calculus"
symbol: "¬(P∧Q)≡¬P∨¬Q"

sub_topics:
  - "De Morgan's laws / 德·摩根定律"
  - "Commutative, associative, and distributive laws / 交换律、结合律与分配律"
  - "Absorption and idempotent laws / 吸收律与等幂律"
  - "Complement, identity, and domination laws / 互补律、零一律与支配律"
  - "A Boolean-algebra axiom skeleton and derived equivalences / 布尔代数公理骨架与派生等价式"

pure_math_definition:
  english: |-
    Under classical two-valued semantics, formulas are identified up to logical
    equivalence and the operations ∧, ∨, ¬ together with constants 0=False and
    1=True form a Boolean algebra. The laws include commutativity and
    associativity of ∧ and ∨; both distributive laws; identities P∧1≡P and
    P∨0≡P; complements P∧¬P≡0 and P∨¬P≡1; and De Morgan's laws
    ¬(P∧Q)≡¬P∨¬Q and ¬(P∨Q)≡¬P∧¬Q. Absorption, idempotence, and domination are
    standard valid consequences within this algebra.

    One axiom skeleton is a bounded distributive lattice with 0 and 1 in which
    every element P has a complement ¬P. Boolean algebra is sound and complete
    for classical propositional equivalence: equations derivable from its laws
    are truth-functionally valid, and truth-functionally valid equations are
    derivable in Boolean algebra. The executable audit below checks only listed
    identities over three variables; it is not a machine proof of that general
    completeness statement.
  chinese: |-
    在经典二值语义下，把逻辑等价的公式视为同一元素，则 ∧、∨、¬ 与常量 0=假、
    1=真构成布尔代数。其定律包括 ∧、∨ 的交换律与结合律、两条分配律、单位律
    P∧1≡P 与 P∨0≡P、互补律 P∧¬P≡0 与 P∨¬P≡1，以及德·摩根定律
    ¬(P∧Q)≡¬P∨¬Q、¬(P∨Q)≡¬P∧¬Q。吸收律、等幂律和支配律也是该代数中的
    标准有效结论。

    一种公理骨架是：带 0、1 的有界分配格，且每个元素 P 都有补元 ¬P。布尔
    代数对经典命题等价是可靠且完备的：由这些规律推出的等式在真值语义下有效，
    反之亦然。下方机器审计只检查三变量上的列举恒等式，并不机器证明一般完备性。

assumptions_and_notation:
  - "All equations use logical equivalence, not syntactic equality. / 所有等式表示逻辑等价，而非语法字符串相等。"
  - "0 and 1 denote contradiction and tautology truth functions. / 0、1 表示恒假与恒真真值函数。"
  - "The completeness statement concerns propositional equivalence, not first-order proof-system completeness. / 此处完备性针对命题等价，不是谓词逻辑证明系统完备性。"

