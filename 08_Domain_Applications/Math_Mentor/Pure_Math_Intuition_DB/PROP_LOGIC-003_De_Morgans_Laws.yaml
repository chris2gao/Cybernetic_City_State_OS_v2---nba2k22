mode_a_intuition:
  occurrence_crisis:
    english: "Long formulas can obscure that different symbol arrangements compute exactly the same truth function."
    chinese: "长公式会掩盖不同符号排列其实计算同一个真值函数。"
  primary:
    english: |-
      Think of each law as a reversible simplification rule on a two-valued
      control expression. Reversibility means the input-output behavior is
      unchanged for every setting, not merely that the rewritten expression
      looks simpler.
    chinese: |-
      把每条定律看作二值控制表达式上的可逆化简规则；“可逆”意味着所有输入设置下
      输出行为不变，而不只是改写后的式子看起来更简单。
  low_friction_example:
    english: "'Not both P and Q' rewrites to 'not P or not Q'; the OR is inclusive."
    chinese: "‘并非 P、Q 都真’可改写为‘P 不真或 Q 不真’，其中‘或’仍是相容或。"
  limitations:
    - "A rewrite-rule analogy does not prove termination or uniqueness of arbitrary simplification procedures. / 改写规则类比不证明任意化简程序终止或结果唯一。"
    - "A valid equivalence does not preserve sentence length or human readability. / 有效等价改写不保证长度或可读性不变。"

