v8_sanity_audit:
  status: "run_with_log"
  execution_claim: "bounded_finite_audit_only"
  language: "sympy"
  script_ref: ".ai/PROGRAM_RUNS/kcp-batch-1-prop-logic-certification-0001/AUDITS/run_prop_logic_audit.py"
  tested_properties: ["eighteen named Boolean identities", "all eight assignments of three variables", "144 identity-assignment comparisons"]
  explicitly_not_validated: ["general_boolean_algebra_completeness", "rewrite_termination", "pedagogy", "learner_mastery"]
  sympy_pseudo_code: |
    import itertools
    import sympy as sp
    from sympy.logic.boolalg import And, Not, Or
    P, Q = sp.symbols("P Q")
    for p, q in itertools.product((False, True), repeat=2):
        values = {P: p, Q: q}
        assert bool(Not(And(P, Q)).subs(values)) == bool(Or(Not(P), Not(Q)).subs(values))
        assert bool(Not(Or(P, Q)).subs(values)) == bool(And(Not(P), Not(Q)).subs(values))

