common_misconceptions:
  - "De Morgan negation changes literals but leaves ∧ or ∨ unchanged. / 误以为德·摩根否定只改文字而不交换 ∧、∨。"
  - "Distributivity works in only one direction or for only one connective. / 误以为分配律只能单向使用或只适用于一个联结词。"
  - "P∨¬P≡1 says P itself is true. / 误以为 P∨¬P≡1 说明 P 为真。"
  - "A finite audit proves the general axiom-system completeness theorem. / 误以为有限审计证明一般公理系统完备性。"

