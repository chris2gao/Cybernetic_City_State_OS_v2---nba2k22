v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy as sp
    m, n, theta = sp.symbols('m n theta', real=True)
    rot_m = sp.exp(sp.I * m * theta)
    rot_n = sp.exp(sp.I * n * theta)
    relative = rot_m * sp.conjugate(rot_n)
    assert sp.simplify(relative - sp.exp(sp.I * (m - n) * theta)) == 0
