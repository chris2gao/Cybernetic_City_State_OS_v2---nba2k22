mode_a_intuition:
  occurrence_crisis: |-
    A list of unit-length complex terms can produce either a large resultant
    or almost no resultant, even though every individual term has magnitude
    one. The missing information is their relative phase.
  primary: |-
    Picture each term a_n e(f(n)) as an arrow in the complex plane. Adding the
    arrows head-to-tail shows reinforcement when directions align and
    cancellation when they wrap around the circle. This picture explains the
    finite vector sum itself.
  low_friction_example: |-
    The four terms with phases 0, 1/4, 1/2, and 3/4 point east, north, west,
    and south, so their complete sum is zero.
  limitations:
    - "The arrow picture does not guarantee cancellation for an arbitrary phase."
    - "It does not prove a Van der Corput or Weyl estimate."
    - "It does not turn one small sum into a randomness or equidistribution certificate."

