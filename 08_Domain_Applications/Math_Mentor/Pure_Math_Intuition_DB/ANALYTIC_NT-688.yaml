pure_math_definition:
  english: |-
    Fix e(t)=exp(2*pi*i*t). This function is 1-periodic, so it depends only
    on the class of t modulo one. Let I be a finite subset of the integers,
    let a_n be complex weights, and let f:I->R be a real-valued phase
    considered modulo one. A finite exponential sum is

        S = sum_{n in I} a_n e(f(n)).

    The unweighted case has a_n=1. The triangle inequality always gives the
    universal trivial bound |S|<=sum_{n in I}|a_n|. Cancellation means that
    phase structure makes the vector sum smaller than this bound; it is not
    automatic.

    For an integer N>=1 and a real alpha not in Z,

        sum_{n=0}^{N-1} e(n alpha) = (1-e(N alpha))/(1-e(alpha)).

    If alpha is integral, the sum is N. If alpha=k/N for an integer k and
    N does not divide k, the complete N-term sum is zero. Van der Corput and
    Weyl methods are families of estimates that require theorem-specific
    differentiability, spacing, differencing, or polynomial hypotheses; they
    are not unconditional cancellation laws.
  chinese: |-
    固定记号 e(t)=exp(2*pi*i*t)。因为 e(t+1)=e(t)，它只依赖于 t 模 1
    的等价类。设 I 是有限整数指标集，a_n 是复权重，f:I->R 是按模 1
    考察的实相位，则有限指数和定义为

        S = sum_{n in I} a_n e(f(n))。

    无权情形取 a_n=1。三角不等式始终给出平凡界
    |S|<=sum_{n in I}|a_n|。所谓相消，是相位结构使复向量和小于该平凡界；
    相消不会自动发生。

    若整数 N>=1 且实数 alpha 不属于 Z，则

        sum_{n=0}^{N-1} e(n alpha) = (1-e(N alpha))/(1-e(alpha))。

    当 alpha 为整数时，该和等于 N。当 alpha=k/N、k 为整数且 N 不整除 k
    时，完整的 N 项和为零。Van der Corput 与 Weyl 方法都需要各自明确的
    光滑性、间距、差分或多项式假设，并不是无条件相消定律。
  finite_scope_boundary: |-
    This node defines finite sums. Its durable audit exercises only declared
    finite identities and inequalities; it makes no convergence or asymptotic
    theorem claim.

assumptions_and_notation:
  - "The convention is exactly e(t)=exp(2*pi*i*t), not exp(i*t)."
  - "I is a finite subset of the integers, so no infinite-series convergence question occurs."
  - "The weights a_n may be arbitrary complex numbers, including zero."
  - "The phase f is real-valued and only its class modulo one affects e(f(n))."
  - "N is a positive integer in every geometric-sum statement."
  - "The quotient formula requires alpha not in Z; integral alpha is handled separately."
  - "Complete root-of-unity cancellation requires N not dividing k, not gcd(N,k)=1."

