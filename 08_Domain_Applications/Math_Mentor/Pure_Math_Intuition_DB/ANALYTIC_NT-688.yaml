  sympy_pseudo_code: |
    import cmath
    import math

    def e(t):
        return cmath.exp(2j * math.pi * t)

    tolerance = 1e-12
    for N, k in [(2, 1), (3, 1), (4, 1), (4, 2), (6, 2)]:
        assert k % N != 0
        assert abs(sum(e(n * k / N) for n in range(N))) <= tolerance

    N, alpha = 4, 1 / 7
    direct = sum(e(n * alpha) for n in range(N))
    closed = (1 - e(N * alpha)) / (1 - e(alpha))
    assert abs(direct - closed) <= tolerance

