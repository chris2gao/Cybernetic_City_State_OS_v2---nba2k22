common_misconceptions:
  - "e(t) means exp(2*pi*i*t), not exp(i*t)."
  - "The geometric quotient formula cannot be substituted at integral alpha because its denominator is zero."
  - "Complete cancellation needs N not dividing k; coprimality of N and k is not required."
  - "Many unit arrows do not necessarily cancel."
  - "A zero total need not arise from pairwise cancellation."
  - "Phase modulo one does not mean the index itself is reduced modulo N."
  - "The triangle bound is not normally an equality; equality reflects aligned weighted phases."
  - "A finite exponential sum has no infinite-series convergence issue."
  - "One numerical experiment cannot prove an asymptotic theorem."
  - "A physical, quantum, cryptographic, or LLM analogy is not a mathematical identification."

