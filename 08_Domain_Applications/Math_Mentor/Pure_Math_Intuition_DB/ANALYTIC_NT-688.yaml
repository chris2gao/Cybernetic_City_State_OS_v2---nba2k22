code_implementation: |
  import cmath
  import math

  def e(t):
      return cmath.exp(2j * math.pi * t)

  def finite_exponential_sum(weights, phases):
      if len(weights) != len(phases):
          raise ValueError("weights and phases must have equal length")
      return sum((a * e(phase) for a, phase in zip(weights, phases)), 0j)

  def linear_phase_sum(N, alpha):
      return sum((e(n * alpha) for n in range(N)), 0j)

