id: "NUM_THEORY-017"
topic: "二次剩余 - 二次互反律 (Law of Quadratic Reciprocity) 的初步直觉（高斯的“黄金定理”） (n_211)"
sub_topics:
  - "两个奇素数 p, q 之间的关系"
  - "互反律的公式表述"
  - "简化复杂勒让德符号计算的作用"
  - "数学史上的多重证明路径"
llm_physical_mapping: "mundane physical metaphor (two mirrors reflecting each other, where parity depends on the alignment angles p and q)."
code_implementation: |-
  import torch

  def check_reciprocity_sign(p: int, q: int) -> int:
      """
      PyTorch snippet evaluating the reciprocity (p/q) * (q/p) sign.
      """
      p_t = torch.tensor(p, dtype=torch.int32)
      q_t = torch.tensor(q, dtype=torch.int32)
      
      pow_val = ((p_t - 1) // 2) * ((q_t - 1) // 2)
      sign = torch.where(pow_val % 2 == 1, torch.tensor(-1), torch.tensor(1))
      return sign.item()
v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy

    def verify_quadratic_reciprocity(p, q):
        # Only valid for distinct odd primes
        if not (sympy.isprime(p) and sympy.isprime(q) and p > 2 and q > 2 and p != q):
            return True
            
        l_pq = sympy.legendre_symbol(p, q)
        l_qp = sympy.legendre_symbol(q, p)
        
        expected_parity = (-1)**(((p - 1) // 2) * ((q - 1) // 2))
        return (l_pq * l_qp) == expected_parity

    assert verify_quadratic_reciprocity(3, 5)
    assert verify_quadratic_reciprocity(5, 7)
    assert verify_quadratic_reciprocity(11, 17)
    assert verify_quadratic_reciprocity(13, 19)
