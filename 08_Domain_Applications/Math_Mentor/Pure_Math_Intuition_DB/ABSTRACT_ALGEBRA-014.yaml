id: ABSTRACT_ALGEBRA-014
title: "Lie Algebras and Lie Groups"
sub_topics:
  - "Lie Groups"
  - "Lie Algebras"
  - "Exponential Map"
  - "Adjoint Representations"
llm_physical_mapping: "Flow Matching and Continuous Evolution (Flow-GRPO). Transitioning from discrete generation to continuous probability flows (Fokker-Planck equations) on a differentiable manifold. The model learns velocity fields $v_t$, corresponding to the infinitesimal generators of a Lie Algebra evolving the state smoothly."
code_implementation: "PyTorch Euler ODE integration simulating flow matching and velocity field evaluation."
v8_sanity_audit:
  sympy_pseudo_code: |
    import torch
    
    def velocity_field(x, t):
        # Learned velocity predicting flow towards target
        return -x / t
        
    # Initial random noise (t=1.0)
    x_t = torch.randn(2)
    t = 1.0
    dt = 0.1
    
    # ODE integration step (Euler method)
    # Moving along the Lie group manifold via infinitesimal generators
    x_next = x_t + velocity_field(x_t, t) * dt
    
    assert x_next.shape == (2,)
