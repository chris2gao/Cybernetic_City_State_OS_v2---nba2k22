v8_sanity_audit:
  status: "run_with_log"
  execution_claim: "bounded_finite_audit_only"
  language: "sympy"
  script_ref: ".ai/PROGRAM_RUNS/kcp-batch-1-prop-logic-certification-0001/AUDITS/run_prop_logic_audit.py"
  tested_properties: ["eight distinct three-variable rows", "six equivalences over all eight assignments"]
  explicitly_not_validated: ["general_rewrite_completeness", "predicate_logic_decidability", "pedagogy", "learner_mastery"]
  sympy_pseudo_code: |
    import itertools
    import sympy as sp
    from sympy.logic.boolalg import Equivalent, Implies, Not, Or
    P, Q, R = sp.symbols("P Q R")
    rows = list(itertools.product((False, True), repeat=3))
    assert len(rows) == 8 and len(set(rows)) == 8
    for p, q, r in rows:
        values = {P: p, Q: q, R: r}
        assert bool(Implies(P, Q).subs(values)) == bool(Or(Not(P), Q).subs(values))
        assert bool(Equivalent(P, Q).subs(values)) == (p == q)

