mode_a_intuition:
  occurrence_crisis:
    english: "Checking one or two convenient cases can make two nonequivalent formulas look identical."
    chinese: "只检查一两个方便情形，可能让并不等价的公式看起来完全相同。"
  primary:
    english: |-
      Picture a checklist of every possible input setting. Each row is one
      controlled test case, and no row may be skipped. Two formulas are
      equivalent only when their output columns match row by row.
    chinese: |-
      把真值表看作覆盖所有输入设置的检查清单：每一行都是一个受控测试用例，不能
      漏行。只有两个公式的输出列逐行一致时，它们才逻辑等价。
  low_friction_example:
    english: "For two atoms there are four rows. P→Q and ¬P∨Q agree on all four, including the easily missed row P=True, Q=False."
    chinese: "两个原子命题共有四行；P→Q 与 ¬P∨Q 四行全同，包括最容易漏掉的 P 真、Q 假。"
  limitations:
    - "A checklist analogy does not replace the definition of valuation. / 检查清单类比不能替代赋值的定义。"
    - "Sampling rows is not a complete truth table. / 抽样若干行不等于完整真值表。"

