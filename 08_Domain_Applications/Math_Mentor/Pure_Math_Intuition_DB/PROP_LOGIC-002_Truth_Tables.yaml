  - "Decision and proof of logical equivalence by valuations / 用赋值判定并证明逻辑等价"
  - "Common equivalences and their scope / 常用逻辑等价式及其适用范围"

pure_math_definition:
  english: |-
    Let a formula contain n distinct atomic propositions in a fixed order. A
    valuation assigns each atom one value in {True, False}. Its complete truth
    table has one row for each of the 2^n valuations and evaluates every
    subformula compositionally from the connective truth conditions.

    Formulas φ and ψ are logically equivalent, written φ≡ψ, when every valuation
    of all atoms occurring in either formula gives them the same truth value.
    Thus a complete truth-table comparison is a decision procedure for
    equivalence of finite classical propositional formulas. Useful equivalences
    include P→Q≡¬P∨Q, P↔Q≡(P→Q)∧(Q→P), ¬¬P≡P, and
    P→Q≡¬Q→¬P.
  chinese: |-
    设一个公式含有按固定顺序排列的 n 个不同原子命题。一个赋值给每个原子命题
    指定真或假。完整真值表对 2^n 个赋值各列一行，并按联结词真值条件逐层计算
    每个子公式。

    若对两个公式中出现的全部原子命题的每个赋值，φ 与 ψ 都有相同真值，则称
    φ、ψ 逻辑等价，记作 φ≡ψ。因此，完整真值表比较是有限经典命题公式等价性的
    判定程序。常用等价式包括 P→Q≡¬P∨Q、P↔Q≡(P→Q)∧(Q→P)、¬¬P≡P 以及
    P→Q≡¬Q→¬P。

assumptions_and_notation:
  - "Atoms are listed once in a fixed order; duplicate or missing assignments make a table incomplete. / 原子命题按固定顺序各列一次；重复或遗漏赋值会使表不完整。"
  - "The semantics are classical and two-valued. / 采用经典二值语义。"
  - "Logical equivalence is sameness of truth value under every valuation, not sameness of wording or proof. / 逻辑等价是所有赋值下真值相同，不是措辞或证明相同。"

