common_misconceptions:
  - "n atoms require n^2 rows rather than 2^n. / 误以为 n 个原子命题需要 n^2 行而不是 2^n 行。"
  - "One matching valuation proves equivalence. / 误以为一个赋值相同就证明等价。"
  - "A differing valuation is irrelevant if most rows match. / 误以为大多数行相同就可忽略一个不同赋值。"
  - "Logical equivalence means the formulas have identical syntax. / 误以为逻辑等价就是语法相同。"

