name: "三角恒等式 - 商数关系（tanθ = sinθ/cosθ）与倒数关系（sec, csc, cot） (n_169)"
node_type: "concept"
sub_topics:
  - "正切、正弦与余弦的商数恒等式"
  - "余切、正割、余割的定义与计算"
