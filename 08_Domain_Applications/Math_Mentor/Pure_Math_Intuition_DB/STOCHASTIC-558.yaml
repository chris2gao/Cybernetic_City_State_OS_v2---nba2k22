code_implementation: |-
  import torch

  def brownian_quadratic_variation():
      dt = 0.0001
      T = 1.0
      steps = int(T / dt)
      
      dW = torch.randn(steps) * torch.sqrt(torch.tensor(dt))
      quad_var = torch.sum(dW**2)
      
      return quad_var.item()
