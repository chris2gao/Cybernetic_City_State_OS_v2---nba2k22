file_deletion: false
claim_rejection: >-
  The formula h=alpha*kappa^beta is neither a mathematical law nor an
  established empirical relationship for model hallucination. The repository
  supplies no operational hallucination measure, constructed representation
  manifold, metric, connection, identified curvature quantity, fitted
  parameters, uncertainty analysis, held-out validation, or causal design.
  At most, after those objects and procedures are supplied, the expression
  could be considered one hypothetical parametric regression family alongside
  alternatives. This node is retained only as a rejected-claim audit record.
claim_rejection_zh: >-
  公式 h=alpha*kappa^beta 既不是大模型幻觉的数学定律，也不是已建立的经验关系。
  仓库没有给出可操作的幻觉度量、构造出的表示流形、度量、联络、明确的曲率量、
  拟合参数、不确定性分析、留出验证或因果设计。只有在这些对象与程序全部明确后，
  该表达式才最多可作为与其他模型竞争的假设参数回归族。本节点仅保留为被拒绝主张
  的审计记录。
symbol_requirements:
  h: >-
    Requires an operational hallucination metric, annotation protocol, error
    model, sampling design, and uncertainty treatment.
  kappa: >-
    Requires an explicit manifold, metric, connection, curvature definition,
    and justified estimator; sectional, Ricci, scalar, and extrinsic curvature
    are not interchangeable.
  alpha_beta: >-
    Require fitted units and scaling conventions, identifiability, confidence
    intervals, alternative-model comparison, and out-of-sample validation.
