mapping_boundary:
  primary_mapping_kind: "rejected_claim_research_audit"
  primary_mapping: >-
    Curvature language may motivate a research question only after a genuine
    geometric model and reproducible measurements are defined. It cannot turn
    visual bending, embedding diagnostics, Hessians, attention matrices, or
    verbal notions of semantic tension into a calibrated hallucination law.
    The permitted use here is methodological: identify missing definitions,
    competing explanations, validation requirements, and falsification tests.
  primary_mapping_zh: >-
    只有在建立真实几何模型并定义可复现实验测量后，曲率语言才可启发研究问题。
    它不能把可视化弯曲、嵌入诊断、Hessian、注意力矩阵或“语义张力”等语言直接
    变成校准过的幻觉定律。此处唯一允许的用途是方法审计：列出缺失定义、竞争解释、
    验证要求与可证伪检验。
  boundary:
    - "High curvature is not established as a cause, predictor, or calibrated measure of hallucination."
    - "Semantic density, geometric tension, fracture, and pressure are metaphors unless operationalized."
    - "Geodesic divergence does not imply model factual error."
    - "Curvature regularization is not established as a general hallucination-control method."
    - "Attention, Hessian, covariance, Fisher, or embedding-visualization quantities are not automatically Riemannian curvature."
    - "A scalar curvature score requires an explicit geometric construction and estimator."
