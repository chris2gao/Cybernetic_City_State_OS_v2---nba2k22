id: ABSTRACT_ALGEBRA-002
title: "Group Theory and Symmetry"
sub_topics:
  - "Definition of a Group"
  - "Identity and Inverse Elements"
  - "Symmetry Groups"
  - "Rotation Groups"
llm_physical_mapping: "Rotary Positional Encoding (RoPE). Unitary transformations in high-dimensional complex planes form a group of rotations SO(2). Applying RoPE to queries and keys is a group action where matrix multiplication computes relative positions, preserving the dot product through rotation group invariants."
code_implementation: "PyTorch rotation matrix application showing SO(2) group action on 2D embeddings."
v8_sanity_audit:
  sympy_pseudo_code: |
    import torch
    import math
    
    def apply_rope_2d(x: torch.Tensor, pos: int, base: float = 10000.0) -> torch.Tensor:
        # Group element: rotation by theta
        theta = pos * (base ** (-2.0 / x.shape[-1]))
        cos_t = math.cos(theta)
        sin_t = math.sin(theta)
        # Rotation matrix (Group representation)
        R = torch.tensor([[cos_t, -sin_t], [sin_t, cos_t]])
        return torch.matmul(x, R.T)
        
    q = torch.tensor([1.0, 0.0])
    k = torch.tensor([1.0, 0.0])
    q_rot = apply_rope_2d(q, pos=2)
    k_rot = apply_rope_2d(k, pos=1)
    # The dot product depends only on relative rotation (pos 2 - pos 1)
    relative_dot = torch.dot(q_rot, k_rot)
    expected_dot = torch.dot(apply_rope_2d(q, pos=1), k)
    assert torch.allclose(relative_dot, expected_dot)
