code_implementation: |-
  import torch

  def ito_integral_W_dW(T=1.0, dt=0.0001):
      steps = int(T / dt)
      W = torch.zeros(steps + 1)
      dW = torch.randn(steps) * torch.sqrt(torch.tensor(dt))
      
      W[1:] = torch.cumsum(dW, dim=0)
      
      ito_sum = torch.sum(W[:-1] * dW)
      theoretical = 0.5 * W[-1]**2 - 0.5 * T
      
      return torch.abs(ito_sum - theoretical).item()
v8_sanity_audit:
  sympy_pseudo_code: |-
    import sympy as sp
    
    W, dt, dW = sp.symbols('W dt dW')
    df = (W + dW)**2 / 2 - W**2 / 2
    
    df_ito = sp.expand(df).subs(dW**2, dt)
    expected_df = W * dW + dt / 2
    
    assert sp.simplify(df_ito - expected_df) == 0, "Ito Lemma expansion failed"
