id: "TRIG-011"
title: "反三角函数 - 主值区间的引入：为人为制造“双射”而进行的严苛定义域截断 (n_172)"
version: "9.1"
domain: "Pure_Math_Intuition"
concept_type: "Math Concept Node"

core_intuition: |
  Trigonometric functions are periodic, meaning they are many-to-one and fail the horizontal line test. To define an inverse function, we must artificially restrict the domain of the original trigonometric function to an interval where it is strictly monotonic (creating a bijection). This restricted domain dictates the principal value range for the inverse function.

sub_topics:
  - "arcsin 的主值区间 [-π/2, π/2]"
  - "arccos 的主值区间 [0, π]"
  - "arctan 的主值区间 (-π/2, π/2)"
  - "主值区间选择的习惯性与数学约定"

llm_physical_mapping: "Cutting a continuous wave to focus on a single slope."

code_implementation: |
  import torch
  import math

  def get_principal_arcsin(val):
      # Clamping to valid domain before applying inverse trig
      val_clamped = torch.clamp(val, -1.0, 1.0)
      return torch.asin(val_clamped) # Returns principal values in [-pi/2, pi/2]

  def get_principal_arccos(val):
      val_clamped = torch.clamp(val, -1.0, 1.0)
      return torch.acos(val_clamped) # Returns principal values in [0, pi]

  def get_principal_arctan(val):
      return torch.atan(val) # Returns principal values in (-pi/2, pi/2)

v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy as sp
    
    # Test principal values of inverse trigonometric functions
    
    # arcsin: domain [-1, 1], range [-pi/2, pi/2]
    assert sp.asin(1) == sp.pi/2
    assert sp.asin(-1) == -sp.pi/2
    assert sp.asin(0) == 0
    
    # arccos: domain [-1, 1], range [0, pi]
    assert sp.acos(1) == 0
    assert sp.acos(-1) == sp.pi
    assert sp.acos(0) == sp.pi/2
    
    # arctan: domain R, range (-pi/2, pi/2)
    assert sp.atan(0) == 0
    assert sp.atan(sp.oo) == sp.pi/2
    assert sp.atan(-sp.oo) == -sp.pi/2
