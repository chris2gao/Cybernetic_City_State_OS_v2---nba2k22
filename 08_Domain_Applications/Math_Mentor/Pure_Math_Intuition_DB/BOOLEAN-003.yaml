  domain: "boolean_algebra"
  title: "逻辑门电路与布尔代数的同构 (n_51)"
  sub_topics:
    - '与门(AND)、或门(OR)、非门(NOT)'
    - '与非门(NAND)与或非门(NOR)的通用性'
    - '加法器电路的布尔逻辑模型'
    - '硬件描述语言的数学基础'
  llm_physical_mapping: "Think of logic gates as a plumbing system with specific types of valves. An AND gate is like two valves in series on a pipe (water only flows if both are open). An OR gate is like two parallel pipes with valves (water flows if either or both are open). A NOT gate is an inverted valve that is open when untouched and closes when activated. Boolean algebra provides the mathematical rules to describe how these plumbing connections compute complex logic."
  code_implementation: |
    import torch

    # Simulating Logic Gates using PyTorch boolean tensors
    def AND(a: torch.Tensor, b: torch.Tensor) -> torch.Tensor:
        return torch.logical_and(a, b)

    def OR(a: torch.Tensor, b: torch.Tensor) -> torch.Tensor:
        return torch.logical_or(a, b)

    def NOT(a: torch.Tensor) -> torch.Tensor:
        return torch.logical_not(a)

    def NAND(a: torch.Tensor, b: torch.Tensor) -> torch.Tensor:
        return NOT(AND(a, b))

    # Constructing a Half-Adder from basic gates
    def half_adder(A: torch.Tensor, B: torch.Tensor):
        # Sum = (A AND NOT B) OR (NOT A AND B) -> XOR
        sum_out = OR(AND(A, NOT(B)), AND(NOT(A), B))
        # Carry = A AND B
        carry_out = AND(A, B)
        return sum_out, carry_out

    # Truth table test
    A = torch.tensor([False, False, True, True])
    B = torch.tensor([False, True, False, True])
    S, C = half_adder(A, B)
    # S -> tensor([False,  True,  True, False])
    # C -> tensor([False, False, False,  True])
  v8_sanity_audit:
    sympy_pseudo_code: |
      from sympy.logic.boolalg import And, Or, Not, Nand, Nor
      from sympy.abc import A, B

      # Defining basic logic gates as boolean algebra expressions
      and_gate = And(A, B)
      or_gate = Or(A, B)
      not_gate = Not(A)

      # Demonstrating NAND universality
      nand_gate = Nand(A, B)
      
      # NOT A using only NAND
      not_A_from_nand = Nand(A, A)
      assert not_A_from_nand.equals(Not(A))
      
      # A AND B using only NAND
      and_from_nand = Nand(Nand(A, B), Nand(A, B))
      assert and_from_nand.equals(And(A, B))
      
      # A OR B using only NAND
      or_from_nand = Nand(Nand(A, A), Nand(B, B))
      assert or_from_nand.equals(Or(A, B))
