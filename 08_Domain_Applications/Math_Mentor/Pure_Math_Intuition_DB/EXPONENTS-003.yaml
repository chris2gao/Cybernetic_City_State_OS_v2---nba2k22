concept_node:
  id: "EXPONENTS-003"
  title: "分数指数幂的定义与根式的等价转换 (n_113)"
  domain: "有理指数与幂函数 (rational_exponents_and_power_functions)"
  sub_topics:
    - "n次方根的概念与性质"
    - "正分数指数幂的定义"
    - "负分数指数幂的定义"
    - "根式与分数指数幂的互化公式"
    - "有理指数幂的通用运算性质"
  llm_physical_mapping:
    concept: "mundane physical metaphor"
    description: "Think of fractional exponents as a machine that scales a physical object. The denominator 'n' acts as a reducer that finds the fundamental 'building block' which, when multiplied by itself 'n' times, gives the original size (n-th root). The numerator 'm' then replicates that building block 'm' times. Thus, x^(m/n) is equivalent to taking the n-th root and raising it to the m-th power."
  code_implementation:
    framework: "PyTorch"
    snippet: |
      import torch

      def compute_fractional_power(base_tensor: torch.Tensor, m: float, n: float) -> torch.Tensor:
          """
          PyTorch implementation demonstrating fractional powers.
          Computes base^(m/n) safely for positive bases.
          """
          # Direct computation of fractional exponent
          exponent = m / n
          result = torch.pow(base_tensor, exponent)
          
          # Equivalent root operation: (base^(1/n))^m
          nth_root = torch.pow(base_tensor, 1.0 / n)
          radical_result = torch.pow(nth_root, m)
          
          # Both yield the same result for valid inputs
          return result
  v8_sanity_audit:
    sympy_pseudo_code: |
      import sympy as sp

      # Define symbols
      x = sp.Symbol('x', positive=True)
      m = sp.Symbol('m', integer=True)
      n = sp.Symbol('n', integer=True, positive=True)

      # 1. Define rational exponent expression
      rational_exp = x**(m/n)

      # 2. Define equivalent radical expression
      radical_exp = sp.root(x**m, n)

      # 3. Prove equivalence (should simplify to 0)
      difference = sp.simplify(rational_exp - radical_exp)
      print(f"Equivalence check difference: {difference}")
