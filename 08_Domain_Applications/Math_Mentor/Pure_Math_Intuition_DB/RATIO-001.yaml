  name: "比值与比例的严格定义及基本性质"
  domain: "ratios_and_percentages"
  sub_topics:
    - "比与比值的概念区分"
    - "比例的基本性质：内项之积等于外项之积"
    - "比例式的恒等变形"
    - "比例尺的概念与应用"
  llm_physical_mapping: "Gears and levers: Two interlocked gears of different sizes rotate at inversely proportional speeds, maintaining a constant ratio of teeth. Similarly, a lever balances when the product of the force and its distance to the fulcrum (inner product) equals the product of the opposing force and its distance (outer product)."
  code_implementation: |
    import torch

    # Ratio as scalar scaling
    def scale_ratio(value, ratio):
        val_tensor = torch.tensor(value, dtype=torch.float32)
        ratio_tensor = torch.tensor(ratio, dtype=torch.float32)
        return val_tensor * ratio_tensor

    # Checking proportion: a/b = c/d <=> a*d = b*c
    def check_proportion(a, b, c, d):
        ad = torch.tensor(a, dtype=torch.float32) * torch.tensor(d, dtype=torch.float32)
        bc = torch.tensor(b, dtype=torch.float32) * torch.tensor(c, dtype=torch.float32)
        return torch.isclose(ad, bc)
  v8_sanity_audit:
    sympy_pseudo_code: |
      import sympy as sp
      a, b, c, d = sp.symbols('a b c d')
      # Define the proportion equation a/b = c/d
      proportion = sp.Eq(a / b, c / d)
      
      # Solving for an unknown variable using the property: inner product = outer product
      # Example: x / 3 = 4 / 6
      x = sp.Symbol('x')
      equation = sp.Eq(x * 6, 3 * 4)  # Outer product (x*6) equals inner product (3*4)
      solution = sp.solve(equation, x)
