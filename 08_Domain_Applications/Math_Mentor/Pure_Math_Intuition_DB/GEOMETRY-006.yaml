  title: "三角形（全等/相似） - 三角形不等式（两边之和大于第三边：空间两点间直线最短）"
  sub_topics:
    - "两点之间线段最短的公理化基础"
    - "三角形任意两边之和大于第三边"
    - "三角形任意两边之差小于第三边"
    - "极端情况（三点共线）与等号成立条件"
  llm_physical_mapping: |
    Mundane physical metaphor: Taking a detour vs walking straight. 
    Walking directly from your house to school is always shorter than walking to a friend's house first and then to school. The sum of the detour paths (two sides) is strictly greater than the direct path (third side), unless the friend's house is exactly on the direct path.
  code_implementation: |
    import torch

    def triangle_inequality_tensor(A: torch.Tensor, B: torch.Tensor, C: torch.Tensor) -> bool:
        """
        Validates the triangle inequality for three points in N-dimensional space.
        ||A - B|| + ||B - C|| >= ||A - C||
        """
        dist_AB = torch.norm(A - B)
        dist_BC = torch.norm(B - C)
        dist_AC = torch.norm(A - C)
        
        # We use a small epsilon to avoid floating point precision issues
        return bool((dist_AB + dist_BC + 1e-6) >= dist_AC)
  v8_sanity_audit:
    sympy_pseudo_code: |
      from sympy import Point
      
      def verify_sympy_triangle_inequality(x1, y1, x2, y2, x3, y3):
          p1, p2, p3 = Point(x1, y1), Point(x2, y2), Point(x3, y3)
          
          d12 = p1.distance(p2)
          d23 = p2.distance(p3)
          d13 = p1.distance(p3)
          
          # Returns symbolic boolean expressions
          return (d12 + d23 >= d13) and (d12 + d13 >= d23) and (d23 + d13 >= d12)
