code_implementation: |
  import sympy as sp
  t = sp.Symbol('t')
  x = sp.Function('x')(t)
  m, F = sp.symbols('m F')
  newton_eq = sp.Eq(m * sp.diff(x, t, t), F)
v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy as sp
    t = sp.Symbol('t')
    x = sp.Function('x')(t)
    m, F = sp.symbols('m F')
    newton_eq = sp.Eq(m * x.diff(t, 2), F)
    assert newton_eq.lhs == m * sp.Derivative(x, (t, 2))
