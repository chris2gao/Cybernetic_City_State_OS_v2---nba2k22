mapping_boundary:
  primary_mapping_kind: "llm_architecture_bounded_structural_analogy"
  primary_mapping: >-
    Assume only for this analogy that model states form an explicitly defined
    smooth state manifold with local coordinate systems. Tangent perturbations
    at different states cannot then be compared without a rule identifying
    nearby tangent spaces. A connection is analogous to a state-dependent
    transport rule that compensates for changing local bases while carrying a
    perturbation or update direction through the representation process. This
    can illustrate why naive component-wise comparison across changing local
    representations is coordinate-dependent, why transported update directions
    may require a correction term, and how curvature later measures failure of
    two infinitesimal transport orders to agree.
  primary_mapping_zh: >-
    仅为建立结构类比，假设模型状态被放在一个明确定义的光滑状态流形及其局部坐标
    中。不同状态点的切扰动不能直接比较，需要一个规则识别相邻切空间。联络可类比为
    随状态变化的运输规则：当局部基底改变时，它为被运输的扰动或更新方向加入修正。
    该类比可以说明跨局部表示直接比较分量为何依赖坐标、运输更新方向为何可能需要
    修正项，以及后续曲率为何刻画两种无穷小运输次序不一致。
  boundary:
    - "An ordinary Transformer residual stream is usually a fixed finite-dimensional vector space with a canonical linear identification between tangent spaces; it does not need a nontrivial connection merely because layers update representations."
    - "No ordinary LLM hidden-state collection is established here as a smooth manifold."
    - "No Riemannian metric on hidden states is assumed unless explicitly defined."
    - "No Levi-Civita connection exists until a metric and smooth-manifold model are supplied."
    - "Attention matrices, Jacobians, optimizer states, residual updates, normalization coefficients, and routing weights are not automatically Christoffel symbols."
    - "A Jacobian describes the derivative of a map; it is not by itself an affine connection."
    - "Parallel transport is path- and connection-dependent; it is not generic feature copying between layers."
    - "The gradient direction is determined by the metric and objective differential, not by the connection alone."
    - "The household gear and antenna metaphor may be retained only as a secondary teaser with an explicit limitation; it cannot be the MathLane_B primary mapping."
    - "No machine-verifiable model of an LLM connection is established by this node."
  preserve_full_boundary: true
  existing_physical_metaphor_status: "secondary_teaser_only"
  secondary_teaser_limitation: >-
    The gear-and-antenna image only hints at basis correction relative to a
    chosen connection. It supplies no absolute forward direction, no gradient
    direction, and no evidence that an LLM has a geometric connection.
