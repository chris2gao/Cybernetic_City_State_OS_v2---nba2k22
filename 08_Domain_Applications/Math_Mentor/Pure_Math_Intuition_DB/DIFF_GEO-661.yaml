formal_definition: >-
  Let M be a smooth manifold. An affine connection on TM is a map
  ∇:Γ(TM)×Γ(TM)→Γ(TM), (X,Y)↦∇_X Y, that is real-bilinear and satisfies
  ∇_(fX+gY) Z=f∇_X Z+g∇_Y Z and
  ∇_X(aY+bZ)=a∇_X Y+b∇_X Z for f,g∈C∞(M), a,b∈R, and smooth vector fields
  X,Y,Z. It obeys the Leibniz rule ∇_X(fY)=X(f)Y+f∇_X Y. Thus the first
  vector-field input is C∞(M)-linear and depends pointwise on X, whereas the
  second input is only R-linear and is not C∞(M)-linear. A connection is a
  differential operator rather than a tensor, although the difference of two
  affine connections is a (1,2)-tensor. In local coordinates x^i, its
  coefficients are defined by ∇_(∂_i)∂_j=Γ^k_{ij}∂_k, and
  (∇_X Y)^k=X^i∂_iY^k+Γ^k_{ij}X^iY^j. The first term differentiates the
  vector-field components; the second corrects for the changing coordinate
  frame. Under a coordinate change the Γ^k_{ij} obey an inhomogeneous law with
  a second-derivative term, so Christoffel symbols are coordinate coefficients
  of a connection, not tensor components. Their vanishing at one point in one
  coordinate system does not make the connection globally zero or force
  curvature to vanish. The torsion is
  T(X,Y)=∇_X Y-∇_Y X-[X,Y], a (1,2)-tensor. In a coordinate frame,
  torsion-free implies Γ^k_{ij}=Γ^k_{ji}; this symmetry cannot be transferred
  blindly to a non-coordinate frame because the frame bracket contributes.
  Given a Riemannian metric g, a connection is metric-compatible when ∇g=0,
  equivalently X[g(Y,Z)]=g(∇_X Y,Z)+g(Y,∇_X Z). For every Riemannian metric
  there exists a unique torsion-free, metric-compatible affine connection,
  called its Levi-Civita connection. It is characterized by the Koszul formula
  2g(∇_X Y,Z)=Xg(Y,Z)+Yg(Z,X)-Zg(X,Y)-g(X,[Y,Z])+g(Y,[Z,X])
  +g(Z,[X,Y]), and in coordinates
  Γ^k_{ij}=1/2 g^{kℓ}(∂_i g_{jℓ}+∂_j g_{iℓ}-∂_ℓ g_{ij}). A general affine
  connection requires no metric, and an arbitrary smooth manifold has no
  canonical affine connection without additional structure. For a smooth
  curve γ and a vector field V(t)=V^k(t)∂_k|_(γ(t)) along it, the covariant
  derivative is DV/dt=(dV^k/dt+Γ^k_{ij}(γ(t))γ_dot^iV^j)∂_k. The field V is
  parallel when DV/dt=0; solving this linear ODE defines path- and
  connection-dependent parallel transport. Levi-Civita parallel transport
  preserves the metric inner product. An affinely parameterized geodesic
  satisfies Dγ_dot/dt=∇_(γ_dot)γ_dot=0, or
  d²x^k/dt²+Γ^k_{ij}(dx^i/dt)(dx^j/dt)=0 in coordinates. Levi-Civita
  geodesics are locally length-minimizing only under the appropriate local
  hypotheses and need not be globally shortest. The metric, not the
  connection alone, determines grad f through g(grad f,X)=df(X); the
  connection differentiates and transports tangent directions and supports
  Hessians, geodesics, and curvature. The connection itself is distinct from
  its local Christoffel coefficients, the transport maps it induces, its
  geodesics, its curvature, and any metric used to select a Levi-Civita
  specialization.
formal_definition_zh: >-
  设 M 是光滑流形。TM 上的仿射联络是映射
  ∇:Γ(TM)×Γ(TM)→Γ(TM)，(X,Y)↦∇_X Y。它对实数线性，并满足
  ∇_(fX+gY)Z=f∇_X Z+g∇_Y Z；对常数 a、b 有
  ∇_X(aY+bZ)=a∇_X Y+b∇_X Z；对光滑函数 f 满足 Leibniz 法则
  ∇_X(fY)=X(f)Y+f∇_X Y。因此，第一个向量场输入 X 对 C∞(M) 是函数线性的，
  只依赖该点的 X_p；第二个输入 Y 仅对实数线性，并不对 C∞(M) 线性。联络是
  微分算子而不是张量，但两个仿射联络之差是 (1,2) 型张量。在局部坐标中，
  ∇_(∂_i)∂_j=Γ^k_{ij}∂_k，并且
  (∇_X Y)^k=X^i∂_iY^k+Γ^k_{ij}X^iY^j。第一项是向量场分量的方向导数，
  第二项修正局部标架的变化。Γ^k_{ij} 在坐标变换下含有二阶导数的非齐次项，
  所以 Christoffel 符号只是联络的坐标系数，不是张量分量；它们在某点某组坐标
  中为零，不代表联络全局为零，也不迫使曲率为零。挠率定义为
  T(X,Y)=∇_X Y-∇_Y X-[X,Y]，它是 (1,2) 型张量。在坐标标架中，无挠条件
  给出 Γ^k_{ij}=Γ^k_{ji}；非坐标标架还存在标架括号项，不能直接套用该对称式。
  给定 Riemannian 度量 g，联络满足度量相容性，当且仅当 ∇g=0，等价地
  X[g(Y,Z)]=g(∇_X Y,Z)+g(Y,∇_X Z)。每个 Riemannian 度量唯一确定一个
  无挠且度量相容的仿射联络，称为 Levi-Civita 联络。它由 Koszul 公式
  2g(∇_X Y,Z)=Xg(Y,Z)+Yg(Z,X)-Zg(X,Y)-g(X,[Y,Z])+g(Y,[Z,X])
  +g(Z,[X,Y]) 刻画；坐标中
  Γ^k_{ij}=1/2 g^{kℓ}(∂_i g_{jℓ}+∂_j g_{iℓ}-∂_ℓ g_{ij})。一般仿射联络
  不要求度量；没有附加结构时，任意光滑流形上不存在规范选定的仿射联络。对曲线
  γ(t) 及其上的向量场 V(t)=V^k(t)∂_k|_(γ(t))，沿曲线协变导数为
  DV/dt=(dV^k/dt+Γ^k_{ij}(γ(t))γ_dot^iV^j)∂_k。若 DV/dt=0，则 V 沿 γ
  平行；该线性 ODE 定义依赖路径和所选联络的平行移动。Levi-Civita 平行移动保持
  度量内积。仿射参数化测地线满足 Dγ_dot/dt=∇_(γ_dot)γ_dot=0，坐标形式为
  d²x^k/dt²+Γ^k_{ij}(dx^i/dt)(dx^j/dt)=0。Levi-Civita 测地线只在适当的局部
  条件下局部最短，并不自动全局最短。梯度方向由度量通过
  g(grad f,X)=df(X) 确定，而不是由联络单独决定；联络负责微分和运输切向量，
  并支持 Hessian、测地线和曲率。联络本身不同于它的 Christoffel 局部系数、
  平行移动映射、测地线、曲率以及用于选出 Levi-Civita 特例的度量。
