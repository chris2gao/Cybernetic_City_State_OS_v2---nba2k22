    computes only the connection term Γ(v,W). It accepts a vector value rather
    than a position-dependent vector field, so it cannot evaluate the general
    directional-derivative term v^i∂_iW^k. Its example also sets Γ=0, producing
    a trivial result rather than a general covariant derivative.
  audit_interpretation: >-
    The existing audit checks only that Γ*v*w vanishes after substituting Γ=0.
    This is a trivial algebraic substitution and does not test a connection
    axiom, transformation law, torsion, metric compatibility, Levi-Civita
    existence or uniqueness, parallel transport, geodesics, or curvature.
  code_scope: "zero_directional_derivative_plus_connection_term"
