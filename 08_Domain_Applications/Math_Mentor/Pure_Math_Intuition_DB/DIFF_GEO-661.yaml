concept_name: 联络：协变导数、平行移动与 Levi-Civita 联络 (n_661)
sub_topics:
- affine connection definition and connection axioms
- C-infinity linearity in the direction argument and Leibniz rule in the differentiated field
- local connection coefficients and the non-tensorial transformation of Christoffel symbols
- difference of two connections as a tensor
- torsion and the torsion-free condition
- metric compatibility
- Levi-Civita existence and uniqueness
- Koszul formula and metric-derived Christoffel symbols
- covariant derivative along curves
- parallel vector fields and parallel transport
- geodesic equation as self-parallel velocity
- connection versus metric, curvature, gradient, and coordinate representation
llm_physical_mapping: >-
  齿轮转向同步器：把天线沿曲面移动时，齿轮组提示局部基底变化需要一个修正规则。
  这只是一条次级直觉提示；所谓“前方”始终相对于所选联络，不是绝对方向，也不表示
  联络单独决定梯度方向，更不证明普通 LLM 隐状态具有仿射或 Levi-Civita 联络。
code_implementation: |
  import torch
  import numpy as np

  def covariant_derivative(vector_field, velocity, christoffel_symbols):
      # D_v W = dW(v) + Gamma(v, W)
      directional_deriv = torch.zeros_like(vector_field)
      connection_term = torch.einsum('ijk,j,k->i', christoffel_symbols, velocity, vector_field)
      return directional_deriv + connection_term

  v_f = torch.tensor([0.0, 1.0])
  vel = torch.tensor([1.0, 0.0])
  Gamma = torch.zeros(2, 2, 2)
  cov_dir = covariant_derivative(v_f, vel, Gamma)
v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy as sp

    Gamma, v, w = sp.symbols('Gamma v w')
    # simplified connection term
    conn = Gamma * v * w
    assert conn.subs({Gamma: 0}) == 0
