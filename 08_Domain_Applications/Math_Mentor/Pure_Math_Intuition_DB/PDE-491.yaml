code_implementation: |
  import torch

  def solve_laplace_2d(grid_size=50, iterations=1000):
      u = torch.zeros((grid_size, grid_size))
      
      u[0, :] = 1.0
      u[-1, :] = 0.0
      u[:, 0] = 0.0
      u[:, -1] = 0.0
      
      for _ in range(iterations):
          u_new = u.clone()
          u_new[1:-1, 1:-1] = 0.25 * (u[:-2, 1:-1] + u[2:, 1:-1] + u[1:-1, :-2] + u[1:-1, 2:])
          u = u_new
          
      return u
v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy as sp

    x, y = sp.symbols('x y', real=True)

    u1 = x**2 - y**2
    u2 = sp.exp(x) * sp.cos(y)

    laplacian_u1 = sp.diff(u1, x, 2) + sp.diff(u1, y, 2)
    laplacian_u2 = sp.diff(u2, x, 2) + sp.diff(u2, y, 2)

    assert sp.simplify(laplacian_u1) == 0, "x^2 - y^2 is a harmonic function"
    assert sp.simplify(laplacian_u2) == 0, "e^x cos(y) is a harmonic function"
