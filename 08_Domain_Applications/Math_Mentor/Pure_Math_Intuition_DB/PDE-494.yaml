llm_physical_mapping: "A solid steel beam adjusting its inner stress smoothly to loads placed anywhere (Elliptic). A hot iron poker plunged into ice water, strictly losing its heat profile to a flat temperature over time (Parabolic). A struck tuning fork sending sound waves bouncing off walls, echoing its initial hit without instantly smoothing out (Hyperbolic)."
code_implementation: |
  import torch
  import torch.nn.functional as F

  def simulate_pde_behaviors(initial_signal):
      signal = initial_signal.view(1, 1, -1)
      
      kernel_diff = torch.tensor([[[0.25, 0.5, 0.25]]])
      parabolic_state = F.conv1d(signal, kernel_diff, padding=1)
      
      hyperbolic_state = torch.roll(signal, shifts=1, dims=-1)
      
      seq_len = signal.shape[-1]
      elliptic_state = torch.linspace(signal[0,0,0].item(), signal[0,0,-1].item(), seq_len)
      
      return parabolic_state, hyperbolic_state, elliptic_state
v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy as sp

    x, t, alpha = sp.symbols('x t alpha', real=True, positive=True)

    heat_kernel = (1 / sp.sqrt(4 * sp.pi * alpha * t)) * sp.exp(-x**2 / (4 * alpha * t))
    
    u_t = sp.diff(heat_kernel, t)
    u_xx = sp.diff(heat_kernel, x, 2)
    
    heat_eq_check = sp.simplify(u_t - alpha * u_xx)
    assert heat_eq_check == 0, "Heat kernel must exactly satisfy parabolic diffusion equation"
