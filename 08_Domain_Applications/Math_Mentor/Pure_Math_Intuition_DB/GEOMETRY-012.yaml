  title: "圆与多边形 - 圆心角、圆周角定理（分类推导：圆周角等于圆心角的一半）"
  sub_topics:
    - "圆周角定理的分类讨论（圆心在角边上、内部、外部）"
    - "直径所对的圆周角是直角"
    - "同弧或等弧所对的圆周角相等"
    - "圆内接四边形的对角互补性质"
  llm_physical_mapping: |
    Imagine looking at a movie screen. If you stand right at the center of the circular theater floor, the screen occupies a certain angle of your vision (the central angle). If you move all the way back to the wall of the theater (the circumference), the screen will appear exactly half as wide in your field of view (the inscribed angle). This relationship holds regardless of where you stand on the back wall, as long as you're viewing the same screen.
  code_implementation: |
    import torch

    def calculate_angles(center, p_arc1, p_arc2, p_circumference):
        """
        Calculates central and inscribed angles using PyTorch dot products.
        All inputs are 1D float tensors of size 2.
        """
        # Vectors for central angle (p_arc1 - center) and (p_arc2 - center)
        v_c1 = p_arc1 - center
        v_c2 = p_arc2 - center
        cos_theta_c = torch.dot(v_c1, v_c2) / (torch.norm(v_c1) * torch.norm(v_c2))
        central_angle = torch.acos(torch.clamp(cos_theta_c, -1.0, 1.0))
        
        # Vectors for inscribed angle (p_arc1 - p_circumference) and (p_arc2 - p_circumference)
        v_i1 = p_arc1 - p_circumference
        v_i2 = p_arc2 - p_circumference
        cos_theta_i = torch.dot(v_i1, v_i2) / (torch.norm(v_i1) * torch.norm(v_i2))
        inscribed_angle = torch.acos(torch.clamp(cos_theta_i, -1.0, 1.0))
        
        return central_angle, inscribed_angle
  v8_sanity_audit:
    sympy_pseudo_code: |
      from sympy import Point, Circle, Line
      
      O = Point(0, 0)
      A = Point(5, 0)
      B = Point(0, 5)
      P = Point(-3, 4) # On the circle x^2 + y^2 = 25
      
      line_OA = Line(O, A)
      line_OB = Line(O, B)
      central_angle = line_OA.angle_between(line_OB)
      
      line_PA = Line(P, A)
      line_PB = Line(P, B)
      inscribed_angle = line_PA.angle_between(line_PB)
      
      # Verification: inscribed angle is half of central angle
      is_half = (central_angle == 2 * inscribed_angle)
