concept_node:
  id: "FRACTIONS-003"
  name: "分数与小数 (fractions_and_decimals) - 十进制的位值原理 (Place Value) (n_59)"
  domain: "Math"
  sub_topics:
    - "以 10 为基数的幂级数展开形式"
    - "小数点作为整数与小数部分的分界逻辑"
    - "十分位、百分位等位置的数值权重"
    - "位值原理在多位数乘除法中的支撑作用"
  llm_physical_mapping:
    metaphor: "A set of nested measuring cups or containers, where each container is exactly 10 times the capacity of the next smaller one. The decimal point acts as a clear physical barrier on a table, separating whole units on the left from fractional 'pieces' on the right."
    description: "In base-10, each place value is a power of 10. Moving left corresponds to scaling up by a factor of 10, while moving right scales down by dividing by 10. The decimal point establishes the unit position."
  code_implementation:
    language: "python"
    framework: "pytorch"
    description: "PyTorch tensor extraction of digits based on place values."
    code: |
      import torch

      def extract_digits(value: float, int_places: int = 4, dec_places: int = 4) -> torch.Tensor:
          # Create tensor of powers for integer and decimal parts
          powers = torch.arange(int_places - 1, -dec_places - 1, -1, dtype=torch.float64)
          
          # Calculate place value weights
          weights = 10.0 ** powers
          
          # Extract digits greedily
          digits = torch.zeros_like(weights)
          remainder = torch.tensor(value, dtype=torch.float64)
          
          for i, weight in enumerate(weights):
              digit = torch.floor(remainder / weight)
              # Handle floating point inaccuracies
              if digit > 9: digit = torch.tensor(9.0, dtype=torch.float64)
              if digit < 0: digit = torch.tensor(0.0, dtype=torch.float64)
              
              digits[i] = digit
              remainder -= digit * weight
              
          return digits
  v8_sanity_audit:
    sympy_pseudo_code: |
      import sympy as sp

      def place_value_expansion(num_string: str) -> sp.Expr:
          """SymPy formalization of base-10 place value expansion."""
          if '.' in num_string:
              int_str, dec_str = num_string.split('.')
          else:
              int_str, dec_str = num_string, ""

          expansion = sp.S(0)

          # Add integer part contributions
          for idx, digit in enumerate(reversed(int_str)):
              expansion += sp.Integer(digit) * (10**idx)

          # Add decimal part contributions
          for idx, digit in enumerate(dec_str, start=1):
              expansion += sp.Integer(digit) * (10**-idx)

          return expansion
