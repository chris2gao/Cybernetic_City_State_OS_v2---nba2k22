llm_physical_mapping: "spatial deformation/stretching/rotating: Determinant measures the volume scaling factor of the spatial deformation. 0 means volume is completely squashed (squashed into a flat plane/line losing dimensionality), and negative means the space is turned inside out."
code_implementation: |
  import sympy as sp
  a, b, c, d = sp.symbols('a b c d')
  A = sp.Matrix([[a, b], [c, d]])
  det_A = A.det()
v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy as sp
    # A matrix linearly dependent vectors
    A = sp.Matrix([[1, 2], [2, 4]])
    assert A.det() == 0, "Dimension collapse means determinant is 0"
    
    # A matrix that flips space
    B = sp.Matrix([[1, 0], [0, -1]])
    assert B.det() < 0, "Space flip means negative determinant"
