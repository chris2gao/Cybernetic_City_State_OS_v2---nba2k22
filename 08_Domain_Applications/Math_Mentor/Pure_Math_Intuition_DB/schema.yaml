concept_node:
  id: "String. Unique identifier."
  symbol: "String. LaTeX formatted mathematical symbol."
  name: "String. Human readable name."
  domain: "String. The mathematical branch."

  sub_topics:
    - "String. Extracted from the JSON array."

  pure_math_definition:
    description: "String. Strict, formal mathematical description without metaphors."
    axioms:
      - "String. Formal axiom in LaTeX formatting."
      
  llm_physical_mapping:
    architecture_component: "String. The specific AI/LLM component this maps to."
    cognitive_intuition: "String. The deep intuition explaining the mapping."
    tensor_shape_flow: "String. The tensor flow representation of the concept."

  code_implementation:
    framework: "String. PyTorch/TensorFlow etc."
    snippet: "String. The exact code block."

  v8_sanity_audit:
    engine: "String. e.g., SymPy + Z3"
    validation_target: "String. What mathematical property is being validated."
    execution_logic: "String. Explain how the pseudo code tests the property."
    sympy_pseudo_code: "String. The executable Python script asserting the math logic."
