llm_physical_mapping: "mundane physical metaphor: Like acoustic resonances inside a rigid steel pipe closed at both ends. Sound waves bouncing back and forth interfere constructively only at specific, discrete resonant frequencies. Frequencies that don't match these discrete energy levels cancel out and disappear, leaving only the stable, quantized acoustic modes."
code_implementation: |
  import sympy as sp
  x, E, V0 = sp.symbols('x E V_0')
  psi = sp.Function('psi')(x)
  # 1D Schrödinger equation in a potential well
  eq = sp.Eq(-psi.diff(x, 2) + V0*psi, E*psi)
