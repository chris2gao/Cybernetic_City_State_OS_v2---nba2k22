id: "TOP-001"
title: "拓扑空间的基础公理与开闭集 (Axioms of Topological Spaces, Open/Closed Sets)"
sub_topics:
  - "拓扑的定义与公理"
  - "开集与闭集的物理与信息学直觉"
  - "邻域与基"
llm_physical_mapping: "在 LLM 的底层架构中，拓扑空间映射为词嵌入（Embeddings）形成的高维连续流形空间。一组符合特定拓扑公理的开集，可以视作注意力机制中某一 Token 所能捕获的有效上下文邻域（Contextual Neighborhood）。与精确的度量空间不同，纯粹的注意力权重掩码（Attention Mask）通过定义哪些 Token 之间存在信息连通性，从而在离散的序列上诱导出了一个拓扑结构。闭集则对应于信息被完全隔离或屏蔽的边界外区域（如 Causal Mask 掩蔽的未来 Token，以及被断开的语义维度）。"
code_implementation: |
  import torch
  import torch.nn.functional as F

  def simulate_open_set_attention(query, keys, values, mask):
      # query: [1, D], keys: [N, D]
      # The attention mask acts as an open set definer, selecting neighbors
      scores = torch.matmul(query, keys.transpose(-2, -1)) / (query.size(-1) ** 0.5)
      
      # mask == 0 indicates points not in the open neighborhood
      scores = scores.masked_fill(mask == 0, float('-inf'))
      
      attention_weights = F.softmax(scores, dim=-1)
      topological_neighborhood_output = torch.matmul(attention_weights, values)
      return topological_neighborhood_output
v8_sanity_audit:
  sympy_pseudo_code: |
    import torch
    
    def test_open_set():
        q = torch.randn(1, 64)
        k = torch.randn(5, 64)
        v = torch.randn(5, 64)
        # Open set neighborhood containing elements 0, 1, 2
        mask = torch.tensor([[1, 1, 1, 0, 0]])
        
        out = simulate_open_set_attention(q, k, v, mask)
        assert out.shape == (1, 64)
