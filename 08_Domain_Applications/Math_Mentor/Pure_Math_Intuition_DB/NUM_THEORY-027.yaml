id: "NUM_THEORY-027"
title: "原根与离散对数初步 - 原根 (Primitive Root)：当阶 k = φ(m) 时生成整个既约剩余系 (n_221)"
sub_topics:
  - "原根的存在性条件（m = 2, 4, p^k, 2p^k）"
  - "既约剩余系的循环群结构"
  - "寻找原根的试除算法"
  - "原根在构造离散指数表中的作用"
llm_physical_mapping: "mundane physical metaphor (a master key that can visit every single room in a building exactly once before returning to the start)."
code_implementation: |
  import torch
  import math

  def is_primitive_root_torch(a: int, m: int) -> bool:
      if math.gcd(a, m) != 1:
          return False
          
      coprimes = [x for x in range(1, m) if math.gcd(x, m) == 1]
      phi_m = len(coprimes)
      
      powers = torch.zeros(phi_m, dtype=torch.long)
      current = 1
      for i in range(phi_m):
          current = (current * a) % m
          powers[i] = current
          
      unique_powers = torch.unique(powers)
      return len(unique_powers) == phi_m
v8_sanity_audit:
  sympy_pseudo_code: |
    from sympy import primitive_root
    
    m = 7
    root = primitive_root(m)
    assert root == 3
