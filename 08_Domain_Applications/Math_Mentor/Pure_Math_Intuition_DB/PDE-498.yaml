llm_physical_mapping: "A thick rubber band stretched across a bumpy landscape. To find the shortest path (geodesic), the rubber band slides and shifts until tension is perfectly balanced. If we take any tiny segment of the band and nudge it slightly left or right, the tension force instantly pulls it back. The Euler-Lagrange equation is the mathematical test ensuring this localized tension balance holds at every single millimeter."
code_implementation: |
  import torch

  def brachistochrone_gradient_descent(num_points=100, lr=0.001, epochs=1000):
      x = torch.linspace(0, 1, num_points)
      dx = 1.0 / (num_points - 1)
      
      y = torch.linspace(0.001, 1, num_points, requires_grad=True)
      optimizer = torch.optim.SGD([y], lr=lr, momentum=0.9)
      
      for _ in range(epochs):
          optimizer.zero_grad()
          
          y_prime = (y[1:] - y[:-1]) / dx
          y_mid = (y[1:] + y[:-1]) / 2.0
          
          integrand = torch.sqrt(1 + y_prime**2) / torch.sqrt(y_mid)
          time_integral = torch.sum(integrand * dx)
          
          time_integral.backward()
          
          with torch.no_grad():
              y.grad[0] = 0.0 
              y.grad[-1] = 0.0 
          
          optimizer.step()
          
      return y.detach()
v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy as sp

    x = sp.Symbol('x', real=True)
    y = sp.Function('y')(x)
    y_prime = sp.diff(y, x)

    L = sp.sqrt(1 + y_prime**2)

    dL_dy = sp.diff(L, y)
    dL_dyprime = sp.diff(L, y_prime)

    euler_lagrange = sp.diff(dL_dyprime, x) - dL_dy

    expected_el = sp.diff(y, x, 2) / (1 + y_prime**2)**(3/sp.Rational(2,1))
    
    assert sp.simplify(euler_lagrange - expected_el) == 0, "Shortest path EL equation derives to y'' = 0"
