code_implementation: |
  import torch
  import numpy as np
  # Calculate capacity of a simple binary symmetric channel
  p = 0.1  # crossover probability
  capacity = 1 - (-p * np.log2(p) - (1-p) * np.log2(1-p))
  print('Capacity:', capacity)
v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy as sp
    p = sp.Symbol('p', real=True)
    H_p = -p*sp.log(p, 2) - (1-p)*sp.log(1-p, 2)
    C = 1 - H_p
    assert sp.simplify(C.subs(p, sp.Rational(1, 2))) == 0
