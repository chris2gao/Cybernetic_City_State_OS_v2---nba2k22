  title: "分数与小数 (fractions_and_decimals) - 分数的四则运算逻辑推导 (n_58)"
  description: "Logical derivations for the four arithmetic operations involving fractions, including unit unification for addition/subtraction, area models for multiplication, algebraic proofs for division rules, and strategies for complex fractions."
