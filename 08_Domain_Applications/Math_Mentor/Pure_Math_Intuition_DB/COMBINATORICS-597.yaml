code_implementation: |
  import sympy as sp
  
  def finite_field_line_eval(a, b, p):
      # Evaluates the line y = (ax + b) mod p over finite field F_p
      # Points on this line can act as redundant shares
      points = []
      for x in range(p):
          y = (a * x + b) % p
          points.append((x, y))
      return points
