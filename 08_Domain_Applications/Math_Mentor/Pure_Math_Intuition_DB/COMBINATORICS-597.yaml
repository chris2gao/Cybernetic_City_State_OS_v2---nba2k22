    import sympy as sp
    
    p = 5
    a = 2
    b = 1
    # y = 2x + 1 mod 5
    # x=0 -> y=1
    # x=1 -> y=3
    pts = [(x, (a*x + b) % p) for x in range(p)]
    
    assert pts[0] == (0, 1)
