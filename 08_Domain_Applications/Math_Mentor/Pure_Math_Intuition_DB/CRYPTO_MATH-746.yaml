code_implementation: |
  import torch

  def dh_key_exchange(base, prime, secret_a, secret_b):
      public_a = torch.pow(torch.tensor(base), secret_a) % prime
      public_b = torch.pow(torch.tensor(base), secret_b) % prime
      
      shared_key_a = torch.pow(public_b, secret_a) % prime
      shared_key_b = torch.pow(public_a, secret_b) % prime
      return shared_key_a, shared_key_b
