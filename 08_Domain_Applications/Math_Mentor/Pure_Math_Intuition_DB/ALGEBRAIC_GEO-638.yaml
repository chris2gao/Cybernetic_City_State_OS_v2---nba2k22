code_implementation: |
  import numpy as np
  
  def count_betti_number_0(adjacency_matrix):
      degree_matrix = np.diag(np.sum(adjacency_matrix, axis=1))
      laplacian = degree_matrix - adjacency_matrix
      eigenvalues = np.linalg.eigvals(laplacian)
      betti_0 = np.sum(np.isclose(eigenvalues, 0.0, atol=1e-5))
      return int(betti_0)
      
  adj = np.array([[0,1,0], [1,0,0], [0,0,0]])
  holes = count_betti_number_0(adj)
legacy_v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy as sp
    x, y = sp.symbols('x y')
    f = x**2 + y**2
    dF_dx = sp.diff(f, x)
    dF_dy = sp.diff(f, y)
    assert sp.simplify(sp.diff(dF_dx, y) - sp.diff(dF_dy, x)) == 0
