name: "三角函数图像 - 正切与余切的渐近线图与周期 π 的代数解释 (n_187)"
sub_topics:
  - 正切函数的图像特征与中心对称性
  - 垂直渐近线 x = kπ + π/2 的发生学成因
  - 正切周期为 π 的代数推导
  - 余切函数图像的翻转与平移对应关系
llm_physical_mapping: "projecting a beam of light from the center of a room onto a straight flat wall."
code_implementation:
  language: python
  code: |
    import torch
    import math
    
    x = torch.linspace(-2 * math.pi, 2 * math.pi, 2000)
    y = torch.tan(x)
    
    # tan has period pi: tan(x + pi) = tan(x), away from asymptotes.
    sample = torch.tensor([-1.0, -0.3, 0.2, 0.8], dtype=torch.float64)
    assert torch.allclose(torch.tan(sample + math.pi), torch.tan(sample), atol=1e-10)
    
    asymptotes = []
    for k in range(-2, 3):
        asymptotes.append(k * math.pi + math.pi / 2)

    assert len(asymptotes) == 5
    assert torch.isfinite(y).any()
