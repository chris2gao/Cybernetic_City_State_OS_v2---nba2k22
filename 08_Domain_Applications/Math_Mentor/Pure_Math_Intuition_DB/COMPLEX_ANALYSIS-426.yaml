code_implementation: |
  import sympy as sp
  z = sp.symbols('z')
  f_pole = 1 / z**3
  f_removable = sp.sin(z) / z
  f_essential = sp.exp(1/z)
  laurent_pole = f_pole.series(z, 0, 2)
  laurent_removable = f_removable.series(z, 0, 4)
