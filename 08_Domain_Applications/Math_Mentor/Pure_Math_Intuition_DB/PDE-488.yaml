llm_physical_mapping: "两把梳子的齿相互交叠（卷积）。在空间域里，这需要计算每一个齿与另一个齿的重叠度；但如果我们在频域观察梳子的频率，两者的组合效应只是各自频率特征的简单乘积，极大降低了计算复杂度。"
code_implementation: |
  import torch

  def fourier_convolution(f, g):
      F_f = torch.fft.fft(f)
      F_g = torch.fft.fft(g)
      F_conv = F_f * F_g
      conv = torch.fft.ifft(F_conv).real
      return conv
v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy as sp

    x, k = sp.symbols('x k', real=True)
    f1 = sp.exp(-x**2)
    f2 = sp.exp(-x**2)
    conv = sp.sqrt(sp.pi / 2) * sp.exp(-x**2 / 2)
    F_conv = sp.fourier_transform(conv, x, k)
    F1 = sp.fourier_transform(f1, x, k)
    F2 = sp.fourier_transform(f2, x, k)
    diff = sp.simplify(F_conv - F1 * F2)
    assert diff == 0, 'Convolution theorem check failed'
