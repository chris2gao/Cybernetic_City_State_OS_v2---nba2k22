concept_node:
  id: "PROOF_METHODS-005"
  domain: "proof_methods"
  name: "良基归纳法 (Well-founded induction)"
  sub_topics:
    - '良基关系定义'
    - '良序集合与最小元性质'
    - '无无穷递降链条件'
    - '结构归纳法的推广'
  description: >
    良基归纳法（Well-founded induction）是数学归纳法和结构归纳法的推广。只要在一个集合上存在一个“良基关系”（即不存在无限递降链的关系，或者该关系的任意非空子集都有极小元），就可以使用良基归纳法。为了证明所有元素都具有某种性质P，只需证明：如果对于所有在这个关系下严格小于x的元素y，P(y)都成立，那么P(x)也必然成立。
  llm_physical_mapping: |
    Mundane Physical Metaphor: 
    想象你正在拆解一个极其复杂的俄罗斯套娃集合，有些套娃里面可能装了多个小套娃，或者甚至什么都不装。
    良基归纳法就像是这样的规则：
    "只要你能证明：如果你能顺利打开并清点完某个套娃内部的所有更小的套娃，你就能打开并清点当前这个稍大一点的套娃"。
    由于套娃不可能无限缩小且必须有限嵌套（无无穷递降链，即良基关系），总有一些最内层的实心娃娃。
    对于最内层的娃娃，其内部没有任何小娃娃，因此"内部套娃全部清点完毕"这个前提自动成立（空真），这正是基础情况。
    因此，按照这个通用的递推规则，你必然能打开并清点所有的套娃。
  code_implementation: |
    # PyTorch conceptual demonstration of Well-founded Induction
    import torch

    def well_founded_induction_demo():
        # Represent a directed acyclic graph (DAG) where edges represent the well-founded relation.
        # Adjacency matrix depends_on[i, j] = True means j < i in the well-founded relation.
        # There are no infinite descending chains (no cycles).
        # Nodes: 0, 1, 2, 3
        # 0 depends on nothing (minimal element).
        # 1 depends on 0.
        # 2 depends on 0, 1.
        # 3 depends on 1, 2.
        
        N = 4
        depends_on = torch.tensor([
            [False, False, False, False], # 0 has no dependencies
            [True,  False, False, False], # 1 depends on 0
            [True,  True,  False, False], # 2 depends on 0 and 1
            [False, True,  True,  False]  # 3 depends on 1 and 2
        ], dtype=torch.bool)
        
        # P[i] represents whether property P holds for node i
        P = torch.zeros(N, dtype=torch.bool)
        
        # Well-founded induction step:
        # P(x) becomes True if for all y < x, P(y) is True.
        
        # We iteratively apply the induction rule until no more properties change.
        for _ in range(N):
            for x in range(N):
                # Get the dependencies for x
                deps = depends_on[x]
                # Check if all y < x satisfy P(y)
                # Equivalently, for all y, if deps[y] is True, then P[y] must be True.
                # Logic: ~deps[y] | P[y]
                if torch.all(~deps | P):
                    P[x] = True
                    
        return P.all().item() # Should return True, meaning P holds for all elements
        
    print("Does property P hold for all elements?", well_founded_induction_demo())
  v8_sanity_audit:
    sympy_pseudo_code: |
      import sympy
      from sympy.logic.boolalg import And, Or, Implies
      
      # Let elements be a, b, c where the well-founded relation is c > b > a
      # P_a, P_b, P_c represent the property P holding for elements a, b, c.
      Pa, Pb, Pc = sympy.symbols('P_a P_b P_c')
      
      # Base case (minimal element 'a' has no predecessors)
      # "For all y < a, P(y)" is vacuously true.
      # Thus, the implication "If for all y < a, P(y), then P(a)" simplifies to:
      step_a = Implies(True, Pa)
      
      # Inductive step for 'b': b > a. Predecessors of b is {a}.
      # If P holds for all predecessors, then P holds for b.
      step_b = Implies(Pa, Pb)
      
      # Inductive step for 'c': c > b, c > a. Predecessors of c is {a, b}.
      step_c = Implies(And(Pa, Pb), Pc)
      
      # According to well-founded induction, if the induction steps hold for all elements,
      # then the property holds for all elements.
      induction_hypothesis = And(step_a, step_b, step_c)
      conclusion = And(Pa, Pb, Pc)
      
      # Theorem: The induction hypothesis logically entails the conclusion
      theorem = Implies(induction_hypothesis, conclusion)
      
      # Simplify the logic to see if it is a tautology (always True)
      is_valid = sympy.simplify_logic(theorem) == True
      assert is_valid, "Well-founded induction logic is sound and validated by sympy"
