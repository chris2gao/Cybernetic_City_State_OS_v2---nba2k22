name: 泊松过程 - 发生学溯源：在连续时间轴上，“极度稀有但必定会发生”事件的爆发计数器。 (n_552)
sub_topics:
  - 独立增量性与平稳增量性
  - 到达间隔的指数分布特性
  - 泊松强度的物理定义 (λ)
  - 物理直觉：无记忆性的离散事件流
llm_physical_mapping: A Geiger counter measuring radiation from a piece of uranium, where individual atomic decays happen independently at unpredictable but statistically stable continuous times.
code_implementation: |
  import torch

  # Poisson process: Geiger counter detecting radioactive decay clicks
  decay_rate = 2.0 # average clicks per second
  num_clicks = 100

  # Time between clicks follows an exponential distribution
  inter_click_times = -torch.log(torch.rand(num_clicks)) / decay_rate
  click_timestamps = torch.cumsum(inter_click_times, dim=0)

  # The total time taken for num_clicks
  total_time = click_timestamps[-1].item()
  simulated_rate = num_clicks / total_time
  # Should be close to decay_rate
  assert abs(simulated_rate - decay_rate) / decay_rate < 0.5
v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy as sp
    lmbda, t = sp.symbols('lambda t', positive=True)
    k = sp.Symbol('k', integer=True, nonnegative=True)
    P_k = (lmbda*t)**k * sp.exp(-lmbda*t) / sp.factorial(k)
    total_prob = sp.summation(P_k, (k, 0, sp.oo))
    assert sp.simplify(total_prob) == 1, "Poisson probabilities do not sum to 1"
