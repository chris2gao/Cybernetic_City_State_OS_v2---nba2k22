llm_physical_mapping: "mundane physical metaphor: a rotating centrifugal governor on a steam engine. The machine works perfectly and predictably up to a critical operational speed (convergence radius); spinning it any faster causes the mechanical components to violently fly apart."
code_implementation: |
  import sympy as sp
  n = sp.Symbol('n', integer=True)
  # Coefficient ratio for the power series exp(z) = sum z^n / n!
  coeff = 1 / sp.factorial(n)
  ratio = sp.limit(coeff.subs(n, n+1) / coeff, n, sp.oo)
  # R = 1/ratio = oo
