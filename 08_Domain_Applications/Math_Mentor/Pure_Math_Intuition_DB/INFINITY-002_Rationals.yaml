id: "INFINITY-002_Rationals"
title: "Rational Numbers Infinity"
sub_topics: 
  - "Dense Sets"
  - "Equivalence to Aleph-0"
  - "Fractions"
llm_physical_mapping: |
  Maps to the Softmax probability distribution over the discrete vocabulary. While the vocabulary is Aleph-0 (discrete tokens), the output of the LM Head generates rational/fractional probabilities summing to 1. This creates a dense probability space, but fundamentally, because it acts on a discrete set of tokens, its structural cardinality remains tied to Aleph-0. It also connects to PagedAttention, where continuous memory is divided into discrete rational chunks (Blocks).
code_implementation: |
  def forward_rationals_density(logits: torch.Tensor) -> torch.Tensor:
      # Convert raw logits to a dense probability distribution (rational fractions)
      # Each element is p_i = exp(l_i) / sum(exp(l_j))
      probabilities = torch.softmax(logits, dim=-1)
      return probabilities
v8_sanity_audit:
  sympy_pseudo_code: |
    import torch
    
    def test_rational_probabilities():
        logits = torch.tensor([1.0, 1.0, 1.0, 1.0])
        probs = torch.softmax(logits, dim=-1)
        # The sum of fractions is 1, creating a dense but countable mapping over tokens
        assert torch.allclose(torch.sum(probs), torch.tensor(1.0))
        assert probs[0].item() == 0.25
