concept_name: "稳定性分析 - 平衡点分类：结点 (Nodes)、鞍点 (Saddles)、焦点 (Spirals) 与中心 (Centers) (n_450)"
sub_topics:
  - "雅可比矩阵在平衡点处的局部线性化"
  - "特征根分布与相轨迹拓扑形状的对应"
  - "吸引子与排斥子的动力学判定"
  - "奇点附近的局部流形结构分析"
llm_physical_mapping: "mundane physical metaphor: Picture a marble rolling on a topographic map. A node is a clean bowl (rolls to the bottom) or a sharp peak (rolls away). A saddle is a mountain pass where it rolls in from one direction but falls away in another. A spiral is a funnel where it circles down to the drain. A center is a perfectly frictionless bowl where the marble rolls in endless circles around the bottom without ever settling."
code_implementation: |
  import sympy as sp
  
  x, y = sp.symbols('x y')
  # Define a non-linear system
  P = x - y - x * (x**2 + y**2)
  Q = x + y - y * (x**2 + y**2)
  
  # Jacobian matrix
  J = sp.Matrix([[sp.diff(P, x), sp.diff(P, y)], 
                 [sp.diff(Q, x), sp.diff(Q, y)]])
  
  # Evaluate at origin (0, 0)
  J_origin = J.subs({x: 0, y: 0})
v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy as sp
    
    # Saddle point system: dx/dt = x, dy/dt = -y
    J = sp.Matrix([[1, 0], [0, -1]])
    eigenvals = J.eigenvals()
    
    # A saddle has one positive and one negative real eigenvalue
    has_pos = False
    has_neg = False
    for val in eigenvals:
        if val > 0: has_pos = True
        if val < 0: has_neg = True
    assert has_pos and has_neg
