concept_name: "分离变量 - 结合本征值问题的解析解构造 (n_486)"
canonical_concept: "separation_of_variables_eigenvalue_problem"
domain: "Partial Differential Equations / Boundary Value Problems"
symbol: "u(x,t)=X(x)T(t), lambda_n, y_n"

sub_topics:
  - "施图姆-刘维尔 (Sturm-Liouville) 问题的引入"
  - "本征函数序列的正交性与完备性"
  - "解析解作为模态叠加的广义级数形式"
  - "在经典物理问题（如琴弦振动）中的完整应用"

pure_math_definition:
  english: |-
    A regular Sturm-Liouville problem on [a, b] asks for pairs (lambda, y) with
    y not identically zero satisfying -(p y')' + q y = lambda w y together with
    separated homogeneous boundary conditions, where p, w > 0. Its eigenvalues
    are real and its eigenfunctions belonging to distinct eigenvalues are
    orthogonal with respect to the weight w.

    Separation of variables seeks solutions u(x,t) = X(x)T(t). Substituting into
    a linear homogeneous PDE and dividing by the product forces a function of x
    alone to equal a function of t alone, hence both equal a constant; that
    constant is the eigenvalue and the spatial factor solves a Sturm-Liouville
    problem. For the string u_tt = c^2 u_xx on [0, L] with u(0,t)=u(L,t)=0, the
    eigenpairs are y_n(x) = sin(n pi x / L) with lambda_n = (n pi / L)^2, and the
    general solution is the superposition sum over n of
    (A_n cos(c n pi t / L) + B_n sin(c n pi t / L)) sin(n pi x / L).

    Orthogonality is what makes the coefficients recoverable: integrating the
    initial data against y_n and dividing by ||y_n||^2 = L/2 isolates A_n.
  chinese: |-
    区间 [a, b] 上的正则施图姆-刘维尔问题，是求满足 -(p y')' + q y = lambda w y
    及分离型齐次边界条件的非零解对 (lambda, y)，其中 p、w > 0。其本征值为实数，
    且属于不同本征值的本征函数关于权 w 正交。

    分离变量法寻找 u(x,t) = X(x)T(t) 形式的解。代入线性齐次方程并除以该乘积后，
    只依赖 x 的一侧必须等于只依赖 t 的一侧，故两侧同为常数；该常数即本征值，
    空间因子满足一个施图姆-刘维尔问题。对 [0, L] 上的弦振动 u_tt = c^2 u_xx，
    边界条件 u(0,t)=u(L,t)=0，本征对为 y_n(x) = sin(n pi x / L)、
    lambda_n = (n pi / L)^2，通解是各模态的叠加
    sum_n (A_n cos(c n pi t / L) + B_n sin(c n pi t / L)) sin(n pi x / L)。

    正交性正是系数可提取的原因：把初值与 y_n 作内积并除以 ||y_n||^2 = L/2
    即可分离出 A_n。

