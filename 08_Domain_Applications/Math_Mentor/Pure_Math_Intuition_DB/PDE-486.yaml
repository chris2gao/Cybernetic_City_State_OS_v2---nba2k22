mode_a_intuition:
  occurrence_crisis:
    english: "A PDE couples space and time at every point, so there is no obvious place to start integrating. Unless the coupling can be broken, the problem resists the ODE techniques already available."
    chinese: "偏微分方程在每一点上都把空间与时间耦合在一起，无从下手积分。若不能拆开这层耦合，已有的常微分方程手段就用不上。"
  primary:
    english: |-
      Pluck a guitar string clamped at both ends. The motion decomposes into the
      fundamental and its harmonics: each is a fixed spatial shape whose
      amplitude rises and falls in time, and the clamped ends force exactly which
      shapes can survive. Separation of variables is the algebraic form of that
      observation - posit that shape and timing factor apart, and the equation
      plus the boundary conditions tell you which shapes are admissible (the
      eigenfunctions) and how fast each oscillates (the eigenvalues).

      The string is the primary model because it is exactly the case this node
      verifies. A struck drumhead is the same IDEA in two dimensions, but its
      modes are Bessel-type, not sines; use it only as a bounded illustration of
      "modes superpose", never as the worked instance.
    chinese: |-
      拨一根两端固定的吉他弦。运动分解为基频与各次谐波：每个都是固定的空间形状，
      振幅随时间起落，而固定的两端恰好决定了哪些形状能够存活。分离变量正是这一
      观察的代数形式——先假定「形状」与「节奏」可以分开，方程连同边界条件会告诉
      你哪些形状被允许（本征函数）、每个振动多快（本征值）。

      以弦为主模型，是因为它正是本节点实际验证的情形。敲击的鼓面是同一**想法**
      在二维的版本，但其模态属贝塞尔型而非正弦；只可用作「模态可叠加」的有界示意，
      绝不可当作算例。
  limitations:
    english: "The string picture presumes linearity, homogeneous boundary conditions, and a separable setting. Nonlinear equations do not superpose; inhomogeneous problems need extra treatment; and linearity alone does not make a problem separable."
    chinese: "弦的图景以线性、齐次边界条件与可分离设置为前提。非线性方程不满足叠加原理；非齐次问题需另行处理；且仅有线性性并不使问题可分离。"

llm_physical_mapping: "敲击一面鼓，鼓面的复杂震动可以分解为多个基本震动模式（本征态）的叠加。每个本征态都有特定的空间驻波形状。整个过程就是用一组正交的空间振动基底拼凑出任意的初始敲击状态。"

mapping_boundary:
  status: "semantic_only_review_required"
  valid_uses:
    - "motivating why only discrete shapes survive the boundary conditions / 说明为何只有离散的形状能满足边界条件"
    - "reading modal superposition as rebuilding initial data from an orthogonal basis / 把模态叠加读作用正交基重建初值"
    - "explaining why orthogonality lets each coefficient be extracted independently / 解释正交性为何让系数可以逐个独立提取"
  invalid_inferences:
    - "Linear and homogeneous does NOT imply separable. Separability additionally requires the operator, coefficients, domain and boundary conditions to separate in the chosen coordinates; the audit includes the counterexample x*y*u_xx + u_yy = 0. / 线性齐次**不蕴含**可分离；还需算子、系数、区域与边界条件在所选坐标下可分离。审计含反例 x*y*u_xx + u_yy = 0。"
    - "Superposition requires linearity; the string analogy must not be carried to nonlinear PDEs. / 叠加依赖线性性，弦的类比不得推广到非线性方程。"
    - "A drumhead is a 2D membrane with Bessel-type modes; the worked case here is the 1D string. Do not conflate the two mode families. / 鼓面是二维膜、模态属贝塞尔型；此处算例是一维弦，两族模态不可混同。"
    - "Orthogonality of eigenfunctions is proved for distinct eigenvalues; it is not an assumption about arbitrary function pairs. / 本征函数正交性是对不同本征值证明的，不是关于任意函数对的假设。"
    - "Orthogonality does NOT imply completeness. Recovering coefficients of a known finite combination uses orthogonality alone and proves nothing about representing arbitrary initial data. / 正交性**不蕴含**完备性。从已知有限组合还原系数只用到正交性，不能说明可表示任意初值。"
    - "Verifying finitely many modes does NOT verify the infinite series; convergence and its sense must be stated separately. / 验证有限个模态**不等于**验证无穷级数；收敛性及其意义须另行声明。"
    - "The sign convention for the separation constant must be fixed before eigenvalues are named; the opposite convention flips the sign of lambda. / 分离常数的符号约定须在命名本征值前固定；相反约定会翻转 lambda 的符号。"
    - "The regular Sturm-Liouville conclusions require the stated regularity and self-adjoint boundary conditions; p, w > 0 alone is not sufficient. / 正则 S-L 的结论依赖所述正则性与自伴边界条件；仅有 p、w > 0 并不充分。"

common_misconceptions:
  - signature: "separation_assumed_always_valid"
    description: "学生把 u=X(x)T(t) 当作普遍成立的解形式，用到非线性或非齐次边界问题上。"
    repair_direction: "回到推导的那一步除法：它要求方程线性齐次；举一个非线性反例说明两侧无法各自成常数。"
  - signature: "orthogonality_taken_as_given"
    description: "学生认为任意两个正弦函数都正交，不追问区间与边界条件的作用。"
    repair_direction: "让学生在 [0,L] 上实算 n≠m 与 n=m 两种积分，看出 L/2 与 0 的差别来自边界条件选出的频率。"
  - signature: "eigenvalue_confused_with_amplitude"
    description: "学生把本征值 lambda_n 与系数 A_n 混为一谈，以为大本征值意味着大振幅。"
    repair_direction: "分开两问：lambda_n 由方程与边界条件决定（形状与频率），A_n 由初值经正交投影决定（各模态占多少）。"

