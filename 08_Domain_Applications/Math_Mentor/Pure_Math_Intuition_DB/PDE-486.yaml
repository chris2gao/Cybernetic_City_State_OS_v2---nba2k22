    - "A real drumhead is a 2D membrane with Bessel-type modes; the worked case here is the 1D string. Do not conflate the two mode families. / 真实鼓面是二维膜、模态属贝塞尔型；此处算例是一维弦，两族模态不可混同。"
    - "Orthogonality of eigenfunctions is proved for distinct eigenvalues; it is not an assumption about arbitrary function pairs. / 本征函数正交性是对不同本征值证明的，不是关于任意函数对的假设。"
    - "This node does not establish completeness of the eigenbasis or convergence of the series; those are cited textbook results. / 本节点不建立本征基的完备性或级数收敛性，二者是引用的教科书结论。"

common_misconceptions:
  - signature: "separation_assumed_always_valid"
    description: "学生把 u=X(x)T(t) 当作普遍成立的解形式，用到非线性或非齐次边界问题上。"
    repair_direction: "回到推导的那一步除法：它要求方程线性齐次；举一个非线性反例说明两侧无法各自成常数。"
  - signature: "orthogonality_taken_as_given"
    description: "学生认为任意两个正弦函数都正交，不追问区间与边界条件的作用。"
    repair_direction: "让学生在 [0,L] 上实算 n≠m 与 n=m 两种积分，看出 L/2 与 0 的差别来自边界条件选出的频率。"
  - signature: "eigenvalue_confused_with_amplitude"
    description: "学生把本征值 lambda_n 与系数 A_n 混为一谈，以为大本征值意味着大振幅。"
    repair_direction: "分开两问：lambda_n 由方程与边界条件决定（形状与频率），A_n 由初值经正交投影决定（各模态占多少）。"

