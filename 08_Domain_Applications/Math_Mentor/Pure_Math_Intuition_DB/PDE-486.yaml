code_implementation: |
  import torch

  def fourier_series_reconstruction(x, coeffs):
      u = torch.zeros_like(x)
      for n, (a, b) in enumerate(coeffs, start=1):
          u += a * torch.cos(n * x) + b * torch.sin(n * x)
      return u

v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy as sp

    x = sp.Symbol('x', real=True)
    L = sp.Symbol('L', real=True, positive=True)
    y1 = sp.sin(1 * sp.pi * x / L)
    y2 = sp.sin(2 * sp.pi * x / L)
    assert sp.simplify(sp.integrate(y1 * y2, (x, 0, L))) == 0
    assert sp.simplify(sp.integrate(y1 * y1, (x, 0, L)) - L / 2) == 0
    assert sp.simplify(sp.diff(y1, x, 2) + (sp.pi / L) ** 2 * y1) == 0
