pure_math_definition:
  english: |-
    Regular Sturm-Liouville problem. On a finite interval [a, b], seek pairs
    (lambda, y) with y not identically zero satisfying
    -(p y')' + q y = lambda w y, subject to separated homogeneous boundary
    conditions that make the operator self-adjoint. Regularity requires p
    continuously differentiable, q and w continuous, and p, w strictly positive
    on the closed interval. Under these hypotheses the eigenvalues are real and
    form an increasing unbounded sequence, and eigenfunctions belonging to
    distinct eigenvalues are orthogonal with respect to the weight w.

    Separation of variables. The method ATTEMPTS solutions u(x,t) = X(x)T(t).
    Being linear and homogeneous is NOT sufficient: separation succeeds only when
    the operator, its coefficients, the domain and the boundary conditions are
    themselves separable in the chosen coordinates. When it does succeed,
    dividing by X T makes one side depend on x alone and the other on t alone, so
    both equal a constant. With the convention X'' / X = -lambda, that constant is
    the eigenvalue and X solves a Sturm-Liouville problem. (The opposite sign
    convention appears in the literature; the sign must be fixed before the
    eigenvalues are named.)

    Worked instance: the string. For u_tt = c^2 u_xx on [0, L] with
    u(0,t) = u(L,t) = 0, the eigenpairs are y_n(x) = sin(n pi x / L) with
    lambda_n = (n pi / L)^2. Any finite superposition
    sum (A_n cos(c n pi t / L) + B_n sin(c n pi t / L)) sin(n pi x / L)
    solves the equation and the boundary conditions. The corresponding infinite
    series represents the solution for admissible initial data that is compatible
    with the boundary conditions and lies in the appropriate space; the sense of
    convergence (pointwise, uniform, or L^2) must be stated and is not supplied by
    this node.

    Coefficient recovery. Orthogonality is what makes coefficients extractable:
    integrating the initial data against y_n and dividing by ||y_n||^2 = L/2
    isolates A_n. This step uses orthogonality only. COMPLETENESS of the
    eigenfunction system - that the series can represent every admissible initial
    state - is a separate theorem, cited here and not established by this node.
  chinese: |-
    正则施图姆-刘维尔问题。在有限区间 [a, b] 上，求满足
    -(p y')' + q y = lambda w y 的非零解对 (lambda, y)，并配以使算子自伴的分离型
    齐次边界条件。正则性要求 p 连续可微、q 与 w 连续，且 p、w 在闭区间上严格为正。
    在这些假设下，本征值为实数并构成递增无界序列，属于不同本征值的本征函数关于
    权 w 正交。

    分离变量。该方法**尝试** u(x,t) = X(x)T(t) 形式的解。线性齐次**并不充分**：
    只有当算子、系数、区域与边界条件在所选坐标下本身可分离时，分离才成立。
    成立时，除以 X T 使一侧只依赖 x、另一侧只依赖 t，故两侧同为常数。采用
    X'' / X = -lambda 的约定，该常数即本征值，X 满足一个施图姆-刘维尔问题。
    （文献中也有相反的符号约定；命名本征值之前必须先固定符号。）

    具体算例：弦振动。对 [0, L] 上的 u_tt = c^2 u_xx，边界条件
    u(0,t) = u(L,t) = 0，本征对为 y_n(x) = sin(n pi x / L)、
    lambda_n = (n pi / L)^2。任意**有限**叠加
    sum (A_n cos(c n pi t / L) + B_n sin(c n pi t / L)) sin(n pi x / L)
    满足方程与边界条件。相应的无穷级数在初值容许（与边界条件相容且属于适当空间）
    时表示解；收敛意义（逐点、一致或 L^2）必须显式声明，本节点不提供。

    系数提取。正交性正是系数可提取的原因：把初值与 y_n 作内积并除以
    ||y_n||^2 = L/2 即可分离出 A_n。该步骤**仅**用到正交性。本征函数系的
    **完备性**——即级数能表示任意容许初态——是另一条定理，此处为引用，
    本节点不予建立。

assumptions_and_notation:
  - "L > 0 and c > 0 are real constants; n, m range over positive integers. / L > 0、c > 0 为实常数；n、m 取正整数。"
