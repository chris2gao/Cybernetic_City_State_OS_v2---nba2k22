mode_a_intuition:
  occurrence_crisis:
    english: "A PDE couples space and time at every point, so there is no obvious place to start integrating. Unless the coupling can be broken, the problem resists the ODE techniques already available."
    chinese: "偏微分方程在每一点上都把空间与时间耦合在一起，无从下手积分。若不能拆开这层耦合，已有的常微分方程手段就用不上。"
  primary:
    english: |-
      Strike a drumhead: the complicated motion decomposes into a few basic
      standing-wave patterns, each keeping its shape while its amplitude rises
      and falls. Separation of variables is the algebraic form of that
      observation - assume shape and timing factor apart, and the equation itself
      tells you which shapes are allowed (the eigenfunctions) and how fast each
      one oscillates (the eigenvalues).
    chinese: |-
      敲一面鼓：复杂的运动可以分解为若干基本驻波形状，每个形状保持不变，只是
      振幅随时间起落。分离变量正是这一观察的代数形式——先假定“形状”与“节奏”
      可以分开，方程本身会告诉你哪些形状被允许（本征函数）、每个形状振动多快
      （本征值）。
  limitations:
    english: "The drum picture presumes linearity and homogeneous boundary conditions. Nonlinear equations do not superpose, and inhomogeneous problems need extra treatment before this method applies."
    chinese: "鼓面图景以线性与齐次边界条件为前提。非线性方程不满足叠加原理，非齐次问题需另行处理后才适用本方法。"

llm_physical_mapping: "敲击一面鼓，鼓面的复杂震动可以分解为多个基本震动模式（本征态）的叠加。每个本征态都有特定的空间驻波形状。整个过程就是用一组正交的空间振动基底拼凑出任意的初始敲击状态。"

