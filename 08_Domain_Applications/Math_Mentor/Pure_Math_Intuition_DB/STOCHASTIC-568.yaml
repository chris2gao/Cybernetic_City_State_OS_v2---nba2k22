name: 高斯过程 - 定义：任何有限维子集都服从联合正态分布的随机过程。 (n_568)
domain: STOCHASTIC
sub_topics:
  - 均值函数与核函数 (Kernel) 的完全决定性
  - 核矩阵的正定性要求
  - 无限维正态分布的闭式映射
  - 线性算子在高斯过程上的作用性质
llm_physical_mapping:
  metaphor: A vast net of coupled springs connected to a grid of masses in thermal
    equilibrium. Observing any finite number of these masses will show a multivariate
    normal distribution of displacements governed by the structural spring stiffness
    matrix (covariance kernel).
code_implementation:
  pytorch_simulation: "import torch\n\ndef rbf_kernel(x1, x2, length_scale=1.0):\n\
    \    dist_matrix = torch.cdist(x1, x2)**2\n    return torch.exp(-dist_matrix /\
    \ (2 * length_scale**2))\n\n# Define finite points\nX = torch.linspace(0, 5, 100).unsqueeze(-1)\n\
    K = rbf_kernel(X, X)\n\n# Add jitter for numerical stability\nK += 1e-6 * torch.eye(100)\n\
    \n# Sample from the GP (finite subset joint distribution)\nmean = torch.zeros(100)\n\
    dist = torch.distributions.MultivariateNormal(mean, K)\nsample = dist.sample()\n"
v8_sanity_audit:
  sympy_pseudo_code: 'import sympy as sp


    x, y, l = sp.symbols(''x y l'', real=True)

    # RBF Kernel definition

    K = sp.exp(-(x - y)**2 / (2 * l**2))

    # Symmetry of kernel

    assert sp.simplify(K - K.subs([(x, y), (y, x)], simultaneous=True)) == 0

    # Maximum at x=y is 1

    assert sp.simplify(K.subs(x, y) - 1) == 0

    '
