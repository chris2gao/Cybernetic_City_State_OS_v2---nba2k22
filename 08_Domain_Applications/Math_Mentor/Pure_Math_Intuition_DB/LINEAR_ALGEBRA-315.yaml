id: "LINEAR_ALGEBRA-315"
concept_name: "行列式 - 逆序数与行列式的代数展开 (n_315)"
sub_topics:
  - "排列与逆序数的定义"
  - "行列式的全排列定义式"
  - "代数余子式与拉普拉斯展开 (Laplace Expansion)"
  - "行列式的性质：行交换变号、倍加不变性"
llm_physical_mapping: "volume changes: Computing the determinant via permutations algebraically breaks down how each basis vector stretches and flips volume along orthogonal axes. Row swaps invert the sign, reflecting the flipping of spatial orientation."
code_implementation: |
  import sympy as sp
  
  # 3x3 matrix determinant via permutations
  A = sp.Matrix([[1, 2, 3], [0, 4, 5], [0, 0, 6]])
  
  # Lower triangular matrix volume scaling is product of diagonals
  det_A = A.det()
v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy as sp
    A = sp.Matrix([[1, 2, 3], [0, 4, 5], [0, 0, 6]])
    # Laplace expansion or direct det
    assert A.det() == 1 * 4 * 6
