  concept_name: "偏序关系的定义（自反、反对称、传递）"
  domain: "posets_and_lattices"
  sub_topics:
    - "自反性性质"
    - "反对称性性质"
    - "传递性性质"
    - "偏序集 (Poset) 的形式定义"
  llm_physical_mapping:
    metaphor: "A corporate hierarchy or an organization chart."
    description: "Imagine a company's management structure. A person can 'report to' themselves in the sense that they are accountable for their own work (reflexive). If Alice reports to Bob, Bob cannot report to Alice unless they are the same role/person (antisymmetric). If Alice reports to Bob, and Bob reports to Charlie, then Alice effectively falls under Charlie's command chain (transitive). Not everyone has a direct or indirect reporting line to everyone else, hence it is a 'partial' order."
  code_implementation:
    language: "python"
    framework: "pytorch"
    snippet: |
      import torch

      def is_poset(relation_matrix: torch.Tensor) -> bool:
          """
          relation_matrix: boolean N x N tensor where R[i, j] means i <= j
          """
          N = relation_matrix.size(0)
          
          # 1. Reflexive: diagonal must be all True
          reflexive = torch.all(torch.diagonal(relation_matrix))
          
          # 2. Antisymmetric: R[i, j] and R[j, i] implies i == j
          # Equivalently, R and R.T can only overlap on the diagonal
          off_diagonal_overlap = (relation_matrix & relation_matrix.T).clone()
          off_diagonal_overlap.fill_diagonal_(False)
          antisymmetric = not torch.any(off_diagonal_overlap)
          
          # 3. Transitive: R[i, j] and R[j, k] implies R[i, k]
          # Matrix multiplication (boolean) R @ R should be a subset of R
          R_float = relation_matrix.float()
          transitive_paths = torch.matmul(R_float, R_float) > 0
          transitive = torch.all(transitive_paths <= relation_matrix)
          
          return bool(reflexive and antisymmetric and transitive)
  v8_sanity_audit:
    sympy_pseudo_code: |
      from sympy import symbols, Implies, And, Eq
      
      R_xx = symbols('R_xx')
      R_xy = symbols('R_xy')
      R_yx = symbols('R_yx')
      R_yz = symbols('R_yz')
      R_xz = symbols('R_xz')
      x, y = symbols('x y')
      
      reflexive = R_xx
      antisymmetric = Implies(And(R_xy, R_yx), Eq(x, y))
      transitive = Implies(And(R_xy, R_yz), R_xz)
      
      poset_axioms = And(reflexive, antisymmetric, transitive)
