    import sympy as sp
    
    graph = {'t1': ['e1', 'e2'], 't2': ['e2']}
    tokens = ['t1', 't2']
    
    def check_hall(g, A):
        # check just the whole set for brevity
        n_a = set()
        for x in A:
            n_a.update(g[x])
        return len(n_a) >= len(A)
        
