id: "CALCULUS-303"
concept_name: "向量场与位势函数 - 保守场的能量守恒与路径无关性 (n_303)"
sub_topics:
  - "保守场（梯度场）的正式定义"
  - "环量为零的物理判据"
  - "路径无关性与势能存在的逻辑等价性"
  - "位势场在引力与静电场中的模型化"
llm_physical_mapping: "mundane physical metaphor: hiking up a mountain; the total calories burned against gravity depends only on the start and peak altitudes, regardless of the winding path taken."
code_implementation: |
  import sympy as sp
  x, y = sp.symbols('x y')
  phi = x**2 * y
  F_x = sp.diff(phi, x)
  F_y = sp.diff(phi, y)
  curl = sp.diff(F_y, x) - sp.diff(F_x, y)
v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy as sp
    x, y = sp.symbols('x y')
    phi = x**2 * y
    Fx, Fy = sp.diff(phi, x), sp.diff(phi, y)
    assert sp.diff(Fy, x) - sp.diff(Fx, y) == 0