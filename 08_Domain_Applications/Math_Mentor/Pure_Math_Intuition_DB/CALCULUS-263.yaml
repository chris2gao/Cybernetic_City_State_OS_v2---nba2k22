id: "CALCULUS-263"
concept_name: "极限与连续 - 消除奇迹步骤：极限的 ε-δ 语言严格定义（动态博弈视角） (n_263)"
sub_topics:
  - "ε-δ 语言的标准数学表述"
  - "动态博弈视角：挑战者 (ε) 与响应者 (δ)"
  - "去心邻域的概念及其在定义中的作用"
  - "极限定义的几何阐释（条形带区域）"
  - "使用 ε-δ 语言证明极限存在的步骤"
llm_physical_mapping: "mundane physical metaphor: hitting a target in archery. The judge gives you a tolerance ring (epsilon). You must find a specific distance from the center (delta) where if you shoot from inside delta, your arrow will always land inside the epsilon ring."
code_implementation: |
  import sympy as sp
  x, epsilon, delta = sp.symbols('x epsilon delta', real=True, positive=True)
  f = 2*x + 1
  L = 5
  x0 = 2
  # Proof logic for limit x->2 of 2x+1 = 5
  diff_f = sp.Abs(f - L)
  # diff_f < epsilon means 2*Abs(x - 2) < epsilon
  # Choose delta = epsilon / 2
v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy as sp
    x, epsilon = sp.symbols('x epsilon', real=True, positive=True)
    f = 2*x + 1
    L = 5
    x0 = 2
    delta = epsilon / 2
    # if 0 < |x - x0| < delta, then |f - L| < epsilon
    diff_f = sp.simplify(sp.Abs(f - L).subs(x, x0 + delta/2))
    assert diff_f < epsilon
