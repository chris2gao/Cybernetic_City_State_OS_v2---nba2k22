concept_node:
  id: "EQUATION-001"
  name: "等式的基本性质与代数运算保持平衡的直觉 (n_64)"
  domain: "方程与不等式 (equations_and_inequalities)"
  sub_topics:
    - "等式的基本性质：平移、缩放的对称性"
    - "不等式的基本性质：符号改变的临界点"
    - "方程解的定义：使天平平衡的未知数值"
    - "代数运算对等式平衡状态的保持逻辑"
  llm_physical_mapping: |
    The central physical metaphor is a perfectly balanced classic beam scale. 
    The equals sign `=` is the fulcrum (the pivot point) exactly in the middle. 
    The left-hand side (LHS) and right-hand side (RHS) of the equation are the two weighing pans. 
    Any valid algebraic operation (adding, subtracting, multiplying, or dividing by a non-zero value) 
    is equivalent to adding or removing identical weights to/from both pans simultaneously, 
    or scaling the contents of both pans by the exact same factor. Because identical 
    actions are applied to both sides, the scale's equilibrium (balance) is never broken.
    An inequality represents a tilted scale, and reversing the inequality sign corresponds 
    to swapping the contents of the two pans or pushing down with negative force (multiplying by a negative number).
  code_implementation: |
    import torch

    def demonstrate_balance():
        # Initialize an unknown variable x, and a constant weight
        # Equation: 2x + 4 = 10
        # Let's say we have an initial balanced state represented by two tensors:
        x = torch.tensor([3.0])  # The "secret" weight
        
        lhs_initial = 2 * x + 4
        rhs_initial = torch.tensor([10.0])
        
        print(f"Initial balance (2x + 4 = 10): {torch.allclose(lhs_initial, rhs_initial)}")
        
        # Operation 1: Subtract 4 from both sides (remove 4 units of weight from both pans)
        lhs_step1 = lhs_initial - 4
        rhs_step1 = rhs_initial - 4
        print(f"After subtracting 4 (2x = 6): {torch.allclose(lhs_step1, rhs_step1)}")
        
        # Operation 2: Divide by 2 on both sides (halve the contents of both pans)
        lhs_step2 = lhs_step1 / 2
        rhs_step2 = rhs_step1 / 2
        print(f"After dividing by 2 (x = 3): {torch.allclose(lhs_step2, rhs_step2)}")
        
        return lhs_step2, rhs_step2
  v8_sanity_audit:
    sympy_pseudo_code: |
      import sympy as sp

      # Define the symbol (the unknown weight)
      x = sp.Symbol('x')

      # Define LHS and RHS of the equation: 2*x + 4 = 10
      lhs = 2*x + 4
      rhs = sp.Integer(10)

      # Create the equation object
      eq = sp.Eq(lhs, rhs)

      # Step-by-step balance enforcement:
      # 1. Subtract 4 from both sides
      eq_step_1 = sp.Eq(eq.lhs - 4, eq.rhs - 4)

      # 2. Divide both sides by 2
      eq_step_2 = sp.Eq(eq_step_1.lhs / 2, eq_step_1.rhs / 2)

      # Solve validates the balanced state isolates the variable perfectly
      solution = sp.solve(eq, x)
      print(f"The equation {eq} simplifies perfectly to {eq_step_2}, solution: {solution}")
