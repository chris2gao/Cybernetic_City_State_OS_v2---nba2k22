id: "CALCULUS-290"
concept_name: "无穷小与无穷大的比较 - “阶”的概念：高阶、低阶、同阶无穷小 (n_290)"
sub_topics:
  - "极限比值法判定阶数"
  - "等价无穷小的替换法则"
  - "常用无穷小量阶的记忆对照"
  - "在级数敛散性判定中的预处理作用"
llm_physical_mapping: "mundane physical metaphor: racing cars towards a wall. As they get infinitesimally close, the 'order' compares their speeds; a higher-order infinitesimal is a car that decelerates much faster and barely creeps to the wall compared to another."
code_implementation: |
  import sympy as sp
  
  x = sp.symbols('x')
  f = sp.sin(x)
  g = x
  h = x**2
  
  # Comparing infinitesimals as x -> 0
  limit_fg = sp.limit(f / g, x, 0)  # Equals 1, they are equivalent
  limit_hg = sp.limit(h / g, x, 0)  # Equals 0, h is higher order than g
v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy as sp
    
    x = sp.symbols('x')
    
    f1 = 1 - sp.cos(x)
    f2 = x**2 / 2
    
    # f1 and f2 are equivalent infinitesimals as x -> 0
    assert sp.limit(f1 / f2, x, 0) == 1
    
    # x^3 is a higher-order infinitesimal compared to x
    assert sp.limit(x**3 / x, x, 0) == 0
