name: "积化和差公式 - 利用振幅调制（AM）理解包络线与高频载波的乘积物理意义"
type: "concept_node"
description: |
  积化和差公式揭示了三角函数乘积与和差之间的深刻代数关系。在物理和工程领域中，
  这种关系最直观的体现是振幅调制（AM）。当一个低频信号（如音频包络线）与一个高频载波相乘时，
  在频域上实际上等效于产生了两个分布在载波频率两侧的新频率成分（边带）。
  在数学运算中，由于乘积项无法直接积分或进行线性变换，利用积化和差公式将其展开为多个不同频率的叠加和，
  是分离频率成分、求解积分（如在傅里叶变换中）的核心手段。
dependencies:
  - "TRIG-028"
sub_topics:
  - "乘积项展开为和差的代数过程"
  - "高频与低频成分的分离原理"
  - "振幅调制 (AM) 信号中的载波与包络分离"
  - "积分运算中消除乘积项的必要性"
llm_physical_mapping: |
  AM radio signals (multiplying a high frequency carrier by a low frequency audio wave).
code_implementation: |
  import torch
  
  # Define time domain
  t = torch.linspace(0, 1, 1000, dtype=torch.float64)
  
  # Frequencies for envelope (low) and carrier (high)
  omega_m = 2.0 * torch.pi * 5.0    # 5 Hz low frequency envelope
  omega_c = 2.0 * torch.pi * 50.0   # 50 Hz high frequency carrier
  
  # Element-wise multiplication (AM modulation)
  product_signal = torch.cos(omega_m * t) * torch.cos(omega_c * t)
  
  # Summation formula representation (Sidebands)
  sum_signal = 0.5 * (torch.cos((omega_c - omega_m) * t) + torch.cos((omega_c + omega_m) * t))
  
  # Sanity check: product and sum forms must match exactly
  max_diff = torch.max(torch.abs(product_signal - sum_signal))
  assert max_diff < 1e-10, f"Difference too large: {max_diff}"
v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy as sp
    
    x, y = sp.symbols('x y')
    
    # Evaluate sympy.expand_trig(sin(x)*cos(y)) as specified
    expr = sp.sin(x) * sp.cos(y)
    expanded = sp.expand_trig(expr)
    
    # The sum form corresponding to the product
    sum_form = sp.Rational(1, 2) * (sp.sin(x + y) + sp.sin(x - y))
    
    # Ensure all representations are mathematically equivalent
    assert sp.simplify(expr - sum_form) == 0
    assert sp.simplify(expanded - sum_form) == 0
