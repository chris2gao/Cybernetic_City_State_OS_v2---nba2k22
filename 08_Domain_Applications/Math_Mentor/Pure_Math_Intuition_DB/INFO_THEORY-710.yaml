code_implementation: |
  import torch
  # Probability of typical set approaches 1
  n = 1000
  p = 0.5
  expected_heads = n * p
  variance = n * p * (1-p)
  print(f'Typical number of heads around {expected_heads} +/- {variance**0.5:.1f}')
