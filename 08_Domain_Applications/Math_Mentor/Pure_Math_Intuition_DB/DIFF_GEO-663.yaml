mapping_boundary:
  primary_mapping_kind: "llm_architecture_bounded_structural_analogy"
  primary_mapping: >-
    If an explicitly constructed compact oriented two-dimensional
    representation manifold has a Riemannian metric, Gaussian curvature, and a
    verified Euler characteristic, Gauss-Bonnet can illustrate how integrated
    local geometric data is constrained by a global topological invariant.
    This is a theorem about that constructed object, not a generic statement
    about loss surfaces, embeddings, or neural networks.
  primary_mapping_zh: >-
    若一个明确构造的紧致定向二维表示流形具有 Riemannian 度量、Gaussian 曲率和
    经验证的 Euler 示性数，Gauss-Bonnet 可说明局部几何数据的积分如何受到全局
    拓扑不变量约束。这是关于该构造对象的定理，不是关于损失曲面、嵌入图或神经
    网络的一般陈述。
  boundary:
    - "A point cloud or visualization is not automatically a compact oriented surface."
    - "Visible bending is not automatically Gaussian curvature."
    - "The geodesic-curvature boundary term cannot be omitted when a surface has boundary."
    - "Piecewise-smooth boundaries require corner or exterior-angle terms."
    - "Noncompact surfaces require additional hypotheses and cannot use the compact formula blindly."
    - "Local curvature may change with a metric while its integral remains topologically constrained only within fixed-manifold hypotheses."
    - "Topology-changing processes do not satisfy the fixed smooth-manifold assumptions."
    - "Scalar curvature in higher dimensions cannot simply replace Gaussian curvature in the two-dimensional formula."
    - "Euler characteristic must be defined for the actual space and is not a generic model-complexity score."
    - "No Gauss-Bonnet invariant of an ordinary LLM is established here."
  preserve_full_boundary: true
  existing_physical_metaphor_status: "secondary_teaser_only"
  secondary_teaser_limitation: >-
    The dented-container image may hint that local geometry can vary while a
    topological quantity remains fixed, but it does not define a surface,
    metric, curvature integral, boundary term, or Euler characteristic.
