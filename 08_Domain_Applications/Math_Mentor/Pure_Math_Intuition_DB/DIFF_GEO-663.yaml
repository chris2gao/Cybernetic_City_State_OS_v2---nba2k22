llm_physical_mapping: >-
  敲打带孔零件箱只作为次级提示：它可提示固定拓扑下局部几何能变化，但没有定义
  紧致定向曲面、度量、Gaussian 曲率、边界项或 Euler 示性数，不能直接构成
