formal_definition: >-
  For a compact oriented two-dimensional Riemannian manifold M without
  boundary, the Gauss-Bonnet theorem states ∫_M K dA=2πχ(M), where K is
  Gaussian curvature, dA is the Riemannian area form, and χ(M) is the Euler
  characteristic. If M has smooth boundary, then, with induced boundary
  orientation and consistent sign conventions,
  ∫_M K dA+∫_{∂M}k_g ds=2πχ(M), where k_g is geodesic curvature. Piecewise
  smooth boundaries additionally require corner or exterior-angle terms. The
  theorem does not say that arbitrary local perturbations preserve topology:
  on a fixed compact surface, changing the metric changes local curvature
  density while the total curvature remains constrained by the unchanged Euler
  characteristic; topology-changing processes leave the fixed-manifold
  hypotheses. In even dimension 2m, Chern-Gauss-Bonnet identifies the integral
  of the Euler form, equivalently a consistently normalized Pfaffian expression
  in the curvature, with χ(M) for a compact oriented Riemannian manifold without
  boundary. Manifolds with boundary need additional boundary transgression
  terms, and corners need further qualifications. The higher-dimensional
  theorem is not obtained by replacing K with arbitrary scalar curvature in
  the two-dimensional formula.
formal_definition_zh: >-
  对无边界的紧致定向二维 Riemannian 流形 M，Gauss-Bonnet 定理为
  ∫_M K dA=2πχ(M)，其中 K 是 Gaussian 曲率，dA 是 Riemannian 面积形式，
  χ(M) 是 Euler 示性数。若 M 有光滑边界，则在采用诱导边界定向并统一符号约定时，
  ∫_M K dA+∫_{∂M}k_g ds=2πχ(M)，其中 k_g 是测地曲率。分段光滑边界还需要
  角点或外角项。定理并不声称任意“局部扰动”都保持拓扑：在固定紧致曲面上改变
  度量会改变局部曲率密度，但总曲率仍受未变 Euler 示性数约束；拓扑改变过程已经
  离开固定光滑流形的假设。在偶数维 2m，无边界紧致定向 Riemannian 流形的
  Chern-Gauss-Bonnet 定理把 Euler 形式的积分（等价地，按一致归一化得到的曲率
  Pfaffian 表达）与 χ(M) 等同。有边界时需要额外的边界转移项，角点还需进一步
  修正。高维定理不能靠把二维公式中的 K 随意替换为标量曲率得到。
