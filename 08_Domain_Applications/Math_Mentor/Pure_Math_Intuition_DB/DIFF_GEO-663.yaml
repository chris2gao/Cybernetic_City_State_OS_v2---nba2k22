code_implementation: |
  def verify_gauss_bonnet(curvature_sum, euler_char):
      pi = 3.1415926535
      return abs(curvature_sum - 2 * pi * euler_char) < 1e-5
v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy as sp
    K, dA, chi = sp.symbols('K dA chi')
    integral_K_dA = 2 * sp.pi * chi
    assert sp.simplify(integral_K_dA - 2 * sp.pi * chi) == 0
