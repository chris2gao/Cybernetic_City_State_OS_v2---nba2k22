llm_physical_mapping: "一根紧绷的吉他弦被拨动后，振动以有限的速度沿着弦向两端传播，形成可见的波峰和波谷。这种机械波的传播严格遵循因果律，波峰不会瞬间到达另一端。"
code_implementation: |
  import torch

  def wave_equation_sim(u, u_prev, c=0.1, steps=100):
      for _ in range(steps):
          laplacian = torch.roll(u, shifts=1) + torch.roll(u, shifts=-1) - 2 * u
          u_next = 2 * u - u_prev + (c**2) * laplacian
          u_prev, u = u, u_next
      return u
v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy as sp

    x, t, c = sp.symbols('x t c', real=True)
    f = sp.Function('f')
    g = sp.Function('g')
    u = f(x - c*t) + g(x + c*t)
    u_tt = sp.diff(u, t, t)
    u_xx = sp.diff(u, x, x)
    eq = sp.simplify(u_tt - c**2 * u_xx)
    assert eq == 0, 'Wave equation not satisfied by dAlembert solution'
