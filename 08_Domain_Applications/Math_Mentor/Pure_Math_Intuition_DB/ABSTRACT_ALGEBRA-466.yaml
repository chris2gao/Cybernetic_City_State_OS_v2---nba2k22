    import sympy as sp
    
    W1 = sp.Matrix([[1, 2], [3, 4]])
    W2 = sp.Matrix([[5, 6], [7, 8]])
    x = sp.Matrix([[1], [1]])
    
    D = sp.Matrix([[2, 0], [0, 3]])
    D_inv = D.inv()
    
    out1 = W2 * W1 * x
    out2 = (W2 * D_inv) * (D * W1) * x
    assert out1 == out2
