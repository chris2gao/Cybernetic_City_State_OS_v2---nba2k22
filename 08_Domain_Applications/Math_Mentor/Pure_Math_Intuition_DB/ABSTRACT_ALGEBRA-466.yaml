llm_physical_mapping: "mundane physical metaphor: A physical spring-loaded scale calibrated with multiple dials. Scaling the input dial while simultaneously inversely scaling the output dial leaves the physical pointer exactly in the same place. This mechanical redundancy means you can twist the internal dials freely along a 'gauge track' without changing the external physical output."
code_implementation: |
  import sympy as sp
  
  # Matrix representations of transformations
  W1 = sp.MatrixSymbol('W1', 3, 3)
  W2 = sp.MatrixSymbol('W2', 3, 3)
  x = sp.MatrixSymbol('x', 3, 1)
  
  # Transformation by an invertible diagonal matrix (scaling)
  c1, c2, c3 = sp.symbols('c1 c2 c3', nonzero=True)
  D = sp.diag(c1, c2, c3)
  D_inv = sp.diag(1/c1, 1/c2, 1/c3)
  
  # The output remains unchanged under this symmetry
  out_original = W2 * W1 * x
  out_transformed = (W2 * D_inv) * (D * W1) * x
  
  diff = out_original - out_transformed
legacy_v8_sanity_audit:
