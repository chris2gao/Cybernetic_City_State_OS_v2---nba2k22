id: "CALCULUS-291"
concept_name: "无穷小与无穷大的比较 - 算法渐进复杂度（大 O 表示法）在连续空间的同构映射 (n_291)"
sub_topics:
  - "函数增长率的阶数比对"
  - "复杂度类在连续极限下的分类"
  - "算法可扩展性的量化定义"
  - "在计算理论与实分析交界处的渐进分析"
llm_physical_mapping: "mundane physical metaphor: comparing fuel consumption of different vehicles over an infinite cross-country road trip. O(x^2) is a truck whose fuel needs grow quadratically, eventually dwarfing a sedan whose needs grow linearly O(x), no matter their starting fuel tanks."
code_implementation: |
  import sympy as sp
  
  n = sp.symbols('n', positive=True)
  f = n**2 * sp.log(n)
  g = n**3
  
  # Asymptotic comparison as n -> infinity
  # If limit is 0, f is O(g) and f is strictly slower growing
  growth_ratio = sp.limit(f / g, n, sp.oo)
  
  h = 5 * n**2 + 3 * n
  k = n**2
  # If limit is constant C > 0, they grow at the same rate (h is Theta(k))
  theta_ratio = sp.limit(h / k, n, sp.oo)
v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy as sp
    
    x = sp.symbols('x', positive=True)
    
    f = sp.exp(x)
    g = x**100
    
    # Exponentials grow faster than polynomials
    assert sp.limit(g / f, x, sp.oo) == 0
    
    log_func = sp.log(x)
    poly_func = sp.sqrt(x)
    
    # Polynomials grow faster than logarithms
    assert sp.limit(log_func / poly_func, x, sp.oo) == 0
