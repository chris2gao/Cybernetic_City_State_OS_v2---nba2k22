  import torch
  # Simple frequency mapping
  freqs = torch.tensor([0.5, 0.25, 0.125, 0.125])
  lengths = torch.tensor([1.0, 2.0, 3.0, 3.0])
  expected_length = torch.sum(freqs * lengths)
  print('Expected length:', expected_length.item())
