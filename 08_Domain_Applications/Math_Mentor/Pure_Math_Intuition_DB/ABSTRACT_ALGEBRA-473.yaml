    from sympy.combinatorics import Permutation, PermutationGroup
    p1 = Permutation(1, 2)
    p2 = Permutation(0, 1)
    G = PermutationGroup(p1, p2)
    kernel_size = sum(1 for p in G.elements if p.is_even)
    im_size = 2
    assert G.order() == kernel_size * im_size
