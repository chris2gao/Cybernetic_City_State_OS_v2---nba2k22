id: "LINEAR_ALGEBRA-314"
concept_name: "行列式 - 发生学溯源：线性变换带来的高维体积缩放比例 (Volume Scaling Factor) (n_314)"
sub_topics:
  - "行列式的几何直观：n 维平行多面体的定向体积"
  - "恒等变换的行列式为 1（体积不变）"
  - "缩放变换与行列式值的关系"
  - "历史上行列式作为线性方程组消元的产物"
llm_physical_mapping: "volume changes: The determinant perfectly measures the volume scaling factor of a deformation. A determinant of 2 means any n-dimensional shape doubles its volume after the transformation, while negative values indicate volume changes with spatial flipping."
code_implementation: |
  import sympy as sp
  
  A = sp.Matrix([[3, 0], [0, 2]])
  # Determinant measures area scaling (3*2 = 6)
  det_A = A.det()
  
  B = sp.Matrix([[1, 2], [3, 4]])
  det_B = B.det()
v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy as sp
    A = sp.Matrix([[3, 0], [0, 2]])
    assert A.det() == 6
    B = sp.Matrix([[1, 2], [3, 4]])
    assert B.det() == -2
