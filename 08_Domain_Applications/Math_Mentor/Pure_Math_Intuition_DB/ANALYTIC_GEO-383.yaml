id: "ANALYTIC_GEO-383"
concept_name: "仿射变换 - 保持共线性与平行性的线性组合变换 (n_383)"
sub_topics:
  - "仿射变换的矩阵与向量平移组合形式"
  - "仿射不变性：简比不变、平行性保持"
  - "仿射变换对二次曲线分类的物理作用"
  - "在图形学中作为模型矩阵 (Model Matrix) 的底座"
llm_physical_mapping: "mundane physical metaphor: Think of an affine transformation as stretching, shearing, and sliding a piece of rubber graph paper. Parallel lines on the paper stay parallel, and a dot halfway between two others stays halfway, even though the whole grid might be slanted and shifted across the desk."
code_implementation: |
  import sympy as sp
  
  def affine_transform(point, matrix, translation):
      p = sp.Matrix(point)
      A = sp.Matrix(matrix)
      b = sp.Matrix(translation)
      
      return A * p + b
v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy as sp
    
    p1 = sp.Matrix([0, 0])
    p2 = sp.Matrix([1, 0])
    p3 = sp.Matrix([0, 1])
    
    A = sp.Matrix([[2, 0], [0, 2]])
    b = sp.Matrix([1, 1])
    
    t1 = A * p1 + b
    t2 = A * p2 + b
    
    assert list(t1) == [1, 1]
    assert list(t2) == [3, 1]
