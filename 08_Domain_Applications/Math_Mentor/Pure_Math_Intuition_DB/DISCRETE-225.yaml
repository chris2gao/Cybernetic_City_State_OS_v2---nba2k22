id: "DISCRETE-225"
concept_name: "图论基础 - 握手定理 (Handshaking Lemma)：所有顶点度数之和等于边数的两倍（物理证明） (n_225)"
sub_topics:
  - "度 (Degree) 的定义与出度/入度"
  - "边对度数贡献的物理计算"
  - "奇数度顶点个数必为偶数的推论"
  - "定理在有向图中的变体"
llm_physical_mapping: "mundane physical metaphor: like people shaking hands at a party; every handshake involves exactly two hands, so the total number of hands shaken is twice the number of handshakes."
code_implementation: |
  import networkx as nx
  
  def handshaking_lemma_check(G):
      total_degree = sum(d for n, d in G.degree())
      total_edges = G.number_of_edges()
      return total_degree == 2 * total_edges
v8_sanity_audit:
  sympy_pseudo_code: |
    import networkx as nx
    G = nx.Graph()
    G.add_edges_from([(1, 2), (2, 3), (3, 1), (1, 4)])
    degrees = [d for n, d in G.degree()]
    total_degree = sum(degrees)
    num_edges = G.number_of_edges()
    odd_degree_nodes = [d for d in degrees if d % 2 != 0]
    assert total_degree == 2 * num_edges
    assert len(odd_degree_nodes) % 2 == 0
