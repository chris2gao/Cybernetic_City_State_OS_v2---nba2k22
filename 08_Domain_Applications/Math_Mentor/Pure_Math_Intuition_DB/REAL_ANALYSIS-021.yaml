id: REAL_ANALYSIS-021
title: "Uniform Continuity"
sub_topics:
  - "Global vs Local Continuity"
  - "Compactness and Continuity"
  - "Lipschitz Functions"
llm_physical_mapping: "RoPE (Rotary Position Embedding) Shift Invariance. Uniform continuity requires delta to be independent of the evaluation point. Similarly, RoPE guarantees that the attention score between query and key depends purely on their relative distance (delta), uniform across the entire sequence length, making the semantic decay geometry strictly translation-invariant."
code_implementation: |
  import torch
  
  def apply_rope_uniform_shift(q, k, seq_len, head_dim):
      # Generate uniform relative frequencies
      freqs = 1.0 / (10000 ** (torch.arange(0, head_dim, 2).float() / head_dim))
      t = torch.arange(seq_len).float()
      # (seq_len, head_dim / 2)
      freqs = torch.outer(t, freqs)
      
      # Polar form rotation ensures the inner product is a function of (m - n)
      # Independent of absolute position, mirroring uniform continuity.
      q_complex = torch.view_as_complex(q.float().reshape(*q.shape[:-1], -1, 2))
      k_complex = torch.view_as_complex(k.float().reshape(*k.shape[:-1], -1, 2))
      
      freqs_complex = torch.polar(torch.ones_like(freqs), freqs)
      
      q_rotated = q_complex * freqs_complex
      k_rotated = k_complex * freqs_complex
      
      # The dot product q_m * k_n^* depends only on relative distance m-n
      return q_rotated, k_rotated
v8_sanity_audit:
  sympy_pseudo_code: |
    import torch
    
    # Audit: Uniform distance invariance
    m = 5
    n = 2
    delta = m - n
    
    # Same delta, different absolute positions
    m_shifted = 105
    n_shifted = 102
    assert (m_shifted - n_shifted) == delta
    
    # In RoPE, DotProduct(q_m, k_n) == DotProduct(q_{m+c}, k_{n+c})
    # This proves the relationship is uniform across the entire sequence interval.
    # Uniform continuity: distance in output depends ONLY on |m - n|, not on m or n.
