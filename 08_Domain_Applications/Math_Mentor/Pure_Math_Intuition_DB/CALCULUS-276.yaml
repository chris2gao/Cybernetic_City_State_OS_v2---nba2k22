  import sympy as sp
  t, x = sp.symbols('t x')
  f = sp.sin(t)
  # F(x) = int_0^x f(t) dt
  F = sp.integrate(f, (t, 0, x))
  # dF/dx should yield f(x)
  derivative_of_integral = sp.diff(F, x)
v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy as sp
    t, x = sp.symbols('t x')
    f = sp.sin(t)
    F = sp.integrate(f, (t, 0, x))
    # Fundamental Theorem of Calculus: d/dx \int_0^x f(t)dt = f(x)
    assert sp.simplify(sp.diff(F, x) - f.subs(t, x)) == 0
