id: "CALCULUS-299"
concept_name: "Green定理/Stokes定理/Gauss散度定理 - 斯托克斯定理：空间闭曲线积分与曲面旋度积分转换 (n_299)"
sub_topics:
  - "斯托克斯公式的微分形式表示"
  - "线积分（环流量）与面积分（旋度通量）的等价性"
  - "物理直觉：无数微小涡旋的相互抵消效应"
  - "在电磁感应定律中的核心地位"
llm_physical_mapping: "mundane physical metaphor: determining how much a net twists in the wind by looking only at the boundary rope of the net."
code_implementation: |
  import sympy as sp
  from sympy.vector import CoordSys3D, curl
  N = CoordSys3D('N')
  F = N.y*N.i + N.z*N.j + N.x*N.k
  C = curl(F)
v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy as sp
    from sympy.vector import CoordSys3D, curl
    N = CoordSys3D('N')
    F = N.y*N.i - N.x*N.j
    assert curl(F).dot(N.k) == -2