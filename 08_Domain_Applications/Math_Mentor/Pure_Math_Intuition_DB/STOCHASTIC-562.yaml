    import sympy as sp
    
    x, theta, mu, dt = sp.symbols('x theta mu dt')
    
    Ex = sp.Function('Ex')(sp.Symbol('t'))
    t = sp.Symbol('t')
    ode = sp.Eq(Ex.diff(t), theta * (mu - Ex))
    
    C1 = sp.Symbol('C1')
    sol_expr = mu + C1 * sp.exp(-theta * t)
    
    test_eq = sp.simplify(sol_expr.diff(t) - theta * (mu - sol_expr))
    assert test_eq == 0, "SDE Expected value drift solution failed"
