code_implementation: |-
  import torch

  def sde_ornstein_uhlenbeck(theta=1.0, mu=0.0, sigma=0.5, T=10.0, dt=0.01):
      steps = int(T / dt)
      x = torch.zeros(steps)
      x[0] = 5.0
      
      for t in range(1, steps):
          dW = torch.randn(1).item() * (dt**0.5)
          drift = theta * (mu - x[t-1]) * dt
          diffusion = sigma * dW
          x[t] = x[t-1] + drift + diffusion
          
      return x[-1].item()
