id: REAL_ANALYSIS-019
title: "Sequences and Limit Convergence"
sub_topics:
  - "Cauchy Sequences"
  - "Monotone Convergence Theorem"
  - "Subsequences and Bolzano-Weierstrass"
llm_physical_mapping: "Autoregressive Generation Limit. A Cauchy sequence's terms become arbitrarily close. In the autoregressive loop, the generation sequence $S_n$ converges to a semantic fixed point (the limit) where the predicted token $x_{n+1}$ is the termination token <EOS>, signaling the sequence of hidden states has reached a stable stationary distribution."
code_implementation: |
  import torch
  
  class AutoregressiveSequenceLimit(torch.nn.Module):
      def __init__(self, vocab_size, hidden_dim):
          super().__init__()
          self.embed = torch.nn.Embedding(vocab_size, hidden_dim)
          self.rnn_cell = torch.nn.GRUCell(hidden_dim, hidden_dim)
          self.lm_head = torch.nn.Linear(hidden_dim, vocab_size)
          
      def forward(self, x0, hidden_state, eos_token_id, max_n=50):
          seq = [x0]
          x_n = x0
          h_n = hidden_state
          
          # Sequence converges towards EOS
          for _ in range(max_n):
              e_n = self.embed(x_n)
              h_n = self.rnn_cell(e_n, h_n)
              logits = self.lm_head(h_n)
              x_n = torch.argmax(logits, dim=-1)
              seq.append(x_n)
              
              # Limit reached
              if x_n.item() == eos_token_id:
                  break
                  
          return torch.stack(seq)
v8_sanity_audit:
  sympy_pseudo_code: |
    import torch
    import torch.nn.functional as F
    
    # Audit: Sequence convergence distance in latent space
    h0 = torch.randn(1, 64)
    h1 = torch.randn(1, 64)
    
    # Cauchy criterion check: d(h_m, h_n) < epsilon for large m, n
    # In LLMs, semantic convergence implies hidden states stabilize before EOS
    distance = F.pairwise_distance(h0, h1)
    
    is_cauchy = distance < 1e-2
    # The latent representation converges towards a semantic attractor
