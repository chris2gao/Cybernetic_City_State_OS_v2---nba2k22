concept_node:
  id: "GEOMETRY-032"
  name: "勾股定理及其逆定理 - 勾股逆定理的应用（已知三边长度反推直角，作为验证空间的工具） (n_152)"
  sub_topics:
    - "勾股逆定理的判定逻辑（a²+b²=c² ⇔ 直角）"
    - "判断三角形形状（锐角、钝角或直角三角形）"
    - "建筑施工中的垂直度现场检测方法"
    - "三维空间中线段垂直性的间接验证"
  llm_physical_mapping: "Mundane physical metaphor: A carpenter's square or a 3-4-5 rope used by builders to verify that a corner is exactly 90 degrees by only measuring lengths."
  code_implementation: |-
    import torch
    
    def verify_right_angle(a: torch.Tensor, b: torch.Tensor, c: torch.Tensor) -> torch.Tensor:
        """
        PyTorch threshold check for right angle
        Assuming c is the longest side.
        """
        return torch.isclose(a**2 + b**2, c**2)
  v8_sanity_audit:
    sympy_pseudo_code: |-
      from sympy.geometry import Point, Triangle
      
      def is_right_triangle_logic(p1, p2, p3):
          # sympy.geometry.Triangle.is_right() equivalent logic
          t = Triangle(Point(*p1), Point(*p2), Point(*p3))
          return t.is_right()
