formal_definition: >-
  A smooth n-manifold is a second-countable Hausdorff topological space M equipped
  with a maximal smooth atlas. Each chart (U_alpha, phi_alpha) maps an open set
  U_alpha in M homeomorphically onto an open subset of R^n, the charts cover M,
  and every overlap transition map phi_beta o phi_alpha^{-1} is smooth wherever
  it is defined. Unless stated otherwise, this node treats manifolds without
  boundary.
formal_definition_zh: >-
  光滑 n 维流形是一个第二可数、Hausdorff 的拓扑空间 M，并带有一组最大光滑图册。
  每张图把 M 的局部开集同胚到 R^n 的开子集；不同图在重叠区域上的坐标转换必须是
  光滑函数。默认不含边界。
