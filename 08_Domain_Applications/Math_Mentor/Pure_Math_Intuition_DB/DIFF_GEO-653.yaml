mapping_boundary:
  primary_mapping_kind: "llm_architecture"
  primary_mapping: >-
    A smooth manifold can be used as an analogy for a model's latent
    representation when different local regions require different coordinate
    descriptions, while transition maps preserve semantic continuity between
    local coordinate systems. Charts correspond to local coordinate views of
    representation neighborhoods; smooth transition maps correspond to
    controlled, differentiable reparameterizations between local views.
  boundary: >-
    This is only a structural analogy. It does not claim that an actual LLM
    latent space is literally a second-countable Hausdorff smooth manifold, that
    every representation chart is invertible, or that neural transformations are
    globally smooth. The formal mathematical object remains the topological
    space plus smooth atlas.
  existing_physical_metaphor_status: "secondary_teaser_only"
