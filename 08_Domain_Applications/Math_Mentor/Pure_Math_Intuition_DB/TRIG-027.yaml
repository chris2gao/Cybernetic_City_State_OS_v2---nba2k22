node_meta:
  version: "9.1"
  domain: "Math_Mentor"
  id: "TRIG-027"
  name: "倍角公式 - 二倍角公式的推导（和角公式的自叠加）及升幂与降幂物理意义 (n_188)"
  description: "Introduction to Double Angle Formulas, their derivations from Angle Addition Formulas, and the physical significance of Power-Reducing Formulas."
  difficulty_level: 6

sub_topics:
  - "sin(2α) 与 cos(2α) 的代数展开"
  - "cos(2α) 的三种等价变形形式"
  - "降幂公式：将高次项转化为倍角一次项"
  - "降幂在微积分积分中的降维打击作用"

llm_physical_mapping: "doubling the speed of a gear translates to trading off frequency for amplitude bounds."

code_implementation: |
  import torch
  import math
  
  x = torch.linspace(-math.pi, math.pi, 100)
  cos_2x = torch.cos(2*x)
  right_side = 2 * (torch.cos(x)**2) - 1
  assert torch.allclose(cos_2x, right_side, atol=1e-5), "Double angle identity failed"

v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy as sp
    x = sp.Symbol('x')
    assert sp.simplify(sp.cos(2*x) - (2*sp.cos(x)**2 - 1)) == 0
