    The existing R2 function computes the determinant-like coefficient a*d-b*c.
    If its two inputs are interpreted as coefficient vectors of 1-forms
    α=a dx+b dy and β=c dx+d dy, the result is the coefficient of α∧β relative
    to dx∧dy.
  audit_interpretation: >-
    The existing d_dx=0 assignment is only a mocked instance of the identity
