mapping_boundary:
  primary_mapping_kind: "llm_architecture_bounded_structural_analogy"
  primary_mapping: >-
    Treat a model representation state as a point in a hypothetical geometric
    state space. A differential k-form can be used as an analogy for a local,
    antisymmetric measurement rule that evaluates k independent infinitesimal
    perturbation directions at the same state. The wedge product analogically
    combines lower-degree local probes into a higher-degree oriented probe.
    Pullback analogically describes how such a probe would be translated
    backward through a change of representation coordinates or a smooth state
    map. The exterior derivative analogically represents a coordinate-compatible
    rule for extracting infinitesimal variation and boundary-sensitive local
    structure from a probe. Generalized Stokes provides an analogy between
    accumulated interior variation and a compatible boundary measurement.
  primary_mapping_zh: >-
    可以把模型的表示状态类比为一个假想几何状态空间中的点。k 阶微分形式可以类比为
    一种局部、反对称的测量探针：它同时接收 k 个无穷小扰动方向，并输出一个带定向
    信息的标量测量结果。外积可以类比为把多个低阶局部探针组合成更高阶的定向探针。
    拉回可以类比为：当表示坐标或状态映射发生改变时，把目标空间中的测量规则反向
    转换到原空间。外微分可以类比为一种与坐标变化相容的局部变化提取规则，用于表达
    局部变化、闭合性及边界响应之间的结构关系。广义 Stokes 定理可以类比为内部累计
    变化与边界测量之间的一致性关系。
  boundary: >-
    This is a bounded structural analogy only. It does not claim that an actual
    LLM latent space is a smooth manifold or possesses a cotangent bundle or
    exterior algebra. Activations, hidden states, attention weights, gradients
    and residual updates are not literally differential forms. The wedge product
    is not ordinary tensor concatenation, elementwise multiplication, matrix
    multiplication, a cross product, or generic feature fusion. The exterior
    derivative is not the ordinary gradient, Jacobian, backpropagation operator,
    finite difference, attention update or Transformer layer operation. The
    identity d²=0 is not a property of arbitrary neural-network updates or
    repeated differentiation operators. A pullback is not automatically
    implemented by changing layers, transporting activations, reparameterizing
    weights or applying an inverse neural transformation. Ordinary LLM
    representations have not been shown to possess the coordinate-invariance,
    orientation, smoothness or integrability required for differential-form
    integration. Generalized Stokes theorem is not claimed to govern Transformer
    computation, context boundaries, token windows or information conservation.
    No claim is made that LLM latent spaces possess nontrivial de Rham cohomology,
    closed or exact semantic forms, or topological invariants detectable by this
    node. A Riemannian metric, volume form, orientation, compact support and
    boundary structure must not be silently inferred. The analogy does not
    establish a machine-verifiable mathematical model of an LLM. The formal
    mathematical object remains a differential form on a smooth manifold.
  preserve_full_boundary: true
  existing_physical_metaphor_status: "secondary_teaser_only"
