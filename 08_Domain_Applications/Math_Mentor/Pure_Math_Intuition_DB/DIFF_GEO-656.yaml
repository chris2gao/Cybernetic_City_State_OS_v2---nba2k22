formal_definition: >-
  Let M be a smooth manifold. A smooth differential k-form on M is a smooth
  section of the kth exterior power of the cotangent bundle, Λ^k(T*M).
  Equivalently, for every p in M, a k-form assigns an alternating k-linear map
  ω_p : (T_pM)^k -> R that depends smoothly on p. The space of smooth k-forms
  is denoted Ω^k(M), and Ω^0(M)=C∞(M). If α∈Ω^k(M) and β∈Ω^l(M), their wedge
  product α∧β∈Ω^(k+l)(M) is the alternating product satisfying
  α∧β = (-1)^(kl) β∧α. For a smooth map F:N->M, the pullback F*ω is defined by
  (F*ω)_q(v_1,...,v_k) = ω_{F(q)}(dF_q(v_1),...,dF_q(v_k)). The exterior
  derivative is the unique family of linear operators d:Ω^k(M)->Ω^(k+1)(M)
  satisfying: (1) for f∈C∞(M), df_p(v)=v(f); (2)
  d(α∧β)=dα∧β+(-1)^k α∧dβ; (3) d∘d=0; and (4) F*(dω)=d(F*ω).
  Differential forms can be integrated over oriented manifolds of matching
  dimension. If N is a compact oriented smooth m-manifold with boundary,
  i:∂N->N is the inclusion, and ω∈Ω^(m-1)(N), then the generalized Stokes
  theorem states ∫_N dω = ∫_(∂N) i*ω, where ∂N carries the induced boundary
  orientation. For noncompact manifolds, appropriate compact-support or
  convergence assumptions are required. Differential forms do not require a
  Riemannian metric. Orientation, degree, smoothness, boundary assumptions and
  integrability must be specified separately.
formal_definition_zh: >-
  设 M 是光滑流形。M 上的光滑 k 阶微分形式，是余切丛第 k 次外幂 Λ^k(T*M) 的
  光滑截面。等价地，它在每一点 p∈M 处指定一个交替的 k 重线性映射
  ω_p:(T_pM)^k->R，并且该映射随 p 光滑变化。所有光滑 k-形式组成 Ω^k(M)，其中
  Ω^0(M)=C∞(M)。若 α∈Ω^k(M)、β∈Ω^l(M)，它们的外积
  α∧β∈Ω^(k+l)(M) 是交替乘积，并满足分次反交换律
  α∧β=(-1)^(kl)β∧α。对光滑映射 F:N->M，微分形式的拉回 F*ω 定义为
  (F*ω)_q(v_1,...,v_k)=ω_{F(q)}(dF_q(v_1),...,dF_q(v_k))。外微分是一族
  线性算子 d:Ω^k(M)->Ω^(k+1)(M)，它满足：(1) 对光滑函数 f，
  df_p(v)=v(f)；(2) 分次 Leibniz 法则
  d(α∧β)=dα∧β+(-1)^k α∧dβ；(3) d²=0；(4) 与拉回相容：
  F*(dω)=d(F*ω)。k 阶微分形式可以在具有相同维数并带有定向的流形上积分。
  若 N 是紧致、定向、带边界的光滑 m 维流形，i:∂N->N 是边界包含映射，且
  ω∈Ω^(m-1)(N)，则广义 Stokes 定理为 ∫_N dω=∫_(∂N)i*ω，其中边界使用
  诱导定向。对于非紧流形，还必须加入紧支撑或积分收敛条件。微分形式本身不要求
  预先给出 Riemannian 度量；形式的次数、流形定向、光滑性、边界条件和可积性
  必须分别说明。
