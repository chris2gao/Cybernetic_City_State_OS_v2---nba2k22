concept_name: 微分形式 - 认知跃迁：抛弃传统向量微积分，建立一套在坐标变换下绝对不变的反对称张量积分系统。 de Rham 上同调的底层探测器。 (n_656)
sub_topics:
- 外微分算子 d 与外积 ∧
- 微分形式在积分号下的天然稳定性
- 斯托克斯公式的广义形式
- 认知飞跃：从方向性向量向面积/体积元代数的转化
llm_physical_mapping: 冲压车间的模具套件：外积像把单根钢条压成铁皮（面），再压成铁箱（体），外微分就是检查这些铁箱焊缝是否漏水的压力测试仪。
code_implementation: |
  import torch
  import numpy as np

  def wedge_product_2d(v1, v2):
      # Anti-symmetric area computation for 1-forms
      return v1[0]*v2[1] - v1[1]*v2[0]

  form1 = torch.tensor([1.0, 0.0])
  form2 = torch.tensor([0.0, 1.0])
  area = wedge_product_2d(form1, form2)
