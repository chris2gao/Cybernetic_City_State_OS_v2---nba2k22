llm_physical_mapping: "mundane physical metaphor: Like testing a bridge's structural integrity. You hit it with a heavy rubber mallet (the exponential guess function) and listen. The bridge hums back with a specific pitch—that pitch directly solves for the structural resonant frequencies (the roots)."
code_implementation: |
  import sympy as sp
  x, lam, p, q = sp.symbols('x lam p q')
  y = sp.exp(lam * x)
  eq = sp.diff(y, x, 2) + p * sp.diff(y, x) + q * y
  char_eq = sp.simplify(eq / y)
v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy as sp
    x, lam, p, q = sp.symbols('x lam p q')
    y = sp.exp(lam * x)
    eq = sp.diff(y, x, 2) + p * sp.diff(y, x) + q * y
    char_eq = sp.simplify(eq / y)
    assert char_eq == lam**2 + lam*p + q
