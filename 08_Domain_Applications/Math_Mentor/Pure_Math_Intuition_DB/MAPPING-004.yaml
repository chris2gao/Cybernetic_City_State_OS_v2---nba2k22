  domain: "Mappings and Relations"
  name: "映射的像与原像 (Image and Preimage)"
  sub_topics:
    - 元素与子集的像
    - 元素与子集的原像
    - 像与原像的集合运算性质（保持交并等）
    - 前推 (Pushforward) 与拉回 (Pullback) 概念初步
  llm_physical_mapping: >
    Think of a mail delivery system. The mapping sends letters (domain elements) to mailboxes (codomain elements). 
    The 'image' of a specific group of letters is the set of all mailboxes that receive at least one of these letters (Pushforward). 
    The 'preimage' of a specific mailbox is the collection of all letters that were delivered to that mailbox (Pullback). 
    Pullbacks perfectly preserve the 'sorting' logic (unions and intersections), whereas pushforwards can cause collisions.
  code_implementation: |
    import torch

    # Simulating Image and Preimage operations using PyTorch
    X = torch.tensor([0, 1, 2, 3, 4]) # Domain
    # Mapping f(x) = x^2 mod 5
    f_X = (X ** 2) % 5 # Codomain mapped values: [0, 1, 4, 4, 1]

    # Image (Pushforward) of subset A = {1, 2, 3}
    A_mask = torch.tensor([False, True, True, True, False])
    image_A = torch.unique(f_X[A_mask]) # Result: tensor([1, 4])

    # Preimage (Pullback) of subset B = {1, 4}
    B = torch.tensor([1, 4])
    preimage_B_mask = torch.isin(f_X, B)
    preimage_B = X[preimage_B_mask] # Result: tensor([1, 2, 3, 4])
  v8_sanity_audit:
    sympy_pseudo_code: |
      from sympy import Symbol, Eq
      
      # Formal Image (Pushforward) definition
      image_A = Symbol('Image_A_Definition')
      
      # Formal Preimage (Pullback) definition
      preimage_B = Symbol('Preimage_B_Definition')
