code_implementation: |-
  import torch

  def mcts_ergodic_sampling(dim=10, steps=5000):
      curr = torch.zeros(dim)
      samples = []
      
      for _ in range(steps):
          prop = curr + torch.randn(dim) * 0.5
          alpha = torch.exp(-0.5 * torch.sum(prop**2) + 0.5 * torch.sum(curr**2))
          if torch.rand(1) < alpha:
              curr = prop
          samples.append(curr.clone())
          
      samples = torch.stack(samples)
      trajectory_mean = samples.mean(dim=0)
      
      return trajectory_mean.norm().item()
