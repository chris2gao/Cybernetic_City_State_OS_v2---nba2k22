    import sympy as sp
    
    n, N = sp.symbols('n N')
    
    C = sp.Symbol('C')
    sum_f = N * C
    avg_f = sum_f / N
    
    assert sp.simplify(avg_f - C) == 0, "Ergodic average for constant function failed"
