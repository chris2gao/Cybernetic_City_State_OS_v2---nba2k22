concept_node:
  id: "BINOMIAL-001"
  topic: "二项式定理 (binomial_theorem) - 杨辉三角（帕斯卡三角）的递推构造法则 (n_114)"
  sub_topics:
    - "杨辉三角的构造规律与递推公式"
    - "杨辉三角的对称性与增减性"
    - "杨辉三角第n行与组合数的对应"
    - "每一行数字之和的性质"
  llm_physical_mapping: "Mundane physical metaphor: Falling balls in a Galton board. As a ball hits a peg, it has an equal chance of bouncing left or right. The number of possible paths to a specific bin at the bottom corresponds exactly to the numbers in Pascal's triangle, visualizing the recurrence relation C(n, k) = C(n-1, k-1) + C(n-1, k)."
  code_implementation: |
    import torch
    
    def generate_pascals_triangle(rows):
        if rows <= 0:
            return []
        triangle = [torch.tensor([1])]
        for i in range(1, rows):
            prev_row = triangle[-1]
            # Pad with zeros to sum adjacent elements
            padded_left = torch.cat([torch.tensor([0]), prev_row])
            padded_right = torch.cat([prev_row, torch.tensor([0])])
            next_row = padded_left + padded_right
            triangle.append(next_row)
        return triangle
    
    # Example usage:
    # print(generate_pascals_triangle(5))
  v8_sanity_audit:
    sympy_pseudo_code: |
      import sympy as sp
      
      n, k = sp.symbols('n k', integer=True, nonnegative=True)
      # Pascal's Identity
      pascal_identity = sp.Eq(sp.binomial(n, k), sp.binomial(n-1, k-1) + sp.binomial(n-1, k))
      
      # Verification for specific values
      n_val, k_val = 5, 2
      is_valid = sp.binomial(n_val, k_val) == (sp.binomial(n_val-1, k_val-1) + sp.binomial(n_val-1, k_val))
