name: Girsanov定理（测度变换） - 逆天黑魔法：通过 Radon-Nikodym 导数，凭空改变布朗运动的漂移方向却不改变其随机本质。 (n_570)
domain: STOCHASTIC
sub_topics:
  - 测度等价变换的条件
  - 指数鞅（Doleans-Dade exponential）的构造
  - 概率空间的动态迁移
  - 物理直觉：在不同的观察者视角（参考系）下重释运动规律
llm_physical_mapping:
  metaphor: A boat drifting in a river experiencing random turbulence. By changing
    the engine thrust (drift change), the trajectory shifts, but an observer standing
    on the shore can mathematically 'weight' the new trajectory probabilities to map
    them perfectly back to a boat with the engine off (change of measure).
code_implementation:
  pytorch_simulation: 'import torch


    dt = 0.01

    N = 100

    t = torch.arange(0, N*dt, dt)

    dW = torch.randn(N) * torch.sqrt(torch.tensor(dt))

    # Standard Brownian motion

    W = torch.cumsum(dW, dim=0)


    # Brownian motion with drift (theta)

    theta = 2.0

    X = theta * t + W


    # Girsanov Radon-Nikodym weight

    # L_t = exp( -theta*W_t - 0.5*theta^2*t )

    L = torch.exp(-theta * W - 0.5 * theta**2 * t)

    # Under the new measure weighted by L, X is a standard Brownian motion

    '
v8_sanity_audit:
  sympy_pseudo_code: 'import sympy as sp


    W, t, theta = sp.symbols(''W t theta'', real=True)

    # Log of the Radon-Nikodym derivative

    log_L = -theta * W - sp.Rational(1, 2) * theta**2 * t

    # Ito''s lemma on L = exp(log_L): dL = -theta L dW (no dt term makes it a local
    martingale)

    dL_dW = sp.diff(sp.exp(log_L), W)

    dL_dt = sp.diff(sp.exp(log_L), t)

    # By Ito''s rule: dL = dL_dt dt + dL_dW dW + 0.5 d2L_dW2 (dW)^2

    # Since (dW)^2 = dt, drift term becomes dL_dt + 0.5 * d2L_dW2

    drift_term = dL_dt + sp.Rational(1, 2) * sp.diff(sp.diff(sp.exp(log_L), W), W)

    assert sp.simplify(drift_term) == 0

    '
