  sympy_pseudo_code: |
    import sympy as sp
    x, y = sp.symbols('x y', real=True)
    u = x**2 - y**2
    v = 2*x*y
    assert sp.simplify(sp.diff(u, x) - sp.diff(v, y)) == 0
    assert sp.simplify(sp.diff(u, y) + sp.diff(v, x)) == 0
