  import numpy as np
  
  # Joint probability table P(A, B) = P(A)*P(B|A)
  p_A = np.array([0.4, 0.6]) # P(A=0), P(A=1)
  p_B_given_A = np.array([[0.9, 0.1],   # P(B|A=0)
                          [0.2, 0.8]])  # P(B|A=1)
                          
  # Joint distribution matrix
  joint_AB = p_A[:, None] * p_B_given_A
