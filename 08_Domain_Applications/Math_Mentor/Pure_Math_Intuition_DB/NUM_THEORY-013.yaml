  name: "费马小定理 - 作为欧拉定理在 n 为素数 p 时的必然特例（a^(p-1) ≡ 1 (mod p)）"
  sub_topics:
    - "定理叙述与素数限制"
    - "作为欧拉定理特例的推导"
    - "既约剩余系的重排证明"
    - "二项式展开证明思路"
  llm_physical_mapping: "Imagine shuffling a prime number of cards exactly p-1 times, which perfectly restores their original configuration. This cyclic symmetry is a mundane physical metaphor for Fermat's Little Theorem, illustrating how a prime modulus enforces a rigid algebraic cycle."
  code_implementation: |
    import torch

    def verify_fermat(a: int, p: int) -> bool:
        a_tensor = torch.tensor(a, dtype=torch.int64)
        p_tensor = torch.tensor(p, dtype=torch.int64)
        
        # PyTorch calculating `(a**(p-1)) % p == 1`
        result = (a_tensor ** (p_tensor - 1)) % p_tensor
        return (result == 1).item()

    print(verify_fermat(2, 5))
  v8_sanity_audit:
    sympy_pseudo_code: |
      import sympy
      
      a = 2
      p = 5 # prime
      
      result = sympy.Mod(a**(p-1), p)
      assert result == 1
