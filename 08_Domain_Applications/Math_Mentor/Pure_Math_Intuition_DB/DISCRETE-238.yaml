  def friends_problem():
      # Simplified representation of Ramsey's theorem R(3,3) = 6
      # In any group of 6 people, there are either 3 mutual friends or 3 mutual strangers.
      # This is an existence proof by defining pigeons (relations) and holes (friend/stranger).
      people = 6
      relations_per_person = people - 1 # 5 relations
      # Pigeonhole: putting 5 relations into 2 holes (friend or stranger)
      # means at least ceil(5/2) = 3 relations must be of the same type.
      return 3
