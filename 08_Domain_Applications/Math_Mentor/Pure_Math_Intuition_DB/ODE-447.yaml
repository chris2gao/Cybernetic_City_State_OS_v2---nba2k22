concept_name: "Laplace变换 - 在工程控制与系统响应分析中的物理应用 (n_447)"
sub_topics:
  - "传递函数（Transfer Function）的建立"
  - "系统稳定性的极点分析（左半平面准则）"
  - "阶跃响应与脉冲响应的频域推导"
  - "处理具有间断点（如脉冲负载）驱动源的优势"
llm_physical_mapping: "Think of an industrial chemical mixing vat. The 'transfer function' is simply the ratio: if I open the intake valve completely for 1 second (impulse input), how violently does the fluid splash out the top (output)? The 'poles in the left half plane' just mean the liquid eventually sloshes back to a flat surface instead of overflowing catastrophically and blowing up the factory."
code_implementation: |
  import sympy as sp
  s = sp.Symbol('s')
  H = 1 / (s**2 + 2*s + 1)
  poles = sp.roots(sp.denom(H), s)
  is_stable = all(sp.re(p) < 0 for p in poles)
