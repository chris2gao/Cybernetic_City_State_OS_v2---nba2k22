concept_node:
  id: "GEOMETRY-030"
  title: "勾股定理及其逆定理 - 发生学溯源：古代土地测量（结绳法）与建筑直角的工程危机 (n_150)"
  sub_topics:
    - "直角三角形三边关系：a² + b² = c²"
    - "勾股定理的历史起源（赵爽弦图与毕达哥拉斯）"
    - "勾股定理的逆定理：直角三角形的判定"
    - "常见勾股数（3,4,5等）的特征与记忆"
  llm_physical_mapping: >-
    Mundane physical metaphor: Ancient Egyptian surveyors ("rope-stretchers") used a single rope with 12 evenly spaced knots. 
    By stretching it into a triangle with sides of 3, 4, and 5 knot-spaces, it perfectly guaranteed a right angle. 
    This physically resolved the practical engineering crisis of building perfectly square corners in land measurement and architecture.
  code_implementation: |-
    import torch

    def calculate_hypotenuse(a: torch.Tensor, b: torch.Tensor) -> torch.Tensor:
        """PyTorch L2 norm calculation explicitly sqrt(a^2 + b^2)"""
        return torch.sqrt(a**2 + b**2)

    # Example: 3-4-5 right triangle
    side_a = torch.tensor([3.0])
    side_b = torch.tensor([4.0])
    side_c = calculate_hypotenuse(side_a, side_b)
    # Output: 5.0
  v8_sanity_audit:
    sympy_pseudo_code: |-
      import sympy as sp
      
      # Define variables
      a, b, c = sp.symbols('a b c', real=True, positive=True)
      
      # Pythagorean theorem equation
      pythagorean_theorem = sp.Eq(a**2 + b**2, c**2)
      
      # Verify 3-4-5 tuple
      is_right_triangle = pythagorean_theorem.subs({a: 3, b: 4, c: 5})
      assert is_right_triangle == sp.true
