id: "PROB_STAT-345"
concept_name: "概率公理 - 概率的三大公理及其逻辑自洽性 (n_345)"
sub_topics:
  - "非负性：概率不为负的物理现实"
  - "规范性：全空间概率为 1 的守恒"
  - "可列可加性：互斥事件并集的概率累加"
  - "从公理推导概率的所有基本性质"
llm_physical_mapping: "mundane physical metaphor: weighted dice rolled on a constrained board. Non-negativity means you can't have negative dice weights. Normalization means the total weight of all sides is exactly 1 unit. Additivity means combining sides merges their weights."
code_implementation: |
  import sympy as sp
  
  # Axiom 1: Non-negativity
  p_A = sp.Symbol('p_A', nonnegative=True)
  
  # Axiom 2: Normalization (Total probability = 1)
  p_Omega = 1
  
  # Axiom 3: Additivity for mutually exclusive events
  p_B = sp.Symbol('p_B', nonnegative=True)
  p_A_or_B = p_A + p_B # if A and B are mutually exclusive
v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy as sp
    from sympy.stats import Die, P
    
    D = Die('D', 6)
    
    # 1. Non-negativity
    assert P(sp.Eq(D, 1)) >= 0
    
    # 2. Normalization
    assert P(D > 0) == 1
    
    # 3. Additivity (Mutually exclusive: D=1 and D=2)
    p_1 = P(sp.Eq(D, 1))
    p_2 = P(sp.Eq(D, 2))
    p_1_or_2 = P(sp.Or(sp.Eq(D, 1), sp.Eq(D, 2)))
    assert p_1_or_2 == p_1 + p_2
