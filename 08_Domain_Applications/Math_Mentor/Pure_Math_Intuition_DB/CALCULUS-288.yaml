code_implementation: |
  import sympy as sp
  
  x, y, z = sp.symbols('x y z')
  # Density function rho(x, y, z)
  rho = x**2 + y**2 + z**2
  
  # Triple integral over a box [0,1]x[0,1]x[0,1] for mass
  mass = sp.integrate(rho, (x, 0, 1), (y, 0, 1), (z, 0, 1))
  
  # Moment of inertia around z-axis: I_z = \int (x^2 + y^2)*rho dV
  I_z = sp.integrate((x**2 + y**2)*rho, (x, 0, 1), (y, 0, 1), (z, 0, 1))
v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy as sp
    
    x, y, z = sp.symbols('x y z')
    rho = 1  # constant density
    
    # Mass of a unit cube [0, 1]^3
    mass = sp.integrate(rho, (x, 0, 1), (y, 0, 1), (z, 0, 1))
    assert mass == 1
    
    # Center of mass x-coordinate: Mx / mass
    Mx = sp.integrate(x * rho, (x, 0, 1), (y, 0, 1), (z, 0, 1))
    x_cm = Mx / mass
    assert x_cm == sp.Rational(1, 2)
