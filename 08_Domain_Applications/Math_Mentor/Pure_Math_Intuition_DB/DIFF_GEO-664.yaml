llm_physical_mapping: >-
  弹簧钢板被弯入外部容器只作为次级提示：它可提示“外在弯曲”依赖环境嵌入，
  但没有给出浸入、诱导度量、法丛、第二基本形式或内蕴曲率，也不能把 UMAP 等
  可视化中的弯曲直接解释成 Riemann 曲率。
code_implementation: "import numpy as np\ndef second_fundamental_form(normal_vector, tangent_vector_1, tangent_vector_2):\n    return np.dot(normal_vector, np.cross(tangent_vector_1, tangent_vector_2))\n"
v8_sanity_audit:
  sympy_pseudo_code: 'import sympy as sp

    L, M, N = sp.symbols(''L M N'')

    gaussian_curvature = (L*N - M**2)

    assert sp.simplify(gaussian_curvature - (L*N - M**2)) == 0

    '
