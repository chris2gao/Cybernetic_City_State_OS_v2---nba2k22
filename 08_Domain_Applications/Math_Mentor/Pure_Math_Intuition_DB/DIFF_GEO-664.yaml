formal_definition: >-
  A smooth map F:M→N is an immersion when dF_p:T_pM→T_{F(p)}N is
  injective at every point. It is an embedding when it is also a
  homeomorphism onto its image with the subspace topology. Let M be an
  embedded Riemannian submanifold of a Riemannian manifold (N,g_bar), with
  induced metric g. For tangent vector fields X,Y on M, the ambient
  Levi-Civita derivative decomposes as
  nabla_bar_X Y=nabla_X Y+II(X,Y). The tangential component nabla_X Y is the
  Levi-Civita connection of the induced metric, and the normal component
  II(X,Y)=(nabla_bar_X Y)^perp is the normal-valued second fundamental form.
  It is symmetric for Levi-Civita connections. For a normal field nu, the
  shape operator A_nu is defined by g(A_nu X,Y)=g_bar(II(X,Y),nu). The
  mean-curvature vector is the normalized trace of II. The Gauss equation
  relates the intrinsic curvature of M to ambient curvature and quadratic
  expressions in II. For a surface in Euclidean three-space, Gaussian
  curvature is the determinant of the shape operator; in first- and
  second-fundamental-form coefficients it includes the metric denominator
  and is not merely LN-M². Extrinsic bending therefore remains distinct from
  intrinsic Riemannian curvature.
formal_definition_zh: >-
  光滑映射 F:M→N 在每点的微分 dF_p:T_pM→T_{F(p)}N 都是单射时称为浸入；
  若它还是到其像（赋予子空间拓扑）的同胚，则称为嵌入。设 M 是 Riemannian
  流形 (N,g_bar) 的嵌入子流形，并带诱导度量 g。对 M 上的切向量场 X、Y，
  环境 Levi-Civita 导数分解为 nabla_bar_X Y=nabla_X Y+II(X,Y)。切向分量
  nabla_X Y 是诱导度量的 Levi-Civita 联络，法向分量
  II(X,Y)=(nabla_bar_X Y)^perp 是取值于法丛的第二基本形式；在 Levi-Civita
  情形下它是对称的。对法向场 nu，形算子 A_nu 由
  g(A_nu X,Y)=g_bar(II(X,Y),nu) 定义。平均曲率向量是 II 的归一化迹；Gauss
  方程把 M 的内蕴曲率与环境曲率及 II 的二次项联系起来。欧氏三维空间中的曲面
  高斯曲率是形算子的行列式；用第一、第二基本形式系数表示时还含有度量分母，
  不能简化为 LN-M²。外在弯曲与内蕴 Riemann 曲率必须严格区分。
