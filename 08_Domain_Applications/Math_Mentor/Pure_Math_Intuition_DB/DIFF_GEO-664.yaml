mapping_boundary:
  primary_mapping_kind: "llm_architecture_bounded_structural_analogy"
  primary_mapping: >-
    If a family of model representations is explicitly modeled as a smooth
    lower-dimensional manifold embedded in an ambient feature space, the
    second fundamental form can analogize how tangent directions bend
    relative to the ambient representation coordinates. This can separate
    intrinsic geometry from artifacts of a chosen embedding, but it requires
    an actual immersion, ambient connection, tangent/normal decomposition, and
    induced metric rather than a visualization alone.
  primary_mapping_zh: >-
    若一族模型表示被明确定义为嵌入环境特征空间的光滑低维流形，第二基本形式可
    类比切向方向相对环境坐标的弯曲方式，从而帮助区分内蕴几何与所选嵌入带来的
    外在效应。但该类比必须建立在真实的浸入、环境联络、切/法分解和诱导度量上，
    不能由一幅降维可视化图直接推出。
  boundary:
    - "A finite point cloud is not automatically a smooth embedded submanifold."
    - "UMAP, t-SNE, PCA, or an embedding loss does not automatically compute a second fundamental form."
    - "Parameter constraints or low-rank subspaces are not automatically nonlinear submanifolds."
    - "Extrinsic bending in a visualization is not intrinsic Riemann curvature."
    - "Embedding pressure is a metaphor, not a defined tensor or physical stress."
    - "The second fundamental form requires an immersion, ambient connection, and normal projection."
    - "No smooth representation manifold or curvature measurement for an ordinary model is established by this node."
  preserve_full_boundary: true
  existing_physical_metaphor_status: "secondary_teaser_only"
  secondary_teaser_limitation: >-
    The bent-steel image only distinguishes extrinsic bending from an ambient
    container. It does not define an immersion, induced metric, normal bundle,
    second fundamental form, or intrinsic curvature.
existing_code_and_audit:
  preserve: true
  evidence_status: "semantic_only"
  run_with_log_ref: null
  code_interpretation: >-
    The existing scalar triple-product function is three-dimensional vector
    algebra. It does not receive an immersion, ambient connection, normal
    projection, or extensions of two tangent vector fields, so it is not a
    second fundamental form.
  audit_interpretation: >-
    The existing audit restates LN-M² and omits the first-fundamental-form
    denominator required for Gaussian curvature in local surface coordinates.
    It is tautological and cannot establish the Gauss equation or curvature.
  code_scope: "three_dimensional_scalar_triple_product_only"
  example_scope: "no_submanifold_or_connection_data"
  audit_scope: "tautological_LN_minus_M_squared_identity"
  explicitly_not_validated:
