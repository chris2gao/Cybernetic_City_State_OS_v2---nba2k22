concept_name: "留数定理 - 物理降维计算：通过寻找封闭曲线内的奇点（留数）极速得出路径积分结果 (n_427)"
sub_topics:
  - "留数 (Residue) 的定义：洛朗展开的 -1 次项系数"
  - "留数定理总公式：2πi * ∑ Res"
  - "利用留数定理计算实变函数的广义积分"
  - "定理在处理电路阻抗与频率响应中的应用"
llm_physical_mapping: "mundane physical metaphor: treating a closed contour integration as a simple sum of isolated electrical charges (singularities) trapped inside a loop of wire, bypassing the need to measure the electric field everywhere."
code_implementation: |
  import sympy as sp
  z = sp.Symbol('z')
  # Function with singularities
  f = 1 / (z**2 + 1)
  # Finding poles and residues
  poles = sp.roots(sp.denom(f), z)
  residue_sum = sum(sp.residue(f, z, pole) for pole in poles)
  integral_val = 2 * sp.pi * sp.I * residue_sum
