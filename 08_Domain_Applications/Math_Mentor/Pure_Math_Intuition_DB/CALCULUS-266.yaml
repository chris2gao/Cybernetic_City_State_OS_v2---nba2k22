code_implementation: |
  import sympy as sp
  x, dx = sp.symbols('x dx')
  # Power rule derivation for x^2
  f = x**2
  limit_def = sp.limit(((x + dx)**2 - x**2) / dx, dx, 0)
  # Sin rule
  limit_sin = sp.limit((sp.sin(x + dx) - sp.sin(x)) / dx, dx, 0)
v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy as sp
    x, dx = sp.symbols('x dx')
    limit_def = sp.limit(((x + dx)**2 - x**2) / dx, dx, 0)
    assert limit_def == 2*x
    limit_sin = sp.limit((sp.sin(x + dx) - sp.sin(x)) / dx, dx, 0)
    assert limit_sin == sp.cos(x)
