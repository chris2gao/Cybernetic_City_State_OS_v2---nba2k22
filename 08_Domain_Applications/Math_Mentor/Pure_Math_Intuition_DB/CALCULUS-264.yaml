llm_physical_mapping: "mundane physical metaphor: drawing a line on paper without lifting the pen. Removable is a tiny pothole, jump is a step or curb, infinite is a vertical wall, oscillating is a vibrating string that gets infinitely fast."
code_implementation: |
  import sympy as sp
  x = sp.Symbol('x')
  f_removable = (x**2 - 1)/(x - 1)
  f_jump = sp.Piecewise((1, x > 0), (-1, x <= 0))
  f_infinite = 1/x
  f_oscillating = sp.sin(1/x)
  # Limit of f_removable as x->1 exists and is 2
  lim_removable = sp.limit(f_removable, x, 1)
