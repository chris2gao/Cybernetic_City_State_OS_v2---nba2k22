code_implementation: |
  import sympy as sp
  x, y = sp.symbols('x y', real=True)
  u = sp.Function('u')(x, y)
  v = sp.Function('v')(x, y)
  cr_eq1 = sp.Eq(sp.diff(u, x), sp.diff(v, y))
  cr_eq2 = sp.Eq(sp.diff(u, y), -sp.diff(v, x))
