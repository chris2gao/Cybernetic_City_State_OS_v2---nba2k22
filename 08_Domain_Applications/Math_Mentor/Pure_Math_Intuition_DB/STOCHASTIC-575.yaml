name: "随机过程的谱分析 - 为海量语音/视觉信号提供频率特征提取的数学引擎。"
domain: "STOCHASTIC"
description: "通过对随机过程的频谱分解，我们可以将混杂在时间轴上的复杂信号转化为不同频率成分的叠加。这使得滤波器设计成为可能，构成了音频处理前端梅尔频谱特征提取和图像处理频域滤波的底层逻辑。"
llm_physical_mapping: "物理映射为一个多级机械震动筛分机系统。混合着大石块、碎石和细沙的砂石料（原始时域随机信号）被倒在筛分网上。筛分机按照震动频率和网眼大小，把砂石分成不同等级（频域滤波）。如果我们只想要碎石（带通滤波），就把大石块和细沙的出口堵死，只保留中间层落下的材料。这就是利用谱分析提取特征的物理本质。"
code_implementation: |-
  import torch

  # Simulate an Audio signal feature extraction frontend (like Mel-filterbank basis)
  time_steps = 1000
  dt = 0.001
  t = torch.arange(0, time_steps) * dt
  
  # A signal composed of low (5 Hz) and high (50 Hz) frequencies plus random noise
  low_freq_component = torch.sin(2 * torch.pi * 5 * t)
  high_freq_component = 0.5 * torch.sin(2 * torch.pi * 50 * t)
  noise = 0.2 * torch.randn(time_steps)
  
  signal = low_freq_component + high_freq_component + noise
  
  # Transform to frequency domain
  fft_signal = torch.fft.rfft(signal)
  freqs = torch.fft.rfftfreq(time_steps, dt)
  
  # Design a digital bandpass filter matrix (masking)
  # Keep only frequencies around 50 Hz
  filter_mask = torch.zeros_like(fft_signal, dtype=torch.float)
  filter_mask[(freqs > 40) & (freqs < 60)] = 1.0
  
  # Apply filter in frequency domain
  filtered_fft = fft_signal * filter_mask
  
  # Reconstruct the time domain feature (the 50Hz isolated component)
  extracted_feature = torch.fft.irfft(filtered_fft, n=time_steps)
v8_sanity_audit:
  sympy_pseudo_code: |-
    import sympy as sp

    # Verify that passing a stochastic process with PSD S_x(omega) through a linear filter H(omega)
    # results in an output PSD S_y(omega) = |H(omega)|^2 * S_x(omega)
    
    omega = sp.Symbol('omega', real=True)
    
    # Input PSD (White noise for simplicity)
    S_x = sp.Integer(1)
    
    # Filter transfer function H(omega) = 1 / (1 + j * omega) (Low pass RC filter)
    # Magnitude squared |H(omega)|^2 = H * conj(H)
    H = 1 / (1 + sp.I * omega)
    H_conj = 1 / (1 - sp.I * omega)
    
    H_mag_sq = sp.simplify(H * H_conj)
    
    # Output PSD
    S_y = H_mag_sq * S_x
    
    # The expected PSD should be 1 / (1 + omega^2)
    expected_S_y = 1 / (1 + omega**2)
    
    assert sp.simplify(S_y - expected_S_y) == 0
