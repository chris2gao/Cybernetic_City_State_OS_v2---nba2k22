code_implementation: |
  import torch
  import numpy as np
  
  def global_consistency_extrapolation():
      x_local = torch.linspace(-0.1, 0.1, 10)
      y_local = 3 * x_local**3 - 2 * x_local + 1
      weights = torch.polyfit(x_local, y_local, deg=3)
      
      x_global = torch.tensor([10.0, 50.0])
      y_pred = torch.polyval(weights, x_global)
      y_true = 3 * x_global**3 - 2 * x_global + 1
      return torch.allclose(y_pred, y_true, atol=1e-3)
