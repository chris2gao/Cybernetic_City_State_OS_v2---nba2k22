llm_physical_mapping: "Like fitting a custom exhaust pipe to a noisy engine. You know the engine produces a specific frequency of sound (the forcing function), so you pre-build a muffler chamber of the exact same frequency (the undetermined coefficients template) and just tweak the internal baffles (solve for A and B) until it matches the exhaust perfectly. No guessing, just templated mechanical fitting."
code_implementation: |
  import sympy as sp
  t = sp.Symbol('t')
  A, B = sp.symbols('A B')
  y_p = A*sp.cos(t) + B*sp.sin(t)
  lhs = y_p.diff(t, 2) + 2*y_p.diff(t) + y_p
  eq1 = sp.Eq(lhs.coeff(sp.cos(t)), 5)
  eq2 = sp.Eq(lhs.coeff(sp.sin(t)), 0)
  coeffs = sp.solve([eq1, eq2], (A, B))
