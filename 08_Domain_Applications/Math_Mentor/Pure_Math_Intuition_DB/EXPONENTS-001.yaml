  concept_name: "有理指数与幂函数 (rational_exponents_and_power_functions) - 正整数指数幂的运算性质（同底数幂相乘、幂的乘方等） (n_111)"
  sub_topics:
    - "同底数幂相乘法则"
    - "幂的乘方法则"
    - "积的乘方法则"
    - "同底数幂相除法则"
  llm_physical_mapping: |
    Mundane physical metaphor: Imagine repeatedly folding a piece of paper. Folding it m times creates 2^m layers. If you take that folded paper and fold the entire stack n more times, you effectively fold it m+n times (2^m * 2^n = 2^{m+n}). If you have a stack of 2^m layers and you copy this stack process n times (like a grid), it's (2^m)^n = 2^{m*n}.
  code_implementation: |
    import torch
    
    def power_rules_demo():
        x = torch.tensor([2.0])
        m = torch.tensor([3.0])
        n = torch.tensor([2.0])
        y = torch.tensor([3.0])
        
        # 同底数幂相乘: x^m * x^n = x^{m+n}
        rule1_left = (x ** m) * (x ** n)
        rule1_right = x ** (m + n)
        assert torch.allclose(rule1_left, rule1_right)
        
        # 幂的乘方: (x^m)^n = x^{m*n}
        rule2_left = (x ** m) ** n
        rule2_right = x ** (m * n)
        assert torch.allclose(rule2_left, rule2_right)
        
        # 积的乘方: (x*y)^m = x^m * y^m
        rule3_left = (x * y) ** m
        rule3_right = (x ** m) * (y ** m)
        assert torch.allclose(rule3_left, rule3_right)
        
        # 同底数幂相除: x^m / x^n = x^{m-n}
        rule4_left = (x ** m) / (x ** n)
        rule4_right = x ** (m - n)
        assert torch.allclose(rule4_left, rule4_right)
        
        return rule1_right, rule2_right, rule3_right, rule4_right
  v8_sanity_audit:
    sympy_pseudo_code: |
      import sympy as sp
      x, y, m, n = sp.symbols('x y m n', positive=True)
      
      # 同底数幂相乘
      expr1 = sp.Pow(x, m) * sp.Pow(x, n)
      simplified1 = sp.simplify(expr1) # Should be x**(m+n)
      
      # 幂的乘方
      expr2 = sp.Pow(sp.Pow(x, m), n)
      simplified2 = sp.simplify(expr2) # Should be x**(m*n)
      
      # 积的乘方
      expr3 = sp.Pow(x * y, m)
      simplified3 = sp.expand_power_base(expr3) # Should be x**m * y**m
      
      # 同底数幂相除
      expr4 = sp.Pow(x, m) / sp.Pow(x, n)
      simplified4 = sp.simplify(expr4) # Should be x**(m-n)
