code_implementation: |
  import torch

  def minimize_action_functional(points=50, epochs=2000, lr=0.01):
      x = torch.linspace(0, 1, points)
      dx = 1.0 / (points - 1)
      
      y = torch.linspace(0, 1, points, requires_grad=True)
      optimizer = torch.optim.Adam([y], lr=lr)
      
      for _ in range(epochs):
          optimizer.zero_grad()
          
          y_prime = (y[1:] - y[:-1]) / dx
          
          action = torch.sum((y_prime**2 + y[:-1]**2) * dx)
          action.backward()
          
          with torch.no_grad():
              y.grad[0] = 0.0
              y.grad[-1] = 0.0
              
          optimizer.step()
          
      return y.detach()
v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy as sp

    t = sp.Symbol('t', real=True)
    y = sp.Function('y')(t)
    y_dot = sp.diff(y, t)

    m, k = sp.symbols('m k', real=True, positive=True)
    L = 0.5 * m * y_dot**2 - 0.5 * k * y**2

    dL_dy = sp.diff(L, y)
    dL_dydot = sp.diff(L, y_dot)
    
    euler_lagrange = sp.diff(dL_dydot, t) - dL_dy

    expected_eom = m * sp.diff(y, t, 2) + k * y
    assert sp.simplify(euler_lagrange - expected_eom) == 0, "Euler-Lagrange yields harmonic oscillator EOM"
