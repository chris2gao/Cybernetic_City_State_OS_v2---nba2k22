code_implementation: |
  def nfa_to_dfa_step(current_nfa_states, symbol, nfa_transitions):
      # Find all reachable states from a SET of current states given a symbol
      next_states = set()
      for state in current_nfa_states:
          if (state, symbol) in nfa_transitions:
              for next_s in nfa_transitions[(state, symbol)]:
                  next_states.add(next_s)
      return frozenset(next_states)

  # NFA transition where q0 on 'a' goes to q0 and q1
  nfa_trans = {
      ('q0', 'a'): ['q0', 'q1'],
      ('q0', 'b'): ['q0'],
      ('q1', 'b'): ['q2']
  }
  
  start_dfa_state = frozenset(['q0'])
  next_dfa_state = nfa_to_dfa_step(start_dfa_state, 'a', nfa_trans)
  print(f"DFA transitions from {set(start_dfa_state)} on 'a' to {set(next_dfa_state)}")
