mapping_boundary:
  primary_mapping_kind: "llm_architecture_bounded_structural_analogy"
  primary_mapping: >-
    Standard rotary position encoding can be interpreted as a specific
    representation of additive positions by block-diagonal planar rotations.
    Each frequency block lies in SO(2), and in the standard construction the
    identity R_m^T R_n=R_(n-m) exposes relative position differences. This is
    a concrete product of SO(2) representations, not evidence that an entire
    Transformer state space is a Lie group or that every architectural
    operation is equivariant.
  primary_mapping_zh: >-
    标准旋转位置编码可解释为把加法位置表示成分块对角平面旋转的一个具体表示。
    每个频率块属于 SO(2)，标准构造中的 R_m^T R_n=R_(n-m) 显示相对位置差。
    这是一族具体的 SO(2) 表示乘积，而不是“整个 Transformer 状态空间是 Lie 群”
    的证据，也不能推出所有架构操作都具有等变性。
  boundary:
    - "RoPE is not a proof that the entire Transformer state space is a Lie group."
    - "Standard RoPE is most precisely a product of SO(2) rotation representations, not unrestricted SO(n) dynamics."
    - "Relative-position behavior in attention does not imply universal sequence-translation equivariance under every architectural operation."
    - "A tangent vector at the identity is infinitesimal data and does not determine every global group element without exponential and topology qualifications."
    - "The Lie exponential need not be globally injective or surjective."
    - "Trace zero does not characterize so(n); skew-symmetry is required."
    - "No Lie-group structure on ordinary hidden states is established by this node."
  preserve_full_boundary: true
  existing_physical_metaphor_status: "secondary_teaser_only"
  secondary_teaser_limitation: >-
    The rotating-shaft image may hint that infinitesimal generators produce
    one-parameter motions, but it does not encode a group law, smooth
    structure, Lie bracket, representation, or global exponential behavior.
