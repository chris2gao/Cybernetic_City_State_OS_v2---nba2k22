formal_definition: >-
  A Lie group G is a smooth manifold whose multiplication G×G→G and
  inversion G→G are smooth. Its Lie algebra g is the tangent space T_eG at
  the identity equipped with the bracket induced by commutators of
  left-invariant vector fields. For X∈g, the unique one-parameter subgroup
  with initial tangent X defines the Lie exponential exp:g→G. For a
  finite-dimensional Lie group, exp is a local diffeomorphism near 0, but it
  need not be globally injective or surjective. For matrix Lie groups, g is a
  matrix vector space closed under [A,B]=AB-BA and the Lie exponential agrees
  with the matrix exponential. In particular, so(n) consists of
  skew-symmetric matrices, and exponentiating such a matrix gives an element
  of SO(n). A smooth representation is a group homomorphism from G to
  invertible linear transformations. Equivariance claims require an explicit
  group action and representation; infinitesimal Lie-algebra data alone do
  not remove global topology or exponential-map limitations.
formal_definition_zh: >-
  Lie 群 G 是乘法 G×G→G 与取逆 G→G 都光滑的光滑流形。其 Lie 代数 g 是
  单位元处切空间 T_eG，并带有由左不变向量场交换子诱导的括号。对 X∈g，初速度
  为 X 的唯一单参数子群定义指数映射 exp:g→G。有限维 Lie 群的 exp 在 0 附近
  是局部微分同胚，但不必全局单射或满射。对矩阵 Lie 群，g 是在交换子
  [A,B]=AB-BA 下封闭的矩阵向量空间，Lie 指数与矩阵指数一致；特别地，so(n)
  由斜对称矩阵组成，其指数属于 SO(n)。光滑表示是从 G 到可逆线性变换群的群
  同态。任何等变性陈述都必须明确给出群作用和表示；无穷小 Lie 代数信息不能自动
  消除全局拓扑或指数映射的限制。
