id: "DISCRETE-230"
concept_name: "树与网络 - 根树 (Rooted Trees)、二叉树与大模型 MCTS 搜索树结构映射 (n_230)"
sub_topics:
  - "根、父节点、子节点的层级拓扑"
  - "二叉树的递归构造与性质"
  - "蒙特卡洛树搜索 (MCTS) 的展开与回溯"
  - "搜索树在启发式博弈中的状态演化"
llm_physical_mapping: "mundane physical metaphor: like an organizational chart in a company, starting with the CEO at the top, branching down to managers, and finally to individual contributors at the bottom."
code_implementation: |
  class TreeNode:
      def __init__(self, val=0, left=None, right=None):
          self.val = val
          self.left = left
          self.right = right
          
  def count_nodes(root):
      if not root:
          return 0
      return 1 + count_nodes(root.left) + count_nodes(root.right)
v8_sanity_audit:
  sympy_pseudo_code: |
    import networkx as nx
    T = nx.DiGraph()
    T.add_edges_from([('root', 'child1'), ('root', 'child2')])
    assert list(T.successors('root')) == ['child1', 'child2']
    assert T.out_degree('root') == 2
