id: "DISCRETE-246"
concept_name: "形式语言与自动机 - 发生学溯源：图灵与乔姆斯基对“机器理解语言”的数学抽象，大模型语法解析源头 (n_246)"
sub_topics:
  - "形式文法的四个组成部分 (V, T, P, S)"
  - "计算能力的层级划分"
  - "机器接受语言与产生语言的对等性"
  - "早期编译原理的数学逻辑"
llm_physical_mapping: "mundane physical metaphor: a Lego instruction manual. The alphabet (T) are the individual basic Lego bricks. The variables (V) are sub-assemblies (like 'build the wheel base'). The rules (P) dictate how to replace a sub-assembly instruction with bricks or other instructions. The start symbol (S) is the picture of the final completed car."
code_implementation: |
  def grammar_expansion(rules, start, iterations):
      result = start
      for _ in range(iterations):
          for var, substitution in rules.items():
              result = result.replace(var, substitution)
      return result
v8_sanity_audit:
  sympy_pseudo_code: |
    # A simple assertion for a context-free grammar step
    S = "aSb"
    step1 = S.replace("S", "ab")
    assert step1 == "aabb"
