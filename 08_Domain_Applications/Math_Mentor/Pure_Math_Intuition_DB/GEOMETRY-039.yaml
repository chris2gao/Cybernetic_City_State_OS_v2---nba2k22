  code_implementation: >
    import torch
    
    def generate_sphere_tensor(radius, resolution=100):
        # Create a 3D coordinate grid
        grid = torch.linspace(-radius, radius, resolution)
        x, y, z = torch.meshgrid(grid, grid, grid, indexing='ij')
        
        # Boolean mask representing the 3D sphere
        sphere_mask = (x**2 + y**2 + z**2) <= radius**2
        return sphere_mask.float()
        
    def get_cross_section(volume_tensor, axis='z', slice_idx=50):
        # Slice the 3D PyTorch tensor representing the cross-section
        if axis == 'z':
            return volume_tensor[:, :, slice_idx]
        elif axis == 'y':
            return volume_tensor[:, slice_idx, :]
        elif axis == 'x':
            return volume_tensor[slice_idx, :, :]
  v8_sanity_audit:
    sympy_pseudo_code: >
      import sympy as sp
      
      # 1. Volume of a Cone via Integration
      R, H, z = sp.symbols('R H z', positive=True)
      # Radius of cross-section at height z (from vertex z=0 to base z=H)
      r_z = (z/H)*R
      area_z = sp.pi * r_z**2
      volume_cone = sp.integrate(area_z, (z, 0, H))
      # Output: pi*R**2*H/3
      
      # 2. Surface Area of a Sphere via Integration
      theta, phi = sp.symbols('theta phi')
      # Integrate area element over spherical coordinates
      area_element = R**2 * sp.sin(phi)
      surface_area_sphere = sp.integrate(area_element, (theta, 0, 2*sp.pi), (phi, 0, sp.pi))
      # Output: 4*pi*R**2
