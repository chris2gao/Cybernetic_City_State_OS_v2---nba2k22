code_implementation: |-
  import torch

  def simulate_martingale(steps=100, paths=10):
      # Fair coin toss random walk: E[X_{t+1} | X_t] = X_t
      increments = torch.randn(paths, steps)
      martingale = torch.cat([torch.zeros(paths, 1), increments], dim=1).cumsum(dim=1)
      
      current_state = martingale[:, :-1]
      expected_next = current_state + increments.mean()
      
      deviation = torch.abs(expected_next - current_state).mean().item()
      return deviation
