    import sympy

    # 561 is the smallest Carmichael number (3 * 11 * 17)
    carmichael_num = 561

    # sympy.isprime is robust and correctly identifies it as composite
    is_prime_sympy = sympy.isprime(carmichael_num)

    # The Fermat test for base 2:
    # 561 fails to be prime, but base 2 sneaks through the 'metal detector'
    fermat_pass = pow(2, carmichael_num - 1, carmichael_num) == 1

    # Since 561 is a Carmichael number, fermat_pass is True, 
    # but is_prime_sympy is False.
