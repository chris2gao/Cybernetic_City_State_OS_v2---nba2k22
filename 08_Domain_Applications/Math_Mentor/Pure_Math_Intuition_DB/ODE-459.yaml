llm_physical_mapping: "mundane physical metaphor: Like a guitar string fixed tightly at both ends. When plucked, the string can only vibrate in specific standing wave patterns (harmonics) that fit exactly between the two fixed boundaries. These specific vibrational modes act as an orthogonal set of natural frequencies for the physical system."
code_implementation: |
  import sympy as sp
  x, lam = sp.symbols('x lambda')
  y = sp.Function('y')(x)
  # Sturm-Liouville differential equation
  eq = sp.Eq(y.diff(x, 2) + lam * y, 0)
v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy as sp
    x = sp.Symbol('x')
    f1 = sp.sin(x)
    f2 = sp.sin(2*x)
    inner_product = sp.integrate(f1 * f2, (x, 0, sp.pi))
    assert sp.simplify(inner_product) == 0
