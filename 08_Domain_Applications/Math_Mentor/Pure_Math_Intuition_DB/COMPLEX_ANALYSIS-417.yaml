pure_math_definition:
  english: |-
    Construct the complex numbers as the set of ordered pairs (a, b) of real
    numbers with componentwise addition and the product
    (a, b)(c, d) = (ac - bd, ad + bc). This set is a field. Writing i for (0, 1)
    and identifying the real number a with (a, 0), every element is written
    uniquely as a + bi; that expression is standard NOTATION for the pair, not
    the object itself. In this notation i^2 = -1. For z = a + bi the real part is
    a, the imaginary part is b, and the modulus is |z| = sqrt(a^2 + b^2).

    Define the map M(z) = i z. It sends a + bi to -b + ai, and it is R-linear.
    Under the identification of a + bi with the point (a, b), M is exactly the
    linear map with matrix [[0, -1], [1, 0]] in the standard basis with the
    standard orientation: a counterclockwise quarter turn about the origin. Its
    determinant is 1 and it preserves modulus, so M is a rotation and not a
    scaling. Applying M four times is the identity, which is the geometric
    content of i^4 = 1.

    Note the distinction: the rotation is a property of the MAP "multiply by i",
    not of the number i itself. For a nonzero w, the map z -> wz is a rotation by
    arg(w) composed with a scaling by |w|; for w = 0 the map collapses everything
    to 0 and is neither.
  chinese: |-
    把复数构造为实数有序对 (a, b) 的集合，加法按分量进行，乘法为
    (a, b)(c, d) = (ac - bd, ad + bc)。该集合构成域。记 i 为 (0, 1)，并把实数 a
    与 (a, 0) 等同，则每个元素唯一地写成 a + bi；该式是这个有序对的标准**记号**，
    而不是对象本身。在此记号下 i^2 = -1。对 z = a + bi，实部为 a，虚部为 b，
    模为 |z| = sqrt(a^2 + b^2)。

    定义映射 M(z) = i z。它把 a + bi 送到 -b + ai，且是 R-线性的。在把 a + bi 与
    平面点 (a, b) 等同后，M 恰是标准基与标准定向下矩阵为 [[0, -1], [1, 0]] 的线性
    映射，即绕原点逆时针旋转 90°。其行列式为 1 且保模，故 M 是旋转而非缩放。
    M 作用四次为恒等映射，这正是 i^4 = 1 的几何含义。

    注意区分：旋转是**映射**「乘以 i」的性质，不是数 i 本身的性质。对非零 w，
    映射 z -> wz 是转 arg(w) 再按 |w| 缩放的复合；当 w = 0 时该映射把一切压成 0，
    既非旋转也非缩放。

assumptions_and_notation:
  - "a, b denote real numbers throughout. / 全文中 a、b 表示实数。"
  - "Rotation means counterclockwise about the origin in the standard orientation. / 旋转指标准定向下绕原点逆时针。"
  - "arg(z) is multivalued; statements about argument are made at named points, not as a global identity. / arg(z) 是多值的；关于辐角的断言只在具名点给出，不作全局恒等式。"
  - "|z| denotes modulus, which coincides with the Euclidean norm of (a, b). / |z| 表示模，与 (a,b) 的欧氏范数一致。"

