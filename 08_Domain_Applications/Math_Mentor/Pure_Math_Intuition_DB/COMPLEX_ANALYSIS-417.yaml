mode_a_intuition:
  occurrence_crisis:
    english: "Calling i 'imaginary' suggests it is not real, which blocks learners from using it; but x^2 = -1 has no real solution, so the real line alone is not closed under the operations we need."
    chinese: "把 i 叫做“虚”数暗示它不真实，反而挡住了使用它；可是 x^2 = -1 在实数里无解，说明单靠实数轴对我们需要的运算并不封闭。"
  primary:
    english: |-
      Treat i not as a mysterious quantity but as an operator: the quarter turn.
      Multiplying by i once turns the plane 90 degrees; doing it twice lands on
      the opposite side, which is why i^2 = -1 is a geometric statement rather
      than a paradox. Under this reading "imaginary" describes a direction off
      the real line, not a lack of existence.
    chinese: |-
      不要把 i 当成神秘的量，把它当成一个算子：四分之一转。乘一次 i 把平面转
      90°，转两次就到了相反方向——这正是 i^2 = -1 的几何含义，而不是悖论。
      在这个读法下，“虚”描述的是偏离实轴的方向，不是不存在。
  limitations:
    english: "The quarter-turn picture explains multiplication by i specifically. Multiplication by a general complex number combines rotation with scaling, so the pure-rotation image must not be generalised."
    chinese: "四分之一转的图景专门解释乘以 i。乘以一般复数是旋转与缩放的复合，故纯旋转图景不可外推。"

llm_physical_mapping: "mundane physical metaphor: A mechanical gear system where multiplying by 'i' engages a perpendicular crank, rotating a rigid lever by exactly 90 degrees."

