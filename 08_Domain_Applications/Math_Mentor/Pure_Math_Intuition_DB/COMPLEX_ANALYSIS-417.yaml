code_implementation: |
  import sympy as sp
  def rotate_by_i(z):
      return z * sp.I

v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy as sp
    a, b = sp.symbols('a b', real=True)
    z = a + b*sp.I
    assert sp.simplify(sp.I**2 + 1) == 0
    assert sp.simplify(sp.expand(sp.I*z) - (-b + a*sp.I)) == 0
    assert sp.simplify(sp.Abs(sp.I*z) - sp.Abs(z)) == 0
    assert sp.simplify(sp.expand(sp.I**4 * z) - z) == 0
    rot = sp.Matrix([[0, -1], [1, 0]])
    assert sp.simplify(rot.det() - 1) == 0
