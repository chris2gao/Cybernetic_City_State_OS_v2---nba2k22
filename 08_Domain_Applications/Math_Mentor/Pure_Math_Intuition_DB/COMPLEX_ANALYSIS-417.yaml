mode_a_intuition:
  occurrence_crisis:
    english: "Calling i 'imaginary' suggests it is not real, which blocks learners from using it; but x^2 = -1 has no real solution, so the real line alone is not closed under the operations we need."
    chinese: "把 i 叫做“虚”数暗示它不真实，反而挡住了使用它；可是 x^2 = -1 在实数里无解，说明单靠实数轴对我们需要的运算并不封闭。"
  primary:
    english: |-
      The object to look at is not the number i by itself, but the MAP
      M(z) = i z. That map is the quarter turn: it rotates the plane by 90
      degrees. Applying M twice is a half turn, which is why i^2 = -1 is a
      geometric statement rather than a paradox - the element i is what the map
      multiplies by, and the rotation is the map's behaviour. Under this reading
      "imaginary" names a direction off the real line, not a lack of existence.
    chinese: |-
      要看的不是 i 这个数本身，而是**映射** M(z) = i z。这个映射才是四分之一转：
      它把平面旋转 90°。M 作用两次是半转，这正是 i^2 = -1 的几何含义，而不是悖论
      ——元素 i 是映射所乘的那个数，旋转是**映射**的行为。在这个读法下，“虚”指的
      是偏离实轴的方向，不是不存在。
  limitations:
    english: "The quarter-turn picture explains multiplication by i specifically. Multiplication by a general complex number combines rotation with scaling, so the pure-rotation image must not be generalised."
    chinese: "四分之一转的图景专门解释乘以 i。乘以一般复数是旋转与缩放的复合，故纯旋转图景不可外推。"

llm_physical_mapping: "mundane physical metaphor: applying the map z -> i*z acts like engaging a perpendicular crank that turns a rigid lever by exactly 90 degrees. The crank is the MAP, not the number i; the metaphor carries no claim that complex numbers are mechanical objects."

