pure_math_definition:
  english: |-
    A complex number is an expression a + bi with a, b real and i satisfying
    i^2 = -1. Addition is componentwise; multiplication is determined by
    distributivity together with i^2 = -1. For z = a + bi the real part is a,
    the imaginary part is b, and the modulus is |z| = sqrt(a^2 + b^2).

    Multiplication by i sends a + bi to -b + ai. Identifying a + bi with the
    point (a, b), this is exactly the linear map given by the matrix
    [[0, -1], [1, 0]], a counterclockwise quarter turn about the origin. It has
    determinant 1 and preserves modulus, so it is a rotation and not a scaling.
    Applying it four times returns every point to itself, which is the geometric
    content of i^4 = 1.
  chinese: |-
    复数是形如 a + bi 的表达式，其中 a、b 为实数，i 满足 i^2 = -1。加法按分量
    进行；乘法由分配律与 i^2 = -1 唯一决定。对 z = a + bi，实部为 a，虚部为 b，
    模为 |z| = sqrt(a^2 + b^2)。

    乘以 i 把 a + bi 送到 -b + ai。若把 a + bi 与平面点 (a, b) 等同，这恰是矩阵
    [[0, -1], [1, 0]] 给出的线性映射，即绕原点逆时针旋转 90°。该矩阵行列式为 1
    且保模，所以它是旋转而非缩放。连续作用四次使每个点回到自身，这正是 i^4 = 1
    的几何含义。

assumptions_and_notation:
  - "a, b denote real numbers throughout. / 全文中 a、b 表示实数。"
  - "Rotation means counterclockwise about the origin in the standard orientation. / 旋转指标准定向下绕原点逆时针。"
  - "arg(z) is multivalued; statements about argument are made at named points, not as a global identity. / arg(z) 是多值的；关于辐角的断言只在具名点给出，不作全局恒等式。"
  - "|z| denotes modulus, which coincides with the Euclidean norm of (a, b). / |z| 表示模，与 (a,b) 的欧氏范数一致。"

