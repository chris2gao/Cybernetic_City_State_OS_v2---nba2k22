    - "The rotation is a property of the map 'multiply by i', not of the number i. Saying 'i is a rotation' conflates an element with an operator. / 旋转是映射「乘以 i」的性质，不是数 i 的性质；说「i 是旋转」混淆了元素与算子。"
    - "The quarter-turn reading depends on the standard basis and orientation of the Argand plane; it is not basis-independent. / 四分之一转的读法依赖阿尔冈平面的标准基与定向，并非与基无关。"
    - "a + bi is notation for an ordered pair; do not treat the written expression as the mathematical object. / a + bi 是有序对的记号，不可把书写表达式当作数学对象本身。"
    - "The gear/crank metaphor must not imply that complex numbers are mechanical objects or that i carries physical units. / 齿轮曲柄比喻不得暗示复数是机械物件或 i 带物理量纲。"
    - "'Imaginary' is a historical label, not a claim about existence. / “虚”是历史称谓，不是关于存在性的断言。"
    - "Using complex numbers to model a physical system does NOT imply that a physical quantity has imaginary ontology, nor that an imaginary part is directly observable. Representation is not ontology. / 用复数建模物理系统**不**蕴含物理量具有虚数本体，也不蕴含虚部可直接观测；表示不等于本体。"
    - "This node does not establish complex differentiability, analyticity, or any holomorphic-function property. / 本节点不建立复可微性、解析性或任何全纯函数性质。"

common_misconceptions:
  - signature: "imaginary_means_nonexistent"
    description: "学生认为 i 只是形式记号、不指称任何真实对象，因而拒绝在计算中使用它。"
    repair_direction: "转到映射读法：先展示**映射** z ↦ iz 把 (1,0) 送到 (0,1)、把 (0,1) 送到 (-1,0)，它就是旋转矩阵 [[0,-1],[1,0]]；再回到 i 作为该映射的乘数。注意措辞：旋转是映射的性质，不要说「i 是旋转」。"
  - signature: "rotation_generalized_to_all_multiplication"
    description: "学生把“乘法=旋转”推广到任意复数，忽略模的缩放（例如认为乘以 2i 只是旋转）。"
    repair_direction: "给出 |2i·z| = 2|z| 的具体计算，区分“乘以单位模复数”与“乘以一般复数”。"
  - signature: "i_squared_treated_as_paradox"
    description: "学生把 i^2 = -1 当作需要背诵的怪规则，而非映射 M(z)=iz 复合两次的必然结果。"
    repair_direction: >-
      让学生亲手走一遍，两种走法都要走对起点：
      (a) 从 1 即 (1,0) 出发，**两次**作用 M：(1,0) → (0,1) → (-1,0)，
      这演示的是 i^2 · 1 = -1；
      (b) 从 i 即 (0,1) 出发，**一次**作用 M：(0,1) → (-1,0)，
      这演示的是 i · i = -1。
      切勿说「把 (0,1) 旋转两次得到 (-1,0)」——那实际到达 (0,-1)，对应 i^3 = -i。

