common_misconceptions:
  - signature: "imaginary_means_nonexistent"
    description: "学生认为 i 只是形式记号、不指称任何真实对象，因而拒绝在计算中使用它。"
    repair_direction: "转到算子读法：i 是平面上的 90° 旋转，与旋转矩阵一一对应；先展示 i 的作用，再回到符号。"
  - signature: "rotation_generalized_to_all_multiplication"
    description: "学生把“乘法=旋转”推广到任意复数，忽略模的缩放（例如认为乘以 2i 只是旋转）。"
    repair_direction: "给出 |2i·z| = 2|z| 的具体计算，区分“乘以单位模复数”与“乘以一般复数”。"
  - signature: "i_squared_treated_as_paradox"
    description: "学生把 i^2 = -1 当作需要背诵的怪规则，而非两次旋转的必然结果。"
    repair_direction: "让学生自己把 (0,1) 旋转两次得到 (-1,0)，从几何读出该等式。"

