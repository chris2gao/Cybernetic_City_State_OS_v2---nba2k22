id: "CALCULUS-302"
concept_name: "隐函数定理与反函数定理 - 反函数求导定理的推导 (n_302)"
sub_topics:
  - "导数作为局部线性变换的逆映射"
  - "dy/dx = 1/(dx/dy) 的代数前提"
  - "多元情形下的雅可比矩阵求逆"
  - "几何视角：关于 y=x 对称的斜率倒数关系"
llm_physical_mapping: "mundane physical metaphor: viewing a steep hill from the side; if its slope is 3 going up, looking at it sideways makes the slope 1/3."
code_implementation: |
  import sympy as sp
  y = sp.Symbol('y')
  x = sp.sin(y)
  dxdy = sp.diff(x, y)
  dydx = 1 / dxdy
v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy as sp
    y = sp.Symbol('y')
    x = sp.exp(y)
    dxdy = sp.diff(x, y)
    assert sp.simplify(dxdy * (1/dxdy)) == 1