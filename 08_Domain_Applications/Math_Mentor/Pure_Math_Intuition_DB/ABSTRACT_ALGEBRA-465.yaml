    import sympy as sp
    from sympy.combinatorics import Permutation, PermutationGroup
    
    G = PermutationGroup(Permutation(0, 1, 2), Permutation(0, 1))
    H = PermutationGroup(Permutation(0, 1, 2))
    assert H.is_normal(G) == True
    assert G.order() % H.order() == 0  # Lagrange's theorem
