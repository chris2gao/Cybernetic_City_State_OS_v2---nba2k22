  code_implementation: |
    import torch
    
    def calculate_distance(a, b):
        """Calculates the physical distance between two points on a 1D axis."""
        tensor_a = torch.tensor(a, dtype=torch.float32)
        tensor_b = torch.tensor(b, dtype=torch.float32)
        return torch.abs(tensor_a - tensor_b)
