name: 更新过程 - 研究事件发生间隔时间为任意分布的随机计数系统。 (n_554)
sub_topics:
  - 更新方程及其级数解
  - 更新定理（Elementary Renewal Theorem）
  - 剩余寿命与年龄的随机分布
  - 系统可靠性维持与更换策略分析
llm_physical_mapping: Continual replacement of light bulbs in a factory; when one burns out after an unpredictable (but not necessarily memoryless) lifetime, a new one is instantly screwed in.
code_implementation: |
  import torch

  # Factory replacing light bulbs: Generic renewal process
  num_bulbs = 500
  # Bulbs have a uniform lifetime, not exponential (memoryless)
  bulb_lifetimes = 1.0 + 2.0 * torch.rand(num_bulbs) # Uniform(1, 3)

  # Time when each replacement happens
  replacement_times = torch.cumsum(bulb_lifetimes, dim=0)

  T = 100.0
  # How many bulbs burned out and were replaced by time T?
  renewals_by_T = torch.sum(replacement_times < T).item()
  expected_lifespan = 2.0
  assert abs(renewals_by_T - (T / expected_lifespan)) < 20
v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy as sp
    s, lmbda = sp.symbols('s lambda', positive=True)
    f_star = lmbda / (s + lmbda)
    M_star = f_star / (1 - f_star)
    assert sp.simplify(M_star - lmbda / s) == 0, "Renewal function for exponential yields linear lambda*t"
