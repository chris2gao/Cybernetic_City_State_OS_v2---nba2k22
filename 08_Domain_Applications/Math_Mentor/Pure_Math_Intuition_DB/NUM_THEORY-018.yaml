node_metadata:
  id: "NUM_THEORY-018"
  type: "math_concept_node"
  title: "欧几里得算法（辗转相除法） - 消除奇迹步骤：欧几里得算法的几何面积分割直觉（用小正方形填满大长方形的物理过程） (n_212)"
  sub_topics:
    - "带余除法的几何解释"
    - "矩形铺砖问题的数学化"
    - "算法步骤与几何缩减的对应"
    - "最大公约数的几何本质"

llm_physical_mapping: |
  Imagine you have a rectangular floor of size a x b (where a > b). You want to tile this entire floor using identical, perfectly square tiles as large as possible, without breaking any tiles.
  You start by placing the largest squares you can along the short edge: b x b.
  You fill the rectangle with as many b x b squares as possible. This is the division part (a // b).
  If there is a remainder, you are left with a smaller unfilled rectangular strip of size b x (a % b).
  Now, your new problem is just a smaller version of the original problem: tile this new smaller rectangle (b x (a % b)) with the largest possible squares.
  You repeat this process. The size of the squares gets smaller and smaller until they perfectly fill the remaining space without any remainder.
  The side length of the final square that perfectly tiles the last remaining rectangle is exactly the Greatest Common Divisor (GCD) of a and b.
  Because this square tiles the final rectangle, it must also be able to tile the previous one, and so on, all the way back to tiling the original a x b floor.

code_implementation: |
  def euclidean_gcd(a, b):
      # Physical analogy: a is length, b is width
      while b != 0:
          # a % b represents the dimension of the remaining smaller rectangle
          # b becomes the new 'length', a % b becomes the new 'width'
          a, b = b, a % b
      # The non-zero remainder is the size of the perfect tile
      return a

v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy
    test_a = 1071
    test_b = 462
    
    # SymPy's built-in GCD
    sympy_result = sympy.gcd(test_a, test_b)
    
    # Our Python implementation logic
    curr_a, curr_b = test_a, test_b
    while curr_b != 0:
        curr_a, curr_b = curr_b, curr_a % curr_b
    python_result = curr_a
    
    assert sympy_result == python_result
