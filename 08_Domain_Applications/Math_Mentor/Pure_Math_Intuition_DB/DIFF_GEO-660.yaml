concept_name: 测地线、指数映射与 Riemannian 距离 (n_660)
sub_topics:
- geodesic equation for an affine connection
- Levi-Civita geodesics and fixed-endpoint variations of the energy functional
- local minimizing behavior versus global shortest-path claims
- coordinate geodesic equation and Christoffel-symbol dependence
- initial-value formulation and local existence and uniqueness
- exponential map and its local-diffeomorphism property
- cut points, conjugate points, and failure of global uniqueness
- bounded relation to optimal transport, diffusion, and flow matching
llm_physical_mapping: >-
  重力滑道只作为次级提示：它可提示“相对于所选几何没有额外横向加速度”，但滑道
  本身没有给出联络、度量、变分原理或全局最短性，更不能证明普通扩散或 flow
  matching 轨迹是 Wasserstein 测地线。
code_implementation: |
  import torch
  import numpy as np

  def geodesic_step(position, velocity, christoffel_symbols, dt=0.01):
      # Step along geodesic using Christoffel symbols to update velocity
      acceleration = -torch.einsum('ijk,j,k->i', christoffel_symbols, velocity, velocity)
      new_velocity = velocity + acceleration * dt
      new_position = position + new_velocity * dt
      return new_position, new_velocity

  pos = torch.zeros(2)
  vel = torch.tensor([1.0, 0.0])
  Gamma = torch.zeros(2, 2, 2)  # flat space for dummy example
  pos_next, vel_next = geodesic_step(pos, vel, Gamma)
