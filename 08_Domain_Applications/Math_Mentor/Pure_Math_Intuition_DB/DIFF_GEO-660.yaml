mapping_boundary:
  primary_mapping_kind: "llm_architecture_bounded_structural_analogy"
  primary_mapping: >-
    Only after an explicit geometry has been supplied, a geodesic can
    analogize a representation or probability path whose acceleration is zero
    relative to that geometry. In generative modeling, a probability path is
    a Wasserstein geodesic only when an optimal-transport metric, admissible
    measure space, and displacement interpolation or equivalent geodesic
    dynamics are established. This mapping highlights the difference between
    following a chosen geometry and merely producing a smooth trajectory.
  primary_mapping_zh: >-
    只有先明确给出几何结构，才可把测地线类比为相对于该几何“无横向加速度”的
    表示路径或概率路径。在生成模型中，只有明确建立最优传输度量、允许的概率测度
    空间以及位移插值或等价测地动力学时，概率路径才可称为 Wasserstein 测地线。
    该类比强调：沿选定几何演化与仅仅生成一条平滑轨迹并不是同一件事。
  boundary:
    - "Generic diffusion trajectories are not automatically Wasserstein geodesics."
    - "Generic flow-matching paths are not automatically shortest or geodesic paths."
    - "A learned vector field satisfying a continuity equation does not by itself prove geodesic optimality."
    - "A hidden-state interpolation is not a Riemannian geodesic without an explicit manifold, metric, and connection."
    - "The exponential map sends an initial tangent velocity to a geodesic endpoint where defined; it is not a generic operation that pulls a vector back onto a manifold."
    - "Local minimizing behavior does not imply global shortest-path behavior or uniqueness."
    - "No machine-verifiable Wasserstein or Riemannian geometry of an ordinary model is established by this node."
  preserve_full_boundary: true
  existing_physical_metaphor_status: "secondary_teaser_only"
  secondary_teaser_limitation: >-
    The gravity-slide image only hints at motion without externally imposed
    transverse acceleration. It does not supply a connection, metric,
    variational principle, global minimum, or optimal-transport proof.
