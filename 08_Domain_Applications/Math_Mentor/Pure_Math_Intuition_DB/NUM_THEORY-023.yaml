version: "9.1"
concept_node:
  id: "NUM_THEORY-023"
  name: "欧拉定理 - 欧拉定理 (a^φ(n) ≡ 1 (mod n)) 的缩系（既约同余类）重排证明法 (n_217)"
  domain: "Number Theory"
  sub_topics:
    - "缩系 (Reduced Residue System) 的概念"
    - "乘法映射的置换性质"
    - "定理的代数构造证明"
    - "费马小定理的推广意义"
  llm_physical_mapping: "mundane physical metaphor: a permutation of slots in a lock where multiplying by coprime 'a' just shuffles the slots but leaves the entire set identical."
  code_implementation: |
    import torch
    import math

    def euler_totient(n):
        return sum(1 for k in range(1, n + 1) if math.gcd(n, k) == 1)

    def check_euler(a, n):
        if math.gcd(a, n) != 1:
            return False
        phi_n = euler_totient(n)
        a_t = torch.tensor(a, dtype=torch.int64)
        n_t = torch.tensor(n, dtype=torch.int64)
        # Using Python's pow for reliable modular exponentiation
        # to avoid PyTorch tensor overflow with simple torch.pow
        return pow(a_t.item(), phi_n, n_t.item()) == 1
  v8_sanity_audit:
    sympy_pseudo_code: |
      from sympy import gcd, totient
      
      def test_rearrangement(a, n):
          if gcd(a, n) != 1:
              return
          rrs = [x for x in range(1, n) if gcd(x, n) == 1]
          shuffled = [(a * x) % n for x in rrs]
          assert sorted(rrs) == sorted(shuffled)
          assert (a ** totient(n)) % n == 1
          
      test_rearrangement(3, 10)
      test_rearrangement(5, 14)
