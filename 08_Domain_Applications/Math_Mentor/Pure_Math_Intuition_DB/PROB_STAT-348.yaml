id: "PROB_STAT-348"
concept_name: "随机变量 - 将样本空间事件映射为实数轴数值的机器 (n_348)"
sub_topics:
  - "随机变量作为可测函数的本质"
  - "离散型随机变量的分布律"
  - "连续型随机变量的密度函数"
  - "指示变量与随机变量的代数构造"
llm_physical_mapping: "mundane physical metaphor: a slot machine payout table. It maps the raw physical events (the symbols on the reels like cherries or bells) to actual numerical values (chips won)."
code_implementation: |
  import sympy as sp
  from sympy.stats import Coin, P, E
  
  # Mapping from sample space (H, T) to Real numbers (1, 0)
  C = Coin('C')
  # Indicator variable: 1 if Heads, 0 if Tails
  I_C = sp.Piecewise((1, sp.Eq(C, 'H')), (0, True))
v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy as sp
    from sympy.stats import FiniteRV, P
    
    # Mapping colors to numbers
    density = {'Red': sp.Rational(1, 2), 'Black': sp.Rational(1, 2)}
    # Instead of symbolic Piecewise on strings, we define the numeric RV directly
    # representing the mapping result.
    X = FiniteRV('X', {1: sp.Rational(1, 2), 0: sp.Rational(1, 2)})
    
    assert P(sp.Eq(X, 1)) == sp.Rational(1, 2)
    assert P(sp.Eq(X, 0)) == sp.Rational(1, 2)
