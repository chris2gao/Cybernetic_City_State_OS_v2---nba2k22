code_implementation: |
  import sympy as sp
  from sympy.stats import FiniteRV, P

  # Mapping raw events to numbers: Heads -> 1, Tails -> 0.
  X = FiniteRV('X', {1: sp.Rational(1, 2), 0: sp.Rational(1, 2)})
  prob_heads_value = P(sp.Eq(X, 1))
v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy as sp
    from sympy.stats import FiniteRV, P
    
    # Mapping colors to numbers
    density = {'Red': sp.Rational(1, 2), 'Black': sp.Rational(1, 2)}
    # Instead of symbolic Piecewise on strings, we define the numeric RV directly
    # representing the mapping result.
    X = FiniteRV('X', {1: sp.Rational(1, 2), 0: sp.Rational(1, 2)})
    
    assert P(sp.Eq(X, 1)) == sp.Rational(1, 2)
    assert P(sp.Eq(X, 0)) == sp.Rational(1, 2)
