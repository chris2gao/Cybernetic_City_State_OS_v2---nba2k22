id: "COMBINATORICS-585"
concept_name: "代数组合（Polya计数） - 发生学溯源：利用置换群与哈希对称性，将物理上等价的染色方案通过数学手段进行消重。 (n_585)"
sub_topics:
  - "置换群在着色方案上的作用"
  - "伯恩赛德引理 (Burnside's Lemma)"
  - "波利亚计数定理 (Polya Enumeration Theorem)"
  - "物理直觉：消除观察视角重叠带来的重复计数"
llm_physical_mapping: "mundane physical metaphor: A physical stamping die stamping designs onto a rotating cube; instead of counting every possible rotation, the machine physically locks identical painted faces together, melting them into a single cast."
code_implementation: |
  import sympy as sp
  g_size = 4
  fix_points_sum = 4 + 0 + 0 + 0
  orbits = fix_points_sum / g_size
