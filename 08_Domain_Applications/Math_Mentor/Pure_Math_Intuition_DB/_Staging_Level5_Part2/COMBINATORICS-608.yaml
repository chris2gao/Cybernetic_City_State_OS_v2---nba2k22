id: "COMBINATORICS-608"
concept_name: "数值微分 - 消除奇迹步骤：利用有限差分截断逼近导数。 (n_608)"
sub_topics:
  - "前向、后向与中心差分公式推导"
  - "泰勒展开在截断误差分析中的核心作用"
  - "二阶及高阶导数的离散算子构造"
  - "物理直觉：通过观测相邻状态的变化估算即时动量"
llm_physical_mapping: "mundane physical metaphor: 在轰隆隆的工厂输送带两边架着两个间隔半米的机械眼，通过两次咔嚓快门的生硬距离差硬算包裹飞出去的速度。"
code_implementation: |
  import sympy as sp
  x, h = sp.symbols('x h')
  f = sp.Function('f')
  forward_diff = (f(x + h) - f(x)) / h
v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy as sp
    x, h = sp.symbols('x h')
    f = sp.Function('f')
    forward_diff = (f(x + h) - f(x)) / h
    assert sp.simplify(forward_diff * h + f(x)) == f(x + h)