id: "COMBINATORICS-625"
concept_name: |-
  快速傅里叶变换（FFT） - 证明黑魔法：利用单位根的代数对称性，将 DFT 计算极速折叠。将 $O(N^2)$ 操作降维打击为 $O(N \log N)$。 (n_625)
sub_topics:
  - "蝶形运算 (Butterfly operations) 结构"
  - "库利-图基 (Cooley-Tukey) 递归分治算法"
  - "单位复根的周期性与对称性利用"
  - "历史上 FFT 对数字信号处理革命的推动"
llm_physical_mapping: "mundane physical metaphor: 一个高速自动折纸机，把一张巨长的电报纸按规律反复对折、再对折，通过这种「折叠」动作，瞬间就把隐藏在杂乱波形里的重复花纹给揪出来了。"
code_implementation: |
  import numpy as np
  x = np.array([1, 2, 1, 0])
  X = np.fft.fft(x)
  print(X)
v8_sanity_audit:
  sympy_pseudo_code: |
    import numpy as np
    x = np.array([1, 0, 1, 0])
    X = np.fft.fft(x)
    assert abs(X[0] - 2) < 1e-6
