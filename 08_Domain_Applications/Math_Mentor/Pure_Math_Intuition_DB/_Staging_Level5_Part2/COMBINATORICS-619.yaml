id: "COMBINATORICS-619"
concept_name: '数值优化基础 - 认知跃迁：在复杂海森矩阵地形中，利用动量（Momentum）跳出局部最优陷阱（鞍点），寻找全局 Loss 极小点。 (n_619)'
sub_topics:
  - '重力球模型的动力学类比'
  - '惯性项对震荡的平滑作用'
  - 'Nesterov 加速梯度 (NAG) 的预测机制'
  - '动量在大规模分布式训练中的同步策略'
llm_physical_mapping: "mundane physical metaphor: pushing a rusty cart with bad wheels. It builds up heavy physical inertia. If you hit a small speed bump, the sheer weight of the fast-moving cart plows right through it instead of getting stuck."
code_implementation: |
  import sympy as sp
  v, grad, beta, lr = sp.symbols('v grad beta lr')
  v_next = beta * v + (1 - beta) * grad
  x, x_next = sp.symbols('x x_next')
  update = x - lr * v_next
v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy as sp
    v, grad, beta, lr = sp.symbols('v grad beta lr')
    v_next = beta * v + (1 - beta) * grad
    assert v_next.subs({beta: 0.9, v: 10, grad: 0}) == 9.0
