id: "COMBINATORICS-620"
concept_name: "数值优化基础 - 凸优化理论作为离散逼近的最坚实防线。 (n_620)"
sub_topics:
  - "凸性对全局唯一解的保障"
  - "强凸性与收敛速率的量化关联"
  - "投影梯度法处理约束优化"
  - "为复杂非线性问题寻找局部凸化的安全边界"
llm_physical_mapping: "mundane physical metaphor: 一个巨大的 U 型重力漏斗，无论你在边缘哪个位置丢下铁球，它都只能顺着斜坡滚向唯一的中心出料口，不存在任何坑洼让它停在半路。"
code_implementation: |
  import sympy as sp
  x = sp.symbols('x')
  f = x**2 + 4*x + 4
  df = sp.diff(f, x)
  sol = sp.solve(df, x)
  print(sol)
v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy as sp
    x = sp.symbols('x')
    f = x**2
    df2 = sp.diff(f, x, 2)
    assert df2 > 0
