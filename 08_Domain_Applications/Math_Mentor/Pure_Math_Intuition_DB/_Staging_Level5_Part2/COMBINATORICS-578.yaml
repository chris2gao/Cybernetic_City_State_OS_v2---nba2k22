id: "COMBINATORICS-578"
concept_name: "生成函数 - 消除奇迹步骤：离散数学中最具黑魔法气质的武器。绝不能视为普通级数，而应视为“离散序列的连续化封装”。 (n_578)"
sub_topics:
  - "普通生成函数与指数生成函数的定义"
  - "序列操作（平移、卷积）向代数运算的转换"
  - "递归方程的生成函数求解法"
  - "认知飞跃：用多项式代数处理无穷组合问题"
llm_physical_mapping: "mundane physical metaphor: A mechanical music box where discrete musical notes (sequence terms) are physically etched as continuous bumps onto a rotating metal cylinder, transforming separate events into a continuous physical object."
code_implementation: |
  import sympy as sp
  x = sp.Symbol('x')
  gf = 1 / (1 - x)
  series_expansion = gf.series(x, 0, 4).removeO()
v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy as sp
    x = sp.Symbol('x')
    gf = 1 / (1 - x)
    series_expansion = gf.series(x, 0, 4).removeO()
    assert series_expansion == 1 + x + x**2 + x**3
    assert True
