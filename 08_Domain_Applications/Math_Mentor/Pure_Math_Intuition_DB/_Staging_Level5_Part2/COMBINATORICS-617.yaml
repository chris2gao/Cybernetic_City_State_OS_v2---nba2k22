id: "COMBINATORICS-617"
concept_name: '常微分方程数值解 - 【核心 AI 映射】：生成的绝对法则。在流匹配（Flow Matching）中依靠 ODE Solver 沿速度场轨迹稳定还原出高分辨率输出。 (n_617)'
sub_topics:
  - '反向 ODE 的采样动力学'
  - '解法精度对图像生成质量的影响'
  - '连续时间神经网络 (Neural ODEs) 的训练与推理'
  - '概率流 ODE 的数值稳健性分析'
llm_physical_mapping: "mundane physical metaphor: a boat drifting backward up a river by exactly reading the flow meters (ODE solver) and reversing the paddle blades, tracking perfectly back to its origin without slamming into the mud banks."
code_implementation: |
  import sympy as sp
  x, t = sp.symbols('x t')
  v_field = -x / t
  x_t = sp.Function('x')(t)
  eq = sp.Eq(x_t.diff(t), -x_t / t)
v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy as sp
    x, t = sp.symbols('x t')
    x_t = sp.Function('x')(t)
    eq = sp.Eq(x_t.diff(t), -x_t / t)
    sol = sp.dsolve(eq, x_t)
    assert 'C1' in str(sol)
