id: "COMBINATORICS-631"
concept_name: "刚性方程组的数值处理 - 理解 L-稳定性 在物理仿真芯片中的核心地位。 (n_631)"
sub_topics:
  - "L-稳定性的定义（无穷远处的渐进衰减）"
  - "消除寄生震荡的物理机制"
  - "在硬实时仿真系统中的关键算法筛选"
  - "保证数值解在极端梯度下依然具备物理一致性"
llm_physical_mapping: "mundane physical metaphor: 一个装在战车上的巨型液压吸能器，不管外面的路颠成什么鬼样，甚至有瞬间的高频爆炸冲击，这吸能器都能把它瞬间消化干净，让车体纹丝不动。"
code_implementation: |
  import numpy as np
  def implicit_euler_step(y, lmbda, dt):
      return y / (1 + lmbda * dt)
  print(implicit_euler_step(1, 1e10, 1))
v8_sanity_audit:
  sympy_pseudo_code: |
    import numpy as np
    z = -1e10
    assert abs(1 / (1 - z)) < 1e-9
