id: "COMBINATORICS-605"
concept_name: "插值与逼近 - 在处理非对齐时序数据或坐标变换中寻觅平稳流形。 (n_605)"
sub_topics:
  - "非等距采样点的重构算法"
  - "多维数据的径向基函数 (RBF) 插值"
  - "在 Token 序列 Embedding 插值中的应用"
  - "坐标对齐对特征提取一致性的重要性"
llm_physical_mapping: "mundane physical metaphor: 地上竖着几根高矮不齐的粗壮木头桩子，往上面强行铺一张厚重的油布，油布自身重量拽下形成一片无死角的连续陡坡面。"
code_implementation: |
  import sympy as sp
  x, y, xc, yc = sp.symbols('x y xc yc')
  rbf_tent = sp.exp(-((x - xc)**2 + (y - yc)**2))
v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy as sp
    x, y, xc, yc = sp.symbols('x y xc yc')
    rbf_tent = sp.exp(-((x - xc)**2 + (y - yc)**2))
    peak = rbf_tent.subs({x: xc, y: yc})
    assert peak == 1