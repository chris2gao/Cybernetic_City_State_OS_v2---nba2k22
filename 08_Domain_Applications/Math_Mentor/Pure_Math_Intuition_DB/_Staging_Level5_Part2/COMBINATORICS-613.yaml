id: "COMBINATORICS-613"
concept_name: '线性方程组的数值解 - 主宰特征向量搜索与大规模稀疏系统的物理演化。 (n_613)'
sub_topics:
  - '稀疏矩阵存储格式（CSR/CSC）对效率的影响'
  - '预处理技术（Preconditioning）加速收敛'
  - '在图神经网络（GNN）信息传递中的数学应用'
  - '物理动力学模拟中长程作用力的数值加速'
llm_physical_mapping: "mundane physical metaphor: packing an empty warehouse. Instead of paying rent for every empty cubic foot (dense matrix), you only write down the shelf number of the few boxes that actually exist (sparse matrix), dodging massive blank spaces."
code_implementation: |
  import sympy as sp
  M = sp.Matrix([[5, 0, 0], [0, 0, 2], [0, 3, 0]])
  inv_D = sp.Matrix([[1/5, 0, 0], [0, 1, 0], [0, 0, 1]])
  M_pre = inv_D * M
v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy as sp
    M = sp.Matrix([[5, 0], [0, 2]])
    inv_D = M.inv()
    assert inv_D * M == sp.eye(2)
