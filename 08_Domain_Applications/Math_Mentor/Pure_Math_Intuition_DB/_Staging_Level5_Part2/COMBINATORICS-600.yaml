id: "COMBINATORICS-600"
concept_name: "浮点数与误差 - 发生学溯源：在有限 32/16 位寄存器中表示无限连续数字的折中（IEEE 754）。 (n_600)"
sub_topics:
  - "浮点数的阶码、尾数与符号位结构"
  - "动态范围与精度的物理权衡"
  - "非正规数与无穷大的溢出处理"
  - "数字化过程对连续世界的残忍切割"
llm_physical_mapping: "mundane physical metaphor: 就像用固定长宽的水泥砖块去硬拼一条天然弯曲的乡间土路，砖块边缘总是会留出长短不一的泥巴缝隙无法完全填平。"
code_implementation: |
  import sympy as sp
  x = sp.Symbol('x')
  truncated_value = sp.floor(x * 10) / 10
v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy as sp
    x = sp.Symbol('x')
    truncated_value = sp.floor(x * 10) / 10
    assert truncated_value.subs(x, sp.Rational(123, 100)) == sp.Rational(6, 5)
