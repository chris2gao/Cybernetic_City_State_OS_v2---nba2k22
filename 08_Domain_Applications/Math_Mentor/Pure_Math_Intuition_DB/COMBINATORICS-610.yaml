concept_name: '数值微分 - 理解步长选取引起的“截断误差”与“舍入误差”的权衡博弈。 (n_610)'
sub_topics:
  - '误差总量的 U 形曲线分布'
  - '最佳步长 h_opt 的解析推导'
  - '步长过小导致的数字化“噪音”放大'
  - '数值稳定性在长期迭代中的保障'
llm_physical_mapping: "mundane physical metaphor: calibrating a rusty micrometer. Pinch it too tight, the metal gears grind and produce static noise (round-off); leave it too loose, the gap misses the exact thickness entirely (truncation error)."
code_implementation: |
  import sympy as sp
  h = sp.Symbol('h', positive=True)
  trunc_error = h**2
  round_error = 1/h
  total_error = trunc_error + round_error
  best_h = sp.solve(sp.diff(total_error, h), h)[0]
v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy as sp
    h = sp.Symbol('h', positive=True)
    total_error = h**2 + 1/h
    best_h = sp.solve(sp.diff(total_error, h), h)[0]
    assert best_h > 0
