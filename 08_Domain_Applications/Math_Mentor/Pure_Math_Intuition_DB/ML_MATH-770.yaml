llm_physical_mapping: "factory workshop-level mechanical metaphor: precision fluid pipeline routing. Flow matching calculates the optimal hydraulic pressure trajectory, pumping random noise through valves via a perfectly straight geodesic tube to solidify into an ordered product with minimal turbulence."
code_implementation: |
  import torch
  
  def flow_matching_ode_step(x_noise, x_target, t, dt):
      # Construct straight line velocity field (geodesic trajectory)
      velocity_field = x_target - x_noise
      # Integrate the ODE directly
      x_next = x_noise + velocity_field * dt
      return x_next
v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy as sp
    x_0, x_1, t = sp.symbols('x_0 x_1 t')
    # Linear interpolation trajectory
    x_t = (1 - t) * x_0 + t * x_1
    v_t = sp.diff(x_t, t)
    # Velocity field is constant x_1 - x_0
    assert sp.simplify(v_t - (x_1 - x_0)) == 0
