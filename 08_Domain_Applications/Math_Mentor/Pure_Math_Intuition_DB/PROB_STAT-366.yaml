  - "变量独立性的分布函数判定"
llm_physical_mapping: "Picture a 2D bullet hole map representing the joint distribution. Projecting all holes onto the x-axis gives the marginal chip distribution. Taking a very thin vertical slice of the map and renormalizing its holes gives the conditional chip distribution."
code_implementation: |
  import sympy as sp
  x, y = sp.symbols('x y', real=True)
  f_xy = sp.Function('f')(x, y)
  # Marginal distribution of X
  f_x = sp.Integral(f_xy, (y, -sp.oo, sp.oo))
  # Conditional distribution of Y given X
  f_y_given_x = f_xy / f_x
v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy as sp
    x, y = sp.symbols('x y', real=True)
    f_xy = sp.exp(-x**2 - y**2) / sp.pi
    f_x = sp.integrate(f_xy, (y, -sp.oo, sp.oo))
    f_y_given_x = f_xy / f_x
    assert sp.simplify(f_y_given_x - sp.exp(-y**2)/sp.sqrt(sp.pi)) == 0
