  code_implementation: |
    # PyTorch 3D cross products and dot products indicating coplanarity
    import torch

    def check_coplanarity_and_skew(p1, p2, q1, q2):
        # Line 1 passes through p1, p2; Line 2 passes through q1, q2
        v1 = p2 - p1
        v2 = q2 - q1
        v_diff = q1 - p1
        
        # Cross product of direction vectors
        cross_prod = torch.cross(v1, v2)
        
        # Dot product with difference vector (scalar triple product)
        volume = torch.dot(v_diff, cross_prod)
        
        is_coplanar = torch.abs(volume) < 1e-6
        is_skew = not is_coplanar
        return is_coplanar, is_skew
  v8_sanity_audit:
    sympy_pseudo_code: |
      from sympy import Point3D, Line3D, Plane
      
      # Define points
      p1, p2, p3 = Point3D(0, 0, 0), Point3D(1, 0, 0), Point3D(0, 1, 0)
      p4, p5 = Point3D(0, 0, 1), Point3D(1, 1, 1)
      
      # Define Plane and Line
      plane = Plane(p1, p2, p3)
      line = Line3D(p4, p5)
      
      # Intersections and relationships
      intersection = plane.intersection(line)
      is_parallel = plane.is_parallel(line)
      is_perpendicular = plane.is_perpendicular(line)
