id: "CALCULUS-297"
concept_name: "多元函数极值（条件极值/拉格朗日乘数法） - 拉格朗日乘数法 (Lagrange Multipliers)：带高维约束条件的终极优化机器 (n_297)"
sub_topics:
  - "辅助函数的构造：L = f + λg"
  - "梯度共线（平行）的几何物理直觉"
  - "约束超曲面与目标等值线的切点分析"
  - "在大规模参数对齐（如 RLHF）中的对偶逻辑"
llm_physical_mapping: "mundane physical metaphor: walking along a fence (constraint) on a hillside (function) and finding the highest or lowest point you can reach without jumping over."
code_implementation: |
  import sympy as sp
  x, y, l = sp.symbols('x y l')
  f = x * y
  g = x**2 + y**2 - 1
  L = f + l * g
  eqs = [sp.diff(L, var) for var in (x, y, l)]
  solutions = sp.solve(eqs, (x, y, l), dict=True)
v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy as sp
    x, y, l = sp.symbols('x y l')
    f = x + y
    g = x**2 + y**2 - 2
    L = f + l * g
    eqs = [sp.diff(L, v) for v in (x, y, l)]
    sols = sp.solve(eqs, (x, y, l))
    assert len(sols) > 0