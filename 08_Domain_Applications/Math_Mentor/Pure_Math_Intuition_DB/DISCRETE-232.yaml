id: "DISCRETE-232"
concept_name: "计数原理 - 消除奇迹步骤：从集合映射讲起，绝对禁止直接给出排列组合公式 (n_232)"
sub_topics:
  - "计数作为元素到自然数的映射"
  - "一一对应原则与不重不漏原则"
  - "离散对象的枚举逻辑"
  - "复杂问题的分解与聚合思维"
llm_physical_mapping: "mundane physical metaphor: like placing numbered stickers one by one on boxes in a warehouse to ensure every box is counted exactly once."
code_implementation: |
  def counting_by_mapping(items):
      # Map each item to a natural number
      mapping = {}
      for index, item in enumerate(items, start=1):
          mapping[item] = index
      return mapping, len(mapping)
v8_sanity_audit:
  sympy_pseudo_code: |
    # Bijective mapping to natural numbers
    items = ['apple', 'banana', 'cherry']
    mapping = {item: i+1 for i, item in enumerate(items)}
    assert len(mapping) == 3
    assert set(mapping.values()) == {1, 2, 3}
    assert mapping['banana'] == 2
