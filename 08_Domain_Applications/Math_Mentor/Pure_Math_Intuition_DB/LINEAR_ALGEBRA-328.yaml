id: "LINEAR_ALGEBRA-328"
domain: "linear_algebra"
mode: "A"
concept_name: "张量初步 - 发生学溯源：起源于物理应力分析，将向量转化的“物理机器” (n_328)"
sub_topics:
  - "张量作为多维数组的推广"
  - "线性变换的更高级抽象（多线性映射）"
  - "张量的阶 (Rank/Order) 与分量表示"
  - "物理背景：弹性力学中的应力张量"
formal_definition: |-
  给定域 F 上的向量空间 V_1,...,V_k，k 阶协变张量是多线性映射
  T:V_1 x ... x V_k -> F；等价地，它是 V_1^* tensor ... tensor V_k^* 的元素。
  更一般的 (r,s) 型张量属于 V^(tensor r) tensor (V^*)^(tensor s)。张量的阶
  是指标个数，不应与张量秩混同；张量秩通常指把张量写成简单张量之和所需的最少项数。
  选定基后张量由分量数组表示，但换基时分量按协变/逆变规则变换，而张量本身不变。
prerequisite_nodes:
  - "n_309"
  - "n_310"
llm_physical_mapping: |-
  应力张量可看作把一个截面法向量线性映射为该截面上的牵引力向量；双线性形式则像
  一台有两个输入端口的线性机器，固定任一输入后，对另一输入仍保持加法与数乘。
  多维数组是选定坐标系后记录这台机器作用的分量表。
mapping_boundary: |-
  并非每个多维数组都已指定为坐标无关的张量；必须同时说明底层向量空间和换基规律。
  数组 ndim 对应张量阶而不是一般意义的张量秩。应力只是二阶张量的一个应用，不能
  代表所有 (r,s) 型张量，也不能用单个外积样例证明多线性或坐标不变性。
code_implementation: |
  import sympy as sp
  A = sp.Matrix([[2, 1], [1, 3]])
  x = sp.Matrix(sp.symbols("x1 x2"))
  y = sp.Matrix(sp.symbols("y1 y2"))
  bilinear_value = (x.T * A * y)[0]
v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy as sp
    a, b = sp.symbols("a b")
    A = sp.Matrix([[2, 1], [1, 3]])
    u = sp.Matrix([1, 2])
    v = sp.Matrix([-1, 3])
    w = sp.Matrix([4, -2])
    B = lambda left, right: (left.T * A * right)[0]

    assert sp.simplify(B(a*u + b*v, w) - a*B(u, w) - b*B(v, w)) == 0
    assert sp.simplify(B(w, a*u + b*v) - a*B(w, u) - b*B(w, v)) == 0

    # If x = P*x_new, the component matrix changes to P.T*A*P.
    P = sp.Matrix([[1, 1], [0, 1]])
    x_new = sp.Matrix([2, -1])
    y_new = sp.Matrix([3, 4])
    A_new = P.T * A * P
    old_coordinates_value = B(P*x_new, P*y_new)
    new_coordinates_value = (x_new.T * A_new * y_new)[0]
    assert sp.simplify(old_coordinates_value - new_coordinates_value) == 0
