llm_physical_mapping: "mundane physical metaphor: 像车间里的烟雾颗粒，不再是一颗颗数（离散熵），而是整体的浓度分布弥漫在空间中（微分熵），高斯分布就像烟雾彻底散开的最混乱状态。"
code_implementation: |
  import torch
  import numpy as np
  # Differential entropy of a Gaussian N(0, sigma^2) is 0.5 * ln(2*pi*e*sigma^2)
  sigma = torch.tensor(1.0)
  diff_entropy = 0.5 * torch.log(2 * torch.tensor(np.pi) * torch.tensor(np.e) * sigma**2)
  print('Gaussian diff entropy:', diff_entropy.item())
v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy as sp
    sigma = sp.Symbol('sigma', positive=True)
    h = sp.Rational(1, 2) * sp.log(2 * sp.pi * sp.E * sigma**2)
    assert sp.simplify(h.subs(sigma, 1) - sp.Rational(1, 2) * sp.log(2 * sp.pi * sp.E)) == 0
