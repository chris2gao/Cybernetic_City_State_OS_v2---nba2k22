version: "9.1"
id: "TRIG-012"
type: "Math Concept Node"
title: "反三角函数 - arcsin, arccos, arctan 的定义域与值域限制 (n_173)"
sub_topics:
  - "定义域的数学来源（原函数的值域）"
  - "值域的受限范围（主值区间）"
  - "各反三角函数的单调性分析"
  - "各反三角函数的奇偶性与对称性"
llm_physical_mapping: "Physical boundary stops (you cannot take arcsin of 2)."
code_implementation: |
  import torch

  def test_inverse_trig_domains():
      # PyTorch checking domains (NaN for values > 1)
      valid_inputs = torch.tensor([-1.0, 0.0, 1.0])
      invalid_inputs = torch.tensor([-2.0, 1.5, 2.0])
      
      print("Valid inputs (asin):", torch.asin(valid_inputs))
      # Yields NaN for values outside [-1, 1]
      print("Invalid inputs (asin):", torch.asin(invalid_inputs)) 
      
      print("Valid inputs (acos):", torch.acos(valid_inputs))
      print("Invalid inputs (acos):", torch.acos(invalid_inputs))

      # arctan domain is (-inf, inf), so all are valid
      print("Valid inputs (atan):", torch.atan(invalid_inputs))

  if __name__ == "__main__":
      test_inverse_trig_domains()
v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy as sp
    
    x = sp.Symbol('x', real=True)
    
    asin_x = sp.asin(x)
    acos_x = sp.acos(x)
    atan_x = sp.atan(x)
    
    # Test valid boundary values for arcsin
    assert sp.simplify(asin_x.subs(x, 1) - sp.pi/2) == 0
    assert sp.simplify(asin_x.subs(x, -1) - (-sp.pi/2)) == 0
    
    # Test valid boundary values for arccos
    assert sp.simplify(acos_x.subs(x, 1) - 0) == 0
    assert sp.simplify(acos_x.subs(x, -1) - sp.pi) == 0
    
    # Test values for arctan
    assert sp.simplify(atan_x.subs(x, 0) - 0) == 0
    
    # Limit behavior for arctan
    limit_inf = sp.limit(atan_x, x, sp.oo)
    limit_minf = sp.limit(atan_x, x, -sp.oo)
    assert sp.simplify(limit_inf - sp.pi/2) == 0
    assert sp.simplify(limit_minf - (-sp.pi/2)) == 0
    
    # Odd/Even symmetry properties
    assert sp.simplify(sp.asin(-x) - (-sp.asin(x))) == 0
    assert sp.simplify(sp.atan(-x) - (-sp.atan(x))) == 0
    # acos(-x) = pi - acos(x)
    assert sp.simplify((sp.acos(-x) - (sp.pi - sp.acos(x))).subs(x, sp.S(1)/2)) == 0
    print("All sympy pseudo code assertions passed.")
