code_implementation: |
  import torch
  import numpy as np
  # R(D) for Gaussian source: max(0, 0.5 * log2(sigma^2 / D))
  sigma_sq = 1.0
  D = torch.linspace(0.1, 1.0, 10)
  R_D = torch.clamp(0.5 * torch.log2(sigma_sq / D), min=0)
  print('Rate-Distortion curve:', R_D)
