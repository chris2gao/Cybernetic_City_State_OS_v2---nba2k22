v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy as sp
    x, h = sp.symbols('x h')
    f = sp.Function('f')
    forward_diff = (f(x + h) - f(x)) / h
    assert sp.simplify(forward_diff * h + f(x)) == f(x + h)
