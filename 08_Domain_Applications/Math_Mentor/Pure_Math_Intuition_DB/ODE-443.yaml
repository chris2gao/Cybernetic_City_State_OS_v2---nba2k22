concept_name: "常系数方程 - 齐次与非齐次常系数线性微分方程的通解结构 (n_443)"
sub_topics:
  - "齐次解（自由响应）与特解（强迫响应）的叠加原理"
  - "解空间的线性子空间结构"
  - "常系数保证了算子对时平移的不变性"
  - "通解作为系统所有可能演化轨迹的集合"
llm_physical_mapping: "A dirty old shock absorber on a delivery truck. The 'homogeneous solution' is just the truck bouncing up and down after hitting a pothole and eventually settling down due to friction (its natural free response). The 'particular solution' is what happens when you drive the truck over a continuous washboard dirt road (the forced response from an external engine or bumps). The total movement you feel in the cab is simply adding the two together."
code_implementation: |
  import sympy as sp
  t = sp.Symbol('t')
  y = sp.Function('y')(t)
  ode = sp.Eq(y.diff(t, 2) + 3*y.diff(t) + 2*y, 5*sp.sin(t))
  general_sol = sp.dsolve(ode, y)
v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy as sp
    t = sp.Symbol('t')
    y = sp.Function('y')(t)
    ode = sp.Eq(y.diff(t, 2) + 3*y.diff(t) + 2*y, 0)
    sol = sp.dsolve(ode, y)
    assert 'C1' in str(sol) and 'C2' in str(sol)
