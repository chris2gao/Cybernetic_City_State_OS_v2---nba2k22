concept_name: "导数与微分 - 导数的物理意义（瞬时变化率/速度）与几何意义（切线斜率） (n_265)"

sub_topics:
  - "导数作为增量比值的极限定义"
  - "物理意义：质点运动的瞬时速度与加速度"
  - "几何意义：曲线切线的斜率与割线的极限"
  - "函数可导性与连续性的关系"
  - "单侧导数（左导数与右导数）"

pure_math_definition:
  derivative_at_a: "f'(a) = lim_{h->0} (f(a+h)-f(a))/h, when the limit exists"
  derivative_function: "f'(x) = lim_{h->0} (f(x+h)-f(x))/h"
  local_meaning: "The derivative is the limiting local rate of change of a function at a point."
  geometric_meaning: "For a graph y=f(x), f'(a) is the slope of the tangent line at x=a when the limiting slope exists."
  physical_meaning: "For position s(t), s'(t) is instantaneous velocity when the limiting rate of change exists."

required_prerequisites:
  explicitly_mark_unavailable_if_not_loaded: true
  items:
    - "function input/output intuition"
    - "average rate of change / slope of secant line"
    - "limit as approach process"
    - "coordinate-plane slope"

physical_intuition:
  primary: "skateboarder or moving point on curve"
  allowed_scope:
    - "average speed over interval"
    - "instantaneous speed as shrinking interval"
    - "secant line approaching tangent line"
  limitations:
    - "intuition is not a proof"
    - "differentiability can fail at corners/cusps/jumps"
    - "continuity is necessary but not sufficient for differentiability"

mapping_boundary:
  status: "present"
  summary: "Use the skateboarder or moving-point picture only to build MathLane_A intuition for shrinking intervals and local slope; formal correctness comes from the limit of difference quotients."
  invalid_uses:
    - "treating one large-interval average speed as the derivative"
    - "using a visual tangent picture as proof that a derivative exists"
    - "assuming every continuous graph has a tangent slope"

common_misconceptions:
  - "derivative is not just division"
  - "derivative is not average speed over a large interval"
  - "tangent slope is local, not whole-curve slope"
  - "continuity does not guarantee differentiability"
  - "left/right derivatives must match for differentiability"

llm_physical_mapping:
  kind: "everyday_physical"
  primary: "A skateboarder or moving point on a curve has average speed over a time interval; as the interval shrinks toward an instant, the limiting speed models the derivative."
  geometric_parallel: "A secant line slope over an interval approaches a tangent line slope at a point."
  boundary: "This mapping supports intuition only. It does not prove differentiability and it breaks down at corners, cusps, jumps, or points where left and right limiting slopes disagree."

tool_truthfulness:
  tool_status: "not_run"
  available_evidence: "semantic_only"
  run_with_log: null
  log_ref: null
  statement: "Code and v8_sanity_audit snippets are retained as semantic prompt evidence only; no SymPy, Python, calculator, sandbox, or other deterministic tool execution is claimed."

code_implementation: |
  import sympy as sp
  x = sp.Symbol('x')
  f = x**3
  # Geometric meaning: slope of tangent
  f_prime = sp.diff(f, x)
  slope_at_2 = f_prime.subs(x, 2)
  # Tangent line equation at x=2, y=8
  tangent_line = slope_at_2 * (x - 2) + 8

