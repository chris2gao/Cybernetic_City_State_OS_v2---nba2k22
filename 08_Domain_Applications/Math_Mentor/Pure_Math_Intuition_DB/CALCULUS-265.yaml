llm_physical_mapping: "mundane physical metaphor: a skateboarder on a ramp. The steepness of the ramp at the exact spot the wheels touch is the derivative (tangent slope). The speed they are falling/rising at that split second is the physical meaning."
code_implementation: |
  import sympy as sp
  x = sp.Symbol('x')
  f = x**3
  # Geometric meaning: slope of tangent
  f_prime = sp.diff(f, x)
  slope_at_2 = f_prime.subs(x, 2)
  # Tangent line equation at x=2, y=8
  tangent_line = slope_at_2 * (x - 2) + 8
