concept_name: "导数与微分 - 导数的物理意义（瞬时变化率/速度）与几何意义（切线斜率） (n_265)"
sub_topics:
  - "导数作为增量比值的极限定义"
  - "物理意义：质点运动的瞬时速度与加速度"
  - "几何意义：曲线切线的斜率与割线的极限"
