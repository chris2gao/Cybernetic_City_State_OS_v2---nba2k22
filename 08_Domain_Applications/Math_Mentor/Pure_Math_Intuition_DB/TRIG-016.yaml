title: "和差化积 - 发生学溯源：声学与波动物理中波叠加产生的“拍频（Beats）”现象 (n_177)"
core_concept: >
  The sum-to-product identities mathematically describe the physical phenomenon of wave interference, specifically 'beats'. When two waves of slightly different frequencies are added, the sum translates into a product of a slowly varying envelope (beat) and a high-frequency carrier wave.
sub_topics:
  - "振动叠加原理与波的干涉"
  - "频率相近的两个简谐波的叠加"
  - "包络线与载波频率的物理呈现"
  - "拍频公式与三角函数和差的关系"
llm_physical_mapping: "Acoustic beats, two tuning forks of slightly different frequencies."
code_implementation: |
  import torch

  def wave_superposition(t: torch.Tensor, w1: float, w2: float) -> torch.Tensor:
      """
      PyTorch summation of two sine waves sin(w1*t) + sin(w2*t).
      """
      return torch.sin(w1 * t) + torch.sin(w2 * t)
v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy as sp
    
    a, b = sp.symbols('a b', real=True)
    
    # Sum of two sine waves
    sum_expr = sp.sin(a) + sp.sin(b)
    
    # Product form of the sum
    prod_expr = 2 * sp.sin((a + b) / 2) * sp.cos((a - b) / 2)
    
    # Verifying using simplify and expand_trig
    assert sp.simplify(sum_expr - prod_expr) == 0, "Sum-to-product identity failed"
    
    # Expanding the product to get the sum
    expanded = sp.expand_trig(sp.sin((a + b) / 2) * sp.cos((a - b) / 2)) * 2
    assert sp.simplify(sum_expr - expanded) == 0, "expand_trig failed to match sum"
