id: "PROB_STAT-369"
concept_name: "矩母函数与特征函数 - 大模型映射：特征函数本质上是 PDF 的傅里叶变换，频域空间降维工具 (n_369)"
sub_topics:
  - "矩母函数 M(t) = E[e^{tX}] 的定义"
  - "特征函数 φ(t) = E[e^{itX}] 的唯一性与收敛性"
  - "利用特征函数计算高阶矩的代数便捷性"
  - "随机变量独立和的特征函数乘积属性"
llm_physical_mapping: "Think of the characteristic function as running the chip distribution of a probability density through a prism, scattering it into a frequency spectrum where adding independent weighted dice simply multiplies their color bands."
code_implementation: |
  import sympy as sp
  t, x, lam = sp.symbols('t x lambda', positive=True)
  pdf = lam * sp.exp(-lam * x)
  # Characteristic function
  phi_t = sp.integrate(sp.exp(sp.I * t * x) * pdf, (x, 0, sp.oo))
v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy as sp
    t, x = sp.symbols('t x', real=True)
    lam = sp.Symbol('lambda', positive=True)
    # Phi(t) for Exponential
    phi_t = lam / (lam - sp.I * t)
    # The property phi(0) = 1 represents total probability = 1
    assert sp.simplify(phi_t.subs(t, 0)) == 1
