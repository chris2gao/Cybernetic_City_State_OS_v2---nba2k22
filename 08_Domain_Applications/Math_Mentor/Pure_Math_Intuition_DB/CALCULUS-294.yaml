id: "CALCULUS-294"
concept_name: "反常积分（广义积分） - 反常积分的收敛性判定 (n_294)"
sub_topics:
  - "无穷限反常积分的定义与计算"
  - "瑕积分（无界函数的反常积分）"
  - "比较判别法与 Dirichlet/Abel 判别法"
  - "Cauchy 主值的概念与物理意义"
llm_physical_mapping: "mundane physical metaphor: pouring water into a horn of infinite length; if the shape narrows quickly enough, it only holds a finite volume."
code_implementation: |
  import sympy as sp
  x = sp.Symbol('x')
  f = 1/x**2
  integral_val = sp.integrate(f, (x, 1, sp.oo))
