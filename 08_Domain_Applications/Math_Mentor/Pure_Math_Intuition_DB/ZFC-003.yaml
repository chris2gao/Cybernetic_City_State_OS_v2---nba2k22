id: "ZFC-003"
title: "ZFC Axiom 3 - Specification (Separation)"
sub_topics: 
  - "Subsets"
  - "Predicates"
  - "Bounded Comprehension"
llm_physical_mapping: |
  Maps to Top-P (Nucleus) and Top-K sampling mechanisms. The axiom of specification constructs a subset from a given set using a defining predicate. Similarly, the generation decoding layer takes the full set of vocabulary logits and applies a mathematical predicate (e.g., cumulative probability threshold P or strict rank K) to construct a bounded subset of valid candidate tokens, preventing the explosion of unbounded generation.
code_implementation: |
  def forward_zfc_specification(logits: torch.Tensor, top_k: int) -> torch.Tensor:
      # Separate a subset of valid tokens based on a predicate (being in top K)
      values, indices = torch.topk(logits, top_k)
      # Create a new tensor initialized to -inf
      subset_logits = torch.full_like(logits, float('-inf'))
      # Scatter the valid values back, effectively "separating" the subset
      subset_logits.scatter_(1, indices, values)
      return subset_logits
v8_sanity_audit:
  sympy_pseudo_code: |
    import torch
    
    def test_specification():
        logits = torch.tensor([[1.0, 5.0, 2.0, 8.0, 3.0]])
        top_k = 2
        values, indices = torch.topk(logits, top_k)
        subset = torch.full_like(logits, float('-inf'))
        subset.scatter_(1, indices, values)
        
        # The predicate filter allows only 8.0 and 5.0
        assert torch.isneginf(subset[0, 0]).item() is True
        assert subset[0, 3].item() == 8.0
