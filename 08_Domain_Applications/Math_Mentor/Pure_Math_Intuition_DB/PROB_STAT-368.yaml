id: "PROB_STAT-368"
concept_name: "协方差与相关系数 - 相关性与因果性的本质断层 (n_368)"
sub_topics:
  - "共变不代表因果：潜在变量的干扰"
  - "统计规律与逻辑驱动的区别"
  - "相关系数的局限性：非线性关系的失效"
  - "因果推断在现代统计学中的地位"
llm_physical_mapping: "Picture two separate bullet hole maps that perfectly mirror each other. They are highly correlated. However, you cannot prove one gun fired both (causation); they might simply be controlled by the same hidden third weighted dice."
code_implementation: |
  import sympy as sp
  x = sp.Symbol('x')
  # Let X be uniformly distributed on [-1, 1], E[X] = 0
  # Let Y = X^2
  E_X = sp.integrate(x * sp.Rational(1, 2), (x, -1, 1))
  E_X2 = sp.integrate(x**2 * sp.Rational(1, 2), (x, -1, 1))
  E_X3 = sp.integrate(x**3 * sp.Rational(1, 2), (x, -1, 1))
  # Covariance is zero despite exact dependence
  Cov_XY = E_X3 - E_X * E_X2
v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy as sp
    x = sp.Symbol('x')
    E_X = sp.integrate(x * sp.Rational(1, 2), (x, -1, 1))
    E_X3 = sp.integrate(x**3 * sp.Rational(1, 2), (x, -1, 1))
    Cov_XY = E_X3 - E_X * sp.integrate(x**2 * sp.Rational(1, 2), (x, -1, 1))
    assert Cov_XY == 0
