id: "TOP-002"
title: "连续性与同胚形变 (Continuity and Homeomorphism)"
sub_topics:
  - "映射的连续性：开集的原像为开集"
  - "同胚：拓扑等价与不变量"
  - "橡皮泥几何与连续形变"
llm_physical_mapping: "连续性在大语言模型中对应于前馈神经网络（FFN）与残差连接（Residual Connections）构成的层级语义变换。数据在进入 SwiGLU 激活函数与层归一化（LayerNorm）时，尽管发生了高度非线性的空间扭曲，但只要没有发生维度坍缩（如梯度消失导致的奇点），这种变换在数学上可视为一种近似的同胚形变。即底层 Token 的相对拓扑关系在网络的前向传播（Forward Pass）中得以保留，仅仅是发生了特征空间的连续拉伸与折叠，避免了语义空间的拓扑撕裂。"
code_implementation: |
  import torch
  import torch.nn as nn
  import torch.nn.functional as F

  class ContinuousHomeomorphismLayer(nn.Module):
      def __init__(self, dim):
          super().__init__()
          self.w1 = nn.Linear(dim, dim * 2)
          self.w2 = nn.Linear(dim, dim * 2)
          self.w3 = nn.Linear(dim * 2, dim)
          
      def forward(self, x):
          # x is a point in the semantic manifold
          residual = x
          # SwiGLU provides a continuous, non-linear transformation (stretching/folding)
          gate = F.silu(self.w1(x))
          val = self.w2(x)
          # The mapping is continuous. Adding residual maintains topological equivalence 
          # avoiding mapping collapse (Singularity)
          transformed_x = self.w3(gate * val) + residual
          return transformed_x
v8_sanity_audit:
  sympy_pseudo_code: |
    import torch
    
    def test_continuity():
        layer = ContinuousHomeomorphismLayer(128)
        x = torch.randn(1, 10, 128)
        # A small perturbation (epsilon) should result in a small output change
        eps = torch.randn(1, 10, 128) * 1e-4
        y1 = layer(x)
        y2 = layer(x + eps)
        
        diff = torch.norm(y1 - y2)
        assert diff < 1e-2, "Layer transformation is not continuous"
