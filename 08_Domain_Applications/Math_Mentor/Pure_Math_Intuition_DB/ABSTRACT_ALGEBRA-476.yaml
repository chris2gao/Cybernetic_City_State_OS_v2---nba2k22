llm_physical_mapping: "A conveyor belt feeding discrete mechanical cogs into a hopper. Addition aligns the cogs side-by-side on parallel rails, while multiplication engages them in a planetary gear system where the number of teeth multiplies. Division by an ideal is a physical stencil that trims excess gear teeth to a standardized modulus shape."
code_implementation: |
  import sympy as sp
  x = sp.Symbol('x')
  poly1 = x**3 + 2*x + 1
  poly2 = x**2 + x + 2
  mod_poly = x**4 + 1
  sum_result = poly1 + poly2
  prod_result = sp.rem(poly1 * poly2, mod_poly)
legacy_v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy as sp
    x = sp.Symbol('x')
    f = x**2 + 1
    g = x + 1
    mod = x**3 - 1
    prod = sp.expand(f * g)
    rem = sp.rem(prod, mod)
    assert sp.simplify(rem - (x**3 + x**2 + x + 1)) != 0
