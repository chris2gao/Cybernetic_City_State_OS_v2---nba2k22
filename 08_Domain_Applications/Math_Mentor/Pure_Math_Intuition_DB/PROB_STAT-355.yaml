concept_name: "期望与方差 - 方差：物理上的转动惯量/离散度 (n_355)"
sub_topics:
  - "方差的定义 Var(X) = E[(X - E[X])^2]"
  - "计算公式 Var(X) = E[X^2] - (E[X])^2"
  - "标准差 (Standard Deviation) 的物理含义"
