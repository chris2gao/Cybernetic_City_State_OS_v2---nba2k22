concept_node:
  id: "FUNCTION-002"
  title: "函数概念初步（定义域/值域/复合/反函数） (function_concepts_intro) - 定义域与值域的边界求解 (n_118)"
  sub_topics:
    - "常见基本初等函数定义域的限制条件"
    - "抽象函数定义域的求解策略"
    - "求函数值域的常用方法（配方、换元、单调性）"
    - "函数值域的边界与开闭区间判定"
  llm_physical_mapping: "Imagine a factory processing machine. The 'domain' is the specific size and shape of raw materials the machine's input slot will accept without breaking (e.g., only square blocks between 2cm and 5cm). The 'range' represents the physical dimensions of the manufactured widgets that can possibly come out of the output chute."
  code_implementation: >
    import torch

    def function_with_domain_and_range(x: torch.Tensor, d_min: float, d_max: float) -> torch.Tensor:
        # Domain enforcement using PyTorch clamping
        # Inputs outside the domain are clamped to the boundaries
        x_clamped = torch.clamp(x, min=d_min, max=d_max)
        
        # Function transformation (e.g., y = x^2)
        y = x_clamped ** 2
        
        # Range can be analyzed or further clamped if bounding boxes are required
        # e.g., y_clamped = torch.clamp(y, min=range_min, max=range_max)
        return y
        
    # Bounding box concept: [x_min, y_min, x_max, y_max] represents the [domain_min, range_min, domain_max, range_max]
    bounding_box = [d_min, 0.0, d_max, max(d_min**2, d_max**2)]
  v8_sanity_audit:
    sympy_pseudo_code: |
      from sympy import Symbol, S, sqrt
      from sympy.calculus.util import continuous_domain, function_range

      x = Symbol('x')
      # Example function: f(x) = sqrt(x - 1)
      f = sqrt(x - 1)

      # Solve for Domain
      domain = continuous_domain(f, x, S.Reals)
      # Output: Interval(1, oo)

      # Solve for Range
      y_range = function_range(f, x, S.Reals)
      # Output: Interval(0, oo)
