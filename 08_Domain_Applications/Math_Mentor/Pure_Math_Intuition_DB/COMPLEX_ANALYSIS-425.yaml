v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy as sp
    t = sp.symbols('t', real=True)
    z = sp.exp(sp.I * t)
    dz = sp.diff(z, t)
    f_z = z**2 + 1
    integrand = (f_z / z) * dz
    val = sp.integrate(integrand, (t, 0, 2*sp.pi))
    assert sp.simplify(val) == 2 * sp.pi * sp.I * (0**2 + 1)
