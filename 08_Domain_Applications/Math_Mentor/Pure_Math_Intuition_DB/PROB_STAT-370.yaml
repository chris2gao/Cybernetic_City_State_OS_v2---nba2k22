llm_physical_mapping: "Imagine tossing weighted dice thousands of times. A sufficient statistic is like a ledger that only records the total sum of the rolls rather than the exact sequence, yet perfectly preserves the entire chip distribution needed to guess the dice's weight."
code_implementation: |
  import sympy as sp
  theta, T, n = sp.symbols('theta T n')
  # Likelihood for Bernoulli trials where T is the sum of successes
  likelihood = (theta**T) * ((1 - theta)**(n - T))
  # Factored into h(x) * g(T, theta), where h(x) = 1
v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy as sp
    theta, T, n = sp.symbols('theta T n')
    likelihood = (theta**T) * ((1 - theta)**(n - T))
    val = likelihood.subs({T: 5, n: 10})
    assert val == theta**5 * (1-theta)**5
