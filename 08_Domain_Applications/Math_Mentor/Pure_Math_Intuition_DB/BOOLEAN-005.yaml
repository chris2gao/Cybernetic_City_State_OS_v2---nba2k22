  domain: "布尔代数基础 (boolean_algebra)"
  title: "布尔环 (Boolean Ring) 与布尔代数的转换"
  sub_topics:
    - '布尔环的定义（幂等环）'
    - '布尔代数到布尔环的转换（异或与合取）'
    - '布尔环到布尔代数的转换'
    - '多项式环上的布尔计算'
  llm_physical_mapping: "想象一组硬币反转游戏。在布尔环中，'加法'对应翻转硬币（异或），翻转两次等于没翻转（x + x = 0）。'乘法'对应同时满足两个条件（与操作），且任何条件自我重复确认没有影响（x * x = x）。布尔环是幂等的，每一个操作都可以具象化为一系列硬币状态切换与交集验证的实体过程。"
  code_implementation: |
    import torch

    def boolean_ring_add(x, y):
        """Ring addition is represented by logical XOR"""
        return torch.logical_xor(x, y)

    def boolean_ring_mul(x, y):
        """Ring multiplication is represented by logical AND"""
        return torch.logical_and(x, y)

    # Simulating conversion between Boolean Algebra and Boolean Ring
    def to_boolean_or_from_ring(x, y):
        """Boolean OR: x | y = x + y + xy in ring"""
        return boolean_ring_add(boolean_ring_add(x, y), boolean_ring_mul(x, y))

    def to_boolean_not_from_ring(x):
        """Boolean NOT: ~x = 1 + x in ring"""
        ones = torch.ones_like(x, dtype=torch.bool)
        return boolean_ring_add(ones, x)

    # Tensors for verification
    a = torch.tensor([True, False, True, False])
    b = torch.tensor([True, True, False, False])

    # Idempotent verification x * x = x
    assert torch.equal(boolean_ring_mul(a, a), a)

    # Verification of mappings
    assert torch.equal(to_boolean_or_from_ring(a, b), torch.logical_or(a, b))
    assert torch.equal(to_boolean_not_from_ring(a), torch.logical_not(a))
  v8_sanity_audit:
    sympy_pseudo_code: |
      from sympy import symbols, Equivalent, simplify_logic
      from sympy.logic.boolalg import Xor, And, Or, Not, true

      x, y = symbols('x y')

      # Ring definition mapping
      ring_add = lambda a, b: Xor(a, b)
      ring_mul = lambda a, b: And(a, b)

      # Test ring to boolean algebra OR translation: x | y == x ^ y ^ (x & y)
      ring_based_or = ring_add(ring_add(x, y), ring_mul(x, y))
      assert simplify_logic(Equivalent(Or(x, y), ring_based_or)) == true

      # Test ring to boolean algebra NOT translation: ~x == 1 ^ x
      ring_based_not = ring_add(true, x)
      assert simplify_logic(Equivalent(Not(x), ring_based_not)) == true
