id: "TRIG-017"
title: "和差化积 - 严格代数推导（利用两角和与两角差展开式的加减消元） (n_178)"
sub_topics:
  - "两角和与差的余弦/正弦公式回顾"
  - "积化和差公式的逆运算过程"
  - "变量代换法（引入辅助角变量）"
  - "四组核心公式的逻辑对称性"
llm_physical_mapping: "Substitution of variables to rotate coordinate frames."
code_implementation: |
  import torch
  
  # Verifying identity sin(x) + sin(y) == 2*sin((x+y)/2)*cos((x-y)/2)
  x = torch.randn(10)
  y = torch.randn(10)
  
  lhs = torch.sin(x) + torch.sin(y)
  rhs = 2 * torch.sin((x+y)/2) * torch.cos((x-y)/2)
  
  assert torch.allclose(lhs, rhs, atol=1e-5), "Identity mismatch"
v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy as sp
    
    x, y = sp.symbols('x y')
    expr1 = sp.sin(x) + sp.sin(y)
    expr2 = 2 * sp.sin((x + y) / 2) * sp.cos((x - y) / 2)
    
    assert sp.simplify(expr1 - expr2) == 0
