code_implementation: |
  def boolean_matrix_multiply(A, B):
      n = len(A)
      result = [[0]*n for _ in range(n)]
      for i in range(n):
          for j in range(n):
              for k in range(n):
                  result[i][j] |= (A[i][k] and B[k][j])
      return result
