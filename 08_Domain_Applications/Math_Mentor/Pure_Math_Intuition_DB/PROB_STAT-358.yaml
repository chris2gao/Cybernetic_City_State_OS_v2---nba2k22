id: "PROB_STAT-358"
concept_name: "中心极限定理 - 认知升华：独立海量叠加分布必坍缩为钟形曲线的统计物理美学 (n_358)"
sub_topics:
  - "林德伯格-列维中心极限定理"
  - "独立同分布序列之和的渐进正态性"
  - "物理直觉：无数微小随机因素叠加产生宏观秩序"
  - "近似计算在大样本统计中的威力"
llm_physical_mapping: "chip distribution dropped from thousands of independent pegs, eventually collapsing into a bell-shaped mountain of chips at the bottom regardless of individual peg behavior."
code_implementation: |
  import sympy as sp
  x, mu, sigma = sp.symbols('x mu sigma')
  # Normal distribution PDF
  normal_pdf = (1 / (sigma * sp.sqrt(2 * sp.pi))) * sp.exp(-((x - mu)**2) / (2 * sigma**2))
v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy as sp
    x = sp.Symbol('x')
    mu = 0
    sigma = 1
    std_normal = (1 / sp.sqrt(2 * sp.pi)) * sp.exp(-x**2 / 2)
    total_area = sp.integrate(std_normal, (x, -sp.oo, sp.oo))
    assert sp.simplify(total_area) == 1
