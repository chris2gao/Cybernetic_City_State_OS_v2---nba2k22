id: "BRIDGE-002"
concept_name: "图论与关系代数的同构 - 无向图即对称关系，连通性即传递闭包 (L2 ↔ L1)"
sub_topics:
  - "无向图的邻接矩阵作为对称布尔矩阵的本质"
  - "图连通路径与关系的复合 (Composition of relations)"
  - "闭包运算 (Closure) 与广度优先遍历 (BFS) 的算法等价性"
llm_physical_mapping: "mundane physical metaphor: a physical Rolodex. A symmetric relation means if Bob has Alice's card, Alice has Bob's. The transitive closure is the game of 'Six Degrees of Kevin Bacon'—who can you reach by following the cards."
code_implementation: |
  import networkx as nx
  import numpy as np
  # Adjacency matrix of an undirected graph is always symmetric
  G = nx.cycle_graph(4)
  adj_matrix = nx.to_numpy_array(G)
  is_symmetric = np.allclose(adj_matrix, adj_matrix.T)
v8_sanity_audit:
  sympy_pseudo_code: |
    # Graph vs Symmetric Relation
    edges = [(1, 2), (2, 3), (3, 1)]
    # As relation set
    relation = set(edges)
    # Make symmetric
    sym_relation = relation.union({(v, u) for u, v in relation})
    
    # As Graph
    import networkx as nx
    G = nx.Graph()
    G.add_edges_from(edges)
    
    # Check isomorphism of data
    assert len(sym_relation) == len(G.edges()) * 2  # undirected edges -> 2 directed pairs
    assert (2, 1) in sym_relation
    assert G.has_edge(2, 1)
