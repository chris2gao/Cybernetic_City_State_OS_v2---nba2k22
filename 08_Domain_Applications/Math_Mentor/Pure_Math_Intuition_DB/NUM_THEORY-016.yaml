id: "NUM_THEORY-016"
title: "二次剩余 - 勒让德符号 (Legendre Symbol) 定义与欧拉判别法 (a^((p-1)/2) ≡ ±1 (mod p)) 推导 (n_210)"
sub_topics:
  - "勒让德符号的数学记号与取值"
  - "欧拉判别准则的陈述"
  - "利用原根性质的证明过程"
  - "判别法的计算复杂性优势"
llm_physical_mapping: "mundane physical metaphor (a digital filter that outputs +1 for valid signals and -1 for invalid ones)."
code_implementation: |
  import torch

  def legendre_symbol_pytorch(a: int, p: int) -> int:
      a_t = torch.tensor(a, dtype=torch.int64)
      p_t = torch.tensor(p, dtype=torch.int64)
      
      if a_t % p_t == 0:
          return 0
          
      res = (a_t ** ((p_t - 1) // 2)) % p_t
      val = res.item()
      
      if val == p - 1:
          return -1
          
      return val
v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy
    
    def check_legendre():
        a, p = 5, 11
        res = sympy.legendre_symbol(a, p)
        
        euler_val = pow(a, (p - 1) // 2, p)
        if euler_val == p - 1:
            euler_val = -1
            
        if res != euler_val:
            raise ValueError("Euler criterion mismatch")
            
        return res
        
    check_legendre()
