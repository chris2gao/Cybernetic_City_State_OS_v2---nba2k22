llm_physical_mapping: "spatial deformation/stretching/rotating: Matrix multiplication is the sequential composition of spatial deformations. Rotating and then stretching space yields a different physical configuration than stretching first and rotating later, demonstrating non-commutativity."
code_implementation: |
  import sympy as sp
  
  # A is stretch x by 2, B is shear
  A = sp.Matrix([[2, 0], [0, 1]])
  B = sp.Matrix([[1, 1], [0, 1]])
  
  # Apply A then B
  BA = B * A
  
  # Apply B then A
  AB = A * B
