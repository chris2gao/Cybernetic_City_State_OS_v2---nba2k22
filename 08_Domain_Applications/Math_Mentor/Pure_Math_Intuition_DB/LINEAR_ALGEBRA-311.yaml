id: "LINEAR_ALGEBRA-311"
concept_name: "线性映射 - 矩阵乘法作为两个变换机器的串联复合（严禁死记行乘列） (n_311)"
sub_topics:
  - "矩阵乘法的非交换性：变换顺序的影响"
  - "复合变换的矩阵表达 C = BA"
  - "矩阵乘法的结合律与线性变换的复合"
  - "物理意义：连续执行两个空间扭曲操作"
llm_physical_mapping: "spatial deformation/stretching/rotating: Matrix multiplication is the sequential composition of spatial deformations. Rotating and then stretching space yields a different physical configuration than stretching first and rotating later, demonstrating non-commutativity."
code_implementation: |
  import sympy as sp
  
  # A is stretch x by 2, B is shear
  A = sp.Matrix([[2, 0], [0, 1]])
  B = sp.Matrix([[1, 1], [0, 1]])
  
  # Apply A then B
  BA = B * A
  
  # Apply B then A
  AB = A * B
v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy as sp
    A = sp.Matrix([[2, 0], [0, 1]])
    B = sp.Matrix([[1, 1], [0, 1]])
    BA = B * A
    AB = A * B
    assert BA != AB
