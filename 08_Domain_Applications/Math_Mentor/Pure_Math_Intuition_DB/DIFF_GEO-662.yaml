formal_definition: >-
  Let E→M be a rank-r complex vector bundle. Its Chern classes are natural
  characteristic classes c_k(E)∈H^{2k}(M;Z) for 0≤k≤r, with c_0(E)=1 and
  c_k(E)=0 for k>r. The total Chern class
  c(E)=1+c_1(E)+...+c_r(E) satisfies the Whitney sum formula
  c(E⊕F)=c(E)∪c(F), and for a smooth map f:N→M it is natural under pullback:
  c_k(f*E)=f*c_k(E). Thus Chern classes depend only on the isomorphism class
  of the complex vector bundle and are graded integral cohomology classes,
  not a generic scalar amount of twisting or curvature of the base manifold.
  Given a connection ∇ with curvature matrix F_∇, Chern-Weil theory forms the
  closed even differential form det(I+(i/2π)F_∇). Under this normalization,
  its homogeneous degree-2k component represents in de Rham cohomology the
  real image of c_k(E); in particular the first Chern form is represented by
  (i/2π)Tr(F_∇). The differential-form representative depends on the chosen
  connection, while its cohomology class does not. Sign and normalization
  conventions must be declared consistently, and the de Rham representative
  alone does not replace the underlying integral characteristic class.
formal_definition_zh: >-
  设 E→M 是秩为 r 的复向量丛。其 Chern 类是自然的示性类
  c_k(E)∈H^{2k}(M;Z)，其中 0≤k≤r，c_0(E)=1，并且 k>r 时 c_k(E)=0。
  总 Chern 类 c(E)=1+c_1(E)+...+c_r(E) 满足 Whitney 和公式
  c(E⊕F)=c(E)∪c(F)；对光滑映射 f:N→M，它还满足拉回自然性
  c_k(f*E)=f*c_k(E)。因此 Chern 类只依赖复向量丛的同构类，是分次的积分
  上同调类，而不是任意的“扭曲量”标量或基流形的曲率。给定联络 ∇ 及其曲率矩阵
  F_∇，Chern-Weil 理论构造闭的偶次微分形式 det(I+(i/2π)F_∇)。在该归一化下，
  其 2k 次齐次部分在 de Rham 上同调中代表 c_k(E) 的实系数像；特别地，第一
  Chern 形式由 (i/2π)Tr(F_∇) 表示。微分形式代表依赖所选联络，但其上同调类
  不依赖联络。符号与归一化约定必须前后一致，de Rham 代表也不能替代底层的积分
  示性类。
