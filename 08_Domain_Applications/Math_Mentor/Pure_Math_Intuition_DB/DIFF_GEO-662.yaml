mapping_boundary:
  primary_mapping_kind: "llm_architecture_bounded_structural_analogy"
  primary_mapping: >-
    Only when a model defines a genuine complex vector bundle over an explicit
    base—with transition functions, local frames, and a connection—may Chern
    classes analogize global topological obstructions that cannot be removed by
    changing local frames. Local connection and curvature representatives may
    change while the characteristic cohomology class remains invariant. This
    mapping concerns a specified bundle construction, not ordinary layers or
    token features by default.
  primary_mapping_zh: >-
    只有当模型在明确基空间上真正定义复向量丛，并给出转移函数、局部标架与联络时，
    才可用 Chern 类类比无法通过改变局部标架消除的全局拓扑障碍。局部联络与曲率
    代表可以变化，而示性上同调类保持不变。该映射依赖指定的丛构造，普通层或 token
    特征默认并不满足这些条件。
  boundary:
