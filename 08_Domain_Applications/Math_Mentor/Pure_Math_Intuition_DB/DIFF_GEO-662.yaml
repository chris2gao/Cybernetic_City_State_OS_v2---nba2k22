code_implementation: |
  import numpy as np
  def compute_integer_twists(phases):
      diffs = np.diff(phases)
      diffs = (diffs + np.pi) % (2 * np.pi) - np.pi
      return np.round(np.sum(diffs) / (2 * np.pi))
v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy as sp
    phase_diff = sp.Symbol('phase_diff')
    twist = phase_diff / (2 * sp.pi)
    assert sp.simplify(twist * 2 * sp.pi - phase_diff) == 0
