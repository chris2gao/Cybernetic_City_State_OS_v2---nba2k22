    - "A phase angle or wrapped phase difference is not automatically a Chern class."
    - "Berry curvature and Chern numbers require a specified parameter space, state bundle, connection, and integration hypotheses."
    - "Chern classes live in even-degree integral cohomology; a derived pairing or integral is not the class itself."
    - "Curvature-form representatives depend on a connection, while their Chern-Weil cohomology classes do not."
    - "Chern classes do not measure arbitrary visible bending or Riemann curvature of the base."
    - "Quantization claims require suitable closed cycles or manifolds and consistent normalization."
    - "Chern-Weil differential forms represent the real image of integral Chern classes; they do not erase integral information."
    - "No Chern class of an ordinary LLM is established by this node."
