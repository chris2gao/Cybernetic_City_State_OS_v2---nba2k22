id: "TRIG-030"
title: "辅助角公式 - Asin x + Bcos x = √(A²+B²) sin(x + φ)：正交波的终极合并"
node_type: "concept"
sub_topics:
  - "同频正交三角函数的合并定理"
  - "振幅 √(A²+B²) 的勾股几何解释"
  - "辅助角 φ 的正切值判定 (tanφ = B/A)"
  - "求三角函数最值与周期的绝杀工具"
llm_physical_mapping: "blending two orthogonal speaker outputs into a single shifted wave."
code_implementation: |
  import torch

  def combine_waves(A: torch.Tensor, B: torch.Tensor, x: torch.Tensor) -> torch.Tensor:
      """
      Converts A*sin(x) + B*cos(x) to magnitude and phase shift representation.
      Returns: R * sin(x + phi)
      """
      magnitude = torch.sqrt(A**2 + B**2)
      phase_shift = torch.atan2(B, A)
      return magnitude * torch.sin(x + phase_shift)
v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy as sp
    
    A, B = 3, 4
    x = sp.Symbol('x', real=True)
    
    # Original orthogonal waves
    expr = A * sp.sin(x) + B * sp.cos(x)
    
    # Amplitude extraction and phase shift calculation
    R = sp.sqrt(A**2 + B**2)
    phi = sp.atan2(B, A)
    
    # Merged equivalent wave
    merged = R * sp.sin(x + phi)
    
    # Sanity check at x = 1.0 rad
    val_expr = float(expr.subs(x, 1.0).evalf())
    val_merged = float(merged.subs(x, 1.0).evalf())
    
    assert abs(val_expr - val_merged) < 1e-9, "Auxiliary angle identity failed"
