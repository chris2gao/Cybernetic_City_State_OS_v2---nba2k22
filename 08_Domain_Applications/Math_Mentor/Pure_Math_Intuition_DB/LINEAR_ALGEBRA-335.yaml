id: "LINEAR_ALGEBRA-335"
concept_name: "线性变换的矩阵表示与基变换 - 过渡矩阵 (Transition Matrix) 与坐标变换 (n_335)"
sub_topics:
  - "新基与旧基的线性转换关系"
  - "过渡矩阵 P 的可逆性保证"
  - "向量在不同基下坐标的变换公式 x' = P⁻¹x"
  - "坐标系转换的物理视角：观察者参照系的平移旋转"
llm_physical_mapping: "spatial deformation/stretching/rotating: changing the basis is like rotating and stretching the grid lines of the space itself, so that the same physical point gets new coordinates based on the new reference grid."
code_implementation: |
  import sympy as sp
  x = sp.Matrix([1, 1])
  P = sp.Matrix([[0, 1], [1, 0]])
  x_prime = P.inv() * x
v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy as sp
    x = sp.Matrix([1, 1])
    P = sp.Matrix([[0, 1], [1, 0]])
    x_prime = P.inv() * x
    assert x_prime == sp.Matrix([1, 1])
