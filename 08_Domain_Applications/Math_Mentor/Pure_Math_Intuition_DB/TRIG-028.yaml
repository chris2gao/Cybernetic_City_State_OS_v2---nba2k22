id: "TRIG-028"
title: "半角公式 - 根号的引入与象限对符号的选择性剪枝 (n_189)"
concept_type: "theorem"
status: "draft"
core_intuition: |
  半角公式本质上是降幂公式的逆向过程。因为是从平方形式还原到一次形式，必定会引入根号（±）。
  而最终取正还是取负，这就像是物理上的一个“降档（减半）”过程，我们需要知道初始状态（角度所在象限）来决定最终的符号。
sub_topics:
  - "由降幂公式逆向解出半角公式"
  - "正负号的取舍原则（依据 α/2 所在象限）"
  - "正切半角公式的无根号形式推导（万能公式前置）"
  - "利用半角公式求 15° 等特殊非整数倍角的值"
llm_physical_mapping: "slowing down a gear by half, requiring knowledge of starting position to determine sign."
code_implementation: |
  import torch

  def sin_half_angle(x_tensor: torch.Tensor, half_angle_quadrant: int) -> torch.Tensor:
      """
      PyTorch conditionally assigning signs to sqrt((1-cos(x))/2)
      """
      magnitude = torch.sqrt((1 - torch.cos(x_tensor)) / 2)
      sign = 1.0 if half_angle_quadrant in [1, 2] else -1.0
      return sign * magnitude
v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy as sp
    
    x = sp.Symbol('x', real=True)
    
    # checking cos(x/2)**2 using sympy
    cos_half_sq = sp.cos(x/2)**2
    power_reduced = (1 + sp.cos(x)) / 2
    
    diff = sp.trigsimp(cos_half_sq - power_reduced)
    # Use simplify to ensure zero comparison works safely to prevent assert failures
    assert sp.simplify(diff) == 0, "Trig identity mismatch"
