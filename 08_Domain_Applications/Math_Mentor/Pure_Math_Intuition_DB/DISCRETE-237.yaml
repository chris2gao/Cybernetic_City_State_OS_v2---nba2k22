id: "DISCRETE-237"
concept_name: "鸽巢原理 - 基础形式与广义鸽巢原理的推导 (n_237)"
sub_topics:
  - "基础形式：k+1 个物体入 k 个抽屉"
  - "广义形式：n 个物体入 k 个抽屉的平均密度"
  - "利用向下取整与向上取整符号的形式化"
  - "在连续空间中的积分变体"
llm_physical_mapping: "mundane physical metaphor: parking cars in a parking lot. If you have 10 cars and 3 zones, one zone must hold at least ceil(10/3) = 4 cars."
code_implementation: |
  import math
  
  def generalized_pigeonhole(n_pigeons, k_holes):
      # If n pigeons are put into k holes, at least one hole contains
      # ceil(n / k) pigeons.
      return math.ceil(n_pigeons / k_holes)
v8_sanity_audit:
  sympy_pseudo_code: |
    import math
    def generalized_pigeonhole(n, k):
        return math.ceil(n / k)
    assert generalized_pigeonhole(10, 3) == 4
    assert generalized_pigeonhole(4, 3) == 2