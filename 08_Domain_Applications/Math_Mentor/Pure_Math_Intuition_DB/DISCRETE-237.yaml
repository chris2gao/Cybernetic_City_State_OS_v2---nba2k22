llm_physical_mapping: "mundane physical metaphor: parking cars in a parking lot. If you have 10 cars and 3 zones, one zone must hold at least ceil(10/3) = 4 cars."
code_implementation: |
  import math
  
  def generalized_pigeonhole(n_pigeons, k_holes):
      # If n pigeons are put into k holes, at least one hole contains
      # ceil(n / k) pigeons.
      return math.ceil(n_pigeons / k_holes)
