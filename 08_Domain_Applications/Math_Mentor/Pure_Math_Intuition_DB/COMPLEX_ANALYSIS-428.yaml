code_implementation: |
  import sympy as sp
  z = sp.Symbol('z')
  # Geometric series expansion around z=0
  f_local = 1 + z + z**2 + z**3 + z**4 + z**5
  # The global analytic continuation
  f_global = 1 / (1 - z)
  # They match locally
  val_local = f_local.subs(z, 0.5)
  val_global = f_global.subs(z, 0.5)
