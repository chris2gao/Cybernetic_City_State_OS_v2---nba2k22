concept_node:
  id: "FUNCTION-004"
  title: "函数概念初步（定义域/值域/复合/反函数） (function_concepts_intro) - 反函数：输入输出互换的代数求解过程及其在坐标系中关于 y=x 对称的几何意义 (n_120)"
  sub_topics:
    - "反函数的定义与存在条件（一一映射）"
    - "反函数解析式的求解步骤"
    - "原函数与反函数定义域、值域的互易关系"
    - "反函数图象关于直线 y=x 对称的几何特征"
  llm_physical_mapping: "Like a two-way translator or undoing a process. If the original function is a vending machine taking coins (x) to give a soda (y), the inverse function is returning the soda (y) to get exactly the same coins back (x). The mapping is perfectly reversible only if there's a unique outcome for each input (one-to-one mapping)."
  code_implementation: |
    import torch

    def test_linear_inverse():
        # A simple linear function y = Ax can be inverted using matrix inversion x = A^-1 y
        # Matrix A represents our linear mapping (function)
        A = torch.tensor([[2.0, 1.0], [1.0, 3.0]])
        x = torch.tensor([1.5, -0.5])
        
        # Forward pass: y = f(x)
        y = torch.matmul(A, x)
        print(f"Forward mapping (y): {y}")
        
        # Inverse function: f^-1
        A_inv = torch.inverse(A)
        
        # Backward pass (inverse): x = f^-1(y)
        x_recovered = torch.matmul(A_inv, y)
        print(f"Recovered input (x): {x_recovered}")
        
        # Sanity check
        assert torch.allclose(x, x_recovered)

    test_linear_inverse()
  v8_sanity_audit:
    sympy_pseudo_code: |
      import sympy as sp

      # Use sympy.solve to invert functions algebraically
      x, y = sp.symbols('x y')
      
      # Define the original function f(x)
      f_x = (3*x + 2) / (x - 1)
      
      # Set up the equation y = f(x)
      eq = sp.Eq(y, f_x)
      
      # Solve for x in terms of y to find the inverse mapping
      x_solutions = sp.solve(eq, x)
      inverse_f_y = x_solutions[0]
      
      # Conventionally represent the inverse function f^-1(x) by swapping variables
      inverse_f_x = inverse_f_y.subs(y, x)
      
      print(f"Original f(x): {f_x}")
      print(f"Inverse f^-1(x): {inverse_f_x}")
