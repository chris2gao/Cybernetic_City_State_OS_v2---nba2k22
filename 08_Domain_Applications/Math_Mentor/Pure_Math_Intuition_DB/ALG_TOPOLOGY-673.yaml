    import sympy as sp
    # Representing a 1D simplex loop
    v1, v2, v3 = sp.symbols('v1 v2 v3')
    edge1, edge2, edge3 = v2 - v1, v3 - v2, v1 - v3
    cycle = edge1 + edge2 + edge3
    assert sp.simplify(cycle) == 0
