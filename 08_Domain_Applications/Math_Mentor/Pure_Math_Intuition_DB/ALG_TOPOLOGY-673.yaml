code_implementation: |
  import torch
  import numpy as np
  
  def compute_simplicial_homology(boundary_matrix):
      # Compute Betti number b0, b1 from boundary matrix.
      rank = np.linalg.matrix_rank(boundary_matrix)
      return boundary_matrix.shape[1] - rank
  
  b_matrix = np.array([[1, -1, 0], [0, 1, -1], [-1, 0, 1]])
  print("Hole dimension:", compute_simplicial_homology(b_matrix))
