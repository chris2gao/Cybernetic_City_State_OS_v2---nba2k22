code_implementation: |
  import sympy as sp
  z = sp.Symbol('z')
  # Entire function e^z
  f = sp.exp(z)
  # Picard's theorem: e^z takes every value except 0
  # Solving e^z = w
  w = sp.Symbol('w')
  solutions = sp.solve(sp.Eq(f, w), z)
