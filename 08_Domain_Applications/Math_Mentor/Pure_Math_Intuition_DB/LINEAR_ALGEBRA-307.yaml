  import sympy as sp
  
  v1 = sp.Matrix([1, 0, 0])
  v2 = sp.Matrix([0, 1, 0])
  v3 = sp.Matrix([1, 1, 0]) # linearly dependent on v1, v2
  
  c1, c2, c3 = sp.symbols('c1 c2 c3')
  eq = c1*v1 + c2*v2 + c3*v3
