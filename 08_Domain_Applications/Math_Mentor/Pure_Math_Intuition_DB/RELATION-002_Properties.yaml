concept_node:
  id: RELATION-002
  title: Relation Properties (关系的性质 - 自反、对称、传递)
  description: Properties of binary relations on a set, including reflexivity, symmetry,
    and transitivity.
  llm_physical_mapping: 'Reflexive: The diagonal of the relation''s boolean matrix
    is all 1s (all elements relate to themselves).

    Symmetric: The boolean matrix equals its transpose (M == M.T).

    Transitive: The boolean matrix squared is a subset of itself (M @ M <= M) in boolean
    matrix multiplication.

    '
  code_implementation: "import torch\n\ndef check_relation_properties(M: torch.Tensor):\n\
    \    \"\"\"\n    Check properties of a relation represented by a boolean adjacency\
    \ matrix M.\n    \"\"\"\n    # Reflexive: diagonal is all True (1s)\n    is_reflexive\
    \ = torch.diag(M).all().item()\n    \n    # Symmetric: matrix equals its transpose\
    \ M == M.T\n    is_symmetric = torch.all(M == M.T).item()\n    \n    # Transitive:\
    \ M @ M <= M in boolean algebra\n    M_float = M.float()\n    M_sq = (torch.matmul(M_float,\
    \ M_float) > 0)\n    # Transitive means for all i,j: if M_sq[i,j] is True, then\
    \ M[i,j] must be True.\n    # This is equivalent to checking if M_sq is logically\
    \ less than or equal to M.\n    is_transitive = torch.all(M_sq <= M).item()\n\
    \    \n    return {\n        \"reflexive\": is_reflexive,\n        \"symmetric\"\
    : is_symmetric,\n        \"transitive\": is_transitive\n    }\n"
  v8_sanity_audit:
    sympy_pseudo_code: "from sympy import Matrix\n\ndef check_properties(M: Matrix):\n\
      \    n = M.rows\n    \n    # Reflexive: diagonal is all 1s\n    is_reflexive\
      \ = all(M[i, i] == 1 for i in range(n))\n    \n    # Symmetric: M == M.T\n \
      \   is_symmetric = (M == M.T)\n    \n    # Transitive: M @ M <= M\n    M_sq\
      \ = M * M\n    is_transitive = True\n    for i in range(n):\n        for j in\
      \ range(n):\n            if M_sq[i, j] > 0 and M[i, j] == 0:\n             \
      \   is_transitive = False\n                break\n                \n    return\
      \ is_reflexive, is_symmetric, is_transitive\n\n# Example usage\nM_example =\
      \ Matrix([\n    [1, 1, 0],\n    [1, 1, 1],\n    [0, 1, 1]\n])\nprint(check_properties(M_example))\n"
  sub_topics:
  - 自反性与反自反性的定义
  - 对称性与反对称性的定义
  - 传递性的定义
  - 各种性质在关系矩阵与关系图中的特征
