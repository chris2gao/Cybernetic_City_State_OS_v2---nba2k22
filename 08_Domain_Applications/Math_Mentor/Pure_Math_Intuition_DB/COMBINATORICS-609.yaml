code_implementation: |
  import sympy as sp
  x = sp.Symbol('x')
  f = x**3
  df_exact = sp.diff(f, x)
  h = sp.Symbol('h')
  df_approx = (f.subs(x, x+h) - f.subs(x, x-h)) / (2*h)
v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy as sp
    x, h = sp.symbols('x h')
    f = x**3
    df_exact = sp.diff(f, x)
    df_approx = (f.subs(x, x+h) - f.subs(x, x-h)) / (2*h)
    assert sp.simplify(sp.limit(df_approx, h, 0) - df_exact) == 0
