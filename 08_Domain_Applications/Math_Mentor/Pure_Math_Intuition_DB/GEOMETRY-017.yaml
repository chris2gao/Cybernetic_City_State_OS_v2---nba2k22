  title: "面积与体积 - 祖暅原理（卡瓦列里原理）：截面积处处相等则体积相等的等效思维 (n_137)"
  version: "V9.1"
  sub_topics:
    - "祖暅原理的文字表述：幂势既同，则积不容异"
    - "球体体积公式的推导应用（牟合方盖思想）"
    - "等高截面积等价性的体积应用条件"
    - "卡瓦列里原理与微元法的初步衔接"
  llm_physical_mapping: "Mundane physical metaphor: Imagine a stack of identical coins perfectly aligned to form a straight cylinder. If you push the stack askew so it leans to one side, it becomes an oblique cylinder. However, because the number of coins and the area of each individual coin have not changed, the total volume of the stack remains exactly the same. The overall height is invariant, and the area at every height is invariant. This perfectly illustrates Cavalieri's principle (Zu Geng's principle): if two solids have the same height and equal cross-sectional areas at every level, they have the same volume."
  code_implementation: |-
    # PyTorch volume numerical integration checking invariance to slice shifting
    import torch

    def verify_cavalieri_principle():
        z_steps = 1000
        height = 10.0
        dz = height / z_steps
        
        # Consider a base area function A(z) = pi * (z/height)**2  (A cone)
        z_vals = torch.linspace(0, height, z_steps)
        areas = torch.pi * (z_vals / height)**2
        
        # Original solid volume integration
        vol_original = torch.sum(areas * dz)
        
        # Sheared solid: Slices are shifted laterally by some function shift(z)
        # The area at each slice z remains the same despite the shift.
        # Thus, the area array is identical.
        vol_sheared = torch.sum(areas * dz)
        
        # Verify volumes are equal
        assert torch.isclose(vol_original, vol_sheared), "Volumes must be equal by Cavalieri's principle"
        
        return {
            "volume_original": vol_original.item(),
            "volume_sheared": vol_sheared.item(),
            "invariant": torch.isclose(vol_original, vol_sheared).item()
        }
  v8_sanity_audit:
    sympy_pseudo_code: |-
      import sympy as sp
      
      z, h = sp.symbols('z h', positive=True)
      
      # Base area function for some solid (e.g., a cone where r(z) = z * R/h)
      R = sp.Symbol('R', positive=True)
      A_z = sp.pi * (z * R / h)**2
      
      # Original object volume
      vol_straight = sp.integrate(A_z, (z, 0, h))
      
      # Sheared object: Lateral shift x_shift = f(z), but cross-sectional area A(z) is invariant
      A_sheared = A_z 
      vol_sheared = sp.integrate(A_sheared, (z, 0, h))
      
      # Verify Cavalieri's principle symbolically
      invariance_check = sp.simplify(vol_straight - vol_sheared)
      assert invariance_check == 0, "Volume is not invariant under shear!"
