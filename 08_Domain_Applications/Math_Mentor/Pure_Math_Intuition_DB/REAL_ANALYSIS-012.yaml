id: "REAL_ANALYSIS-012"
title: "Compactness via KV Cache PagedAttention"
sub_topics:
  - "Compact Sets and Finite Covers"
  - "Paged Attention Memory Blocks"
  - "KV Cache Eviction"
llm_physical_mapping:
  - "LLM context windows act as compact sets bounded by physical memory walls (VRAM constraints)."
  - "PagedAttention partitions the continuous sequence space into non-contiguous finite block covers (Pages)."
  - "Finite sub-covers represent dynamic cache eviction strategies, keeping heavy-hitter tokens compact in memory."
code_implementation: |
  import torch

  class PagedKVCache:
      def __init__(self, block_size, num_blocks, head_dim):
          # Compact memory allocation mapping to blocks
          self.blocks = torch.zeros(num_blocks, block_size, head_dim)
          self.block_table = {}

      def allocate_and_store(self, seq_id, token_kv):
          # Simplified allocation logic (finite sub-cover creation)
          block_idx = len(self.block_table)
          self.block_table[seq_id] = block_idx
          self.blocks[block_idx, 0, :] = token_kv
v8_sanity_audit:
  sympy_pseudo_code: |
    import torch
    
    num_blocks, block_size, head_dim = 16, 8, 128
    cache = torch.zeros(num_blocks, block_size, head_dim)
    
    # Store token in finite cover
    token_kv = torch.randn(head_dim)
    cache[0, 0, :] = token_kv
    
    assert cache[0, 0, :].sum() == token_kv.sum()
