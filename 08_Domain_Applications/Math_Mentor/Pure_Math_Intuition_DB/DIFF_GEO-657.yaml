formal_definition: >-
  Let M be a smooth n-manifold. A Riemannian metric on M is a smooth section
  g ∈ Γ(Sym²(T*M)) such that, for every p∈M, the bilinear form
  g_p:T_pM × T_pM -> R is symmetric and positive definite. Thus, for
  u,v∈T_pM, g_p(u,v)=g_p(v,u), and g_p(v,v)>0 for every nonzero v∈T_pM. In
  local coordinates (x¹,...,xⁿ), the metric is represented by a smooth
  symmetric positive-definite matrix of functions g = g_ij dx^i ⊗ dx^j.
  Under a coordinate change y=y(x), its components transform as
  g'_{ab} = (∂x^i/∂y^a)(∂x^j/∂y^b) g_ij. The norm and angle of tangent vectors
  are defined by ||v||_g = sqrt(g_p(v,v)) and, for nonzero u,v,
  cos θ = g_p(u,v) / (||u||_g ||v||_g). For a piecewise smooth curve
  γ:[a,b]->M, its Riemannian length is
  L_g(γ) = ∫_a^b sqrt(g_{γ(t)}(γ_dot(t),γ_dot(t))) dt. This length is invariant
  under regular monotone reparameterization. On each connected component of M,
  the induced Riemannian distance is d_g(p,q) = inf { L_g(γ) : γ joins p to q }.
  This distance induces the original manifold topology. If M is oriented, the
  Riemannian volume form in positively oriented local coordinates is
  dvol_g = sqrt(det(g_ij)) dx¹∧...∧dxⁿ. Without an orientation, the metric still
  determines a canonical volume density, but not a globally chosen signed
  volume form. A Riemannian metric is not the same object as a connection,
  curvature, geodesic or coordinate matrix. It determines a unique Levi-Civita
  connection, from which geodesics and curvature are subsequently defined, but
  those downstream structures require separate definitions and validation.
formal_definition_zh: >-
  设 M 是光滑 n 维流形。M 上的 Riemannian 度量是一个光滑截面
  g∈Γ(Sym²(T*M))，并且对每一点 p∈M，双线性形式 g_p:T_pM×T_pM->R 都是
  对称且正定的。也就是说，对 u,v∈T_pM，g_p(u,v)=g_p(v,u)，并且对任意非零
  v∈T_pM，g_p(v,v)>0。在局部坐标 (x¹,...,xⁿ) 中，度量表示为由光滑函数组成
  的对称正定矩阵 g=g_ij dx^i⊗dx^j。当坐标变换为 y=y(x) 时，分量按照
  g'_{ab}=(∂x^i/∂y^a)(∂x^j/∂y^b)g_ij 进行变换。改变的是坐标分量，几何度量
  对象本身不变。切向量的范数定义为 ||v||_g=sqrt(g_p(v,v))，对非零切向量
  u、v，其夹角满足 cosθ=g_p(u,v)/(||u||_g||v||_g)。对分段光滑曲线
  γ:[a,b]->M，其 Riemannian 长度为
  L_g(γ)=∫_a^b sqrt(g_{γ(t)}(γ_dot(t),γ_dot(t)))dt。该长度在正则单调重参数化下
  保持不变。在 M 的每个连通分支上，Riemannian 距离定义为
  d_g(p,q)=inf{L_g(γ):γ连接p与q}。该距离诱导出原来的流形拓扑。若 M 已定向，
  则在正向局部坐标中，Riemannian 体积形式为
  dvol_g=sqrt(det(g_ij))dx¹∧...∧dxⁿ。若没有全局定向，度量仍能确定规范的体积
  密度，但不能自动确定一个全局带符号的体积形式。Riemannian 度量不等于联络、
  曲率、测地线或某一个坐标矩阵。度量会唯一确定 Levi-Civita 联络，之后才能定义
  测地线与曲率；这些下游结构仍需要独立定义和验证。
