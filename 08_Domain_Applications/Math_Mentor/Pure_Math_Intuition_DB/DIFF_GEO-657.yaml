mapping_boundary:
  primary_mapping_kind: "llm_architecture_bounded_structural_analogy"
  primary_mapping: >-
    Treat a representation state as a point in a hypothetical smooth state
    space. A Riemannian metric can then be used as an analogy for a
    state-dependent positive-definite bilinear rule that assigns local lengths,
    angles and anisotropic costs to infinitesimal perturbation directions. Under
    this analogy, different directions may have different local costs, so an
    equal coordinate change need not represent an equal geometric change. The
    metric matrix acts only as a coordinate representation of this local rule.
    Path length analogically represents the accumulated local cost of moving
    through representation space. The induced distance is the least such path
    cost over all admissible paths. A Fisher-information-type matrix, a
    positive-definite preconditioner or a locally defined sensitivity matrix may
    serve as limited examples of metric-like structure, but only when the
    mathematical assumptions needed for smoothness, symmetry and positive
    definiteness are separately verified.
  primary_mapping_zh: >-
    可以把模型表示状态类比为一个假想光滑状态空间中的点。Riemannian 度量可被类比为
    一种随状态变化的正定双线性规则，用于给局部无穷小扰动方向分配长度、夹角和
    各向异性代价。在这种类比中，不同方向可以具有不同的局部代价，因此坐标上相同
    大小的变化，不一定对应相同的几何变化。度量矩阵只是该局部几何规则在某组坐标
    中的分量表示。路径长度可以类比为表示状态沿某条连续路径移动时累计的局部代价；
    诱导距离则类比为所有允许路径中最小的累计代价。Fisher information、正定预条件
    矩阵或局部敏感度矩阵，在额外验证光滑性、对称性和正定性之后，可以作为有限度的
    metric-like 示例，但不能自动视为 Riemannian 度量。
  boundary: >-
    This is a bounded structural analogy only. It does not claim that an actual
    LLM latent or representation space is a smooth manifold. A fixed Euclidean
    dot product, cosine similarity or attention score is not automatically a
    state-dependent Riemannian metric. Transformer QK^T scores are not generally
    a symmetric positive-definite bilinear form on a single tangent space. Model
    weights, activations, attention matrices, Jacobians and residual updates are
    not themselves Riemannian metric tensors. Hessians may be indefinite.
    Covariance and Fisher-information matrices may be singular or only positive
    semidefinite. None becomes a Riemannian metric without additional smoothness
    and nondegeneracy assumptions. The coordinate matrix g_ij is not the
    invariant geometric object itself. Its entries change under coordinate
    transformations according to the tensor transformation law. A local metric
    norm does not automatically define a useful global semantic distance between
    tokens, prompts, concepts or model states. Training trajectories,
    gradient-descent paths, diffusion trajectories and hidden-state updates are
    not automatically geodesics. A Riemannian metric does not guarantee that
    minimizing geodesics exist globally or are unique. Completeness, cut loci and
    other global hypotheses require separate analysis. Changes in metric
    components are not identical to curvature. Curvature is derived from the
    Levi-Civita connection and derivatives of the metric. The Riemannian volume
    element is not automatically a probability density, entropy measure, token
    frequency or information content. The physical interpretation as energy cost
    or travel cost is not universal and must remain metaphorical unless a
    specific variational model is supplied. No claim is made that an LLM has a
    verified Levi-Civita connection, geodesic distance, curvature tensor, volume
    form or Riemannian completeness. The analogy does not constitute machine
    validation of a geometric model of an LLM. The formal object remains a
    Riemannian metric on a smooth manifold.
  preserve_full_boundary: true
  existing_physical_metaphor_status: "secondary_teaser_only"
