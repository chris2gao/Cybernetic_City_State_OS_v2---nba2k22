id: "CALCULUS-280"
concept_name: "泰勒展开 - 泰勒级数与麦克劳林级数 (n_280)"
sub_topics:
  - "泰勒展开式的通用公式"
  - "麦克劳林级数作为 0 点处的特例"
  - "常见函数 (e^x, sin x, cos x, ln(1+x)) 的展开式"
  - "泰勒展开在近似计算中的量化评估"
llm_physical_mapping: "Maclaurin series is like tuning an instrument starting exactly at the middle C key (0 point), while Taylor series allows you to tune starting from any specific key on the piano."
code_implementation: |
  import sympy as sp
  x = sp.Symbol('x')
  # Maclaurin series for exp(x) up to x^4
  exp_maclaurin = sp.series(sp.exp(x), x, 0, 5).removeO()
  # Taylor series for ln(x) around x=1 up to (x-1)^3
  ln_taylor = sp.series(sp.ln(x), x, 1, 4).removeO()
v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy as sp
    x = sp.Symbol('x')
    exp_maclaurin = sp.series(sp.exp(x), x, 0, 3).removeO()
    # e^x at x=0 is 1 + x + x^2/2
    assert exp_maclaurin == 1 + x + x**2/2
