version: 9.1
id: TRIG-021
title: "角度与弧度的转换 - 发生学溯源：古巴比伦 360 度系统的局限性 (n_182)"
sub_topics:
  - 六十进制的历史成因与优势
  - 度量单位与实数运算的割裂
  - 角度单位在圆周运动中的非自然性
  - 几何直观与解析分析之间的代数鸿沟
llm_physical_mapping: "Dividing a pizza into 360 slices is arbitrary based on human base-60 traditions, not physics."
code_implementation: |
  import torch
  
  def degree_to_fraction(degrees: torch.Tensor) -> torch.Tensor:
      """
      Converts arbitrary base-360 slices (degrees) to fractions of a circle.
      """
      return degrees / 360.0
v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy as sp
    
    deg = sp.Symbol('deg', real=True)
    # A degree is fundamentally 1/360th of a full circle
    circle_fraction = deg / sp.Integer(360)
    
    assert circle_fraction.subs(deg, 90) == sp.Rational(1, 4)
    assert circle_fraction.subs(deg, 360) == sp.Integer(1)
