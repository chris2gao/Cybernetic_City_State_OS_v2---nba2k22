mode_a_intuition:
  occurrence_crisis:
    english: "Equivalent formulas can have many shapes, so comparison needs a reproducible form tied to observable truth-table rows."
    chinese: "等价公式可以有许多形状，因此比较时需要一种与真值表行绑定的可复现形式。"
  primary:
    english: |-
      Treat every true row as an exact address. Its minterm names only that
      address, and PDNF joins all accepted addresses. Dually, every false row
      supplies a maxterm that excludes exactly that address, and PCNF combines
      all exclusions.
    chinese: |-
      把每个真值行为作精确地址：对应最小项只命中该地址，PDNF 把所有被接受地址
      合并。对偶地，每个假值行提供一个只排除该地址的最大项，PCNF 合并全部排除。
  low_friction_example:
    english: "For XOR on P,Q, the true rows 01 and 10 give (¬P∧Q)∨(P∧¬Q) as PDNF."
    chinese: "P、Q 的异或在 01、10 两行为真，因此 PDNF 是 (¬P∧Q)∨(P∧¬Q)。"
  limitations:
    - "An address analogy depends on a fixed variable order. / 地址类比依赖固定变量顺序。"
    - "Principal forms can grow exponentially and are not automatically the shortest formulas. / 主范式可能指数增长，并不自动最短。"

