common_misconceptions:
  - "Any OR-of-ANDs is automatically the unique PDNF. / 误以为任意析取之合取自动是唯一主析取范式。"
  - "A PDNF minterm may omit variables. / 误以为主析取范式的最小项可以遗漏变量。"
  - "PCNF uses the true rows rather than false rows. / 误以为 PCNF 从真值行为构造。"
  - "Canonical means shortest. / 误以为规范形式等于最短形式。"
  - "Constant False has no normal form. / 误以为常假函数没有主范式。"

