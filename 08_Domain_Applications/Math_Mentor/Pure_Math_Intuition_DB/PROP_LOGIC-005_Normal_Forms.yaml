v8_sanity_audit:
  status: "run_with_log"
  execution_claim: "bounded_finite_audit_only"
  language: "sympy"
  script_ref: ".ai/PROGRAM_RUNS/kcp-batch-1-prop-logic-certification-0001/AUDITS/run_prop_logic_audit.py"
  tested_properties: ["all 256 three-variable truth functions", "PDNF and PCNF reconstruction", "4096 normal-form evaluations", "constant true and false cases"]
  explicitly_not_validated: ["general_finite_n_theorem", "formula_minimality", "computational_efficiency", "pedagogy", "learner_mastery"]
  sympy_pseudo_code: |
    import itertools
    import sympy as sp
    from sympy.logic.boolalg import And, Not, Or
    P, Q = sp.symbols("P Q")
    rows = list(itertools.product((False, True), repeat=2))
    minterms = [And(P if p else Not(P), Q if q else Not(Q)) for p, q in rows if p != q]
    pdnf = Or(*minterms)
    for p, q in rows:
        assert bool(pdnf.subs({P: p, Q: q})) == (p != q)

