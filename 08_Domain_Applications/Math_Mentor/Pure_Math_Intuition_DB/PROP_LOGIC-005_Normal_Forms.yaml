concept_name: "Principal Disjunctive and Conjunctive Normal Forms / 主析取范式与主合取范式"
canonical_concept: "principal_propositional_normal_forms"
domain: "Mathematical Logic / Propositional Calculus"
symbol: "PDNF, PCNF"

sub_topics:
  - "Principal disjunctive normal form (PDNF) / 主析取范式"
  - "Principal conjunctive normal form (PCNF) / 主合取范式"
  - "Truth-table construction method and qualified uniqueness / 真值表求解方法与有限条件下的唯一性"

pure_math_definition:
  english: |-
    Fix a finite ordered variable list x1,...,xn. A literal is xi or ¬xi. A
    minterm contains exactly one literal for every variable and is true on
    exactly one valuation. The principal disjunctive normal form (PDNF) of φ is
    the disjunction of the minterms belonging to valuations that satisfy φ. A
    maxterm contains exactly one literal for every variable and is false on
    exactly one valuation. The principal conjunctive normal form (PCNF) of φ is
    the conjunction of the maxterms belonging to valuations that falsify φ.

    Construct PDNF from the truth-table rows where φ is true and PCNF from rows
    where φ is false. For a fixed variable list and the stated literal/order
    conventions, these principal forms are determined by the truth table and
    are unique up to reordering of terms, clauses, and literals. This qualified
    uniqueness does not say that arbitrary non-principal DNF or CNF is unique.
    The empty disjunction denotes False and the empty conjunction denotes True,
    covering constant truth functions.
  chinese: |-
    固定有限且有序的变量表 x1,...,xn。文字是 xi 或 ¬xi。一个最小项对每个变量
    恰含一个文字，并且只在一个赋值下为真。公式 φ 的主析取范式（PDNF）是使 φ
    为真的各赋值所对应最小项的析取。一个最大项对每个变量恰含一个文字，并且
    只在一个赋值下为假。φ 的主合取范式（PCNF）是使 φ 为假的各赋值所对应最大
    项的合取。

    从真值表中 φ 为真的行构造 PDNF，从 φ 为假的行构造 PCNF。固定变量表以及
    文字和排序约定后，主范式由真值表决定；除项、子句和文字的排列次序外具有
    唯一性。这一限定唯一性不表示任意非主 DNF 或 CNF 唯一。空析取记作假，空
    合取记作真，从而覆盖常值真值函数。

assumptions_and_notation:
  - "The variable list is finite, fixed, and ordered before principal forms are constructed. / 构造主范式前，变量表必须有限、固定且有序。"
  - "Every principal term or clause mentions every variable exactly once. / 每个主项或主子句对每个变量恰出现一次。"
  - "DNF/CNF and principal DNF/CNF are not interchangeable terms. / DNF/CNF 与主 DNF/主 CNF 不是可互换术语。"

