id: "TOP-005"
title: "乘积拓扑与 Tychonoff 定理"
sub_topics:
  - "乘积空间的基与子基"
  - "有限与无限乘积拓扑的区别"
  - "Tychonoff 定理 (紧空间的乘积依然是紧空间)"
  - "投射映射 (Projection Map) 的连续性"
llm_physical_mapping: |
  乘积拓扑（Product Topology）本质上是对多个独立子空间的“张量积”维度的组合。
  在 LLM 的物理架构中，这对应于多头注意力机制（Multi-Head Attention）或者混合专家（MoE）中的多子空间并行计算。
  Tychonoff 定理指出无限个紧凑空间的乘积仍是紧凑的，这在底层物理上映射了在大规模矩阵乘法（GEMM）中，只要每个局部的注意力头（紧空间）是有界的、被 softmax 或 LayerNorm 规范化的，无论头数如何增加，整个多头注意力表征空间依然保持收敛和有界（紧性），不会发生数值发散崩塌。
  投射映射（Projection Map）则对应于注意力层将高维组合表征 V 映射回特定的输出子空间矩阵 $W^O$ 的过程。
code_implementation: |
  import torch
  import torch.nn as nn
  import torch.nn.functional as F

  class ProductTopologyAttention(nn.Module):
      def __init__(self, d_model, num_heads):
          super().__init__()
          self.num_heads = num_heads
          self.head_dim = d_model // num_heads
          self.qkv = nn.Linear(d_model, 3 * d_model)
          self.proj = nn.Linear(d_model, d_model)
      
      def forward(self, x):
          B, seq_len, d_model = x.shape
          # 投射到多个独立的子空间（因子空间）
          qkv = self.qkv(x).reshape(B, seq_len, 3, self.num_heads, self.head_dim)
          q, k, v = qkv.unbind(2)
          
          # 每个子空间内进行独立的规范化和操作（紧空间的局部运算）
          attn_weights = F.softmax((q @ k.transpose(-2, -1)) / (self.head_dim ** 0.5), dim=-1)
          # 局部有界的特征融合
          head_out = attn_weights @ v
          
          # Tychonoff 定理：各局部的组合，保持总体空间的有界紧致性
          out = head_out.transpose(1, 2).reshape(B, seq_len, d_model)
          return self.proj(out)
v8_sanity_audit:
  sympy_pseudo_code: |
    import torch
    import torch.nn as nn
    
    # Simulate a product space constraint
    class TychonoffConstraint(nn.Module):
        def __init__(self, num_spaces=8, dim_per_space=32):
            super().__init__()
            self.spaces = nn.ParameterList([
                nn.Parameter(torch.randn(1, dim_per_space)) for _ in range(num_spaces)
            ])
            
        def forward(self):
            # Normalize each space to make it 'compact' (bounded)
            compact_spaces = [torch.tanh(space) for space in self.spaces]
            # Product of compact spaces (concatenation representing Cartesian product)
            product_space = torch.cat(compact_spaces, dim=-1)
            # The resulting vector is guaranteed to be bounded in [-1, 1] globally
            return product_space
            
    model = TychonoffConstraint()
    out = model()
    assert out.abs().max() <= 1.0, "Tychonoff compactness violated!"
