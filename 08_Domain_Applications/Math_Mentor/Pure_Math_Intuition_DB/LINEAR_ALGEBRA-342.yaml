concept_name: "最小二乘法 - 当方程无解时，利用正交投影寻找最逼近真实值的“妥协解” (n_342)"
sub_topics:
  - "超定方程组 Ax = b 的正则方程 AᵀAx = Aᵀb"
  - "误差向量的模极小化准则"
  - "几何解释：b 在 A 的列空间上的正交投影"
  - "在数据去噪与系统识别中的物理原型"
llm_physical_mapping: "spatial deformation attempting to reach a target point outside its accessible volume. The matrix defines a flat plane in a 3D space. The target point exists in the 3D space above the plane. The system cannot stretch its flat plane to reach the 3D point. Instead, it drops a perpendicular shadow (orthogonal projection) from the target point straight down onto the plane to find the closest reachable location."
code_implementation: |
  import sympy as sp
  A = sp.Matrix([[1, 1], [1, -1], [1, 1]])
  b = sp.Matrix([2, 1, 3])
  # Normal equation A^T * A * x = A^T * b
  AtA = A.T * A
  Atb = A.T * b
  x_hat = AtA.LUsolve(Atb)
v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy as sp
    A = sp.Matrix([[1, 1], [1, -1], [1, 1]])
    b = sp.Matrix([2, 1, 3])
    AtA = A.T * A
    Atb = A.T * b
    x_hat = AtA.LUsolve(Atb)
    p = A * x_hat
    e = b - p
    assert sp.simplify(A.T * e) == sp.Matrix([0, 0])
