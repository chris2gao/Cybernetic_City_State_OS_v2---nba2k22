node_meta:
  version: "9.1"
  id: "NUM_THEORY-011"
  title: "中国剩余定理 - 发生学溯源：中国古代“韩信点兵（物不知数）”的工程调度问题 (n_205)"
sub_topics:
  - "《孙子算经》中的原始问题"
  - "线性同余方程组的实际背景"
  - "历史上中西方的独立发现"
  - "计数与调度的数论模型"
llm_physical_mapping: |
  Mundane physical metaphor: Han Xin counting his soldiers by having them line up in rows of 3, 5, and 7. Instead of counting every single soldier, he only counts the remainders in the incomplete last rows. By solving the resulting system of linear congruences, he can quickly deduce the total number of troops, optimizing the time and effort required for the counting process.
code_implementation: |
  def han_xin_count_soldiers(remainders, moduli):
      """
      Brute force search algorithm simulating Han Xin counting soldiers.
      remainders: list of remainders (e.g., [2, 3, 2])
      moduli: list of moduli (e.g., [3, 5, 7])
      """
      soldiers = 0
      while True:
          if all(soldiers % m == r for m, r in zip(moduli, remainders)):
              return soldiers
          soldiers += 1
v8_sanity_audit:
  sympy_pseudo_code: |
    from sympy.ntheory.modular import crt
    
    moduli = [3, 5, 7]
    remainders = [2, 3, 2]
    
    solution, mod_lcm = crt(moduli, remainders)
    
    assert solution == 23
