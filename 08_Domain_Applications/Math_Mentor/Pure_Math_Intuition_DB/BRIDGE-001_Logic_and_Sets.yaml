concept_node:
  id: "BRIDGE-001"
  name: "逻辑与集合的同构 (Logic ↔ Sets)"
  domain: "cross_domain_bridge"
  sub_topics:
    - "命题逻辑与集合论的布尔代数同构"
    - "交/并/补与与/或/非的精确对应"
    - "德摩根定律在两域的等价性"
    - "特征函数 (Indicator function) 桥接"
  llm_physical_mapping: "Imagine an electrical circuit (logic) superimposed on a Venn diagram drawn in physical space (sets). In logic, a series circuit requires both switches to be closed for current to flow (Logic AND, A ∧ B). In the physical Venn diagram, this is exactly the intersecting region bounded by two overlapping hoops (Set Intersection, A ∩ B). Parallel circuits allow current if either switch is closed (Logic OR, A ∨ B), corresponding to the entire area covered by either hoop (Set Union, A ∪ B). A logic NOT gate inverts a signal (~A), perfectly mirroring the spatial region entirely outside a hoop (Set Complement, A^c). The 'Universe' is the total spatial bounding box mapping to 'True' (circuit always closed), while the 'Empty Set' is an empty void mapping to 'False' (broken circuit). This profound isomorphism shows that truth values and spatial containment are mathematically identical under Boolean algebra."
  code_implementation: |
    import torch

    # Universal set: integers 1 to 10
    universe = torch.arange(1, 11)

    # Set A: Even numbers, Set B: Numbers > 5
    # Feature functions (Indicator vectors/Boolean masks)
    mask_A = (universe % 2 == 0) # Logic statement: x is even
    mask_B = (universe > 5)      # Logic statement: x > 5

    # 1. Intersection (A ∩ B) <=> Logic AND (A ∧ B)
    intersection_mask = mask_A & mask_B
    set_intersection = universe[intersection_mask]
    print(f"A ∩ B (Logic AND): {set_intersection.tolist()}") # [6, 8, 10]

    # 2. Union (A ∪ B) <=> Logic OR (A ∨ B)
    union_mask = mask_A | mask_B
    set_union = universe[union_mask]
    print(f"A ∪ B (Logic OR): {set_union.tolist()}") # [2, 4, 6, 7, 8, 9, 10]

    # 3. Complement (A^c) <=> Logic NOT (~A)
    complement_A_mask = ~mask_A
    set_complement_A = universe[complement_A_mask]
    print(f"A^c (Logic NOT): {set_complement_A.tolist()}") # [1, 3, 5, 7, 9]

    # 4. De Morgan's Law: ~(A ∨ B) == ~A ∧ ~B <=> (A ∪ B)^c == A^c ∩ B^c
    demorgan_left = ~(mask_A | mask_B)
    demorgan_right = (~mask_A) & (~mask_B)
    assert torch.equal(demorgan_left, demorgan_right)
    print("De Morgan's Law holds perfectly in boolean masks.")
    print("De Morgan's Law holds perfectly in boolean masks.")
  v8_sanity_audit:
    sympy_pseudo_code: |
      from sympy import Symbol, And, Or, Not, simplify_logic

      # Define elements representing membership in Sets A and B (or truth values of Propositions A and B)
      x_in_A = Symbol('x_in_A')
      x_in_B = Symbol('x_in_B')

      # Isomorphism 1: Set Intersection <-> Logic AND
      # x in (A ∩ B) <=> (x in A) AND (x in B)
      logic_and = And(x_in_A, x_in_B)

      # Isomorphism 2: Set Union <-> Logic OR
      # x in (A ∪ B) <=> (x in A) OR (x in B)
      logic_or = Or(x_in_A, x_in_B)

      # Isomorphism 3: Set Complement <-> Logic NOT
      # x in (A^c) <=> NOT (x in A)
      logic_not_A = Not(x_in_A)

      # Demonstration: De Morgan's Law
      # (A ∪ B)^c = A^c ∩ B^c
      # NOT(A OR B) <=> (NOT A) AND (NOT B)
      lhs = Not(Or(x_in_A, x_in_B))
      rhs = And(Not(x_in_A), Not(x_in_B))

      is_demorgan_equivalent = simplify_logic(lhs) == simplify_logic(rhs)
      is_demorgan_equivalent = simplify_logic(lhs) == simplify_logic(rhs)
      print(f"De Morgan's equivalence valid: {is_demorgan_equivalent}")
