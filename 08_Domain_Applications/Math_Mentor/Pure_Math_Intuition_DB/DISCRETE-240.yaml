id: "DISCRETE-240"
concept_name: "递推关系 - 线性常系数齐次递推关系的特征方程求解法（常微分方程同构映射） (n_240)"
sub_topics:
  - "特征方程的代数构造"
  - "特征根（实根、重根、复根）对解结构的影响"
  - "通解公式的线性组合形式"
  - "与微分方程算子法的结构相似性分析"
llm_physical_mapping: "mundane physical metaphor: tuning a guitar string. The recurrence relation is like the string's vibration, and solving the characteristic equation finds its natural resonant frequencies (roots)."
code_implementation: |
  import math
  
  def solve_characteristic_eq_degree_2(a, b, c):
      # For a recurrence ar^2 + br + c = 0
      discriminant = b**2 - 4*a*c
      if discriminant > 0:
          root1 = (-b + math.sqrt(discriminant)) / (2*a)
          root2 = (-b - math.sqrt(discriminant)) / (2*a)
          return "distinct_real", (root1, root2)
      elif discriminant == 0:
          root = -b / (2*a)
          return "repeated_real", (root,)
      else:
          return "complex", None
v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy as sp
    r = sp.Symbol('r')
    eq = r**2 - r - 1
    roots = sp.solve(eq, r)
    assert len(roots) == 2