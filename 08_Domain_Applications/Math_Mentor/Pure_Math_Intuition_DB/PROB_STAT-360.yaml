id: "PROB_STAT-360"
concept_name: "参数估计 - 大模型映射：交叉熵损失函数本质上等价于 MLE 的负对数形式 (n_360)"
sub_topics:
  - "预测分布与真实分布的匹配"
  - "最小化 KL 散度与极大似然的一致性"
  - "神经网络权重更新作为似然极大化过程"
  - "概率语言模型中 Token 预测的代数逻辑"
llm_physical_mapping: "tuning the face weights of weighted dice until the probability of generating the exact observed sentence is perfectly maximized."
code_implementation: |
  import sympy as sp
  y_true, y_pred = sp.symbols('y_true y_pred')
  # Binary Cross Entropy
  bce = -(y_true * sp.log(y_pred) + (1 - y_true) * sp.log(1 - y_pred))
v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy as sp
    p = sp.Symbol('p', positive=True)
    # negative log likelihood for a bernoulli event where true=1
    nll = -sp.log(p)
    # cross entropy when true distribution is exactly 1 at this class
    ce = -1 * sp.log(p)
    assert sp.simplify(nll - ce) == 0
