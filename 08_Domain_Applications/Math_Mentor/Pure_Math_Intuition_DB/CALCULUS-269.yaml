llm_physical_mapping: "mundane physical metaphor: tilting a picture frame. Rolle's theorem is a level frame where the top edge must be flat somewhere. Lagrange is tilting the frame, where the edge must be parallel to the tilted bottom somewhere. Cauchy is comparing two differently tilted frames."
code_implementation: |
  import sympy as sp
  # Demonstrate Rolle's Theorem
  x = sp.Symbol('x', real=True)
  f = x**3 - 3*x
  # f(-sqrt(3)) = 0, f(sqrt(3)) = 0
  # There must exist c in (-sqrt(3), sqrt(3)) where f'(c) = 0
  f_prime = sp.diff(f, x)
  critical_points = sp.solve(f_prime, x)
v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy as sp
    x = sp.Symbol('x', real=True)
    f = x**3 - 3*x
    f_prime = sp.diff(f, x)
    critical_points = sp.solve(f_prime, x)
    assert 1 in critical_points and -1 in critical_points
