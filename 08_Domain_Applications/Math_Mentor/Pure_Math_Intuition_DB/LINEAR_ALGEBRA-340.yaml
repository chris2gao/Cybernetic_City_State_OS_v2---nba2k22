id: "LINEAR_ALGEBRA-340"
concept_name: "正定矩阵与二次型 - 大模型映射：优化理论中能量图景的“碗状”拓扑与 Hessian 矩阵正定性 (n_340)"
sub_topics:
  - "Loss Landscape 的局部曲率分析"
  - "正定性作为凸优化收敛的动力学保证"
  - "鞍点附近的非正定特征分析"
  - "二阶优化算法（如二阶牛顿法）的几何基础"
llm_physical_mapping: "spatial deformation representing a literal curved bowl in a landscape. The Hessian matrix measures how the slope changes. If it is positive definite, the space curves upwards in all directions like a perfect bowl, ensuring any ball rolling down will settle at the bottom. If it's indefinite, the space stretches up in one direction but slopes down in another, forming a saddle shape where the ball might roll off the side."
code_implementation: |
  import sympy as sp
  x, y = sp.symbols('x y')
  f = x**2 + y**2
  # Hessian matrix
  H = sp.hessian(f, (x, y))
v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy as sp
    x, y = sp.symbols('x y')
    f = x**2 + y**2
    H = sp.hessian(f, (x, y))
    assert H == sp.Matrix([[2, 0], [0, 2]])
    eigenvals = list(H.eigenvals().keys())
    assert all(e > 0 for e in eigenvals)