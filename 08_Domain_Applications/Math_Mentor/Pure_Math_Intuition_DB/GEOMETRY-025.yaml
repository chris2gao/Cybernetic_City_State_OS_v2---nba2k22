      import sympy as sp
      
      # Extracting x and y components
      Ax, Ay, Bx, By = sp.symbols('A_x A_y B_x B_y')
      A = sp.Matrix([Ax, Ay])
      B = sp.Matrix([Bx, By])
      
      AB = B - A
      x_comp = AB[0]
      y_comp = AB[1]
      
      u_x, u_y = sp.symbols('u_x u_y')
      u = sp.Matrix([u_x, u_y])
      
      v_sum = AB + u
