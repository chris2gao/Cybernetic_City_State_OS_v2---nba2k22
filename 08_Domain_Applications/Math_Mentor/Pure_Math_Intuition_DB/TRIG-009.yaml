code_implementation: |
  import torch

  def calculate_displacement(A: float, w: float, phi: float, t: torch.Tensor) -> torch.Tensor:
      """
      PyTorch modeling y(t) = A * cos(w*t + phi)
      Calculates the displacement of an object in simple harmonic motion.
      """
      return A * torch.cos(w * t + phi)

  # Example usage
  time_tensor = torch.linspace(0, 10, 100)
  displacement = calculate_displacement(A=2.0, w=torch.pi, phi=0.0, t=time_tensor)
v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy as sp

    t = sp.Symbol('t', real=True)
    A, w, phi = sp.symbols('A w phi', real=True, positive=True)

    # Kinematics decomposition: position
    x = A * sp.cos(w * t + phi)
    y = A * sp.sin(w * t + phi)

    # Velocity
    vx = sp.diff(x, t)
    vy = sp.diff(y, t)

    # Acceleration
    ax = sp.diff(vx, t)
    ay = sp.diff(vy, t)

    # Verify that acceleration is directed towards the center: a = -w^2 * r
    assert sp.simplify(ax - (-w**2 * x)) == 0
    assert sp.simplify(ay - (-w**2 * y)) == 0
