code_implementation: |
  import torch
  import time

  def mod_exp(base, exp, mod):
      # Fast modular exponentiation
      result = torch.tensor(1, dtype=torch.int64)
      base = torch.tensor(base, dtype=torch.int64) % mod
      exp = torch.tensor(exp, dtype=torch.int64)
      
      while exp > 0:
          if exp % 2 == 1:
              result = (result * base) % mod
          exp = exp // 2
          base = (base * base) % mod
      return result.item()

  def brute_force_discrete_log(base, target, mod):
      # Naive discrete log (brute force search) showing time complexity
      base_t = torch.tensor(base, dtype=torch.int64)
      target_t = torch.tensor(target, dtype=torch.int64)
      mod_t = torch.tensor(mod, dtype=torch.int64)
      
      current = torch.tensor(1, dtype=torch.int64)
      for x in range(mod):
          if current == target_t:
              return x
          current = (current * base_t) % mod_t
      return -1

  # Demonstration
  p = 10007 # Small prime
  g = 5     # Primitive root
  x = 1234  # Secret exponent

  t0 = time.time()
  y = mod_exp(g, x, p)
  t1 = time.time()
  print(f"Fast exp: {g}^{x} ≡ {y} mod {p} took {t1-t0:.6f} seconds")

  t2 = time.time()
  recovered_x = brute_force_discrete_log(g, y, p)
  t3 = time.time()
  print(f"Brute force discrete log: found x = {recovered_x} took {t3-t2:.6f} seconds")
