name: Markov链（离散/连续） - 发生学溯源：如果为了预测明天天气必须回溯到宇宙大爆炸的所有数据，计算将瘫痪。马尔可夫提出：只要知道“今天”，过去对于预测“明天”毫无用处。 (n_549)
sub_topics:
  - 计算复杂度的历史限制与状态抽象
  - 动力系统记忆的衰减假设
  - 状态转移矩阵的建立
  - 物理直觉：因果律的局部化，信息在当前状态的高度浓缩
llm_physical_mapping: Water cascading through interconnected pools, where the amount of water flowing out depends only on the current water level in the pool, oblivious to past inflows.
code_implementation: |
  import torch

  # Markov Chain: Water flowing through interconnected pools
  # Pools 0 and 1
  # transition_matrix[i, j] = fraction of water from pool i flowing to j
  transition_matrix = torch.tensor([
      [0.8, 0.2],
      [0.4, 0.6]
  ])
  water_volumes = torch.tensor([100.0, 0.0]) # Initial water in pools

  for _ in range(10):
      # Flow only depends on current volume, not history
      water_volumes = torch.matmul(water_volumes, transition_matrix)

  # Total water is conserved
  assert torch.allclose(water_volumes.sum(), torch.tensor(100.0))
v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy as sp
    p = sp.Symbol('p')
    P = sp.Matrix([[1-p, p], [p, 1-p]])
    P2 = P * P
    assert sp.simplify(P2[0,0] + P2[0,1]) == 1, "Probability conservation failed"
