  sympy_pseudo_code: |
    import cmath
    import math

    def evaluate(coeffs, s):
        return sum(v * cmath.exp(-s * math.log(n)) for n, v in coeffs.items())

    def convolve(left, right):
        out = {}
        for m, a_m in left.items():
            for n, b_n in right.items():
                out[m*n] = out.get(m*n, 0j) + a_m*b_n
        return out

    a = {1: 1+0j, 2: 2-1j, 5: -0.5+0.25j}
    b = {1: 1+0j, 3: -1+2j}
    s = 1.25+0.75j
    assert abs(evaluate(a, s) * evaluate(b, s) - evaluate(convolve(a, b), s)) < 1e-12

