mode_a_intuition:
  occurrence_crisis: |-
    An arithmetic coefficient list is discrete, but analytic number theory
    needs one object that can be examined as the complex parameter s moves.
  primary: |-
    Imagine a shelf of numbered bins. Bin n carries coefficient a_n, and a
    dial marked s applies the precisely declared weight n^{-s}. Adding the
    weighted bin contents produces F(s). Multiplying two finite shelves makes
    every index pair (m,n) land in bin mn, which is exactly why Dirichlet
    convolution appears.
  low_friction_example: |-
    With finite supports {1,2} and {1,3}, multiplying the two Dirichlet
    polynomials groups pair-products by the integer index mn.
  limitations:
    - "The bins are an intuition for indexed coefficients, not a proof of convergence."
    - "The dial is not a Fourier frequency or an ordinary power-spectrum control."
    - "A finite shelf cannot establish an infinite half-plane theorem."

