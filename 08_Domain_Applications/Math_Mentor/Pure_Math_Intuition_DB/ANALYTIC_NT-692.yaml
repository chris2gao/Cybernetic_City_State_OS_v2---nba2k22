code_implementation: |
  import cmath
  import math

  def dirichlet_polynomial(coefficients, s):
      return sum(value * cmath.exp(-s * math.log(index)) for index, value in coefficients.items())

  def dirichlet_convolution(left, right):
      result = {}
      for m, a_m in left.items():
          for n, b_n in right.items():
              result[m * n] = result.get(m * n, 0j) + a_m * b_n
      return result

