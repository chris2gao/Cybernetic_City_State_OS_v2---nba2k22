pure_math_definition:
  english: |-
    A Dirichlet series is a series F(s)=sum_{n=1}^infinity a_n n^{-s},
    where a_n is complex and s=sigma+it is complex. Its abscissa of
    convergence sigma_c is an extended real number such that the series
    converges for Re(s)>sigma_c and diverges for Re(s)<sigma_c; behavior on
    the boundary is not determined by that statement. The abscissa of
    absolute convergence sigma_a is defined analogously using
    sum |a_n n^{-s}|. Inside the open half-plane of convergence the sum is
    locally uniform on compact subsets and hence holomorphic.

    If F(s)=sum a_n n^{-s} and G(s)=sum b_n n^{-s} converge absolutely in a
    common half-plane, then F(s)G(s)=sum (a*b)(n)n^{-s}, where
    (a*b)(n)=sum_{d|n} a_d b_{n/d}. An Euler product additionally requires
    multiplicative coefficient structure, normalization such as a_1=1, and
    appropriate convergence; it is not a property of every Dirichlet series.
  chinese: |-
    Dirichlet 级数是 F(s)=sum_{n>=1} a_n n^{-s}，其中 a_n 为复系数，
    s=sigma+it 为复变量。收敛横坐标 sigma_c 是扩展实数，使级数在
    Re(s)>sigma_c 时收敛、在 Re(s)<sigma_c 时发散；该陈述不决定边界线
    Re(s)=sigma_c 上的行为。绝对收敛横坐标 sigma_a 用
    sum |a_n n^{-s}| 的收敛性类似定义。在开收敛半平面内部，级数在紧子集
    上局部一致收敛，因而其和为全纯函数。

    若 F 与 G 在共同半平面内绝对收敛，则乘积系数按 Dirichlet 卷积
    (a*b)(n)=sum_{d|n} a_d b_{n/d} 组合。Euler 乘积还要求系数具有乘法性、
    通常满足 a_1=1，并具备适当收敛条件；并非每条 Dirichlet 级数都有
    Euler 乘积。
  finite_support_boundary: |-
    For finite supports, the product/convolution identity is finite algebra
    and requires no infinite-series rearrangement. That finite identity is the
    only claim exercised by the durable audit.

assumptions_and_notation:
  - "n ranges over positive integers and n^{-s}=exp(-s log n) uses the real logarithm log n."
  - "sigma=Re(s); sigma_c and sigma_a may take extended-real values."
  - "Ordinary, absolute, and locally uniform convergence are distinct notions."
  - "The infinite product formula is asserted only in a common absolute-convergence region."
  - "Multiplicative means a(mn)=a(m)a(n) for gcd(m,n)=1; complete multiplicativity is stronger and is not assumed by default."

