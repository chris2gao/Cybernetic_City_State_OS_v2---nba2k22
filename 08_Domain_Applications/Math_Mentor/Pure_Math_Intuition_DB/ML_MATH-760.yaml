code_implementation: |
  import torch
  
  def compute_fisher_information_diag(log_probs):
      # Approximating diagonal Fisher Information as mechanical tension on parameters
      gradients = torch.autograd.grad(log_probs.sum(), log_probs, create_graph=True)[0]
      fisher_diag = gradients ** 2
      return fisher_diag
v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy as sp
    p_sym = sp.Symbol('p', positive=True)
    log_p = sp.log(p_sym)
    # Fisher information component (first derivative squared)
    score_func = sp.diff(log_p, p_sym)
    fisher_info = score_func**2
    assert fisher_info == 1/(p_sym**2)
