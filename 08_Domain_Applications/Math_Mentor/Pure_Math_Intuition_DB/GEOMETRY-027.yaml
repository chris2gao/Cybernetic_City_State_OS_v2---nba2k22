  title: "直线与角（平行线/垂线/角的性质） - 相交线与对顶角相等定理的逻辑推导（利用平角 180° 的过渡） (n_147)"
  sub_topics:
    - "邻补角的定义及其和为 180° 的性质"
    - "对顶角的空间几何定义"
    - "对顶角相等定理的代数推导过程"
    - "两条直线相交形成的角的数量关系"
  llm_physical_mapping: "Imagine crossing two straight sticks (chopsticks) to form an 'X'. If you measure the angles on opposite sides of the intersection, they are exactly the same. The adjacent angles always add up to a straight line (180 degrees)."
  code_implementation: |
    import torch

    def test_vertical_angles(a: float):
        # Two lines intersecting form angles a, b, c, d
        # a and b are supplementary
        b = 180.0 - a
        # b and c are supplementary
        c = 180.0 - b
        
        # Assert logic: a must equal c
        assert torch.isclose(torch.tensor(a), torch.tensor(c)), "Vertical angles must be equal!"
        return c
  v8_sanity_audit:
    sympy_pseudo_code: |
      import sympy as sp
      
      a, b, c = sp.symbols('a b c')
      eq1 = sp.Eq(a + b, 180)
      eq2 = sp.Eq(b + c, 180)
      
      solution = sp.solve((eq1, eq2), (b, c))
      proof = sp.simplify(solution[c] - a) == 0
      assert proof == True
