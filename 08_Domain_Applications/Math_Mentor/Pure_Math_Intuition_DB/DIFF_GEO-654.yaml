  本文件是 DIFF_GEO-653 的隔离历史别名；光滑流形、坐标图、相容转移映射与光滑
  图册的规范教学节点是 DIFF_GEO-653。DIFF_GEO-654 不定义第二个数学概念，不得
  作为独立先修节点、bridge 端点或 Coordinator 教学目标。保留本文件只用于身份
  定位，并提醒读者：内存寻址算术不能替代流形公理。
canonical_definition_summary: >-
  The canonical target defines a smooth n-manifold as a second-countable
  Hausdorff topological space equipped with a maximal smooth atlas whose chart
  maps are homeomorphisms onto open subsets of R^n and whose overlap transition
  maps are smooth. This summary is a locator, not an independent definition.
canonical_definition_summary_zh: >-
  规范目标把光滑 n 维流形定义为带最大光滑图册的第二可数 Hausdorff 拓扑空间：
  坐标图把开集同胚到 R^n 的开子集，重叠区域上的坐标转换必须光滑。此处只作定位
  摘要，不构成独立定义。
