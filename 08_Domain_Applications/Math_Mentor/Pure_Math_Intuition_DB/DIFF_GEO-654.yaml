disposition_statement: >-
  This file is a quarantined historical alias for DIFF_GEO-653, which is the
  canonical teaching node for smooth manifolds, charts, compatible transition
  maps, and smooth atlases. DIFF_GEO-654 does not define a second mathematical
  concept, must not be used as an independent prerequisite, and must not be a
  bridge endpoint or Coordinator teaching target. It is retained only as an
  identity locator and as a warning that memory-address arithmetic is not a
  substitute for manifold axioms.
