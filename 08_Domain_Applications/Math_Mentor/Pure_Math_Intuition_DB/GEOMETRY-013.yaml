concept_node:
  id: "GEOMETRY-013"
  name: "圆与多边形 - 垂径定理（对称性应用）与切线的性质（垂直于半径）"
  domain: "Math_Mentor"
  sub_topics:
    - "垂径定理及其逆定理：垂直于弦的直径平分弦及弧"
    - "切线的判定定理：经过半径外端且垂直于该半径"
    - "切线的性质定理：圆的切线垂直于过切点的半径"
    - "切线长定理：过圆外一点引圆的两条切线长相等"
  llm_physical_mapping: "Think of a wheel and a flat road. The road is tangent to the wheel. The line connecting the center of the wheel (axle) to the point touching the road is the radius. If you park the wheel on a flat road, the axle points straight down, perfectly perpendicular to the ground. For chords, think of cutting a log straight down the middle; a perfectly perpendicular saw cut through the center splits both the top surface and the wood inside exactly in half."
  code_implementation: >
    import torch
    
    def check_orthogonality(radius_vector, tangent_vector):
        """
        PyTorch implementation to check orthogonality using dot products.
        In geometry, a tangent line is perpendicular to the radius at the point of tangency.
        """
        dot_product = torch.dot(radius_vector, tangent_vector)
        is_orthogonal = torch.abs(dot_product) < 1e-6
        return is_orthogonal.item()

    # Example vectors
    r = torch.tensor([1.0, 1.0])
    t = torch.tensor([-1.0, 1.0])
    print(f"Are vectors orthogonal? {check_orthogonality(r, t)}")
  v8_sanity_audit:
    sympy_pseudo_code: >
      from sympy.geometry import Point, Circle, Line
      
      # Define a circle centered at origin with radius 5
      c = Circle(Point(0, 0), 5)
      
      # Point on the circle
      p = Point(3, 4)
      
      # Find tangent line at point p
      tangent = c.tangent_lines(p)[0]
      
      # Define the line representing the radius
      radius_line = Line(c.center, p)
      
      # Verify that tangent is perpendicular to the radius
      assert tangent.is_perpendicular(radius_line) == True
