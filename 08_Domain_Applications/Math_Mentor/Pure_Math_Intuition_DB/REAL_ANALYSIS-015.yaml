id: "REAL_ANALYSIS-015"
title: "Series Convergence via GRPO Relative Advantages"
sub_topics:
  - "Infinite Series"
  - "Group Relative Policy Optimization (GRPO)"
  - "Advantage Normalization"
llm_physical_mapping:
  - "Series of thought tokens in DeepSeek-R1-Zero accumulate rewards mapping to series convergence."
  - "GRPO computes the average score baseline of sampled group series to normalize relative advantage ($A_i$)."
  - "The sequence of clipped advantage updates drives the continuous evolution of System-2 reasoning."
code_implementation: |
  import torch

  def grpo_advantage(rewards):
      # Standardizing rewards across the sampled group series
      mean_r = rewards.mean()
      std_r = rewards.std() + 1e-8
      advantages = (rewards - mean_r) / std_r
      return advantages
v8_sanity_audit:
  sympy_pseudo_code: |
    import torch
    
    rewards = torch.tensor([1.0, 0.0, 1.0, -1.0, 0.5])
    mean_r = rewards.mean()
    std_r = rewards.std() + 1e-8
    
    adv = (rewards - mean_r) / std_r
    
    assert torch.abs(adv.mean()) < 1e-6
    assert torch.abs(adv.std(unbiased=False) - 1.0) < 1e-4
