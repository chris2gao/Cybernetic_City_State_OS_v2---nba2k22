v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy as sp
    x, x0, x1, y0, y1 = sp.symbols('x x0 x1 y0 y1')
    L0 = (x - x1)/(x0 - x1)
    L1 = (x - x0)/(x1 - x0)
    interpolation = sp.simplify(y0*L0 + y1*L1)
    assert sp.simplify(interpolation.subs(x, x0)) == y0
