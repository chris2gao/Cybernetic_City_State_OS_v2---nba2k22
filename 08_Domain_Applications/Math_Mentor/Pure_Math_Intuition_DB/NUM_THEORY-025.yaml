llm_physical_mapping: |
  Mundane physical metaphor: Imagine a room full of left shoes and right shoes. Every left shoe can be matched perfectly with a specific right shoe to form a pair, and they naturally cancel each other out in terms of occupying unique space (aa⁻¹ ≡ 1). However, there are exactly two unique items in the room that act as both left and right shoes simultaneously, pairing only with themselves (1 and p-1). When you pair up everything, all the normal shoes form pairs and disappear into a value of 1, leaving only the two special self-pairing shoes behind.
code_implementation: |
  import torch

  def wilson_theorem_pairing(p):
      """
      Demonstrate Wilson's Theorem pairing step using PyTorch for a prime p.
      """
      if p < 3: return None
      
      elements = torch.arange(2, p - 1)
      paired = torch.zeros_like(elements, dtype=torch.bool)
      pairs = []
      
      for i in range(len(elements)):
          if paired[i]: continue
          a = elements[i].item()
          for j in range(len(elements)):
              if not paired[j]:
                  b = elements[j].item()
                  if (a * b) % p == 1:
                      pairs.append((a, b))
                      paired[i] = True
                      paired[j] = True
                      break
                      
      mid_product = 1
      for pair in pairs:
          mid_product = (mid_product * pair[0] * pair[1]) % p
          
      total_product = (1 * mid_product * (p - 1)) % p
      return pairs, mid_product, total_product
v8_sanity_audit:
  sympy_pseudo_code: |
    from sympy import mod_inverse
    
    def test_wilsons_theorem(p):
        if p <= 2:
            return
            
        elements = list(range(2, p - 1))
        seen = set()
        product = 1
        
        for a in elements:
            if a in seen:
                continue
            inv_a = mod_inverse(a, p)
            seen.add(a)
            seen.add(inv_a)
            if (a * inv_a) % p != 1:
                raise ValueError("Inverse pair product not 1")
            product = (product * a * inv_a) % p
            
        if product != 1:
            raise ValueError("Mid product not 1")
        
        total_product = (1 * product * (p - 1)) % p
        if total_product != p - 1:
            raise ValueError("Total product not p-1")

    test_wilsons_theorem(7)
    test_wilsons_theorem(11)
