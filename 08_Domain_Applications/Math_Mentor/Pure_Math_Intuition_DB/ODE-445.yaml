concept_name: "级数解法 - 在无法求出初等函数解时，利用无限长泰勒级数硬性逼近真实轨迹 (n_445)"
sub_topics:
  - "幂级数代入法与系数递推关系"
  - "收敛域的判定与逼近精度评估"
  - "特殊函数（如贝塞尔函数、勒让德多项式）的级数源头"
  - "处理变系数方程的万能机器"
llm_physical_mapping: "Imagine trying to replicate a complex, organic curve of a wooden boat hull but you only have small, straight Lego bricks. You can't mold a perfect continuous sheet (no elementary function exists). So you bolt together an infinite series of smaller and smaller straight wooden blocks. The 'recurrence relation' is the factory manual telling you exactly how much shorter each subsequent block needs to be to make the curve smooth."
code_implementation: |
  import sympy as sp
  t = sp.Symbol('t')
  c0, c1, c2, c3 = sp.symbols('c0 c1 c2 c3')
  y_approx = c0 + c1*t + c2*t**2 + c3*t**3
  ode_residual = y_approx.diff(t) - y_approx
v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy as sp
    t = sp.Symbol('t')
    c0, c1, c2 = sp.symbols('c0 c1 c2')
    y_approx = c0 + c1*t + c2*t**2
    deriv = y_approx.diff(t)
    assert deriv == c1 + 2*c2*t
