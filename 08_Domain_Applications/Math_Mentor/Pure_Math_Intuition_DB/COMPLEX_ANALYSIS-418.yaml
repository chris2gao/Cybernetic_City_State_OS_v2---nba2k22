id: "COMPLEX_ANALYSIS-418"
domain: "complex_analysis"
mode: "A"
concept_name: "复数与复平面 - 欧拉公式 (e^iθ = cosθ + i sinθ) 与复平面的极坐标表示 (n_418)"
sub_topics:
  - "指数函数在复域的泰勒展开定义"
  - "极径 r 与辐角 θ 的物理意义"
  - "棣莫弗公式 (De Moivre's Theorem)"
  - "复数乘法的“模相乘、角相加”直觉"
formal_definition: |-
  复指数由绝对收敛级数 exp(z)=sum_{n=0}^infinity z^n/n! 定义。对实数 theta，
  将偶次项与奇次项分组得到 Euler 公式 exp(i*theta)=cos(theta)+i*sin(theta)。
  每个非零复数 z 都可写成 z=r*exp(i*theta)，其中 r=|z|>0，theta 只在模 2*pi
  意义下唯一。由指数加法律可得复数乘法满足模相乘、辐角相加；De Moivre 公式
  (cos(theta)+i*sin(theta))^n=cos(n*theta)+i*sin(n*theta) 是其整数幂特例。
prerequisite_nodes:
  - "n_280"
  - "n_417"
llm_physical_mapping: |-
  把 exp(i*theta) 看成单位圆上的匀速旋转指针：cos(theta) 与 sin(theta) 是指针
  在两条正交坐标轴上的投影，乘以正数 r 只改变指针长度。两个复数相乘时，长度
  相乘而旋转角相加，这对应 exp(i*alpha)exp(i*beta)=exp(i*(alpha+beta))。
mapping_boundary: |-
  旋转指针只解释极坐标、周期性和乘法的几何直觉；它不替代复指数级数的收敛定义，
  也不能单独证明 Euler 公式、辐角的多值性或复解析性质。
code_implementation: |
  import sympy as sp
  theta = sp.Symbol('theta', real=True)
  euler_form = sp.exp(sp.I * theta)
  trig_form = sp.cos(theta) + sp.I * sp.sin(theta)
  polar_z = 3 * euler_form
v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy as sp
    theta, alpha, beta = sp.symbols('theta alpha beta', real=True)
    euler_form = sp.exp(sp.I * theta)
    trig_form = sp.cos(theta) + sp.I * sp.sin(theta)
    assert sp.simplify(euler_form - trig_form) == 0
    assert sp.simplify(
        sp.exp(sp.I * (theta + 2 * sp.pi)) - sp.exp(sp.I * theta)
    ) == 0
    assert sp.simplify(
        sp.exp(sp.I * alpha) * sp.exp(sp.I * beta)
        - sp.exp(sp.I * (alpha + beta))
    ) == 0

    polar_z = 3 * sp.exp(sp.I * theta)
    assert sp.simplify(
        sp.expand_complex(polar_z * sp.conjugate(polar_z)) - 9
    ) == 0

    de_moivre_lhs = sp.expand((sp.cos(theta) + sp.I * sp.sin(theta))**5)
    de_moivre_rhs = sp.cos(5 * theta) + sp.I * sp.sin(5 * theta)
    assert sp.simplify(
        sp.expand_trig(de_moivre_rhs) - de_moivre_lhs
    ) == 0
