id: "PROB_STAT-372"
concept_name: "非参数统计方法初步 - 不依赖特定分布假设的统计推断 (n_372)"
sub_topics:
  - "秩和检验 (Wilcoxon Rank-Sum Test)"
  - "符号检验与中位数检验"
  - "经验分布函数及其性质"
  - "核密度估计 (KDE) 的基本思想"
llm_physical_mapping: "Imagine counting weighted dice without assuming they are 6-sided. Instead of fitting a perfect bell curve, you just stack chips wherever they land, smoothing them out with a tiny brush (KDE) to form a rough, empirical bullet hole map."
code_implementation: |
  import sympy as sp
  x, x_i, h = sp.symbols('x x_i h', real=True, positive=True)
  # Gaussian Kernel component
  kernel = (1 / sp.sqrt(2 * sp.pi)) * sp.exp(-((x - x_i) / h)**2 / 2)
  kde_estimate = (1 / h) * kernel
v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy as sp
    x, x_i, h = sp.symbols('x x_i h', real=True, positive=True)
    kernel = (1 / sp.sqrt(2 * sp.pi)) * sp.exp(-((x - x_i) / h)**2 / 2)
    kde = (1 / h) * kernel
    integral_val = sp.integrate(kde, (x, -sp.oo, sp.oo))
    assert sp.simplify(integral_val) == 1
