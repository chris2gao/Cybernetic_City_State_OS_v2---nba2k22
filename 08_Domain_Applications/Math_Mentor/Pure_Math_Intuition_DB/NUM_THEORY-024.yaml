id: "NUM_THEORY-024"
name: "威尔逊定理 - 定理内容：(p-1)! ≡ -1 (mod p) 当且仅当 p 为素数 (n_218)"
sub_topics:
  - "阶乘在模下的特殊行为"
  - "素性测试的另一种确定性方法"
  - "定理的逆命题成立性"
  - "数论史上的经典结论"
llm_physical_mapping: "mundane physical metaphor (balancing a scale where exactly one specific configuration tips it into -1 when the objects are prime)."
code_implementation: |
  import torch
  import math
  
  def wilson_theorem_check(p: int) -> torch.Tensor:
      """PyTorch factorial modulo check for Wilson's Theorem."""
      if p < 2:
          return torch.tensor(False)
      fact = math.factorial(p - 1)
      return torch.tensor(((fact + 1) % p) == 0)
v8_sanity_audit:
  sympy_pseudo_code: |
