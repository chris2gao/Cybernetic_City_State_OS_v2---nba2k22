    import sympy as sp
    from sympy.geometry import Circle, Point, Line
    
    x = sp.Symbol('x')
    eq = sp.Eq(sp.sin(x), sp.S(1)/2)
    sols = sp.solve(eq, x)
    
    c = Circle(Point(0, 0), 1)
    l = Line(Point(-5, sp.S(1)/2), Point(5, sp.S(1)/2))
    points = c.intersection(l)
    
    assert len(points) == 2
    for p in points:
        assert sp.simplify(p.y - sp.S(1)/2) == 0
