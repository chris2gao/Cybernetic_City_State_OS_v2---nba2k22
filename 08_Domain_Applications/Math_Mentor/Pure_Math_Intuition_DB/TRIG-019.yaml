llm_physical_mapping: "Intersecting a horizontal laser line across a Ferris wheel to find heights."
code_implementation: |
  import torch

  theta = torch.linspace(0, 4 * torch.pi, 1000)
  y = torch.sin(theta)
  target = 0.5
  
  intersections = []
  for i in range(len(theta) - 1):
      if (y[i] - target) * (y[i+1] - target) <= 0:
          intersections.append(theta[i])
  intersections = torch.tensor(intersections)

  # sin(theta)=0.5 has two solutions per 2*pi period, hence four on [0, 4*pi].
  assert len(intersections) == 4
  residual = torch.abs(torch.sin(intersections) - target)
  assert torch.max(residual) < 0.01
