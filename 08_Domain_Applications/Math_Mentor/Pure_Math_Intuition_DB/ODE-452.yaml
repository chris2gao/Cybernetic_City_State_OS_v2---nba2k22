llm_physical_mapping: "mundane physical metaphor: Think of thousands of leaves floating down a river toward a specific drain. The river's currents are the vector fields (Flow Matching). If the river is stable, even if a gust of wind (noise) blows a leaf slightly off course, the converging currents will naturally push it back into the main channel, guaranteeing all leaves eventually reach the drain (target distribution)."
code_implementation: |
  import sympy as sp
  
  x = sp.Symbol('x')
  # Simplified 1D flow matching vector field v(x) driving x towards 0
  v_x = -x**3 
  
  # Checking stability criteria (divergence of the flow)
  div_v = sp.diff(v_x, x)
v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy as sp
    
    x = sp.Symbol('x', real=True)
    v_x = -x
    
    # In 1D, convergence means dv/dx < 0 (acting like a restoring force)
    dvdx = sp.diff(v_x, x)
    assert dvdx < 0
