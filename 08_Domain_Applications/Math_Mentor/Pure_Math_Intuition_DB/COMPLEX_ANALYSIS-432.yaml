    import sympy as sp
    x, y = sp.symbols('x y', real=True)
    u = x**2 - y**2
    v = 2*x*y
    mod_sq = u**2 + v**2
    laplacian = sp.diff(mod_sq, x, 2) + sp.diff(mod_sq, y, 2)
