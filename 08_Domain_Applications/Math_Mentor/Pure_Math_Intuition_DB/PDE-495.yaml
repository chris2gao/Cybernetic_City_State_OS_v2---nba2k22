name: "Green函数方法 - 发生学溯源：点脉冲响应的积分叠加，卷积注意力机制的连续空间祖先 (n_495)"
sub_topics:
  - "基本解（Fundamental Solution）的概念"
  - "点源响应产生的全局场分布"
  - "叠加原理推导非齐次项下的解"
  - "物理直觉：系统的冲击响应函数映射"
llm_physical_mapping: "Dropping a single pebble into a perfectly calm pond. The single pebble generates a distinct ring of outward ripples (the fundamental solution). A heavy rainstorm is just millions of pebbles dropped at different times and locations. By knowing the pattern of one pebble, we can integrate (sum up) the overlapping ripples to predict the chaotic water surface."
code_implementation: |
  import torch

  def apply_greens_function(source_field):
      n = source_field.shape[0]
      x = torch.arange(n).float()
      
      X_i, X_j = torch.meshgrid(x, x, indexing='ij')
      G = -0.5 * torch.abs(X_i - X_j)
      
      response = torch.matmul(G, source_field)
      return response
v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy as sp

    x, y = sp.symbols('x y', real=True)
    
    G_right = -0.5 * (x - y)
    G_left = -0.5 * (y - x)
    
    d2G_right = sp.diff(G_right, x, 2)
    d2G_left = sp.diff(G_left, x, 2)
    
    assert sp.simplify(d2G_right) == 0, "Second derivative of Green's function away from source is zero"
    assert sp.simplify(d2G_left) == 0, "Second derivative of Green's function away from source is zero"
    
    jump = sp.diff(G_right, x).subs(x, y) - sp.diff(G_left, x).subs(x, y)
    assert sp.simplify(jump + 1) == 0, "Derivative jump must be -1 to satisfy -u'' = delta"
