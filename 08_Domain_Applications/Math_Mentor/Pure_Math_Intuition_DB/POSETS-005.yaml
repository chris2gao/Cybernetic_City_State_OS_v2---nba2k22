  name: "格的定义与代数性质"
  domain: "posets_and_lattices"
  sub_topics:
    - "格的偏序定义（上确界与下确界）"
    - "格的代数系统定义（算子 ∧ 与 ∨）"
    - "格的运算性质（交换律、结合律、吸收律、幂等律）"
    - "对偶原理"
    - "子格的概念"
  llm_physical_mapping: "Think of a lattice as a system of interlocking, flexible building blocks with two key operations: 'merging' to find the smallest container that holds both (Join / ∨), and 'extracting' to find the largest common building block they share (Meet / ∧). You can define it either from the bottom-up perspective of stacking blocks (poset definition with sup/inf), or top-down as a machine with two symmetric levers (algebraic system with ∧ and ∨ satisfying absorption laws). The duality principle is like looking at the structure upside down: every valid shape still forms a valid shape, just with 'containment' inverted."
  code_implementation: |
    import torch

    def lattice_meet_join(A, B):
        # A and B are sets represented as boolean tensors (indicator vectors)
        # In a boolean lattice (powerset), Meet is intersection (bitwise AND), Join is union (bitwise OR)
        meet = torch.logical_and(A, B)
        join = torch.logical_or(A, B)
        return meet, join

    def verify_absorption_law(A, B):
        meet, join = lattice_meet_join(A, B)
        # a ∨ (a ∧ b) = a
        absorption_1 = torch.equal(torch.logical_or(A, meet), A)
        # a ∧ (a ∨ b) = a
        absorption_2 = torch.equal(torch.logical_and(A, join), A)
        return absorption_1 and absorption_2
  v8_sanity_audit:
    sympy_pseudo_code: |
      from sympy.logic.boolalg import And, Or
      from sympy.abc import A, B

      # SymPy boolean logic provides a natural model for a distributive lattice
      meet_expr = And(A, B)
      join_expr = Or(A, B)

      # Absorption laws
      # A | (A & B) == A
      abs_1 = Or(A, And(A, B)).simplify()
      
      # A & (A | B) == A
      abs_2 = And(A, Or(A, B)).simplify()
      
      # Idempotency
      idemp_1 = And(A, A).simplify()
      idemp_2 = Or(A, A).simplify()
