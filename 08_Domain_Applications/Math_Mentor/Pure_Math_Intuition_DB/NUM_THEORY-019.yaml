  symbol: "\\gcd(a, b) = ax + by"
  name: "欧几里得算法（辗转相除法） - 利用欧几里得算法反向推导裴蜀定理 (Bézout's identity)：存在整数 x, y 使得 ax + by = gcd(a,b) (n_213)"
  domain: "Number Theory"

  sub_topics:
    - "扩展欧几里得算法 (EXGCD)"
    - "递归项的代数回代过程"
    - "特解 (x, y) 的求解算法"
    - "线性组合表示最大公约数"

  pure_math_definition:
    description: "The Extended Euclidean Algorithm not only computes the greatest common divisor of integers a and b, but also finds integers x and y (Bézout coefficients) such that ax + by = gcd(a,b)."
    axioms:
      - "\\forall a, b \\in \\mathbb{Z}, \\exists x, y \\in \\mathbb{Z} \\text{ s.t. } ax + by = \\gcd(a, b)"

  llm_physical_mapping:
    architecture_component: "State Tracking & Backtracking"
    cognitive_intuition: "Mundane physical metaphor: measuring exactly gcd liters using two jugs of capacity a and b."
    tensor_shape_flow: "(a, b) -> (gcd, x, y)"

  code_implementation:
    framework: "PyTorch"
    snippet: |
      import torch

      def exgcd_torch(a: torch.Tensor, b: torch.Tensor):
          if b.item() == 0:
              return a, torch.tensor(1), torch.tensor(0)
          g, x1, y1 = exgcd_torch(b, a % b)
          x = y1
          y = x1 - (a // b) * y1
          return g, x, y

  v8_sanity_audit:
    engine: "SymPy"
    validation_target: "Bézout's identity"
    execution_logic: "Use sympy.gcdex to compute Bézout coefficients and verify the linear combination equals the gcd."
    sympy_pseudo_code: |
      import sympy

      def test_bezout():
          a, b = 240, 46
          x, y, g = sympy.gcdex(a, b)
          if a * x + b * y == g:
              print(f"Verified Bezout's identity for a={a}, b={b}: {a}*({x}) + {b}*({y}) = {g}")

      test_bezout()
