id: "BRIDGE-006"
concept_name: "微积分与线代桥梁 - 雅可比矩阵作为非线性弯曲空间的局部线性降维逼近"
sub_topics:
  - "多元函数的局部线性化"
  - "雅可比矩阵与全微分的代数同构"
  - "坐标系变换的放大倍率"
llm_physical_mapping: "显微镜下的平坦网格。把你所在的非线性弯曲空间无限放大（微分），直到曲面看起来像一张平坦的斜网格。此时，这张平坦网格的“倾斜指令”，就是一个完美的线性代数矩阵（雅可比矩阵）。"
code_implementation: |
  import torch
  
  def f(x):
      return torch.stack([
          x[0]**2 + x[1],
          torch.sin(x[0]) * x[1]
      ])
  
  x = torch.tensor([1.0, 2.0], requires_grad=True)
  jacobian = torch.autograd.functional.jacobian(f, x)
  print("Jacobian matrix:\n", jacobian)
v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy as sp
    
    x, y = sp.symbols('x y')
    f1 = x**2 + y
    f2 = sp.sin(x) * y
    
    F = sp.Matrix([f1, f2])
    X = sp.Matrix([x, y])
    
    J_auto = F.jacobian(X)
    
    J_manual = sp.Matrix([
        [sp.diff(f1, x), sp.diff(f1, y)],
        [sp.diff(f2, x), sp.diff(f2, y)]
    ])
    
    if not J_auto.equals(J_manual):
        raise ValueError("Jacobian calculation mismatch!")
    
    print("Jacobian verification passed. Matrix:", J_auto)
