concept_name: "线性变换的矩阵表示与基变换 - 相似矩阵 (A = P⁻¹BP)：同一个物理变换在不同观察者（基系）眼中的投影 (n_336)"
sub_topics:
  - "相似变换的代数定义与性质"
  - "相似矩阵具有相同的特征值、迹与行列式"
  - "物理本质：变换算子本身不变，仅表现形式随基而变"
  - "在对角化过程中的核心作用"
llm_physical_mapping: "spatial deformation/stretching/rotating observed from different perspectives. A physical deformation occurs in space (stretching and rotating). One observer uses the standard grid to measure it, while another observer uses a skewed grid. Both observers see the exact same physical stretching and rotating of space, but their numerical measurements (the matrices) look different. The transition matrix P acts as a dictionary translating the measurements between the two observers."
code_implementation: |
  import sympy as sp
  P = sp.Matrix([[1, 2], [3, 4]])
  A = sp.Matrix([[5, 0], [0, 6]])
  B = P * A * P.inv()
  # A and B are similar matrices
v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy as sp
    P = sp.Matrix([[1, 2], [3, 4]])
    A = sp.Matrix([[5, 0], [0, 6]])
    B = P * A * P.inv()
    assert A.det() == B.det()
    assert A.trace() == B.trace()
