concept_node:
  id: SET_THEORY-002
  symbol: A \cup B, A \cap B, A \setminus B
  name: Core Set Operations (交、并、差、补)
  domain: Set Theory (集合论)
  sub_topics:
  - 并集与交集的定义
  - 相对补集 (差集)
  - 绝对补集与全集
  - 对称差的定义与运算
  pure_math_definition:
    description: 'Fundamental operations to combine sets:  Union (A cup B) contains
      elements in A or B.  Intersection (A cap B) contains elements in both.  Difference
      (A \ B) contains elements in A but not B.

      '
    axioms:
    - x in A U B iff x in A or x in B
    - x in A n B iff x in A and x in B
  llm_physical_mapping:
    tensor_shape_flow: Boolean set operations translated to 1D Tensor operations using
      unique elements and masking.
    cognitive_intuition: 'Merging two bags of items (Union), finding the exact duplicate
      items in both bags (Intersection), and taking items from bag A after throwing
      away anything that is also in bag B (Difference).

      '
  code_implementation:
    snippet: 'import torch

      import numpy as np


      A = torch.tensor([1, 2, 3])

      B = torch.tensor([3, 4, 5])


      # Union

      union = torch.tensor(np.union1d(A.numpy(), B.numpy()))


      # Intersection

      intersection = torch.tensor(np.intersect1d(A.numpy(), B.numpy()))


      # Difference (A \ B)

      difference = torch.tensor(np.setdiff1d(A.numpy(), B.numpy()))

      '
  v8_sanity_audit:
    sympy_pseudo_code: 'import sympy as sp

      from sympy import FiniteSet


      A = FiniteSet(1, 2, 3)

      B = FiniteSet(3, 4, 5)


      assert A.union(B) == FiniteSet(1, 2, 3, 4, 5)

      assert A.intersect(B) == FiniteSet(3)

      assert A - B == FiniteSet(1, 2)

      '
