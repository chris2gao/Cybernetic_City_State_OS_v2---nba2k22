concept_node:
  id: "GEOMETRY-041"
  name: "立体几何基础与尺规作图基础"
  description: "立体几何基础（棱柱/棱锥/球体），尺规作图基础 - 四大基本作图法及其全等三角形证明（作等线段/角、垂线、角平分线）"
  sub_topics:
    - "常见几何体的基本定义与性质"
    - "作一个角等于已知角及其证明"
    - "线段垂直平分线的尺规作图及其证明"
    - "角平分线的尺规作图及其证明"
    - "过一点作已知直线的垂线及其证明"
  llm_physical_mapping:
    metaphor: "Constructing scaffolding and sweeping a tethered pole"
    description: "Solid geometry is like recognizing the shapes of everyday objects like boxes (prisms), pyramids (tents), and balls (spheres). Compass and straightedge construction is like using a rigid pole or a taut string tethered to a stake in the ground to sweep out exact distances, and using a straight beam to connect points. Proving these constructions work relies on the rigidity of these physical linkages, essentially forming congruent triangles just as a rigid physical frame holds its exact shape."
  code_implementation:
    description: "PyTorch geometric modeling of compass sweeping lengths (distances)."
    code: |
      import torch

      def simulate_compass_sweep(center, radius, num_points=100):
          # Simulate sweeping a compass to draw a circle/arc
          angles = torch.linspace(0, 2 * torch.pi, num_points)
          x = center[0] + radius * torch.cos(angles)
          y = center[1] + radius * torch.sin(angles)
          return torch.stack((x, y), dim=1)

      def perpendicular_bisector_points(p1, p2):
          # To construct a perpendicular bisector, draw two intersecting circles
          # from p1 and p2 with the same radius r > dist(p1,p2)/2
          dist = torch.norm(p1 - p2)
          radius = dist * 0.75 # Ensure intersection
          circle1 = simulate_compass_sweep(p1, radius)
          circle2 = simulate_compass_sweep(p2, radius)
          
          # In a real construction, we'd find the intersection points analytically
          # Here we just conceptually model the distance sweeps
          return circle1, circle2
          
      # Example points
      p_A = torch.tensor([0.0, 0.0])
      p_B = torch.tensor([4.0, 0.0])
      c1, c2 = perpendicular_bisector_points(p_A, p_B)
  v8_sanity_audit:
    sympy_pseudo_code: |
      import sympy as sp
      from sympy.geometry import Point, Line, Circle, Segment, intersection
      
      # 1. Perpendicular Bisector Construction
      p1 = Point(0, 0)
      p2 = Point(4, 0)
      seg = Segment(p1, p2)
      
      # Circles with same radius from p1 and p2
      c1 = Circle(p1, 3)
      c2 = Circle(p2, 3)
      intersections = intersection(c1, c2)
      
      # The line through intersections is the perpendicular bisector
      bisector_line = Line(intersections[0], intersections[1])
      
      # Verify it is perpendicular to the segment
      is_perp = bisector_line.is_perpendicular(Line(seg.p1, seg.p2))
      
      # Verify it passes through midpoint
      midpoint = seg.midpoint
      passes_through_mid = bisector_line.contains(midpoint)
      
      print(f"Perpendicular: {is_perp}, Bisects: {passes_through_mid}")
      
      # 2. Angle Bisector
      p_vertex = Point(0,0)
      ray1 = Line(p_vertex, Point(2, 0))
      ray2 = Line(p_vertex, Point(2, 2))
      
      # Sweep compass from vertex
      arc_c = Circle(p_vertex, 1)
      p_A = intersection(arc_c, ray1)[0]
      p_B = intersection(arc_c, ray2)[0]
      
      # Sweep from A and B
      c_A = Circle(p_A, 2)
      c_B = Circle(p_B, 2)
      p_C = intersection(c_A, c_B)[0] # Choose one intersection
      
      # Bisector line
      angle_bisector = Line(p_vertex, p_C)
