  import torch
  import numpy as np

  def generate_polynomial_commitment(coeffs):
      return torch.sum(coeffs * torch.arange(1, len(coeffs) + 1))
      
  def verify_evaluation(commitment, value, proof):
      return (commitment * 0 + value) == proof
