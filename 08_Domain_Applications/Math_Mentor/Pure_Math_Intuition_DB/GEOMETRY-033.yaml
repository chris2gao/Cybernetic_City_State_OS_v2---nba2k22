  name: "勾股定理及其逆定理 - 勾股数（毕达哥拉斯三元组）初步 (n_153)"
  sub_topics:
    - "勾股数的定义及其正整数特性"
    - "常见勾股数记忆（如3,4,5；5,12,13）"
    - "勾股数的齐次性（成倍扩大后仍为勾股数）"
    - "本原勾股数的概念与简单构造法"
  llm_physical_mapping: |
    Imagine assembling standardized square tiles into larger squares. You have two square arrays of tiles (e.g., 3x3=9 and 4x4=16). If you can combine all these tiles perfectly into a single new square array (5x5=25) without breaking any tiles, those side lengths (3, 4, 5) form a Pythagorean triple. The 'integer' requirement of Pythagorean triples corresponds to the physical constraint of using whole, indivisible tiles. Scaling up the triples (e.g., 6, 8, 10) is like replacing each single tile with a 2x2 block of tiles, preserving the overall square relationships.
  code_implementation: |
    import torch

    def generate_pythagorean_triples(m_tensor, n_tensor):
        """
        Generate Pythagorean triples using Euclid's formula.
        a = m^2 - n^2
        b = 2mn
        c = m^2 + n^2
        where m > n > 0.
        """
        a = m_tensor**2 - n_tensor**2
        b = 2 * m_tensor * n_tensor
        c = m_tensor**2 + n_tensor**2
        return torch.stack([a, b, c], dim=-1)

    # Example: m=2, n=1 -> (3, 4, 5)
    m = torch.tensor([2, 3, 4])
    n = torch.tensor([1, 2, 1])
    triples = generate_pythagorean_triples(m, n)
    print("Pythagorean triples (a, b, c):")
    print(triples)
  v8_sanity_audit:
    sympy_pseudo_code: |
      from sympy import symbols, simplify
      
      # Euclid's formula variables
      m, n = symbols('m n', integer=True, positive=True)
      
      # Define sides
      a = m**2 - n**2
      b = 2*m*n
      c = m**2 + n**2
      
      # Verify a^2 + b^2 = c^2
      lhs = a**2 + b**2
      rhs = c**2
      
      is_valid = simplify(lhs - rhs) == 0
      print(f"Is a^2 + b^2 = c^2 for Euclid's formula? {is_valid}")
