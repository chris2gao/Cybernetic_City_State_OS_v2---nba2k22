formal_definition: >-
  A symplectic manifold is a smooth manifold M equipped with a differential
  two-form omega that is closed, d omega=0, and nondegenerate: if
  omega_p(v,w)=0 for every w∈T_pM, then v=0. A symplectic manifold is
  necessarily even-dimensional. A diffeomorphism phi:M→M is a
  symplectomorphism when phi*omega=omega. Fix the convention
  i_{X_H}omega=dH. For a smooth Hamiltonian H, nondegeneracy uniquely
  determines the Hamiltonian vector field X_H. Its exact flow preserves omega
  and therefore preserves the Liouville volume form omega^n/n!. For an
  autonomous Hamiltonian, H is constant along its own exact flow. A numerical
  symplectic integrator preserves an appropriate discrete symplectic structure
  but generally does not preserve the original Hamiltonian energy exactly.
  Under additional regularity, step-size, and long-time hypotheses,
  backward-error analysis may explain bounded or near-conserved modified
  energy, not unconditional exact energy conservation. Symplectic preservation
  implies volume preservation, but a volume-preserving map need not be
  symplectic; energy conservation, volume preservation, and symplectic
  preservation are distinct properties.
formal_definition_zh: >-
  辛流形是带微分二形式 omega 的光滑流形 M，其中 omega 是闭的，即
  d omega=0，并且非退化：若对所有 w∈T_pM 都有 omega_p(v,w)=0，则 v=0。
  辛流形必为偶数维。微分同胚 phi:M→M 在 phi*omega=omega 时称为辛同胚。
  本节点固定约定 i_{X_H}omega=dH。对光滑 Hamiltonian H，非退化性唯一确定
  Hamiltonian 向量场 X_H；其精确流保持 omega，因而保持 Liouville 体积形式
  omega^n/n!。对自治 Hamiltonian，H 沿自身精确流保持常数。数值辛积分器保持
  适当的离散辛结构，但通常不精确保持原 Hamiltonian 能量。只有在附加正则性、
  步长与长时间假设下，后向误差分析才可能解释修正能量的有界或近似守恒，而不是
  无条件的精确能量守恒。辛保持蕴含体积保持，但体积保持映射未必辛；能量守恒、
  体积保持与辛保持是彼此不同的性质。
