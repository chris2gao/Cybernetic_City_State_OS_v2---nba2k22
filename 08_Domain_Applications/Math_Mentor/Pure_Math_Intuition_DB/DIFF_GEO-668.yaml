mapping_boundary:
  primary_mapping_kind: "llm_architecture_bounded_structural_analogy"
  primary_mapping: >-
    When a model or learned dynamical system is explicitly defined on
    phase-space variables with a chosen symplectic form, a symplectic
    architecture or integrator can enforce preservation of that structure.
    This may improve qualitative long-time behavior for Hamiltonian systems,
    but it does not guarantee exact energy conservation, universal stability,
    or correctness for arbitrary learned dynamics.
  primary_mapping_zh: >-
    当模型或学习动力系统明确建立在相空间变量上，并指定辛形式时，辛结构架构或
    积分器可以约束该结构的保持。这可能改善 Hamiltonian 系统的长期定性行为，
    但不保证精确能量守恒、普遍稳定性或任意学习动力学的正确性。
  boundary:
    - "A generic latent vector space is not automatically a symplectic manifold."
    - "Even-dimensionality alone does not supply a closed nondegenerate symplectic form."
    - "Volume preservation does not imply symplectic preservation."
    - "Energy conservation and symplectic preservation are distinct properties."
    - "Symplectic neural networks require explicit architecture or parameterization and validation of the chosen structure."
    - "Long-time behavior depends on the Hamiltonian, integrator, step size, and regularity assumptions."
    - "A symplectic numerical method generally does not conserve the original Hamiltonian exactly."
    - "Dissipative or stochastic systems are not automatically Hamiltonian."
    - "No ordinary Transformer update is established as a Hamiltonian flow."
  preserve_full_boundary: true
  existing_physical_metaphor_status: "secondary_teaser_only"
  secondary_teaser_limitation: >-
    The sealed hydraulic-box image may hint at volume balance, but volume
    preservation alone is weaker than symplectic preservation and does not
    establish exact energy conservation.
existing_code_and_audit:
  preserve: true
  evidence_status: "semantic_only"
  run_with_log_ref: null
  code_interpretation: >-
    The existing semi-implicit update may resemble one variant of symplectic
    Euler only in suitable canonical coordinates, with consistent sign
    conventions and a separable Hamiltonian tying dq_dt and dp_dt to
    derivatives of the same H. With arbitrary callables it does not prove a
    symplectic Jacobian condition or preservation of any specified form.
  audit_interpretation: >-
    The audit computes dq*dp-dp*dq using ordinary commutative scalar
    multiplication, so it vanishes tautologically. A symplectic form uses an
    antisymmetric wedge or bilinear structure; the audit tests neither that
    structure nor pullback preservation, nondegeneracy, Hamiltonian flow,
    volume, or energy.
  code_scope: "conditional_semi_implicit_update_only"
  audit_scope: "commutative_scalar_cancellation_only"
  explicitly_not_validated:
    - closed_two_form
    - nondegeneracy
    - even_dimensionality
    - symplectomorphism_pullback_condition
    - Hamiltonian_vector_field
    - Hamiltonian_flow
    - Liouville_volume_preservation
    - symplectic_Jacobian_condition
    - exact_or_modified_energy_behavior
