llm_physical_mapping: 如同在一个密封的液压齿轮箱中工作。活塞推进去多少体积的液压油，另一边就必定顶出多少体积，绝不会漏掉一滴，维持整个系统的能量总和恒定不变。
code_implementation: "import numpy as np\ndef symplectic_euler_step(q, p, dq_dt, dp_dt, dt):\n    p_new = p + dt * dp_dt(q)\n\
  \    q_new = q + dt * dq_dt(p_new)\n    return q_new, p_new\n"
