concept_node:
  id: "GEOMETRY-024"
  title: "向量的数乘运算与向量平行的条件"
  sub_topics:
    - "数乘向量的几何定义与伸缩效果"
    - "数乘运算的分配律与结合律"
    - "共线（平行）向量的充要条件"
    - "单位向量的求法（向量除以模）"
  llm_physical_mapping: "Stretching a rubber band. The vector is the rubber band pulled in a specific direction. Multiplying by a scalar > 1 stretches it further, 0 < scalar < 1 compresses it, negative scalar flips its direction, and 0 collapses it to a point."
  code_implementation: |-
    import torch

    def vector_scalar_multiplication(v_tensor: torch.Tensor, scalar: float) -> torch.Tensor:
        """Scales a vector by a given scalar factor."""
        return scalar * v_tensor

    def get_unit_vector(v_tensor: torch.Tensor) -> torch.Tensor:
        """Computes the unit vector of a given vector."""
        return v_tensor / torch.norm(v_tensor)

    # Example usage:
    v = torch.tensor([3.0, 4.0])
    v_scaled = vector_scalar_multiplication(v, 2.0)
    v_unit = get_unit_vector(v)
  v8_sanity_audit:
    sympy_pseudo_code: |-
      import sympy as sp

      # Define a vector and a scalar
      v = sp.Matrix([2, 3])
      k = sp.Symbol('k')

      # Scalar multiplication
      v_scaled = k * v

      # Collinearity condition: u is parallel to v iff u = c * v for some scalar c
      c = sp.Symbol('c')
      u = c * v

      # Verify collinearity by checking if their determinant (in 2D) is zero
      u_val = sp.Matrix([4, 6])
      collinear_matrix = sp.Matrix.hstack(v, u_val)
      is_collinear = collinear_matrix.det() == 0
