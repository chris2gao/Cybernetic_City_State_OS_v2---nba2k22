    import sympy as sp
    
    theta = sp.Symbol('theta', real=True)
    expr = sp.sin(theta + 2*sp.pi)
    
    # Assert that the simplified expression equals sin(theta)
    assert sp.simplify(expr) == sp.sin(theta)
