v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy as sp
    from sympy.functions.combinatorial.numbers import nP, nC
    n, k = sp.symbols('n k', integer=True, positive=True)
    p_expr = sp.factorial(n) / sp.factorial(n - k)
    c_expr = sp.factorial(n) / (sp.factorial(k) * sp.factorial(n - k))
    assert p_expr.subs({n: 5, k: 2}) == nP(5, 2)
    assert c_expr.subs({n: 5, k: 2}) == nC(5, 2)
    assert True
