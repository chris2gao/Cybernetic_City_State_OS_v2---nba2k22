name: "Feynman-Kac公式 - 蒙特卡洛模拟代替死板网格计算的数学通行证。"
domain: "STOCHASTIC"
description: "在极高维度的偏微分方程求解中，传统网格差分方法会遭遇计算量呈指数级爆炸的维数灾难。Feynman-Kac 公式允许我们通过沿着 SDE 随机路径进行蒙特卡洛采样来局部求解高维 PDE，使计算复杂度与维度脱钩。"
llm_physical_mapping: "物理映射为估算广袤山脉的总降雨体积。如果使用死板的网格法，你需要把几百万平方公里的山脉划成一平方米的小方块（极高维度网格），逐一测量，工作量爆炸。蒙特卡洛采样的 Feynman-Kac 思维则是：我们在天空中随机撒下一万个精准的雨量探测器（微观 SDE 路径），只要探测器随风飘移的轨迹合理，求平均后就能非常精准地代表整个山脉的宏观降雨量，完全无视了山坡的地形维度有多复杂。"
code_implementation: |-
  import torch

  # High-dimensional Black-Scholes PDE via Monte Carlo (Feynman-Kac)
  # We want to find the option price at t=0 for d=100 assets
  d = 100
  S0 = torch.ones(d) * 100.0
  r = 0.05
  sigma = 0.2
  T = 1.0
  num_paths = 10000

  # Simulate d-dimensional geometric Brownian motion
  # dS_i = r * S_i * dt + sigma * S_i * dW_i
  Z = torch.randn(num_paths, d)
  
  # Exact solution for terminal asset prices
  ST = S0 * torch.exp((r - 0.5 * sigma**2) * T + sigma * torch.sqrt(torch.tensor(T)) * Z)
  
  # Payoff function: max(Average(S) - Strike, 0) (Asian/Basket option style)
  strike = 100.0
  payoff = torch.relu(torch.mean(ST, dim=1) - strike)
  
  # Feynman-Kac expectation discounted back to t=0
  price = torch.exp(torch.tensor(-r * T)) * torch.mean(payoff)
  # Successfully evaluated a 100-dimensional PDE without grids!
v8_sanity_audit:
  sympy_pseudo_code: |-
    import sympy as sp

    # Verify that variance of MC estimator is independent of state-space dimension d
    # The sample mean variance is Var(f(X)) / N
    
    # Suppose our target function is an average over d independent identical assets: f = (1/d) * sum(X_i)
    # where Var(X_i) = V
    
    V = sp.Symbol('V', positive=True, real=True)
    d = sp.Symbol('d', positive=True, integer=True)
    N = sp.Symbol('N', positive=True, integer=True)
    
    # Variance of the single sample f: Var( (1/d) * sum(X_i) ) = (1/d^2) * d * V = V / d
    var_f = V / d
    
    # Variance of the Monte Carlo estimator with N samples: Var_MC = Var(f) / N
    var_MC = var_f / N
    
    # Notice that Var_MC = V / (d * N)
    # The error scales with 1/N. As d increases, the variance actually decreases or remains manageable,
    # completely circumventing the O(N_{grid}^d) curse of dimensionality.
    assert sp.simplify(var_MC - (V / (d * N))) == 0
