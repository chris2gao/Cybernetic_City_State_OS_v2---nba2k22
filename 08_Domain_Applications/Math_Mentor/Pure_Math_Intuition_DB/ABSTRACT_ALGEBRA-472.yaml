code_implementation: |
  import sympy as sp
  theta = sp.Symbol('theta', real=True)
  rot_matrix = sp.Matrix([
      [sp.cos(theta), -sp.sin(theta)],
      [sp.sin(theta), sp.cos(theta)]
  ])
  v = sp.Matrix([1, 0])
  action = rot_matrix * v
legacy_v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy as sp
    theta = sp.Symbol('theta', real=True)
    M = sp.Matrix([[sp.cos(theta), -sp.sin(theta)], [sp.sin(theta), sp.cos(theta)]])
    I = sp.eye(2)
    assert sp.simplify(M.subs(theta, 0)) == I
    M2 = sp.Matrix([[sp.cos(2*theta), -sp.sin(2*theta)], [sp.sin(2*theta), sp.cos(2*theta)]])
    assert sp.simplify(M * M) == sp.simplify(M2)
