llm_physical_mapping: "mundane physical metaphor: walking blindfolded in a bumpy field. Euler method is stepping straight blindly. RK4 is tapping your cane left, right, front, and center, then taking one calculated, perfectly averaged step."
code_implementation: |
  import sympy as sp
  y, t, h = sp.symbols('y t h')
  f = y * t
  k1 = h * f
  k2 = h * (f.subs({y: y + k1/2}))
