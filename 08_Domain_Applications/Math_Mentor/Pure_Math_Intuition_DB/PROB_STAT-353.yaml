    import sympy as sp
    from sympy.stats import Normal, P, E, variance
    
    Z = Normal('Z', 0, 1)
    
    assert E(Z) == 0
    assert variance(Z) == 1
    
    # Symmetry property
    assert P(Z > 0) == sp.Rational(1, 2)
    assert P(Z < 0) == sp.Rational(1, 2)
