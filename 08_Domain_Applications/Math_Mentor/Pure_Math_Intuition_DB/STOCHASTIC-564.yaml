name: "遍历理论 - 认知跃迁：对于经历无限岁月的系统，“时间平均”绝对等于“空间平均”。 (n_564)"
concept_physical_metaphor: "A sealed box filled with gas molecules. Tracking a single gas molecule for a year and logging all its positions (time average) yields the exact same spatial density map as taking one instantaneous photograph of all the molecules in the box (space average)."
sub_topics:
  - "遍历性 (Ergodicity) 的集合论描述"
  - "伯克霍夫 (Birkhoff) 遍历定理"
  - "测度保持变换的不变量分析"
  - "物理直觉：系统必将走遍所有可能的平衡状态"
code_implementation: |-
  import torch

  def ergodicity_check(steps=10000, num_particles=1000):
      particles = torch.rand(num_particles)
      
      single_particle = particles[0].item()
      time_history = [single_particle]
      for _ in range(steps):
          single_particle = (single_particle + 0.314) % 1.0
          time_history.append(single_particle)
          
      time_avg = torch.tensor(time_history).mean().item()
      space_avg = particles.mean().item()
      
      return abs(time_avg - space_avg)
v8_sanity_audit:
  sympy_pseudo_code: |-
    import sympy as sp
    
    x = sp.Symbol('x')
    space_avg = sp.integrate(x, (x, 0, 1))
    
    expected_time_avg = sp.Rational(1, 2)
    
    assert sp.simplify(space_avg - expected_time_avg) == 0, "Time and space averages do not match"
