id: "CALCULUS-267"
concept_name: "导数与微分 - 导数的四则运算规则 (n_267)"
sub_topics:
  - "导数的线性性质：和、差、数乘法则"
  - "乘法法则（莱布尼茨法则）的推导"
  - "除法法则的推导及其分母不为零的条件"
  - "高阶导数的运算初步"
llm_physical_mapping: "mundane physical metaphor: combining recipes. If you double a recipe, the baking time change doubles. If you have two separate moving parts (product rule), the total change depends on moving A while holding B, then moving B while holding A."
code_implementation: |
  import sympy as sp
  x = sp.Symbol('x')
  u = sp.Function('u')(x)
  v = sp.Function('v')(x)
  # Product rule
  product_rule = sp.diff(u * v, x)
  # Quotient rule
  quotient_rule = sp.diff(u / v, x)
v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy as sp
    x = sp.Symbol('x')
    u = sp.Function('u')(x)
    v = sp.Function('v')(x)
    product_rule = sp.diff(u * v, x)
    assert sp.simplify(product_rule - (u*sp.diff(v, x) + v*sp.diff(u, x))) == 0
