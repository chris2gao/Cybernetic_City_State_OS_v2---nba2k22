llm_physical_mapping: "spatial deformation/stretching/rotating: A basis serves as the minimum structural skeleton of space. Changing the basis corresponds to viewing the space from a rotated or stretched coordinate grid, preserving the actual geometric point while changing its coordinate representation."
code_implementation: |
  import sympy as sp
  
  # Standard basis in 2D
  e1 = sp.Matrix([1, 0])
  e2 = sp.Matrix([0, 1])
  
  # Another basis
  b1 = sp.Matrix([1, 1])
  b2 = sp.Matrix([1, -1])
  
  # Vector in standard basis
  v = sp.Matrix([3, 1])
  
  # Find coordinates in new basis
  # Solve c1*b1 + c2*b2 = v
  M = sp.Matrix.hstack(b1, b2)
  coords = M.LUsolve(v)
