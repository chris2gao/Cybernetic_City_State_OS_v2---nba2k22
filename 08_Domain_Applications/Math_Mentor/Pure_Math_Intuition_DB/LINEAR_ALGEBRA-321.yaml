id: "LINEAR_ALGEBRA-321"
concept_name: "特征值与特征向量 - 特征方程求解与矩阵对角化条件 (n_321)"
sub_topics:
  - "特征多项式 det(A - λI) = 0"
  - "特征值的重数：代数重数与几何重数"
  - "矩阵可对角化的充要条件：有 n 个线性无关特征向量"
  - "相似变换 P⁻¹AP = Λ 的代数流程"
llm_physical_mapping: "spatial deformation/stretching/rotating: Diagonalization is choosing a new coordinate system aligned perfectly with the stable axes (eigenvectors). In this new frame, the complex spatial shear and stretch is simplified into independent, parallel stretches along each axis."
code_implementation: |
  import sympy as sp
  A = sp.Matrix([[1, 2], [2, 1]])
  P, D = A.diagonalize()
v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy as sp
    A = sp.Matrix([[1, 2], [2, 1]])
    P, D = A.diagonalize()
    assert P * D * P.inv() == A, "Diagonalization identity P*D*P^-1 = A failed"
