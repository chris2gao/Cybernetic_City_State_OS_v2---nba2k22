id: "LINEAR_ALGEBRA-325"
concept_name: "正交分解 - 正交投影定理与空间的分解 (n_325)"
sub_topics:
  - "向量向子空间的最佳逼近（垂线段最短）"
  - "正交补空间 (Orthogonal Complement) 的定义"
  - "空间分解定理 V = W ⊕ Wᗮ"
  - "投影矩阵 P 的性质 (P² = P)"
llm_physical_mapping: "spatial deformation/stretching/rotating: Casting a shadow with a perfectly perpendicular light source. The projection squashes the space entirely along one direction onto a plane, and applying the squish a second time (P^2) does nothing because the volume is already flattened."
code_implementation: |
  import sympy as sp
  a = sp.Matrix([1, 2, 0])
  P = (a * a.T) / (a.T * a)[0, 0]
v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy as sp
    a = sp.Matrix([1, 2, 0])
    P = (a * a.T) / (a.T * a)[0, 0]
    assert sp.simplify(P * P - P) == sp.zeros(3, 3), "Projection matrix must be idempotent"
