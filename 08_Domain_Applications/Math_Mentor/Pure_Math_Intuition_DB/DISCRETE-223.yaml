  import networkx as nx
  
  def konigsberg_graph():
      G = nx.MultiGraph()
      G.add_nodes_from(['A', 'B', 'C', 'D'])
      # Adding bridges as edges
      G.add_edges_from([('A', 'B'), ('A', 'B'), ('A', 'C'), ('A', 'C'), ('A', 'D'), ('B', 'D'), ('C', 'D')])
      return G
v8_sanity_audit:
  sympy_pseudo_code: |
    import networkx as nx
    G = nx.MultiGraph()
    G.add_edges_from([('A', 'B'), ('A', 'B'), ('A', 'C'), ('A', 'C'), ('A', 'D'), ('B', 'D'), ('C', 'D')])
    # Eulerian circuit exists iff all vertices have even degree
    odd_degrees = [v for v, d in G.degree() if d % 2 != 0]
    assert len(odd_degrees) == 4
    assert not nx.has_eulerian_path(G)
