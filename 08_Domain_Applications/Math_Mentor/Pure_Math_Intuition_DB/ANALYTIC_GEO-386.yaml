id: "ANALYTIC_GEO-386"
concept_name: "坐标系变换（旋转/平移） - 核心大模型映射：旋转位置编码 (RoPE) 的二维旋转矩阵推导及其在高维空间的泛化 (n_386)"
sub_topics:
  - "二维旋转变换在复数域的表示 e^{iθ}"
  - "RoPE 将绝对位置编码转化为相对位置信息的逻辑"
  - "分块对角矩阵在高维空间执行成对旋转的机制"
  - "旋转不变性在语义注意力匹配中的物理优势"
llm_physical_mapping: "mundane physical metaphor: Think of a clock with multiple pairs of hands, each pair spinning at a different speed. When you want to find the angle between two specific times, you don't need to know the absolute time of day; you just measure the relative angle between the hands. This is like how words in a sentence relate to each other based on their distance, not their absolute position on the page."
code_implementation: |
  import sympy as sp
  
  def rope_rotation(x1, x2, theta):
      # Applying a 2D rotation to a pair of coordinates
      R = sp.Matrix([
          [sp.cos(theta), -sp.sin(theta)],
          [sp.sin(theta), sp.cos(theta)]
      ])
      vec = sp.Matrix([x1, x2])
      return R * vec
v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy as sp
    
    theta1 = sp.Symbol('t1')
    theta2 = sp.Symbol('t2')
    
    R1 = sp.Matrix([[sp.cos(theta1), -sp.sin(theta1)], [sp.sin(theta1), sp.cos(theta1)]])
    R2 = sp.Matrix([[sp.cos(theta2), -sp.sin(theta2)], [sp.sin(theta2), sp.cos(theta2)]])
    
    # Rotation by t1 then t2 is rotation by t1+t2
    R_combined = sp.simplify(R2 * R1)
    R_expected = sp.Matrix([[sp.cos(theta1+theta2), -sp.sin(theta1+theta2)], [sp.sin(theta1+theta2), sp.cos(theta1+theta2)]])
    
    assert sp.simplify(R_combined[0,0] - R_expected[0,0]) == 0
