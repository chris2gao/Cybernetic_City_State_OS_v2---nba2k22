code_implementation: |
  import sympy as sp
  x = sp.symbols('x')
  f = x**2 - 2
  df = sp.diff(f, x)
  x_n = 1.5
  for _ in range(3):
      x_n = float(x_n - f.subs(x, x_n)/df.subs(x, x_n))
  print(x_n)
