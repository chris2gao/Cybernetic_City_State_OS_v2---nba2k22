llm_physical_mapping:
  metaphor: Surveying a hilly terrain using sparse height markers. The GP provides
    an estimated topographic map with error bands, guiding where next to place a marker
    by balancing exploration (unknown valleys) and exploitation (highest known peaks).
code_implementation:
  pytorch_simulation: "import torch\n\ndef gp_posterior(X_train, Y_train, X_test,\
    \ length_scale=1.0, noise_var=1e-4):\n    def kernel(a, b):\n        return torch.exp(-torch.cdist(a,\
    \ b)**2 / (2 * length_scale**2))\n    \n    K = kernel(X_train, X_train) + noise_var\
    \ * torch.eye(len(X_train))\n    K_s = kernel(X_train, X_test)\n    K_ss = kernel(X_test,\
    \ X_test)\n    \n    L = torch.linalg.cholesky(K)\n    alpha = torch.cholesky_solve(Y_train,\
    \ L)\n    \n    mu_post = K_s.T @ alpha\n    v = torch.linalg.solve_triangular(L,\
    \ K_s, upper=False)\n    cov_post = K_ss - v.T @ v\n    \n    return mu_post,\
    \ torch.diag(cov_post)\n\nX_tr = torch.tensor([[0.0], [2.0]])\nY_tr = torch.tensor([[1.0],\
    \ [-1.0]])\nX_te = torch.linspace(-1, 3, 50).unsqueeze(-1)\nmu, var = gp_posterior(X_tr,\
    \ Y_tr, X_te)\n"
v8_sanity_audit:
  sympy_pseudo_code: 'import sympy as sp


    k_xx, k_xs, k_ss, y, noise = sp.symbols(''k_xx k_xs k_ss y noise'')

    # Simple 1D GP posterior variance update

    posterior_var = k_ss - k_xs * (k_xx + noise)**(-1) * k_xs

    # If test point is far away and independent (k_xs = 0), variance reverts to prior
    (k_ss)

    assert sp.simplify(posterior_var.subs(k_xs, 0) - k_ss) == 0

    '
