id: REAL_ANALYSIS-023
title: "Mean Value Theorem and Rolle's Theorem"
sub_topics:
  - "Rolle's Theorem"
  - "Mean Value Theorem (MVT)"
  - "Lipschitz Bounds from Derivatives"
llm_physical_mapping: "Gradient Clipping and GRPO Advantage Bounds. The Mean Value Theorem asserts a point exists where the derivative equals the secant slope. In LLM reinforcement learning (PPO/GRPO), the policy update ratio $\\pi_\\theta / \\pi_{ref}$ is strictly clipped. This ensures the geometric 'secant' of the policy divergence respects a strict boundary, preventing catastrophic optimization steps analogous to bounding the MVT derivative."
code_implementation: |
  import torch
  
  def grpo_clipped_surrogate_loss(advantage: torch.Tensor, old_log_prob: torch.Tensor, new_log_prob: torch.Tensor, epsilon: float = 0.2):
      # Ratio between new policy and old policy
      ratio = torch.exp(new_log_prob - old_log_prob)
      
      # Unclipped surrogate
      surr1 = ratio * advantage
      
      # Clipped surrogate: strictly bounds the rate of change
      # Mirrors bounding the derivative via MVT constraints
      surr2 = torch.clamp(ratio, 1.0 - epsilon, 1.0 + epsilon) * advantage
      
      # The objective function chooses the pessimistic bound
      return -torch.min(surr1, surr2).mean()
v8_sanity_audit:
  sympy_pseudo_code: |
    import torch
    
    # Audit: Ensuring policy update step is bounded (MVT secant constraint)
    advantage = torch.tensor([1.5])
    ratio = torch.tensor([1.5]) # Policy shifted by 50%
    epsilon = 0.2
    
    clipped_ratio = torch.clamp(ratio, 1.0 - epsilon, 1.0 + epsilon)
    
    # Even though ratio = 1.5, the clipped_ratio is 1.2
    # The effective 'derivative' of the policy step is bounded
    assert clipped_ratio.item() <= 1.2 + 1e-5
