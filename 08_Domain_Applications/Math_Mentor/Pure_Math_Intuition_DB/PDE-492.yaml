code_implementation: |
  import torch

  def simple_1d_fem_poisson(num_elements=10):
      nodes = num_elements + 1
      h = 1.0 / num_elements
      
      K = torch.zeros((nodes, nodes))
      F = torch.zeros(nodes)
      
      f_val = 1.0 
      
      for i in range(num_elements):
          K_local = (1/h) * torch.tensor([[1.0, -1.0], [-1.0, 1.0]])
          F_local = (h/2) * torch.tensor([f_val, f_val])
          
          K[i:i+2, i:i+2] += K_local
          F[i:i+2] += F_local
          
      K[0, :] = 0; K[0, 0] = 1.0; F[0] = 0.0
      K[-1, :] = 0; K[-1, -1] = 1.0; F[-1] = 0.0
      
      u = torch.linalg.solve(K, F)
      return u
v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy as sp

    x, h = sp.symbols('x h', positive=True)

    phi_1 = 1 - x/h
    phi_2 = x/h

    k_12 = sp.integrate(sp.diff(phi_1, x) * sp.diff(phi_2, x), (x, 0, h))
    m_12 = sp.integrate(phi_1 * phi_2, (x, 0, h))

    assert sp.simplify(k_12) == -1/h, "Stiffness off-diagonal should be -1/h"
    assert sp.simplify(m_12) == h/6, "Mass off-diagonal should be h/6"
