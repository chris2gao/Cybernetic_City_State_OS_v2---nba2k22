id: "DISCRETE-257"
concept_name: "有限状态机（DFA/NFA） - 确定性有限状态机 (DFA) 与非确定性有限状态机 (NFA) 的状态转移图与五元组严格定义 (n_257)"
sub_topics:
  - "状态、字母表、转移函数、初态、终态"
  - "状态转移的确定性约束"
  - "字符串被状态机接受的逻辑路径"
  - "DFA 的状态化简算法"
llm_physical_mapping: "mundane physical metaphor: A system of interconnected subway stations with turnstiles. In a DFA, pressing 'A' takes you to exactly one specific station via a single locked tunnel. In an NFA, pressing 'A' might open doors to multiple tunnels simultaneously, requiring parallel scouting."
code_implementation: |
  class DFA:
      def __init__(self, states, alphabet, transitions, start_state, accept_states):
          self.states = states
          self.alphabet = alphabet
          self.transitions = transitions
          self.start_state = start_state
          self.accept_states = accept_states

      def process(self, string):
          current_state = self.start_state
          for char in string:
              if (current_state, char) not in self.transitions:
                  return False
              current_state = self.transitions[(current_state, char)]
          return current_state in self.accept_states

  # DFA accepting strings ending in '0'
  dfa = DFA(
      states={'q0', 'q1'},
      alphabet={'0', '1'},
      transitions={('q0', '0'): 'q1', ('q0', '1'): 'q0', ('q1', '0'): 'q1', ('q1', '1'): 'q0'},
      start_state='q0',
      accept_states={'q1'}
  )
  print("Accepts '110':", dfa.process('110'))
  print("Accepts '101':", dfa.process('101'))
v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy
    
    # Represent DFA transitions as a dictionary and validate properties
    transitions = {('q0', '0'): 'q1', ('q0', '1'): 'q0', ('q1', '0'): 'q1', ('q1', '1'): 'q0'}
    states = {'q0', 'q1'}
    alphabet = {'0', '1'}
    
    # Sanity check: Every state has exactly one transition for every alphabet symbol (Determinism)
    for state in states:
        for char in alphabet:
            assert (state, char) in transitions
            assert transitions[(state, char)] in states
