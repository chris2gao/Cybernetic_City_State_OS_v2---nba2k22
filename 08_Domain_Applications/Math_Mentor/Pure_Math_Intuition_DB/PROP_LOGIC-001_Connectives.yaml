code_implementation: |
  def evaluate_connectives(p, q):
      return {
          "not_p": not p,
          "and": p and q,
          "or": p or q,
          "implies": (not p) or q,
          "iff": p == q,
      }

v8_sanity_audit:
  status: "run_with_log"
  execution_claim: "complete_finite_truth_function_audit_only"
  language: "sympy"
  script_ref: ".ai/PROGRAM_RUNS/kcp-batch-1-prop-logic-certification-0001/AUDITS/PROP_LOGIC-001.py"
  tested_properties:
    - "all four assignments for conjunction, inclusive disjunction, material implication, and biconditional"
    - "both assignments for negation"
    - "material implication equals ¬P∨Q on all assignments"
  explicitly_not_validated:
    - "natural_language_proposition_classification"
    - "parsing_pedagogy"
    - "mapping_safety"
    - "learner_mastery"
  sympy_pseudo_code: |
    import itertools
    import sympy as sp
    from sympy.logic.boolalg import And, Equivalent, Implies, Not, Or

    P, Q = sp.symbols("P Q")
    expressions = {
        "and": And(P, Q),
        "or": Or(P, Q),
        "implies": Implies(P, Q),
        "iff": Equivalent(P, Q),
    }
    expected = {
        (False, False): (False, False, True, True),
        (False, True): (False, True, True, False),
        (True, False): (False, True, False, False),
        (True, True): (True, True, True, True),
    }
    for values in itertools.product((False, True), repeat=2):
        observed = tuple(
            bool(expr.subs({P: values[0], Q: values[1]}))
            for expr in expressions.values()
        )
        assert observed == expected[values]
        assert bool(Implies(P, Q).subs({P: values[0], Q: values[1]})) == bool(Or(Not(P), Q).subs({P: values[0], Q: values[1]}))
    assert bool(Not(P).subs({P: False})) is True
    assert bool(Not(P).subs({P: True})) is False

