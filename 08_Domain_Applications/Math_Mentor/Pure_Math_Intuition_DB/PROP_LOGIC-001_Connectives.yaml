mode_a_intuition:
  occurrence_crisis:
    english: "Natural-language statements combine 'not', 'and', 'or', and 'if', but ordinary wording can hide exactly when the result is true."
    chinese: "自然语言会组合‘非、且、或、如果’，但日常措辞常掩盖复合陈述究竟何时为真。"
  primary:
    english: |-
      Treat each atomic proposition as a two-position indicator. A connective is
      a deterministic rule that reads one or two indicator positions and returns
      one position. This makes every case inspectable without suggesting that the
      proposition itself is an electrical object.
    chinese: |-
      把每个原子命题看作只有两个位置的指示器；联结词是一条确定规则，读取一个或
      两个指示器并输出一个位置。这样每种情况都可检查，但命题本身并不是电路元件。
  low_friction_example:
    english: "If P is true and Q is false, then P∧Q is false, P∨Q is true, P→Q is false, and P↔Q is false."
    chinese: "若 P 真、Q 假，则 P∧Q 假、P∨Q 真、P→Q 假、P↔Q 假。"
  limitations:
    - "Indicator positions model truth values only; they do not model meaning, evidence, causation, or uncertainty. / 指示器只模拟真值，不模拟意义、证据、因果或不确定性。"
    - "A switch analogy can suggest exclusive OR, but ∨ here is inclusive. / 开关类比可能让人误解为异或，但这里的 ∨ 是相容或。"

mapping_boundary:
  status: "semantic_only_accepted"
  valid_uses:
    - "enumerating the two possible truth values / 枚举两个可能真值"
    - "computing a connective from input truth values / 从输入真值计算联结词输出"
    - "showing that compound-formula evaluation is compositional / 展示复合公式按结构求值"
  invalid_inferences:
    - "P→Q does not assert that P causes Q. / P→Q 不断言 P 导致 Q。"
    - "A true compound formula does not establish that its atomic statements describe reality. / 复合公式为真不证明原子陈述符合现实。"
    - "Inclusive OR is not exclusive OR. / 相容或不是异或。"
    - "Classical two-valued semantics does not cover vagueness, probability, or all natural-language conditionals. / 经典二值语义不覆盖模糊性、概率或所有自然语言条件句。"

common_misconceptions:
  - "An atomic proposition must be factually true. / 误以为原子命题必须事实上为真。"
  - "P∨Q is false when both P and Q are true. / 误以为 P、Q 同真时 P∨Q 为假。"
  - "P→Q is false whenever P is false. / 误以为 P 为假时 P→Q 必为假。"
  - "P→Q states causation or temporal order. / 误以为 P→Q 表示因果或时间先后。"
  - "P↔Q says P and Q have the same meaning. / 误以为 P↔Q 表示 P、Q 意义相同。"
  - "A string without parentheses always has an obvious parse. / 误以为省略括号的字符串总有显然解析。"

