concept_name: "Propositional Logic: Atomic Propositions and Connectives / 命题逻辑：原子命题与逻辑联结词"
canonical_concept: "propositional_connectives"
domain: "Mathematical Logic / Propositional Calculus"
symbol: "¬P, P∧Q, P∨Q, P→Q, P↔Q"

sub_topics:
  - "Atomic propositions: definition and recognition / 原子命题的定义与识别"
  - "Connectives ¬, ∧, ∨, →, ↔ and their truth conditions / 联结词非、与、或、蕴含、等价及其真值条件"
  - "Construction and unambiguous parsing of compound propositions / 复合命题的构造与无歧义解析"

pure_math_definition:
  english: |-
    A proposition is a declarative sentence assigned exactly one truth value in
    {True, False} under the interpretation being considered. An atomic
    proposition contains no logical connective. If P and Q are propositions,
    then ¬P, P∧Q, P∨Q, P→Q, and P↔Q are compound propositions.

    Their truth conditions are: ¬P is true exactly when P is false; P∧Q is true
    exactly when both are true; P∨Q is true exactly when at least one is true;
    P→Q is false exactly in the case P is true and Q is false; and P↔Q is true
    exactly when P and Q have the same truth value. Here ∨ is inclusive.
    Parentheses determine construction order. If parentheses are omitted, this
    node uses the precedence ¬, then ∧, then ∨, then →, then ↔; implication is
    parsed right-associatively.
  chinese: |-
    在给定解释下，命题是被赋予且仅被赋予真、假两个真值之一的陈述句。原子命题
    不含逻辑联结词。若 P、Q 是命题，则 ¬P、P∧Q、P∨Q、P→Q、P↔Q 是复合命题。

    真值条件如下：仅当 P 为假时 ¬P 为真；仅当 P、Q 都真时 P∧Q 为真；只要至少
    一个为真，P∨Q 就为真；仅在 P 真且 Q 假时 P→Q 为假；仅当 P、Q 真值相同
    时 P↔Q 为真。这里的“或”是相容或。括号决定构造顺序；省略括号时，本节点
    采用 ¬、∧、∨、→、↔ 的优先级，且蕴含向右结合。

assumptions_and_notation:
  - "Truth values are exactly T and F; this node does not use three-valued, fuzzy, or probabilistic semantics. / 真值仅为真与假；本节点不采用三值、模糊或概率语义。"
  - "P and Q are metavariables for propositions, not claims that are automatically true. / P、Q 是命题元变量，并不自动为真。"
  - "The connective ∨ is inclusive OR. / 联结词 ∨ 表示相容或。"
  - "The formula P→Q is material implication, not a causal claim. / P→Q 表示实质蕴含，不表示因果关系。"

