concept_node:
  id: "GEOMETRY-010"
  title: "圆与多边形 - 多边形内角和公式 (n-2)*180° 的推导（将复杂多边形分割为三角形） (n_130)"
  sub_topics:
    - "多边形的对角线分割法（转化为 n-2 个三角形）"
    - "外角和恒为 360° 的证明（转圈走回原点的旋转视角）"
    - "正多边形的内角与外角计算"
    - "凸多边形与凹多边形的内角界定"
  llm_physical_mapping: |
    Mundane physical metaphor: Walking around the perimeter, turning at corners.
    Imagine walking along the boundary of a polygon. At each vertex, you turn by the exterior angle to align with the next edge. When you return to your starting point, facing your initial direction, you have completed exactly one full rotation (360°). Since the interior and exterior angle at each vertex sum to 180°, the total angle sum for `n` vertices is `n * 180°`. Subtracting the 360° of total turns leaves the interior angle sum as `n * 180° - 360°`, which simplifies to `(n-2) * 180°`. 
    Alternatively, visualize drawing diagonals from a single starting vertex to all other non-adjacent vertices, slicing the polygon into exactly `n-2` distinct triangles, each contributing 180° to the interior angle sum.
  code_implementation: |
    import torch
    
    class PolygonTriangulation:
        def __init__(self, num_sides: int):
            if num_sides < 3:
                raise ValueError("A polygon must have at least 3 sides.")
            self.n = num_sides
            
        def compute_interior_angle_sum(self) -> float:
            # Triangulating from a single vertex creates (n - 2) triangles.
            num_triangles = self.n - 2
            
            # Using PyTorch to encode the formula mathematically:
            # Each triangle tensor node holds 180 degrees.
            triangle_angles = torch.full((num_triangles,), 180.0, dtype=torch.float32)
            
            # Total sum is the sum over the triangle sequence
            total_sum = torch.sum(triangle_angles).item()
            return total_sum
            
        def compute_exterior_angle_sum(self) -> float:
            # The sum of exterior angles is always 360, representing one full rotation.
            return 360.0
  v8_sanity_audit:
    sympy_pseudo_code: |
      import sympy as sp
      from sympy.geometry import Polygon, Point
      
      def validate_polygon_angles():
          # Define a square using sympy geometry
          p1, p2, p3, p4 = Point(0, 0), Point(1, 0), Point(1, 1), Point(0, 1)
          poly = Polygon(p1, p2, p3, p4)
          
          # n = 4 for quadrilateral
          n = 4
          expected_sum = (n - 2) * sp.pi
          
          # Sum the interior angles calculated directly by SymPy
          # poly.angles returns a dictionary of {Vertex: Angle}
          actual_sum = sum(poly.angles.values())
          
          # Ensure the theoretical formula matches the computed geometry
          assert sp.simplify(actual_sum - expected_sum) == 0, "Angle sum mismatch!"
          return True
