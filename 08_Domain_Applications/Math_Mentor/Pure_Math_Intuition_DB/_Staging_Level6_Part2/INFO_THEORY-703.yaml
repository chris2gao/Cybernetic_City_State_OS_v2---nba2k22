id: "INFO_THEORY-703"
concept_name: "互信息 - 大模型映射：在对比学习中，最大化图像与文本对的互信息是实现 CLIP 等跨模态视觉模型的绝对地基。 (n_703)"
sub_topics:
  - "跨模态特征的共现概率极大化"
  - "互信息下界估计（如 InfoNCE 损失）"
  - "语义对齐在不同嵌入空间中的拓扑表现"
  - "噪声对比估计对冗余信息的剔除作用"
llm_physical_mapping: "mundane physical metaphor: alignment pegs, multi-axis milling machines, laser targeting beams, contrastive filters."
code_implementation: |
  import torch
  import numpy as np
  
  def infonce_loss_mock(sim_matrix):
      return -torch.log(torch.exp(sim_matrix.diag()) / torch.exp(sim_matrix).sum(dim=1))
      
  sim = torch.eye(2)
  loss = infonce_loss_mock(sim)
  assert loss.shape[0] == 2
v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy as sp
    sim_pos, sim_neg = sp.symbols('sim_pos sim_neg', real=True)
    loss = -sp.log(sp.exp(sim_pos) / (sp.exp(sim_pos) + sp.exp(sim_neg)))
    equivalent = sp.log(1 + sp.exp(sim_neg - sim_pos))
    assert sp.simplify(sp.exp(loss) - sp.exp(equivalent)) == 0
