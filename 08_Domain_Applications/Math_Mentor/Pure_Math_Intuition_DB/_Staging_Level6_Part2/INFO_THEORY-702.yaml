id: "INFO_THEORY-702"
concept_name: "互信息 - 物理意义：测量两组变量之间的“信息重叠度”。 (n_702)"
sub_topics:
  - "互信息 I(X; Y) 的对称性定义"
  - "与熵和联合熵的数量关系"
  - "条件独立性在互信息为零处的体现"
  - "物理直觉：观察 Y 之后对 X 不确定性的减少量"
llm_physical_mapping: "mundane physical metaphor: overlapping gears, synchronizing belts, phase-locked loops, overlapping stencils."
code_implementation: |
  import torch
  import numpy as np
  
  def mutual_information(hx, hy, hxy):
      return hx + hy - hxy
      
  assert mutual_information(1.0, 1.0, 1.5) == 0.5
v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy as sp
    hx, hy, hxy = sp.symbols('hx hy hxy')
    mi = hx + hy - hxy
    assert sp.simplify(mi - (hx + hy - hxy)) == 0