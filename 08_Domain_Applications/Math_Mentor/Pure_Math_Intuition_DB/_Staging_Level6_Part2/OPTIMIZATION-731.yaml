id: "OPTIMIZATION-731"
concept_name: "凸共轭与Fenchel对偶 - 消除奇迹步骤：利用对偶理论的最优策略封闭形式解，通过重参数化技巧消灭了奖励模型，将约束优化对偶转化为简单的二元分类。 (n_731)"
sub_topics:
  - "奖励函数向策略概率比率的映射"
  - "消除强化学习中的采样不稳定性"
  - "DPO 算法的代数简化证明"
  - "物理直觉：直接在偏好数据上建立最优生成的对偶流"
llm_physical_mapping: "bypassing a chemical mixing reservoir (reward model); the piping system directly connects preference intake valves to the extrusion nozzle ratio (policy), eliminating the volatile intermediary tank completely via rigid algebraic brackets."
code_implementation: |
  import torch
  import torch.nn.functional as F
  
  def dpo_loss(policy_chosen_logps, policy_rejected_logps, ref_chosen_logps, ref_rejected_logps, beta=0.1):
      pi_logratios = policy_chosen_logps - policy_rejected_logps
      ref_logratios = ref_chosen_logps - ref_rejected_logps
      logits = pi_logratios - ref_logratios
      loss = -F.logsigmoid(beta * logits)
      return loss.mean()
v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy as sp
    
    beta, pi_c, pi_r, ref_c, ref_r = sp.symbols('beta pi_c pi_r ref_c ref_r', real=True)
    r_c = beta * (pi_c - ref_c)
    r_r = beta * (pi_r - ref_r)
    diff = r_c - r_r
    expected_diff = beta * ((pi_c - pi_r) - (ref_c - ref_r))
    assert sp.simplify(diff - expected_diff) == 0
