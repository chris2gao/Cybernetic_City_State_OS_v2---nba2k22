id: "OPTIMIZATION-732"
concept_name: "最优控制初步（Pontryagin最大值原理） - 【核心大模型映射】：主宰现代生成式流匹配（Flow Matching）与概率流 ODE 的上帝之手！ (n_732)"
sub_topics:
  - "状态方程与共轭状态方程"
  - "哈密顿函数的极值原理"
  - "控制算子的动力学演化"
  - "在扩散模型反向轨迹优化中的应用"
llm_physical_mapping: "a multi-stage drone trajectory correction thruster network; calculating the Hamiltonian determines the absolute optimal fuel burn at each micro-second valve-open event, ensuring the kinetic payload hits the target dock perfectly."
code_implementation: |
  import numpy as np
  
  def hamiltonian(x, p, u):
      return p * u - 0.5 * u**2
  
  p_val = 1.5
  u_opt = p_val
  h_opt = hamiltonian(0, p_val, u_opt)
v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy as sp
    
    x, p, u = sp.symbols('x p u', real=True)
    H = p * u - (u**2) / 2
    dH_du = sp.diff(H, u)
    u_opt = sp.solve(dH_du, u)[0]
    assert u_opt == p
