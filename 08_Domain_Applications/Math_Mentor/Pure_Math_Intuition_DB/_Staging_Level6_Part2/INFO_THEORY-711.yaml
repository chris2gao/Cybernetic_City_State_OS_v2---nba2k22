id: "INFO_THEORY-711"
concept_name: "联合熵与条件熵 - 物理意义：在已知前文 Token 信息的条件下，剩余序列不确定性的坍缩程度。决定了模型预测的精准视野。 (n_711)"
sub_topics:
  - "联合熵 H(X, Y) 的定义"
  - "条件熵 H(Y|X) 作为给定已知信息后的残余熵"
  - "链式法则：H(X, Y) = H(X) + H(Y|X)"
  - "物理直觉：信息注入导致的搜索空间指数级收缩"
llm_physical_mapping: "mundane physical metaphor: 像是在组装变速箱，第一步选定外壳（X）后，第二步匹配齿轮（Y）的选择范围剧烈缩小（条件熵）。"
code_implementation: |
  import torch
  import numpy as np
  # H(X,Y) = H(X) + H(Y|X)
  H_X = 1.0
  H_Y_given_X = 0.5
  H_XY = H_X + H_Y_given_X
  print('Joint Entropy:', H_XY)
v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy as sp
    h_x, h_y_x, h_xy = sp.symbols('H_x H_y_x H_xy')
    eq = sp.Eq(h_xy, h_x + h_y_x)
    assert eq.subs({h_x: 1.0, h_y_x: 0.5}).rhs == 1.5
