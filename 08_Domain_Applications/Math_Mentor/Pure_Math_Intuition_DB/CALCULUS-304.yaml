id: "CALCULUS-304"
concept_name: "向量场与位势函数 - 位势函数的定义与物理意义 (n_304)"
sub_topics:
  - "势函数 Φ 的求解方法（积分路径法）"
  - "梯度算子 ∇Φ 的物理力向"
  - "势能面与等势线的几何分布"
  - "在神经网络势能图景（Energy Landscape）中的应用"
llm_physical_mapping: "mundane physical metaphor: a topographical map where contour lines show equal heights, and the steepest downward arrows point exactly where a boulder would roll."
code_implementation: |
  import sympy as sp
  x, y = sp.symbols('x y')
  F_x, F_y = 2*x*y, x**2
  phi = sp.integrate(F_x, x) + sp.integrate(F_y - sp.diff(sp.integrate(F_x, x), y), y)
v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy as sp
    x, y = sp.symbols('x y')
    Fx, Fy = 2*x*y, x**2
    phi = sp.integrate(Fx, x)
    assert sp.diff(phi, y) == Fy