code_implementation: |
  import sympy as sp
  x, y = sp.symbols('x y')
  F_x, F_y = 2*x*y, x**2
  phi = sp.integrate(F_x, x) + sp.integrate(F_y - sp.diff(sp.integrate(F_x, x), y), y)
