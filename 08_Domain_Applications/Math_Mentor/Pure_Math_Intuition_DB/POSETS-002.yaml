concept_node:
  id: "POSETS-002"
  name: "哈斯图 (Hasse Diagram)"
  domain: "posets_and_lattices"
  sub_topics:
    - "盖住关系 (Covering relation) 的定义"
    - "哈斯图的绘制规则"
    - "从哈斯图识别偏序性质"
    - "链 (Chain) 与反链 (Antichain) 的可视化"
  llm_physical_mapping: |
    A corporate organizational chart showing only direct reporting lines. A manager "covers" their direct reports. If A reports to B and B reports to C, we don't draw a direct line from A to C (transitivity is implied and thus omitted in the Hasse diagram). Employees on the same level who do not report to each other are incomparable.
  code_implementation: |
    import torch

    def get_covering_relation(relations: torch.Tensor) -> torch.Tensor:
        """
        Derives the Hasse diagram (covering relation) from a Poset boolean tensor.
        relations[i, j] == True means i <= j.
        """
        # Remove reflexivity (i < i is False)
        strict_relations = relations.clone()
        strict_relations.fill_diagonal_(False)
        
        # Transitive paths (length >= 2)
        # Using boolean matrix multiplication simulation
        transitive_paths = torch.matmul(strict_relations.float(), strict_relations.float()) > 0
        
        # Covering relation: strict relation minus the transitive paths
        covering = strict_relations & (~transitive_paths)
        return covering
  v8_sanity_audit:
    sympy_pseudo_code: |
      from sympy.logic.boolalg import And, Not
      from sympy import symbols
      
      # Let S(x, y) represent x < y (strict partial order)
      # Cover(x, y) means y covers x: x < y and no z exists such that x < z < y.
      S_x_y, S_x_z, S_z_y = symbols('S_x_y S_x_z S_z_y')
      
      # For a specific potential intermediate element z:
      # If y covers x, then S(x, y) is true, and it's NOT true that both S(x, z) and S(z, y)
      cover_condition_for_z = And(S_x_y, Not(And(S_x_z, S_z_y)))
