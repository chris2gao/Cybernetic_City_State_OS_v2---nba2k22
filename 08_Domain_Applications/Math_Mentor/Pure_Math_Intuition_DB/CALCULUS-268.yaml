llm_physical_mapping: "mundane physical metaphor: gears in a bicycle. The pedals turn the front gear, which turns the chain, which turns the back gear. The total ratio of wheel spin to pedal spin is the product of the gear ratios (derivatives) at each connection."
code_implementation: |
  import sympy as sp
  x = sp.Symbol('x')
  u = sp.Function('u')(x)
  f = sp.Function('f')(u)
  # Chain rule
  chain_rule = sp.diff(f, x)
v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy as sp
    x = sp.Symbol('x')
    u = sp.Function('u')(x)
    f = sp.Function('f')(u)
    chain_rule = sp.diff(f, x)
    assert chain_rule == sp.Derivative(f, u) * sp.Derivative(u, x)
