id: "LINEAR_ALGEBRA-323"
concept_name: "内积空间 - 大模型映射：Transformer 自注意力机制 (QKᵀ) 的点积本质 (n_323)"
sub_topics:
  - "向量点积作为语义相关性的计算机器"
  - "注意力分数的缩放处理 (Scaled Dot-Product)"
  - "空间投影在查询 (Query) 与键 (Key) 匹配中的作用"
  - "高轴空间中点积分布的统计学特性"
llm_physical_mapping: "spatial deformation/stretching/rotating: The dot product acts as a directional alignment checker in high-dimensional space. Vectors pointing in the same direction yield a large volume shadow (high similarity), acting as spatial 'magnets' that draw related concepts together."
code_implementation: |
  import sympy as sp
  Q = sp.Matrix([[1, 0, 1]])
  K = sp.Matrix([[1, 1, 0], [0, 1, 1], [1, 0, 1]])
  scores = Q * K.T
v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy as sp
    Q = sp.Matrix([[1, 0]])
    K = sp.Matrix([[1, 0], [0, 1]])
    scores = Q * K.T
    assert scores[0, 0] > scores[0, 1], "Alignment should yield higher dot product"
