id: "BRIDGE-007"
concept_name: "线代与解析几何桥梁 - 特征向量、对称矩阵与二次曲面主轴的同构映射"
sub_topics:
  - "线性变换在几何空间中的物理拉伸"
  - "特征向量作为不倒翁主轴"
  - "实对称矩阵对角化与椭球主轴的等价性"
llm_physical_mapping: "拉伸橡胶薄膜上的不倒翁线。在一个拉伸变形的坐标系中，特征向量就是那些“不管怎么拉伸，依然保持在一条直线上”的钢筋骨架，而特征值就是这根钢筋被拉长或压缩的物理倍率。二次曲面的主轴，就是这些钢筋。"
code_implementation: |
  import torch

  # Generate a 3x3 symmetric matrix
  A = torch.randn(3, 3)
  S = A + A.T

  # Extract eigenvectors to show the principal axes
  eigenvalues, eigenvectors = torch.linalg.eigh(S)

  print("Eigenvalues (Principal Stretch Factors):\n", eigenvalues)
  print("Eigenvectors (Principal Axes):\n", eigenvectors)
v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy as sp
    
    # Define a 2x2 symmetric matrix
    A = sp.Matrix([[2, 1], [1, 2]])
    
    # Compute eigenvectors
    eigenvects = A.eigenvects()
    
    # Extract the eigenvectors
    v1 = eigenvects[0][2][0]
    v2 = eigenvects[1][2][0]
    
    # Assert that the eigenvectors are orthogonal (dot product is 0)
    assert sp.simplify(v1.dot(v2)) == 0
