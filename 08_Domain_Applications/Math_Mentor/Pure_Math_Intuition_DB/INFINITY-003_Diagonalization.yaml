id: "INFINITY-003_Diagonalization"
title: "Cantor's Diagonalization Argument"
sub_topics: 
  - "Uncountability"
  - "Self-Reference"
  - "Contradiction"
llm_physical_mapping: |
  Maps to the out-of-vocabulary (OOV) problem in pure Word/Char level tokenization, and the necessity of Byte-level BPE to escape the diagonalization trap. If a model only has a countable set of words, Cantor's diagonalization can always construct a string not in the vocabulary. Byte-level BPE resolves this by shifting the base, ensuring mathematical coverage. It also maps to the rank deficiency in attention heads, where attempting to represent the full continuous semantic space with a discrete basis will always leave "diagonalized" vectors uncaptured.
code_implementation: |
  def forward_diagonalization(matrix: torch.Tensor) -> torch.Tensor:
      # Extract the diagonal of a square matrix
      diagonal = torch.diagonal(matrix)
      # Invert/flip the diagonal to create a vector not matching any row exactly
      new_vector = 1.0 - diagonal 
      return new_vector
v8_sanity_audit:
  sympy_pseudo_code: |
    import torch
    
    def test_cantor_diagonalization():
        # Let rows be existing representations
        matrix = torch.tensor([[0.0, 1.0], [1.0, 0.0]])
        diag = torch.diagonal(matrix) # [0.0, 0.0]
        anti_diag = 1.0 - diag        # [1.0, 1.0]
        
        # The new vector differs from row 0 at col 0, and row 1 at col 1
        assert not torch.equal(anti_diag, matrix[0])
        assert not torch.equal(anti_diag, matrix[1])
