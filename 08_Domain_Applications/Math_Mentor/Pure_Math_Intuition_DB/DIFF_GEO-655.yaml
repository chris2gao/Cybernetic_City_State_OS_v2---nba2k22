formal_definition: >-
  Let M be a smooth manifold and p a point of M. A tangent vector at p is a
  derivation v:C^\infty(M)->R: it is R-linear and satisfies the Leibniz rule
  v(fg)=v(f)g(p)+f(p)v(g). The vector space of all tangent vectors at p is the
  tangent space T_pM. Equivalently, tangent vectors may be represented by
  equivalence classes of smooth curves through p that have the same first-order
  action on smooth functions. The tangent bundle is the disjoint union
  TM = \bigsqcup_{p in M} T_pM, equipped with its standard smooth-manifold
  structure and projection pi:TM->M. A smooth vector field is a smooth section
  X:M->TM satisfying pi o X = id_M. A smooth curve gamma:I->M is an integral
  curve of X when gamma'(t)=X_{gamma(t)}. A local flow of X is a smooth map Phi
  defined on an open subset of R x M such that Phi(0,p)=p and
  Phi(t,Phi(s,p))=Phi(t+s,p) whenever both sides are defined. This node does not
  assume that every vector field is complete or that its flow exists for all
  real time.
formal_definition_zh: >-
  设 M 是光滑流形，p∈M。p 点的切向量可以定义为作用在 C^\infty(M) 上的导子
  v:C^\infty(M)->R：它满足实线性，并满足 Leibniz 法则
  v(fg)=v(f)g(p)+f(p)v(g)。所有这样的导子组成切空间 T_pM。等价地，切向量也可以
  理解为经过 p 的光滑曲线的一阶等价类：两条曲线若对所有光滑函数产生相同的一阶
  变化率，就代表同一个切向量。切丛 TM 是所有点的切空间的并集
  TM = \bigsqcup_{p∈M} T_pM，并带有投影 pi:TM->M。光滑向量场是切丛的光滑截面
  X:M->TM，满足 pi∘X=id_M；即它在流形每一点选择一个属于该点切空间的向量，而且
  这种选择随点光滑变化。曲线 gamma 是 X 的积分曲线，当且仅当
  gamma'(t)=X_{gamma(t)}。局部流 Phi 描述向量场在短时间内产生的连续演化，并满足
  初始恒等性和在定义域允许范围内的局部群性质。本节点不假设向量场一定完备，也不
  假设流能够对所有实数时间全局存在。
