mapping_boundary:
  primary_mapping_kind: "llm_architecture_bounded_structural_analogy"
  primary_mapping: >-
    Treat a model state as a local representation point and a vector field as a
    state-dependent assignment of an infinitesimal update direction. Integral
    curves and local flows then provide a continuous idealization of how those
    local directions compose into short-time representation evolution.
  boundary: >-
    This is a structural analogy only. Transformer layers are discrete maps,
    their latent spaces are not established smooth manifolds, and continuity,
    differentiability, a globally defined vector field, completeness, and a
    global flow are not implied. The formal object remains a smooth vector field
    and its locally defined integral curves and flow.
  preserve_full_boundary: true
  existing_physical_metaphor_status: "secondary_teaser_only"
