code_implementation: |
  import sympy as sp
  z, a, b, c, d = sp.symbols('z a b c d')
  # Mobius transformation
  f = (a*z + b) / (c*z + d)
  # Inverse transformation mapping w back to z
  w = sp.Symbol('w')
  inverse_f = sp.solve(sp.Eq(w, f), z)[0]
