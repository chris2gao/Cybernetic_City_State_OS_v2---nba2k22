id: "PROB_STAT-359"
concept_name: "参数估计 - 点估计理论：矩估计与最大似然估计 (MLE) (n_359)"
sub_topics:
  - "矩估计法：利用样本矩估计总体矩"
  - "最大似然估计 (MLE)：寻找使观测数据出现概率最大的参数"
  - "似然函数的构造与对数化简"
  - "估计量的评选标准：无偏性、有效性、一致性"
llm_physical_mapping: "adjusting the center of gravity of weighted dice to maximize the likelihood of the observed sequence of rolls."
code_implementation: |
  import sympy as sp
  theta = sp.Symbol('theta')
  L = sp.Function('L')(theta)
  log_L = sp.log(L)
  # Maximum Likelihood Estimation
  mle_eq = sp.Eq(sp.diff(log_L, theta), 0)
v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy as sp
    theta = sp.Symbol('theta', positive=True)
    # Likelihood for 2 heads in 3 coin flips
    likelihood = (theta**2) * (1 - theta)
    log_L = sp.log(likelihood)
    derivative = sp.diff(log_L, theta)
    critical_points = sp.solve(derivative, theta)
    assert sp.Rational(2, 3) in critical_points
