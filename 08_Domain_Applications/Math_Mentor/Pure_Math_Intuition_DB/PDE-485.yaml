llm_physical_mapping: "一根两端固定的跳绳在甩动时，其整体形态可以看作是空间上的形状（半个波形）乘以时间上的周期性上下震荡。复杂的时空交织运动被剥离为一个独立的空间形态和一个独立的时间演化模式。"
code_implementation: |
  import torch

  def separation_of_variables(x, t, n=1, L=torch.pi):
      X = torch.sin(n * torch.pi * x / L)
      T = torch.exp(-(n * torch.pi / L)**2 * t)
      u = X * T
      return u
v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy as sp

    x, t, k = sp.symbols('x t k', real=True)
    X = sp.Function('X')(x)
    T = sp.Function('T')(t)
    u = X * T
    u_t = sp.diff(u, t)
    u_xx = sp.diff(u, x, x)
    lhs = sp.simplify(u_t / (k * u))
    rhs = sp.simplify(u_xx / u)
    assert lhs == sp.diff(T, t) / (k * T)
    assert rhs == sp.diff(X, x, x) / X
