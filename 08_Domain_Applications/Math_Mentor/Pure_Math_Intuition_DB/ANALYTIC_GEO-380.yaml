id: "ANALYTIC_GEO-380"
concept_name: "二次曲面 - 空间二次曲面（椭球面、双曲面、马鞍面）的切片法降维认知 (n_380)"
sub_topics:
  - "椭球面方程与三轴长轴"
  - "单叶/双叶双曲面的几何特征"
  - "双曲抛物面（马鞍面）的鞍点直觉"
  - "旋转曲面的生成原理与代数表达"
llm_physical_mapping: "mundane physical metaphor: slicing a Pringles potato chip straight down the middle in different directions. One way you get a smile (parabola facing up), the other way a frown (parabola facing down). This describes a saddle surface."
code_implementation: |
  import sympy as sp
  x, y, z = sp.symbols('x y z')
  # Hyperbolic paraboloid (saddle)
  saddle_eq = sp.Eq(z, y**2 - x**2)
v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy as sp
    
    x, y, z = sp.symbols('x y z')
    
    # Ellipsoid: x^2/a^2 + y^2/b^2 + z^2/c^2 = 1
    ellipsoid = x**2/4 + y**2/9 + z**2/16 - 1
    
    # Slice with z = 0 (xy-plane)
    slice_z0 = ellipsoid.subs(z, 0)
    assert slice_z0 == x**2/4 + y**2/9 - 1
    
    # Slice with x = 0 (yz-plane)
    slice_x0 = ellipsoid.subs(x, 0)
    assert slice_x0 == y**2/9 + z**2/16 - 1
