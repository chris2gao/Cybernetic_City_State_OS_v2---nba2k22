formal_definition: >-
  For a smooth manifold M, let Ω^k(M) be the vector space of smooth
  differential k-forms. The exterior derivative d:Ω^k(M)→Ω^{k+1}(M)
  satisfies d²=0. Define the closed forms Z^k(M)=ker(d:Ω^k→Ω^{k+1}) and
  the exact forms B^k(M)=im(d:Ω^{k-1}→Ω^k). Since d²=0, B^k(M) is a
  subspace of Z^k(M), and the k-th de Rham cohomology group is the quotient
  vector space H^k_dR(M)=Z^k(M)/B^k(M). It records closed forms modulo exact
  forms, not a set-theoretic subtraction. For positive degree k>0, the
  Poincare lemma states that closed k-forms are locally exact on contractible
  coordinate neighborhoods; nonzero positive-degree de Rham classes can
  therefore express global obstructions to choosing a single potential. In
  degree zero, closed 0-forms are locally constant and B^0(M)={0} in the
  standard de Rham complex, so H^0_dR(M) consists of locally constant
  functions and detects connected components. The de Rham theorem identifies
  H^k_dR(M) with singular cohomology with real coefficients. Integration over
  cycles together with Stokes' theorem links differential-form representatives
  to topological invariants. Exact forms are always closed, while closed forms
  need not be globally exact.
formal_definition_zh: >-
  对光滑流形 M，记 Ω^k(M) 为光滑 k-形式组成的向量空间。外微分
  d:Ω^k(M)→Ω^{k+1}(M) 满足 d²=0。定义闭形式空间
  Z^k(M)=ker(d:Ω^k→Ω^{k+1})，恰当形式空间
  B^k(M)=im(d:Ω^{k-1}→Ω^k)。由 d²=0 可知 B^k(M) 是 Z^k(M) 的
  子空间，第 k 个 de Rham 上同调群是商向量空间
  H^k_dR(M)=Z^k(M)/B^k(M)，表示闭形式模去恰当形式，而不是集合意义上的
  “相减”。对于正次数 k>0，Poincare 引理说明在可缩坐标邻域中闭 k-形式局部
  恰当；因此非零正次数 de Rham 类可以表达无法选取单一全局势的全局障碍。在
  零次数，闭 0-形式是局部常值函数，而标准 de Rham 复形中 B^0(M)={0}，故
  H^0_dR(M) 由局部常值函数组成并检测连通分支。de Rham 定理把 H^k_dR(M)
  与实系数奇异上同调同构；形式在闭链上的积分与 Stokes 定理把解析代表和拓扑
  不变量联系起来。恰当形式必闭，但闭形式不必全局恰当。
