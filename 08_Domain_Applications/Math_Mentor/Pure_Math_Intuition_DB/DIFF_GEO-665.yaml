mapping_boundary:
  primary_mapping_kind: "llm_architecture_bounded_structural_analogy"
  primary_mapping: >-
    Only after a smooth representation manifold and a differential-form
    complex have been explicitly defined, de Rham cohomology can analogize
    global constraints invisible in any one local coordinate patch: in
    positive degree, locally exact differential-form data may fail to admit a
    single global potential. Degree zero instead records locally constant
    functions and connected components. The quotient identifies closed
    representatives that differ by an exact form, so the invariant concerns a
    defined complex rather than visual or semantic impressions of holes.
  primary_mapping_zh: >-
    只有在明确定义光滑表示流形及其微分形式复形后，de Rham 上同调才可类比为
    单个局部坐标片看不见的全局约束：在正次数，局部恰当的微分形式数据可能不
    存在统一的全局势；零次数则记录局部常值函数与连通分支。商空间把相差恰当
    形式的闭形式代表视为同一类，因此这里的不变量依赖一个严格定义的复形，而
    不是对“语义空洞”的视觉或语言印象。
  boundary:
    - "Generic loops in latent space are not automatically homology cycles."
    - "Semantic holes are not de Rham classes without a defined manifold, forms, differential, and quotient."
    - "Closed does not mean exact globally; exact does imply closed."
    - "Cohomology is a quotient vector space, not closed forms minus exact forms as set subtraction."
    - "Non-integrable is not a synonym for non-exact without a precise differential-form statement."
    - "For positive degrees, local exactness does not eliminate global cohomology classes; degree zero instead records locally constant functions."
    - "No de Rham complex or cohomology computation for an ordinary model is established by this node."
  preserve_full_boundary: true
  existing_physical_metaphor_status: "secondary_teaser_only"
  secondary_teaser_limitation: >-
    The circulating-dye image may hint at a positive-degree global
    obstruction, but it does not define a manifold, cycle, differential form,
    exterior derivative, exactness, quotient space, or cohomology class.
