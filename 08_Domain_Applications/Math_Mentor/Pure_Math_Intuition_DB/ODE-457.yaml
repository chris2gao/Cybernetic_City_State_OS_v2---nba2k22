llm_physical_mapping: "mundane physical metaphor: gears interlocking perfectly without slipping. Lipschitz continuity guarantees that the 'teeth' of the function don't infinitely spike, so cranking the handle produces exactly one predictable rotation track every time."
code_implementation: |
  import sympy as sp
  x = sp.symbols('x')
  t = sp.symbols('t')
  y_0 = 1
  y_1 = y_0 + sp.integrate(y_0, (t, 0, x))
  y_2 = y_0 + sp.integrate(y_1.subs(x, t), (t, 0, x))
v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy as sp
    x, t = sp.symbols('x t')
    y_0 = 1
    y_1 = y_0 + sp.integrate(y_0, (t, 0, x))
    y_2 = 1 + sp.integrate(y_1.subs(x, t), (t, 0, x))
    assert y_1 == 1 + x
    assert y_2 == 1 + x + x**2/2
