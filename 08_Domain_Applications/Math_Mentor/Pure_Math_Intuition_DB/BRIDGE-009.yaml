id: "BRIDGE-009"
concept_name: "线代与概率桥梁 - 协方差矩阵的正定性与主成分分析(PCA)的几何前奏"
sub_topics:
  - "多元随机变量的协方差表示"
  - "协方差矩阵必为半正定的代数证明"
  - "特征向量作为最大方差方向的主轴"
llm_physical_mapping: "机枪扫射的弹痕云图。协方差矩阵描述的是机枪抖动的方向和幅度。因为能量（方差）总是向外扩散的，所以这个矩阵永远是“正定”或“半正定”的。协方差矩阵的特征向量，就直接指向机枪抖动最剧烈的主轴。"
code_implementation: |
  import torch

  def test_covariance_eigenvalues():
      # Generate random 2D points (the bullet holes)
      num_points = 1000
      mean = torch.tensor([0.0, 0.0])
      
      # Covariance structure (spread)
      # X = Z * A^T where Z ~ N(0, I)
      A = torch.tensor([[2.0, 0.8], [0.8, 1.5]])
      Z = torch.randn(num_points, 2)
      bullet_holes = Z @ A.T + mean

      # Compute the empirical covariance matrix
      centered_points = bullet_holes - bullet_holes.mean(dim=0)
      cov_matrix = (centered_points.T @ centered_points) / (num_points - 1)

      print("Empirical Covariance Matrix:")
      print(cov_matrix)

      # Show its eigenvalues are positive
      eigenvalues, eigenvectors = torch.linalg.eigh(cov_matrix)
      print("\nEigenvalues:")
      print(eigenvalues)
      
      # Assert eigenvalues are non-negative (within floating point error)
      is_positive_semi_definite = torch.all(eigenvalues >= -1e-5).item()
      print("Are all eigenvalues non-negative?", is_positive_semi_definite)

  test_covariance_eigenvalues()
v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy as sp

    # 2x2 covariance matrix parameterized by variances and covariance
    var_x = sp.Symbol('var_x', real=True, positive=True)
    var_y = sp.Symbol('var_y', real=True, positive=True)
    cov_xy = sp.Symbol('cov_xy', real=True)

    C = sp.Matrix([[var_x, cov_xy], [cov_xy, var_y]])

    # Trace and Determinant
    trace = C.trace()
    det = C.det()

    print("Trace:", trace)
    print("Determinant:", det)

    # Calculate eigenvalues algebraically
    # lambda = (trace +/- sqrt(trace^2 - 4*det)) / 2
    lambda_1 = (trace + sp.sqrt(trace**2 - 4*det)) / 2
    lambda_2 = (trace - sp.sqrt(trace**2 - 4*det)) / 2

    # Assert that trace and determinant constraints guarantee the eigenvalues
    # Since var_x > 0 and var_y > 0, trace = var_x + var_y > 0
    # For a valid covariance matrix, determinant = var_x*var_y - cov_xy**2 >= 0
    
    # We assert that the algebraic roots are consistent with trace and determinant
    assert sp.simplify(lambda_1 + lambda_2 - trace) == 0, "Sum of eigenvalues must equal trace"
    assert sp.simplify(lambda_1 * lambda_2 - det) == 0, "Product of eigenvalues must equal determinant"
    
    # If trace > 0 and det >= 0, then:
    # sqrt(trace^2 - 4*det) <= sqrt(trace^2) = trace
    # Therefore, lambda_2 = (trace - sqrt(...)) / 2 >= 0
    # And lambda_1 = (trace + sqrt(...)) / 2 >= 0
    # This guarantees eigenvalues are non-negative.
    print("Verified algebraically: Trace and determinant constraints guarantee non-negative eigenvalues.")
