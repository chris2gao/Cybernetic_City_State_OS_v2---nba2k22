  domain: "proof_methods"
  name: "逆否证明法 (Contrapositive)"
  sub_topics:
    - "逆否命题的等价性原理"
    - "命题结论的否定"
    - "命题条件的否定"
    - "转换后的直接证明过程"
  llm_physical_mapping: "Imagine a club with a strict dress code: 'If you wear sneakers (P), you cannot enter (Q)'. If you see someone inside the club (not Q), you can logically conclude they are not wearing sneakers (not P). Checking people inside to confirm they have no sneakers is the contrapositive approach, which is entirely equivalent to checking that everyone with sneakers is blocked outside."
  code_implementation: |
    import torch

    # Concept: P -> Q is equivalent to ~Q -> ~P
    def implies(p, q):
        # P -> Q is ~P | Q
        return torch.logical_or(torch.logical_not(p), q)

    P = torch.tensor([True, True, False, False])
    Q = torch.tensor([True, False, True, False])

    direct = implies(P, Q)
    contrapositive = implies(torch.logical_not(Q), torch.logical_not(P))

    assert torch.all(direct == contrapositive).item() == True
  v8_sanity_audit:
    sympy_pseudo_code: |
      from sympy.logic.boolalg import Implies, Equivalent
      from sympy.abc import P, Q
      from sympy import simplify_logic

      direct = Implies(P, Q)
      contrapositive = Implies(~Q, ~P)
      
      # The equivalence should simplify to True
      assert simplify_logic(Equivalent(direct, contrapositive)) == True
