code_implementation: |
  import torch

  def classify_pde_2nd_order(A, B, C):
      discriminant = B**2 - 4*A*C
      
      classifications = []
      for d in discriminant.flatten():
          if d > 0:
              classifications.append("Hyperbolic")
          elif d < 0:
              classifications.append("Elliptic")
          else:
              classifications.append("Parabolic")
              
      return classifications
v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy as sp

    A, B, C = sp.symbols('A B C', real=True)
    discriminant = B**2 - 4*A*C

    d_laplace = discriminant.subs({A: 1, B: 0, C: 1})
    assert d_laplace < 0, "Laplace equation is Elliptic"

    d_heat = discriminant.subs({A: 1, B: 0, C: 0})
    assert d_heat == 0, "Heat equation is Parabolic"

    d_wave = discriminant.subs({A: 1, B: 0, C: -1})
    assert d_wave > 0, "Wave equation is Hyperbolic"
