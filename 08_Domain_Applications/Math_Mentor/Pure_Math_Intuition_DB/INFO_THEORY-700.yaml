code_implementation: |
  import torch
  import numpy as np
  
  def shannon_entropy(probs):
      p = np.array(probs)
      return -np.sum(p * np.log2(p + 1e-9))
      
  assert abs(shannon_entropy([0.5, 0.5]) - 1.0) < 1e-8
v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy as sp
    p = sp.Symbol('p', positive=True)
    entropy = -p * sp.log(p, 2) - (1-p) * sp.log(1-p, 2)
    assert sp.simplify(entropy.subs(p, sp.Rational(1, 2)) - 1) == 0
