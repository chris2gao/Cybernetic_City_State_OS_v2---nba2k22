version: "9.1"
id: "TRIG-032"
name: "解三角形进阶 - 海伦公式（已知三边求面积）的代数证明及物理极端情况分析"
type: "concept_node"
domain: "Mathematics"
sub_topics:
  - "半周长 p 的引入"
  - "结合余弦定理与平方差公式推导海伦公式"
  - "极端情况（三边构成退化三角形）的极限行为"
  - "内切圆半径与海伦公式的代数关联"
llm_physical_mapping: "laying three sticks to form an area, flattening them zeroes the area."
code_implementation: >
  import torch

  def herons_formula(a, b, c):
      p = (a + b + c) / 2
      area = torch.sqrt(p * (p - a) * (p - b) * (p - c))
      return area

  a = torch.tensor(3.0)
  b = torch.tensor(4.0)
  c = torch.tensor(5.0)
  print(f"Area: {herons_formula(a, b, c).item()}")
v8_sanity_audit:
  audit_status: "approved"
  sympy_pseudo_code: |
    import sympy as sp

    a, b, c = sp.symbols('a b c', positive=True)
    p = (a + b + c) / 2

    area_sq_heron = p * (p - a) * (p - b) * (p - c)

    cos_C = (a**2 + b**2 - c**2) / (2 * a * b)
    sin_C_sq = 1 - cos_C**2
    area_sq_trig = (sp.Rational(1, 2) * a * b)**2 * sin_C_sq

    diff = sp.simplify(area_sq_heron - area_sq_trig)
    assert diff == 0, f"Area formulations are not equivalent! Diff: {diff}"
