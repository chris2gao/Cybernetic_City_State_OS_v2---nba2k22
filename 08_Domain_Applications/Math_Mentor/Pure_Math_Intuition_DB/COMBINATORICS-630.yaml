code_implementation: |
  import sympy as sp
  y, dt, lmbda = sp.symbols('y dt lmbda')
  y_new = sp.symbols('y_new')
  eq = y_new - y - dt * (-lmbda * y_new)
  sol = sp.solve(eq, y_new)[0]
  print(sol)
