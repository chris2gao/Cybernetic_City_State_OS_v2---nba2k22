concept_name: "曲线/曲面积分 - 第一/第二类曲线积分：沿着曲线的“做功”物理意义 (n_286)"
sub_topics:
  - "第一类曲线积分：对弧长的积分 (质量、长度)"
  - "第二类曲线积分：对坐标的积分 (变力做功)"
  - "两类曲线积分的联系与转化公式"
