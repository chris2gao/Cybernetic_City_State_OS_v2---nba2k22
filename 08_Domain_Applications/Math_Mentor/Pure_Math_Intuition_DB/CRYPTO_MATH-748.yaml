code_implementation: |
  import torch

  def random_oracle(input_tensor, oracle_memory):
      input_tuple = tuple(input_tensor.tolist())
      if input_tuple not in oracle_memory:
          oracle_memory[input_tuple] = torch.randn(1).item()
      return oracle_memory[input_tuple]
