id: "LINEAR_ALGEBRA-318"
concept_name: "线性方程组 - 解的结构（唯一解、无穷多解、无解的几何空间相交直觉） (n_318)"
sub_topics:
  - "齐次方程组的基础解系与通解"
  - "非齐次方程组的特解与导出组通解之和"
  - "几何视角：超平面的相交情况（交点、交线、无交集）"
  - "增广矩阵与系数矩阵秩的关系判定"
llm_physical_mapping: "spatial deformation/stretching/rotating: Visualizing hyperplanes intersecting in space. A unique solution is a single intersection point. Infinite solutions mean the hyperplanes intersect along a line or plane. No solution means the planes are parallel and never intersect in that configuration."
code_implementation: |
  import sympy as sp
  A = sp.Matrix([[1, 2], [2, 4]])
  b = sp.Matrix([3, 6])
  null_space = A.nullspace()
v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy as sp
    A = sp.Matrix([[1, 2], [2, 4]])
    null_space = A.nullspace()
    assert len(null_space) == 1, "There should be one basis vector for the null space"
    assert A * null_space[0] == sp.Matrix([0, 0]), "Null space vector must satisfy homogeneous equation"
