concept_node:
  id: "GEOMETRY-018"
  name: "坐标几何初步 - 发生学溯源：笛卡尔坐标系——代数与几何的伟大桥梁"
  sub_topics:
    - "有序实数对与平面点的双射关系"
    - "坐标轴、原点与象限的代数定义"
    - "数形结合：几何图形转化为代数方程"
    - "坐标平面的平移与对称规律"
  llm_physical_mapping: "Mundane physical metaphor: City blocks and grid addresses. Just as every building in a city grid can be uniquely located by its street and avenue, every point on a plane can be uniquely located by an ordered pair of numbers (x, y) relative to a fixed origin and two intersecting axes."
  code_implementation: |
    import torch

    # Establish a coordinate system using PyTorch meshgrid
    x = torch.linspace(-10, 10, steps=21)
    y = torch.linspace(-10, 10, steps=21)
    grid_y, grid_x = torch.meshgrid(y, x, indexing='ij')

    # Coordinates of all points in the Cartesian grid
    coords = torch.stack([grid_x, grid_y], dim=-1)
  v8_sanity_audit:
    sympy_pseudo_code: |
      import sympy as sp
      from sympy.geometry import Point2D

      # Represent points in a 2D Cartesian coordinate system
      origin = Point2D(0, 0)
      p1 = Point2D(3, 4)
      p2 = Point2D(-1, 2)
      
      # Distance between points
      dist = p1.distance(p2)
