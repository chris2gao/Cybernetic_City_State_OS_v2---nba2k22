id: "ANALYTIC_GEO-375"
concept_name: "直线与平面方程 - 消除奇迹步骤：联立方程求解空间交点、交线与夹角 (n_375)"
sub_topics:
  - "线线、线面、面面夹角的向量计算公式"
  - "联立平面方程求解交线的一般式向参数式转化"
  - "点到平面、点到直线的距离公式推导"
  - "空间几何元素位置关系的代数判定准则"
llm_physical_mapping: "mundane physical metaphor: like looking for the crease where two walls meet (intersection of planes), or checking if a broomstick touches the ceiling (line intersecting a plane). You measure angles using a protractor placed between the surfaces."
code_implementation: |
  import sympy as sp
  plane1 = sp.Plane(sp.Point3D(0, 0, 0), normal_vector=(1, 0, 0))
  plane2 = sp.Plane(sp.Point3D(0, 0, 0), normal_vector=(0, 1, 0))
  intersection_line = plane1.intersection(plane2)[0]
v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy as sp
    
    plane1 = sp.Plane(sp.Point3D(0, 0, 0), normal_vector=(1, 0, 0)) # y-z plane
    plane2 = sp.Plane(sp.Point3D(0, 0, 0), normal_vector=(0, 1, 0)) # x-z plane
    
    intersections = plane1.intersection(plane2)
    assert len(intersections) == 1
    
    intersection_line = intersections[0]
    assert isinstance(intersection_line, sp.Line3D)
    
    # The intersection should be the z-axis
    assert intersection_line.contains(sp.Point3D(0, 0, 1))
    assert intersection_line.contains(sp.Point3D(0, 0, -5))
