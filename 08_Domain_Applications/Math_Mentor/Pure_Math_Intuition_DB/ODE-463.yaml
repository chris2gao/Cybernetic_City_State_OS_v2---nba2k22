llm_physical_mapping: "mundane physical metaphor: Like a surveyor carefully walking a tightening spiral staircase near the center pillar. When standard Cartesian coordinate measuring fails because the curvature becomes too tight, the surveyor switches to radial tape measures (power series with fractional exponents) to safely map the area right up to the pillar."
code_implementation: |
  import sympy as sp
  x, r = sp.symbols('x r')
  n = sp.Symbol('n', integer=True)
  a = sp.Function('a')(n)
  # Frobenius series ansatz
  y_approx = x**r * sum([a*x**i for i in range(3)])
