llm_physical_mapping: "mundane physical metaphor: 像是在运送玻璃杯的箱子里填入发泡胶（冗余校验），当运输车在颠簸路面颠簸（信道噪声）时，确保杯子（信息）不会破碎。"
code_implementation: |
  import torch
  # Simple parity check code (3,1)
  msg = torch.tensor([1])
  encoded = msg.repeat(3)  # Repetition code
  noisy = encoded.clone()
  noisy[0] = 0  # 1 bit flipped
  decoded = 1 if torch.sum(noisy) >= 2 else 0
  print('Decoded:', decoded)
v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy as sp
    # Hamming distance between [1,1,1] and [0,1,1]
    d = sp.Abs(1-0) + sp.Abs(1-1) + sp.Abs(1-1)
    assert d == 1
