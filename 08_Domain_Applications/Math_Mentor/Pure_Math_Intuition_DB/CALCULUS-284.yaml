llm_physical_mapping: "mundane physical metaphor: calculating the total change in volume of a metal block when both temperature (causing expansion) and pressure (causing compression) change simultaneously."
code_implementation: |
  import sympy as sp
  
  x, y, dx, dy = sp.symbols('x y dx dy')
  f = sp.exp(x) * sp.cos(y)
  
  # Total differential dz = (df/dx)*dx + (df/dy)*dy
  df_dx = sp.diff(f, x)
  df_dy = sp.diff(f, y)
  dz = df_dx * dx + df_dy * dy
v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy as sp
    
    x, y, dx, dy = sp.symbols('x y dx dy')
    f = x**2 * y**3
    
    df_dx = sp.diff(f, x)
    df_dy = sp.diff(f, y)
    dz = df_dx * dx + df_dy * dy
    
    assert dz == 2*x*y**3*dx + 3*x**2*y**2*dy
