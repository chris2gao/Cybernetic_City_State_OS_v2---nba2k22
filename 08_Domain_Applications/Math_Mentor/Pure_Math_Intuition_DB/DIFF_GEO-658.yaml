formal_definition: >-
  Let (M,g) be a smooth Riemannian manifold, and let ∇ be the Levi-Civita
  connection of g. Fix the sign convention
  R(X,Y)Z = ∇_X∇_Y Z - ∇_Y∇_X Z - ∇_[X,Y] Z. For smooth vector fields
  X,Y,Z, the map R(X,Y)Z is tensorial in all three inputs and defines a
  (1,3)-tensor field called the Riemann curvature tensor. In a coordinate
  frame, write R(∂_i,∂_j)∂_k = R^l_{kij} ∂_l. With the stated convention,
  R^l_{kij} = ∂_i Γ^l_{jk} - ∂_j Γ^l_{ik}
  + Γ^m_{jk} Γ^l_{im} - Γ^m_{ik} Γ^l_{jm}. Lowering the output index with
  the metric gives the (0,4) curvature tensor
  Rm(X,Y,Z,W) = g(R(X,Y)Z,W). For the Levi-Civita connection it satisfies
  Rm(X,Y,Z,W) = -Rm(Y,X,Z,W),
  Rm(X,Y,Z,W) = -Rm(X,Y,W,Z),
  Rm(X,Y,Z,W) = Rm(Z,W,X,Y), and
  R(X,Y)Z + R(Y,Z)X + R(Z,X)Y = 0, where the last identity is the first
  Bianchi identity in operator form. For a two-dimensional subspace
  σ = span{u,v} in T_pM with linearly independent u,v, the sectional
  curvature is K_p(σ) = g(R(u,v)v,u)
  / (g(u,u)g(v,v)-g(u,v)^2). The Ricci tensor is the metric trace
  Ric(Y,Z) = Σ_a g(R(e_a,Y)Z,e_a) for any local orthonormal frame {e_a},
  and the scalar curvature is Scal = tr_g(Ric) = Σ_a Ric(e_a,e_a). A
  Riemannian manifold has constant sectional curvature K when
  R(X,Y)Z = K(g(Y,Z)X-g(X,Z)Y) under the chosen sign convention.
  Hyperbolic n-space is the complete simply connected Riemannian n-manifold
  of constant sectional curvature -1; other negative constants arise by
  rescaling the metric. Curvature is intrinsic. It measures the
  noncommutativity of covariant differentiation and the infinitesimal failure
  of parallel transport around small loops to return a vector unchanged. A
  finite-loop displacement is not literally equal to a curvature tensor
  without specifying the connection, loop, limiting procedure, and area-order
  approximation. The opposite sign convention for R is also common. Every
  component, sectional-curvature, Ricci, and scalar-curvature formula in this
  node must be interpreted relative to the convention stated above.
formal_definition_zh: >-
  设 (M,g) 是光滑 Riemannian 流形，∇ 是 g 唯一确定的 Levi-Civita 联络。
  本节点固定符号约定 R(X,Y)Z = ∇_X∇_Y Z - ∇_Y∇_X Z - ∇_[X,Y] Z。
  对光滑向量场 X、Y、Z，R(X,Y)Z 对三个输入都是张量性的，因此定义一个
  (1,3) 型张量场，称为 Riemann 曲率张量。在坐标标架中写作
  R(∂_i,∂_j)∂_k = R^l_{kij} ∂_l。按照上述符号约定，
  R^l_{kij} = ∂_i Γ^l_{jk} - ∂_j Γ^l_{ik}
  + Γ^m_{jk} Γ^l_{im} - Γ^m_{ik} Γ^l_{jm}。用度量把输出指标降下来，得到
  (0,4) 型曲率张量 Rm(X,Y,Z,W)=g(R(X,Y)Z,W)。对 Levi-Civita 联络，
  它满足前两个指标反对称、后两个指标反对称、成对交换对称以及第一 Bianchi 恒等式。
  对点 p 处由线性无关向量 u、v 张成的二维平面 σ，截面曲率定义为
  K_p(σ)=g(R(u,v)v,u)/(g(u,u)g(v,v)-g(u,v)^2)。Ricci 曲率是曲率张量的
  度量迹：若 {e_a} 是局部正交归一标架，则
  Ric(Y,Z)=Σ_a g(R(e_a,Y)Z,e_a)。标量曲率是 Ricci 张量再次取度量迹：
  Scal=tr_g(Ric)=Σ_a Ric(e_a,e_a)。当所有二维切平面的截面曲率都等于常数 K
  时，流形具有常截面曲率，并满足 R(X,Y)Z=K(g(Y,Z)X-g(X,Z)Y)。双曲 n 维
  空间是截面曲率恒为 -1 的完备、单连通 Riemannian n 维流形；其他负常数可以
  通过缩放度量得到。曲率是内蕴量。它刻画协变微分的不交换性，也刻画向量沿足够小的
  闭合回路平行移动后产生的无穷小偏差。有限回路的错位不能在未说明联络、回路、极限
  过程和面积阶近似时直接等同于曲率张量。文献中也常使用相反的曲率符号约定。因此，
  本节点的分量、截面曲率、Ricci 曲率和标量曲率必须统一服从本定义开头声明的符号约定。
