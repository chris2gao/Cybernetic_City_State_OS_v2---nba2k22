mapping_boundary:
  primary_mapping_kind: "llm_architecture_bounded_structural_analogy"
  primary_mapping: >-
    Treat a model representation as a point in a hypothetical smooth state
    space only after a metric and connection have been explicitly supplied.
    Curvature can then serve as an analogy for second-order local geometry:
    infinitesimal transports in two directions need not commute, and local path
    behavior can depend on the two-plane in which a perturbation evolves.
    In an explicitly designed hyperbolic representation space, constant
    negative curvature can provide large representational volume and can embed
    tree-like hierarchical data with low distortion. This is a property of the
    chosen mathematical representation model, not proof that ordinary LLM
    hidden states intrinsically form a negatively curved Riemannian manifold.
  primary_mapping_zh: >-
    只有在明确给出光滑状态空间、度量和联络之后，才可以把模型表示状态类比为
    几何空间中的点。此时，曲率可作为二阶局部几何的类比：沿两个无穷小方向
    依次运输，结果可能不交换；局部路径行为也可能依赖所处的二维切平面。
    对人为设计的双曲表示空间，负常曲率可以提供快速增长的表示体积，并能以较低
    失真表达树状层级数据。这是所选数学表示模型的性质，不是普通 LLM 隐状态天然
    具有负 Riemannian 曲率的证据。
  boundary:
    - "This is a bounded structural analogy only."
    - "No ordinary LLM latent or semantic space is established here as a smooth Riemannian manifold."
    - "No verified LLM Levi-Civita connection, parallel transport or curvature tensor is assumed."
    - "A matrix called curvature_matrix is not a curvature tensor merely because it is antisymmetric or rotates a vector."
    - "Attention matrices, Jacobians, Hessians, covariance matrices, Fisher matrices, commutators and residual updates are not automatically Riemann curvature tensors."
    - "Curvature is intrinsic and must not be identified with visible bending in an embedding diagram or with extrinsic curvature."
    - "Finite-loop transport mismatch is not literally equal to curvature without an infinitesimal-loop limit and an identified connection."
    - "Negative curvature does not automatically imply that learned representations encode a hierarchy."
    - "A Poincare-ball or hyperboloid implementation is an explicitly chosen representation geometry, not evidence about the intrinsic geometry of all language or all hidden states."
    - "The existence of a model or paper named HELM does not establish that ordinary LLM semantic spaces are universally hyperbolic or negatively curved."
    - "Sectional curvature is attached to a two-plane and a metric denominator; it is not an arbitrary scalar assigned to one point or one vector."
    - "Ricci and scalar curvature are contractions of the Riemann tensor, not interchangeable generic summary scores."
    - "Curvature sign conventions differ across references and must be declared before comparing signs or formulas."
    - "Negative or nonpositive curvature alone does not justify unrestricted claims about global geodesic divergence, uniqueness or completeness; global hypotheses matter."
    - "High curvature is not established as a cause, predictor or calibrated measure of LLM hallucination."
    - "The formula h = alpha * kappa^beta in DIFF_GEO-659 is an unvalidated downstream hypothesis and must not be treated as a mathematical law."
    - "Curvature regularization is not established here as a general hallucination-control mechanism."
    - "Semantic density, logical tension, internal stress and path fracture remain metaphors unless a separate measurable model is supplied."
    - "No machine-verifiable geometric model of an LLM is established by this node."
  preserve_full_boundary: true
  existing_physical_metaphor_status: "secondary_teaser_only"
existing_code_and_audit:
  preserve: true
  evidence_status: "semantic_only"
  code_interpretation: >-
    The existing function performs an arbitrary 2x2 matrix-vector product. The
    chosen matrix is antisymmetric and resembles an infinitesimal planar
    rotation generator, but it is not constructed from a connection, its
    derivatives, a Lie bracket, or a Riemannian metric. It therefore does not
    compute or validate a Riemann curvature tensor.
  audit_interpretation: >-
    The audit checks R_abcd - R_abcd == 0, which is a tautology. Despite the
    comment, it does not test the antisymmetry relation obtained by swapping two
    tensor indices, and it does not test any Bianchi identity, contraction,
    sectional curvature, Ricci curvature or scalar curvature.
  code_scope: "arbitrary_antisymmetric_matrix_vector_product_only"
  audit_scope: "tautological_self_subtraction_only"
  explicitly_not_validated:
