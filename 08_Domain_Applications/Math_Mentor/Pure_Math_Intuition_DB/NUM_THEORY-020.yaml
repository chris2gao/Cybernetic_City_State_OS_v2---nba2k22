id: "NUM_THEORY-020"
name: "欧几里得算法（辗转相除法） - 裴蜀定理作为所有线性同余方程可解的底层钥匙"
category: "Number Theory"
sub_topics:
  - "线性同余方程 ax ≡ b (mod m) 的转化"
  - "解存在的充要条件：gcd(a,m) | b"
  - "通过特解推导通解"
  - "与二元一次不定方程的等价性"
core_intuition: "裴蜀定理表明，任何形式为 ax + my = b 的不定方程有整数解的充要条件是 gcd(a,m) 整除 b。由于线性同余方程 ax ≡ b (mod m) 等价于存在整数 y 使得 ax = my + b（即 ax - my = b），线性同余方程是否可解，完全取决于裴蜀定理。"
llm_physical_mapping: "Imagine a gear system where a driving gear with `a` teeth interacts with a driven wheel with `m` slots. We want to know if a specific tooth on the driving gear can ever hit a specific slot `b` on the wheel. Due to the cyclic nature of the rotation, the driving tooth will only ever land in slots that are multiples of the greatest common divisor (GCD) of `a` and `m`. Therefore, the tooth `a` hits the specific slot `b` on wheel `m` only if their GCD perfectly divides `b`."
code_implementation: |
  import torch
  
  def solve_linear_congruence(a: int, b: int, m: int) -> torch.Tensor:
      """
      Solve ax = b (mod m) using extended Euclidean algorithm principles
      implemented via PyTorch. Returns all solutions modulo m.
      """
      def ext_gcd(val_a, val_b):
          if val_a == 0:
              return val_b, 0, 1
          gcd, x1, y1 = ext_gcd(val_b % val_a, val_a)
          x = y1 - (val_b // val_a) * x1
          y = x1
          return gcd, x, y
          
      gcd, x_inv, _ = ext_gcd(a, m)
      
      if b % gcd != 0:
          return torch.tensor([], dtype=torch.long)
          
      # Particular solution
      x0 = (x_inv * (b // gcd)) % m
      
      # General solutions: x = x0 + k * (m / gcd)
      step = m // gcd
      solutions = [(x0 + k * step) % m for k in range(gcd)]
      solutions.sort()
      
      return torch.tensor(solutions, dtype=torch.long)
v8_sanity_audit:
  sympy_pseudo_code: |
    from sympy import gcd, gcdex
    from sympy.ntheory.modular import solve_congruence
    
    def test_linear_congruence():
        a, b, m = 14, 30, 100
        
        # Check if solution exists using Bezout's identity
        g = gcd(a, m)
        assert b % g == 0
        
        # Reduce the equation to a'x = b' (mod m')
        a_prime = a // g
        b_prime = b // g
        m_prime = m // g
        
        # Find inverse of a' modulo m'
        x_inv, y, g2 = gcdex(a_prime, m_prime)
        assert g2 == 1
        
        # Find target remainder for x
        target_remainder = (b_prime * x_inv) % m_prime
        
        # Use solve_congruence to verify x = target_remainder (mod m_prime)
        sol, mod = solve_congruence((target_remainder, m_prime))
        assert sol == target_remainder
        assert mod == m_prime
        
        # Map back to find all solutions modulo m
        solutions = sorted([(sol + k * mod) % m for k in range(g)])
        
        for s in solutions:
            assert (a * s) % m == b % m
            
    test_linear_congruence()
