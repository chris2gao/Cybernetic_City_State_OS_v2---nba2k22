concept_name: "计数原理 - 组合 (Combination)：通过除以 k! 消除顺序造成的冗余，推导组合数公式 (n_235)"
sub_topics:
  - "无序抽取的等价类划分"
  - "从排列向组合的商空间映射"
  - "组合数公式 C(n,k) 的导出"
  - "组合恒等式（对称性、吸收律）"
llm_physical_mapping: "mundane physical metaphor: throwing ingredients into a soup pot; the order in which they are added doesn't matter, so we divide out the number of ways they could have been sequenced."
code_implementation: |
  import math
  
  def combination(n, k):
      # C(n,k) = P(n,k) / k! = n! / (k! * (n-k)!)
      if k > n:
          return 0
      return math.factorial(n) // (math.factorial(k) * math.factorial(n - k))
v8_sanity_audit:
  sympy_pseudo_code: |
    import math
    def C(n, k):
        return math.factorial(n) // (math.factorial(k) * math.factorial(n-k))
    assert C(5, 3) == 10
    assert C(5, 2) == C(5, 3)
