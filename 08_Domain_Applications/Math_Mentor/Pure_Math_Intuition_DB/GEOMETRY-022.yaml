concept_node:
  id: "GEOMETRY-022"
  title: "向量初步 - 发生学溯源：为了同时描述物理力的大小与方向而发明的“带箭头的线段” (n_142)"
  sub_topics:
    - "向量的定义：大小与方向的结合"
    - "向量的几何表示：有向线段的起点与终点"
    - "向量的模（长度）概念"
    - "零向量与单位向量的定义"
    - "向量在力学与位移中的物理原型"
  llm_physical_mapping: |
    Imagine the wind blowing outside. It doesn't just blow with a certain strength (magnitude), but it also blows in a specific direction (e.g., North-East). An arrow shot from a bow is another example: the speed at which it travels and the exact target it points towards. Vectors were invented precisely to capture these two pieces of information—magnitude and direction—simultaneously in a single mathematical object, a "line segment with an arrow."
  code_implementation: |
    import torch
    
    # Representing a vector (1D tensor)
    # The components [x, y] inherently encode both magnitude and direction
    vector = torch.tensor([3.0, 4.0])
    
    # Calculate magnitude (length)
    magnitude = torch.norm(vector)
    
    # Calculate direction (unit vector)
    direction = vector / magnitude
    
    print(f"Vector: {vector}")
    print(f"Magnitude: {magnitude.item()}")
    print(f"Direction (Unit Vector): {direction}")
  v8_sanity_audit:
    sympy_pseudo_code: |
      import sympy as sp
      from sympy.physics.vector import ReferenceFrame
      
      # 1. Using sympy.Matrix to represent a vector
      v = sp.Matrix([3, 4])
      magnitude_matrix = v.norm()
      
      # 2. Using sympy.physics.vector for formal physical vectors
      N = ReferenceFrame('N')
      v_phys = 3*N.x + 4*N.y
      magnitude_phys = v_phys.magnitude()
