code_implementation: |
  import torch
  # Pruning low perplexity (highly predictable) tokens
  logits = torch.randn(1, 10, 5000)
  probs = torch.softmax(logits, dim=-1)
  entropy = -torch.sum(probs * torch.log(probs + 1e-9), dim=-1)
  # Keep tokens with entropy > threshold
  keep_mask = entropy > 5.0
  print('Tokens kept:', keep_mask.sum().item())
