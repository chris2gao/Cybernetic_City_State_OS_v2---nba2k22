id: "BRIDGE-003"
concept_name: "几何与三角的内在统一 - 余弦定理作为非正交坐标系下勾股定理的坍缩 (L2 ↔ L2)"
sub_topics:
  - "直角三角形到任意三角形的几何自由度扩展"
  - "余弦定理的几何代数证明 (向量点积前身)"
  - "cos(90°) = 0 导致交叉项湮灭，退化为勾股定理的物理过程"
llm_physical_mapping: "mundane physical metaphor: a wooden door swinging open. The width of the door (a) and the frame (b) are fixed. The gap between the door edge and frame (c) strictly depends on the angle of the hinge. At exactly 90 degrees, it forms a perfect Pythagorean hypotenuse."
code_implementation: |
  import sympy as sp
  a, b, theta = sp.symbols('a b theta')
  # Law of Cosines
  c_squared = a**2 + b**2 - 2*a*b*sp.cos(theta)
  # Collapse to Pythagoras at 90 degrees (pi/2)
  pythagoras = c_squared.subs(theta, sp.pi/2)
v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy as sp
    a, b, theta = sp.symbols('a b theta', real=True, positive=True)
    c_squared = a**2 + b**2 - 2*a*b*sp.cos(theta)
    
    # Check 90 degree collapse
    assert sp.simplify(c_squared.subs(theta, sp.pi/2) - (a**2 + b**2)) == 0
    
    # Check 0 degree (flat line, c = |a - b|)
    flat = c_squared.subs(theta, 0)
    assert sp.simplify(flat - (a - b)**2) == 0
