code_implementation: |
  import torch

  def method_of_characteristics_sim(x, t, a=1.0):
      u_xt = torch.exp(-(x - a*t)**2)
      return u_xt
v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy as sp

    x, t, a = sp.symbols('x t a', real=True)
    f = sp.Function('f')
    u = f(x - a*t)
    u_t = sp.diff(u, t)
    u_x = sp.diff(u, x)
    pde_val = sp.simplify(u_t + a*u_x)
    assert pde_val == 0, 'Method of characteristics failed for advection equation'
