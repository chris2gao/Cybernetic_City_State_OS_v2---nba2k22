code_implementation: |-
  import torch

  def forward_diffusion_noise(x_0, T, dt=0.01):
      steps = int(T / dt)
      x_t = x_0.clone()
      
      for _ in range(steps):
          dW = torch.randn_like(x_t) * torch.sqrt(torch.tensor(dt))
          x_t = x_t + dW
          
      return x_t.var().item()
