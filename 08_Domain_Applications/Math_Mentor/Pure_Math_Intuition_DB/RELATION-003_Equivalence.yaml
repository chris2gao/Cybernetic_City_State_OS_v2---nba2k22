concept_node:
  id: RELATION-003
  title: Equivalence Relations and Classes (等价关系与等价类)
  metadata:
    topic: Relations
    version: '9.1'
  llm_physical_mapping: 'Connect equivalence classes to K-Means clusters with 0 inner
    distance, or connected components in a graph where all nodes in a component are
    fully connected.

    '
  code_implementation: "import torch\n\ndef find_equivalence_classes(adj_matrix: torch.Tensor)\
    \ -> list:\n    # adj_matrix is a boolean tensor of shape (N, N)\n    # Assuming\
    \ adj_matrix represents a valid equivalence relation \n    # (reflexive, symmetric,\
    \ transitive)\n    # Identical rows belong to the same equivalence class\n   \
    \ unique_rows, inverse_indices = torch.unique(adj_matrix, dim=0, return_inverse=True)\n\
    \    \n    classes = []\n    for i in range(unique_rows.size(0)):\n        # Find\
    \ all elements belonging to the i-th unique row\n        class_elements = torch.where(inverse_indices\
    \ == i)[0].tolist()\n        classes.append(class_elements)\n        \n    return\
    \ classes\n"
  v8_sanity_audit:
    sympy_pseudo_code: "from sympy import FiniteSet, S as sympy_S\n\n# Define a set\n\
      S = FiniteSet(0, 1, 2, 3, 4, 5, 6, 7, 8)\n\n# Define the equivalence relation\
      \ x == y (mod 3)\ndef is_equivalent(x, y):\n    return (x - y) % 3 == 0\n  \
      \  \n# Find equivalence classes\nclasses = []\nelements_processed = set()\n\n\
      for x in S:\n    if x not in elements_processed:\n        # Create a new class\n\
      \        eq_class = FiniteSet(*[y for y in S if is_equivalent(x, y)])\n    \
      \    classes.append(eq_class)\n        # Mark elements as processed\n      \
      \  elements_processed.update(eq_class)\n        \n# Ensure that the classes\
      \ partition the original set\nunion_of_classes = FiniteSet(*[elem for eq_class\
      \ in classes for elem in eq_class])\n\n# 1. Union covers the whole set\nassert\
      \ union_of_classes == S\n\n# 2. Classes are mutually disjoint\nfor i in range(len(classes)):\n\
      \    for j in range(i + 1, len(classes)):\n        assert classes[i].intersect(classes[j])\
      \ == sympy_S.EmptySet\n"
  sub_topics:
  - 集合划分的定义与要求
  - 由等价关系诱导的划分
  - 由划分定义的等价关系
  - 等价关系与划分之间的一一对应定理
