  title: "三角形（全等/相似） - 相似比与面积比/体积比的平方/立方关系 (n_129)"
  sub_topics:
    - "长度比等于相似比 k"
    - "面积比等于 k²"
    - "体积比等于 k³"
    - "物理学中的平方/立方定律（表面积与体积的失调导致生物体型的限制）"
  llm_physical_mapping: "Think of scaling up a toy model into a real building. If you scale its length by a factor of k, you need k^2 times the paint to cover its surface (area), and k^3 times the concrete to fill it (volume). This explains why a mouse can survive a fall but an elephant cannot, due to the square-cube law."
  code_implementation: |
    import torch

    # Define a 2D scaling matrix
    k = 3.0
    scaling_matrix = torch.tensor([[k, 0.0],
                                   [0.0, k]])
    
    # Area scaling is the determinant of the 2D transformation matrix
    area_scale = torch.det(scaling_matrix)
    print(f"Scaling factor k = {k}, Area scaling (det) = {area_scale.item()} (k^2 = {k**2})")

    # Define a 3D scaling matrix
    scaling_matrix_3d = torch.tensor([[k, 0.0, 0.0],
                                      [0.0, k, 0.0],
                                      [0.0, 0.0, k]])
    volume_scale = torch.det(scaling_matrix_3d)
    print(f"Scaling factor k = {k}, Volume scaling (det) = {volume_scale.item()} (k^3 = {k**3})")
  v8_sanity_audit:
    sympy_pseudo_code: |
      import sympy as sp

      # Define symbols
      x, y, k = sp.symbols('x y k', positive=True)

      # Area of a right triangle (as an example: 1/2 * base * height)
      A_base = 1/2 * x * y
      
      # Scaled triangle
      x_scaled = k * x
      y_scaled = k * y
      A_scaled = 1/2 * x_scaled * y_scaled
      
      # Verify Area scaling A(kx) = k^2 * A(x)
      print(f"A(kx) = k^2 A(x) is {sp.simplify(A_scaled - k**2 * A_base) == 0}")
