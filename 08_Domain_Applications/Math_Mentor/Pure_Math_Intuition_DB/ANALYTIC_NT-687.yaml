mode_a_intuition:
  occurrence_crisis: |-
    Arithmetic residue classes are discrete, yet the analytic object must
    preserve a precisely declared multiplicative pattern while s moves in the
    complex plane.
  primary: |-
    Treat chi as a declared periodic multiplicative channel selector. It
    assigns zero to forbidden non-unit residue classes and a fixed sign or
    phase to unit classes before the weights n^{-s} are aggregated. The
    selector is fixed by arithmetic structure, not learned from data.
  low_friction_example: |-
    Modulo four, chi4 suppresses even integers, assigns +1 to numbers congruent
    to 1, and -1 to numbers congruent to 3. At s=2 the surviving terms form
    the alternating odd reciprocal-square partial sums used by the audit.
  limitations:
    - "A Dirichlet character is not an arbitrary mask, feature gate, or learned attention weight."
    - "The channel picture does not prove convergence, an Euler product, or analytic continuation."
    - "No ordinary LLM representation is established as a Dirichlet character or L-function."

