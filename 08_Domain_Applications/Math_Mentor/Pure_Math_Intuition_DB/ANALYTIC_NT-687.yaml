pure_math_definition:
  english: |-
    Let q>=1 be an integer. A Dirichlet character modulo q is a periodic
    arithmetic function chi:Z->C such that chi(n+q)=chi(n),
    chi(mn)=chi(m)chi(n), and chi(n)=0 whenever gcd(n,q)>1. Its restriction
    to the unit group (Z/qZ)^x is a group character. The principal character
    is 1 on units and 0 on non-units.

    For s=sigma+it with sigma>1, the associated Dirichlet L-function is

      L(s,chi)=sum_{n=1}^infinity chi(n)n^{-s}
              =product_p (1-chi(p)p^{-s})^{-1}.

    The series and Euler product are understood in this half-plane of
    absolute convergence. The principal character has a meromorphic
    continuation with a simple pole at s=1. For a nonprincipal Dirichlet
    character, L(s,chi) extends to an entire function.

    When chi is primitive of conductor q, let a in {0,1} be defined by
    chi(-1)=(-1)^a. Under one declared standard normalization,

      Lambda(s,chi)=(q/pi)^((s+a)/2) Gamma((s+a)/2)L(s,chi)
      Lambda(s,chi)=epsilon(chi)Lambda(1-s,conjugate(chi)),

    where |epsilon(chi)|=1. An imprimitive character must instead be related
    to its inducing primitive character through the appropriate finite Euler
    factors. Conductor, parity, gamma factor, root number, and normalization
    conventions must be declared before formulas or special values are
    compared. This node does not define general L-functions.
  chinese: |-
    设 q>=1 为整数。模 q 的 Dirichlet 特征是周期算术函数 chi:Z->C，满足
    chi(n+q)=chi(n)、完全乘法性 chi(mn)=chi(m)chi(n)，并在
    gcd(n,q)>1 时取零；限制到单位群 (Z/qZ)^x 后，它是群特征。主特征在
    单位上取 1，在非单位上取 0。

    对 s=sigma+it 且 sigma>1，定义

      L(s,chi)=sum_{n>=1} chi(n)n^{-s}
              =product_p (1-chi(p)p^{-s})^{-1}。

    级数和 Euler 乘积均只在这一绝对收敛半平面内直接使用。主特征的解析
    延拓在 s=1 有单极点；非主 Dirichlet 特征的 L-函数可延拓为整函数。
    对 conductor 为 q 的 primitive character，先由 chi(-1)=(-1)^a 声明
    parity a，再明确 conductor、gamma factor、root number 与归一化约定，
    才能陈述 completed L-function 的标准函数方程。imprimitive character
    必须通过诱导它的 primitive character 与相应有限 Euler 因子处理。
    本节点不代表一般 L-函数理论。
  finite_chi4_example: |-
    The declared example is chi4(n)=0 for even n, 1 for n congruent to 1
    modulo 4, and -1 for n congruent to 3 modulo 4. At s=2 its finite
    N-term sum is sum_{n=0}^{N-1}(-1)^n/(2n+1)^2. The durable audit compares
    one declared finite partial sum with a declared Catalan-constant value
    using an explicit alternating-series remainder budget; it does not prove
    analytic continuation or an infinite-series theorem.

assumptions_and_notation:
  - "q is a positive integer and s=sigma+it is complex."
  - "For n>=1, n^{-s}=exp(-s log n) uses the real logarithm log n."
  - "A Dirichlet character is periodic and completely multiplicative, and is extended by zero on non-units modulo q."
  - "The Dirichlet series and Euler product are asserted directly only for Re(s)>1."
  - "Principal/nonprincipal and primitive/imprimitive are different classifications."
  - "Functional-equation and special-value comparisons require declared conductor, parity, gamma-factor, root-number, and normalization conventions."

