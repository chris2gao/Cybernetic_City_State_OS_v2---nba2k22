    - "Nonvanishing at s=1 is a theorem, not a finite-sum observation."
    - "A finite chi4 audit proves no claim about general Dirichlet characters or generic L-functions."

common_misconceptions:
  - "Every periodic arithmetic function is a Dirichlet character."
  - "The zero-on-non-units rule may be omitted."
  - "Complete multiplicativity is the same as additivity."
  - "Every Dirichlet character is primitive."
  - "Principal and nonprincipal characters have the same behavior at s=1."
  - "The initial series or Euler product may be used unchanged for Re(s)<=1."
  - "Entire continuation means the function has no zeros or is nonzero at s=1."
  - "The primitive functional equation applies unchanged to imprimitive characters."
  - "A finite Catalan approximation proves the infinite identity or analytic continuation."
  - "This node covers Artin, automorphic, Hasse-Weil, Langlands, or general L-functions."

