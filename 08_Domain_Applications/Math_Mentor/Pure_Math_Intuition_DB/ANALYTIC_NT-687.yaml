code_implementation: |
  import math

  def chi4(n):
      residue = n % 4
      if residue in (0, 2):
          return 0
      return 1 if residue == 1 else -1

  def catalan_partial_sum(term_count):
      return math.fsum(
          (1.0 if n % 2 == 0 else -1.0) / ((2*n + 1)**2)
          for n in range(term_count)
      )

v8_sanity_audit:
  status: "run_with_log"
  execution_claim: "bounded_finite_audit_only"
  script_ref: ".ai/PROGRAM_RUNS/math-mentor-analytic-nt-foundation-batch-1-0001/AUDITS/ANALYTIC_NT-687.py"
  audit_scope: "finite_chi4_character_properties_and_declared_Catalan_partial_sum"
  tested_properties:
    - "twelve declared chi4 values including negative, zero, unit, and non-unit cases"
    - "zero-on-non-units and unit magnitude for n=-64 through 64"
    - "periodicity for 129 declared finite inputs"
    - "complete multiplicativity on the 65 by 65 grid [-32,32]^2"
    - "the four multiplication pairs in the unit group modulo four"
    - "four exact rational partial sums"
    - "the N=10000 Catalan partial sum against a declared remainder and floating-point budget"
  explicitly_not_validated:
    - "arbitrary_Dirichlet_characters_or_moduli"
    - "properties_outside_declared_finite_ranges"
    - "infinite_series_identity_without_declared_error_bound"
    - "Euler_product_theorem"
    - "analytic_continuation"
    - "functional_equation"
    - "zero_distribution_or_zero_free_regions"
    - "nonvanishing_at_one"
    - "Dirichlet_theorem_or_primes_in_arithmetic_progressions"
    - "generic_L_functions"
  sympy_pseudo_code: |
    import math

    def chi4(n):
        r = n % 4
        return 0 if r in (0, 2) else (1 if r == 1 else -1)

    assert all(chi4(n + 4) == chi4(n) for n in range(-64, 65))
    assert all(
        chi4(m*n) == chi4(m)*chi4(n)
        for m in range(-32, 33)
        for n in range(-32, 33)
    )
    N = 10000
    partial = math.fsum(
        (1.0 if n % 2 == 0 else -1.0) / ((2*n + 1)**2)
        for n in range(N)
    )
    declared = 0.915965594177219
    tolerance = 1.0 / ((2*N + 1)**2) + 1e-12
    assert abs(partial - declared) <= tolerance

