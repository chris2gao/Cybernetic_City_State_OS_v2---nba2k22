concept_name: "相平面 - 隐去时间参数，在几何平面上绘制系统所有可能轨迹的“流场图 (Vector Field)” (n_453)"
sub_topics:
  - "相轨迹方程的导出 dy/dx = Q(x,y)/P(x,y)"
  - "等斜线法绘制流场"
  - "相轨线的拓扑结构（闭轨、极限环）"
  - "物理直觉：系统状态演化的全局全景图"
llm_physical_mapping: "mundane physical metaphor: visualizing wind currents or ocean eddies carrying a floating leaf. By removing the ticking clock, we simply look at the fixed arrows of force driving the leaf at every coordinate."
code_implementation: |
  import sympy as sp
  x, y = sp.symbols('x y')
  P = x - y
  Q = x + y
  trajectory_eq = sp.Eq(sp.Derivative(y, x), Q / P)
v8_sanity_audit:
