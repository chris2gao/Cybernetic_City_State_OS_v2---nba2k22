llm_physical_mapping: "mundane physical metaphor: Like the curve formed by the overlapping beams of a car's headlights on a curved road barrier. Each individual light ray is a straight line (general solution), but together they form a sharply defined, bright curved edge (caustic/envelope) that isn't a single light ray itself, but the tangent boundary of all of them."
code_implementation: |
  import sympy as sp
  x, c = sp.symbols('x c')
  y = c*x - c**2
  # Differentiating with respect to parameter c to find envelope
  envelope_eq = sp.diff(y, c)
v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy as sp
    x, c = sp.symbols('x c')
    y_family = c*x - c**2
    c_val = sp.solve(sp.diff(y_family, c), c)[0]
    envelope = y_family.subs(c, c_val)
    assert envelope == x**2 / 4
