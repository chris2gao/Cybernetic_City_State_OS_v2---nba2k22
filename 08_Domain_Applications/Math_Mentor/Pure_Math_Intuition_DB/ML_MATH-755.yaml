concept_name: "变分推断 - 消除奇迹步骤：当潜变量后验分布无法计算时，构造简单分布 q(z) 极大化证据下界（ELBO）以强行逼近。将高维积分降维打击为优化问题。 (n_755)"
sub_topics:
  - "KL 散度作为分布逼近的度量"
  - "均值场假设 (Mean-field approximation)"
  - "重参数化技巧（Reparameterization trick）"
  - "物理直觉：将复杂的概率寻找问题转化为平滑的能量泛函寻优"
llm_physical_mapping: "A mechanical stamping press trying to mold a highly complex, rugged metal sheet (intractable posterior). Instead of calculating the exact contours, the machine uses a flexible, parameterized template sheet (q(z)) and turns a tightening screw (optimizing ELBO) to physically force the template to mold as closely as possible to the target shape."
code_implementation: |
  import torch
  
  def compute_elbo(mu_q, logvar_q, z, log_p_x_given_z):
      # KL divergence analytically for Gaussian q(z) and standard normal p(z)
      kl_div = -0.5 * torch.sum(1 + logvar_q - mu_q**2 - torch.exp(logvar_q))
      
      # Evidence Lower Bound
      elbo = log_p_x_given_z - kl_div
      return elbo
      
  # Reparameterization trick
  mu = torch.tensor([0.0])
  logvar = torch.tensor([0.0])
  eps = torch.randn_like(mu)
  z = mu + torch.exp(0.5 * logvar) * eps
v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy as sp
    
    mu, sigma = sp.symbols('mu sigma', positive=True)
    # KL divergence between N(mu, sigma^2) and N(0, 1)
    kl = sp.log(1/sigma) + (sigma**2 + mu**2)/2 - sp.Rational(1, 2)
    
    # If q equals p, kl should be 0
    assert sp.simplify(kl.subs({mu: 0, sigma: 1})) == 0
