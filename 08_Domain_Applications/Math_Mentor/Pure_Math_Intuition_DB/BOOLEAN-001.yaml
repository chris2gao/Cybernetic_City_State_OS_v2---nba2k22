  name: "布尔代数基础 - 布尔代数的公理系统（Huntington公理）"
  domain: "boolean_algebra"
  sub_topics:
    - "基本运算（加法、乘法、求补）"
    - "交换律、分配律、恒等元"
    - "互补律"
    - "与经典命题逻辑和集合论的对应"
  description: >
    布尔代数是一个数学系统，由一个集合、两个二元运算（通常表示为加法 + / OR 和乘法 · / AND）以及一个一元运算（求补 ' / NOT）组成。Huntington公理体系是其中最经典的一套公理化定义。它规定了运算的封闭性、交换律、分配律、恒等元的存在性以及互补律。这个代数系统不仅是命题逻辑的形式化基础，也完美同构于集合论中的并、交、补运算，并且是现代计算机数字电路的理论基石。
  llm_physical_mapping: |
    可以将布尔代数想象成一套控制水流的**管道开关系统**（Mundane physical metaphor）。
    集合元素是开关的状态（开或关）。
    - 乘法（AND）：两个开关串联。只有当两个开关都闭合（1）时，水流才能通过。
    - 加法（OR）：两个开关并联。只要有一个开关闭合（1），水流就能通过。
    - 求补（NOT）：一个反向联动的阀门。正常开关开启时它关闭，正常开关关闭时它开启。
    Huntington公理就是在说明这些物理管道连接方式的等价规则：
    比如分配律 A AND (B OR C) = (A AND B) OR (A AND C)：
    串联一个主开关A，然后接上并联的B和C，等效于：先让A分别与B、C串联，然后把这两条路并联起来。水流通断的结果在物理上是完全一致的。
  code_implementation: |
    # PyTorch boolean simulation for Huntington Postulates verification
    import torch

    def verify_huntington_postulates():
        # Define the set B = {0, 1} as tensors
        B = torch.tensor([False, True])
        
        # Create all possible combinations for A, B, C
        # Using broadcasting to create a truth table
        x = B.view(-1, 1, 1)
        y = B.view(1, -1, 1)
        z = B.view(1, 1, -1)
        
        # 1. Commutativity (交换律)
        comm_add = torch.all((x | y) == (y | x))
        comm_mul = torch.all((x & y) == (y & x))
        
        # 2. Distributivity (分配律)
        dist_add_over_mul = torch.all((x | (y & z)) == ((x | y) & (x | z)))
        dist_mul_over_add = torch.all((x & (y | z)) == ((x & y) | (x & z)))
        
        # 3. Identity (恒等元)
        # Identity for + (OR) is 0 (False)
        # Identity for * (AND) is 1 (True)
        id_add = torch.all((x | torch.tensor(False)) == x)
        id_mul = torch.all((x & torch.tensor(True)) == x)
        
        # 4. Complements (互补律)
        # For every x, there exists x' (~x) such that:
        # x + x' = 1  and  x * x' = 0
        comp_add = torch.all((x | ~x) == torch.tensor(True))
        comp_mul = torch.all((x & ~x) == torch.tensor(False))
        
        return {
            "commutativity": (comm_add.item(), comm_mul.item()),
            "distributivity": (dist_add_over_mul.item(), dist_mul_over_add.item()),
            "identity": (id_add.item(), id_mul.item()),
            "complements": (comp_add.item(), comp_mul.item())
        }

    print(verify_huntington_postulates())
  v8_sanity_audit:
    sympy_pseudo_code: |
      from sympy import symbols
      from sympy.logic.boolalg import And, Or, Not, simplify_logic

      # Define boolean variables
      A, B, C = symbols('A B C')
      
      # Distributivity of Or over And
      expr1 = Or(A, And(B, C))
      expr2 = And(Or(A, B), Or(A, C))
      
      # Check equivalence
      is_distributive = simplify_logic(expr1) == simplify_logic(expr2)
      
      # Complement laws
      # A Or Not(A) == True
      comp_or = simplify_logic(Or(A, Not(A))) # Evaluates to True
      
      # A And Not(A) == False
      comp_and = simplify_logic(And(A, Not(A))) # Evaluates to False
      
      print(f"Distributivity Holds: {is_distributive}")
      print(f"A OR NOT A = {comp_or}")
      print(f"A AND NOT A = {comp_and}")
