name: "随机微分方程 - 【终极 AI 映射】：连续流匹配（Flow Matching）的绝对法则，将 SDE 降维近似为概率流 ODE 实现稳定生成。 (n_563)"
concept_physical_metaphor: "A tangled, noisy highway of countless cars erratically changing lanes (SDE) is observed from high above and replaced by a smooth, mathematically identical deterministic fluid flow of traffic (ODE) that transports the same amount of cars to the same destination without the microscopic jitter."
