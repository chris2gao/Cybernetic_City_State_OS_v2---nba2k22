code_implementation: |-
  import torch

  def probability_flow_ode_vs_sde(x_t, score_xt, dt=0.01):
      dw = torch.randn_like(x_t) * (dt**0.5)
      sde_step = -score_xt * dt + dw
      
      ode_step = -0.5 * score_xt * dt
      
      return sde_step.var().item(), ode_step.var().item()
v8_sanity_audit:
  sympy_pseudo_code: |-
    import sympy as sp
    
    p = sp.Function('p')(sp.Symbol('x'), sp.Symbol('t'))
    x, t, g = sp.symbols('x t g')
    
    score = p.diff(x) / p
    drift_sde = 0
    diff_sde_sq = g**2
    
    FP_sde = -sp.diff(drift_sde * p, x) + sp.Rational(1, 2) * sp.diff(diff_sde_sq * p, x, x)
    
    drift_ode = -sp.Rational(1, 2) * g**2 * score
    diff_ode_sq = 0
    
    FP_ode = -sp.diff(drift_ode * p, x)
    
    assert sp.simplify(FP_sde - FP_ode) == 0, "Fokker-Planck densities do not match"
