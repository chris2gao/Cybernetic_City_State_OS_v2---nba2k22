id: "CALCULUS-271"
concept_name: "积分（定积分/不定积分） - 发生学溯源：阿基米德“穷竭法”与不规则面积/体积计算的工程极限场景 (n_271)"
sub_topics:
  - "穷竭法：通过多边形逼近曲边形面积"
  - "抛物线弓形面积的求和证明"
  - "无穷小量的几何直观累加"
  - "积分作为求和极限的早期思想萌芽"
llm_physical_mapping: "mundane physical metaphor: measuring the area of an irregular pool by covering it with identical square tiles. First use large tiles, then use smaller and smaller tiles to fill the curved edges. The true area is the limit of the tile sum."
code_implementation: |
  import sympy as sp
  # Method of exhaustion using rectangles
  x, n, i = sp.symbols('x n i')
  f = x**2
  # Sum of areas of rectangles from 0 to 1
  dx = 1 / n
  x_i = i * dx
  area_sum = sp.Sum(f.subs(x, x_i) * dx, (i, 1, n))
  exact_area = sp.limit(area_sum, n, sp.oo)
v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy as sp
    x, n, i = sp.symbols('x n i')
    f = x**2
    dx = 1 / n
    x_i = i * dx
    area_sum = sp.Sum(f.subs(x, x_i) * dx, (i, 1, n)).doit()
    exact_area = sp.limit(area_sum, n, sp.oo)
    assert sp.Rational(1, 3) == exact_area
