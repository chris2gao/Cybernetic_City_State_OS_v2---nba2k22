    import torch
    seq_len = 4
    mask = torch.triu(torch.ones(seq_len, seq_len) * float('-inf'), diagonal=1)
    scores = torch.randn(4, 4)
    masked_scores = scores + mask
    assert masked_scores[0, 3] == float('-inf')
    assert masked_scores[3, 0] != float('-inf')
