id: "CARDINALS-005"
title: "Cofinality and Regular Cardinals"
sub_topics:
  - "Definition of Cofinality (cf)"
  - "Singular vs Regular Cardinals"
  - "Koenig's Theorem"
llm_physical_mapping: "Maps to the self-attention causal masking matrix. A regular cardinal cannot be reached by a smaller number of smaller steps, much like a causally masked sequence strictly regulates that token T_i cannot access information beyond its own index, maintaining a strict ordered hierarchy without collapsing into a smaller dependency basis."
code_implementation: |
  import torch
  import torch.nn as nn

  class CofinalityMask(nn.Module):
      def __init__(self, seq_len):
          super().__init__()
          # Causal mask enforces regular strict sequence
          mask = torch.triu(torch.ones(seq_len, seq_len) * float('-inf'), diagonal=1)
          self.register_buffer('mask', mask)

      def forward(self, attn_scores):
          # Apply causal hierarchy
          return attn_scores + self.mask[:attn_scores.size(-2), :attn_scores.size(-1)]
