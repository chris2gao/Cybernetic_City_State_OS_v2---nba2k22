llm_physical_mapping: "mundane physical metaphor: Like a physical gear system that suddenly jams because two gear teeth lock against each other, causing the mechanical stress (derivative) to spike to infinity. The standard predictable turning equations fail at this precise locking point, breaking the smooth mechanical transmission."
code_implementation: |
  import sympy as sp
  x = sp.Symbol('x')
  y = sp.Function('y')(x)
  # Equation with a singularity at x=0
  eq = sp.Eq(x**2 * y.diff(x, 2) + x * y.diff(x) + (x**2 - 1) * y, 0)
v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy as sp
    x = sp.Symbol('x')
    eq = x**2 * sp.Function('y')(x).diff(x, 2)
    # Check coefficient of highest derivative
    coeff = eq.coeff(sp.Function('y')(x).diff(x, 2))
    assert coeff.subs(x, 0) == 0
