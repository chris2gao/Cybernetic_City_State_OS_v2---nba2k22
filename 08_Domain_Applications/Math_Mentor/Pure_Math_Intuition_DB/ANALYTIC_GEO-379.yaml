llm_physical_mapping: "mundane physical metaphor: tracking a bug walking on a spinning bicycle tire. It moves forward with the bike while also spinning in a circle, so its path over time (t) makes a series of bouncing arches."
code_implementation: |
  import sympy as sp
  t, r = sp.symbols('t r')
  # Cycloid parameterization
  x = r * (t - sp.sin(t))
  y = r * (1 - sp.cos(t))
  dx_dt = sp.diff(x, t)
  dy_dt = sp.diff(y, t)
v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy as sp
    
    t = sp.Symbol('t')
    # Parametric circle
    x = sp.cos(t)
    y = sp.sin(t)
    
    # Eliminate parameter to get standard equation
    eq = sp.simplify(x**2 + y**2)
    assert eq == 1
    
    # Derivative dy/dx = (dy/dt) / (dx/dt)
    dy_dt = sp.diff(y, t)
    dx_dt = sp.diff(x, t)
    dy_dx = dy_dt / dx_dt
    
    assert sp.simplify(dy_dx - (-sp.cos(t)/sp.sin(t))) == 0
