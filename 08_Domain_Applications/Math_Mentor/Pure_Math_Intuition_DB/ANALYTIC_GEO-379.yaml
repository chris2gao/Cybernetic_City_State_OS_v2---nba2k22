concept_name: "参数方程 - 动力学视角：将参数 t 视为时间，轨迹视为质点的运动 (n_379)"
sub_topics:
  - "参数方程消除参数向普通方程转化的技巧"
  - "摆线 (Cycloid) 的物理模型与参数方程推导"
