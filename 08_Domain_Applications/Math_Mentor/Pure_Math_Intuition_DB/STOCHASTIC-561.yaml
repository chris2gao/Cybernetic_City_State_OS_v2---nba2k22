  - "在处理非定常动力系统微扰中的计算精度保障"
code_implementation: |-
  import torch

  def second_order_correction(T=1.0, dt=1e-4):
      steps = int(T / dt)
      dW = torch.randn(steps) * torch.sqrt(torch.tensor(dt))
      W = torch.cumsum(dW, dim=0)
      
      f_T = torch.exp(W[-1])
      
      f_t = torch.tensor(1.0)
      for i in range(steps):
          f_t += f_t * dW[i] + 0.5 * f_t * dt
          
      return torch.abs(f_T - f_t).item()
