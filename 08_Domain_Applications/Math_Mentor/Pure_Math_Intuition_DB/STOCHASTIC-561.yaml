name: "Itô积分 - 物理意义：随机噪音的二次方不再是无穷小，而是结实的时间增量，重塑了随机微积分的链式法则。 (n_561)"
concept_physical_metaphor: "A pneumatic drill vibrating rapidly against concrete. The macroscopic penetration depth depends not just on the steady downward push (dt), but intrinsically on the squared amplitude of the rapid vibrations ((dW_t)^2), acting as a steady, reliable force over time."
sub_topics:
