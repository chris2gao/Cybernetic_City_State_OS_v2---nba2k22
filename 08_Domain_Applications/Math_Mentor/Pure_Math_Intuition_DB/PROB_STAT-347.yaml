id: "PROB_STAT-347"
concept_name: "条件概率 - 条件概率的严格定义与独立性概念 (n_347)"
sub_topics:
  - "条件概率的乘法公式 P(AB) = P(A)P(B|A)"
  - "独立性的代数定义：P(AB) = P(A)P(B)"
  - "两两独立与相互独立的区别"
  - "条件独立性及其在概率图模型中的枢纽作用"
llm_physical_mapping: "mundane physical metaphor: two independent weighted dice. Rolling a 6 on the first die does not change the physical weighting or the outcome likelihood of rolling a 6 on the second die, keeping their chip distribution products separate."
code_implementation: |
  import sympy as sp
  from sympy.stats import Die, P
  
  X = Die('X', 6)
  Y = Die('Y', 6)
  
  # Independence check
  P_X2 = P(sp.Eq(X, 2))
  P_Y3 = P(sp.Eq(Y, 3))
  P_X2_and_Y3 = P(sp.And(sp.Eq(X, 2), sp.Eq(Y, 3)))
v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy as sp
    from sympy.stats import Die, P
    
    X = Die('X', 6)
    Y = Die('Y', 6)
    
    # P(XY) = P(X)P(Y) for independent events
    p_x = P(sp.Eq(X, 2))
    p_y = P(sp.Eq(Y, 3))
    p_xy = P(sp.And(sp.Eq(X, 2), sp.Eq(Y, 3)))
    
    assert p_xy == p_x * p_y
    
    # Multiplicative formula P(AB) = P(A)P(B|A)
    # Since X, Y independent, P(Y|X) = P(Y)
    p_y_given_x = P(sp.Eq(Y, 3), sp.Eq(X, 2))
    assert p_xy == p_x * p_y_given_x
