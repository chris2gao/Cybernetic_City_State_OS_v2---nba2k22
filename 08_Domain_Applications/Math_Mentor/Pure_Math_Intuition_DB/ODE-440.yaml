v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy as sp
    x = sp.Symbol('x')
    y = sp.Function('y')(x)
    n = sp.Symbol('n')
    v = y**(1-n)
    dv_dx = sp.diff(v, x)
    assert sp.simplify(dv_dx - (1 - n)*y**(-n)*sp.Derivative(y, x)) == 0
