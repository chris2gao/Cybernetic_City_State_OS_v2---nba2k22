concept_node:
  id: "GEOMETRY-023"
  title: "向量初步 - 向量的几何加减法（三角形法则与平行四边形法则）"
  sub_topics:
    - "向量加法的三角形法则（首尾相接）"
    - "向量加法的平行四边形法则（共起点）"
    - "向量减法的几何意义：指向被减数"
    - "向量加法的交换律与结合律几何解释"
  llm_physical_mapping: "Mundane physical metaphor: walking north then east (triangle rule, tail-to-head) vs. walking diagonally across a park. If two forces pull on an object at the same time, the result is the diagonal of the parallelogram they form (parallelogram rule, common origin)."
  code_implementation: |-
    import torch
    # PyTorch tensor addition A + B
    A = torch.tensor([3.0, 0.0])
    B = torch.tensor([0.0, 4.0])
    C = A + B
  v8_sanity_audit:
    sympy_pseudo_code: |-
      import sympy as sp
      A = sp.Matrix([3, 0])
      B = sp.Matrix([0, 4])
      C = A + B
