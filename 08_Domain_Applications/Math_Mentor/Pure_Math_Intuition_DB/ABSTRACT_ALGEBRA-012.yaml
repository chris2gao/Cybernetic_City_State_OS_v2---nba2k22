id: ABSTRACT_ALGEBRA-012
title: "Galois Theory"
sub_topics:
  - "Field Extensions"
  - "Splitting Fields"
  - "Galois Groups"
  - "Solvability by Radicals"
llm_physical_mapping: "Temperature Scaling and Root Finding Analogy. Tuning the temperature $T$ reshapes the polynomial root distribution of the Softmax logits. Low temperature collapses the field into a deterministic prime field (argmax), while high temperature expands it, simulating a splitting field of diverse probabilistic solutions."
code_implementation: "PyTorch Temperature Scaling applied to logits."
v8_sanity_audit:
  sympy_pseudo_code: |
    import torch
    
    logits = torch.tensor([1.0, 5.0, 1.2])
    
    # Deterministic limit (T -> 0)
    T_low = 0.01
    probs_low = torch.softmax(logits / T_low, dim=-1)
    
    # Uniform expansion (T -> inf)
    T_high = 100.0
    probs_high = torch.softmax(logits / T_high, dim=-1)
    
    assert torch.argmax(probs_low) == 1
    assert probs_low[1] > 0.99
    assert torch.abs(probs_high[0] - probs_high[1]) < 0.1
