concept_name: "置信区间 - 参数估计的不确定性区间度量 (n_371)"
sub_topics:
  - "置信水平 (1-α) 的概率意义"
  - "枢轴量法构造置信区间"
  - "正态总体均值与方差的置信区间"
  - "区间长度与样本容量、显著性水平的关系"
llm_physical_mapping: "Consider throwing weighted dice onto a large grid. The confidence interval is like throwing a net: 95% of the time you throw this net based on your bullet hole map, it successfully captures the true center of the actual chip distribution."
code_implementation: |
  import sympy as sp
  mu, sigma, n, x_bar, z_alpha_2 = sp.symbols('mu sigma n x_bar z_alpha_2')
  # Margin of error for a normal distribution's mean
  margin_of_error = z_alpha_2 * (sigma / sp.sqrt(n))
  # Confidence interval
  lower_bound = x_bar - margin_of_error
  upper_bound = x_bar + margin_of_error
v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy as sp
    sigma, n, x_bar, z_alpha_2 = sp.symbols('sigma n x_bar z_alpha_2')
    margin_of_error = z_alpha_2 * (sigma / sp.sqrt(n))
    width = 2 * margin_of_error
    width_1 = width.subs({n: 100})
    width_2 = width.subs({n: 400})
    assert width_2 == width_1 / 2
