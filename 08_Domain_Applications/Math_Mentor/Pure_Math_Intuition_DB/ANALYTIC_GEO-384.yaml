id: "ANALYTIC_GEO-384"
concept_name: "点线面距离公式 - 利用向量投影与法向量进行距离计算的严格推导 (n_384)"
sub_topics:
  - "点到直线的距离向量公式（利用外积或投影）"
  - "线线距离的向量模型"
  - "公式推导中的初等几何与向量代数对比"
  - "距离公式在计算几何算法中的稳健性分析"
llm_physical_mapping: "mundane physical metaphor: Picture a taut zipline (a line) and a bird (a point) flying nearby. The shortest distance to the wire isn't found by walking along the wire, but by using the area of a hypothetical parallelogram formed by the bird and the wire, divided by the wire's length—like using the area of a slanted sail to find its perpendicular height."
code_implementation: |
  import sympy as sp
  
  def point_line_distance(point, line_point, line_dir):
      p = sp.Matrix(point)
      p0 = sp.Matrix(line_point)
      d = sp.Matrix(line_dir)
      
      vec = p - p0
      cross_prod = vec.cross(d)
      distance = cross_prod.norm() / d.norm()
      return distance
v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy as sp
    
    p = sp.Matrix([0, 5, 0])
    p0 = sp.Matrix([0, 0, 0])
    d = sp.Matrix([1, 0, 0])
    
    vec = p - p0
    distance = vec.cross(d).norm() / d.norm()
    assert distance == 5
