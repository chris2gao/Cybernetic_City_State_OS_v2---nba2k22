llm_physical_mapping: "mundane physical metaphor: like a radar screen. Instead of moving right and up (Cartesian), the radar sweeps an angle (theta) and reports the distance (rho) to the object."
code_implementation: |
  import sympy as sp
  rho, theta = sp.symbols('rho theta')
  x = rho * sp.cos(theta)
  y = rho * sp.sin(theta)
v8_sanity_audit:
  sympy_pseudo_code: |
    import sympy as sp
    
    r, theta = 5, sp.pi/4
    
    x = r * sp.cos(theta)
    y = r * sp.sin(theta)
    
    assert sp.simplify(x) == 5 * sp.sqrt(2) / 2
    assert sp.simplify(y) == 5 * sp.sqrt(2) / 2
    
    # Back to polar
    rho_sq = x**2 + y**2
    assert sp.simplify(rho_sq) == 25
